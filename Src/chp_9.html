.stat b{display:block;font:700 1.35rem var(--display);font-variant-numeric:tabular-nums}
.stat span{font:.7rem var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}

.fc .a{border-left:3px solid var(--accent);padding:4px 0 4px 14px;font-size:1.05rem}

textarea{min-height:9rem;resize:vertical}
.blank{font:inherit;display:inline-block;vertical-align:baseline;border:0;border-bottom:2px solid var(--accent);background:var(--mask);color:var(--fg);padding:0 .3em;border-radius:3px 3px 0 0;cursor:pointer;line-height:1.35}
.blank:not(.on) .ans{visibility:hidden}

.note p{font-size:1.04rem;line-height:2}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px}

tr:last-child td{border-bottom:0}
td{min-width:9rem}
.m.hid{background:var(--mask);color:transparent;border-radius:4px;cursor:pointer;display:inline-block;user-select:none}
.m{display:inline}
.opt{display:block;width:100%;text-align:left;font:inherit;padding:12px 14px;border-radius:8px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer}
.opt.right{border-color:var(--accent);background:var(--accent-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opts{display:flex;flex-direction:column;gap:8px}
.fb{padding:12px 14px;border-radius:8px;font-size:.95rem}
.fb.ok{background:var(--accent-soft)}.fb.no{background:var(--bad-soft)}
.tag{font:500 .7rem var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:4px;background:var(--accent-soft);color:var(--fg)}
.pts{display:flex;flex-direction:column;gap:6px}
.pts label{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.pts input{margin-top:.3rem;accent-color:var(--accent)}
.score{font:700 3rem var(--display);font-variant-numeric:tabular-nums}
.tcount{display:flex;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:8px}
.tcount label{flex:1;display:flex;gap:10px;align-items:center;cursor:pointer;min-width:0}
.tcount input{accent-color:var(--accent);width:1.1rem;height:1.1rem}
.tcount span.n{font:.78rem var(--mono);color:var(--muted);white-space:nowrap}
.rev{border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:6px}
.rev.bad{border-left:4px solid var(--bad)}.rev.ok{border-left:4px solid var(--accent)}
.rev .r{font-size:.9rem;color:var(--muted)}

/* ---- Code lab ---- */
:root{--code-bg:#fbfaf6;--code-fg:#1b2a22;--code-line:#d5ddd6;--ok-b:#0a6a4d;--ok-s:#dcefe6;--note-b:#9a4a08;--note-s:#f6e6d4}

:root[data-theme="dark"]{--code-bg:#0a100d;--code-fg:#d8efe3;--code-line:#26342c;--ok-b:#5fd7a8;--ok-s:#17382b;--note-b:#f0a15a;--note-s:#3a2a17}

.cw{display:flex;flex-direction:column;gap:8px;min-width:0}

.btn.sm{padding:6px 12px;font-size:.85rem}

.codearea{width:100%;resize:vertical;min-height:5rem}
.outpre{white-space:pre-wrap;border-left:4px solid var(--accent)}
.outbox{display:flex;flex-direction:column;gap:8px;min-width:0}
.dim{color:var(--muted)}
.cw-in{display:flex;flex-direction:column;gap:4px}
.cin,input.mono{font-family:var(--mono)}
.rs{padding:10px 14px;border-radius:8px;font-size:.93rem;border-left:4px solid var(--line);background:var(--bg)}
.rs.ok{border-color:var(--ok-b);background:var(--ok-s)}
.rs.bad{border-color:var(--bad);background:var(--bad-soft)}
.rs.note,.rs.warn{border-color:var(--note-b);background:var(--note-s)}
.try{border:1px dashed var(--accent);border-radius:8px;padding:8px 12px;font-size:.93rem}
.note-box{background:var(--accent-soft);border-radius:8px;padding:10px 14px;font-size:.93rem}
ol.pipe{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0}
ol.pipe li{position:relative;padding:8px 12px 8px 34px;border-left:2px solid var(--line);margin-left:10px;font-size:.93rem}
ol.pipe li::before{content:"";position:absolute;left:-8px;top:12px;width:14px;height:14px;border-radius:50%;background:var(--bg);border:2px solid var(--line)}
ol.pipe li.done::before{background:var(--accent);border-color:var(--accent)}
ol.pipe li.cur{background:var(--accent-soft)}ol.pipe li.cur::before{border-color:var(--accent);background:var(--surface)}
ol.pipe li.fail{background:var(--bad-soft)}ol.pipe li.fail::before{background:var(--bad);border-color:var(--bad)}
ol.pipe li.warn{background:var(--note-s)}ol.pipe li.warn::before{background:var(--note-b);border-color:var(--note-b)}
ol.pipe li.pending{color:var(--muted)}
.bits{display:flex;flex-direction:column;gap:6px}
.brow{display:grid;grid-template-columns:5.5rem 1fr auto;gap:10px;align-items:center}
.brow.res{border-top:1px solid var(--line);padding-top:6px;font-weight:600}
.bl{font:.78rem var(--mono);color:var(--muted)}
.bv{display:flex;gap:2px;flex-wrap:wrap}
.bit{width:1.55rem;height:1.7rem;display:inline-flex;align-items:center;justify-content:center;font:500 .85rem var(--mono);border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--muted)}

.bd{font:.85rem var(--mono)}
.b-s{color:var(--bad)}.b-e{color:var(--note-b)}.b-m{color:var(--accent)}

ol.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
ol.steps li{display:flex;flex-direction:column;gap:2px;padding:8px 12px;border:1px solid var(--line);border-radius:8px}
.exp{font-family:var(--mono);font-size:.92rem}.exp.res{color:var(--accent);font-weight:600}
.exp mark{background:var(--accent-soft);color:var(--fg);border-radius:3px;padding:0 3px;outline:1.5px solid var(--accent)}
ul.rules{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
ul.rules li{padding:6px 10px;border-radius:6px;font-size:.92rem}
ul.rules li.ok{background:var(--ok-s)}ul.rules li.no{background:var(--bad-soft)}
input.tcell{width:100%;min-width:4rem;font:.9rem var(--mono);padding:6px 8px}

input.tcell.miss{border-color:var(--bad);background:var(--bad-soft)}
.nb .cw{margin-top:4px}
.nb ol.pipe{margin-top:4px}

const NOTES=[
["1.1 Spreadsheet software","{{Spreadsheet software}} is application software that organises data in a grid of cells and lets any cell hold a fixed value or a {{formula}} that recalculates {{automatically}} when the cells it depends on change. This separates it from a table in a word processor. The first electronic spreadsheet, {{VisiCalc}}, was created in {{1979}} by Dan {{Bricklin}} and Bob {{Frankston}} for the {{Apple II}} and was the first {{killer app}}. It was followed by {{Lotus 1-2-3}} and {{Excel}}. Apache OpenOffice {{Calc}} is free and open source, saves in {{.ods}} and reads and writes .xls and .xlsx."],
["1.2 The Calc interface","The {{Formula Bar}} sits above the grid and has no counterpart in Writer. Its left part is the {{Name Box}}, which shows the active cell's address and can be used to {{navigate}}; its right part is the {{Input Line}}, which shows the raw content, that is the {{formula}} rather than its result. A {{workbook}} is the whole file; a {{worksheet}} is one grid within it, reached by a {{sheet tab}}. A {{cell reference}} such as B3 is column letter then row number; a {{range}} such as A1:C5 has 3 x 5 = {{15}} cells. The menu bar of OpenOffice Calc is File, Edit, View, Insert, Format, Tools, {{Data}}, Window, Help."],
["1.3 Data types and entry","Calc has three data types: {{numbers}}, which are right-aligned; {{text}}, which is left-aligned and is forced for a number by a leading {{apostrophe}}; and {{formulas}}, which must begin with {{=}}. {{Enter}} confirms and moves down, {{Tab}} moves right and {{Escape}} cancels. {{F2}} enters edit mode on an existing cell."],
["1.4 Formulas and functions","Precedence is {{^}} first, then {{* and /}}, then {{+ and -}}, left to right, with {{parentheses}} overriding. So =2+3*4 gives {{14}} and =(2+3)*4 gives {{20}}. {{SUM}} totals numbers, {{AVERAGE}} gives the mean, {{MIN}} and {{MAX}} give extremes, {{COUNT}} counts numeric cells, {{COUNTA}} counts non-empty cells and {{COUNTBLANK}} counts empty ones. {{IF}}(test, value_if_true, value_if_false) chooses between two results. The Function Wizard is opened with Insert, Function or {{Ctrl+F2}}."],
["1.5 Cell references","A {{relative}} reference such as A1 shifts when copied. An {{absolute}} reference such as {{$A$1}} stays fixed, which a shared {{tax rate}} needs. A {{mixed}} reference fixes only the column ($A1) or only the row (A$1). Pressing {{Shift+F4}} in OpenOffice Calc (F4 in Excel and in the textbook) cycles A1, $A$1, A$1, $A1."],
["1.6 Sorting and filtering","{{Sorting}} rearranges rows by up to {{three}} criteria through Data, Sort; the {{Then By}} field breaks ties. {{Filtering}} only {{hides}} rows and never changes the data; it is reached through Data, {{Filter}}. {{AutoFilter}} adds dropdown arrows to column headers; {{Standard Filter}} uses comparison operators with {{AND}}/{{OR}}; {{Advanced Filter}} takes criteria from a separate area of the sheet. Row numbers of visible rows turn {{blue}} while a filter is active."],
["1.7 Data validation","{{Data validation}} (Data, {{Validity}}) restricts what can be typed. Its tabs are {{Criteria}}, Input Message and {{Error Alert}}. The Allow dropdown includes whole numbers, decimal, date, time, text length and {{List}}. A {{Warning}} lets invalid data be entered after acknowledgement; a {{Stop}} prevents it."],
["1.8 Charts","A {{column}} chart compares categories; a {{bar}} chart does the same horizontally and suits long labels; a {{line}} chart shows a {{trend}} over time; a {{pie}} chart shows proportions of a whole with five or fewer categories; an {{area}} chart emphasises cumulative volume; an {{XY (scatter)}} chart shows correlation. The Chart Wizard (Insert, {{Chart}}) has four steps: Chart Type, Data {{Range}}, Data {{Series}} and Chart {{Elements}}."],
["1.9 Printing","Print Preview (File, {{Page Preview}} in OpenOffice) shows the pagination. Page Style (Format, {{Page}}) has the Sheet tab with Print Order, grid lines, headers and zero values, and {{Scale to Fit}}. A {{print range}} is defined through Format, Print Ranges, {{Define}}. {{Rows to Repeat}}, set through Format, Print Ranges, {{Edit}}, reprints a header row on every printed page; freezing a row is a view-only feature."]
];

const CORE=[
[0,"Define spreadsheet software.","Application software that organises data into a grid of cells, addressed by row and column, in which any cell can hold a fixed value or a formula referencing other cells, with every dependent cell recalculating automatically when an underlying value changes."],
[0,"What separates a spreadsheet from a table in a word processor?","The formula and automatic recalculation: a cell's value can be derived from other cells and updates when they change. Both have rows and columns, so that alone is not the answer."],
[0,"How were financial calculations done before electronic spreadsheets?","On paper ledger sheets ruled into rows and columns, by hand with pencil, eraser and mechanical adding machine; changing one assumption meant recalculating and rewriting every dependent figure, which could take a working day."],
[0,"Who created VisiCalc, when, and for which computer?","Dan Bricklin and Bob Frankston, in 1979, for the Apple II; Bricklin had the idea watching a professor correct a financial table on a blackboard at Harvard Business School."],
[0,"Why is VisiCalc called the first killer app?","It was compelling enough that businesses bought an entire, then very expensive, Apple II solely to run it: the software sold the hardware."],
[0,"What succeeded VisiCalc?","Lotus 1-2-3, which dominated the IBM PC era in the 1980s, then Microsoft Excel (Macintosh 1985, Windows 1987), dominant since the early 1990s."],
[0,"What is Apache OpenOffice Calc?","The free, open-source spreadsheet of the Apache OpenOffice suite; it follows VisiCalc's grid-and-formula model; its concepts transfer to Excel, LibreOffice Calc and Google Sheets."],
[0,"What file formats does Calc use?","Its default is the Open Document Spreadsheet format, .ods; it also reads and writes Microsoft Excel's .xls and .xlsx."],
[0,"What is Calc used for?","Financial calculations, budgeting, accounting, data management, statistical analysis, grade tracking and inventory management."],
[1,"Which interface element does Calc have that Writer lacks?","The Formula Bar, made of the Name Box and the Input Line."],
[1,"What does the Name Box do?","Shows the address of the active cell and is a navigation tool: typing Z100 and pressing Enter jumps there; typing a range such as A1:D10 and pressing Enter selects it."],
[1,"What does the Input Line show?","The raw content of the active cell: the typed data or the formula itself rather than its result; also the full text while typing into a narrow cell."],
[1,"Why can the grid not tell you whether a cell holds a typed number or a formula?","A cell showing 80 might hold the number 80 or the formula =A1+B1; only the Input Line shows which."],
[1,"What are the menus in the Calc menu bar?","In Apache OpenOffice Calc: File, Edit, View, Insert, Format, Tools, Data, Window and Help. Data has no counterpart in Writer. The textbook also lists a Sheet menu, which newer versions add."],
[1,"What do the toolbars contain?","The Standard Toolbar has New, Open, Save, Print, Cut, Copy, Paste and Undo; the Formatting Toolbar has font, alignment, number format and borders."],
[1,"What is the spreadsheet grid?","The main workspace: rows (numbers) and columns (letters A to Z, AA, AB and so on); a cell is their intersection; the active cell has a bold border (cell cursor)."],
[1,"Distinguish a workbook from a worksheet.","A workbook is the entire Calc file (one .ods document); a worksheet is one grid within it, reached by its tab. A workbook contains several worksheets, never the reverse."],
[1,"What are the default worksheets?","Sheet1, Sheet2 and Sheet3 (the count varies by version); formulas can reference cells on other sheets."],
[1,"How can a sheet tab be managed?","Right-click to insert, delete, rename, move, copy or recolour; double-click the name to rename; the + button adds a sheet."],
[1,"What is a cell reference?","The column letter followed by the row number that uniquely identifies a cell, such as B3; A1 is the top-left cell."],
[1,"What is a cell range?","A rectangular block of contiguous cells given by the top-left and bottom-right references separated by a colon, e.g. A1:C5 = 3 x 5 = 15 cells; B1:B20 and A3:F3 are valid ranges."],
[1,"What is on the status bar?","The sum, average and count of the selection, and the zoom."],
[1,"Where is each feature in the menus?","Sort: Data, Sort. AutoFilter: Data, Filter, AutoFilter. Validity: Data, Validity. Chart: Insert, Chart. Function Wizard: Insert, Function or Ctrl+F2. Page style: Format, Page. Print ranges: Format, Print Ranges. Print preview: File, Page Preview."],
[2,"What are the three data types in Calc?","Numbers, text (labels) and formulas."],
[2,"What can numbers be in Calc?","Integers, decimals, percentages, currency, dates (serial numbers counting days from a fixed date) and times (fractions of a day); right-aligned by default."],
[2,"How does Calc treat text?","Content not meant for arithmetic; left-aligned by default; may overflow into empty neighbouring cells but is stored only in its own cell."],
[2,"How is a number forced to be text?","By a leading apostrophe on entry, as for a phone number or PIN that must never be summed."],
[2,"What must every formula begin with?","An equals sign (=), which tells Calc to calculate instead of storing the content literally."],
[2,"What do Enter, Tab, arrow keys and Escape do?","Enter confirms and moves down; Tab confirms and moves right; an arrow key confirms and moves that way; Escape cancels and restores the previous content."],
[2,"How is an existing cell edited without retyping?","Press F2 or double-click to enter edit mode and change the content in place."],
[3,"What can a formula combine?","Cell references, arithmetic operators, numeric constants, text strings in double quotes, comparison operators and functions."],
[3,"State the order of precedence of operators.","Exponentiation (^) first; then multiplication and division; then addition and subtraction, left to right within a level; parentheses override, innermost outward."],
[3,"Evaluate =2+3*4 and =(2+3)*4.","14 (multiplication first) and 20 (parentheses first)."],
[3,"Evaluate =10-2^2.","6: the exponent gives 4 first, then 10 - 4."],
[3,"Why does =(A1+B1)/2 average two cells but =A1+B1/2 does not?","Division comes before addition, so the second form divides only B1 by 2; the parentheses force the addition first."],
[3,"List the comparison operators.","= equal; < less than; > greater than; <= less than or equal; >= greater than or equal; <> not equal."],
[3,"What is a function?","A predefined, named calculation taking one or more arguments, usually ranges, in parentheses."],
[3,"What does SUM do?","=SUM(range) totals the numeric values, ignoring text and blanks; it accepts several ranges, e.g. =SUM(A1:A5,C1:C5,10)."],
[3,"What do AVERAGE, MIN and MAX return?","AVERAGE: the arithmetic mean (sum divided by count of numeric values). MIN: the smallest numeric value. MAX: the largest."],
[3,"What does COUNT return?","The number of cells with numeric values (not text, not blanks)."],
[3,"Distinguish COUNT, COUNTA and COUNTBLANK.","COUNT: numeric cells only. COUNTA: all non-empty cells. COUNTBLANK: empty cells."],
[3,"State the syntax and use of IF.","=IF(test, value_if_true, value_if_false) returns one of two results depending on the test."],
[3,"Explain =IF(B2>=35,\"PASS\",\"FAIL\").","Tests whether B2 is at least 35 and shows PASS if so, otherwise FAIL; copied down a column it grades every student from their own row."],
[3,"What does =IF(A1>A2,\"A1 wins\",\"A2 wins\") return if A1 = 45 and A2 = 60?","A2 wins, because 45 > 60 is false."],
[3,"What do COUNT and SUM return for A1:A5 = 12, 8, \"N/A\", 20, 15?","COUNT = 4 (the text is not counted); SUM = 55 (the text is ignored)."],
[3,"What is the Function Wizard?","A guided dialog listing functions by category with descriptions and argument fields; opened with Insert, Function or Ctrl+F2."],
[4,"What is a cell reference used for in a formula?","It lets one cell's formula use another cell's value; its behaviour when the formula is copied depends on the reference type."],
[4,"Define a relative reference.","The default: it describes the referenced cell's position relative to the formula's own cell, so when copied every reference shifts to keep the same relative position."],
[4,"Show how =A1+B1 changes when copied down.","In C2 it becomes =A2+B2 and in C3 =A3+B3: only one formula was written but every row sums its own data."],
[4,"Define an absolute reference.","One with a $ before the column letter and the row number ($A$1) that stays fixed on one cell wherever the formula is copied."],
[4,"Why does a tax calculation need an absolute reference?","With =C2*$B$1 copied down, C2 tracks each row's sale while $B$1 always reads the single tax rate. A plain B1 would shift to B2, B3 and so on and silently give wrong results."],
[4,"Define a mixed reference.","One that locks only the column ($A1) or only the row (A$1), the other part adjusting; suited to multiplication tables copied across and down."],
[4,"State how the four reference types behave when copied.","A1: row adjusts down, column adjusts across. $A$1: fixed both ways. $A1: row adjusts down; column stays on A. A$1: stays on row 1; column adjusts across."],
[4,"Which key cycles a reference between relative, absolute and mixed forms?","The textbook gives F4: A1, $A$1, A$1, $A1 and back. In Apache OpenOffice and LibreOffice Calc the key is Shift+F4 (F4 is Excel's)."],
[4,"If =B2*$C$1 in D2 is copied to D4, what results?","=B4*$C$1: B2 shifts down two rows, $C$1 does not move."],
[4,"If =$A1+B$1 in C2 is copied to D3, what results?","=$A2+C$1: $A keeps its column and the row moves down one; B moves right to C and row 1 stays."],
[4,"How should a copied-formula question be answered?","Examine each reference separately: does it carry a $ before the column, the row, both or neither? Shift only the parts without $ by the same rows and columns the formula moved, showing the reasoning."],
[4,"Why did =C2*B1 copied down 50 rows go wrong?","B1 is relative, so it shifted to B2, B3 and so on, looking for a tax rate in other cells. The correction is =C2*$B$1."],
[5,"Define sorting.","Rearranging a dataset's rows by the values in one or more columns, ascending (smallest to largest, A to Z, earliest to latest) or descending."],
[5,"How is data sorted in Calc?","Click inside the data (Calc detects the extent) and choose Data, Sort; set Sort By, then Then By, up to three criteria."],
[5,"What does the Then By field do?","Breaks ties from the Sort By column using a second column; a third criterion resolves remaining ties, e.g. Class then Name gives alphabetised names within each class."],
[5,"What does Range contains column labels do?","Keeps the header row fixed rather than sorting it with the data."],
[5,"Define filtering.","Temporarily hiding rows that do not meet criteria, showing only matches; the underlying data is not reordered or changed and hidden rows reappear when the filter is removed."],
[5,"Distinguish sorting and filtering.","Sorting rearranges rows (until sorted again); filtering hides rows temporarily without changing their order or content."],
[5,"What is AutoFilter?","Data, Filter, AutoFilter adds a dropdown arrow to every column header listing the unique values; choosing one filters the rows; several columns can be filtered together; All restores the rows."],
[5,"How do you know a filter is active?","The row numbers of the remaining visible rows are shown in blue."],
[5,"What is Standard Filter?","Data, Filter, Standard Filter: conditions with comparison operators (equals, does not equal, contains, greater than, less than) combined with AND/OR across columns, e.g. Category equals Electronics AND Price greater than 5000."],
[5,"What is Advanced Filter?","A filter whose criteria come from a separate, user-defined area of the sheet, allowing complex, reusable definitions."],
[6,"What is data validation?","A restriction on what can be typed into a cell, enforcing data integrity by catching input errors as they occur; set through Data, Validity."],
[6,"Name the tabs of the Validity dialog.","Criteria, Input Message (Input Help in the OpenOffice dialog) and Error Alert."],
[6,"What does the Criteria tab do?","Its Allow dropdown sets the permitted type (whole numbers, decimal, date, time, text length or a list) and further conditions narrow it, such as whole numbers between 1 and 100."],
[6,"What does the Input Message do?","An optional tooltip shown when the cell is selected, such as Enter a score between 0 and 100."],
[6,"Distinguish a Warning from a Stop error alert.","Warning: the invalid data can still be entered after acknowledgement. Stop: invalid data cannot be entered at all."],
[6,"Why use validation on a shared attendance sheet?","A list of Present, Absent and Leave prevents inconsistent entries such as present, Present, P and yes that make sorting, filtering and counting unreliable."],
[7,"What is a chart?","A visual representation of spreadsheet data that shows trends, patterns and proportions more readily than raw numbers."],
[7,"When is a column chart used?","To compare values across categories vertically; the most common general-purpose chart."],
[7,"When is a bar chart preferred to a column chart?","When category labels are long, since horizontal bars leave room for them."],
[7,"When is a line chart used?","To show a trend: how values change across a sequence, typically time periods."],
[7,"When is a pie chart used and what is its limit?","To show the proportional composition of a whole, with five or fewer categories of meaningfully different size. Beyond six or seven slices, or with similar slices, it is hard to read."],
[7,"What is an area chart?","A line chart with the area beneath the line filled, emphasising cumulative volume."],
[7,"What is an XY (scatter) chart?","Individual points on two numeric axes, revealing a correlation between two variables."],
[7,"Describe the four steps of the Chart Wizard.","1 Chart Type; 2 Data Range (and whether each series runs across a row or down a column); 3 Data Series (name, value range and category-label range of each series); 4 Chart Elements (title, axis titles, legend)."],
[7,"How is a chart created?","Select the data range including the headers that become axis labels and legend entries, then Insert, Chart to launch the wizard, and click Finish."],
[7,"How is a chart edited?","Double-click it to enter edit mode; right-click any element for its menu; Insert and Format menus change type, range and titles; series colours, line styles and axis scales can be customised; click outside to exit."],
[7,"Why is a pie chart wrong for twenty products over twelve months?","It cannot show change over time and has far too many slices; a line chart (or column chart) is the right choice."],
[7,"Which chart suits five departments' shares of a budget?","A pie chart: the proportion of a whole with few categories."],
[8,"Why does a spreadsheet need print preview?","A wide sheet may split awkwardly across pages; File, Page Preview (Print Preview in the textbook) shows the exact pagination so problems can be fixed before printing."],
[8,"Where is spreadsheet page setup?","Format, Page (Page Style); its Sheet tab adds spreadsheet-specific options."],
[8,"What does Print Order control?","Whether pages run down first (all rows of the left columns before moving right) or across first (all columns of the top rows before moving down)."],
[8,"What print options appear on the Sheet tab?","Whether to print grid lines, column and row headers (A, B, C and 1, 2, 3) and zero values."],
[8,"What is Scale to Fit?","A setting to fit the print range on X pages wide by Y pages tall (or a set percentage such as 80 percent), scaling the printout automatically; it fixes a table slightly too wide spilling a few columns onto a near-empty page."],
[8,"How is a print range defined?","Select the cells and choose Format, Print Ranges, Define; only those cells print, and a blue border marks the range."],
[8,"What does Rows to Repeat do?","Reprints a header row (and Columns to Repeat a label column) on every printed page of a multi-page sheet; set through Format, Print Ranges, Edit."],
[8,"Distinguish Rows to Repeat from freezing a row.","Rows to Repeat affects the printed pages; freezing keeps a row visible while scrolling on screen and has no effect on printing."],
[8,"What does the page range in the Print dialog refer to?","Pages of the printed output (page 1, page 2), not worksheet names; to print a named sheet, go to its tab first."]

const SHORT=[
["Distinguish between a relative and an absolute cell reference.","A relative reference (A1) describes a cell's position relative to the formula's cell, so it shifts when the formula is copied. An absolute reference ($A$1) has a $ before the column and the row and stays fixed on one cell wherever the formula is copied. Example: =C2*$B$1 copied down keeps $B$1 while C2 changes.",["Relative shifts when copied","Absolute stays fixed; $ sign","Example of each or of use"]],
["Why is an absolute reference necessary when referring to a shared tax rate across many rows?","Every row's calculation must read the same single tax cell. With =C2*$B$1 copied down, C adjusts to each row's sale while $B$1 stays fixed. If B1 were relative it would shift to B2, B3 and so on, reading cells that hold something else or nothing, giving wrong results with no error message.",["All rows use one constant cell","Absolute reference stays fixed","A relative reference would shift and give wrong results"]],
["Distinguish between sorting and filtering.","Sorting rearranges the rows by the values of one or more columns (Data, Sort), changing the order until sorted again. Filtering temporarily hides rows that do not meet criteria without altering the order or content; the hidden rows return when the filter is removed.",["Sorting rearranges rows","Filtering hides rows temporarily","Filtering does not change order or content"]],
["Explain the purpose of the Name Box, beyond simply displaying the active cell.","The Name Box is also a navigation tool. Typing a cell reference such as Z100 and pressing Enter jumps directly there without scrolling, and typing a range such as A1:D10 and pressing Enter selects the whole range at once.",["Shows the active cell address","Navigation by typing a reference","Selecting a range by typing it"]],
["Distinguish between AutoFilter and Standard Filter.","AutoFilter (Data, Filter, AutoFilter) puts a dropdown arrow on each column header listing the unique values, and choosing one filters the sheet; filters on several columns can run together. Standard Filter (Data, Filter, Standard Filter) builds conditions with comparison operators such as equals, contains, greater than, joined by AND/OR across columns.",["AutoFilter dropdown of unique values","Standard Filter uses comparison operators","AND/OR combinations"]],
["What is a mixed reference, and when is it useful?","A mixed reference locks only the column ($A1) or only the row (A$1), leaving the other part to adjust when copied. It suits grid calculations such as a multiplication table, where a formula is copied across a row and down a column and one axis must stay fixed in each direction.",["Locks only column or only row","Example $A1 or A$1","Use in a grid such as a multiplication table"]],
["Distinguish between COUNT and COUNTA.","COUNT counts only the cells containing numeric values, ignoring text and blanks. COUNTA counts all non-empty cells, whether numbers or text. COUNTBLANK counts the empty cells.",["COUNT numeric only","COUNTA all non-empty","COUNTBLANK optional mention"]],
["Explain why a pie chart is unsuitable for a dataset with ten or more categories.","A pie shows the shares of a whole, which works only with a few categories (five or fewer) of clearly different size. With many slices, or slices of similar size, it is hard to read at a glance, defeating the purpose of a chart; a column or bar chart should be used.",["Pie for few categories","Many or similar slices hard to read","Recommends column or bar chart"]],
["What is Scale to Fit, and what printing problem does it solve?","Found on the Sheet tab of Format, Page, Scale to Fit makes the printout fit the print range on a set number of pages wide by pages tall, or at a set percentage such as 80 percent, scaling automatically. It solves a table slightly too wide, whose few extra columns spill onto an otherwise nearly empty page.",["Fit on X pages wide by Y tall or a percentage","Automatic scaling","Solves a few columns spilling onto an extra page"]],
["Distinguish between a Warning and a Stop error alert in data validation.","With a Warning alert the invalid entry produces a message but can still be entered after the user acknowledges it. With a Stop alert the invalid entry is rejected and cannot be entered at all.",["Warning allows entry after acknowledgement","Stop rejects invalid data"]],
["Explain the difference between the Input Line and the value shown in a cell.","The cell shows the calculated result, while the Input Line shows the cell's actual content: the typed data or the formula itself. A cell showing 80 might hold the number 80 or =A1+B1; only the Input Line reveals which.",["Cell shows the result","Input Line shows the formula or raw content","Example"]],
["Why does a spreadsheet recalculate automatically, while a paper ledger does not?","In a spreadsheet a cell can hold a formula that refers to other cells, so its value is derived and updates the instant a cell it depends on changes. A paper ledger commits each figure when written, so changing one number means every total depending on it must be recalculated and rewritten by hand.",["Formulas refer to other cells","Dependent cells update automatically","Ledger figures are committed and manual"]]
];
const LONG=[
["Explain relative, absolute and mixed cell references with one worked example of each, showing how a formula changes when copied.","A relative reference (A1) shifts to keep the same relative position: =A1+B1 in C1 copied to C2 and C3 becomes =A2+B2 and =A3+B3, so one formula serves every row. An absolute reference ($A$1) stays fixed: =C2*$B$1 in D2 copied to D3 and D4 becomes =C3*$B$1 and =C4*$B$1, so every row uses the single tax rate in B1. A mixed reference locks only the column or the row: =$A1+B$1 in C2 copied to D3 becomes =$A2+C$1 because $A keeps its column while the row moves, and B moves to C while row 1 stays. Mixed references suit grids such as multiplication tables. Pressing the cycling key (Shift+F4 in OpenOffice Calc; F4 in Excel) cycles A1, $A$1, A$1, $A1. In answering, each reference is examined separately for a $.",["Relative with worked example","Absolute with worked example and reason","Mixed with worked example","Shows the changed formulas when copied","Mentions the key that cycles the forms or the $ rule"]],
["Describe the four steps of the Chart Wizard.","First select the data range, including headers that become axis labels and legend entries, and choose Insert, Chart. Step 1, Chart Type: choose column, bar, line, pie, area, XY or another type according to the data (trend over time suits line; proportion of a whole suits pie; comparison suits column or bar). Step 2, Data Range: confirm or adjust the cells and say whether each data series runs across a row or down a column. Step 3, Data Series: control each series' name, its value range and the range giving the category labels. Step 4, Chart Elements: set the chart title, the X-axis and Y-axis titles and whether and where the legend appears. Finish embeds the chart in the sheet in edit mode (grey border); clicking outside exits it, after which it can be moved and resized; double-click re-enters edit mode.",["Selecting data and Insert, Chart","Step 1 Chart Type","Step 2 Data Range with rows or columns","Step 3 Data Series","Step 4 Chart Elements","Finish and editing"]],
["Explain the components of the OpenOffice Calc interface, including the Formula Bar, and how it differs from the Writer interface covered in Lesson 8.","The Title Bar shows the file name and Apache OpenOffice Calc. The Menu Bar has File, Edit, View, Insert, Format, Tools, Data, Window and Help, with the Data menu having no Writer equivalent (the textbook also names a Sheet menu). The Standard Toolbar and Formatting Toolbar give one-click access to file, editing and formatting operations, as in Writer. The Formula Bar, which has no Writer counterpart, has the Name Box (address of the active cell, used for navigation and range selection) and the Input Line (the raw content or formula). The Spreadsheet Grid is the main workspace of lettered columns and numbered rows, with the active cell shown by a bold border. Sheet Tabs at the bottom switch between worksheets, and the Status Bar shows the sum, average and count of a selection and the zoom.",["Title bar and menu bar","Toolbars","Formula Bar: Name Box and Input Line","Spreadsheet grid and active cell","Sheet tabs and status bar","Differences from Writer"]],
["Describe the process of sorting data by three criteria, explaining what happens when the first criterion produces ties.","Click anywhere inside the data, since Calc detects its extent, and choose Data, Sort. In the dialog the Sort By field names the primary column and direction (ascending or descending). If that column contains ties, the Then By field breaks them using a second column, and a third criterion resolves any ties that remain. For example, sorting a roster by Class ascending then Name ascending gives an alphabetised list within each class, which one criterion cannot achieve. The Range contains column labels checkbox keeps the header row fixed. Sorting rearranges the rows (unlike filtering, which only hides rows).",["Data, Sort on a data range","Sort By then Then By","Ties resolved by the next criterion","Class and Name example","Column labels checkbox"]],
["Explain data validation, covering the Criteria, Input Message and Error Alert tabs, with a practical example.","Data validation, set through Data, Validity, restricts what can be entered in a cell so that errors are caught at entry and data stays consistent. The Criteria tab has an Allow dropdown (whole numbers, decimal, date, time, text length or list) with further conditions, such as whole numbers between 1 and 100. The Input Message tab gives an optional tooltip when the cell is selected, for example Enter a score between 0 and 100. The Error Alert tab gives the message shown when data violates the rule, as a Warning (the entry can be made after acknowledgement) or a Stop (the entry is rejected). Example: an attendance sheet restricted to a list of Present, Absent and Leave stops entries such as present, P or yes, which would make sorting, filtering and counting unreliable.",["Purpose and menu path","Criteria tab with example condition","Input Message tab","Error Alert tab with Warning and Stop","Practical example"]],
["Trace the history of spreadsheet software from paper ledgers to VisiCalc, explaining why VisiCalc is called the first killer app.","Before electronic spreadsheets, accountants and analysts worked on wide paper ledger sheets ruled in rows and columns, calculating by hand with pencil, eraser and adding machine; changing one assumption meant recalculating and rewriting every dependent figure, which could take a working day. In 1979 Dan Bricklin and Bob Frankston, working from Bricklin's idea while watching a professor correct a table on a blackboard, released VisiCalc for the Apple II: one change updated every dependent total instantly. It is the first killer app because businesses bought an entire, then expensive, Apple II solely to run it, so the software sold the hardware. Lotus 1-2-3 dominated the IBM PC era, then Excel (Macintosh 1985, Windows 1987) from the early 1990s, and Calc today still follows the same grid-and-formula model.",["Paper ledger and its limitation","VisiCalc 1979 Bricklin and Frankston, Apple II","Instant recalculation","Meaning of killer app","Lotus 1-2-3 and Excel"]],
["Compare the major chart types and the kind of data each is best suited to represent.","A column chart compares values across categories vertically and is the general-purpose choice. A bar chart is the same comparison drawn horizontally, preferred for long category labels. A line chart shows a trend across a sequence such as time periods. A pie chart shows the proportional composition of a whole and works only with five or fewer categories of different size; with more or similar slices it is hard to read. An area chart is a line chart with the area filled, emphasising cumulative volume. An XY (scatter) chart plots points on two numeric axes to reveal correlation between variables. A good answer names the type and the property of the data that drives the choice.",["Column and bar","Line","Pie with its limit","Area","XY scatter","Links type to the property of the data"]],
["Explain the SUM, AVERAGE, MIN, MAX, COUNT and IF functions with the syntax and purpose of each.","A function is a predefined named calculation taking arguments in parentheses. =SUM(range) totals the numeric values in the range, ignoring text and blanks, and accepts several ranges such as =SUM(A1:A5,C1:C5,10). =AVERAGE(range) returns the arithmetic mean, the sum divided by the count of numeric values. =MIN(range) returns the smallest and =MAX(range) the largest numeric value. =COUNT(range) counts the cells holding numbers (COUNTA counts all non-empty cells and COUNTBLANK the empty ones). =IF(test, value_if_true, value_if_false) returns one of two results depending on the test, for example =IF(B2>=35,\"PASS\",\"FAIL\"), which grades every student when copied down a column. Functions can be typed or built with the Function Wizard (Insert, Function or Ctrl+F2).",["SUM syntax and purpose","AVERAGE syntax and purpose","MIN and MAX","COUNT with COUNTA or COUNTBLANK","IF syntax with example","Function Wizard"]]
];

["A student writes =C2*B1 for a tax calculation and copies it down 50 rows, and every result beyond row 2 is wrong. Diagnose the likely cause and correct the formula.","The tax rate in B1 is a relative reference, so copying down shifts it to B2, B3 and so on, which hold other data or nothing, giving wrong results without an error. The reference to the rate must be absolute: =C2*$B$1, so that C2 still changes with each row while $B$1 stays fixed.",["Identifies B1 as relative","Explains the shift when copied","Correct formula =C2*$B$1"]],
["A teacher wants a dropdown restricting a Grade column to only A, B, C, D or F, rejecting anything else typed. Identify the feature to use and outline the setup.","Use data validation. Select the Grade cells and choose Data, Validity. On the Criteria tab set Allow to List and enter A, B, C, D, F. Optionally add an Input Message such as Choose a grade. On the Error Alert tab set the action to Stop with a message so that anything else is rejected.",["Data validation (Data, Validity)","Allow set to List with the values","Error alert set to Stop"]],
["A sales report spans four printed pages, and only page 1 shows which column is which. Identify the feature that would fix this and where it is configured.","Rows to Repeat (Repeat Rows) should be set to the header row so that it reprints at the top of every printed page. It is configured through Format, Print Ranges, Edit. Freezing the row would not help because it only affects the on-screen view.",["Rows to Repeat","Format, Print Ranges, Edit","Freezing is on-screen only"]],
["A dataset lists twenty products and their monthly sales over a year. A colleague proposes a pie chart to show how each product's sales changed month by month. Explain why this is the wrong chart choice and recommend a better one.","A pie shows the proportion of one whole at a single point, so it cannot show change over months, and with twenty slices it would be unreadable. A line chart, with one line per product (or a few chosen products), shows trends over time; a column chart could compare products in a selected month.",["Pie shows a single whole, not change over time","Too many slices","Recommends a line (or column) chart"]],
["A shared attendance spreadsheet has inconsistent entries: present, Present, P and yes all appear in the same column, making it impossible to reliably count attendance with COUNTIF. Recommend a feature that would have prevented this and explain how.","Data validation would have prevented it. Setting the column through Data, Validity with Allow set to List and the values Present, Absent and Leave gives a dropdown, so only consistent entries can be made, and a Stop error alert rejects anything else. The consistent values then count, sort and filter correctly.",["Data validation","Allow List with the values","Consistency enables counting, sorting and filtering"]],
["A spreadsheet is just three columns too wide to fit on one printed page, spilling those columns onto an otherwise blank second page. Recommend a setting that solves this without manually resizing any column.","Use Scale to Fit on the Sheet tab of the Page Style (Format, Page): set it to fit the print range on 1 page wide (and the required pages tall), or set a scaling percentage such as 80 percent. Calc then scales the whole printout automatically.",["Scale to Fit","Fit on 1 page wide or a percentage","Automatic scaling, no manual resizing"]]

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function norm(s){return " "+String(s).toLowerCase().replace(/[^a-z0-9]+/g," ").trim()+" ";}
function matches(user,acc,all){const u=norm(user);const hit=a=>u.includes(norm(a));return all?acc.every(hit):acc.some(hit);}

function viewLearn(){

  let h='<div class="subnav" role="group" aria-label="Learning method">'+subs.map(s=>`<button class="chip" data-act="lv" data-v="${s[0]}" aria-pressed="${S.lv===s[0]}">${s[1]}</button>`).join("")+"</div>";

  else if(S.lv==="cards")h+=viewCards();

  else h+=viewDump();

function secCounts(){
  const c=[0,0,0,0];
  CARDS.forEach((k,i)=>{if(S.cards.sec<0||k[0]===S.cards.sec)c[store.box[i]||0]++;});return c;
}
function viewCards(){
  const c=secCounts(),tot=c[0]+c[1]+c[2]+c[3];
  let h='<p class="hint">Read the question, answer in your head or in the box, then flip. Rate honestly. Missed cards come back within a few cards; a card is mastered after two confident passes in separate sessions.</p>';
  h+='<div class="subnav">'+['<button class="chip" data-act="csec" data-v="-1" aria-pressed="'+(S.cards.sec<0)+'">All topics</button>'].concat(SECS.map((s,i)=>`<button class="chip" data-act="csec" data-v="${i}" aria-pressed="${S.cards.sec===i}">${esc(s)}</button>`)).join("")+"</div>";
  h+=`<div class="subnav"><button class="chip" data-act="cord" data-v="0" aria-pressed="${!S.cards.ordered}">Shuffled</button><button class="chip" data-act="cord" data-v="1" aria-pressed="${S.cards.ordered}">Chapter order</button></div>`;
  h+=`<div class="stats"><div class="stat"><b>${c[0]}</b><span>New</span></div><div class="stat"><b>${c[1]}</b><span>Learning</span></div><div class="stat"><b>${c[2]}</b><span>Review</span></div><div class="stat"><b>${c[3]}</b><span>Mastered</span></div></div>`;
  h+=`<div class="bar" aria-hidden="true"><i style="width:${tot?Math.round(c[3]/tot*100):0}%"></i></div>`;
  const q=S.cards.queue;
  if(!q.length){
    h+=`<div class="panel"><h3>${c[3]===tot?"Every card in this set is mastered":"Session complete"}</h3><p class="hint">${S.cards.done} cards rated this session.</p><div class="row"><button class="btn primary" data-act="cnext">Start another round</button><button class="btn" data-act="creset">Reset progress for this set</button></div></div>`;
    return h;
  }
  const id=q[0],k=CARDS[id];
  h+=`<div class="panel fc"><div class="lab">Question · ${esc(SECS[k[0]])} · ${q.length} left</div><div class="q">${esc(k[1])}</div>`;
  h+=`<input type="text" id="guess" placeholder="Type what you remember (optional)" value="${esc(S.cards.guess)}" autocomplete="off">`;
  if(!S.cards.flip){h+='<div class="row"><button class="btn primary" data-act="flip">Show answer</button><span class="hint">or press Space</span></div>';}
  else{
    h+=`<div class="lab">Answer</div><div class="a">${esc(k[2])}</div><div class="row"><button class="btn bad" data-act="rate" data-v="miss">Missed it (1)</button><button class="btn warn" data-act="rate" data-v="almost">Almost (2)</button><button class="btn good" data-act="rate" data-v="got">Got it (3)</button></div>`;
  }
  return h+"</div>";
}
function viewCloze(){
  let h='<p class="hint">Read each passage and say the hidden term aloud before you tap it. Tap again to hide it.</p><div class="row"><button class="btn" data-act="revall">Reveal all</button><button class="btn" data-act="hideall">Hide all</button></div>';

    const body=esc(n[1]).replace(/\{\{(.+?)\}\}/g,(m,a)=>`<button class="blank" data-act="blank" style="min-width:${Math.max(4,a.length)}ch" aria-label="Hidden term, press to reveal"><span class="ans">${a}</span></button>`);
    h+=`<div class="panel note"><h3>${esc(n[0])}</h3><p>${body}</p></div>`;
  });
  return h;
}
function viewCover(){
  let h='<p class="hint">Cover the answers, say what belongs in each cell, then tap it to check. Switch the mask to quiz yourself from the other direction.</p>';

    t.r.forEach(r=>{h+="<tr>"+r.map((c,ci)=>{const hid=(m==="a"&&ci>0)||(m==="b"&&ci===0);return `<td><span class="m${hid?" hid":""}" data-act="mask"${hid?' tabindex="0" role="button" aria-label="Hidden, press to reveal"':""}>${esc(c)}</span></td>`;}).join("")+"</tr>";});
    h+="</tbody></table></div></div>";
  });
  return h;
}
function viewDump(){
  const d=DUMPS[S.dump.i];
  let h='<p class="hint">Pick a topic and write everything you can remember with the chapter closed. Then compare against the key points and tick what you covered. The unticked points are your study list.</p>';
  h+='<div class="subnav">'+DUMPS.map((x,i)=>`<button class="chip" data-act="dtopic" data-v="${i}" aria-pressed="${S.dump.i===i}">${esc(x.t)}</button>`).join("")+"</div>";

  if(!S.dump.checked){h+='<div class="row"><button class="btn primary" data-act="dcheck">Compare with key points</button></div>';}

  }
  return h+"</div>";
}

  if(!used(sh,p.c,p.r))return null;
  let c1=p.c,c2=p.c,r1=p.r,r2=p.r,ch=true;
  const any=(ca,cb,ra,rb)=>{for(let r=Math.max(1,ra);r<=rb;r++)for(let c=Math.max(1,ca);c<=cb;c++)if(used(sh,c,r))return true;return false;};
  while(ch){ch=false;
    if(any(c1-1,c1-1,r1-1,r2+1)){c1--;ch=true;}
    if(any(c2+1,c2+1,r1-1,r2+1)){c2++;ch=true;}
    if(any(c1-1,c2+1,r1-1,r1-1)){r1--;ch=true;}
    if(any(c1-1,c2+1,r2+1,r2+1)){r2++;ch=true;}

function condOk(v,disp,op,val){
  const nv=parseFloat(val),vn=(typeof v==="number");

  let d;
  if(vn&&val.trim()!==""&&isFinite(nv))d=v-nv;else d=String(disp).toLowerCase()<String(val).toLowerCase()?-1:String(disp).toLowerCase()>String(val).toLowerCase()?1:0;
  return op==="="?d===0:op==="<>"?d!==0:op===">"?d>0:op==="<"?d<0:op===">="?d>=0:d<=0;
}
function rowHidden(sh,r){
  const B=L.fblk;if(!B||B.sh!==sh||r<=B.r1||r>B.r2)return false;
  for(const col of Object.keys(L.fv)){const want=L.fv[col];if(want===""||want==null)continue;const a=col+r;if(dispVal(valueOf(sh,a),raw(sh,a))!==want)return true;}
  if(L.std){
    const t=(f)=>{const a=f.f+r;const v=valueOf(sh,a);return condOk(v&&v.err?null:v,dispVal(v,raw(sh,a)),f.o,f.v);};
    const r1=t(L.std.a);
    if(!L.std.b)return !r1;
    const r2=t(L.std.b);
    return !(L.std.op==="OR"?(r1||r2):(r1&&r2));
  }
  return false;

function hiddenCount(){if(!L.fblk)return 0;let n=0;for(let r=L.fblk.r1+1;r<=L.fblk.r2;r++)if(rowHidden(L.fblk.sh,r))n++;return n;}
function doSort(){
  const B=blockOf(L.sh,L.act);if(!B){setMsg("Click inside the data first, then choose Data, Sort.","bad");return;}
  const crit=[[L.s1,L.s1d],[L.s2,L.s2d],[L.s3,L.s3d]].filter(x=>x[0]);
  if(!crit.length){setMsg("Choose at least one Sort By column.","bad");return;}
  const first=B.r1+(L.slab?1:0);if(first>=B.r2){setMsg("There is only one row to sort.","note");return;}
  pushHist();
  const rows=[];
  for(let r=first;r<=B.r2;r++){const cells={};for(let c=B.c1;c<=B.c2;c++)cells[c]=raw(L.sh,addrOf(c,r));rows.push({r,cells,keys:crit.map(k=>valueOf(L.sh,colLtr(colNum(k[0]))+r))});}
  rows.sort((x,y)=>{
    for(let i=0;i<crit.length;i++){
      const a=x.keys[i],b=y.keys[i],an=(a===null||(a&&a.err)),bn=(b===null||(b&&b.err));
      if(an&&bn)continue;if(an)return 1;if(bn)return -1;
      let d=cmpVals(a,b);if(d!==0)return crit[i][1]==="d"?-d:d;
    }
    return x.r-y.r;
  });
  rows.forEach((o,i)=>{const nr=first+i;for(let c=B.c1;c<=B.c2;c++){let v=o.cells[c];if(v&&v[0]==="=")v=shiftFormula(v,nr-o.r,0);const a=addrOf(c,nr);if(v==="")delete cur().c[a];else cur().c[a]=v;}});
  L.il=raw(L.sh,L.act);
  setMsg("Sorted "+rows.length+" rows by "+crit.map(k=>(L.slab?(raw(L.sh,k[0]+B.r1)||"Column "+k[0]):"Column "+k[0])+(k[1]==="d"?" (descending)":" (ascending)")).join(", then ")+". The rows were rearranged; the formulas moved with their rows.","ok");
}
/* ---------- editing ---------- */
function validateCell(sh,addr,rawv){
  const p=parseAddr(addr);
  for(const r of L.vr){
    if(r.sh!==sh||p.c<r.c1||p.c>r.c2||p.r<r.r1||p.r>r.r2)continue;
    if(rawv===""||rawv[0]==="=")return null;
    const val=parseConst(rawv);
    let ok=true;
    if(r.allow==="whole")ok=typeof val==="number"&&Number.isInteger(val)&&val>=r.min&&val<=r.max;
    else if(r.allow==="dec")ok=typeof val==="number"&&val>=r.min&&val<=r.max;
    else if(r.allow==="len"){const n=String(rawv[0]==="'"?rawv.slice(1):rawv).length;ok=n>=r.min&&n<=r.max;}
    else if(r.allow==="list")ok=r.list.includes(rawv[0]==="'"?rawv.slice(1):rawv);
    if(!ok)return r;
  }
  return null;
}
function applyCell(addr,rawv){
  pushHist();
  if(rawv==="")delete cur().c[addr];else cur().c[addr]=rawv;
}
function commit(dr,dc){
  const rawv=L.il;
  const bad=validateCell(L.sh,L.act,rawv);

    if(bad.mode==="stop"){setMsg("Stop: "+bad.emsg+" The entry was rejected and the cell keeps its previous content.","bad");L.il=raw(L.sh,L.act);return;}
    L.pend={addr:L.act,raw:rawv,msg:bad.emsg,dr,dc};return;
  }
  applyCell(L.act,rawv);moveBy(dr,dc);setMsg("","note");
}
function moveBy(dr,dc){
  const p=parseAddr(L.act);let r=p.r+dr,c=p.c+dc;if(r<1)r=1;if(c<1)c=1;

function pasteClip(){

  pushHist();
  const C=L.clip,t=L.sel,single=C.rows===1&&C.cols===1;
  let n=0;
  const put=(tr,tc,i,j)=>{let v=C.cells[i][j];if(v&&v[0]==="=")v=shiftFormula(v,tr-(C.r0+i),tc-(C.c0+j));const a=addrOf(tc,tr);if(v==="")delete cur().c[a];else cur().c[a]=v;n++;};
  if(single&&(t.c2>t.c1||t.r2>t.r1)){for(let r=t.r1;r<=t.r2;r++)for(let c=t.c1;c<=t.c2;c++)put(r,c,0,0);}
  else{for(let i=0;i<C.rows;i++)for(let j=0;j<C.cols;j++)put(t.r1+i,t.c1+j,i,j);}

function chartData(rng,dir){
  const m=/^([A-Z]{1,3}\d+):([A-Z]{1,3}\d+)$/.exec(String(rng).trim().toUpperCase().replace(/\$/g,""));
  if(!m)return {err:"Enter the data range as two cell references, such as A1:D13."};
  const A=parseAddr(m[1]),B=parseAddr(m[2]);const c1=Math.min(A.c,B.c),c2=Math.max(A.c,B.c),r1=Math.min(A.r,B.r),r2=Math.max(A.r,B.r);
  if(c2-c1<1||r2-r1<1)return {err:"Select at least two columns and two rows: the first row and first column hold the labels."};
  const get=(c,r)=>valueOf(L.sh,addrOf(c,r)),lab=(c,r)=>dispVal(get(c,r),raw(L.sh,addrOf(c,r)));
  let cats=[],series=[];
  if(dir==="cols"){
    for(let r=r1+1;r<=r2;r++)cats.push(lab(c1,r));
    for(let c=c1+1;c<=c2;c++){const vals=[];for(let r=r1+1;r<=r2;r++){const v=get(c,r);vals.push(typeof v==="number"?v:0);}series.push({name:lab(c,r1),vals,rng:addrOf(c,r1+1)+":"+addrOf(c,r2),nrng:addrOf(c,r1)});}
  }else{
    for(let c=c1+1;c<=c2;c++)cats.push(lab(c,r1));
    for(let r=r1+1;r<=r2;r++){const vals=[];for(let c=c1+1;c<=c2;c++){const v=get(c,r);vals.push(typeof v==="number"?v:0);}series.push({name:lab(c1,r),vals,rng:addrOf(c1+1,r)+":"+addrOf(c2,r),nrng:addrOf(c1,r)});}
  }
  return {cats,series,catRng:dir==="cols"?addrOf(c1,r1+1)+":"+addrOf(c1,r2):addrOf(c1+1,r1)+":"+addrOf(c2,r1)};
}

function precSteps(src){

      if(ops[0]==="+"){const mm=/^(-?\d+\.?\d*)([+\-])(\d+\.?\d*)/.exec(t.replace(/(\d)-/g,"$1-"));m=re.exec(t);if(m){const v=m[2]==="+"?+m[1]+ +m[3]:m[1]-m[3];return {t:t.replace(m[0],fmt(v)),why:(m[2]==="+"?"Addition":"Subtraction")+" last, left to right: "+m[1]+m[2]+m[3]+" = "+fmt(v)};}}
    }

    if(c==="c"){e.preventDefault();copySel();render();}else if(c==="v"){e.preventDefault();pasteClip();render();}else if(c==="d"){e.preventDefault();fillDown();render();}else if(c==="z"){e.preventDefault();runMenu("xundo");render();}else if(k==="F2"){e.preventDefault();L.dlg="fn";render();}
    return;
  }
  const mv={ArrowDown:[1,0],ArrowUp:[-1,0],ArrowRight:[0,1],ArrowLeft:[0,-1]}[k];
  if(mv){e.preventDefault();const p=parseAddr(L.act);if(e.shiftKey){const s=L.sel,tr=(p.r===s.r1?s.r2:s.r1)+mv[0],tc=(p.c===s.c1?s.c2:s.c1)+mv[1];extendSel(addrOf(Math.max(tc,1),Math.max(tr,1)));}else moveBy(mv[0],mv[1]);render();return;}
  if(k==="Delete"||k==="Backspace"){e.preventDefault();clearSel();render();return;}
  if(k==="F2"){e.preventDefault();rr("il");return;}
  if(k.length===1&&!e.altKey){e.preventDefault();L.il=k;L.msg="";rr("il");}
});
CALC.forEach(q=>{if(!matchCalc(q.model,q))q.alts.push([q.model]);});

function noteHtml(b){
  let h='<section class="nb"><h3>'+esc(b.h)+'</h3>';
  if(b.d)h+='<p class="def"><b>Definition.</b> '+esc(b.d)+'</p>';
  (b.p||[]).forEach(p=>{h+='<p>'+esc(p)+'</p>';});
  if(b.l)h+='<ul>'+b.l.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>';
  if(b.t)h+='<div class="tbl"><table><thead><tr>'+b.t.c.map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr></thead><tbody>'+b.t.r.map(r=>'<tr>'+r.map(c=>'<td>'+esc(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
  return h+'</section>';
}
function stepIds(st){const ids=[];CARDS.forEach((c,i)=>{if(st.sec.includes(c[0]))ids.push(i);});return ids.filter(i=>i<ORIG).concat(ids.filter(i=>i>=ORIG));}
function stepChunks(st){const ids=stepIds(st),out=[];for(let i=0;i<ids.length;i+=CH)out.push(ids.slice(i,i+CH));return out;}
function blankHtml(text){return esc(text).replace(/\{\{(.+?)\}\}/g,(m,a)=>`<button class="blank" data-act="blank" style="min-width:${Math.max(4,a.length)}ch" aria-label="Hidden term, press to reveal"><span class="ans">${a}</span></button>`);}
function applyRate(queue,v){const id=queue.shift();let b=store.box[id]||0;
  if(v==="miss"){b=1;queue.splice(Math.min(3,queue.length),0,id);}
  else if(v==="almost"){b=Math.max(b,1);queue.push(id);}
  else{b=b<2?2:3;}
  store.box[id]=b;save();}
function openStep(s){
  const P=S.path,N=stepChunks(STEPS[s]).length;
  const ch=store.path.done[s]?0:Math.min(store.path.ch[s]||0,N);
  P.step=s;P.i=0;P.flip=false;P.guess="";P.text="";P.dchecked=false;P.ticks={};P.q=[];
  if(ch>=N){P.ph="gaps";P.ch=N-1;}else{P.ch=ch;P.ph=ch>0?"learn":"primer";}
  render();window.scrollTo(0,0);
}
function pathOverview(){
  const first=STEPS.findIndex((_,s)=>!store.path.done[s]);
  let h='<div class="panel"><h2>Start here</h2><p>New to the subject? Follow the steps in order. Each step sets out the textbook notes, then teaches its cards in small rounds of six (first you see them with answers, then you recall them), then checks you with fill-the-gaps and a brain dump. Progress is saved in this browser.</p></div><div style="display:flex;flex-direction:column;gap:10px">';
  STEPS.forEach((st,s)=>{
    const N=stepChunks(st).length,done=!!store.path.done[s],ch=Math.min(store.path.ch[s]||0,N);
    const status=done?"Done":ch>0?"Round "+ch+" of "+N+" done":"Not started";
    h+=`<button class="opt" data-act="pstep" data-v="${s}" style="display:flex;justify-content:space-between;gap:12px;align-items:center"><span><b>${s+1}. ${esc(st.t)}</b><br><span class="hint">${stepIds(st).length} cards · ${N} rounds</span></span><span class="tag">${status}</span></button>`;
  });
  h+="</div>";
  if(first>=0)h+=`<div class="row"><button class="btn primary" data-act="pstep" data-v="${first}">${(store.path.ch[first]||0)>0?"Continue":"Begin"} step ${first+1}</button></div>`;
  else h+='<p>All steps are done. Keep the cards fresh in Recall cards, then test yourself in Evaluate.</p>';
  return '<div style="display:flex;flex-direction:column;gap:18px">'+h+"</div>";

function viewPath(){
  const P=S.path;
  if(P.step===null)return pathOverview();
  const st=STEPS[P.step],chunks=stepChunks(st),N=chunks.length;
  const pos=P.ph==="primer"?0:(P.ph==="learn"||P.ph==="recall"||P.ph==="roundend")?1+P.ch:P.ph==="gaps"?N+1:P.ph==="dump"?N+2:N+3;
  let h=`<div class="row" style="justify-content:space-between"><span class="row"><button class="btn" data-act="pback">All steps</button>${P.ph==="primer"||P.ph==="done"?"":'<button class="btn" data-act="pnotes">Notes</button>'}</span><span class="lab">Step ${P.step+1} of ${STEPS.length}</span></div><div class="bar" aria-hidden="true"><i style="width:${Math.round(pos/(N+3)*100)}%"></i></div><h2>${esc(st.t)}</h2>`;
  if(P.ph==="primer"){
    h+=`<div class="panel"><div class="lab">Textbook notes</div>${st.blocks.map(noteHtml).join("")}<p class="hint">Next: ${N} short rounds. In each round you see ${CH} cards with their answers, then recall them from memory.</p><div class="row"><button class="btn primary" data-act="pstart">${P.ch>0?"Continue at round "+(P.ch+1):"Start round 1"}</button></div></div>`;
  }else if(P.ph==="learn"){

  }else if(P.ph==="recall"){
    const id=P.q[0],k=CARDS[id];
    h+=`<div class="panel fc"><div class="lab">Round ${P.ch+1} of ${N} · Recall · ${P.q.length} left</div><div class="q">${esc(k[1])}</div><input type="text" id="pguess" placeholder="Type what you remember (optional)" value="${esc(P.guess)}" autocomplete="off">`;
    if(!P.flip)h+='<div class="row"><button class="btn primary" data-act="pflip">Show answer</button><span class="hint">or press Space</span></div>';
    else h+=`<div class="lab">Answer</div><div class="a">${esc(k[2])}</div><div class="row"><button class="btn bad" data-act="prate" data-v="miss">Missed it (1)</button><button class="btn warn" data-act="prate" data-v="almost">Almost (2)</button><button class="btn good" data-act="prate" data-v="got">Got it (3)</button></div>`;
    h+="</div>";
  }else if(P.ph==="roundend"){
    const last=P.ch+1>=N;
    h+=`<div class="panel"><h3>Round ${P.ch+1} done</h3><p>${last?"That was the last round of cards. Two short exercises remain: fill the gaps in the summary, then a brain dump.":"Next you will see "+chunks[P.ch+1].length+" new cards."}</p><div class="row"><button class="btn primary" data-act="pnext">${last?"Fill the gaps":"Start round "+(P.ch+2)}</button></div></div>`;
  }else if(P.ph==="gaps"){
    h+='<p class="hint">Say each hidden term aloud before you tap it.</p><div class="row"><button class="btn" data-act="revall">Reveal all</button><button class="btn" data-act="hideall">Hide all</button></div>';
    st.notes.forEach(ni=>{const n=NOTES[ni];h+=`<div class="panel note"><h3>${esc(n[0])}</h3><p>${blankHtml(n[1])}</p></div>`;});
    h+='<div class="row"><button class="btn primary" data-act="pdump">Continue to brain dump</button></div>';
  }else if(P.ph==="dump"){
    const pts=[];st.dump.forEach(d=>DUMPS[d].p.forEach(p=>pts.push(p)));
    h+=`<div class="panel"><h3>Brain dump</h3><p class="hint">Close everything and write what you remember about this step. Then compare.</p><textarea id="ptext" placeholder="Write it in your own words...">${esc(P.text)}</textarea>`;
    if(!P.dchecked)h+='<div class="row"><button class="btn primary" data-act="pcheck">Compare with key points</button></div>';
    else{const got=pts.filter((_,i)=>P.ticks[i]).length;
      h+=`<div class="lab">Tick what you included</div><div class="pts">${pts.map((p,i)=>`<label><input type="checkbox" data-act="ptick" data-i="${i}"${P.ticks[i]?" checked":""}><span>${esc(p)}</span></label>`).join("")}</div><div class="row"><b>${got} of ${pts.length} covered</b><button class="btn primary" data-act="pfinish">Finish this step</button></div>`;}
    h+="</div>";
  }else{
    const ids=stepIds(st),m=ids.filter(i=>(store.box[i]||0)>=2).length;
    h+=`<div class="panel"><h3>Step ${P.step+1} complete</h3><p>${m} of ${ids.length} cards in this step are at Review or Mastered. The rest keep coming back in Recall cards.</p><div class="row">${P.step+1<STEPS.length?`<button class="btn primary" data-act="pnextstep">Next: ${esc(STEPS[P.step+1].t)}</button>`:""}<button class="btn" data-act="pback">All steps</button></div></div>`;
  }
  return '<div style="display:flex;flex-direction:column;gap:16px">'+h+"</div>";
}

/* ============ EVALUATE ============ */
function countOf(k){return BANK.filter(b=>b.t===k).length;}
function viewEval(){
  if(S.ev.view==="setup")return evalSetup();
  if(S.ev.view==="quiz")return evalQuiz();

function evalSetup(){
  let h='<div class="panel"><h2>Build a test</h2><p class="hint">Choose the question types. Written answers (short, long, scenario) are self-marked against the key points, like checking your own paper.</p><div style="display:flex;flex-direction:column;gap:8px">';
  TYPES.forEach(t=>{h+=`<div class="tcount"><label><input type="checkbox" data-act="etype" data-v="${t.k}"${S.ev.types[t.k]?" checked":""}><span>${esc(t.n)}</span></label><span class="n">${countOf(t.k)} Qs · ${t.m} mark${t.m>1?"s":""} each</span></div>`;});
  const pool=BANK.filter(b=>S.ev.types[b.t]).length;
  h+=`</div><div class="row"><label for="en" class="lab">Length</label><select id="en" style="width:auto"><option value="10"${S.ev.n==10?" selected":""}>10 questions</option><option value="20"${S.ev.n==20?" selected":""}>20 questions</option><option value="35"${S.ev.n==35?" selected":""}>35 questions</option><option value="0"${S.ev.n==0?" selected":""}>Everything selected (${pool})</option></select></div><div class="row"><button class="btn primary" data-act="estart"${pool?"":" disabled"}>Start test</button></div></div>`;
  if(store.hist.length){
    h+='<div class="panel"><h3>Recent tests</h3>'+store.hist.slice(0,6).map(x=>`<div class="row" style="justify-content:space-between"><span>${esc(x.d)} · ${x.n} questions</span><b>${x.pct}%</b></div>`).join("")+"</div>";
  }
  return '<div style="display:flex;flex-direction:column;gap:18px">'+h+"</div>";

function startRun(list){
  const qs=list.map(q=>q.t==="mcq"?Object.assign({},q,{o:shuffle(q.opts.map((t,i)=>({t:t,c:i===q.a})))}):q);
  S.run={qs:qs,i:0,res:[],stage:[],ticks:[],text:[]};S.ev.view="quiz";render();window.scrollTo(0,0);
}
function evalQuiz(){
  const r=S.run,q=r.qs[r.i],res=r.res[r.i],T=TM[q.t];
  let h=`<div class="panel"><div class="row" style="justify-content:space-between"><span class="tag">${esc(T.n)}</span><span class="lab">Question ${r.i+1} of ${r.qs.length} · ${T.m} mark${T.m>1?"s":""}</span></div><div class="bar" aria-hidden="true"><i style="width:${Math.round(r.i/r.qs.length*100)}%"></i></div>`;
  h+=`<h3 style="font-size:1.2rem;line-height:1.35">${esc(q.t==="fill"?q.q.replace("___","_______"):q.q)}</h3>`;
  if(q.t==="calc"&&q.src)h+='<pre class="codeview">'+esc(q.src)+'</pre>';
  if(q.t==="mcq"){
    h+='<div class="opts">'+q.o.map((o,i)=>{let c="opt";if(res){if(o.c)c+=" right";else if(res.pick===i)c+=" wrong";}return `<button class="${c}" data-act="mcq" data-i="${i}"${res?" disabled":""}>${esc(o.t)}</button>`;}).join("")+"</div>";
    if(res)h+=`<div class="fb ${res.score?"ok":"no"}"><b>${res.score?"Correct.":"Not quite."}</b> ${esc(q.e)}</div>`;
  }else if(q.t==="tf"){
    h+='<div class="opts">'+[true,false].map(v=>{let c="opt";if(res){if(q.a===v)c+=" right";else if(res.pick===v)c+=" wrong";}return `<button class="${c}" data-act="tf" data-v="${v}"${res?" disabled":""}>${v?"True":"False"}</button>`;}).join("")+"</div>";
    if(res)h+=`<div class="fb ${res.score?"ok":"no"}"><b>${res.score?"Correct.":"Not quite."}</b> ${esc(q.e)}</div>`;
  }else if(q.t==="fill"||q.t==="vsa"||q.t==="calc"){
    h+=`<input type="text" id="ans" autocomplete="off" placeholder="Type your answer" value="${esc(r.text[r.i]||"")}"${res?" disabled":""}>`;
    if(!res)h+='<div class="row"><button class="btn primary" data-act="check">Check</button></div>';
    else{
      h+=`<div class="fb ${res.score?"ok":"no"}"><b>${res.score?"Correct.":"Model answer:"}</b> ${res.score?"":esc(q.model)} ${q.e?esc(q.e):""}</div>`;
      if(!res.score)h+='<div class="row"><button class="btn" data-act="override">I was right, count it</button></div>';
    }
  }else{
    const st=r.stage[r.i]||0;
    h+=`<textarea id="wtext" placeholder="Write your answer as you would in the exam..."${st?" disabled":""}>${esc(r.text[r.i]||"")}</textarea>`;
    if(!st)h+='<div class="row"><button class="btn primary" data-act="reveal">Show model answer</button></div>';
    else{
      const tk=r.ticks[r.i]||{};const got=q.pts.filter((_,i)=>tk[i]).length;
      h+=`<div class="lab">Model answer</div><div class="a" style="border-left:3px solid var(--accent);padding-left:14px">${esc(q.model)}</div><div class="lab">Tick every marking point your answer made</div><div class="pts">`+q.pts.map((p,i)=>`<label><input type="checkbox" data-act="wtick" data-i="${i}"${tk[i]?" checked":""}${res?" disabled":""}><span>${esc(p)}</span></label>`).join("")+"</div>";
      if(!res)h+=`<div class="row"><button class="btn primary" data-act="wsave">Save score (${fmt(got/q.pts.length*T.m)} of ${T.m})</button></div>`;
      else h+=`<div class="fb ${res.score>=T.m?"ok":"no"}">Scored ${fmt(res.score)} of ${T.m}.</div>`;
    }
  }
  if(res){h+=`<div class="row"><button class="btn primary" data-act="next">${r.i+1<r.qs.length?"Next question":"See results"}</button></div>`;}
  return h+"</div>";
}
function fmt(x){return (Math.round(x*2)/2).toString();}
function setRes(score,extra){const r=S.run,q=r.qs[r.i];r.res[r.i]=Object.assign({score:score,max:TM[q.t].m},extra||{});render();}
function evalResult(){
  const r=S.run;let sc=0,mx=0;const by={};
  r.qs.forEach((q,i)=>{const x=r.res[i]||{score:0,max:TM[q.t].m};sc+=x.score;mx+=x.max;const b=by[q.t]||(by[q.t]={s:0,m:0,n:0});b.s+=x.score;b.m+=x.max;b.n++;});
  const pct=Math.round(sc/mx*100);
  const msg=pct>=85?"Exam ready on this material.":pct>=65?"Solid. Revisit the misses below.":pct>=40?"Getting there. Use the Learn section on the weak topics.":"Go back to the recall cards, then try again.";
  let h=`<div class="panel"><div class="lab">Result</div><div class="score">${fmt(sc)} / ${mx} <span style="font-size:1.5rem;color:var(--muted)">${pct}%</span></div><p>${msg}</p><div style="display:flex;flex-direction:column;gap:10px">`;
  TYPES.forEach(t=>{const b=by[t.k];if(!b)return;const p=Math.round(b.s/b.m*100);h+=`<div><div class="row" style="justify-content:space-between"><span>${esc(t.n)} (${b.n})</span><b>${fmt(b.s)}/${b.m}</b></div><div class="bar"><i style="width:${p}%"></i></div></div>`;});
  const missed=r.qs.filter((q,i)=>(r.res[i]||{score:0}).score<TM[q.t].m).length;
  h+=`</div><div class="row">${missed?`<button class="btn primary" data-act="retry">Retry the ${missed} missed</button>`:""}<button class="btn" data-act="newtest">New test</button></div></div>`;
  h+="<h2>Review</h2>";
  r.qs.forEach((q,i)=>{const x=r.res[i]||{score:0,max:TM[q.t].m};const ok=x.score>=x.max;
    let ans=q.t==="mcq"?q.opts[q.a]:q.t==="tf"?(q.a?"True":"False"):q.model;
    h+=`<div class="rev ${ok?"ok":"bad"}"><div class="lab">${esc(TM[q.t].n)} · ${fmt(x.score)}/${x.max}</div><b>${esc(q.q)}</b>${x.resp?`<div class="r">You: ${esc(x.resp)}</div>`:""}<div class="r">${ok?"":"Answer: "}${esc(ans)}</div></div>`;});
  return '<div style="display:flex;flex-direction:column;gap:14px">'+h+"</div>";
}
function finishRun(){
  const r=S.run;let sc=0,mx=0;r.qs.forEach((q,i)=>{const x=r.res[i]||{score:0,max:TM[q.t].m};sc+=x.score;mx+=x.max;});
  if(!r.retry){store.hist.unshift({d:new Date().toLocaleDateString(undefined,{day:"numeric",month:"short"}),pct:Math.round(sc/mx*100),n:r.qs.length});store.hist=store.hist.slice(0,8);save();}
  S.ev.view="result";
}

/* ============ EVENTS ============ */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");if(!el)return;
  const a=el.dataset.act,v=el.dataset.v;
  switch(a){
    case "tab":S.tab=v;render();break;
    case "lv":S.lv=v;render();break;
    case "csec":S.cards.sec=+v;buildQueue();render();break;
    case "flip":S.cards.flip=true;render();break;
    case "cnext":buildQueue();render();break;
    case "creset":CARDS.forEach((k,i)=>{if(S.cards.sec<0||k[0]===S.cards.sec)delete store.box[i];});save();buildQueue();render();break;
    case "rate":{const q=S.cards.queue,id=q.shift();let b=store.box[id]||0;
      if(v==="miss"){b=1;q.splice(Math.min(3,q.length),0,id);}
      else if(v==="almost"){b=Math.max(b,1);q.push(id);}
      else{b=b<2?2:3;S.cards.done++;}
      store.box[id]=b;save();S.cards.flip=false;S.cards.guess="";render();break;}
    case "cord":S.cards.ordered=v==="1";buildQueue();render();break;
    case "pstep":openStep(+v);break;
    case "pback":S.path.step=null;render();window.scrollTo(0,0);break;
    case "pnotes":S.path.ph="primer";render();window.scrollTo(0,0);break;
    case "pstart":S.path.ph="learn";S.path.i=0;render();break;
    case "plback":if(S.path.i>0)S.path.i--;render();break;
    case "plnext":{const P=S.path,ids=stepChunks(STEPS[P.step])[P.ch];
      if(P.i+1<ids.length)P.i++;else{P.ph="recall";P.q=shuffle(ids.slice());P.flip=false;P.guess="";}
      render();break;}
    case "pflip":S.path.flip=true;render();break;
    case "prate":{const P=S.path;applyRate(P.q,v);P.flip=false;P.guess="";
      if(!P.q.length){store.path.ch[P.step]=P.ch+1;save();P.ph="roundend";}
      render();break;}
    case "pnext":{const P=S.path,N=stepChunks(STEPS[P.step]).length;
      if(P.ch+1<N){P.ch++;P.ph="learn";P.i=0;}else P.ph="gaps";
      render();window.scrollTo(0,0);break;}
    case "pdump":S.path.ph="dump";render();window.scrollTo(0,0);break;
    case "pcheck":{const t=$("#ptext");if(t)S.path.text=t.value;S.path.dchecked=true;render();break;}
    case "pfinish":store.path.done[S.path.step]=true;save();S.path.ph="done";render();window.scrollTo(0,0);break;
    case "pnextstep":openStep(S.path.step+1);break;
    case "blank":el.classList.toggle("on");break;
    case "revall":document.querySelectorAll(".blank").forEach(b=>b.classList.add("on"));break;
    case "hideall":document.querySelectorAll(".blank").forEach(b=>b.classList.remove("on"));break;
    case "mask":if(el.classList.contains("hid")){el.classList.remove("hid");el.removeAttribute("role");}break;
    case "tmode":S.tmode[el.dataset.t]=v;render();break;
    case "dtopic":S.dump={i:+v,text:"",checked:false,ticks:{}};render();break;
    case "dcheck":S.dump.checked=true;render();break;
    case "dreset":S.dump.checked=false;S.dump.ticks={};S.dump.text="";render();break;
    case "estart":{const pool=shuffle(BANK.filter(b=>S.ev.types[b.t]));const list=S.ev.n?pool.slice(0,S.ev.n):pool;
      list.sort((x,y)=>TYPES.findIndex(t=>t.k===x.t)-TYPES.findIndex(t=>t.k===y.t));startRun(list);break;}
    case "mcq":{const r=S.run,q=r.qs[r.i],i=+el.dataset.i;setRes(q.o[i].c?1:0,{pick:i,resp:q.o[i].t});break;}
    case "tf":{const r=S.run,q=r.qs[r.i],p=v==="true";setRes(p===q.a?1:0,{pick:p,resp:p?"True":"False"});break;}
    case "check":doCheck();break;
    case "override":{const r=S.run;r.res[r.i].score=TM[r.qs[r.i].t].m;render();break;}
    case "reveal":{const r=S.run;r.text[r.i]=$("#wtext").value;r.stage[r.i]=1;render();break;}
    case "wsave":{const r=S.run,q=r.qs[r.i],tk=r.ticks[r.i]||{};const got=q.pts.filter((_,i)=>tk[i]).length;setRes(Math.round(got/q.pts.length*TM[q.t].m*2)/2,{resp:r.text[r.i]||""});break;}
    case "next":{const r=S.run;if(r.i+1<r.qs.length){r.i++;render();window.scrollTo(0,0);}else{finishRun();render();window.scrollTo(0,0);}break;}
    case "retry":{const r=S.run;const list=r.qs.filter((q,i)=>(r.res[i]||{score:0}).score<TM[q.t].m);startRun(list);S.run.retry=true;break;}
    case "newtest":S.ev.view="setup";S.run=null;render();break;
    default:labClick(a,el,v);
  }
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.dataset.lsel){labSelect(el);return;}
  if(el.dataset.act==="etype"){S.ev.types[el.dataset.v]=el.checked?1:0;render();}
  else if(el.id==="en"){S.ev.n=+el.value;}
  else if(el.dataset.act==="ptick"){S.path.ticks[el.dataset.i]=el.checked;render();}
  else if(el.dataset.act==="dtick"){S.dump.ticks[el.dataset.i]=el.checked;render();}
  else if(el.dataset.act==="wtick"){const r=S.run;r.ticks[r.i]=r.ticks[r.i]||{};r.ticks[r.i][el.dataset.i]=el.checked;render();}
});
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.dataset&&(el.dataset.lin||el.dataset.tcell!==undefined)){labInput(el);return;}
  if(el.id==="guess")S.cards.guess=el.value;
  else if(el.id==="pguess")S.path.guess=el.value;
  else if(el.id==="ptext")S.path.text=el.value;
  else if(el.id==="dtext")S.dump.text=el.value;
  else if(el.id==="ans"&&S.run)S.run.text[S.run.i]=el.value;
});
function doCheck(){
  const r=S.run,q=r.qs[r.i],v=($("#ans").value||"").trim();if(!v)return;
  r.text[r.i]=v;setRes((q.t==="calc"?matchCalc(v,q):matches(v,q.acc,q.all))?TM[q.t].m:0,{resp:v});
}
document.addEventListener("keydown",e=>{
  const t=e.target,tag=t.tagName;
  if(e.key==="Enter"&&t.id==="ans"){e.preventDefault();doCheck();return;}
  if(e.key==="Enter"&&t.id==="pguess2"){e.preventDefault();const b=document.querySelector('[data-act="pcheck2"]');if(b&&!b.disabled)b.click();return;}
  if((e.key==="Enter"||e.key===" ")&&t.classList&&t.classList.contains("hid")){e.preventDefault();t.click();return;}
  const inPath=S.tab==="learn"&&S.lv==="path"&&S.path.ph==="recall"&&S.path.q.length>0;
  const inCards=S.tab==="learn"&&S.lv==="cards"&&S.cards.queue.length>0;
  if(!(inPath||inCards)||tag==="INPUT"||tag==="TEXTAREA"||tag==="SELECT")return;
  const flipped=inPath?S.path.flip:S.cards.flip;
  if((e.key===" "||e.key==="Enter")&&tag!=="BUTTON"&&!flipped){e.preventDefault();if(inPath)S.path.flip=true;else S.cards.flip=true;render();}
  else if(flipped&&"123".includes(e.key)&&e.key){const m={"1":"miss","2":"almost","3":"got"};const b=document.querySelector('[data-act$="rate"][data-v="'+m[e.key]+'"]');if(b)b.click();}
});
render();
</script>

</body></html>
