const NOTES=[
["1.1 Data structure fundamentals","{{Data}} means raw, unprocessed facts and figures with no context, such as 85, 72, 90, 65. {{Information}} is data that has been processed, organised and given a context so that it supports a decision: the same numbers labelled as marks of four students become information, and their average of 78 is more. A {{data structure}} is a particular way of organising, storing and managing data in memory so that it can be accessed, modified and processed efficiently; it defines how the data is held, which operations are allowed and how fast they run. Data structures are needed for efficient {{access}}, efficient {{change}} (insertion and deletion without rebuilding) and natural models of real relationships such as a hierarchy (a tree) or a network (a graph). A structure is described by five characteristics: the {{type of data}}, the {{relationships}} among the items, the {{operations}} it supports, the {{memory}} it uses and its {{size}} (fixed or changing). No structure wins on every row. Typical uses: array for spreadsheets and marks, stack for undo and the call stack, queue for print jobs and scheduling, tree for file systems and database indexes, graph for maps and networks."],
["1.2 Types of data structures","Data structures are classified in three ways. {{Primitive}} structures are built into the language and hold a single value (int, char, float, double, bool); {{non-primitive}} structures are built from them and hold many values (array, list, stack, queue, tree, graph). {{Linear}} structures arrange the elements in a single sequence, each with one predecessor and one successor (array, linked list, stack, queue); {{non-linear}} structures have multiple relationships (tree, graph). {{Static}} structures have a size fixed at compile time (the array); {{dynamic}} structures change size at run time through dynamic allocation (linked list, tree, graph). A stack or queue is static when built on an array and dynamic when built on a linked list. Linear describes the {{logical order}} of the items, not where they sit in memory: a linked list is linear although its nodes are scattered."],
["1.3 Array and linked list","An {{array}} stores elements of one type in {{contiguous}} memory, so the ith element is reached in {{O(1)}} by index. Inserting or deleting in the middle costs {{O(n)}} because elements must be shifted: to insert, shift right starting from the end; to delete, shift left. Its size is fixed. A {{linked list}} is a chain of nodes, each holding {{data}} and a {{next}} pointer; the pointer {{head}} holds the first node and the last node's next is {{nullptr}}. Nodes are created with new, so the size is dynamic. Access to the ith node is {{O(n)}} because the chain must be walked, but insertion or deletion at a known position is {{O(1)}}: only pointers change. The standard traversal is for (p = head; p; p = p->next). To delete a value the loop stops at the node {{before}} it, because the predecessor's next must change. A {{doubly}} linked list adds a prev pointer, so it can be walked both ways; in a {{circular}} list the last node points back to the first. Each list node costs one extra pointer; searching an unsorted collection is O(n) in both."],
["1.3 Stack and queue","A {{stack}} is a {{LIFO}} (last in, first out) structure: {{push}} adds on the top, {{pop}} removes the top and {{peek}} reads it without removing. In an array stack the index {{top}} starts at {{-1}} (empty); push increments top then stores; pop returns the element and decrements top. Pushing onto a full stack is {{overflow}}; popping an empty one is {{underflow}}. Stacks serve undo, the call stack, expression evaluation and bracket matching: for balanced brackets push each opening bracket and pop on each closing one, which must match; the expression is balanced if no mismatch occurs and the stack is empty at the end. Infix expressions are converted to postfix with an operator stack using precedence (A*(B+C)/D becomes ABC+*D/), and postfix is evaluated by pushing operands and applying each operator to the top two. A {{queue}} is {{FIFO}}: {{enqueue}} at the {{rear}} and {{dequeue}} at the {{front}}. In a simple array queue freed front slots are wasted; a {{circular queue}} wraps the indices with {{modulo}} N so freed slots are reused: rear = (front + count) % N and front = (front + 1) % N. Queues serve print jobs, scheduling, keyboard buffers and breadth-first search."],
["1.4 Tree and graph","A {{tree}} is a hierarchical non-linear structure with one {{root}} (the topmost node, no parent) and no cycles. A node with no children is a {{leaf}}; a node with at least one child is {{internal}}. The {{depth}} of a node is the number of edges from the root; the {{height}} of a tree is the number of edges on the longest root-to-leaf path. A {{binary tree}} has at most two children per node. A {{binary search tree}} keeps smaller keys in the left subtree and larger keys in the right, for whole subtrees. Traversals: {{inorder}} is left, node, right and gives sorted order on a BST; {{preorder}} is node, left, right; {{postorder}} is left, right, node. For keys 50 30 70 20 40 60 80 the inorder is 20 30 40 50 60 70 80. Searching a BST follows one path: O(log n) when balanced but O(n) when the tree is {{degenerate}}, as after inserting sorted keys. A {{graph}} is a set of {{vertices}} joined by {{edges}}; it may be directed, undirected or weighted, and may contain cycles (a tree is a graph with no cycles, but a graph is not always a tree). An adjacency list stores each vertex's neighbours. {{BFS}} visits level by level using a {{queue}}; {{DFS}} goes as deep as possible then backtracks, using a {{stack}} or recursion. For the lesson graph BFS gives A B C D E F and DFS gives A B D F E C."],
["1.5 Operations, searching, sorting, merging","The six standard operations are {{traversal}}, {{insertion}}, {{deletion}}, {{searching}}, {{sorting}} and {{merging}}. {{Linear search}} checks elements one by one: O(n), works on unsorted data. {{Binary search}} needs sorted data: compare the key with the middle element and discard the half that cannot contain it, giving O(log n); with 16 values it needs at most 5 steps. {{Bubble sort}} swaps adjacent out-of-order pairs, so after each pass the largest remaining value reaches its place; {{selection sort}} picks the minimum and places it at the front; {{insertion sort}} inserts each item into a sorted prefix; all three are {{O(n^2)}}. {{Merge sort}} and quick sort are O(n log n). {{Merging}} two sorted lists compares their front elements and copies the smaller, then copies the leftover of the other list: O(n). Merging 2 5 9 14 with 1 5 8 20 25 gives 1 2 5 5 8 9 14 20 25."],
["1.6 Algorithms, flowcharts and pseudocode","An {{algorithm}} is a finite sequence of well-defined steps that solves a problem or performs a computation. A good algorithm is {{correct}}, {{finite}}, {{definite}}, {{effective}}, has clearly specified {{input and output}} and is {{efficient}}. A data structure organises the data; an algorithm supplies the logic that works on it. A {{flowchart}} is a diagram of an algorithm: an {{oval}} for start and end, a {{rectangle}} for a process, a {{diamond}} for a decision, a {{parallelogram}} for input and output, joined by arrows. {{Pseudocode}} is a structured, English-like description of an algorithm; it is not executable but is easy to translate into any language. The largest of three numbers is found by setting max to the first, then replacing it by the second and the third if they are greater."],
["1.7 Time and space complexity","{{Time complexity}} says how running time grows with input size n; {{space complexity}} says how memory grows. Both are written in {{Big-O}} notation, which gives the {{worst-case}} growth rate and ignores constant factors, so 3n + 7 and 100n are both O(n). The common classes from fastest to slowest are {{O(1)}} constant, {{O(log n)}} logarithmic, {{O(n)}} linear, {{O(n log n)}} linearithmic, {{O(n^2)}} quadratic and {{O(2^n)}} exponential. Doubling n roughly quadruples the time of an O(n^2) algorithm; a halving loop such as i *= 2 runs about log n times (7 times for 64); three nested loops over n are O(n^3), not O(3n). Naive recursive Fibonacci makes 177, 21891 and 2692537 calls for n = 10, 20, 30. Complexity of key operations: array access O(1), search O(n), insert and delete O(n); linked list access O(n), insert and delete O(1) at a known position; stack and queue operations O(1); balanced BST O(log n) for all four."]
];

int prec(char c) { return (c == '*' || c == '/') ? 2 : (c == '+' || c == '-') ? 1 : 0; }

string toPostfix(const string& in) {
    string out; char st[100]; int top = -1;
    for (char c : in) {
        if (isalnum(c)) out += c;
        else if (c == '(') st[++top] = c;
        else if (c == ')') {
            while (top >= 0 && st[top] != '(') out += st[top--];
            top--;                                  // discard '('
        } else {
            while (top >= 0 && prec(st[top]) >= prec(c)) out += st[top--];
            st[++top] = c;
        }
    }
    while (top >= 0) out += st[top--];
    return out;
}

int evalPostfix(const string& p) {
    int st[100], top = -1;
    for (char c : p) {
        if (isdigit(c)) st[++top] = c - '0';
        else {
            int b = st[top--], a = st[top--];
            st[++top] = (c == '+') ? a + b : (c == '-') ? a - b : (c == '*') ? a * b : a / b;
        }
    }
    return st[top];
}

class CQueue {
    int a[N], front = 0, count = 0;
public:

        if (count == N) return false;             // full
        a[(front + count) % N] = v;               // rear wraps round

    bool dequeue(int& v) {
        if (count == 0) return false;             // empty
        v = a[front];
        front = (front + 1) % N;
        count--;
        return true;
    }
};

using namespace std;

struct Node {
    int data;
    Node* next;
};

void show(Node* h) {
    for (Node* p = h; p != nullptr; p = p->next) cout << p->data << " -> ";
    cout << "nullptr\n";

Node* addFront(Node* h, int v) { return new Node{v, h}; }

Node* addEnd(Node* h, int v) {
    Node* n = new Node{v, nullptr};
    if (h == nullptr) return n;
    Node* p = h;
    while (p->next != nullptr) p = p->next;
    p->next = n;
    return h;
}

Node* removeValue(Node* h, int v) {
    if (h == nullptr) return nullptr;
    if (h->data == v) { Node* t = h->next; delete h; return t; }
    Node* p = h;
    while (p->next && p->next->data != v) p = p->next;
    if (p->next) { Node* t = p->next; p->next = t->next; delete t; }
    return h;
}

    head = addFront(head, 10);

    head = removeValue(head, 30);
    show(head);
    head = removeValue(head, 10);
    show(head);

    Node *prev = nullptr, *cur = head;   // reverse the list
    while (cur) { Node* nx = cur->next; cur->next = prev; prev = cur; cur = nx; }

    show(head);

 {h:"Infix to postfix and evaluation",d:"An operator stack with precedence converts infix to postfix; an operand stack evaluates it.",code:{c:R`#include <iostream>
#include <string>
using namespace std;

int prec(char c) { return (c == '*' || c == '/') ? 2 : (c == '+' || c == '-') ? 1 : 0; }

string toPostfix(const string& in) {
    string out; char st[100]; int top = -1;
    for (char c : in) {
        if (isalnum(c)) out += c;
        else if (c == '(') st[++top] = c;
        else if (c == ')') {
            while (top >= 0 && st[top] != '(') out += st[top--];
            top--;                                  // discard '('
        } else {
            while (top >= 0 && prec(st[top]) >= prec(c)) out += st[top--];
            st[++top] = c;
        }
    }
    while (top >= 0) out += st[top--];
    return out;
}

int evalPostfix(const string& p) {
    int st[100], top = -1;
    for (char c : p) {
        if (isdigit(c)) st[++top] = c - '0';
        else {
            int b = st[top--], a = st[top--];
            st[++top] = (c == '+') ? a + b : (c == '-') ? a - b : (c == '*') ? a * b : a / b;
        }
    }
    return st[top];
}

int main() {
    cout << toPostfix("A+B*C")     << "\n";
    cout << toPostfix("(A+B)*C")   << "\n";
    cout << toPostfix("A*B+C/D")   << "\n";

using namespace std;

const int N = 4;                      // capacity of the circular queue

class CQueue {
    int a[N], front = 0, count = 0;
public:
    bool enqueue(int v) {
        if (count == N) return false;             // full
        a[(front + count) % N] = v;               // rear wraps round
        count++;
        return true;
    }
    bool dequeue(int& v) {
        if (count == 0) return false;             // empty
        v = a[front];
        front = (front + 1) % N;
        count--;
        return true;
    }
};

int main() {
    CQueue q; int v;
    for (int x = 1; x <= 5; x++)
        cout << "enqueue " << x << ": " << (q.enqueue(x) ? "ok" : "FULL") << "\n";
    q.dequeue(v); cout << "dequeued " << v << "\n";
    q.dequeue(v); cout << "dequeued " << v << "\n";
    cout << "enqueue 6: " << (q.enqueue(6) ? "ok" : "FULL") << "\n";
    cout << "enqueue 7: " << (q.enqueue(7) ? "ok" : "FULL") << "\n";

 {h:"Linear and binary search",d:"Both searches count their steps on 16 sorted values. Binary search needs at most 5 steps.",t:T[16],code:{c:R`#include <iostream>
using namespace std;

int linearSearch(int a[], int n, int key, int& steps) {
    for (int i = 0; i < n; i++) { steps++; if (a[i] == key) return i; }
    return -1;
}
int binarySearch(int a[], int n, int key, int& steps) {
    int lo = 0, hi = n - 1;
    while (lo <= hi) {
        steps++;
        int mid = (lo + hi) / 2;
        if (a[mid] == key) return mid;
        if (a[mid] < key) lo = mid + 1; else hi = mid - 1;
    }
    return -1;
}

int main() {
    int a[16];
    for (int i = 0; i < 16; i++) a[i] = 5 * (i + 1);     // 5,10,...,80
    int key[] = {80, 35, 99};
    for (int k : key) {
        int s1 = 0, s2 = 0;
        int p1 = linearSearch(a, 16, k, s1);
        int p2 = binarySearch(a, 16, k, s2);
        cout << "key " << k << ": linear idx " << p1 << " in " << s1
             << " steps, binary idx " << p2 << " in " << s2 << " steps\n";

}`,tr:"Search for 5 and compare the step counts."}},

using namespace std;

void show(int a[], int n) { for (int i = 0; i < n; i++) cout << a[i] << " "; }

int main() {
    int a[] = {5, 1, 4, 2, 8};
    int n = 5;
    cout << "Bubble sort\nstart:  "; show(a, n); cout << "\n";
    for (int pass = 1; pass < n; pass++) {
        for (int j = 0; j < n - pass; j++)
            if (a[j] > a[j + 1]) swap(a[j], a[j + 1]);
        cout << "pass " << pass << ": "; show(a, n); cout << "\n";
    }
    int b[] = {64, 25, 12, 22, 11};
    cout << "\nSelection sort\nstart: "; show(b, n); cout << "\n";
    for (int i = 0; i < n - 1; i++) {
        int m = i;
        for (int j = i + 1; j < n; j++) if (b[j] < b[m]) m = j;
        swap(b[i], b[m]);
        cout << "pass " << i + 1 << ": "; show(b, n); cout << "\n";
    }
    int c[] = {12, 11, 13, 5, 6};
    cout << "\nInsertion sort\nstart: "; show(c, n); cout << "\n";
    for (int i = 1; i < n; i++) {
        int key = c[i], j = i - 1;
        while (j >= 0 && c[j] > key) { c[j + 1] = c[j]; j--; }
        c[j + 1] = key;
        cout << "pass " << i << ": "; show(c, n); cout << "\n";
    }
}`,tr:"Change the data so that it is already sorted and look at the bubble passes."}},

function runCpp(src,inp){
  const r=fnRun(src,(inp||"").replace(/\\n/g,"\n"));
  if(r.ok&&r.warn&&r.warn.length)r.note=r.warn.join("; ");

}
function outHtml(r){
  if(!r)return '<p class="hint">Press Run to execute the program. Output appears here.</p>';
  let h="";
  if(r.ok){h+='<pre class="outpre">'+(r.out?esc(r.out):'<span class="dim">(no output)</span>')+'</pre>'+(r.note?'<div class="rs note"><b>Warning.</b> '+esc(r.note)+'</div>':'')+'<div class="rs ok">Finished normally (exit code '+r.code+')</div>';}
  else{if(r.out)h+='<pre class="outpre">'+esc(r.out)+'</pre>';h+='<div class="rs '+r.cls+'"><b>'+esc(r.title)+'.</b> '+esc(r.detail)+'</div>';}
  return h+diskHtml(r);
}
function diskHtml(r){
  if(!r||!r.files||!r.files.length)return "";
  const rows=r.files.map(f=>{const b=f.bytes;const pr=b.every(c=>c===10||c===13||c===9||(c>=32&&c<127));let pv;
    if(pr)pv=esc(String.fromCharCode.apply(null,b.slice(0,160))).replace(/\n/g,"&crarr;<br>")+(b.length>160?" ...":"");
    else pv=b.slice(0,48).map(c=>c.toString(16).padStart(2,"0")).join(" ")+(b.length>48?" ...":"");
    return '<tr><td class="mono">'+esc(f.name)+'</td><td>'+b.length+' bytes</td><td class="mono">'+pv+'</td></tr>';}).join("");
  return '<div class="rs note"><b>Disk after the run.</b> The files the program left behind (text shown as characters, binary as hexadecimal bytes).</div><div class="tblwrap"><table class="tbl"><thead><tr><th>File</th><th>Size</th><th>Contents</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}

/* ---------- Stack and queue tracer ---------- */
function sqRes(){
  const cap=parseInt(L.tn);
  if(isNaN(cap)||cap<1||cap>20)return '<div class="rs bad">Capacity must be a whole number from 1 to 20.</div>';
  const ops=String(L.to).split(",").map(x=>x.trim()).filter(x=>x);
  if(!ops.length)return '<div class="rs bad">Enter some operations, separated by commas.</div>';
  const stack=L.tk==="stack";
  let st=[],q=new Array(cap).fill(null),front=0,cnt=0,rows=[],out=[];
  for(const op of ops){
    const m=op.toLowerCase().match(/^(push|pop|peek|enqueue|enq|dequeue|deq)\s*(-?\d+)?$/);
    if(!m){rows.push([op,"not understood (use push 5, pop, peek, enqueue 4, dequeue)",""]);continue;}
    const o=m[1],v=m[2]===undefined?null:+m[2];let res="";
    if(stack){
      if(o==="push"){if(v===null)res="push needs a value";else if(st.length===cap)res="overflow: "+v+" not pushed";else{st.push(v);res="pushed "+v+", top = "+(st.length-1);}}
      else if(o==="pop"){if(!st.length)res="underflow";else{const x=st.pop();out.push(x);res="popped "+x+", top = "+(st.length-1);}}
      else if(o==="peek"){res=st.length?"top element is "+st[st.length-1]+" (not removed)":"stack is empty";}
      else res="a stack uses push, pop and peek";
      rows.push([op,res,st.length?st.join(" ")+"  (top is the last)":"empty"]);
    }else{
      if(o==="enqueue"||o==="enq"){if(v===null)res="enqueue needs a value";else if(cnt===cap)res="FULL: "+v+" not added";else{const i=(front+cnt)%cap;q[i]=v;cnt++;res="stored at index "+i+" = ("+front+" + "+(cnt-1)+") % "+cap;}}
      else if(o==="dequeue"||o==="deq"){if(!cnt)res="EMPTY";else{const x=q[front];out.push(x);q[front]=null;front=(front+1)%cap;cnt--;res="removed "+x+", front = "+front;}}
      else res="a queue uses enqueue and dequeue";
      const items=[];for(let i=0;i<cnt;i++)items.push(q[(front+i)%cap]);
      rows.push([op,res,(items.length?items.join(" "):"empty")+"   array: ["+q.map(x=>x===null?"_":x).join(" ")+"]"]);
    }
  }
  return '<div class="rs ok"><b>'+(stack?"Stack (last in, first out)":"Circular queue (first in, first out)")+'.</b> Removed so far: '+(out.length?out.join(", "):"nothing")+".</div>"+tbl(["Operation","Result",stack?"Stack, bottom to top":"Queue, front first"],rows);
}

/* ---------- BST builder ---------- */
function bstBuild(keys){
  let root=null;
  for(const k of keys){const n={k:k,l:null,r:null};if(!root){root=n;continue;}let p=root;for(;;){if(k===p.k)break;if(k<p.k){if(p.l)p=p.l;else{p.l=n;break;}}else{if(p.r)p=p.r;else{p.r=n;break;}}}}
  return root;
}
function bstRes(){
  const keys=numList(L.bk);
  if(!keys.length||keys.some(isNaN)||keys.length>15)return '<div class="rs bad">Enter 1 to 15 whole numbers separated by commas.</div>';
  const root=bstBuild(keys);const ino=[],pre=[],post=[];
  (function t(n){if(!n)return;pre.push(n.k);t(n.l);ino.push(n.k);t(n.r);post.push(n.k);})(root);
  const ht=n=>n?1+Math.max(ht(n.l),ht(n.r)):-1;const h=ht(root);
  const levels=[];(function g(n,d){if(!n)return;(levels[d]=levels[d]||[]).push(n.k);g(n.l,d+1);g(n.r,d+1);})(root,0);
  const leaves=[];(function lf(n){if(!n)return;if(!n.l&&!n.r)leaves.push(n.k);lf(n.l);lf(n.r);})(root);
  const count=ino.length,degenerate=count>2&&h===count-1;
  const rows=[["Inorder (left, node, right)",ino.join(" ")],["Preorder (node, left, right)",pre.join(" ")],["Postorder (left, right, node)",post.join(" ")],["Root",String(root.k)],["Leaves",leaves.join(" ")],["Height (edges)",String(h)],["By level (depth 0, 1, ...)",levels.map((l,i)=>i+": "+l.join(" ")).join("   ")],["Shape",degenerate?"degenerate: a chain, so searching is O(n)":h<=Math.floor(Math.log2(count))+1?"close to balanced: searching is about O(log n)":"uneven"]];
  if(count<keys.length)rows.push(["Note","duplicate keys were ignored"]);
  return '<div class="rs ok"><b>Inorder of a BST is always sorted.</b> Keys inserted in this order: '+esc(keys.join(", "))+".</div>"+tbl(["Property","Value"],rows);
}

/* ---------- Sorting tracer ---------- */
function sortRes(){
  const a=numList(L.sa);
  if(a.length<2||a.length>12||a.some(isNaN))return '<div class="rs bad">Enter 2 to 12 whole numbers separated by commas.</div>';
  const rows=[];let cmp=0,swp=0;const n=a.length;const A=a.slice();
  if(L.sk==="bubble"){
    for(let p=1;p<n;p++){let sw=0;for(let i=0;i<n-p;i++){cmp++;if(A[i]>A[i+1]){const t=A[i];A[i]=A[i+1];A[i+1]=t;swp++;sw++;}}rows.push(["Pass "+p,A.join(" "),sw+" swap"+(sw===1?"":"s")]);if(!sw)break;}
  }else if(L.sk==="selection"){
    for(let p=0;p<n-1;p++){let m=p;for(let i=p+1;i<n;i++){cmp++;if(A[i]<A[m])m=i;}if(m!==p){const t=A[p];A[p]=A[m];A[m]=t;swp++;}rows.push(["Pass "+(p+1),A.join(" "),"minimum "+A[p]+" placed at index "+p]);}
  }else{
    for(let i=1;i<n;i++){const x=A[i];let j=i-1;while(j>=0){cmp++;if(A[j]>x){A[j+1]=A[j];swp++;j--;}else break;}A[j+1]=x;rows.push(["Insert "+x,A.join(" "),"sorted prefix of "+(i+1)]);}
  }
  return '<div class="rs ok"><b>'+esc({bubble:"Bubble sort",selection:"Selection sort",insertion:"Insertion sort"}[L.sk])+"</b> of "+esc(a.join(" "))+": "+cmp+" comparisons, "+swp+" "+(L.sk==="insertion"?"shifts":"swaps")+". All three are O(n^2).</div>"+tbl(["Step","Array afterwards","Detail"],[["Start",a.join(" "),""]].concat(rows));
}

function bsRes(){
  const a=numList(L.ba),key=parseInt(L.bq);
  if(a.length<1||a.length>32||a.some(isNaN)||isNaN(key))return '<div class="rs bad">Enter 1 to 32 whole numbers and a whole-number key.</div>';
  const sorted=a.every((x,i)=>i===0||a[i-1]<=x);
  let lo=0,hi=a.length-1,rows=[],pos=-1,steps=0;
  while(lo<=hi){const mid=Math.floor((lo+hi)/2);steps++;const v=a[mid];let d;
    if(v===key){d="equal: found";pos=mid;}else if(v<key)d="less than "+key+": lo = "+(mid+1);else d="greater than "+key+": hi = "+(mid-1);
    rows.push([String(steps),lo+" to "+hi,String(mid),String(v),d]);if(pos>=0)break;if(v<key)lo=mid+1;else hi=mid-1;}
  let lin=0;for(let i=0;i<a.length;i++){lin++;if(a[i]===key)break;}
  const warn=sorted?"":'<div class="rs bad"><b>The data is not sorted.</b> Binary search gives unreliable answers on unsorted data.</div>';
  return warn+'<div class="rs ok"><b>'+(pos>=0?"Found at index "+pos+" in "+steps+" step"+(steps===1?"":"s"):"Not found after "+steps+" step"+(steps===1?"":"s"))+".</b> Linear search would take "+lin+" step"+(lin===1?"":"s")+" (for "+a.length+" values binary search needs at most "+(Math.floor(Math.log2(a.length))+1)+").</div>"+tbl(["Step","lo to hi","mid","a[mid]","Decision"],rows);
}

  if(isNaN(n)||n<1||n>1000000)return '<div class="rs bad">Enter a whole number from 1 to 1000000.</div>';
  const lg=Math.floor(Math.log2(n))+1;
  const big=x=>x>1e15?x.toExponential(1).replace("e+","e"):String(Math.round(x));
  const e2=n<=50?String(Math.pow(2,n)):"about 10^"+Math.round(n*Math.log10(2));
  let loop=0;for(let i=1;i<=n;i*=2)loop++;
  const rows=[["O(1)","1","1"],["O(log n)",String(lg),String(Math.floor(Math.log2(2*n))+1)],["O(n)",String(n),String(2*n)],["O(n log n)",big(n*Math.log2(Math.max(n,1))),big(2*n*Math.log2(2*n))],["O(n^2)",big(n*n),big(4*n*n)],["O(2^n)",e2,n+1<=50?String(Math.pow(2,n+1)):"about 10^"+Math.round((n+1)*Math.log10(2))]];
  return '<div class="rs ok"><b>Doubling n</b> adds one step to O(log n), doubles O(n), quadruples O(n^2) and squares O(2^n). The loop for (i = 1; i <= '+n+'; i *= 2) runs '+loop+" times.</div>"+tbl(["Class","Steps for n = "+n,"Steps for n = "+2*n],rows);
}

function evalResult(){
  const r=S.run;let sc=0,mx=0;const by={};
  r.qs.forEach((q,i)=>{const x=r.res[i]||{score:0,max:TM[q.t].m};sc+=x.score;mx+=x.max;const b=by[q.t]||(by[q.t]={s:0,m:0,n:0});b.s+=x.score;b.m+=x.max;b.n++;});
  const pct=Math.round(sc/mx*100);
  const msg=pct>=85?"Exam ready on this material.":pct>=65?"Solid. Revisit the misses below.":pct>=40?"Getting there. Use the Learn section on the weak topics.":"Go back to the recall cards, then try again.";
  let h=`<div class="panel"><div class="lab">Result</div><div class="score">${fmt(sc)} / ${mx} <span style="font-size:1.5rem;color:var(--muted)">${pct}%</span></div><p>${msg}</p><div style="display:flex;flex-direction:column;gap:10px">`;
  TYPES.forEach(t=>{const b=by[t.k];if(!b)return;const p=Math.round(b.s/b.m*100);h+=`<div><div class="row" style="justify-content:space-between"><span>${esc(t.n)} (${b.n})</span><b>${fmt(b.s)}/${b.m}</b></div><div class="bar"><i style="width:${p}%"></i></div></div>`;});
  const missed=r.qs.filter((q,i)=>(r.res[i]||{score:0}).score<TM[q.t].m).length;
  h+=`</div><div class="row">${missed?`<button class="btn primary" data-act="retry">Retry the ${missed} missed</button>`:""}<button class="btn" data-act="newtest">New test</button></div></div>`;
  h+="<h2>Review</h2>";
  r.qs.forEach((q,i)=>{const x=r.res[i]||{score:0,max:TM[q.t].m};const ok=x.score>=x.max;
    let ans=q.t==="mcq"?q.opts[q.a]:q.t==="tf"?(q.a?"True":"False"):q.model;
    h+=`<div class="rev ${ok?"ok":"bad"}"><div class="lab">${esc(TM[q.t].n)} · ${fmt(x.score)}/${x.max}</div><b>${esc(q.q)}</b>${x.resp?`<div class="r">You: ${esc(x.resp)}</div>`:""}<div class="r">${ok?"":"Answer: "}${esc(ans)}</div></div>`;});
  return '<div style="display:flex;flex-direction:column;gap:14px">'+h+"</div>";
}
function finishRun(){
  const r=S.run;let sc=0,mx=0;r.qs.forEach((q,i)=>{const x=r.res[i]||{score:0,max:TM[q.t].m};sc+=x.score;mx+=x.max;});
  if(!r.retry){store.hist.unshift({d:new Date().toLocaleDateString(undefined,{day:"numeric",month:"short"}),pct:Math.round(sc/mx*100),n:r.qs.length});store.hist=store.hist.slice(0,8);save();}
  S.ev.view="result";
}

/* ============ EVENTS ============ */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");if(!el)return;
  const a=el.dataset.act,v=el.dataset.v;
  switch(a){
    case "tab":S.tab=v;render();break;
    case "lv":S.lv=v;render();break;
    case "csec":S.cards.sec=+v;buildQueue();render();break;
    case "flip":S.cards.flip=true;render();break;
    case "cnext":buildQueue();render();break;
    case "creset":CARDS.forEach((k,i)=>{if(S.cards.sec<0||k[0]===S.cards.sec)delete store.box[i];});save();buildQueue();render();break;
    case "rate":{const q=S.cards.queue,id=q.shift();let b=store.box[id]||0;
      if(v==="miss"){b=1;q.splice(Math.min(3,q.length),0,id);}
      else if(v==="almost"){b=Math.max(b,1);q.push(id);}
      else{b=b<2?2:3;S.cards.done++;}
      store.box[id]=b;save();S.cards.flip=false;S.cards.guess="";render();break;}
    case "cord":S.cards.ordered=v==="1";buildQueue();render();break;
    case "pstep":openStep(+v);break;
    case "pback":S.path.step=null;render();window.scrollTo(0,0);break;
    case "pnotes":S.path.ph="primer";render();window.scrollTo(0,0);break;
    case "pstart":S.path.ph="learn";S.path.i=0;render();break;
    case "plback":if(S.path.i>0)S.path.i--;render();break;
    case "plnext":{const P=S.path,ids=stepChunks(STEPS[P.step])[P.ch];
      if(P.i+1<ids.length)P.i++;else{P.ph="recall";P.q=shuffle(ids.slice());P.flip=false;P.guess="";}
      render();break;}
    case "pflip":S.path.flip=true;render();break;
    case "prate":{const P=S.path;applyRate(P.q,v);P.flip=false;P.guess="";
      if(!P.q.length){store.path.ch[P.step]=P.ch+1;save();P.ph="roundend";}
      render();break;}
    case "pnext":{const P=S.path,N=stepChunks(STEPS[P.step]).length;
      if(P.ch+1<N){P.ch++;P.ph="learn";P.i=0;}else P.ph="gaps";
      render();window.scrollTo(0,0);break;}
    case "pdump":S.path.ph="dump";render();window.scrollTo(0,0);break;
    case "pcheck":{const t=$("#ptext");if(t)S.path.text=t.value;S.path.dchecked=true;render();break;}
    case "pfinish":store.path.done[S.path.step]=true;save();S.path.ph="done";render();window.scrollTo(0,0);break;
    case "pnextstep":openStep(S.path.step+1);break;
    case "blank":el.classList.toggle("on");break;
    case "revall":document.querySelectorAll(".blank").forEach(b=>b.classList.add("on"));break;
    case "hideall":document.querySelectorAll(".blank").forEach(b=>b.classList.remove("on"));break;
    case "mask":if(el.classList.contains("hid")){el.classList.remove("hid");el.removeAttribute("role");}break;
    case "tmode":S.tmode[el.dataset.t]=v;render();break;
    case "dtopic":S.dump={i:+v,text:"",checked:false,ticks:{}};render();break;
    case "dcheck":S.dump.checked=true;render();break;
    case "dreset":S.dump.checked=false;S.dump.ticks={};S.dump.text="";render();break;
    case "estart":{const pool=shuffle(BANK.filter(b=>S.ev.types[b.t]));const list=S.ev.n?pool.slice(0,S.ev.n):pool;
      list.sort((x,y)=>TYPES.findIndex(t=>t.k===x.t)-TYPES.findIndex(t=>t.k===y.t));startRun(list);break;}
    case "mcq":{const r=S.run,q=r.qs[r.i],i=+el.dataset.i;setRes(q.o[i].c?1:0,{pick:i,resp:q.o[i].t});break;}
    case "tf":{const r=S.run,q=r.qs[r.i],p=v==="true";setRes(p===q.a?1:0,{pick:p,resp:p?"True":"False"});break;}
    case "check":doCheck();break;
    case "override":{const r=S.run;r.res[r.i].score=TM[r.qs[r.i].t].m;render();break;}
    case "reveal":{const r=S.run;r.text[r.i]=$("#wtext").value;r.stage[r.i]=1;render();break;}
    case "wsave":{const r=S.run,q=r.qs[r.i],tk=r.ticks[r.i]||{};const got=q.pts.filter((_,i)=>tk[i]).length;setRes(Math.round(got/q.pts.length*TM[q.t].m*2)/2,{resp:r.text[r.i]||""});break;}
    case "next":{const r=S.run;if(r.i+1<r.qs.length){r.i++;render();window.scrollTo(0,0);}else{finishRun();render();window.scrollTo(0,0);}break;}
    case "retry":{const r=S.run;const list=r.qs.filter((q,i)=>(r.res[i]||{score:0}).score<TM[q.t].m);startRun(list);S.run.retry=true;break;}
    case "newtest":S.ev.view="setup";S.run=null;render();break;
    default:labClick(a,el,v);
  }
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.dataset.lsel){labSelect(el);return;}
  if(el.dataset.act==="etype"){S.ev.types[el.dataset.v]=el.checked?1:0;render();}
  else if(el.id==="en"){S.ev.n=+el.value;}
  else if(el.dataset.act==="ptick"){S.path.ticks[el.dataset.i]=el.checked;render();}
  else if(el.dataset.act==="dtick"){S.dump.ticks[el.dataset.i]=el.checked;render();}
  else if(el.dataset.act==="wtick"){const r=S.run;r.ticks[r.i]=r.ticks[r.i]||{};r.ticks[r.i][el.dataset.i]=el.checked;render();}
});
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.dataset&&el.dataset.cid){CS.src[el.dataset.cid]=el.value;return;}
  if(el.dataset&&el.dataset.iid){CS.inp[el.dataset.iid]=el.value;return;}
  if(el.dataset&&(el.dataset.lin||el.dataset.tcell!==undefined)){labInput(el);return;}
  if(el.id==="guess")S.cards.guess=el.value;
  else if(el.id==="pguess")S.path.guess=el.value;
  else if(el.id==="ptext")S.path.text=el.value;
  else if(el.id==="dtext")S.dump.text=el.value;
  else if(el.id==="ans"&&S.run)S.run.text[S.run.i]=el.value;
});
function doCheck(){
  const r=S.run,q=r.qs[r.i],v=($("#ans").value||"").trim();if(!v)return;
  r.text[r.i]=v;setRes((q.t==="calc"?matchCalc(v,q):matches(v,q.acc,q.all))?TM[q.t].m:0,{resp:v});
}
document.addEventListener("keydown",e=>{
  const t=e.target,tag=t.tagName;
  if(e.key==="Enter"&&t.id==="ans"){e.preventDefault();doCheck();return;}
  if(t.classList&&t.classList.contains("codearea")){
    if(e.key==="Tab"&&!e.shiftKey){e.preventDefault();const p=t.selectionStart;t.setRangeText("    ",p,t.selectionEnd,"end");CS.src[t.dataset.cid]=t.value;return;}
    if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)){e.preventDefault();const b=t.closest(".cw").parentElement.querySelector('[data-act="crun"],[data-act="fcheck"]');if(b)b.click();return;}
  }
  if(e.key==="Enter"&&t.id==="pguess2"){e.preventDefault();const b=document.querySelector('[data-act="pcheck2"]');if(b&&!b.disabled)b.click();return;}
  if((e.key==="Enter"||e.key===" ")&&t.classList&&t.classList.contains("hid")){e.preventDefault();t.click();return;}
  const inPath=S.tab==="learn"&&S.lv==="path"&&S.path.ph==="recall"&&S.path.q.length>0;
  const inCards=S.tab==="learn"&&S.lv==="cards"&&S.cards.queue.length>0;
  if(!(inPath||inCards)||tag==="INPUT"||tag==="TEXTAREA"||tag==="SELECT")return;
  const flipped=inPath?S.path.flip:S.cards.flip;
  if((e.key===" "||e.key==="Enter")&&tag!=="BUTTON"&&!flipped){e.preventDefault();if(inPath)S.path.flip=true;else S.cards.flip=true;render();}
  else if(flipped&&"123".includes(e.key)&&e.key){const m={"1":"miss","2":"almost","3":"got"};const b=document.querySelector('[data-act$="rate"][data-v="'+m[e.key]+'"]');if(b)b.click();}
});
render();
</script>

</body></html>
