.bar i{display:block;height:100%;background:var(--accent)}

textarea{min-height:9rem;resize:vertical}
.blank{font:inherit;display:inline-block;vertical-align:baseline;border:0;border-bottom:2px solid var(--accent);background:var(--mask);color:var(--fg);padding:0 .3em;border-radius:3px 3px 0 0;cursor:pointer;line-height:1.35}
.blank:not(.on) .ans{visibility:hidden}

.note p{font-size:1.04rem;line-height:2}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px}

tr:last-child td{border-bottom:0}
td{min-width:9rem}
.m.hid{background:var(--mask);color:transparent;border-radius:4px;cursor:pointer;display:inline-block;user-select:none}
.m{display:inline}
.opt{display:block;width:100%;text-align:left;font:inherit;padding:12px 14px;border-radius:8px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer}
.opt.right{border-color:var(--accent);background:var(--accent-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opts{display:flex;flex-direction:column;gap:8px}
.fb{padding:12px 14px;border-radius:8px;font-size:.95rem}
.fb.ok{background:var(--accent-soft)}.fb.no{background:var(--bad-soft)}
.tag{font:500 .7rem var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:4px;background:var(--accent-soft);color:var(--fg)}
.pts{display:flex;flex-direction:column;gap:6px}
.pts label{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.pts input{margin-top:.3rem;accent-color:var(--accent)}
.score{font:700 3rem var(--display);font-variant-numeric:tabular-nums}
.tcount{display:flex;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:8px}
.tcount label{flex:1;display:flex;gap:10px;align-items:center;cursor:pointer;min-width:0}
.tcount input{accent-color:var(--accent);width:1.1rem;height:1.1rem}
.tcount span.n{font:.78rem var(--mono);color:var(--muted);white-space:nowrap}
.rev{border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:6px}
.rev.bad{border-left:4px solid var(--bad)}.rev.ok{border-left:4px solid var(--accent)}

/* ---- Code lab ---- */
:root{--code-bg:#fbfaf6;--code-fg:#1b2a22;--code-line:#d5ddd6;--ok-b:#0a6a4d;--ok-s:#dcefe6;--note-b:#9a4a08;--note-s:#f6e6d4}

:root[data-theme="dark"]{--code-bg:#0a100d;--code-fg:#d8efe3;--code-line:#26342c;--ok-b:#5fd7a8;--ok-s:#17382b;--note-b:#f0a15a;--note-s:#3a2a17}
.labwrap{display:flex;flex-direction:column;gap:16px;min-width:0}

.btn.sm{padding:6px 12px;font-size:.85rem}

.codearea{width:100%;resize:vertical;min-height:5rem}
.outpre{white-space:pre-wrap;border-left:4px solid var(--accent)}
.outbox{display:flex;flex-direction:column;gap:8px;min-width:0}
.dim{color:var(--muted)}
.cw-in{display:flex;flex-direction:column;gap:4px}
.cin,input.mono{font-family:var(--mono)}
.rs{padding:10px 14px;border-radius:8px;font-size:.93rem;border-left:4px solid var(--line);background:var(--bg)}
.rs.ok{border-color:var(--ok-b);background:var(--ok-s)}
.rs.bad{border-color:var(--bad);background:var(--bad-soft)}
.rs.note,.rs.warn{border-color:var(--note-b);background:var(--note-s)}
.try{border:1px dashed var(--accent);border-radius:8px;padding:8px 12px;font-size:.93rem}
.note-box{background:var(--accent-soft);border-radius:8px;padding:10px 14px;font-size:.93rem}
ol.pipe{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0}
ol.pipe li{position:relative;padding:8px 12px 8px 34px;border-left:2px solid var(--line);margin-left:10px;font-size:.93rem}
ol.pipe li::before{content:"";position:absolute;left:-8px;top:12px;width:14px;height:14px;border-radius:50%;background:var(--bg);border:2px solid var(--line)}
ol.pipe li.done::before{background:var(--accent);border-color:var(--accent)}
ol.pipe li.cur{background:var(--accent-soft)}ol.pipe li.cur::before{border-color:var(--accent);background:var(--surface)}
ol.pipe li.fail{background:var(--bad-soft)}ol.pipe li.fail::before{background:var(--bad);border-color:var(--bad)}
ol.pipe li.warn{background:var(--note-s)}ol.pipe li.warn::before{background:var(--note-b);border-color:var(--note-b)}

.brow{display:grid;grid-template-columns:5.5rem 1fr auto;gap:10px;align-items:center}
.brow.res{border-top:1px solid var(--line);padding-top:6px;font-weight:600}
.bl{font:.78rem var(--mono);color:var(--muted)}
.bv{display:flex;gap:2px;flex-wrap:wrap}
.bit{width:1.55rem;height:1.7rem;display:inline-flex;align-items:center;justify-content:center;font:500 .85rem var(--mono);border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--muted)}

.bd{font:.85rem var(--mono)}
.b-s{color:var(--bad)}.b-e{color:var(--note-b)}.b-m{color:var(--accent)}
td.mono{word-break:break-all;min-width:0}
ol.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
ol.steps li{display:flex;flex-direction:column;gap:2px;padding:8px 12px;border:1px solid var(--line);border-radius:8px}
.exp{font-family:var(--mono);font-size:.92rem}.exp.res{color:var(--accent);font-weight:600}
.exp mark{background:var(--accent-soft);color:var(--fg);border-radius:3px;padding:0 3px;outline:1.5px solid var(--accent)}
ul.rules{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
ul.rules li{padding:6px 10px;border-radius:6px;font-size:.92rem}
ul.rules li.ok{background:var(--ok-s)}ul.rules li.no{background:var(--bad-soft)}
input.tcell{width:100%;min-width:4rem;font:.9rem var(--mono);padding:6px 8px}

input.tcell.miss{border-color:var(--bad);background:var(--bad-soft)}
.nb .cw{margin-top:4px}
.nb ol.pipe{margin-top:4px}
@media (max-width:520px){.brow{grid-template-columns:1fr}.bit{width:1.3rem}}

const NOTES=[
["1.1 Cloud computing","{{Cloud computing}} is the delivery of computing services (servers, storage, databases, software) over the internet, on demand and on a {{pay-as-you-go}} basis. The NIST definition has five essential characteristics: {{on-demand self-service}}, {{broad network access}}, {{resource pooling}} (many customers share the provider's resources, called multi-tenancy), {{rapid elasticity}} and {{measured service}}. In the cost experiment a fixed set of 16 servers for 24 hours is 384 server-hours (Rs 1920 at Rs 5), while an elastic cloud that follows the hourly need used {{218}} server-hours (Rs 1090), a saving of {{43%}}; the fixed set was used {{57%}} of the time on average. The three service models differ in what the customer manages. In {{IaaS}} (EC2, Azure Virtual Machines, Compute Engine) the customer manages the operating system, middleware, runtime, data and applications. In {{PaaS}} (App Engine, Azure App Service, Heroku, Elastic Beanstalk) the customer manages only applications and data. In {{SaaS}} (Gmail, Microsoft 365, Zoom, Dropbox) the customer manages only data and settings. The deployment models are {{public}}, {{private}}, {{hybrid}} (cloud bursting), {{community}} and {{multi-cloud}} (to avoid vendor lock-in). Advantages are lower upfront cost, scalability, availability and disaster recovery, global reach, automatic updates and collaboration. Challenges are dependence on the internet, privacy and compliance (India's DPDP Act 2023), vendor lock-in, shared-responsibility security and latency. The cloud is somebody else's computer: a public storage bucket leaks data, and a budget alert prevents a surprise bill."],
["1.2 Virtualization","{{Virtualization}} creates software versions of hardware, so one physical machine acts as many. A {{hypervisor}} (virtual machine monitor) creates and runs {{virtual machines}}. A {{Type 1}} hypervisor runs directly on the hardware (bare metal: VMware ESXi, Hyper-V, XenServer, KVM) and is used on servers; a {{Type 2}} hypervisor runs on an operating system (VMware Workstation, VirtualBox, Parallels) and is used for testing. A virtual machine has its own operating system; a {{container}} shares the host kernel and is lighter. In the lab, lscpu reported hypervisor vendor KVM and full virtualization, while systemd-detect-virt reported docker. {{Consolidation}} saves power: with power per server = 100 + 200 × load (watts), ten servers at 10% load use {{1200 W}}, while two at 50% use {{400 W}}, a saving of {{67%}} with eight servers switched off. Other benefits are rapid provisioning, snapshots, live migration, isolation and disaster recovery. The five types are {{server}} virtualization, {{network}} virtualization (SDN separates the control plane from the data plane; NFV; VLAN), {{storage}} virtualization (thin provisioning, SAN, NAS), {{desktop}} virtualization (VDI, thin clients) and {{application}} virtualization (App-V, ThinApp, containerization)."],
["1.3 Grid computing","{{Grid computing}} joins loosely coupled, geographically scattered, heterogeneous and independently owned computers through {{middleware}} (Globus Toolkit, OGSA) so that they act as one {{virtual organization}}. The middleware does resource discovery, job scheduling, data management, security and fault tolerance. A grid needs a job that can be {{split}} into independent sub-jobs. In the experiment, estimating pi with 8 sub-jobs of 400 000 darts took 0.53 s on one node (pi ≈ 3.1404) and 0.24 s on two. In the fault-tolerance experiment, with nodes A, B, C and D and jobs 1 to 10, node C fails on job 7; the job returns to the queue and is re-run on B, and the nodes still alive are A, B and D. The three types are {{computational}}, {{data}} and {{scavenging}} grids (SETI@home, BOINC, which use idle volunteer computers). A grid has many owners, heterogeneous hardware, batch jobs, science as its main use and free or grant funding; a cloud has one provider, uniform hardware, on-demand services, business use and pay-per-use cost. Examples are the {{WLCG}} (about 170 sites in 42 countries, used for the Higgs discovery of 2012) and India's {{Garuda}} Grid (C-DAC)."],
["1.4 Internet of Things","The {{Internet of Things}} (IoT) is a network of physical objects that have sensors, a processor and a network connection and exchange data without human involvement. It has three layers: the {{perception}} layer (sensors and actuators), the {{network}} layer (carries the data) and the {{application}} layer (processes, shows and decides). In the pipeline example the readings 27.5, 28.1, 29.0, 31.2, 33.8 and 30.4 are sent as JSON such as {\"device\": \"room-1\", \"temp_c\": 27.5}; with the rule 'fan on above 30' there are {{three}} alerts (31.2, 33.8 and 30.4). Applications are the smart home, healthcare, agriculture, smart cities and industrial IoT. The challenges are {{security}}, {{privacy}}, {{interoperability}}, {{power}} and {{scalability}} (mnemonic Please Note Alarms); edge computing helps with scale."],
["1.5 to 1.7 AI, machine learning and deep learning","{{Artificial intelligence}} is machines performing tasks that need human intelligence; {{John McCarthy}} named it in {{1956}} at Dartmouth, and periods of disappointment are called AI winters. {{Machine learning}} is part of AI and learns patterns from data; {{deep learning}} is part of machine learning and uses neural networks with many layers (GPU, TPU and NPU hardware). A {{rule-based expert system}} follows fixed rules: in the loan advisor no job means reject, age under 21 or over 60 means refer to an officer, income of 30 000 or more means approve, 15 000 or more means approve with a guarantor, otherwise reject. It is brittle: a self-employed applicant is rejected because the rules never covered that case. The three ways of learning are {{supervised}} (labelled data), {{unsupervised}} (unlabelled data, finding structure) and {{reinforcement}} (rewards and penalties). On the iris data a decision tree scored {{0.96}} and k-NN with k = 5 scored {{0.98}} on unseen flowers (testing on unseen data guards against overfitting); k-means gave clusters of 38, 50 and 62. In Q-learning in a five-cell corridor the best action in cells 0 to 3 is right. A CNN is used for images, an RNN or LSTM for sequences and a {{transformer}} (attention) for large language models. On XOR a network without a hidden layer scored {{2 of 4}}, because XOR is not linearly separable, and one hidden layer of 4 neurons scored {{4 of 4}}. Pitfalls are biased data and overfitting."],
["1.8 and 1.9 Big data and data analytics","{{Big data}} is data too large, fast or varied for traditional tools, described by the five Vs: {{Volume}}, {{Velocity}}, {{Variety}}, {{Veracity}} and {{Value}}. Hadoop stores data in {{HDFS}} and processes it with {{MapReduce}}: the map stage emits each word with the count 1, the shuffle stage groups equal words and the reduce stage adds the counts (data 4, big 3, decisions 2). Spark, Kafka and NoSQL databases (MongoDB, Cassandra, HBase, Redis) are also used. The four types of analytics are {{descriptive}} (what happened), {{diagnostic}} (why), {{predictive}} (what will happen) and {{prescriptive}} (what should we do). In the sales example the South region fell {{36%}} in month 3 because of a stock-out (diagnostic); the North trend sales = 5.31 × month + 94.1 predicts about {{131}} in month 7; and with demand 200 − 2p the revenue is greatest at price {{50}} (revenue 5000). The workflow is collect, clean, explore, model, validate, visualise and act."],
["1.10 Blockchain","A {{blockchain}} is a distributed ledger of blocks; each block holds transactions, a timestamp and the {{hash of the previous block}}, so the chain is decentralised and tamper-evident. A {{hash}} (SHA-256) is a fixed-length fingerprint: changing one letter changes the whole hash (hello starts 2cf24d…, Hello starts 185f8d…). In {{proof of work}} a miner tries nonces until the hash starts with a required number of zeros; four hexadecimal zeros need about 16^4 = {{65 536}} tries on average. The measured nonces were 256820, 53779 and 75410. The verify function checks that each hash matches its contents and that each block links to the previous one, so editing block 1 gives 'block 1 hash does not match its contents'. {{Proof of stake}} chooses validators by the coins they stake and uses far less energy (Ethereum since the 2022 Merge, Cardano). Bitcoin began in 2009; Ethereum (2015) added {{smart contracts}}, programs that run automatically when conditions are met, used for DeFi and NFTs; other uses are supply chains, identity, records, land registries and voting. A blockchain does not make the data put into it true."],
["1.11 and 1.12 Cyber security and ethical hacking","The {{CIA triad}} is {{confidentiality}}, {{integrity}} and {{availability}}. A checksum protects integrity: 'Pay Rs 1000' and 'Pay Rs 9000' give completely different SHA-256 hashes. Threats are malware, phishing and social engineering, {{DDoS}} (a flood from a botnet), man-in-the-middle, {{SQL injection}}, cross-site scripting, zero-day attacks, insider threats and APTs. In the unsafe login the password ' OR '1'='1 makes the executed SQL end with OR '1'='1', which is always true, so the attacker logs in; {{parameterised queries}} send the values separately, so the same attack is refused. At 10 billion guesses a second 6 digits last 0.0001 s, 8 lower-case letters 0.3 minutes, 8 of 94 characters 7.1 days and 12 of 94 characters about {{1.5 × 10^6 years}}; multi-factor authentication adds protection. The layers of defence are network, endpoint, application, identity and access, data, monitoring (SIEM) and response; in India {{CERT-In}} handles incidents and the {{IT Act 2000}} (amended 2008) is the law. {{Ethical hacking}} is authorised testing with permission, scope and intent. Its five phases are reconnaissance, scanning (Nmap, Nessus, OpenVAS), exploitation (Metasploit, Burp Suite), post-exploitation and reporting. A scan of 127.0.0.1 found ports 8101 and 8105 open. Unauthorised scanning may break IT Act Sections 43 and 66. Certifications are CEH, OSCP and CISSP, and Kali Linux is a common toolkit."],
["1.13 and 1.14 AR, VR, MR and edge computing","{{Augmented reality}} overlays virtual content on the real world (a phone showing IKEA furniture, Pokémon GO); {{virtual reality}} replaces the real world with a computer-made one (a headset, a simulator); {{mixed reality}} anchors virtual objects to real surfaces and lets them interact (HoloLens, surgeons' holograms). ARKit and ARCore are AR platforms; VR uses stereoscopic 3D and head tracking. {{Edge computing}} processes data near where it is produced; its benefits are low {{latency}}, saved {{bandwidth}} and offline operation. Light in fibre travels at 200 000 km/s and a car at 90 km/h moves 25 m/s. Round trip = 2 × km ÷ 200 000 × 1000 + extra ms, so an edge box 1 km away takes 2.0 ms (the car moves 0.05 m), a regional cloud 500 km away 25.0 ms (0.62 m) and a far cloud 4000 km away 60.0 ms ({{1.50 m}}). 1000 sensors sending 10 readings a second of 100 bytes produce 86.4 GB a day, but one-minute summaries need 0.144 GB, which is {{600}} times less. Edge complements the cloud and does not replace it; MEC (multi-access edge computing) uses 5G."],
["1.15 to 1.17 Quantum, green computing, open data and digital transformation","A {{qubit}} can be in a {{superposition}} of 0 and 1 until measured; {{entanglement}} correlates qubits however far apart they are (it cannot send messages faster than light); {{interference}} makes the right answers more likely. A Hadamard gate gives amplitudes 0.707; two entangled qubits are measured only as 00 or 11. {{Grover's}} search of 8 items gives 0.781, 0.945 and 0.330 after 1, 2 and 3 steps, so one stops near π/4 × √N. {{Shor's}} algorithm factors large integers and threatens {{RSA}}, so post-quantum cryptography is being standardised. Storing n qubits needs 16 × 2^n bytes: 17 GB for 30 qubits. {{Decoherence}} destroys the quantum state and needs error correction and cooling near absolute zero. {{PUE}} = total facility power ÷ IT power; 1.0 is ideal and lower is better: for 1000 kW of IT, PUE 1.55 uses 13.58 GWh a year and PUE 1.10 uses 9.64 GWh. {{DVFS}} lowers frequency and voltage; power is proportional to V² × f, so f = 0.8 and V = 0.9 give 65%. E-waste is regulated in India by the E-Waste (Management) Rules 2022 with extended producer responsibility; the standards are Energy Star, EPEAT and 80 PLUS. {{Open data}} is free, machine-readable (CSV, JSON, XML, RDF) and under an open licence; a scanned PDF table is not open data. {{Digital transformation}} changes strategy, processes and culture around digital technology. India's digital public infrastructure includes Digital India (2015), {{UPI}} (payments), {{Aadhaar}} (identity), DigiLocker, UMANG, CoWIN and GeM."]

["Distinguish public, private and hybrid clouds.","A public cloud is owned by a provider and shared by many customers (AWS, Azure). A private cloud is used by one organisation (banks, government). A hybrid cloud combines both and sends extra load to the public cloud (cloud bursting).",["public shared","private one organisation","hybrid both"]],
["Distinguish Type 1 from Type 2 hypervisors with an example of each.","A Type 1 hypervisor runs directly on the hardware (bare metal), for servers: VMware ESXi, Hyper-V, KVM. A Type 2 hypervisor runs on an operating system, for testing: VirtualBox, VMware Workstation.",["type 1 hardware","type 2 operating system"]],

const LONG=[
["Explain cloud computing with its characteristics, the three service models and the four deployment models.","Cloud computing delivers services over the internet on demand and pay-as-you-go. NIST characteristics: on-demand self-service, broad network access, resource pooling, rapid elasticity, measured service. In the experiment an elastic cloud used 218 server-hours against 384 for a fixed set, saving 43%. Service models: IaaS (customer manages OS and above; EC2), PaaS (customer manages applications and data; App Engine, Heroku), SaaS (customer manages data and settings; Gmail, Zoom). Deployment models: public (AWS, Azure, Google Cloud), private (one organisation), hybrid (both, with cloud bursting), community (shared by similar organisations); multi-cloud avoids lock-in. Challenges: internet dependence, privacy, lock-in, shared-responsibility security, latency.",["characteristics","iaas","paas","saas","public","private","hybrid","community"]],
["Explain virtualization: hypervisors, types of virtualization and its benefits.","Virtualization creates software versions of hardware so that one machine acts as many. A hypervisor creates virtual machines: Type 1 runs on bare metal (ESXi, Hyper-V, KVM) for servers; Type 2 runs on an operating system (VirtualBox) for testing. A VM has its own OS; a container shares the host kernel. Types: server, network (SDN, NFV, VLAN), storage (thin provisioning, SAN, NAS), desktop (VDI) and application (App-V, containers). Benefits: consolidation (1200 W to 400 W, 67% saved), rapid provisioning, snapshots, live migration, isolation and disaster recovery.",["hypervisor","type 1","type 2","server","network","storage","desktop","consolidation"]],
["Compare grid and cloud computing in a table, with two examples of grids.","Grid against cloud: ownership: many owners / one provider; hardware: heterogeneous / uniform; typical work: batch jobs / on-demand services; main use: science / business; cost: free or by grant / pay per use. A grid is held together by middleware (resource discovery, scheduling, data management, security, fault tolerance) and forms a virtual organization. Examples: the WLCG for CERN (about 170 sites, 42 countries) and India's Garuda Grid; SETI@home and BOINC are scavenging grids.",["owners","heterogeneous","batch","science","wlcg","garuda"]],
["Explain the Internet of Things with its layers, applications and challenges.","IoT is a network of objects with sensors, a processor and a network connection exchanging data without human involvement. Layers: perception (sensors and actuators), network (Wi-Fi, 5G, MQTT) and application (dashboards, alerts, rules). In the example, readings above 30 raised three alerts and the fan switched on. Applications: smart home, healthcare, agriculture, smart city, industrial IoT. Challenges: security, privacy, interoperability, power and scalability; edge computing helps.",["perception","network","application","security","privacy","interoperability"]],
["Explain AI, machine learning and deep learning, and how they are related, with examples of each.","AI (McCarthy, 1956) is machines doing tasks that need human intelligence, e.g. a rule-based loan advisor (brittle). Machine learning is part of AI and learns from data: supervised (decision tree 0.96, k-NN 0.98 on iris), unsupervised (k-means) and reinforcement (Q-learning). Deep learning is part of ML and uses many-layer networks: CNN for images, RNN/LSTM for sequences, transformers for LLMs; a hidden layer solved XOR (4 of 4). So AI contains ML, which contains DL. Pitfalls: bias and overfitting.",["mccarthy","supervised","unsupervised","reinforcement","cnn","transformer"]],
["Explain big data with the five Vs and the four kinds of analytics.","Big data is too large, fast or varied for traditional tools: Volume, Velocity, Variety, Veracity, Value. Hadoop stores in HDFS and processes with MapReduce (map, shuffle, reduce). Analytics: descriptive (what happened: totals by region), diagnostic (why: South fell 36% from a stock-out), predictive (what will happen: trend of 131 in month 7) and prescriptive (what to do: price 50 gives revenue 5000). Workflow: collect, clean, explore, model, validate, visualise, act.",["volume","velocity","variety","veracity","value","descriptive","diagnostic","predictive","prescriptive"]],
["Explain how a blockchain works: blocks, hashes, consensus and smart contracts.","A blockchain is a distributed ledger of blocks, each holding transactions, a timestamp and the hash of the previous block. SHA-256 gives a fixed-length fingerprint, and one changed letter changes it completely, so editing a block breaks its hash and the links after it (block 1 hash does not match its contents). Consensus: proof of work (miners find a nonce; four zeros need about 65 536 tries; Bitcoin; high energy) or proof of stake (validators chosen by stake; Ethereum; far lower energy). Smart contracts are programs that run automatically on the chain (Ethereum, DeFi, NFTs). A blockchain does not make the data true.",["hash","previous","proof of work","proof of stake","smart contract","tamper"]],
["Explain the CIA triad, five cyber threats and five defences, with the role of CERT-In and the IT Act.","CIA: confidentiality, integrity (a checksum detects change), availability. Threats: malware, phishing, DDoS, SQL injection, man-in-the-middle (also XSS, zero-day, insider, APT). SQL injection is prevented by parameterised queries. Defences: network (firewall), endpoint (antivirus, updates), application (validation), identity and access (strong passwords, MFA), data (encryption, backup), monitoring (SIEM), response. A 12-character password of 94 symbols takes about 1.5 million years at 10 billion guesses a second. CERT-In handles incidents in India and the IT Act 2000 (amended 2008) defines the offences.",["confidentiality","integrity","availability","phishing","sql injection","cert-in","it act"]],
["Explain ethical hacking, its phases and why authorisation matters.","Ethical hacking is authorised testing of a system's defences to find weaknesses before criminals do. It needs permission, scope and intent. Phases: reconnaissance, scanning (Nmap, Nessus, OpenVAS), exploitation (Metasploit, Burp Suite), post-exploitation and reporting. Without authorisation the same acts are crimes under IT Act Sections 43 and 66. Certifications: CEH, OSCP, CISSP; toolkit: Kali Linux.",["permission","scope","reconnaissance","scanning","exploitation","reporting","it act"]],
["Explain quantum computing and the effect of Shor's algorithm on cryptography, then explain green computing with PUE.","A qubit uses superposition, entanglement and interference; n qubits need 2^n amplitudes (17 GB for 30). Grover searches (0.945 after 2 steps on 8 items) and Shor factors integers quickly, threatening RSA, so post-quantum cryptography is being standardised. Decoherence and error correction are the obstacles. Green computing: PUE = total power ÷ IT power (1.55 uses 13.58 GWh, 1.10 uses 9.64 GWh); renewables, virtualization, cooling, DVFS (power ∝ V²f) and e-waste rules (2022) with Energy Star, EPEAT and 80 PLUS.",["qubit","superposition","entanglement","shor","rsa","pue","renewable","e-waste"]]
];

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function norm(s){return " "+String(s).toLowerCase().replace(/[^a-z0-9]+/g," ").trim()+" ";}
function matches(user,acc,all){const u=norm(user);const hit=a=>u.includes(norm(a));return all?acc.every(hit):acc.some(hit);}

  m.set(b);m[n]=0x80;const dv=new DataView(m.buffer);dv.setUint32(tot-8,Math.floor(n*8/4294967296));dv.setUint32(tot-4,(n*8)>>>0);

function pyFmtTime(secs){
  if(secs<1)return secs.toFixed(4)+" seconds";
  if(secs<3600)return (secs/60).toFixed(1)+" minutes";
  if(secs<86400*365)return (secs/86400).toFixed(1)+" days";
  return (secs/(86400*365)).toExponential(2).replace(/e([+-])(\d)$/,"e$10$2")+" years";
}
function f2(x){return (x-1e-9).toFixed(2);}
function parseArgs(s){
  const kv={},pos=[];
  const re=/(\w+)=("[^"]*"|\S+)|"([^"]*)"/g;let m;
  while((m=re.exec(s))){
    if(m[1])kv[m[1]]=m[2].replace(/^"|"$/g,"");else pos.push(m[3]);
  }
  return {kv,pos};
}

function fnRun(src){
  const out=[];let errors=0;let title="",detail="";
  const lines=String(src).replace(/\r/g,"").split("\n");let cmds=0;
  for(let i=0;i<lines.length;i++){
    const ln=lines[i].trim();if(!ln||ln[0]==="#")continue;
    const sp=ln.search(/\s/),c=sp<0?ln:ln.slice(0,sp),rest=sp<0?"":ln.slice(sp+1);
    cmds++;
    if(!SIMS[c]){errors++;title="Unknown command";detail="Line "+(i+1)+": '"+c+"' is not a command of this lab. Commands: "+Object.keys(SIMS).join(", ")+".";out.push("error: "+detail);continue;}
    try{const a=parseArgs(rest);a.raw=rest;SIMS[c](a,out);}
    catch(e){errors++;title="Cannot run";detail="Line "+(i+1)+": "+e.message;out.push("error: "+detail);}
  }
  if(!cmds){return {ok:false,title:"Nothing to run",detail:"Type at least one command.",out:"",brief:"",errors:1,warns:0};}
  return {ok:errors===0,title:title,detail:detail,out:out.join("\n"),brief:out.join(" / "),errors:errors,warns:0,cmds:cmds};
}

function labClick(a,el,v){
  switch(a){
    case "ltool":L.tool=v;render();return true;
    case "crun":runWidget(el.dataset.id);return true;
    case "wreset":resetWidget(el.dataset.id);return true;
    case "ltog":L[el.dataset.key]=!L[el.dataset.key];render();return true;
    case "lset":L[el.dataset.key]=v;render();return true;
    case "pcheck2":{const q=CALC[L.pi];const g=document.getElementById("pguess2").value;L.pres[L.pi]=Object.assign(L.pres[L.pi]||{},{guess:g,checked:true,ok:matchCalc(g,q)});render();return true;}
    case "prun2":{const q=CALC[L.pi];const r=runCpp(q.src,"");L.pres[L.pi]=Object.assign(L.pres[L.pi]||{},{run:r});const g=document.getElementById("pguess2");if(g&&!(L.pres[L.pi].checked))L.pres[L.pi].guess=g.value;render();return true;}
    case "pprev2":if(L.pi>0)L.pi--;render();return true;
    case "pnext2":if(L.pi+1<CALC.length)L.pi++;render();return true;
    case "fcheck":{const f=FIX[L.fi];const id="fix"+L.fi;const ta=document.getElementById("code-"+id);const ii=document.getElementById("in-"+id);const src=ta?ta.value:f.src;CS.src[id]=src;const inp=ii?ii.value:(f.inp||"");CS.inp[id]=inp;const r=runCpp(src,inp);CS.out[id]=r;
      const got=(r.brief!==undefined?r.brief:(r.out||"")).replace(/\r/g,"").replace(/\s+$/,"");
      let msg,ok=false;
      if(!r.ok){msg=r.title+". "+r.detail;}
      else if(got===f.exp){ok=true;msg="The output matches the goal.";}
      else msg="It runs, but the output is different from the goal. Expected \""+f.exp.replace(/\n/g," / ")+"\" and got \""+got.replace(/\n/g," / ")+"\".";
      L.fres[L.fi]={ok:ok,msg:msg};render();return true;}
    case "fhint":L.fshow[L.fi]=Math.max(L.fshow[L.fi]||0,1);render();return true;
    case "fsol":L.fshow[L.fi]=2;render();return true;
    case "fprev":if(L.fi>0)L.fi--;render();return true;
    case "fnext":if(L.fi+1<FIX.length)L.fi++;render();return true;
    case "lsdim":L.sd.dim=+v;L.sd.s=0;L.sd.t=0;sdNew();render();return true;
    case "lsda":{const d=DIMS[L.sd.dim],it=d.it[L.sd.item];L.sd.t++;const ok=+v===it[1];if(ok)L.sd.s++;L.sd.right=ok;L.sd.fb=(ok?"Correct. ":"Not quite. ")+"\u201c"+it[0]+"\u201d: "+d.o[it[1]]+".";render();return true;}
    case "lsdn":sdNew();render();return true;
  }
  return false;
}

function labInput(el){
  const k=el.dataset.lin;if(!k)return false;
  const set=(id,html)=>{const e=document.getElementById(id);if(e)e.innerHTML=html;};
  if(k==="pred"){L.pres[L.pi]=Object.assign(L.pres[L.pi]||{},{guess:el.value});return true;}
  if(el.dataset.key)L[el.dataset.key]=el.value;
  if(k==="pass")set("passres",passRes());
  else if(k==="edge")set("edgeres",edgeRes());
  else if(k==="pue")set("pueres",pueRes());
  return true;
}
function labSelect(el){
  const k=el.dataset.lsel;if(!k)return false;
  if(k==="ex"){L.ex=+el.value;render();}
  else if(k==="set"){L[el.dataset.key]=el.value;render();}
  return true;
}

function noteHtml(b){
  let h='<section class="nb"><h3>'+esc(b.h)+'</h3>';
  if(b.d)h+='<p class="def"><b>Definition.</b> '+esc(b.d)+'</p>';
  (b.p||[]).forEach(p=>{h+='<p>'+esc(p)+'</p>';});
  if(b.l)h+='<ul>'+b.l.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>';
  if(b.t)h+='<div class="tbl"><table><thead><tr>'+b.t.c.map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr></thead><tbody>'+b.t.r.map(r=>'<tr>'+r.map(c=>'<td>'+esc(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
  if(b.code)h+=codeHtml(b.code.id,b.code);
  return h+'</section>';
}
function stepIds(st){const ids=[];CARDS.forEach((c,i)=>{if(st.sec.includes(c[0]))ids.push(i);});return ids.filter(i=>i<ORIG).concat(ids.filter(i=>i>=ORIG));}
function stepChunks(st){const ids=stepIds(st),out=[];for(let i=0;i<ids.length;i+=CH)out.push(ids.slice(i,i+CH));return out;}
function blankHtml(text){return esc(text).replace(/\{\{(.+?)\}\}/g,(m,a)=>`<button class="blank" data-act="blank" style="min-width:${Math.max(4,a.length)}ch" aria-label="Hidden term, press to reveal"><span class="ans">${a}</span></button>`);}
function applyRate(queue,v){const id=queue.shift();let b=store.box[id]||0;
  if(v==="miss"){b=1;queue.splice(Math.min(3,queue.length),0,id);}
  else if(v==="almost"){b=Math.max(b,1);queue.push(id);}
  else{b=b<2?2:3;}
  store.box[id]=b;save();}
function openStep(s){
  const P=S.path,N=stepChunks(STEPS[s]).length;
  const ch=store.path.done[s]?0:Math.min(store.path.ch[s]||0,N);
  P.step=s;P.i=0;P.flip=false;P.guess="";P.text="";P.dchecked=false;P.ticks={};P.q=[];
  if(ch>=N){P.ph="gaps";P.ch=N-1;}else{P.ch=ch;P.ph=ch>0?"learn":"primer";}
  render();window.scrollTo(0,0);
}
function pathOverview(){
  const first=STEPS.findIndex((_,s)=>!store.path.done[s]);
  let h='<div class="panel"><h2>Start here</h2><p>New to the subject? Follow the steps in order. Each step sets out the textbook notes (with runnable code where the chapter has a listing), then teaches its cards in small rounds of six (first you see them with answers, then you recall them), then checks you with fill-the-gaps and a brain dump. Progress is saved in this browser.</p></div><div style="display:flex;flex-direction:column;gap:10px">';
  STEPS.forEach((st,s)=>{
    const N=stepChunks(st).length,done=!!store.path.done[s],ch=Math.min(store.path.ch[s]||0,N);
    const status=done?"Done":ch>0?"Round "+ch+" of "+N+" done":"Not started";
    h+=`<button class="opt" data-act="pstep" data-v="${s}" style="display:flex;justify-content:space-between;gap:12px;align-items:center"><span><b>${s+1}. ${esc(st.t)}</b><br><span class="hint">${stepIds(st).length} cards · ${N} rounds</span></span><span class="tag">${status}</span></button>`;
  });
  h+="</div>";
  if(first>=0)h+=`<div class="row"><button class="btn primary" data-act="pstep" data-v="${first}">${(store.path.ch[first]||0)>0?"Continue":"Begin"} step ${first+1}</button></div>`;
  else h+='<p>All steps are done. Keep the cards fresh in Recall cards, then test yourself in Evaluate.</p>';
  return '<div style="display:flex;flex-direction:column;gap:18px">'+h+"</div>";
}
function viewPath(){
  const P=S.path;
  if(P.step===null)return pathOverview();
  const st=STEPS[P.step],chunks=stepChunks(st),N=chunks.length;
  const pos=P.ph==="primer"?0:(P.ph==="learn"||P.ph==="recall"||P.ph==="roundend")?1+P.ch:P.ph==="gaps"?N+1:P.ph==="dump"?N+2:N+3;
  let h=`<div class="row" style="justify-content:space-between"><span class="row"><button class="btn" data-act="pback">All steps</button>${P.ph==="primer"||P.ph==="done"?"":'<button class="btn" data-act="pnotes">Notes</button>'}</span><span class="lab">Step ${P.step+1} of ${STEPS.length}</span></div><div class="bar" aria-hidden="true"><i style="width:${Math.round(pos/(N+3)*100)}%"></i></div><h2>${esc(st.t)}</h2>`;
  if(P.ph==="primer"){
    h+=`<div class="panel"><div class="lab">Textbook notes</div>${st.blocks.map(noteHtml).join("")}<p class="hint">Next: ${N} short rounds. In each round you see ${CH} cards with their answers, then recall them from memory.</p><div class="row"><button class="btn primary" data-act="pstart">${P.ch>0?"Continue at round "+(P.ch+1):"Start round 1"}</button></div></div>`;
  }else if(P.ph==="learn"){
    const ids=chunks[P.ch],id=ids[P.i],k=CARDS[id];
    h+=`<div class="panel fc"><div class="lab">Round ${P.ch+1} of ${N} · Learn · card ${P.i+1} of ${ids.length} · ${id<ORIG?"Core":"Detail"}</div><div class="q">${esc(k[1])}</div><div class="lab">Answer</div><div class="a">${esc(k[2])}</div><p class="hint">Read it, say it back in your own words, then move on.</p><div class="row"><button class="btn" data-act="plback"${P.i?"":" disabled"}>Back</button><button class="btn primary" data-act="plnext">${P.i+1<ids.length?"Next card":"Now recall these "+ids.length}</button></div></div>`;
  }else if(P.ph==="recall"){
    const id=P.q[0],k=CARDS[id];
    h+=`<div class="panel fc"><div class="lab">Round ${P.ch+1} of ${N} · Recall · ${P.q.length} left</div><div class="q">${esc(k[1])}</div><input type="text" id="pguess" placeholder="Type what you remember (optional)" value="${esc(P.guess)}" autocomplete="off">`;
    if(!P.flip)h+='<div class="row"><button class="btn primary" data-act="pflip">Show answer</button><span class="hint">or press Space</span></div>';
    else h+=`<div class="lab">Answer</div><div class="a">${esc(k[2])}</div><div class="row"><button class="btn bad" data-act="prate" data-v="miss">Missed it (1)</button><button class="btn warn" data-act="prate" data-v="almost">Almost (2)</button><button class="btn good" data-act="prate" data-v="got">Got it (3)</button></div>`;
    h+="</div>";
  }else if(P.ph==="roundend"){
    const last=P.ch+1>=N;
    h+=`<div class="panel"><h3>Round ${P.ch+1} done</h3><p>${last?"That was the last round of cards. Two short exercises remain: fill the gaps in the summary, then a brain dump.":"Next you will see "+chunks[P.ch+1].length+" new cards."}</p><div class="row"><button class="btn primary" data-act="pnext">${last?"Fill the gaps":"Start round "+(P.ch+2)}</button></div></div>`;
  }else if(P.ph==="gaps"){
    h+='<p class="hint">Say each hidden term aloud before you tap it.</p><div class="row"><button class="btn" data-act="revall">Reveal all</button><button class="btn" data-act="hideall">Hide all</button></div>';
    st.notes.forEach(ni=>{const n=NOTES[ni];h+=`<div class="panel note"><h3>${esc(n[0])}</h3><p>${blankHtml(n[1])}</p></div>`;});
    h+='<div class="row"><button class="btn primary" data-act="pdump">Continue to brain dump</button></div>';
  }else if(P.ph==="dump"){
    const pts=[];st.dump.forEach(d=>DUMPS[d].p.forEach(p=>pts.push(p)));
    h+=`<div class="panel"><h3>Brain dump</h3><p class="hint">Close everything and write what you remember about this step. Then compare.</p><textarea id="ptext" placeholder="Write it in your own words...">${esc(P.text)}</textarea>`;
    if(!P.dchecked)h+='<div class="row"><button class="btn primary" data-act="pcheck">Compare with key points</button></div>';
    else{const got=pts.filter((_,i)=>P.ticks[i]).length;
      h+=`<div class="lab">Tick what you included</div><div class="pts">${pts.map((p,i)=>`<label><input type="checkbox" data-act="ptick" data-i="${i}"${P.ticks[i]?" checked":""}><span>${esc(p)}</span></label>`).join("")}</div><div class="row"><b>${got} of ${pts.length} covered</b><button class="btn primary" data-act="pfinish">Finish this step</button></div>`;}
    h+="</div>";
  }else{
    const ids=stepIds(st),m=ids.filter(i=>(store.box[i]||0)>=2).length;
    h+=`<div class="panel"><h3>Step ${P.step+1} complete</h3><p>${m} of ${ids.length} cards in this step are at Review or Mastered. The rest keep coming back in Recall cards.</p><div class="row">${P.step+1<STEPS.length?`<button class="btn primary" data-act="pnextstep">Next: ${esc(STEPS[P.step+1].t)}</button>`:""}<button class="btn" data-act="pback">All steps</button></div></div>`;
  }
  return '<div style="display:flex;flex-direction:column;gap:16px">'+h+"</div>";
}

  }

function startRun(list){
  const qs=list.map(q=>q.t==="mcq"?Object.assign({},q,{o:shuffle(q.opts.map((t,i)=>({t:t,c:i===q.a})))}):q);
  S.run={qs:qs,i:0,res:[],stage:[],ticks:[],text:[]};S.ev.view="quiz";render();window.scrollTo(0,0);
}
function evalQuiz(){
  const r=S.run,q=r.qs[r.i],res=r.res[r.i],T=TM[q.t];
  let h=`<div class="panel"><div class="row" style="justify-content:space-between"><span class="tag">${esc(T.n)}</span><span class="lab">Question ${r.i+1} of ${r.qs.length} · ${T.m} mark${T.m>1?"s":""}</span></div><div class="bar" aria-hidden="true"><i style="width:${Math.round(r.i/r.qs.length*100)}%"></i></div>`;
  h+=`<h3 style="font-size:1.2rem;line-height:1.35">${esc(q.t==="fill"?q.q.replace("___","_______"):q.q)}</h3>`;
  if(q.t==="calc"&&q.src)h+='<pre class="codeview">'+esc(q.src)+'</pre>';
  if(q.t==="mcq"){
    h+='<div class="opts">'+q.o.map((o,i)=>{let c="opt";if(res){if(o.c)c+=" right";else if(res.pick===i)c+=" wrong";}return `<button class="${c}" data-act="mcq" data-i="${i}"${res?" disabled":""}>${esc(o.t)}</button>`;}).join("")+"</div>";
    if(res)h+=`<div class="fb ${res.score?"ok":"no"}"><b>${res.score?"Correct.":"Not quite."}</b> ${esc(q.e)}</div>`;
  }else if(q.t==="tf"){
    h+='<div class="opts">'+[true,false].map(v=>{let c="opt";if(res){if(q.a===v)c+=" right";else if(res.pick===v)c+=" wrong";}return `<button class="${c}" data-act="tf" data-v="${v}"${res?" disabled":""}>${v?"True":"False"}</button>`;}).join("")+"</div>";
    if(res)h+=`<div class="fb ${res.score?"ok":"no"}"><b>${res.score?"Correct.":"Not quite."}</b> ${esc(q.e)}</div>`;
  }else if(q.t==="fill"||q.t==="vsa"||q.t==="calc"){
    h+=`<input type="text" id="ans" autocomplete="off" placeholder="Type your answer" value="${esc(r.text[r.i]||"")}"${res?" disabled":""}>`;
    if(!res)h+='<div class="row"><button class="btn primary" data-act="check">Check</button></div>';
    else{
      h+=`<div class="fb ${res.score?"ok":"no"}"><b>${res.score?"Correct.":"Model answer:"}</b> ${res.score?"":esc(q.model)} ${q.e?esc(q.e):""}</div>`;
      if(!res.score)h+='<div class="row"><button class="btn" data-act="override">I was right, count it</button></div>';
    }
  }else{
    const st=r.stage[r.i]||0;
    h+=`<textarea id="wtext" placeholder="Write your answer as you would in the exam..."${st?" disabled":""}>${esc(r.text[r.i]||"")}</textarea>`;
    if(!st)h+='<div class="row"><button class="btn primary" data-act="reveal">Show model answer</button></div>';
    else{
      const tk=r.ticks[r.i]||{};const got=q.pts.filter((_,i)=>tk[i]).length;
      h+=`<div class="lab">Model answer</div><div class="a" style="border-left:3px solid var(--accent);padding-left:14px">${esc(q.model)}</div><div class="lab">Tick every marking point your answer made</div><div class="pts">`+q.pts.map((p,i)=>`<label><input type="checkbox" data-act="wtick" data-i="${i}"${tk[i]?" checked":""}${res?" disabled":""}><span>${esc(p)}</span></label>`).join("")+"</div>";
      if(!res)h+=`<div class="row"><button class="btn primary" data-act="wsave">Save score (${fmt(got/q.pts.length*T.m)} of ${T.m})</button></div>`;
      else h+=`<div class="fb ${res.score>=T.m?"ok":"no"}">Scored ${fmt(res.score)} of ${T.m}.</div>`;
    }
  }
  if(res){h+=`<div class="row"><button class="btn primary" data-act="next">${r.i+1<r.qs.length?"Next question":"See results"}</button></div>`;}
  return h+"</div>";
}
function fmt(x){return (Math.round(x*2)/2).toString();}
function setRes(score,extra){const r=S.run,q=r.qs[r.i];r.res[r.i]=Object.assign({score:score,max:TM[q.t].m},extra||{});render();}
function evalResult(){
  const r=S.run;let sc=0,mx=0;const by={};
  r.qs.forEach((q,i)=>{const x=r.res[i]||{score:0,max:TM[q.t].m};sc+=x.score;mx+=x.max;const b=by[q.t]||(by[q.t]={s:0,m:0,n:0});b.s+=x.score;b.m+=x.max;b.n++;});
  const pct=Math.round(sc/mx*100);
  const msg=pct>=85?"Exam ready on this material.":pct>=65?"Solid. Revisit the misses below.":pct>=40?"Getting there. Use the Learn section on the weak topics.":"Go back to the recall cards, then try again.";
  let h=`<div class="panel"><div class="lab">Result</div><div class="score">${fmt(sc)} / ${mx} <span style="font-size:1.5rem;color:var(--muted)">${pct}%</span></div><p>${msg}</p><div style="display:flex;flex-direction:column;gap:10px">`;
  TYPES.forEach(t=>{const b=by[t.k];if(!b)return;const p=Math.round(b.s/b.m*100);h+=`<div><div class="row" style="justify-content:space-between"><span>${esc(t.n)} (${b.n})</span><b>${fmt(b.s)}/${b.m}</b></div><div class="bar"><i style="width:${p}%"></i></div></div>`;});
  const missed=r.qs.filter((q,i)=>(r.res[i]||{score:0}).score<TM[q.t].m).length;
  h+=`</div><div class="row">${missed?`<button class="btn primary" data-act="retry">Retry the ${missed} missed</button>`:""}<button class="btn" data-act="newtest">New test</button></div></div>`;
  h+="<h2>Review</h2>";
  r.qs.forEach((q,i)=>{const x=r.res[i]||{score:0,max:TM[q.t].m};const ok=x.score>=x.max;
    let ans=q.t==="mcq"?q.opts[q.a]:q.t==="tf"?(q.a?"True":"False"):q.model;
    h+=`<div class="rev ${ok?"ok":"bad"}"><div class="lab">${esc(TM[q.t].n)} · ${fmt(x.score)}/${x.max}</div><b>${esc(q.q)}</b>${x.resp?`<div class="r">You: ${esc(x.resp)}</div>`:""}<div class="r">${ok?"":"Answer: "}${esc(ans)}</div></div>`;});
  return '<div style="display:flex;flex-direction:column;gap:14px">'+h+"</div>";
}
function finishRun(){
  const r=S.run;let sc=0,mx=0;r.qs.forEach((q,i)=>{const x=r.res[i]||{score:0,max:TM[q.t].m};sc+=x.score;mx+=x.max;});
  if(!r.retry){store.hist.unshift({d:new Date().toLocaleDateString(undefined,{day:"numeric",month:"short"}),pct:Math.round(sc/mx*100),n:r.qs.length});store.hist=store.hist.slice(0,8);save();}
  S.ev.view="result";
}

/* ============ EVENTS ============ */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");if(!el)return;
  const a=el.dataset.act,v=el.dataset.v;
  switch(a){
    case "tab":S.tab=v;render();break;
    case "lv":S.lv=v;render();break;
    case "csec":S.cards.sec=+v;buildQueue();render();break;
    case "flip":S.cards.flip=true;render();break;
    case "cnext":buildQueue();render();break;
    case "creset":CARDS.forEach((k,i)=>{if(S.cards.sec<0||k[0]===S.cards.sec)delete store.box[i];});save();buildQueue();render();break;
    case "rate":{const q=S.cards.queue,id=q.shift();let b=store.box[id]||0;
      if(v==="miss"){b=1;q.splice(Math.min(3,q.length),0,id);}
      else if(v==="almost"){b=Math.max(b,1);q.push(id);}
      else{b=b<2?2:3;S.cards.done++;}
      store.box[id]=b;save();S.cards.flip=false;S.cards.guess="";render();break;}
    case "cord":S.cards.ordered=v==="1";buildQueue();render();break;
    case "pstep":openStep(+v);break;
    case "pback":S.path.step=null;render();window.scrollTo(0,0);break;
    case "pnotes":S.path.ph="primer";render();window.scrollTo(0,0);break;
    case "pstart":S.path.ph="learn";S.path.i=0;render();break;
    case "plback":if(S.path.i>0)S.path.i--;render();break;
    case "plnext":{const P=S.path,ids=stepChunks(STEPS[P.step])[P.ch];
      if(P.i+1<ids.length)P.i++;else{P.ph="recall";P.q=shuffle(ids.slice());P.flip=false;P.guess="";}
      render();break;}
    case "pflip":S.path.flip=true;render();break;
    case "prate":{const P=S.path;applyRate(P.q,v);P.flip=false;P.guess="";
      if(!P.q.length){store.path.ch[P.step]=P.ch+1;save();P.ph="roundend";}
      render();break;}
    case "pnext":{const P=S.path,N=stepChunks(STEPS[P.step]).length;
      if(P.ch+1<N){P.ch++;P.ph="learn";P.i=0;}else P.ph="gaps";
      render();window.scrollTo(0,0);break;}
    case "pdump":S.path.ph="dump";render();window.scrollTo(0,0);break;
    case "pcheck":{const t=$("#ptext");if(t)S.path.text=t.value;S.path.dchecked=true;render();break;}
    case "pfinish":store.path.done[S.path.step]=true;save();S.path.ph="done";render();window.scrollTo(0,0);break;
    case "pnextstep":openStep(S.path.step+1);break;
    case "blank":el.classList.toggle("on");break;
    case "revall":document.querySelectorAll(".blank").forEach(b=>b.classList.add("on"));break;
    case "hideall":document.querySelectorAll(".blank").forEach(b=>b.classList.remove("on"));break;
    case "mask":if(el.classList.contains("hid")){el.classList.remove("hid");el.removeAttribute("role");}break;
    case "tmode":S.tmode[el.dataset.t]=v;render();break;
    case "dtopic":S.dump={i:+v,text:"",checked:false,ticks:{}};render();break;
    case "dcheck":S.dump.checked=true;render();break;
    case "dreset":S.dump.checked=false;S.dump.ticks={};S.dump.text="";render();break;
    case "estart":{const pool=shuffle(BANK.filter(b=>S.ev.types[b.t]));const list=S.ev.n?pool.slice(0,S.ev.n):pool;
      list.sort((x,y)=>TYPES.findIndex(t=>t.k===x.t)-TYPES.findIndex(t=>t.k===y.t));startRun(list);break;}
    case "mcq":{const r=S.run,q=r.qs[r.i],i=+el.dataset.i;setRes(q.o[i].c?1:0,{pick:i,resp:q.o[i].t});break;}
    case "tf":{const r=S.run,q=r.qs[r.i],p=v==="true";setRes(p===q.a?1:0,{pick:p,resp:p?"True":"False"});break;}
    case "check":doCheck();break;
    case "override":{const r=S.run;r.res[r.i].score=TM[r.qs[r.i].t].m;render();break;}
    case "reveal":{const r=S.run;r.text[r.i]=$("#wtext").value;r.stage[r.i]=1;render();break;}
    case "wsave":{const r=S.run,q=r.qs[r.i],tk=r.ticks[r.i]||{};const got=q.pts.filter((_,i)=>tk[i]).length;setRes(Math.round(got/q.pts.length*TM[q.t].m*2)/2,{resp:r.text[r.i]||""});break;}
    case "next":{const r=S.run;if(r.i+1<r.qs.length){r.i++;render();window.scrollTo(0,0);}else{finishRun();render();window.scrollTo(0,0);}break;}
    case "retry":{const r=S.run;const list=r.qs.filter((q,i)=>(r.res[i]||{score:0}).score<TM[q.t].m);startRun(list);S.run.retry=true;break;}
    case "newtest":S.ev.view="setup";S.run=null;render();break;
    default:labClick(a,el,v);
  }
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.dataset.lsel){labSelect(el);return;}
  if(el.dataset.act==="etype"){S.ev.types[el.dataset.v]=el.checked?1:0;render();}
  else if(el.id==="en"){S.ev.n=+el.value;}
  else if(el.dataset.act==="ptick"){S.path.ticks[el.dataset.i]=el.checked;render();}
  else if(el.dataset.act==="dtick"){S.dump.ticks[el.dataset.i]=el.checked;render();}
  else if(el.dataset.act==="wtick"){const r=S.run;r.ticks[r.i]=r.ticks[r.i]||{};r.ticks[r.i][el.dataset.i]=el.checked;render();}
});
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.dataset&&el.dataset.cid){CS.src[el.dataset.cid]=el.value;return;}
  if(el.dataset&&el.dataset.iid){CS.inp[el.dataset.iid]=el.value;return;}
  if(el.dataset&&(el.dataset.lin||el.dataset.tcell!==undefined)){labInput(el);return;}
  if(el.id==="guess")S.cards.guess=el.value;
  else if(el.id==="pguess")S.path.guess=el.value;
  else if(el.id==="ptext")S.path.text=el.value;
  else if(el.id==="dtext")S.dump.text=el.value;
  else if(el.id==="ans"&&S.run)S.run.text[S.run.i]=el.value;
});
function doCheck(){
  const r=S.run,q=r.qs[r.i],v=($("#ans").value||"").trim();if(!v)return;
  r.text[r.i]=v;setRes((q.t==="calc"?matchCalc(v,q):matches(v,q.acc,q.all))?TM[q.t].m:0,{resp:v});
}
document.addEventListener("keydown",e=>{
  const t=e.target,tag=t.tagName;
  if(e.key==="Enter"&&t.id==="ans"){e.preventDefault();doCheck();return;}
  if(t.classList&&t.classList.contains("codearea")){
    if(e.key==="Tab"&&!e.shiftKey){e.preventDefault();const p=t.selectionStart;t.setRangeText("    ",p,t.selectionEnd,"end");CS.src[t.dataset.cid]=t.value;return;}
    if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)){e.preventDefault();const b=t.closest(".cw").parentElement.querySelector('[data-act="crun"],[data-act="fcheck"]');if(b)b.click();return;}
  }
  if(e.key==="Enter"&&t.id==="pguess2"){e.preventDefault();const b=document.querySelector('[data-act="pcheck2"]');if(b&&!b.disabled)b.click();return;}
  if((e.key==="Enter"||e.key===" ")&&t.classList&&t.classList.contains("hid")){e.preventDefault();t.click();return;}
  const inPath=S.tab==="learn"&&S.lv==="path"&&S.path.ph==="recall"&&S.path.q.length>0;
  const inCards=S.tab==="learn"&&S.lv==="cards"&&S.cards.queue.length>0;
  if(!(inPath||inCards)||tag==="INPUT"||tag==="TEXTAREA"||tag==="SELECT")return;
  const flipped=inPath?S.path.flip:S.cards.flip;
  if((e.key===" "||e.key==="Enter")&&tag!=="BUTTON"&&!flipped){e.preventDefault();if(inPath)S.path.flip=true;else S.cards.flip=true;render();}
  else if(flipped&&"123".includes(e.key)&&e.key){const m={"1":"miss","2":"almost","3":"got"};const b=document.querySelector('[data-act$="rate"][data-v="'+m[e.key]+'"]');if(b)b.click();}
});
render();
</script>

</body></html>
