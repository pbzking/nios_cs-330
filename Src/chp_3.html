const STEPS=[
{t:"Software and its types",sec:[0],notes:[0],dump:[0],blocks:[
 {h:"Software",d:"Software is the collection of programs, instructions, data and documentation that directs a computer to perform specific tasks.",p:["Unlike hardware, which is physical and tangible, software is entirely intangible: it has no mass and exists as a sequence of binary instructions stored on a medium and loaded into memory for execution. A brand-new, fully assembled computer with no operating system does nothing beyond running the small firmware program in its ROM, which exists to locate and load further software."]},
 {h:"Hardware and software",p:["Hardware provides the physical platform (processor, memory, storage, input and output devices); software provides the instructions that tell the hardware what to do. The two are completely interdependent: hardware without software cannot perform any task, and software without hardware has no medium on which to run. Identical hardware becomes a different machine depending on the software that runs on it."],t:T[0]},
 {h:"The cost asymmetry",p:["Because software can be copied at essentially zero marginal cost, producing the first copy (research, design, coding) may cost millions while the ten-millionth copy costs almost nothing. This explains why software piracy is persistent, why subscription and licensing models exist, and why open source software, which embraces free copying, can still support an economy built on services, support and customisation."]},
 {h:"Types of software",p:["Software is classified into three types according to its purpose and the level at which it operates."],l:["System software operates at the lowest level, closest to the hardware, and manages the computer's resources, providing the platform on which everything else runs.","Application software operates at a higher level, built on system software, and helps the user accomplish specific productive tasks.","Utility software occupies a middle position: it runs on the operating system like an application but its purpose is to maintain, optimise and protect the system itself."],t:T[1]},
 {h:"Examination notes",l:["All three types must be named, each with at least one example; do not treat utility software as a subtype of application software.","'Distinguish between system software and application software': system software serves the computer by managing its resources so other programs can run, usually invisibly in the background; application software serves the user directly and is consciously opened and used."]}
]},
{t:"The operating system",sec:[1],notes:[1],dump:[1],blocks:[
 {h:"System software",d:"System software manages and controls the computer's hardware and provides the platform on which application software runs.",p:["It works closely with the hardware, typically in the background, invisible to the ordinary user but essential: without it a computer cannot function and no application can run. Its major components are the operating system, device drivers, language processors and utility programs."]},
 {h:"The operating system",d:"The operating system (OS) is system software that manages a computer's hardware resources (processor, memory, storage and input and output devices), allocating them among running programs and providing a stable, consistent platform through which application software can access the hardware without managing it directly.",p:["It is the first software loaded when a computer starts and remains active as long as the machine is on, acting as the intermediary between the user, application software and hardware. Examples: Microsoft Windows and Apple macOS on desktops; Linux on servers and desktops; Google Android and Apple iOS on mobile devices."]},
 {h:"Functions of the operating system",t:T[2]},
 {h:"Kernel and shell",d:"The kernel is the core of the operating system: the part that runs with the highest hardware privilege, directly manages the processor, memory and devices, and is loaded into memory first and kept resident for as long as the system runs. The shell is the outer layer through which the user or a program issues commands to the kernel.",p:["A shell may be a command-line shell (Bash, PowerShell) or the graphical shell that draws the desktop, icons and windows. The same kernel can wear different shells: Linux distributions such as Ubuntu and Fedora share essentially the same kernel but present very different graphical environments, while behaving identically underneath."],t:T[3]},
 {h:"The boot process",p:["Powering on a computer triggers a fixed sequence, all of it system software working before the user sees anything familiar. The firmware (BIOS or UEFI) stored in ROM runs first, before any operating system exists in memory. The Power-On Self-Test (POST) checks the processor, memory and essential devices. The firmware locates a bootable device and loads the bootloader. The bootloader loads the kernel into RAM and passes control to it. The kernel initialises drivers, mounts the file system, starts background services and finally launches the shell. The user's experience of starting the computer begins only at the last step."],t:T[4]}
]},
{t:"Operating system types and device drivers",sec:[2],notes:[2],dump:[2],blocks:[
 {h:"Types of operating system",p:["Operating systems are classified by their mode of operation."],t:T[5]},
 {h:"Real-time systems",p:["A real-time operating system guarantees a response within a strict, predictable time limit. The hard and soft distinction is precise and frequently examined; the discriminator is the consequence of a missed deadline, not merely speed: a hard real-time miss causes system failure (an airbag deploying a moment too late); a soft real-time miss causes degraded quality, not failure (a late video frame is dropped)."],t:T[6]},
 {h:"Device drivers",d:"A device driver is specialised system software acting as a translator between the operating system and one specific hardware device.",p:["Every peripheral (monitor, keyboard, mouse, printer, graphics card, sound card, network adapter) needs a corresponding driver. The driver understands the device's low-level, hardware-specific commands and translates generic OS requests into the instructions that device requires. When an application requests a print job, the OS passes it to the printer's driver, which converts it into the exact command sequence that printer model understands. Without the correct driver the OS cannot communicate with the device; hence installing new hardware usually requires installing its driver, from the manufacturer or through automatic update.","Because drivers historically ran with the same high privilege as the kernel, a faulty or malicious driver could crash or compromise the entire system. Modern operating systems increasingly isolate drivers into more restricted modes, but drivers remain a common source of instability because they sit at the seam between software's flexibility and hardware's rigidity."]},
 {h:"Language processors and utilities",p:["Language processors (assemblers, compilers and interpreters) translate human-readable programs into machine instructions; utility programs perform housekeeping and maintenance. Both are covered in later steps."]}
]},
{t:"Application software",sec:[3],notes:[3],dump:[3],blocks:[
 {h:"Application software",d:"Application software, commonly called apps, is software designed to help users perform specific, productive tasks, running on top of the operating system and relying on it to handle the underlying hardware.",p:["Where system software manages the computer's resources and infrastructure, application software directly serves the end user: writing documents, managing spreadsheets, browsing the internet, editing photographs, communicating."]},
 {h:"General-purpose application software",d:"General-purpose application software performs a wide variety of tasks useful to a broad range of users across many fields, rather than being tailored to any single industry.",t:T[7]},
 {h:"Software as a Service",d:"SaaS (Software as a Service) is general-purpose software that runs primarily on a remote server, is accessed through a web browser and keeps its data in the cloud rather than on the user's drive.",p:["Examples are Google Docs, Microsoft 365 Online and Canva. Installation becomes unnecessary, updates apply instantly and uniformly, and real-time collaboration is straightforward; the costs are the need for an internet connection and the placing of the user's data in a third party's custody. SaaS is a delivery model that can apply to either general-purpose or customised software, not a new category."]},
 {h:"Customised application software",d:"Customised (bespoke) application software is developed specifically for the unique requirements of one organisation, business or individual, rather than for a broad market.",p:["General-purpose software serves a wide audience and so offers broad but sometimes insufficient functionality; customised software is built from the ground up to match one organisation's exact workflows, processes and data requirements. Illustrations: a hospital patient management system integrating its billing, record formats, scheduling and insurance workflows; a railway reservation system handling its routes, fare structures and seat classes; a bank's core banking system managing accounts, transactions and interest calculations."],t:T[9]},
 {h:"Comparison",p:["Compare the two around cost, fit and time: general-purpose software is cheap, quick to obtain and moderately fitting; customised software is expensive, slow to build and perfectly fitting. Naming this three-way trade-off earns more credit than a list of unconnected points."],t:T[8]}
]},
{t:"Utility software",sec:[4],notes:[4],dump:[4],blocks:[
 {h:"Utility software",d:"Utility software performs specific maintenance, optimisation and protection tasks that keep a computer system healthy, efficient and secure.",p:["It works behind the scenes so that the operating system and application software continue to run smoothly and data remains protected from loss, corruption or unauthorised access. Most operating systems ship with basic utilities; third-party utilities extend them."],t:T[10]},
 {h:"Antivirus software",d:"Antivirus software detects, prevents and removes malware (viruses, worms, Trojans, ransomware, spyware and adware) through several complementary mechanisms.",p:["Signature-based detection compares files with a database of known malware signatures and quarantines or removes matches; it is fast and reliable against known threats but blind to anything new. Heuristic detection analyses behaviour and structure for patterns resembling malware, catching zero-day threats at the cost of occasional false positives. Real-time protection monitors the system continuously, scanning files as they are opened, downloaded or created."],t:T[12]},
 {h:"Backup software",d:"Backup software automates the copying of important data to a separate location (external drive, network storage, cloud) so that data can be recovered after hardware failure, malware, accidental deletion, fire or flood, or corruption.",p:["The 3-2-1 rule: three copies of the data, on two different media, with one off-site. Incremental and differential backups are often confused; the distinction hinges on one word: incremental measures change since the previous backup, whatever its type; differential measures change since the last full backup, always. Hence an incremental chain needs every link in order, while a differential restore needs only the full backup and the latest differential."],t:T[11]},
 {h:"File compression",d:"File compression software reduces file size by identifying and eliminating redundancy in data, so that the file occupies less storage and transmits faster.",p:["Compression is lossless when the original can be perfectly reconstructed (essential for documents, programs and data) and lossy when some data is permanently discarded for a much higher ratio (acceptable for images, audio and video). Common lossless formats are ZIP, RAR and 7z; utilities such as WinRAR, WinZip and 7-Zip bundle files into one, often password-protectable, archive."],t:T[13]},
 {h:"Disk cleanup and defragmentation",p:["Disk cleanup scans for files no longer needed (temporary files, cached browser data, system logs, old update files, the Recycle Bin, installer leftovers) and lets the user reclaim the space.","On a hard disk drive, files are written into whatever free space is available; as they are created, edited, deleted and grown, free space becomes scattered and a file may be split into non-contiguous fragments, so the read/write head must travel to several places. Disk defragmentation reorganises data so each file's fragments are contiguous and free space consolidates, shortening head travel.","Defragmentation applies only to HDDs. An SSD has no moving parts and reaches every location in the same time, so defragmenting gives no benefit and only uses write cycles; the OS uses TRIM instead."]},
 {h:"Formatting, partitioning, monitoring and restore",p:["Disk formatting writes an empty file system structure (NTFS, exFAT, ext4) onto a device. Disk partitioning divides one physical drive into logical sections addressed as separate drives. A system monitor (Task Manager, Activity Monitor, top/htop) shows processes and their resource use in real time; a system restore utility saves snapshots of system settings so the OS can be rolled back after a bad update."],t:T[14]},
 {h:"Examination note",p:["Questions commonly ask for five utilities: antivirus, backup, compression, disk cleanup and defragmentation. A sixth, correctly explained (disk formatting or system restore), marks a thorough answer."]}
]},
{t:"Language translators",sec:[5],notes:[5],dump:[5],blocks:[
 {h:"Language translators",d:"A language translator is software that converts a program written in one language (the source) into an equivalent program in another (the target, typically machine code).",p:["Computers can directly execute only machine language, and writing programs in binary is extraordinarily difficult and error-prone, so translators bridge the gap between human-readable languages and machine-executable code. The three primary types are the assembler, the compiler and the interpreter."]},
 {h:"Assembler",d:"An assembler converts programs written in assembly language into machine code.",p:["Assembly language uses short mnemonics (MOV, ADD, SUB, JMP), each corresponding directly to a single machine instruction for a specific processor architecture. The assembler replaces each mnemonic with its binary equivalent and resolves symbolic names and addresses, producing an object file. Because assembly is architecture-specific, an assembler for one processor family cannot assemble code for another. Assembly gives precise control, useful for kernels, drivers and performance-critical routines, but is far more tedious than high-level programming."]},
 {h:"Compiler",d:"A compiler converts an entire program written in a high-level language into machine code or an intermediate form in one complete translation pass.",p:["It reads the whole source file, analyses it for correctness, optimises it and produces output that can subsequently run independently of the compiler. Advantage: the executable runs very fast, since no translation occurs at runtime. Disadvantage: the entire program must be correct before any of it runs; a single error anywhere prevents compilation."],t:T[16]},
 {h:"Linking and loading",p:["A compiler's direct output is usually an object file: machine code for one source file, with calls to functions defined elsewhere left as unresolved placeholders. The linker combines one or more object files with the library functions they call, resolving every placeholder into an actual memory address, to produce a single executable. Large programs compile files separately and link at the end, so only the changed file need be recompiled and relinked. The loader is an operating system component that, when the program is run, copies the executable into RAM, allocates the memory it needs and hands control to its starting instruction. Compilation happens once; loading happens every time the program runs."],t:T[17]},
 {h:"Interpreter",d:"An interpreter translates and executes a high-level program one statement at a time, rather than producing a separate output file.",p:["Each statement is translated and immediately run before the next is examined. Advantage: interactive, incremental development; an error stops execution and is reported at that exact line, making debugging easy. Disadvantage: speed, because translation overhead is paid every time each statement executes, including every pass through a loop. Python, Ruby and (in many contexts) JavaScript are interpreted.","Java popularised a middle path: source is compiled to bytecode, a compact, platform-independent intermediate form, which runs on the Java Virtual Machine (JVM). The JVM uses JIT (Just-In-Time) compilation: it interprets bytecode at first, identifies hot code that runs repeatedly and compiles it to native machine code on the fly, caching the result. Modern JavaScript engines such as V8 and Python's PyPy use the same principle."]},
 {h:"The three translators compared",t:T[15],p:["Anchor a compiler versus interpreter answer on when translation happens: a compiler translates everything before execution and produces a standalone file; an interpreter translates and executes simultaneously, statement by statement, with no separate output file. Speed, error reporting and suitability for debugging all follow from that distinction."]}
]},
{t:"Programming languages",sec:[6],notes:[6],dump:[6],blocks:[
 {h:"Programming languages",d:"A programming language is a formal language with a defined vocabulary and grammar that humans use to write instructions for a computer.",p:["Languages have evolved through five generations, each offering progressively higher abstraction: further from the hardware's native binary instructions and closer to human language."]},
 {h:"First generation: machine language",p:["Machine language is the only language a processor executes directly, without translation: pure binary instructions specifying operations, memory addresses and data. It is extremely tedious to write, entirely processor-specific and not portable. It remains foundational because every program, whatever language it is written in, must ultimately be translated to it."]},
 {h:"Second generation: assembly language",p:["Assembly language replaces binary codes with short mnemonics, each corresponding to exactly one machine instruction. It is easier than binary but very close to the hardware, requires detailed knowledge of the processor and is not portable. It is still used for operating system kernels, device drivers, interrupt handlers and performance-critical routines."]},
 {h:"Third generation: high-level languages",p:["High-level languages (HLLs) use vocabulary and syntax close to English and mathematical notation and abstract the hardware away entirely; one statement may expand into dozens or hundreds of machine instructions. They support structured constructs (loops, conditionals, functions, data structures) and are portable. The first widely used HLLs were FORTRAN (scientific computing, 1950s), COBOL (business data processing) and ALGOL (algorithmic computing); later came C (efficiency and system-level access), C++ (object-oriented extension of C), Java (write once, run anywhere) and Python (readability). HLLs are the standard tool for virtually all software development today."]},
 {h:"Fourth generation languages",p:["Where 3GLs require specifying how a task is accomplished, 4GLs let the programmer specify primarily what is wanted, leaving the how to the language system. They are typically domain-specific (database querying, report generation, business applications). SQL is the archetypal 4GL: SELECT name, salary FROM employees WHERE department = 'Engineering' ORDER BY salary DESC; the database management system decides the most efficient way to execute it. Other 4GLs include report generators, form builders and the macro languages of office software."]},
 {h:"Fifth generation languages",p:["A 5GL states a goal or constraint and leaves the system to work out both method and steps, often using AI techniques (logical inference, constraint solving, pattern matching). Prolog, built on formal logic, is the classic example: a program consists of facts and rules, and a query asks the system to prove or find something consistent with them. Constraint programming languages used in scheduling and resource allocation work similarly. 5GLs remain a niche within artificial intelligence and research."],t:T[18]},
 {h:"Programming paradigms",p:["Generation describes how close to the hardware a language sits; paradigm describes how a program is structured and thought about, and cuts across generations. A single 3GL such as Python supports several paradigms at once."],t:T[19]},
 {h:"Examination note",t:T[20],p:["Do not conflate generation with paradigm: Python is a third-generation, high-level language and also supports procedural, object-oriented and functional paradigms. Naming both dimensions signals a stronger grasp."]}
]},
{t:"Software licensing",sec:[7],notes:[7],dump:[7],blocks:[
 {h:"Software licensing",d:"Software licensing is the legal framework governing how software may be used, copied, distributed and modified.",p:["Obtaining software typically does not mean purchasing ownership but obtaining a licence: legal permission to use it under terms set by its creator or copyright holder. The major categories are open source, proprietary, freeware, shareware and firmware."]},
 {h:"Open source software",d:"Open source software makes its source code publicly available for anyone to view, study, use, modify and distribute, typically at no cost.",p:["The philosophy is that software improves through collaborative, transparent development: when many people can examine the code, find bugs and contribute improvements, the result benefits from far more expertise than one company could assemble. The Open Source Initiative (OSI) defined the term and maintains its criteria. Examples: Linux, Apache OpenOffice, LibreOffice, Mozilla Firefox, VLC, GIMP."],t:T[22]},
 {h:"GNU and the birth of Linux",p:["The GNU project, begun by Richard Stallman in 1983, aimed to build a completely free, Unix-like operating system, and introduced FOSS (Free and Open Source Software), where free means freedom to use, study, modify and redistribute, not primarily price. The GNU GPL and its tools (a compiler, a text editor, a shell) formed the foundation on which Linus Torvalds built the Linux kernel in 1991, together producing the GNU/Linux operating system that runs the majority of the world's servers, supercomputers and (via Android) mobile devices."]},
 {h:"Proprietary software and piracy",d:"Proprietary (closed-source or commercial) software keeps its source code secret and distributes only compiled binary executables.",p:["Users receive a licence, not ownership, under an End User Licence Agreement (EULA) covering permitted uses, installation limits and copying restrictions. Violating the EULA constitutes software piracy, which is illegal. Proprietary software is sold as a one-time purchase, subscription or per-user licence, protecting intellectual property and funding development; users depend on the vendor for fixes, updates and support (Microsoft Windows, Microsoft Office, Adobe Photoshop, macOS).","Software piracy is the unauthorised copying, distribution or use of software in violation of its licence: installing one licensed copy on more machines than permitted, distributing cracked or key-generated copies, counterfeiting retail packaging. Pirated software commonly carries bundled malware and receives no legitimate security updates, so it is both a legal and a security risk."]},
 {h:"Freeware",d:"Freeware is software available at no cost, freely downloadable, usable and distributable, but without source code access.",p:["It remains proprietary underneath: only the compiled binary is free, users cannot view, modify or redistribute the source, and the developer retains full copyright. It is often a marketing strategy or a developer sharing a useful tool (Adobe Acrobat Reader, VLC, the basic version of Skype). Freeware is free of charge, not free in the FOSS sense."],t:T[24]},
 {h:"Shareware",d:"Shareware is software provided free for a limited trial period or with limited features, with the expectation that satisfied users will pay for the full licence.",p:["Example: WinRAR continues to function past its 40-day trial with a persistent purchase reminder; many antivirus tools offer free basic protection alongside paid premium tiers."],t:T[23]},
 {h:"Firmware",d:"Firmware is software permanently or semi-permanently stored in a device's non-volatile memory (typically ROM or flash), providing the low-level instructions that directly control the device's hardware.",p:["It is software in that it is program code, and hardware-like in that it is inseparable from and specific to one device. A computer's BIOS or UEFI initialises hardware and loads the OS; a printer's firmware controls its print mechanism; routers, televisions, cameras, microwave ovens and automobile control systems all embed firmware. End users rarely modify it, though manufacturers release firmware upgrades."]},
 {h:"Dual licensing and open-core",p:["Not every product fits one category; open source and commercial are independent choices that can be combined."],t:T[25]},
 {h:"Summary of licence types",p:["Run every option through the same four questions: is the source code visible, is it free, can it be modified, can it be redistributed."],t:T[21]}
]}
];

/* ---------- compiler phases ---------- */
const KW=["int","float","double","char","string","if","else","while","for","return"],TYPEN=["int","float","double","char","string"];
function cTok(src){
  const toks=[],re=/\s*(?:("(?:[^"\\]|\\.)*"?)|(\d+\.?\d*)|([A-Za-z_]\w*)|(==|!=|<=|>=|&&|\|\||[-+*\/%=<>!])|([(){};,])|(\S))/y;
  String(src).split("\n").forEach((ln,li)=>{let p=0,m;while(p<ln.length){re.lastIndex=p;m=re.exec(ln);if(!m)break;p=re.lastIndex;
    if(m[1]!==undefined)toks.push({l:li+1,v:m[1],t:"string literal"});
    else if(m[2]!==undefined)toks.push({l:li+1,v:m[2],t:"numeric literal"});
    else if(m[3]!==undefined)toks.push({l:li+1,v:m[3],t:KW.indexOf(m[3])>=0?"keyword":"identifier"});
    else if(m[4]!==undefined)toks.push({l:li+1,v:m[4],t:"operator"});
    else if(m[5]!==undefined)toks.push({l:li+1,v:m[5],t:"punctuation"});
    else if(m[6]!==undefined)toks.push({l:li+1,v:m[6],t:"INVALID"});}});
  return toks;
}
function parseStmt(ts){

  const peek=()=>ts[i];
  function expr(){let a=term();while(peek()&&/^[-+]$/.test(peek().v)&&peek().t==="operator"){const o=ts[i++].v;a={k:"b",o:o,a:a,b:term()};}return a;}
  function term(){let a=un();while(peek()&&/^[*\/%]$/.test(peek().v)&&peek().t==="operator"){const o=ts[i++].v;a={k:"b",o:o,a:a,b:un()};}return a;}
  function un(){if(peek()&&peek().v==="-"&&peek().t==="operator"){i++;return {k:"u",a:un()};}return atom();}
  function atom(){const t=ts[i++];
    if(!t)fail("the expression is incomplete (a value is missing at the end)");
    if(t.t==="numeric literal")return {k:"n",v:t.v};
    if(t.t==="string literal")return {k:"s",v:t.v};
    if(t.v==="("&&t.t==="punctuation"){const e=expr();if(!peek()||peek().v!==")")fail("a closing bracket ')' is missing");i++;return e;}
    if(t.t==="identifier"){if(peek()&&peek().v==="("){i++;const args=[];if(peek()&&peek().v!==")"){args.push(expr());while(peek()&&peek().v===","){i++;args.push(expr());}}if(!peek()||peek().v!==")")fail("a closing bracket ')' is missing after the arguments");i++;return {k:"c",f:t.v,args:args};}return {k:"v",v:t.v};}
    fail("unexpected '"+t.v+"' where a value was expected");}
  let type=null;if(ts[0]&&ts[0].t==="keyword"&&TYPEN.indexOf(ts[0].v)>=0){type=ts[0].v;i++;}
  if(ts[i]&&ts[i].t==="identifier"&&ts[i+1]&&ts[i+1].v==="="){

  if(type){if(ts[i]&&ts[i].t==="identifier"&&i===ts.length-1)return {k:"decl",type:type,name:ts[i].v};fail("a variable name is expected after '"+type+"'");}
  const e=expr();if(i<ts.length)fail("unexpected '"+ts[i].v+"' after the expression");if(e.k!=="c")fail("this is not a valid statement (expected an assignment or a function call)");return {k:"call",e:e};
}
function exType(e,env){switch(e.k){case "n":return /\./.test(e.v)?"float":"int";case "s":return "string";case "v":return env[e.v]||"?";case "u":return exType(e.a,env);case "c":return "any";default:{const a=exType(e.a,env),b=exType(e.b,env);if(a==="string"||b==="string")return "string";if(a==="float"||b==="float"||a==="double"||b==="double")return "float";return a==="?"||b==="?"?"?":"int";}}}
function exUses(e,out){if(e.k==="v")out.push(e.v);else if(e.k==="u")exUses(e.a,out);else if(e.k==="b"){exUses(e.a,out);exUses(e.b,out);}else if(e.k==="c")e.args.forEach(a=>exUses(a,out));return out;}
function fold(e){if(e.k==="b"){const a=fold(e.a),b=fold(e.b);if(a.k==="n"&&b.k==="n"){const x=+a.v,y=+b.v;let r;if(e.o==="+")r=x+y;else if(e.o==="-")r=x-y;else if(e.o==="*")r=x*y;else if(e.o==="/"&&y!==0)r=x/y;else if(e.o==="%"&&y!==0)r=x%y;if(r!==undefined)return {k:"n",v:String(Math.round(r*1e6)/1e6)};}return {k:"b",o:e.o,a:a,b:b};}if(e.k==="u"){const a=fold(e.a);return a.k==="n"?{k:"n",v:String(-a.v)}:{k:"u",a:a};}if(e.k==="c")return {k:"c",f:e.f,args:e.args.map(fold)};return e;}

function compileRes(){
  const toks=cTok(L.cc);let h="";
  if(!toks.length)return {cmres:note("Enter a few lines of code, for example: int total = 5;")};
  h+="<h4>1. Lexical analysis: tokens</h4>";
  h+='<div class="tbl"><table><thead><tr><th>Line</th><th>Token</th><th>Type</th></tr></thead><tbody>'+toks.map(t=>"<tr><td>"+t.l+'</td><td class="mono">'+esc(t.v)+"</td><td>"+(t.t==="INVALID"?"<b>invalid character</b>":t.t)+"</td></tr>").join("")+"</tbody></table></div>";
  const bad=toks.filter(t=>t.t==="INVALID");
  const stm=[];let cur=[];
  toks.forEach(t=>{if(t.v===";"&&t.t==="punctuation"){stm.push({ts:cur,semi:true});cur=[];}else cur.push(t);});
  if(cur.length)stm.push({ts:cur,semi:false});
  const synErr=[],asts=[];
  bad.forEach(t=>synErr.push("Line "+t.l+": invalid character '"+t.v+"' (lexical error)"));
  stm.forEach(s=>{const line=s.ts.length?s.ts[0].l:0;if(!s.ts.length)return;if(s.ts.some(t=>t.t==="INVALID"))return;
    try{const a=parseStmt(s.ts);a.l=line;if(!s.semi)synErr.push("Line "+s.ts[s.ts.length-1].l+": missing semicolon ';' at the end of the statement");asts.push(a);}catch(e){synErr.push(e.tok&&e.tok.l>e.prev.l?"Line "+e.prev.l+": missing semicolon ';' at the end of the statement":"Line "+line+": "+e.message);}});
  h+="<h4>2. Syntax analysis (parsing)</h4>"+(synErr.length?badb(synErr.map(esc).join("<br>")+"<br>No parse tree can be completed: a compiler stops here and reports the errors; nothing is run.")+"":okb("Every statement follows the grammar: assignments (type name = expression;) and function calls. "+asts.length+" statement(s) parsed into parse trees."));
  const sem=[],env={};
  if(!synErr.length){
    asts.forEach(a=>{
      const uses=a.k==="decl"?[]:exUses(a.k==="call"?a.e:a.e,[]);
      uses.forEach(u=>{if(!(u in env))sem.push("Line "+a.l+": '"+u+"' is used but has not been declared");});
      if(a.k==="decl"||(a.k==="as"&&a.type)){if(a.name in env)sem.push("Line "+a.l+": '"+a.name+"' is declared more than once");}
      if(a.k==="as"&&!a.type&&!(a.name in env))sem.push("Line "+a.l+": assignment to '"+a.name+"', which has not been declared");
      if(a.k==="as"){const tt=a.type||env[a.name],vt=exType(a.e,env);

        if((tt==="string"||tt==="char")&&(vt==="int"||vt==="float"))sem.push("Line "+a.l+": incompatible assignment: a number cannot be assigned to "+tt+" '"+a.name+"'");}
      if(a.k==="decl"||a.k==="as"){if(a.type&&!(a.name in env))env[a.name]=a.type;}
    });
    h+="<h4>3. Semantic analysis</h4>"+(sem.length?badb(sem.map(esc).join("<br>")+"<br>These statements are grammatical but logically wrong; compilation stops."):okb("No undeclared names, redeclarations or incompatible assignments found."));

function traceRes(){
  const g=x=>{const n=parseInt(String(x).trim(),10);return isFinite(n)&&n>=0?n:null;};
  const N=g(L.tn),E=g(L.te),m=g(L.tm),k=g(L.tk);
  if(N===null||N<1||N>200||E===null||E>N||m===null||m>N||k===null||k<1||k>1000000)return {trres:note("Enter valid whole numbers: statements (1 to 200), error line (0 for none, at most the number of statements), loop body size (at most the number of statements) and loop count.")};
  let h='<div class="tbl"><table><thead><tr><th></th><th>Compiler</th><th>Interpreter</th></tr></thead><tbody>';
  const err=E>0;
  h+="<tr><th>Lines translated before anything runs</th><td>All "+N+" (the whole program)</td><td>None: it translates as it goes</td></tr>";
  h+="<tr><th>Result</th><td>"+(err?"Compilation fails at line "+E+"; no output file, <b>nothing runs</b>":"Compiles; an executable is produced")+"</td><td>"+(err?"Lines 1 to "+(E-1)+" run; stops at line "+E+" with an error":"Runs all "+N+" lines")+"</td></tr>";
  const runs=err?0:N-m+m*k,itr=err?E:N-m+m*k;
  h+="<tr><th>Translations performed</th><td>"+N+" (once)</td><td>"+(err?E+" (up to the error)":(N-m+m*k).toLocaleString()+" (the "+m+"-line loop body is translated again on each of "+k.toLocaleString()+" passes)")+"</td></tr>";
  h+="</tbody></table></div>";
  h+='<p class="hint">The interpreter pays the translation cost again on every execution of a statement, including every pass of a loop; this is why interpreted programs are slower, and why reporting an error at the exact line makes debugging easy.</p>';
  return {trres:h};
}

function backupRes(){

  if(!isFinite(full)||full<=0||ch.length<1||ch.length>7||ch.some(x=>!isFinite(x)||x<0))return {bkres:note("Enter the full backup size in GB and 1 to 7 daily changes in GB, separated by commas.")};
  const rd=Math.min(Math.max(parseInt(L.brd,10)||ch.length,1),ch.length);
  const days=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  let cum=0,rows="",tf=0,ti=0,td=0;
  ch.forEach((c,i)=>{cum+=c;tf+=full;ti+=c;td+=cum;rows+="<tr><td>"+days[i]+'</td><td class="mono">'+c+'</td><td class="mono">'+full+'</td><td class="mono">'+c+'</td><td class="mono">'+Math.round(cum*100)/100+"</td></tr>";});
  const r2=x=>Math.round(x*100)/100;
  let h='<p class="hint">A full backup is taken on Sunday ('+full+" GB). Daily changes are assumed to be to different files.</p>";
  h+='<div class="tbl"><table style="text-align:center"><thead><tr><th>Day</th><th>Data changed</th><th>Full each night</th><th>Incremental</th><th>Differential</th></tr></thead><tbody>'+rows+'<tr><th>Total</th><td></td><td class="mono"><b>'+r2(tf)+'</b></td><td class="mono"><b>'+r2(ti)+'</b></td><td class="mono"><b>'+r2(td)+"</b></td></tr></tbody></table></div>";
  const need=ch.slice(0,rd).reduce((a,b)=>a+b,0);
  h+="<h4>Restoring "+days[rd-1]+"'s data</h4><div class=\"tbl\"><table><thead><tr><th>Strategy</th><th>Backup sets needed</th><th>Data to read</th></tr></thead><tbody>";
  h+="<tr><th>Full each night</th><td>1 (the "+days[rd-1]+" full backup)</td><td class=\"mono\">"+full+" GB</td></tr>";
  h+="<tr><th>Incremental</th><td>"+(rd+1)+" (Sunday full plus "+rd+" increments, in order)</td><td class=\"mono\">"+r2(full+need)+" GB</td></tr>";
  h+="<tr><th>Differential</th><td>2 (Sunday full plus the "+days[rd-1]+" differential)</td><td class=\"mono\">"+r2(full+need)+" GB</td></tr></tbody></table></div>";
  h+='<p class="hint">Incremental: smallest nightly size but the longest restore chain; differential: grows through the week but only two sets are ever needed; full each night: largest but simplest to restore. The 3-2-1 rule: three copies, two media, one off-site.</p>';
  return {bkres:h};
}

function licRes(){

  const sc=LICS.map(l=>({n:l[0],ex:l[2],m:l[1].filter((v,i)=>v===a[i]).length,d:l[1].map((v,i)=>v===a[i]?null:i).filter(x=>x!==null)}));
  const best=Math.max(...sc.map(s=>s.m)),Q=["source code visible","cost","modification","redistribution"];
  let h="";const hit=sc.filter(s=>s.m===4);
  if(hit.length)h+=okb("Matches: <b>"+hit.map(s=>s.n).join(", ")+"</b>. "+hit.map(s=>esc(s.ex)).join(" "));
  else h+=note("No licence type matches all four answers exactly. Closest: <b>"+sc.filter(s=>s.m===best).map(s=>s.n+" (differs on "+s.d.map(i=>Q[i]).join(", ")+")").join("; ")+"</b>.");
  if(hit.some(s=>s.n==="Open source"))h+='<p>Open source licences are then split into <b>copyleft</b> (derivatives must carry the same open licence; GNU GPL) and <b>permissive</b> (may be folded into proprietary software; MIT, Apache).</p>';
  h+='<div class="tbl"><table><thead><tr><th>Type</th><th>Source?</th><th>Cost</th><th>Modify?</th><th>Redistribute?</th><th>Fit</th></tr></thead><tbody>'+LICS.map((l,i)=>"<tr><th>"+l[0]+"</th><td>"+({y:"Yes",n:"No"}[l[1][0]])+"</td><td>"+({free:"Free",paid:"Usually paid",trial:"Trial free, then paid",dev:"With device"}[l[1][1]])+"</td><td>"+({y:"Yes",n:"No"}[l[1][2]])+"</td><td>"+({y:"Yes",n:"No",u:"Unchanged / trial only"}[l[1][3]])+"</td><td>"+sc[i].m+" / 4</td></tr>").join("")+"</tbody></table></div>";
  return {lcres:h};
}
function viewLic(){
  return '<div class="panel"><h3>Which licence type?</h3><p class="hint">Run every option through the same four questions: is the source visible, is it free, can it be modified, can it be redistributed.</p><div class="row">'+sel("lq1","Source code visible?",[["y","Yes"],["n","No"]],"lic")+sel("lq2","Cost",[["free","Free of charge"],["paid","Usually paid"],["trial","Free trial, then paid"],["dev","Included with a device"]],"lic")+sel("lq3","May the user modify it?",[["y","Yes"],["n","No"]],"lic")+sel("lq4","May the user redistribute it?",[["y","Yes"],["n","No"],["u","Unchanged copies / trial only"]],"lic")+'</div><div id="lcres">'+licRes().lcres+"</div></div>";
}

const TOOLS={sort:{v:viewSort,r:()=>({})},boot:{v:viewBoot,r:()=>({})},compile:{v:viewCompile,r:()=>Object.assign(compileRes(),traceRes())},backup:{v:viewBackup,r:backupRes},lic:{v:viewLic,r:licRes}};

function noteHtml(b){
  let h='<section class="nb"><h3>'+esc(b.h)+'</h3>';
  if(b.d)h+='<p class="def"><b>Definition.</b> '+esc(b.d)+'</p>';
  (b.p||[]).forEach(p=>{h+='<p>'+esc(p)+'</p>';});
  if(b.l)h+='<ul>'+b.l.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>';
  if(b.t)h+='<div class="tbl"><table><thead><tr>'+b.t.c.map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr></thead><tbody>'+b.t.r.map(r=>'<tr>'+r.map(c=>'<td>'+esc(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
  return h+'</section>';
}
function stepIds(st){const ids=[];CARDS.forEach((c,i)=>{if(st.sec.includes(c[0]))ids.push(i);});return ids.filter(i=>i<ORIG).concat(ids.filter(i=>i>=ORIG));}
function stepChunks(st){const ids=stepIds(st),out=[];for(let i=0;i<ids.length;i+=CH)out.push(ids.slice(i,i+CH));return out;}
function blankHtml(text){return esc(text).replace(/\{\{(.+?)\}\}/g,(m,a)=>`<button class="blank" data-act="blank" style="min-width:${Math.max(4,a.length)}ch" aria-label="Hidden term, press to reveal"><span class="ans">${a}</span></button>`);}
function applyRate(queue,v){const id=queue.shift();let b=store.box[id]||0;
  if(v==="miss"){b=1;queue.splice(Math.min(3,queue.length),0,id);}
  else if(v==="almost"){b=Math.max(b,1);queue.push(id);}
  else{b=b<2?2:3;}
  store.box[id]=b;save();}
function openStep(s){
  const P=S.path,N=stepChunks(STEPS[s]).length;
  const ch=store.path.done[s]?0:Math.min(store.path.ch[s]||0,N);
  P.step=s;P.i=0;P.flip=false;P.guess="";P.text="";P.dchecked=false;P.ticks={};P.q=[];
  if(ch>=N){P.ph="gaps";P.ch=N-1;}else{P.ch=ch;P.ph=ch>0?"learn":"primer";}
  render();window.scrollTo(0,0);
}
function pathOverview(){
  const first=STEPS.findIndex((_,s)=>!store.path.done[s]);
  let h='<div class="panel"><h2>Start here</h2><p>New to the subject? Follow the steps in order. Each step sets out the textbook notes, then teaches its cards in small rounds of six (first you see them with answers, then you recall them), then checks you with fill-the-gaps and a brain dump. Progress is saved in this browser.</p></div><div style="display:flex;flex-direction:column;gap:10px">';
  STEPS.forEach((st,s)=>{
    const N=stepChunks(st).length,done=!!store.path.done[s],ch=Math.min(store.path.ch[s]||0,N);
    const status=done?"Done":ch>0?"Round "+ch+" of "+N+" done":"Not started";
    h+=`<button class="opt" data-act="pstep" data-v="${s}" style="display:flex;justify-content:space-between;gap:12px;align-items:center"><span><b>${s+1}. ${esc(st.t)}</b><br><span class="hint">${stepIds(st).length} cards · ${N} rounds</span></span><span class="tag">${status}</span></button>`;
  });
  h+="</div>";
  if(first>=0)h+=`<div class="row"><button class="btn primary" data-act="pstep" data-v="${first}">${(store.path.ch[first]||0)>0?"Continue":"Begin"} step ${first+1}</button></div>`;
  else h+='<p>All steps are done. Keep the cards fresh in Recall cards, then test yourself in Evaluate.</p>';
  return '<div style="display:flex;flex-direction:column;gap:18px">'+h+"</div>";
}
function viewPath(){
  const P=S.path;
  if(P.step===null)return pathOverview();

  const pos=P.ph==="primer"?0:(P.ph==="learn"||P.ph==="recall"||P.ph==="roundend")?1+P.ch:P.ph==="gaps"?N+1:P.ph==="dump"?N+2:N+3;
  let h=`<div class="row" style="justify-content:space-between"><span class="row"><button class="btn" data-act="pback">All steps</button>${P.ph==="primer"||P.ph==="done"?"":'<button class="btn" data-act="pnotes">Notes</button>'}</span><span class="lab">Step ${P.step+1} of ${STEPS.length}</span></div><div class="bar" aria-hidden="true"><i style="width:${Math.round(pos/(N+3)*100)}%"></i></div><h2>${esc(st.t)}</h2>`;
  if(P.ph==="primer"){
    h+=`<div class="panel"><div class="lab">Textbook notes</div>${st.blocks.map(noteHtml).join("")}<p class="hint">Next: ${N} short rounds. In each round you see ${CH} cards with their answers, then recall them from memory.</p><div class="row"><button class="btn primary" data-act="pstart">${P.ch>0?"Continue at round "+(P.ch+1):"Start round 1"}</button></div></div>`;
  }else if(P.ph==="learn"){

  }else if(P.ph==="recall"){
    const id=P.q[0],k=CARDS[id];
    h+=`<div class="panel fc"><div class="lab">Round ${P.ch+1} of ${N} · Recall · ${P.q.length} left</div><div class="q">${esc(k[1])}</div><input type="text" id="pguess" placeholder="Type what you remember (optional)" value="${esc(P.guess)}" autocomplete="off">`;
    if(!P.flip)h+='<div class="row"><button class="btn primary" data-act="pflip">Show answer</button><span class="hint">or press Space</span></div>';
    else h+=`<div class="lab">Answer</div><div class="a">${esc(k[2])}</div><div class="row"><button class="btn bad" data-act="prate" data-v="miss">Missed it (1)</button><button class="btn warn" data-act="prate" data-v="almost">Almost (2)</button><button class="btn good" data-act="prate" data-v="got">Got it (3)</button></div>`;
    h+="</div>";
  }else if(P.ph==="roundend"){
    const last=P.ch+1>=N;
    h+=`<div class="panel"><h3>Round ${P.ch+1} done</h3><p>${last?"That was the last round of cards. Two short exercises remain: fill the gaps in the summary, then a brain dump.":"Next you will see "+chunks[P.ch+1].length+" new cards."}</p><div class="row"><button class="btn primary" data-act="pnext">${last?"Fill the gaps":"Start round "+(P.ch+2)}</button></div></div>`;
  }else if(P.ph==="gaps"){
    h+='<p class="hint">Say each hidden term aloud before you tap it.</p><div class="row"><button class="btn" data-act="revall">Reveal all</button><button class="btn" data-act="hideall">Hide all</button></div>';
    st.notes.forEach(ni=>{const n=NOTES[ni];h+=`<div class="panel note"><h3>${esc(n[0])}</h3><p>${blankHtml(n[1])}</p></div>`;});
    h+='<div class="row"><button class="btn primary" data-act="pdump">Continue to brain dump</button></div>';
  }else if(P.ph==="dump"){
    const pts=[];st.dump.forEach(d=>DUMPS[d].p.forEach(p=>pts.push(p)));
    h+=`<div class="panel"><h3>Brain dump</h3><p class="hint">Close everything and write what you remember about this step. Then compare.</p><textarea id="ptext" placeholder="Write it in your own words...">${esc(P.text)}</textarea>`;
    if(!P.dchecked)h+='<div class="row"><button class="btn primary" data-act="pcheck">Compare with key points</button></div>';
    else{const got=pts.filter((_,i)=>P.ticks[i]).length;
      h+=`<div class="lab">Tick what you included</div><div class="pts">${pts.map((p,i)=>`<label><input type="checkbox" data-act="ptick" data-i="${i}"${P.ticks[i]?" checked":""}><span>${esc(p)}</span></label>`).join("")}</div><div class="row"><b>${got} of ${pts.length} covered</b><button class="btn primary" data-act="pfinish">Finish this step</button></div>`;}
    h+="</div>";
  }else{
    const ids=stepIds(st),m=ids.filter(i=>(store.box[i]||0)>=2).length;
    h+=`<div class="panel"><h3>Step ${P.step+1} complete</h3><p>${m} of ${ids.length} cards in this step are at Review or Mastered. The rest keep coming back in Recall cards.</p><div class="row">${P.step+1<STEPS.length?`<button class="btn primary" data-act="pnextstep">Next: ${esc(STEPS[P.step+1].t)}</button>`:""}<button class="btn" data-act="pback">All steps</button></div></div>`;
  }
  return '<div style="display:flex;flex-direction:column;gap:16px">'+h+"</div>";
}

/* ============ EVALUATE ============ */
function countOf(k){return BANK.filter(b=>b.t===k).length;}
function viewEval(){
  if(S.ev.view==="setup")return evalSetup();
  if(S.ev.view==="quiz")return evalQuiz();
  return evalResult();
}
function evalSetup(){
  let h='<div class="panel"><h2>Build a test</h2><p class="hint">Choose the question types. Written answers (short, long, scenario) are self-marked against the key points, like checking your own paper.</p><div style="display:flex;flex-direction:column;gap:8px">';

  const pool=BANK.filter(b=>S.ev.types[b.t]).length;
  h+=`</div><div class="row"><label for="en" class="lab">Length</label><select id="en" style="width:auto"><option value="10"${S.ev.n==10?" selected":""}>10 questions</option><option value="20"${S.ev.n==20?" selected":""}>20 questions</option><option value="35"${S.ev.n==35?" selected":""}>35 questions</option><option value="0"${S.ev.n==0?" selected":""}>Everything selected (${pool})</option></select></div><div class="row"><button class="btn primary" data-act="estart"${pool?"":" disabled"}>Start test</button></div></div>`;
  if(store.hist.length){
    h+='<div class="panel"><h3>Recent tests</h3>'+store.hist.slice(0,6).map(x=>`<div class="row" style="justify-content:space-between"><span>${esc(x.d)} · ${x.n} questions</span><b>${x.pct}%</b></div>`).join("")+"</div>";
  }
  return '<div style="display:flex;flex-direction:column;gap:18px">'+h+"</div>";

function startRun(list){
  const qs=list.map(q=>q.t==="mcq"?Object.assign({},q,{o:shuffle(q.opts.map((t,i)=>({t:t,c:i===q.a})))}):q);
  S.run={qs:qs,i:0,res:[],stage:[],ticks:[],text:[]};S.ev.view="quiz";render();window.scrollTo(0,0);
}
function evalQuiz(){
  const r=S.run,q=r.qs[r.i],res=r.res[r.i],T=TM[q.t];
  let h=`<div class="panel"><div class="row" style="justify-content:space-between"><span class="tag">${esc(T.n)}</span><span class="lab">Question ${r.i+1} of ${r.qs.length} · ${T.m} mark${T.m>1?"s":""}</span></div><div class="bar" aria-hidden="true"><i style="width:${Math.round(r.i/r.qs.length*100)}%"></i></div>`;
  h+=`<h3 style="font-size:1.2rem;line-height:1.35">${esc(q.t==="fill"?q.q.replace("___","_______"):q.q)}</h3>`;
  if(q.t==="calc"&&q.src)h+='<pre class="codeview">'+esc(q.src)+'</pre>';
  if(q.t==="mcq"){
    h+='<div class="opts">'+q.o.map((o,i)=>{let c="opt";if(res){if(o.c)c+=" right";else if(res.pick===i)c+=" wrong";}return `<button class="${c}" data-act="mcq" data-i="${i}"${res?" disabled":""}>${esc(o.t)}</button>`;}).join("")+"</div>";
    if(res)h+=`<div class="fb ${res.score?"ok":"no"}"><b>${res.score?"Correct.":"Not quite."}</b> ${esc(q.e)}</div>`;
  }else if(q.t==="tf"){
    h+='<div class="opts">'+[true,false].map(v=>{let c="opt";if(res){if(q.a===v)c+=" right";else if(res.pick===v)c+=" wrong";}return `<button class="${c}" data-act="tf" data-v="${v}"${res?" disabled":""}>${v?"True":"False"}</button>`;}).join("")+"</div>";
    if(res)h+=`<div class="fb ${res.score?"ok":"no"}"><b>${res.score?"Correct.":"Not quite."}</b> ${esc(q.e)}</div>`;
  }else if(q.t==="fill"||q.t==="vsa"||q.t==="calc"){
    h+=`<input type="text" id="ans" autocomplete="off" placeholder="Type your answer" value="${esc(r.text[r.i]||"")}"${res?" disabled":""}>`;
    if(!res)h+='<div class="row"><button class="btn primary" data-act="check">Check</button></div>';
    else{
      h+=`<div class="fb ${res.score?"ok":"no"}"><b>${res.score?"Correct.":"Model answer:"}</b> ${res.score?"":esc(q.model)} ${q.e?esc(q.e):""}</div>`;
      if(!res.score)h+='<div class="row"><button class="btn" data-act="override">I was right, count it</button></div>';
    }
  }else{
    const st=r.stage[r.i]||0;
    h+=`<textarea id="wtext" placeholder="Write your answer as you would in the exam..."${st?" disabled":""}>${esc(r.text[r.i]||"")}</textarea>`;
    if(!st)h+='<div class="row"><button class="btn primary" data-act="reveal">Show model answer</button></div>';
    else{
      const tk=r.ticks[r.i]||{};const got=q.pts.filter((_,i)=>tk[i]).length;
      h+=`<div class="lab">Model answer</div><div class="a" style="border-left:3px solid var(--accent);padding-left:14px">${esc(q.model)}</div><div class="lab">Tick every marking point your answer made</div><div class="pts">`+q.pts.map((p,i)=>`<label><input type="checkbox" data-act="wtick" data-i="${i}"${tk[i]?" checked":""}${res?" disabled":""}><span>${esc(p)}</span></label>`).join("")+"</div>";
      if(!res)h+=`<div class="row"><button class="btn primary" data-act="wsave">Save score (${fmt(got/q.pts.length*T.m)} of ${T.m})</button></div>`;
      else h+=`<div class="fb ${res.score>=T.m?"ok":"no"}">Scored ${fmt(res.score)} of ${T.m}.</div>`;
    }
  }
  if(res){h+=`<div class="row"><button class="btn primary" data-act="next">${r.i+1<r.qs.length?"Next question":"See results"}</button></div>`;}
  return h+"</div>";
}
function fmt(x){return (Math.round(x*2)/2).toString();}
function setRes(score,extra){const r=S.run,q=r.qs[r.i];r.res[r.i]=Object.assign({score:score,max:TM[q.t].m},extra||{});render();}
function evalResult(){
  const r=S.run;let sc=0,mx=0;const by={};
  r.qs.forEach((q,i)=>{const x=r.res[i]||{score:0,max:TM[q.t].m};sc+=x.score;mx+=x.max;const b=by[q.t]||(by[q.t]={s:0,m:0,n:0});b.s+=x.score;b.m+=x.max;b.n++;});
  const pct=Math.round(sc/mx*100);
  const msg=pct>=85?"Exam ready on this material.":pct>=65?"Solid. Revisit the misses below.":pct>=40?"Getting there. Use the Learn section on the weak topics.":"Go back to the recall cards, then try again.";
  let h=`<div class="panel"><div class="lab">Result</div><div class="score">${fmt(sc)} / ${mx} <span style="font-size:1.5rem;color:var(--muted)">${pct}%</span></div><p>${msg}</p><div style="display:flex;flex-direction:column;gap:10px">`;
  TYPES.forEach(t=>{const b=by[t.k];if(!b)return;const p=Math.round(b.s/b.m*100);h+=`<div><div class="row" style="justify-content:space-between"><span>${esc(t.n)} (${b.n})</span><b>${fmt(b.s)}/${b.m}</b></div><div class="bar"><i style="width:${p}%"></i></div></div>`;});
  const missed=r.qs.filter((q,i)=>(r.res[i]||{score:0}).score<TM[q.t].m).length;
  h+=`</div><div class="row">${missed?`<button class="btn primary" data-act="retry">Retry the ${missed} missed</button>`:""}<button class="btn" data-act="newtest">New test</button></div></div>`;
  h+="<h2>Review</h2>";
  r.qs.forEach((q,i)=>{const x=r.res[i]||{score:0,max:TM[q.t].m};const ok=x.score>=x.max;
    let ans=q.t==="mcq"?q.opts[q.a]:q.t==="tf"?(q.a?"True":"False"):q.model;
    h+=`<div class="rev ${ok?"ok":"bad"}"><div class="lab">${esc(TM[q.t].n)} · ${fmt(x.score)}/${x.max}</div><b>${esc(q.q)}</b>${x.resp?`<div class="r">You: ${esc(x.resp)}</div>`:""}<div class="r">${ok?"":"Answer: "}${esc(ans)}</div></div>`;});
  return '<div style="display:flex;flex-direction:column;gap:14px">'+h+"</div>";
}
function finishRun(){
  const r=S.run;let sc=0,mx=0;r.qs.forEach((q,i)=>{const x=r.res[i]||{score:0,max:TM[q.t].m};sc+=x.score;mx+=x.max;});
  if(!r.retry){store.hist.unshift({d:new Date().toLocaleDateString(undefined,{day:"numeric",month:"short"}),pct:Math.round(sc/mx*100),n:r.qs.length});store.hist=store.hist.slice(0,8);save();}
  S.ev.view="result";
}

/* ============ EVENTS ============ */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");if(!el)return;
  const a=el.dataset.act,v=el.dataset.v;
  switch(a){
    case "tab":S.tab=v;render();break;
    case "lv":S.lv=v;render();break;
    case "csec":S.cards.sec=+v;buildQueue();render();break;
    case "flip":S.cards.flip=true;render();break;
    case "cnext":buildQueue();render();break;
    case "creset":CARDS.forEach((k,i)=>{if(S.cards.sec<0||k[0]===S.cards.sec)delete store.box[i];});save();buildQueue();render();break;
    case "rate":{const q=S.cards.queue,id=q.shift();let b=store.box[id]||0;
      if(v==="miss"){b=1;q.splice(Math.min(3,q.length),0,id);}
      else if(v==="almost"){b=Math.max(b,1);q.push(id);}
      else{b=b<2?2:3;S.cards.done++;}
      store.box[id]=b;save();S.cards.flip=false;S.cards.guess="";render();break;}
    case "cord":S.cards.ordered=v==="1";buildQueue();render();break;
    case "pstep":openStep(+v);break;
    case "pback":S.path.step=null;render();window.scrollTo(0,0);break;
    case "pnotes":S.path.ph="primer";render();window.scrollTo(0,0);break;
    case "pstart":S.path.ph="learn";S.path.i=0;render();break;
    case "plback":if(S.path.i>0)S.path.i--;render();break;
    case "plnext":{const P=S.path,ids=stepChunks(STEPS[P.step])[P.ch];
      if(P.i+1<ids.length)P.i++;else{P.ph="recall";P.q=shuffle(ids.slice());P.flip=false;P.guess="";}
      render();break;}
    case "pflip":S.path.flip=true;render();break;
    case "prate":{const P=S.path;applyRate(P.q,v);P.flip=false;P.guess="";
      if(!P.q.length){store.path.ch[P.step]=P.ch+1;save();P.ph="roundend";}
      render();break;}
    case "pnext":{const P=S.path,N=stepChunks(STEPS[P.step]).length;
      if(P.ch+1<N){P.ch++;P.ph="learn";P.i=0;}else P.ph="gaps";
      render();window.scrollTo(0,0);break;}
    case "pdump":S.path.ph="dump";render();window.scrollTo(0,0);break;
    case "pcheck":{const t=$("#ptext");if(t)S.path.text=t.value;S.path.dchecked=true;render();break;}
    case "pfinish":store.path.done[S.path.step]=true;save();S.path.ph="done";render();window.scrollTo(0,0);break;
    case "pnextstep":openStep(S.path.step+1);break;
    case "blank":el.classList.toggle("on");break;
    case "revall":document.querySelectorAll(".blank").forEach(b=>b.classList.add("on"));break;
    case "hideall":document.querySelectorAll(".blank").forEach(b=>b.classList.remove("on"));break;
    case "mask":if(el.classList.contains("hid")){el.classList.remove("hid");el.removeAttribute("role");}break;
    case "tmode":S.tmode[el.dataset.t]=v;render();break;
    case "dtopic":S.dump={i:+v,text:"",checked:false,ticks:{}};render();break;
    case "dcheck":S.dump.checked=true;render();break;
    case "dreset":S.dump.checked=false;S.dump.ticks={};S.dump.text="";render();break;
    case "estart":{const pool=shuffle(BANK.filter(b=>S.ev.types[b.t]));const list=S.ev.n?pool.slice(0,S.ev.n):pool;
      list.sort((x,y)=>TYPES.findIndex(t=>t.k===x.t)-TYPES.findIndex(t=>t.k===y.t));startRun(list);break;}
    case "mcq":{const r=S.run,q=r.qs[r.i],i=+el.dataset.i;setRes(q.o[i].c?1:0,{pick:i,resp:q.o[i].t});break;}
    case "tf":{const r=S.run,q=r.qs[r.i],p=v==="true";setRes(p===q.a?1:0,{pick:p,resp:p?"True":"False"});break;}
    case "check":doCheck();break;
    case "override":{const r=S.run;r.res[r.i].score=TM[r.qs[r.i].t].m;render();break;}
    case "reveal":{const r=S.run;r.text[r.i]=$("#wtext").value;r.stage[r.i]=1;render();break;}
    case "wsave":{const r=S.run,q=r.qs[r.i],tk=r.ticks[r.i]||{};const got=q.pts.filter((_,i)=>tk[i]).length;setRes(Math.round(got/q.pts.length*TM[q.t].m*2)/2,{resp:r.text[r.i]||""});break;}
    case "next":{const r=S.run;if(r.i+1<r.qs.length){r.i++;render();window.scrollTo(0,0);}else{finishRun();render();window.scrollTo(0,0);}break;}
    case "retry":{const r=S.run;const list=r.qs.filter((q,i)=>(r.res[i]||{score:0}).score<TM[q.t].m);startRun(list);S.run.retry=true;break;}
    case "newtest":S.ev.view="setup";S.run=null;render();break;
    default:labClick(a,el,v);
  }
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.dataset.lsel){labSelect(el);return;}
  if(el.dataset.act==="etype"){S.ev.types[el.dataset.v]=el.checked?1:0;render();}
  else if(el.id==="en"){S.ev.n=+el.value;}
  else if(el.dataset.act==="ptick"){S.path.ticks[el.dataset.i]=el.checked;render();}
  else if(el.dataset.act==="dtick"){S.dump.ticks[el.dataset.i]=el.checked;render();}
  else if(el.dataset.act==="wtick"){const r=S.run;r.ticks[r.i]=r.ticks[r.i]||{};r.ticks[r.i][el.dataset.i]=el.checked;render();}
});
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.dataset&&(el.dataset.lin||el.dataset.tcell!==undefined)){labInput(el);return;}
  if(el.id==="guess")S.cards.guess=el.value;
  else if(el.id==="pguess")S.path.guess=el.value;
  else if(el.id==="ptext")S.path.text=el.value;
  else if(el.id==="dtext")S.dump.text=el.value;
  else if(el.id==="ans"&&S.run)S.run.text[S.run.i]=el.value;
});
function doCheck(){
  const r=S.run,q=r.qs[r.i],v=($("#ans").value||"").trim();if(!v)return;
  r.text[r.i]=v;setRes((q.t==="calc"?matchCalc(v,q):matches(v,q.acc,q.all))?TM[q.t].m:0,{resp:v});
}
document.addEventListener("keydown",e=>{
  const t=e.target,tag=t.tagName;
  if(e.key==="Enter"&&t.id==="ans"){e.preventDefault();doCheck();return;}
  if(e.key==="Enter"&&t.id==="pguess2"){e.preventDefault();const b=document.querySelector('[data-act="pcheck2"]');if(b&&!b.disabled)b.click();return;}
  if((e.key==="Enter"||e.key===" ")&&t.classList&&t.classList.contains("hid")){e.preventDefault();t.click();return;}
  const inPath=S.tab==="learn"&&S.lv==="path"&&S.path.ph==="recall"&&S.path.q.length>0;
  const inCards=S.tab==="learn"&&S.lv==="cards"&&S.cards.queue.length>0;
  if(!(inPath||inCards)||tag==="INPUT"||tag==="TEXTAREA"||tag==="SELECT")return;
  const flipped=inPath?S.path.flip:S.cards.flip;
  if((e.key===" "||e.key==="Enter")&&tag!=="BUTTON"&&!flipped){e.preventDefault();if(inPath)S.path.flip=true;else S.cards.flip=true;render();}
  else if(flipped&&"123".includes(e.key)&&e.key){const m={"1":"miss","2":"almost","3":"got"};const b=document.querySelector('[data-act$="rate"][data-v="'+m[e.key]+'"]');if(b)b.click();}
});
render();
</script>

</body></html>
