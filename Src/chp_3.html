<style>
/* Layout: one centred column. Header carries the licence-spectrum strip, two big mode tabs sit under it, content swaps below. */
:root{
  --bg:#f2f5f1; --surface:#fbfcfa; --fg:#16221c; --muted:#5a6b62; --line:#d5ddd6;
  --accent:#0a6a4d; --accent-fg:#ffffff; --accent-soft:#dcefe6;

}
@media (prefers-color-scheme: dark){

    --bg:#0e1512; --surface:#151e19; --fg:#e3ece6; --muted:#92a69b; --line:#26342c;
    --accent:#5fd7a8; --accent-fg:#06241a; --accent-soft:#17382b;
    --warn:#f0a15a; --warn-soft:#3a2a17; --bad:#ff8a80; --bad-soft:#3b1b19;
    --mask:#2c3a32; --s1:#1c3a2e; --s2:#2a6a50; --s3:#43a57f; --s4:#5fd7a8; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1512; --surface:#151e19; --fg:#e3ece6; --muted:#92a69b; --line:#26342c;
  --accent:#5fd7a8; --accent-fg:#06241a; --accent-soft:#17382b;
  --warn:#f0a15a; --warn-soft:#3a2a17; --bad:#ff8a80; --bad-soft:#3b1b19;
  --mask:#2c3a32; --s1:#1c3a2e; --s2:#2a6a50; --s3:#43a57f; --s4:#5fd7a8; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.55;
  padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:54rem;margin:0 auto;display:flex;flex-direction:column;gap:20px;min-width:0}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:clamp(2rem,6vw,3.1rem);font-weight:700;letter-spacing:-.01em}
h2{font-size:1.45rem;font-weight:700}
h3{font-size:1.05rem;font-weight:700}
p{margin:0}
.kicker,.lab{font-family:var(--mono);font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.top{display:flex;flex-direction:column;gap:12px}
.spectrum{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;max-width:30rem}
.spectrum i{display:block;height:10px;border-radius:2px}
.spectrum i:nth-child(1){background:var(--s1)}.spectrum i:nth-child(2){background:var(--s2)}
.spectrum i:nth-child(3){background:var(--s3)}.spectrum i:nth-child(4){background:var(--s4)}
.spectrum-l{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;max-width:30rem;font-family:var(--mono);font-size:.68rem;color:var(--muted)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.mode{font:600 1.1rem var(--display);padding:14px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px}
.mode small{font:400 .78rem var(--body);color:var(--muted)}
.mode[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.mode[aria-selected="true"] small{color:var(--accent-fg);opacity:.85}
button{font-family:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,.m:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.subnav{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:500 .85rem var(--body);padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.chip[aria-pressed="true"],.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--fg);box-shadow:inset 0 0 0 1px var(--accent)}
.btn{font:600 .92rem var(--body);padding:10px 16px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.good{border-color:var(--accent);color:var(--accent)}
.btn.warn{border-color:var(--warn);color:var(--warn)}
.btn.bad{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.hint{color:var(--muted);font-size:.9rem}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.stat b{display:block;font:700 1.35rem var(--display);font-variant-numeric:tabular-nums}
.stat span{font:.7rem var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.fc .q{font:600 1.35rem/1.3 var(--display)}
.fc .a{border-left:3px solid var(--accent);padding:4px 0 4px 14px;font-size:1.05rem}
input[type=text],textarea,select{width:100%;font:inherit;padding:10px 12px;border-radius:8px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg)}
textarea{min-height:9rem;resize:vertical}
.blank{font:inherit;display:inline-block;vertical-align:baseline;border:0;border-bottom:2px solid var(--accent);background:var(--mask);color:var(--fg);padding:0 .3em;border-radius:3px 3px 0 0;cursor:pointer;line-height:1.35}
.blank:not(.on) .ans{visibility:hidden}
.blank.on{background:var(--accent-soft)}
.note p{font-size:1.04rem;line-height:2}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:500 .72rem var(--mono);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);background:var(--bg);white-space:nowrap}
tr:last-child td{border-bottom:0}
td{min-width:9rem}
.m.hid{background:var(--mask);color:transparent;border-radius:4px;cursor:pointer;display:inline-block;user-select:none}
.m{display:inline}
.opt{display:block;width:100%;text-align:left;font:inherit;padding:12px 14px;border-radius:8px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer}
.opt.right{border-color:var(--accent);background:var(--accent-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opts{display:flex;flex-direction:column;gap:8px}
.fb{padding:12px 14px;border-radius:8px;font-size:.95rem}
.fb.ok{background:var(--accent-soft)}.fb.no{background:var(--bad-soft)}
.tag{font:500 .7rem var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:4px;background:var(--accent-soft);color:var(--fg)}
.pts{display:flex;flex-direction:column;gap:6px}
.pts label{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.pts input{margin-top:.3rem;accent-color:var(--accent)}
.score{font:700 3rem var(--display);font-variant-numeric:tabular-nums}
.tcount{display:flex;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:8px}
.tcount label{flex:1;display:flex;gap:10px;align-items:center;cursor:pointer;min-width:0}
.tcount input{accent-color:var(--accent);width:1.1rem;height:1.1rem}
.tcount span.n{font:.78rem var(--mono);color:var(--muted);white-space:nowrap}
.rev{border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:6px}
.rev.bad{border-left:4px solid var(--bad)}.rev.ok{border-left:4px solid var(--accent)}
.rev .r{font-size:.9rem;color:var(--muted)}
.nb{display:flex;flex-direction:column;gap:8px}
.nb ul{margin:0;padding-left:1.25rem;display:flex;flex-direction:column;gap:6px}
.nb p.def{border-left:3px solid var(--accent);background:var(--accent-soft);padding:8px 12px;border-radius:0 6px 6px 0}
.nb + .nb{border-top:1px solid var(--line);padding-top:16px}
@media (max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}.panel{padding:16px}.fc .q{font-size:1.2rem}}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .3s}}
/* ---- Code lab ---- */
:root{--code-bg:#fbfaf6;--code-fg:#1b2a22;--code-line:#d5ddd6;--ok-b:#0a6a4d;--ok-s:#dcefe6;--note-b:#9a4a08;--note-s:#f6e6d4}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--code-bg:#0a100d;--code-fg:#d8efe3;--code-line:#26342c;--ok-b:#5fd7a8;--ok-s:#17382b;--note-b:#f0a15a;--note-s:#3a2a17}}
:root[data-theme="dark"]{--code-bg:#0a100d;--code-fg:#d8efe3;--code-line:#26342c;--ok-b:#5fd7a8;--ok-s:#17382b;--note-b:#f0a15a;--note-s:#3a2a17}
.labwrap{display:flex;flex-direction:column;gap:16px;min-width:0}
code,.mono{font-family:var(--mono);font-size:.9em}
code.big{font-size:1.15rem;background:var(--accent-soft);padding:2px 8px;border-radius:5px}
.cw{display:flex;flex-direction:column;gap:8px;min-width:0}
.cw-bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.btn.sm{padding:6px 12px;font-size:.85rem}
.codearea,.codeview,.outpre{font:400 .88rem/1.55 var(--mono);background:var(--code-bg);color:var(--code-fg);border:1.5px solid var(--code-line);border-radius:8px;padding:12px 14px;margin:0;white-space:pre;overflow-x:auto;tab-size:4}
.codearea{width:100%;resize:vertical;min-height:5rem}
.outpre{white-space:pre-wrap;border-left:4px solid var(--accent)}
.outbox{display:flex;flex-direction:column;gap:8px;min-width:0}
.dim{color:var(--muted)}
.cw-in{display:flex;flex-direction:column;gap:4px}
.cin,input.mono{font-family:var(--mono)}
.rs{padding:10px 14px;border-radius:8px;font-size:.93rem;border-left:4px solid var(--line);background:var(--bg)}
.rs.ok{border-color:var(--ok-b);background:var(--ok-s)}
.rs.bad{border-color:var(--bad);background:var(--bad-soft)}
.rs.note,.rs.warn{border-color:var(--note-b);background:var(--note-s)}
.try{border:1px dashed var(--accent);border-radius:8px;padding:8px 12px;font-size:.93rem}
.note-box{background:var(--accent-soft);border-radius:8px;padding:10px 14px;font-size:.93rem}
ol.pipe{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0}
ol.pipe li{position:relative;padding:8px 12px 8px 34px;border-left:2px solid var(--line);margin-left:10px;font-size:.93rem}
ol.pipe li::before{content:"";position:absolute;left:-8px;top:12px;width:14px;height:14px;border-radius:50%;background:var(--bg);border:2px solid var(--line)}
ol.pipe li.done::before{background:var(--accent);border-color:var(--accent)}
ol.pipe li.cur{background:var(--accent-soft)}ol.pipe li.cur::before{border-color:var(--accent);background:var(--surface)}
ol.pipe li.fail{background:var(--bad-soft)}ol.pipe li.fail::before{background:var(--bad);border-color:var(--bad)}
ol.pipe li.warn{background:var(--note-s)}ol.pipe li.warn::before{background:var(--note-b);border-color:var(--note-b)}
ol.pipe li.pending{color:var(--muted)}
.bits{display:flex;flex-direction:column;gap:6px}
.brow{display:grid;grid-template-columns:5.5rem 1fr auto;gap:10px;align-items:center}
.brow.res{border-top:1px solid var(--line);padding-top:6px;font-weight:600}
.bl{font:.78rem var(--mono);color:var(--muted)}
.bv{display:flex;gap:2px;flex-wrap:wrap}
.bit{width:1.55rem;height:1.7rem;display:inline-flex;align-items:center;justify-content:center;font:500 .85rem var(--mono);border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--muted)}
.bit.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.bd{font:.85rem var(--mono)}
.b-s{color:var(--bad)}.b-e{color:var(--note-b)}.b-m{color:var(--accent)}
td.mono{word-break:break-all;min-width:0}
ol.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
ol.steps li{display:flex;flex-direction:column;gap:2px;padding:8px 12px;border:1px solid var(--line);border-radius:8px}
.exp{font-family:var(--mono);font-size:.92rem}.exp.res{color:var(--accent);font-weight:600}
.exp mark{background:var(--accent-soft);color:var(--fg);border-radius:3px;padding:0 3px;outline:1.5px solid var(--accent)}
ul.rules{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
ul.rules li{padding:6px 10px;border-radius:6px;font-size:.92rem}
ul.rules li.ok{background:var(--ok-s)}ul.rules li.no{background:var(--bad-soft)}
input.tcell{width:100%;min-width:4rem;font:.9rem var(--mono);padding:6px 8px}
input.tcell.good{border-color:var(--accent);background:var(--accent-soft)}
input.tcell.miss{border-color:var(--bad);background:var(--bad-soft)}
.nb .cw{margin-top:4px}
.nb ol.pipe{margin-top:4px}
@media (max-width:520px){.brow{grid-template-columns:1fr}.bit{width:1.3rem}}

const TABLES=[

["Nature","Physical, tangible","Logical, intangible"],
["Manufacture","Fabricated physically (chips, circuit boards)","Written through programming"],
["Damage","Wears out; damaged by impact, heat, moisture, surges","Does not physically wear; can become buggy, outdated or insecure"],

["Application software","Higher level, built on system software; serves the user directly to accomplish productive tasks","Word processor, spreadsheet, web browser"],

["Memory management","Allocating RAM to programs, tracking which locations are in use, reclaiming memory when a program ends, extending capacity with virtual memory"],
["File system management","Organising storage into a hierarchy of directories and files, and enforcing permissions so only authorised users or programs access given data"],

/*3*/{s:1,t:"Kernel and shell compared",c:["Basis","Kernel","Shell"],r:[

const NOTES=[
["1.1 Software fundamentals and types","{{Software}} is the collection of programs, instructions, data and documentation that directs a computer; it is {{intangible}}, whereas hardware is physical. Neither is useful alone: hardware without software cannot perform any task. Software is copied at near-{{zero}} marginal cost, which explains software {{piracy}}. Software is classified as {{system}} software (manages hardware and provides the platform), {{application}} software (serves the user directly) and {{utility}} software (maintains, optimises and protects the system). Utility software is a separate, {{third}} category and must always be named."],
["1.2 System software and the operating system","The {{operating system}} is the first software loaded at start-up and manages {{processes}}, {{memory}}, files, devices and the user interface. The {{kernel}} is its privileged core; the {{shell}} is the outer layer (command-line or graphical) through which commands reach the kernel. The boot sequence is: {{firmware}} (BIOS or UEFI) in ROM, then {{POST}}, then the {{bootloader}}, which loads the {{kernel}} into RAM, which finally launches the {{shell}}. The same kernel can wear different shells: Ubuntu and Fedora share the {{Linux}} kernel."],
["1.3 Types of operating system and drivers","A {{batch}} system runs grouped jobs without interaction; a {{time-sharing}} system switches the CPU among many users; a {{multiprogramming}} system keeps several programs in memory; a {{real-time}} system guarantees a response within a strict time limit. In a {{hard}} real-time system a missed deadline causes failure (an airbag); in a {{soft}} one it causes degraded quality (video). A {{distributed}} OS presents networked computers as one system, an {{embedded}} OS is built into a single-purpose device, and {{Android}} and iOS are mobile systems. A {{device driver}} translates between the OS and one specific hardware device."],
["1.4 Application software","{{General-purpose}} software (word processors, spreadsheets, browsers) serves a broad audience; {{customised}} (bespoke) software is built for the requirements of one organisation. The three-way trade-off is {{cost}}, fit and {{time}}: customised software is expensive, slow to build and a perfect fit. {{SaaS}} (Software as a Service) runs on a remote server and is reached through a browser; it is a {{delivery model}}, not a new category. Examples of customised systems are a hospital patient management system and a railway {{reservation}} system."],
["1.5 Utility software","{{Antivirus}} software uses {{signature-based}} detection (known patterns, blind to new threats) and {{heuristic}} detection (behaviour, catches zero-day threats but gives false positives), plus real-time protection. A {{full}} backup copies everything; an {{incremental}} backup copies changes since the last backup of any kind; a {{differential}} backup copies changes since the last full backup. {{Lossless}} compression reconstructs the original exactly; {{lossy}} discards data. {{Defragmentation}} suits only hard disk drives; an {{SSD}} uses {{TRIM}} instead. A quick format clears only the file system {{index}}."],
["1.6 Language translators","An {{assembler}} converts assembly language to machine code. A {{compiler}} translates the {{entire}} program at once; its phases are {{lexical}} analysis (tokens), {{syntax}} analysis (parse tree), {{semantic}} analysis, code generation and {{optimisation}}. The {{linker}} combines object files and libraries into an executable; the {{loader}} copies it into RAM each time it runs. An {{interpreter}} translates and executes one statement at a time, with no output file. Java compiles to {{bytecode}} that runs on the {{JVM}}, which uses {{JIT}} compilation for frequently run code."],
["1.7 Programming languages","The five generations are {{machine}} language (1GL), {{assembly}} language (2GL), {{high-level}} languages (3GL), {{4GL}} (declarative, e.g. {{SQL}}) and {{5GL}} (goal or constraint-based, e.g. {{Prolog}}). Only 1GL and 2GL are not {{portable}}. A 3GL states {{how}}; a 4GL states {{what}}; a 5GL states the {{goal}}. A {{paradigm}} describes how a program is structured and cuts across generations: {{procedural}}, object-oriented, {{functional}} and declarative. Python is a 3GL that supports several paradigms."],
["1.8 Software licensing","A software {{licence}} is legal permission to use software, not ownership. {{Open source}} software makes its source code public; {{copyleft}} licences (GNU {{GPL}}) require derivatives to stay open, while {{permissive}} licences (MIT, Apache) allow use in proprietary software. {{Proprietary}} software keeps source code secret under an {{EULA}}; violating it is software {{piracy}}. {{Freeware}} is free of charge but closed-source; {{shareware}} is a trial (time-limited, feature-limited or nag-ware); {{firmware}} is permanent software in a device's non-volatile memory. The {{GNU}} project began in 1983 under Richard {{Stallman}}, and Linus Torvalds built the Linux kernel in {{1991}}."]
];

[0,"Define software.","The collection of programs, instructions, data and documentation that directs a computer to perform specific tasks; a set of instructions, together with the data they operate on and the documentation describing their use, that directs hardware to perform a task."],
[0,"Why is software called intangible?","Unlike hardware it has no mass and occupies no shelf space; it exists as a sequence of binary instructions stored on a medium and loaded into memory for execution."],
[0,"What does a brand-new computer with no operating system do when switched on?","Nothing useful beyond running the small firmware program in its ROM, which exists purely to locate and load further software."],
[0,"State the relationship between hardware and software.","Complete interdependence: hardware without software cannot perform any task, and software without hardware has no medium on which to run. Hardware is the body and software the mind; identical hardware becomes a different machine under different software."],
[0,"Why does software piracy persist?","Software can be copied at essentially zero marginal cost: the first copy may cost millions, the ten-millionth almost nothing; subscription and licensing models exist to recapture value that free copying would erase."],
[0,"How can open source software be economically viable despite free copying?","Through an ecosystem built around services, support and customisation rather than the copies themselves."],
[0,"Name the three broad types of software.","System software, application software and utility software."],
[0,"Define system software.","Software that manages and controls the computer's hardware and provides the platform on which application software runs; it works closely with the hardware, typically in the background, invisible to the ordinary user; its components are the operating system, device drivers, language processors and utility programs."],
[0,"Define application software.","Software designed to help users perform specific, productive tasks (writing documents, spreadsheets, browsing, editing photographs, communicating), running on top of system software."],
[0,"Define utility software.","Software that performs maintenance, optimisation and protection tasks that keep a computer system healthy, efficient and secure; it runs on the operating system like an application but serves the system itself."],
[0,"What is the cleanest discriminator between system and application software?","System software serves the computer by managing its resources so that other programs can run, usually invisibly; application software serves the user directly, producing something the user wants, and is consciously opened and used."],
[0,"What is the common pitfall about the three types?","Treating utility software as a subtype of application software, or forgetting it and naming only two types; examination boards expect all three, each with at least one example."],
[1,"Define an operating system.","System software that manages a computer's hardware resources (processor, memory, storage, input/output devices), allocating them among running programs and providing a stable, consistent platform through which applications access the hardware without managing it directly."],
[1,"What is the first software loaded when a computer starts?","The operating system (after the firmware and bootloader); it remains active for as long as the machine is on, acting as the intermediary between the user, application software and hardware."],
[1,"Give examples of operating systems by device type.","Desktops: Microsoft Windows, Apple macOS; servers and desktops: Linux; mobile: Google Android, Apple iOS."],
[1,"Name the five core functions of an operating system.","Process management, memory management, file system management, device management, user interface management."],
[1,"What is virtual memory?","A technique of the memory manager that extends RAM capacity using storage."],
[1,"Define the kernel.","The core of the operating system: the part that runs with the highest hardware privilege, directly manages the processor, memory and devices, and is loaded into memory first and kept resident for as long as the system runs."],
[1,"Define the shell.","The outer layer of the operating system through which the user or a program issues commands to the kernel: a command-line shell such as Bash or PowerShell, or the graphical shell that draws the desktop, icons and windows."],
[1,"Why can Linux look different from one distribution to another?","The same kernel can wear different shells: Ubuntu and Fedora share essentially the same kernel but present very different graphical environments, yet behave identically underneath."],
[1,"Give the five steps of the boot process in order.","1. Firmware (BIOS or UEFI) in ROM runs; 2. POST; 3. firmware finds a bootable device and loads the bootloader; 4. bootloader loads the kernel into RAM and passes control; 5. kernel initialises drivers, mounts the file system, starts services and launches the shell."],
[1,"What does POST stand for and do?","Power-On Self-Test: the firmware checks that the processor, memory and essential devices are present and functioning."],
[1,"What is a bootloader?","A small program, located by the firmware on a bootable device, that loads the operating system kernel into memory."],
[1,"What are BIOS and UEFI?","Firmware stored in ROM on the motherboard that runs first at power-on, before any operating system exists in memory; it initialises hardware and loads the operating system."],
[1,"Differentiate CLI and GUI.","CLI: command-line interface in which the user types commands; GUI: graphical user interface with desktop, icons and windows."],
[2,"What is a batch operating system?","One in which jobs are collected and run in groups with no interaction once submitted; suited to payroll and billing runs; the term survives in scheduled overnight processing."],
[2,"What is a time-sharing (multi-user) operating system?","One that rapidly switches the CPU among many users' processes, giving each the illusion of exclusive access; the basis of Unix and multi-user servers."],
[2,"What is a multiprogramming (multitasking) operating system?","One that keeps several programs in memory and switches the CPU between them so that a wait for I/O by one program does not idle the processor; the model of every ordinary desktop OS."],
[2,"What is a real-time operating system?","One that guarantees a response within a strict, predictable time limit."],
[2,"Distinguish hard and soft real-time systems.","In a hard real-time system a missed deadline causes system failure (airbag controller, aircraft flight computer); in a soft real-time system an occasional miss only degrades quality (streaming video frame dropped). The discriminator is consequence, not just speed."],
[2,"What is a distributed operating system?","One that presents a collection of independent, networked computers to users as a single coherent system, sharing resources and load across machines; the model behind large cloud platforms."],
[2,"What is an embedded operating system?","A minimal OS built into a single-purpose device such as a washing machine, router or smart TV, rather than a general-purpose computer."],
[2,"What is a mobile operating system?","One optimised for touch input, battery efficiency and intermittent connectivity; Android and iOS are the dominant examples."],
[2,"Define a device driver.","Specialised system software acting as a translator between the operating system and one specific hardware device, converting generic OS requests into the instructions that device understands."],
[2,"Why is a device driver necessary?","Without the correct driver the OS cannot communicate with the device at all; every peripheral (monitor, keyboard, printer, graphics card, network adapter) needs one, installed from the manufacturer or by automatic update."],
[2,"Trace a print request through the system.","The application requests a print job; the operating system passes it to the printer's driver; the driver converts it into the exact command sequence that printer model understands."],
[2,"Why are drivers a common source of instability?","They historically ran with the same high privilege as the kernel, so a faulty or malicious driver can crash or compromise the entire system; modern systems isolate drivers into more restricted modes."],
[3,"Define general-purpose application software.","Software that performs a wide variety of tasks useful to a broad range of users across many fields rather than being tailored to one industry."],
[3,"Name the eight categories of general-purpose software with an example of each.","Word processors (MS Word), spreadsheets (Excel), presentation (PowerPoint), database (Access), web browsers (Chrome), email clients (Outlook), media players (VLC), graphics editors (Photoshop, GIMP)."],
[3,"What is SaaS?","Software as a Service: general-purpose software that runs primarily on a remote server, is accessed through a web browser and stores data in the cloud (Google Docs, Microsoft 365 Online, Canva)."],
[3,"State the benefits and costs of SaaS.","Benefits: no installation, instant uniform updates, real-time collaboration. Costs: needs an internet connection and places data in a third party's custody."],
[3,"Is SaaS a third category beside general-purpose and customised software?","No: it is a delivery model that can apply to either."],
[3,"Define customised (bespoke) application software.","Software developed specifically for the unique requirements of one organisation, business or individual, built to match its exact workflows, processes and data requirements."],
[3,"Give three examples of customised software.","A hospital patient management system, a railway reservation system and a bank's core banking system."],
[3,"State the advantages of customised software.","Perfect fit with organisational needs; better integration with existing systems; competitive advantage from unique capability; greater long-term efficiency."],
[3,"State the disadvantages of customised software.","Significantly higher development cost; longer development time; ongoing maintenance needs a dedicated team; risk of dependence on a single vendor or team."],
[3,"How should general-purpose and customised software be compared in an answer?","Around cost, fit and time: general-purpose is cheap, quick to obtain and moderately fitting; customised is expensive, slow to build and perfectly fitting."],
[4,"What is antivirus software?","Software that detects, prevents and removes malware (viruses, worms, Trojans, ransomware, spyware, adware) through several complementary mechanisms."],
[4,"Explain signature-based detection.","Scans files for matches against a database of known malware signatures (distinctive code patterns), quarantining or removing matches; fast and reliable against known threats but blind to anything new."],
[4,"Explain heuristic detection.","Analyses a program's behaviour and structure for patterns resembling malware, catching previously unknown (zero-day) threats at the cost of occasional false positives."],
[4,"What is real-time protection?","Continuous monitoring that scans files as they are opened, downloaded or created, blocking threats before execution rather than afterwards."],
[4,"Name examples of antivirus software.","Norton, McAfee, Kaspersky, Avast, Windows Defender, Bitdefender."],
[4,"What is backup software and why is it needed?","Software that automates copying important data to a separate location (external drive, network storage, cloud) so that data can be recovered after hardware failure, ransomware, accidental deletion, fire or flood, or software corruption."],
[4,"State the 3-2-1 backup rule.","Three copies of the data, on two different media, with one copy off-site."],
[4,"Distinguish incremental and differential backup.","Incremental copies only data changed since the last backup of any kind; differential copies all data changed since the last full backup, always. The hinge is one word: previous backup versus last full backup."],
[4,"What is needed to restore from an incremental chain and from a differential?","Incremental: the full backup plus every increment in order. Differential: only two files, the full backup and the most recent differential."],
[4,"What is file compression?","Reducing file size by identifying and eliminating redundancy so that the file occupies less storage and transmits faster; utilities bundle files into one, often password-protectable, archive (WinRAR, WinZip, 7-Zip)."],
[4,"Distinguish lossless and lossy compression.","Lossless allows perfect reconstruction (essential for documents, programs, data; ZIP, RAR, 7z); lossy permanently discards some data for a much higher ratio (acceptable for images, audio and video)."],
[4,"What does disk cleanup do?","Scans storage for files no longer needed (temporary files, cached browser data, logs, old updates, Recycle Bin, installer leftovers), calculates the space each category occupies and lets the user reclaim it."],
[4,"What is fragmentation?","On an HDD, files are written into whatever free space is available; as files are created, edited, deleted and grown, free space scatters and files are split into non-contiguous fragments, so the read/write head must travel to several places."],
[4,"What does defragmentation do?","Reorganises data so each file's fragments sit together in contiguous sectors and free space consolidates, shortening head travel and speeding access."],
[4,"Why must an SSD never be defragmented?","An SSD has no moving parts and reaches every location in the same time, so defragmentation gives no benefit and only uses up the drive's finite write cycles; the OS substitutes TRIM instead."],
[4,"What is TRIM?","An SSD maintenance command that helps the drive manage its own storage internally, replacing defragmentation on flash storage."],
[4,"What is disk formatting?","Preparing a storage device for use by writing an empty file system structure (NTFS, exFAT, ext4) that the OS uses to track where each file's data lives."],
[4,"Distinguish quick format and full format.","Quick format merely clears the index, leaving data recoverable until overwritten; full format also checks the surface for bad sectors and, on some tools, overwrites the data."],
[4,"What is disk partitioning?","Dividing one physical drive into multiple logical sections, each addressed as a separate drive; useful for isolating the OS from user data or running more than one OS."],
[4,"What is a system monitor?","A utility (Task Manager, Activity Monitor, top/htop) displaying running processes and their CPU, memory, disk and network use in real time, letting the user terminate an unresponsive or greedy process."],
[4,"What is a system restore utility?","One that saves snapshots of system settings and critical files so that the OS can roll back after a bad update or misconfiguration; a targeted alternative to a full backup restore."],
[4,"Which five utilities form the reliable core answer?","Antivirus, backup, compression, disk cleanup and defragmentation; disk formatting or system restore make a strong sixth."],
[5,"What is a language translator?","Software that converts a program from one language (the source) into another (the target, typically machine code)."],
[5,"Why are translators necessary?","Computers can directly execute only machine language (binary), and writing in binary is extraordinarily difficult and error-prone for humans."],
[5,"Name the three types of translator.","Assembler, compiler and interpreter."],
[5,"What does an assembler do?","Converts assembly language, using mnemonics such as MOV, ADD, SUB and JMP, into machine code, replacing each mnemonic with its binary equivalent and resolving symbolic names; the output is an object file."],
[5,"Why can an assembler for one processor not assemble code for another?","Assembly language is architecture-specific."],
[5,"What is assembly programming useful for?","Precise, direct hardware control: operating system kernels, device drivers and performance-critical routines, though it is far more tedious than high-level programming."],
[5,"What does a compiler do?","Converts an entire high-level program (C, C++, Java, Fortran) into machine code or an intermediate form in one complete translation pass, producing output that can run independently of the compiler."],
[5,"Name the five phases of compilation.","Lexical analysis, syntax analysis, semantic analysis, code generation, code optimisation."],
[5,"What are tokens?","The fundamental units produced by lexical analysis: keywords, identifiers, operators and literals."],
[5,"What is a semantic error? Give an example.","A meaning-level error that is grammatically valid but logically wrong: using an undeclared variable, passing an argument of the wrong type, assigning an incompatible value."],
[5,"State the advantage and disadvantage of a compiler.","Advantage: the executable runs very fast, with no translation at runtime. Disadvantage: the entire program must be correct before any of it runs; one error anywhere prevents compilation."],
[5,"What is an object file?","The compiler's usual direct output: machine code for one source file, with calls to functions defined elsewhere left as unresolved placeholders."],
[5,"What is a linker?","A program that combines one or more object files with the library code they call, resolving every placeholder into an actual memory address, to produce a single executable file."],
[5,"Why are large programs compiled in separate files and linked at the end?","Only the changed file needs recompiling, then relinking, rather than recompiling everything."],
[5,"What is a loader?","An operating system component that, when a program runs, copies the executable from storage into RAM, allocates the memory it needs and hands control to its starting instruction."],
[5,"Distinguish the linker and the loader.","The linker works after compilation, once, producing the executable; the loader works every time the program is run, placing it in memory. Compilation happens once; loading happens every time."],
[5,"What does an interpreter do?","Translates and executes a high-level program one statement at a time, producing no separate output file; each statement is run before the next is examined."],
[5,"State the advantage and disadvantage of an interpreter.","Advantage: interactive, incremental development and easy debugging, since an error stops execution and is reported at that exact line. Disadvantage: slow, because translation overhead is paid every time a statement executes, including every pass through a loop."],
[5,"Name interpreted languages.","Python, Ruby and, in many contexts, JavaScript."],
[5,"What is bytecode?","A compact, platform-independent intermediate form produced by compiling Java source; it is not native machine code and runs on the Java Virtual Machine."],
[5,"What is JIT compilation?","Just-In-Time compilation: the JVM interprets bytecode initially, identifies hot code that runs repeatedly, compiles it to native machine code on the fly and caches the result, giving near-compiled speed with portability (also V8 and PyPy)."],
[5,"Anchor the answer on compiler versus interpreter.","On when translation happens: a compiler translates everything before execution and produces a standalone file; an interpreter translates and executes simultaneously, statement by statement, with no output file. Speed and error reporting follow from this."],
[6,"What is a programming language?","A formal language with a defined vocabulary and grammar that humans use to write instructions for a computer."],
[6,"What does each generation of languages offer?","Progressively higher abstraction: further from the hardware's binary instructions and closer to human language."],
[6,"Define machine language (1GL).","The only language a processor executes directly, without translation: pure binary instructions; extremely tedious, processor-specific and not portable; every program must ultimately be translated to it."],
[6,"Define assembly language (2GL).","A language of short mnemonics, each corresponding to exactly one machine instruction; easier than binary but close to the hardware, requiring knowledge of the processor, and not portable; used for kernels, drivers, interrupt handlers and performance-critical routines."],
[6,"Define high-level languages (3GL).","Languages with vocabulary and syntax close to English and mathematical notation that abstract the hardware away; one statement may expand to many machine instructions; structured constructs (loops, conditionals, functions, data structures); portable."],
[6,"Name 3GLs and their purposes.","FORTRAN (scientific computing, 1950s), COBOL (business data processing), ALGOL (algorithmic computing), C (efficiency and system-level access), C++ (object-oriented extension of C), Java (write once, run anywhere), Python (readability)."],
[6,"Define fourth generation languages.","Very high-level, typically domain-specific declarative languages (database querying, reports, business applications) in which the programmer specifies what is wanted and the language system decides how."],
[6,"Give an example of a 4GL query.","SELECT name, salary FROM employees WHERE department = 'Engineering' ORDER BY salary DESC; the DBMS decides the most efficient way to execute it. SQL is the archetypal 4GL; others are report generators, form builders and office macro languages."],
[6,"Define fifth generation languages.","Languages in which the programmer states a goal or constraint and the system works out both method and steps, often using AI techniques (logical inference, constraint solving, pattern matching)."],
[6,"What is Prolog?","The classic 5GL, built on formal logic: a program consists of facts and rules, and a query asks the system to prove or find something consistent with them, the inference engine choosing the search."],
[6,"Which generations are portable?","3GL, 4GL and 5GL are portable; 1GL (machine) and 2GL (assembly) are not."],
[6,"What is a programming paradigm?","A style describing how a program is structured and thought about; it cuts across generations."],
[6,"Describe procedural programming.","Organises a program as a sequence of instructions and procedure (function) calls executed in order; C and traditional BASIC."],
[6,"Describe object-oriented programming.","Organises a program around objects that bundle data and the functions that operate on it, using classes as templates and supporting inheritance and encapsulation; Java, C++, Python."],
[6,"Describe functional programming.","Treats computation as the evaluation of mathematical functions, avoiding changing state and mutable data; Haskell is the purest example; JavaScript and Python borrow features."],
[6,"Distinguish declarative and imperative programming.","Declarative states what outcome is wanted (SQL); imperative specifies the steps explicitly (procedural and object-oriented languages both fall under imperative)."],
[6,"Distinguish generation from paradigm.","Generation says how close to the hardware a language is; paradigm says how a program is structured; they are independent. Python is a 3GL supporting procedural, object-oriented and functional paradigms."],
[7,"What is a software licence?","Legal permission to use software under terms set by its creator or copyright holder; obtaining software typically means obtaining a licence, not ownership."],
[7,"Name the five licence categories.","Open source, proprietary, freeware, shareware and firmware."],
[7,"Define open source software.","Software whose source code is publicly available for anyone to view, study, use, modify and distribute, typically at no cost; the Open Source Initiative (OSI) defined the term and maintains its criteria."],
[7,"What is the philosophy of open source?","Software improves through collaborative, transparent development: many people examining the code find bugs and contribute improvements."],
[7,"Give examples of open source software.","Linux, Apache OpenOffice, LibreOffice, Mozilla Firefox, VLC, GIMP."],
[7,"Distinguish copyleft and permissive licences.","Copyleft: any distributed modified version must carry the same open licence (GNU GPL). Permissive: far fewer restrictions; the code may be folded into proprietary software without the result being open (MIT, Apache)."],
[7,"What was the GNU project?","Begun by Richard Stallman in 1983 to build a completely free Unix-like operating system; it introduced FOSS, where free means freedom (use, study, modify, redistribute), not primarily price."],
[7,"How did Linux arise from GNU?","The GPL and GNU tools (compiler, text editor, shell) formed the foundation onto which Linus Torvalds built the Linux kernel in 1991, producing the GNU/Linux operating system."],
[7,"Define proprietary software.","Closed-source or commercial software that keeps its source code secret and distributes only binary executables, under an EULA granting a licence, not ownership."],
[7,"What is an EULA?","End User Licence Agreement: the terms governing proprietary software use (permitted uses, installation limits, copying restrictions)."],
[7,"What are the trade-offs of proprietary software?","It protects intellectual property and funds development (one-time purchase, subscription or per-user licence), but users depend on the vendor for fixes, updates and support and are stranded if the product is discontinued."],
[7,"Define software piracy.","The unauthorised copying, distribution or use of software in violation of its licence; violating the EULA is piracy and is illegal."],
[7,"Give the forms of software piracy.","Installing one licensed copy on more machines than permitted, distributing cracked or key-generated copies, and counterfeiting retail packaging."],
[7,"Why is piracy also a security risk?","Pirated software commonly carries malware bundled by the distributor and receives no legitimate security updates."],
[7,"Define freeware.","Software available at no cost, freely downloadable, usable and distributable, but without source code access; it remains proprietary and the developer retains full copyright."],
[7,"Distinguish freeware and open source.","Freeware is free of charge but closed-source; open source gives access to source code with rights to modify and redistribute. Free of charge is not free in the FOSS sense."],
[7,"Give examples of freeware.","Adobe Acrobat Reader, VLC Media Player (also open source), the basic version of Skype, many mobile apps."],
[7,"Define shareware.","Software provided free for a limited trial period or with limited features, expecting satisfied users to pay for the full licence."],
[7,"Name the three shareware models.","Time-limited trial, feature-limited (freemium) and nag-ware."],
[7,"Give an example of shareware.","WinRAR (it works past its 40-day trial with a persistent purchase reminder); many antivirus tools with a free basic tier."],
[7,"Define firmware.","Software permanently or semi-permanently stored in a device's non-volatile memory (ROM or flash) providing the low-level instructions that directly control its hardware."],
[7,"Why is firmware at the boundary of hardware and software?","It is program code, but inseparable from and specific to one particular device."],
[7,"Give examples of firmware.","Computer BIOS or UEFI, a laser printer's controller, a smartphone's hardware layer, routers, televisions, cameras, microwave ovens, automobile control systems; end users rarely modify it, but manufacturers release firmware upgrades."],
[7,"What is dual licensing?","Offering the same software under two licences at once: a copyleft open-source licence for community use and a paid proprietary licence for companies embedding it in a closed product (MySQL)."],
[7,"What is the open-core model?","Releasing a genuinely open-source core product for free while selling proprietary add-on features on top of it."],
[7,"What four questions answer a licensing comparison?","Is the source code visible? Is it free? Can it be modified? Can it be redistributed?"]

const SHORT=[
["Distinguish between system software and application software with examples.","System software manages and controls the computer's hardware and provides the platform on which other programs run; it works in the background, invisible to the user (operating system, device drivers, translators). Application software helps the user perform a specific productive task and runs on top of system software; the user consciously opens it (MS Word, Excel, Chrome). System software serves the computer; application software serves the user.",["System software manages hardware and provides a platform","Application software serves the user directly","Background versus user-opened","Examples of each"]],
["Differentiate between general-purpose and customised application software.","General-purpose software performs a wide variety of tasks for a broad range of users (MS Word, Excel): cheap, quick to obtain and moderately fitting. Customised software is developed for the unique requirements of one organisation (a hospital patient management system): expensive, slow to build, requires a dedicated maintenance team, but a perfect fit and better integrated with existing systems.",["General-purpose: broad audience","Customised: one organisation","Cost, time and fit compared","Examples"]],
["Explain the difference between signature-based and heuristic malware detection.","Signature-based detection scans files for matches against a database of signatures of known malware; it is fast and reliable for known threats but cannot detect anything new. Heuristic detection analyses a program's behaviour and structure for patterns resembling malware, so it can catch unknown (zero-day) threats, but it produces occasional false positives.",["Signature: database of known patterns","Blind to new threats","Heuristic: behaviour and structure","Zero-day detection with false positives"]],
["Distinguish between incremental and differential backup.","An incremental backup copies only data changed since the last backup of any kind; it is fastest and smallest, but restoring needs the full backup and every increment in order. A differential backup copies all data changed since the last full backup; it is larger and slower than incremental, but restoring needs only the full backup and the latest differential.",["Incremental: since last backup of any kind","Differential: since last full backup","Restore chain for incremental","Restore needs two files for differential"]],
["Why should an SSD never be defragmented?","An SSD has no moving parts and reaches every location in the same time regardless of physical position, so defragmentation provides no performance benefit. It only consumes the drive's finite write cycles. Operating systems detect an SSD and use TRIM instead.",["No moving parts","Same access time everywhere","Wastes write cycles","TRIM used instead"]],
["Differentiate between a compiler and an interpreter.","A compiler translates the entire program into machine code before execution and produces a standalone file; it runs fast, but all errors are reported after compilation and one error stops it. An interpreter translates and executes one statement at a time, produces no separate file, reports an error at that line immediately and is easy to debug, but runs slower because translation is repeated at every execution of a statement. The essential difference is when translation happens.",["Compiler: whole program, before execution","Interpreter: statement by statement","Output file versus none","Speed and error reporting"]],
["What is the role of a linker? How does it differ from a loader?","The linker combines one or more object files with the library code they call, resolving every unresolved placeholder into an actual address to produce a single executable file; it works once, after compilation. The loader is an operating system component that copies the executable from storage into RAM, allocates memory and hands control to its first instruction; it works every time the program is run.",["Linker combines object files and libraries","Resolves placeholders","Loader places executable in RAM","Linker once; loader every run"]],
["Distinguish between copyleft and permissive open-source licences.","A copyleft licence (GNU GPL) requires that any distributed modified version also carry the same open licence, so openness is preserved in every derivative. A permissive licence (MIT, Apache) has far fewer restrictions and allows the code to be incorporated into proprietary software without the result being open.",["Copyleft: derivatives must stay open","Example GPL","Permissive: can be closed","Examples MIT and Apache"]],
["What is firmware? Give two examples of devices that contain it.","Firmware is software permanently or semi-permanently stored in a device's non-volatile memory (ROM or flash), providing the low-level instructions that control its hardware; it is software in nature but inseparable from one particular device. Examples: a computer's BIOS or UEFI, a router, a laser printer, a television, a smartphone, a microwave oven.",["Stored in non-volatile memory","Low-level control of hardware","Two correct examples"]],
["Distinguish between freeware and open source software.","Freeware is free of charge but closed-source: the user cannot view, modify or redistribute the source and the developer retains full copyright. Open source software makes its source code publicly available to view, study, modify and distribute, subject to its licence. Freeware is free in price only, not in the FOSS sense of freedom.",["Freeware: no cost, no source","Open source: source available, may modify and redistribute","Free of charge versus freedom"]],
["What is the difference between hard and soft real-time operating systems?","In a hard real-time system a missed deadline causes system failure, so deadlines must never be missed (airbag controller, aircraft flight computer). In a soft real-time system an occasional missed deadline only degrades quality (a late video frame is dropped). The discriminator is the consequence of the miss.",["Hard: deadline never missed, failure","Soft: occasional miss tolerated, degraded quality","Examples","Consequence is the discriminator"]],
["Explain the difference between lossless and lossy compression.","Lossless compression reduces size by removing redundancy and allows the original to be reconstructed perfectly; it is essential for documents, programs and data (ZIP, RAR, 7z). Lossy compression permanently discards some data to obtain a much higher compression ratio; it is acceptable for images, audio and video where small losses are imperceptible.",["Lossless: perfect reconstruction","Lossy: data discarded","Uses of each","Compression ratio"]],
["What is a device driver, and why is it necessary?","A device driver is specialised system software that acts as a translator between the operating system and one specific hardware device, converting generic OS requests into the low-level instructions that device understands. It is necessary because without the correct driver the OS cannot communicate with the device; every peripheral (printer, graphics card, network adapter) needs one.",["Translator between OS and one device","Converts generic requests","OS cannot communicate without it","Every peripheral needs one"]],
["Distinguish between a kernel and a shell.","The kernel is the core of the operating system: it runs with the highest hardware privilege, directly manages the processor, memory and devices and stays resident in memory. The shell is the outer layer through which a user or program issues commands to the kernel, either a command-line shell (Bash) or a graphical shell (desktop). One kernel can have several shells.",["Kernel: privileged core","Shell: outer layer for commands","Command-line or graphical","Same kernel, different shells"]]
];
const LONG=[
["Explain the five core functions of an operating system with examples of each.","The operating system manages the computer's resources through five functions. (1) Process management: creating, scheduling and terminating processes and sharing the CPU fairly among them; for example, switching between a browser and a music player. (2) Memory management: allocating RAM to programs, tracking locations in use, reclaiming memory when a program ends and extending capacity with virtual memory. (3) File system management: organising storage into directories and files and enforcing permissions so only authorised users or programs access data. (4) Device management: controlling input and output devices through device drivers and coordinating data transfer with peripherals, such as a print job passed to a printer driver. (5) User interface management: providing a CLI or GUI through which the user issues instructions.",["Process management with example","Memory management with virtual memory","File system management with permissions","Device management with drivers","User interface management CLI and GUI"]],
["Describe the boot process of a computer from power-on to a usable desktop.","Powering on triggers a fixed sequence of system software. (1) The firmware (BIOS or UEFI) stored in ROM on the motherboard runs first, before any operating system exists in memory. (2) It performs the POST (Power-On Self-Test), checking that the processor, memory and essential devices are present and functioning. (3) It locates a bootable device and loads the small bootloader program from it. (4) The bootloader loads the operating system kernel into RAM and transfers control to it. (5) The kernel initialises drivers, mounts the file system, starts background services and finally launches the shell, the login screen or desktop that the user sees. Every step before the last is system software working before the user sees anything familiar.",["Firmware in ROM","POST","Bootloader","Kernel loaded into RAM","Kernel initialises and launches the shell"]],
["Explain the phases of compilation, describing what each phase checks or produces.","Compilation proceeds in five phases. (1) Lexical analysis breaks the source into tokens: keywords, identifiers, operators and literals. (2) Syntax analysis (parsing) checks that the token sequence follows the language's grammar and builds a parse tree. (3) Semantic analysis checks meaning-level errors that are grammatically valid but logically wrong, such as an undeclared variable, an argument of the wrong type or an incompatible assignment. (4) Code generation translates the validated program into machine code, often via assembly language. (5) Code optimisation restructures the code to run faster or use less memory without changing its observable behaviour. The output is an object file, which the linker combines with libraries into an executable that the loader places in memory.",["Lexical analysis: tokens","Syntax analysis: grammar, parse tree","Semantic analysis: meaning errors with example","Code generation","Code optimisation without changing behaviour"]],
["Compare assemblers, compilers, and interpreters on input, translation method, output, speed, and error reporting.","Assembler: input is assembly language; it translates instruction by instruction; the output is a machine code object file; execution is very fast; errors are reported after assembly; examples NASM, MASM. Compiler: input is a high-level language; it translates the entire program at once; the output is an executable or object file; execution is fast; errors are reported after the full compilation and a single error prevents output; examples GCC and javac. Interpreter: input is a high-level language; it translates and executes statement by statement; there is no separate output file; execution is slow because translation is repeated; errors are reported immediately at the erroneous line; examples Python and Ruby. The key distinction is when translation happens.",["Input language of each","Translation method of each","Output of each","Execution speed","Error reporting","Examples"]],
["Trace the five generations of programming languages, giving the type, an example, and the level of abstraction of each.","1GL, machine language: pure binary executed directly, closest to the hardware, processor-specific and not portable. 2GL, assembly language: mnemonics (MOV, ADD) each matching one machine instruction, very close to the hardware, not portable, translated by an assembler (NASM). 3GL, high-level languages: English-like vocabulary and syntax, hardware abstracted away, portable, structured constructs, translated by a compiler or interpreter (C, Java, Python). 4GL: very high-level and declarative, specifying what is wanted rather than how, domain-specific (SQL). 5GL: goal or constraint-based, AI-assisted, the system works out method and steps (Prolog). Each generation is more abstract and closer to human language.",["1GL machine language","2GL assembly language","3GL high-level with examples","4GL declarative SQL","5GL goal-based Prolog","Increasing abstraction and portability"]],
["Explain the major categories of utility software, describing the purpose of each.","Utility software maintains, optimises and protects the system. Antivirus detects, prevents and removes malware using signature-based detection, heuristic detection and real-time protection. Backup software copies data to a separate location for recovery; strategies are full, incremental and differential. File compression reduces file size by removing redundancy, losslessly (ZIP, RAR) or lossily (images, audio, video). Disk cleanup deletes unnecessary files such as temporary files, caches and Recycle Bin contents to reclaim space. Disk defragmentation gathers scattered fragments of files on an HDD into contiguous sectors to speed access; it is not needed for an SSD, which uses TRIM. Also: disk formatting and partitioning, system monitors and system restore.",["Antivirus with detection methods","Backup with strategies","Compression lossless and lossy","Disk cleanup","Defragmentation HDD only","Another utility such as formatting or restore"]],
["Describe the five major software licence types, covering source code access, cost, modification rights, and redistribution rights for each.","Open source: source code available, free of cost, may be modified, may be redistributed subject to its licence (Linux, Firefox, GIMP); copyleft (GPL) or permissive (MIT, Apache). Proprietary: source code secret, usually paid, no modification, no redistribution, governed by an EULA (Windows, MS Office). Freeware: no source code, free of charge, no modification, usually redistributable unchanged (Adobe Reader). Shareware: no source code, free for a trial or with limited features then paid, no modification, redistribution of the trial only (WinRAR); models are time-limited, feature-limited and nag-ware. Firmware: no source code, included with the device, not modified or redistributed by users (BIOS, router firmware).",["Open source: source, free, modify, redistribute","Proprietary: closed, paid, EULA","Freeware: free, closed","Shareware: trial then paid","Firmware: embedded in device","All four questions answered for each"]],
["Explain the advantages and disadvantages of customised software compared to general-purpose software, with two real-world examples of customised systems.","Advantages of customised software: a perfect fit with the organisation's needs; better integration with existing systems; competitive advantage from unique capability; greater long-term efficiency. Disadvantages: significantly higher development cost; longer development time; ongoing maintenance requiring a dedicated team; risk of dependence on a single vendor or team. General-purpose software is cheap, quick to obtain and moderately fitting but may offer insufficient functionality. Examples of customised systems: a hospital patient management system integrating its billing, medical record formats, scheduling and insurance workflows; a railway reservation system handling its particular routes, fare structures and seat classes; a bank's core banking system.",["Advantages listed","Disadvantages listed","Comparison with general-purpose on cost, fit and time","Two real examples explained"]],
["Describe the different types of operating systems classified by mode of operation.","Batch: jobs are collected and run in groups with no interaction (payroll and billing). Time-sharing or multi-user: the CPU is rapidly switched among many users' processes (Unix servers). Multiprogramming or multitasking: several programs are kept in memory so that an I/O wait does not idle the CPU (desktop systems). Real-time: guarantees a response within a strict time limit; hard real-time (airbag controller, flight computer) must never miss a deadline, soft real-time (streaming video) tolerates occasional misses. Distributed: networked computers appear as one system (cloud platforms). Embedded: a minimal OS in a single-purpose device (washing machine, router). Mobile: optimised for touch, battery efficiency and intermittent connectivity (Android, iOS).",["Batch and time-sharing","Multiprogramming","Real-time hard and soft","Distributed","Embedded and mobile","Examples for each"]],
["Explain the GNU project and its role in the development of Linux.","The GNU project, begun by Richard Stallman in 1983, aimed to build a completely free, Unix-like operating system. It introduced the concept of FOSS (Free and Open Source Software), where free means freedom to use, study, modify and redistribute, not primarily price. Its GNU General Public Licence (GPL) is a copyleft licence requiring derivatives to stay open, and its tools (a compiler, a text editor, a shell) formed the foundation. In 1991 Linus Torvalds built the Linux kernel on this foundation, and together they produced the GNU/Linux operating system that today runs most of the world's servers, supercomputers and, via Android, mobile devices.",["Stallman 1983 and aim","FOSS and meaning of free","GPL and copyleft","GNU tools as foundation","Torvalds and the Linux kernel 1991","GNU/Linux widespread use"]]
];
const APP=[
["A small business wants inventory software. Should it buy general-purpose software or commission customised software? Justify your recommendation considering cost, time, and fit.","For a small business, general-purpose (off-the-shelf) inventory software is usually the better choice: it is much cheaper, available immediately and needs no dedicated maintenance team, and its moderate fit is usually sufficient for ordinary stock tracking. Customised software gives a perfect fit and better integration, but at significantly higher cost, longer development time and dependence on a single vendor, which a small business can seldom justify. Customised software becomes worthwhile only if its workflows are so unusual that no package can be adapted to them.",["Cost: general-purpose cheaper","Time: available quickly","Fit: moderate but adequate","Customised fit but expensive and slow","Clear recommendation justified"]],
["A user notices their laptop, which has an SSD, offers no defragment option in its disk utility, only optimise. Explain why.","An SSD has no moving parts and reaches every location in the same time regardless of where data is physically placed, so defragmentation would give no performance benefit; it would only consume the drive's finite write cycles. The operating system detects the SSD and offers an optimise operation that issues the TRIM command, which helps the drive manage its own storage internally.",["SSD has no moving parts","Equal access time","Defragmenting wastes write cycles","Optimise means TRIM"]],
["A programmer distributes a game as freeware but is surprised when a user asks to see and modify the source code. Explain the misunderstanding.","Freeware means free of charge, not free in the open source sense. The compiled game may be downloaded and used at no cost, but freeware is proprietary underneath: the source code is not provided, the user may not modify it and the developer retains full copyright. A user who wants to view and modify the source needs an open source licence. The user confused free of charge with freedom to study and modify.",["Freeware is free of charge only","Source code not provided","Developer retains copyright","Open source needed to modify"]],
["An organisation is deciding between a full backup every night and an incremental backup strategy. Discuss the trade-offs and recommend an approach.","A nightly full backup is the simplest and fastest to restore (one set) but is the slowest to create and uses the most storage. An incremental strategy is fastest and smallest each night, but restoring needs the full backup plus every increment in order, so one damaged increment breaks the chain and recovery is slower. A sensible recommendation is a weekly full backup with nightly differential (or incremental) backups, following the 3-2-1 rule: three copies, two media, one off-site. If recovery speed is critical choose differential; if nightly time and storage are tight choose incremental.",["Full: simple restore but slow and large","Incremental: small and fast but long restore chain","Differential as a compromise","Recommendation with justification","3-2-1 rule"]],
["A company wants to release its software as open source but also earn revenue from enterprise customers. Suggest a licensing approach and justify it.","The company can use dual licensing or the open-core model. With dual licensing it offers the code under a copyleft open-source licence (such as the GPL) for community use and sells a paid proprietary licence to companies that want to embed it in closed products without copyleft obligations, as MySQL does. With open-core it releases a genuinely open-source core for free and sells proprietary enterprise add-on features and support. Both show that open source and commercial are independent choices that can be combined.",["Dual licensing explained","Open-core explained","Revenue from enterprise customers","Open source and commercial combined"]],
["Explain why a real-time operating system would be unsuitable for use as a general desktop operating system, despite its precise timing guarantees.","A real-time operating system is designed to guarantee a response within a strict time limit for a narrow set of tasks, usually in a single-purpose device. A general desktop OS must support many varied applications, multiple users' needs, rich graphical interfaces, large file systems and many peripherals, and it favours flexibility and throughput over strict deadlines. The design trade-offs needed for deadline guarantees (a minimal, predictable system) conflict with these broad features, so an RTOS offers little of what a desktop user needs.",["RTOS guarantees deadlines for narrow tasks","Desktop needs variety of applications and features","Design trade-offs conflict","Conclusion"]]

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function norm(s){return " "+String(s).toLowerCase().replace(/[^a-z0-9]+/g," ").trim()+" ";}
function matches(user,acc,all){const u=norm(user);const hit=a=>u.includes(norm(a));return all?acc.every(hit):acc.some(hit);}

  h+=`<div class="subnav"><button class="chip" data-act="cord" data-v="0" aria-pressed="${!S.cards.ordered}">Shuffled</button><button class="chip" data-act="cord" data-v="1" aria-pressed="${S.cards.ordered}">Chapter order</button></div>`;
  h+=`<div class="stats"><div class="stat"><b>${c[0]}</b><span>New</span></div><div class="stat"><b>${c[1]}</b><span>Learning</span></div><div class="stat"><b>${c[2]}</b><span>Review</span></div><div class="stat"><b>${c[3]}</b><span>Mastered</span></div></div>`;
  h+=`<div class="bar" aria-hidden="true"><i style="width:${tot?Math.round(c[3]/tot*100):0}%"></i></div>`;
  const q=S.cards.queue;
  if(!q.length){
    h+=`<div class="panel"><h3>${c[3]===tot?"Every card in this set is mastered":"Session complete"}</h3><p class="hint">${S.cards.done} cards rated this session.</p><div class="row"><button class="btn primary" data-act="cnext">Start another round</button><button class="btn" data-act="creset">Reset progress for this set</button></div></div>`;
    return h;
  }
  const id=q[0],k=CARDS[id];
  h+=`<div class="panel fc"><div class="lab">Question · ${esc(SECS[k[0]])} · ${q.length} left</div><div class="q">${esc(k[1])}</div>`;
  h+=`<input type="text" id="guess" placeholder="Type what you remember (optional)" value="${esc(S.cards.guess)}" autocomplete="off">`;
  if(!S.cards.flip){h+='<div class="row"><button class="btn primary" data-act="flip">Show answer</button><span class="hint">or press Space</span></div>';}
  else{
    h+=`<div class="lab">Answer</div><div class="a">${esc(k[2])}</div><div class="row"><button class="btn bad" data-act="rate" data-v="miss">Missed it (1)</button><button class="btn warn" data-act="rate" data-v="almost">Almost (2)</button><button class="btn good" data-act="rate" data-v="got">Got it (3)</button></div>`;
  }
  return h+"</div>";
}
function viewCloze(){
  let h='<p class="hint">Read each passage and say the hidden term aloud before you tap it. Tap again to hide it.</p><div class="row"><button class="btn" data-act="revall">Reveal all</button><button class="btn" data-act="hideall">Hide all</button></div>';
  NOTES.forEach(n=>{
    const body=esc(n[1]).replace(/\{\{(.+?)\}\}/g,(m,a)=>`<button class="blank" data-act="blank" style="min-width:${Math.max(4,a.length)}ch" aria-label="Hidden term, press to reveal"><span class="ans">${a}</span></button>`);
    h+=`<div class="panel note"><h3>${esc(n[0])}</h3><p>${body}</p></div>`;
  });
  return h;
}
function viewCover(){
  let h='<p class="hint">Cover the answers, say what belongs in each cell, then tap it to check. Switch the mask to quiz yourself from the other direction.</p>';
  TABLES.forEach((t,ti)=>{
    const m=S.tmode[ti]||"a";
    h+=`<div class="panel"><div class="row" style="justify-content:space-between"><h3>${esc(t.t)}</h3><div class="subnav"><button class="chip" data-act="tmode" data-t="${ti}" data-v="a" aria-pressed="${m==="a"}">Hide answers</button><button class="chip" data-act="tmode" data-t="${ti}" data-v="b" aria-pressed="${m==="b"}">Hide first column</button><button class="chip" data-act="tmode" data-t="${ti}" data-v="o" aria-pressed="${m==="o"}">Show all</button></div></div><div class="tbl"><table><thead><tr>${t.c.map(c=>`<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>`;
    t.r.forEach(r=>{h+="<tr>"+r.map((c,ci)=>{const hid=(m==="a"&&ci>0)||(m==="b"&&ci===0);return `<td><span class="m${hid?" hid":""}" data-act="mask"${hid?' tabindex="0" role="button" aria-label="Hidden, press to reveal"':""}>${esc(c)}</span></td>`;}).join("")+"</tr>";});
    h+="</tbody></table></div></div>";
  });
  return h;
}
function viewDump(){
  const d=DUMPS[S.dump.i];
  let h='<p class="hint">Pick a topic and write everything you can remember with the chapter closed. Then compare against the key points and tick what you covered. The unticked points are your study list.</p>';

  h+=`<div class="panel"><h3>${esc(d.t)}</h3><label class="lab" for="dtext">Your recall</label><textarea id="dtext" placeholder="Write it all out, in your own words...">${esc(S.dump.text)}</textarea>`;
  if(!S.dump.checked){h+='<div class="row"><button class="btn primary" data-act="dcheck">Compare with key points</button></div>';}
  else{
    const n=d.p.length,got=d.p.filter((_,i)=>S.dump.ticks[i]).length;
    h+=`<div class="lab">Tick what you included</div><div class="pts">`+d.p.map((p,i)=>`<label><input type="checkbox" data-act="dtick" data-i="${i}"${S.dump.ticks[i]?" checked":""}><span>${esc(p)}</span></label>`).join("")+`</div><div class="row"><b>${got} of ${n} covered</b><button class="btn" data-act="dreset">Try again</button></div>`;
  }
  return h+"</div>";
}
