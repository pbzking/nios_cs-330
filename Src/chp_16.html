const NOTES=[
["1.1 One-dimensional arrays","An {{array}} is a fixed-size, ordered collection of elements of the {{same}} type stored in {{contiguous}} memory and reached by a {{zero-based}} index; the valid indices of n elements are {{0}} to {{n - 1}}. The address of arr[i] is the base address plus {{i x sizeof(element)}}, so the index is an {{offset}}. The size must be a {{constant}}. A partial initialiser fills the rest with {{zeros}}, so {0} zeroes the whole array; an uninitialised local array holds {{garbage}}. C++ does no {{bounds checking}}: an out-of-range index is {{undefined behaviour}}, the root of the {{buffer overflow}}. The loop form is i < size, never {{i <= size}}. The element count is sizeof(arr) / {{sizeof(arr[0])}}. Arrays cannot be copied with {{=}} or compared with {{==}}."],
["1.2 Two- and multi-dimensional arrays","A {{two-dimensional}} array is an array of arrays, written a[{{rows}}][{{columns}}], with the row index first. It is processed with {{nested}} loops: the outer loop for rows and the inner loop for columns, and {{endl}} after the inner loop. Memory is one-dimensional, so a 2D array is stored in {{row-major}} order; the address of m[i][j] is base + ({{i x C + j}}) x sizeof(element), where C is the number of {{columns}}. A function receiving a 2D array must be told the number of {{columns}}. The number of elements is the {{product}} of the dimensions: int a[3][4][2] has {{24}} elements."],
["1.3 Array operations","{{Traversal}} visits every element exactly once. The sum is accumulated in a loop, and the average needs a {{cast}} to avoid integer division. The largest is found by starting with {{arr[0]}}, not 0. An array is reversed in place by swapping pairs for only {{half}} the length. {{Insertion}} shifts elements {{right}}, working from the {{end}} backwards; {{deletion}} shifts elements {{left}}, working {{forwards}}. An array passed to a function {{decays}} into the {{address}} of its first element, so the function changes the {{caller's}} array and cannot find its size: sizeof(arr) gives the size of a {{pointer}}, so the size is passed as a separate parameter. {{const}} promises a function will only read the array."],
["1.3 Searching","{{Linear search}} checks elements one by one, works on {{any}} array and returns the index or {{-1}}; its worst case is {{n}} comparisons, O(n). {{Binary search}} needs a {{sorted}} array: it compares the target with the {{middle}} element and discards half the range each time, O(log n), with at most {{floor(log2 n) + 1}} comparisons. The middle is written low + {{(high - low) / 2}} to avoid {{overflow}}. An unsuccessful search ends when {{low > high}}. For n = 1,000,000 binary search needs at most {{20}} comparisons."],
["1.4 Sorting","{{Bubble sort}} swaps adjacent out-of-order pairs; each pass carries the {{largest}} remaining value to the end, and a {{swapped}} flag allows an early exit. {{Selection sort}} selects the {{minimum}} of the unsorted part and swaps it to the front, making at most {{n - 1}} swaps. {{Insertion sort}} keeps a sorted {{prefix}} and slides each key left past larger elements, like sorting playing cards. All three are O({{n^2}}) in the worst case. The library function {{sort}} in <algorithm> is O(n log n). Each sort changes the caller's array because arrays are passed by {{address}}."],
["1.5 Character arrays and strings","A C-style {{string}} is a char array ending with the {{null}} character '\\0', whose ASCII code is {{0}}. The array must be {{one}} cell larger than the text. 'A' is one character but \"A\" occupies {{two}} bytes. cout prints up to the null. cin >> stops at {{whitespace}}, so it reads one word; {{cin.getline(array, size)}} reads a whole line. After a numeric cin >> the leftover {{newline}} is removed with {{cin.ignore()}}. {{std::string}}, from <string>, is a class that grows automatically, joins with {{+}} and compares with {{==}}; it cannot overflow."],
["1.6 String functions","<{{cstring}}> supplies {{strlen}}, {{strcpy}}, {{strcat}} and {{strcmp}}, because = and == do not work on character arrays. strlen excludes the {{null}}, while sizeof gives the {{capacity}}: for char s[] = \"Hello\", strlen is {{5}} and sizeof is {{6}}. strcmp returns {{0}} when equal, a negative value when the first string comes first and a positive value otherwise, using ASCII codes, so every {{capital}} sorts before every lowercase letter. Never compare with {{==}}, which compares addresses. strcpy and strcat do not check the destination, so too small an array causes a {{buffer overflow}}."],
["1.7 Matrices and frequency count","{{Matrix addition}} needs {{identical}} dimensions. {{Multiplication}} needs the number of columns of A to equal the number of {{rows}} of B; an m x n matrix times an n x p matrix is {{m x p}}, with a triple loop and the result starting at {{zero}}. Multiplication is not {{commutative}}. The {{transpose}} satisfies t[j][i] = a[i][j], so a 2 x 3 matrix becomes {{3 x 2}}. The main diagonal elements are m[{{i}}][{{i}}]. A {{frequency count}} uses a nested loop with a {{counted}} flag array, O(n^2), or a {{counting array}} freq[arr[i]]++, O(n), for small non-negative values."]
];

["Why is accessing arr[5] of a 5-element array dangerous?","The valid indices are 0 to 4 and C++ does not check bounds, so arr[5] compiles but reads or overwrites the memory beside the array. The result is undefined behaviour: garbage, a corrupted variable or a crash, and an out-of-bounds write is the root of the buffer overflow.",["Valid indices 0 to 4","No bounds checking","Undefined behaviour"]],
["Why can a function change an array passed to it, and why can it not find the array's size?","The array name decays into the address of its first element and only that address is passed, so the function works on the caller's own array, as with call by reference. Because only an address arrives, sizeof(arr) gives the size of a pointer, so the size must be passed as a separate parameter.",["Address passed, not a copy","Changes affect the original","sizeof gives pointer size; pass the size"]],
["Distinguish linear search from binary search, with the requirement of each.","Linear search checks elements one by one from the start, works on any array, sorted or not, and needs up to n comparisons, O(n). Binary search compares the target with the middle element and discards half the range each time, O(log n), but requires the array to be sorted.",["Linear: any array, O(n)","Binary: sorted only, O(log n)","Halving the range"]],

["Distinguish bubble sort from selection sort.","Bubble sort compares adjacent pairs and swaps them when out of order, so the largest value moves to the end on each pass and many swaps occur; with a swapped flag it can stop early. Selection sort finds the minimum of the unsorted part in each pass and makes one swap, so it makes at most n - 1 swaps. Both are O(n^2).",["Bubble: adjacent swaps, largest sinks","Selection: minimum, one swap per pass","Both O(n^2)"]],

["Write a program for linear search and one for binary search, and trace binary search for a target in a sorted array of 7 elements.","int linearSearch(int arr[], int size, int target) { for (int i = 0; i < size; i++) if (arr[i] == target) return i; return -1; } int binarySearch(int arr[], int size, int target) { int low = 0, high = size - 1; while (low <= high) { int mid = low + (high - low) / 2; if (arr[mid] == target) return mid; else if (arr[mid] < target) low = mid + 1; else high = mid - 1; } return -1; } Binary search needs a sorted array. Trace for 56 in {5, 8, 12, 23, 45, 56, 67}: low 0, high 6, mid 3 (23 < 56) so low = 4; low 4, high 6, mid 5 (56): found at index 5 after two comparisons. For 10, the range empties when low > high and -1 is returned. Linear search is O(n) and works on any array; binary search is O(log n).",["Linear search code","Binary search code","Sorted requirement","Trace with low, high, mid","low > high ends"]],
["Write the program for bubble sort, and show the array after each pass for {5, 1, 4, 2, 8}.","void bubbleSort(int arr[], int size) { for (int i = 0; i < size - 1; i++) for (int j = 0; j < size - i - 1; j++) if (arr[j] > arr[j + 1]) { int temp = arr[j]; arr[j] = arr[j + 1]; arr[j + 1] = temp; } } Each pass carries the largest remaining value to the end, and the inner bound shrinks because the last i elements are in place. Passes: start 5 1 4 2 8; pass 1: 1 4 2 5 8; pass 2: 1 2 4 5 8; pass 3: 1 2 4 5 8 (no swaps); pass 4: 1 2 4 5 8. With a swapped flag the sort stops after pass 3. Time O(n^2), O(n) best case with the flag.",["Two nested loops with correct bounds","Three-line swap","Pass-by-pass table","Largest sinks each pass","Flag and complexity"]],

int binarySearch(int arr[], int size, int target)
{
    int low = 0, high = size - 1;

function sortSim(){
  const p=parseList(L.sarr,2,10);if(p.err)return {err:p.err};
  const a=p.v.slice(),rows=[];let cmp=0,sw=0;const n=a.length;
  rows.push(["start","-",a.join(" ")]);
  if(L.sa==="bubble"){
    for(let i=0;i<n-1;i++){let s=0;for(let j=0;j<n-i-1;j++){cmp++;if(a[j]>a[j+1]){const t=a[j];a[j]=a[j+1];a[j+1]=t;s++;sw++;}}rows.push([i+1,s+" swap(s); "+a.slice(n-i-1).join(" ")+" in final place",a.join(" ")]);if(s===0){rows[rows.length-1][1]="no swaps: already sorted (a flag would stop here)";}}
  }else if(L.sa==="selection"){
    for(let i=0;i<n-1;i++){let m=i;for(let j=i+1;j<n;j++){cmp++;if(a[j]<a[m])m=j;}if(m!==i){const t=a[m];a[m]=a[i];a[i]=t;sw++;}rows.push([i,"minimum "+a[i]+" placed at index "+i+(m===i?" (already there)":""),a.join(" ")]);}
  }else{
    for(let i=1;i<n;i++){const key=a[i];let j=i-1;while(j>=0){cmp++;if(a[j]>key){a[j+1]=a[j];sw++;j--;}else break;}a[j+1]=key;rows.push([i,"key "+key,a.slice(0,i+1).join(" ")+(i+1<n?" | "+a.slice(i+1).join(" "):"")]);}
  }
  return {rows:rows,cmp:cmp,sw:sw,res:a};
}
function sortCode(){
  if(L.sa==="bubble")return "for (int i = 0; i < size - 1; i++)\n    for (int j = 0; j < size - i - 1; j++)\n        if (arr[j] > arr[j + 1])\n            swap arr[j] and arr[j + 1];";
  if(L.sa==="selection")return "for (int i = 0; i < size - 1; i++) {\n    int minIndex = i;\n    for (int j = i + 1; j < size; j++)\n        if (arr[j] < arr[minIndex]) minIndex = j;\n    swap arr[minIndex] and arr[i];\n}";
  return "for (int i = 1; i < size; i++) {\n    int key = arr[i];\n    int j = i - 1;\n    while (j >= 0 && arr[j] > key) { arr[j + 1] = arr[j]; j--; }\n    arr[j + 1] = key;\n}";
}

  const sorted=a.every((x,i)=>i===0||a[i-1]<=x);
  if(!sorted)return '<div class="rs bad"><b>The array is not sorted.</b> Binary search requires a sorted array, so the result would be unreliable. Sort the numbers into ascending order first.</div>';
  let low=0,high=a.length-1,rows=[],found=-1;
  while(low<=high){const mid=low+Math.floor((high-low)/2);const v=a[mid];let d;if(v===t){d=v+" = "+t+": found";found=mid;}else if(v<t){d=v+" < "+t+": low = "+(mid+1);}else d=v+" > "+t+": high = "+(mid-1);rows.push([low,high,mid,v,d]);if(found>=0)break;if(v<t)low=mid+1;else high=mid-1;}
  if(found<0)rows.push([low,high,"-","-","low > high: range empty, return -1"]);
  const worst=Math.floor(Math.log2(a.length))+1;
  return '<pre class="codeview">'+esc("while (low <= high) {\n    int mid = low + (high - low) / 2;\n    if (arr[mid] == target) return mid;\n    else if (arr[mid] < target) low = mid + 1;\n    else high = mid - 1;\n}\nreturn -1;")+"</pre>"+tbl(["low","high","mid","arr[mid]","Decision"],rows)+'<div class="rs '+(found>=0?"ok":"note")+'"><b>'+(found>=0?"Found at index "+found+".":"Not found: returns -1.")+"</b> "+rows.filter(r=>r[2]!=="-").length+" comparison(s); at most floor(log2 "+a.length+") + 1 = "+worst+" are ever needed.</div>";
}

function strRes(){
  const s=L.st1,cap=parseInt(L.scap,10);
  if(isNaN(cap)||cap<1||cap>20)return '<div class="rs bad">Enter a capacity from 1 to 20.</div>';
  if(s.length>20)return '<div class="rs bad">Use at most 20 characters.</div>';
  const cells=[];for(let i=0;i<cap;i++)cells.push(i<s.length?s[i]:i===s.length?"\\0":"?");
  const ov=s.length+1>cap;
  let h='<div class="tblwrap"><table class="tbl"><thead><tr>'+cells.map((c,i)=>"<th>["+i+"]</th>").join("")+"</tr></thead><tbody><tr>"+cells.map((c,i)=>"<td"+(c==="\\0"?' style="font-weight:700"':"")+">"+esc(c==="\\0"?"\\0":c)+"</td>").join("")+"</tr></tbody></table></div>";
  if(ov)return h+'<div class="rs bad"><b>Buffer overflow.</b> The text needs '+s.length+" characters plus the null: "+(s.length+1)+" cells, but char name["+cap+"] has only "+cap+". The extra characters would overwrite neighbouring memory.</div>";
  const t=L.st2;let k=0;while(k<s.length&&k<t.length&&s[k]===t[k])k++;
  const a=k<s.length?s.charCodeAt(k):0,b=k<t.length?t.charCodeAt(k):0;
  const cmp=a===b?"0 (equal)":(a<b?"negative":"positive");
  return h+'<div class="rs ok"><b>strlen = '+s.length+"; sizeof = "+cap+".</b> The null terminator is at index "+s.length+"; "+(cap-s.length-1)+" cell(s) are unused (garbage). Remember that the array must be one cell larger than the text.</div><p><b>strcmp(\""+esc(s)+'", "'+esc(t)+"\") is "+cmp+".</b> "+(a===b?"All characters are equal and both end together.":"The first difference is at index "+k+": '"+(k<s.length?s[k]:"\\0")+"' ("+a+") against '"+(k<t.length?t[k]:"\\0")+"' ("+b+"). Capital letters (65 to 90) sort before lowercase letters (97 to 122).")+"</p>";
}

function matVals(r,c,seed){const m=[];for(let i=0;i<r;i++){m.push([]);for(let j=0;j<c;j++)m[i].push(seed===0?i*c+j+1:((i+j+seed)%4)+1);}return m;}
function matHtml(m,name){return '<div class="mcell"><b>'+name+" ("+m.length+" x "+m[0].length+')</b><pre class="codeview">'+esc(m.map(r=>r.join("  ")).join("\n"))+"</pre></div>";}
function matRes(){
  const r1=+L.mr1,c1=+L.mc1,r2=+L.mr2,c2=+L.mc2;
  const A=matVals(r1,c1,0),B=matVals(r2,c2,1);
  let h='<div class="row">'+matHtml(A,"A")+(L.mop==="tr"?"":matHtml(B,"B"))+"</div>";
  if(L.mop==="add"){
    if(r1!==r2||c1!==c2)return h+'<div class="rs bad"><b>Addition is not defined.</b> A is '+r1+" x "+c1+" and B is "+r2+" x "+c2+": the dimensions must be identical.</div>";
    const S=A.map((r,i)=>r.map((x,j)=>x+B[i][j]));return h+matHtml(S,"A + B")+'<div class="rs ok"><b>sum[i][j] = a[i][j] + b[i][j].</b> Each element is the sum of the corresponding elements.</div>';
  }
  if(L.mop==="mul"){
    if(c1!==r2)return h+'<div class="rs bad"><b>A x B is not defined.</b> The columns of A ('+c1+") must equal the rows of B ("+r2+"). The inner sizes "+c1+" and "+r2+" differ.</div>";
    const C=[];for(let i=0;i<r1;i++){C.push([]);for(let j=0;j<c2;j++){let s=0;for(let k=0;k<c1;k++)s+=A[i][k]*B[k][j];C[i].push(s);}}
    const terms=[];for(let k=0;k<c1;k++)terms.push(A[0][k]+" x "+B[k][0]);
    return h+matHtml(C,"A x B")+'<div class="rs ok"><b>A ('+r1+" x "+c1+") x B ("+r2+" x "+c2+") = "+r1+" x "+c2+".</b> Example: result[0][0] = "+terms.join(" + ")+" = "+C[0][0]+". Multiplications performed: "+r1+" x "+c2+" x "+c1+" = "+(r1*c2*c1)+".</div>";
  }
  const Tm=[];for(let j=0;j<c1;j++){Tm.push([]);for(let i=0;i<r1;i++)Tm[j].push(A[i][j]);}
  return h+matHtml(Tm,"Transpose of A")+'<div class="rs ok"><b>t[j][i] = a[i][j].</b> A '+r1+" x "+c1+" matrix has a "+c1+" x "+r1+" transpose: the dimensions are swapped.</div>";
}

}
function evalSetup(){
  let h='<div class="panel"><h2>Build a test</h2><p class="hint">Choose the question types. Written answers (short, long, scenario) are self-marked against the key points, like checking your own paper.</p><div style="display:flex;flex-direction:column;gap:8px">';
  TYPES.forEach(t=>{h+=`<div class="tcount"><label><input type="checkbox" data-act="etype" data-v="${t.k}"${S.ev.types[t.k]?" checked":""}><span>${esc(t.n)}</span></label><span class="n">${countOf(t.k)} Qs · ${t.m} mark${t.m>1?"s":""} each</span></div>`;});
  const pool=BANK.filter(b=>S.ev.types[b.t]).length;
  h+=`</div><div class="row"><label for="en" class="lab">Length</label><select id="en" style="width:auto"><option value="10"${S.ev.n==10?" selected":""}>10 questions</option><option value="20"${S.ev.n==20?" selected":""}>20 questions</option><option value="35"${S.ev.n==35?" selected":""}>35 questions</option><option value="0"${S.ev.n==0?" selected":""}>Everything selected (${pool})</option></select></div><div class="row"><button class="btn primary" data-act="estart"${pool?"":" disabled"}>Start test</button></div></div>`;
  if(store.hist.length){
    h+='<div class="panel"><h3>Recent tests</h3>'+store.hist.slice(0,6).map(x=>`<div class="row" style="justify-content:space-between"><span>${esc(x.d)} · ${x.n} questions</span><b>${x.pct}%</b></div>`).join("")+"</div>";
  }
  return '<div style="display:flex;flex-direction:column;gap:18px">'+h+"</div>";
}
function startRun(list){
  const qs=list.map(q=>q.t==="mcq"?Object.assign({},q,{o:shuffle(q.opts.map((t,i)=>({t:t,c:i===q.a})))}):q);
  S.run={qs:qs,i:0,res:[],stage:[],ticks:[],text:[]};S.ev.view="quiz";render();window.scrollTo(0,0);
}
function evalQuiz(){
  const r=S.run,q=r.qs[r.i],res=r.res[r.i],T=TM[q.t];
  let h=`<div class="panel"><div class="row" style="justify-content:space-between"><span class="tag">${esc(T.n)}</span><span class="lab">Question ${r.i+1} of ${r.qs.length} · ${T.m} mark${T.m>1?"s":""}</span></div><div class="bar" aria-hidden="true"><i style="width:${Math.round(r.i/r.qs.length*100)}%"></i></div>`;
  h+=`<h3 style="font-size:1.2rem;line-height:1.35">${esc(q.t==="fill"?q.q.replace("___","_______"):q.q)}</h3>`;
  if(q.t==="calc"&&q.src)h+='<pre class="codeview">'+esc(q.src)+'</pre>';
  if(q.t==="mcq"){
    h+='<div class="opts">'+q.o.map((o,i)=>{let c="opt";if(res){if(o.c)c+=" right";else if(res.pick===i)c+=" wrong";}return `<button class="${c}" data-act="mcq" data-i="${i}"${res?" disabled":""}>${esc(o.t)}</button>`;}).join("")+"</div>";
    if(res)h+=`<div class="fb ${res.score?"ok":"no"}"><b>${res.score?"Correct.":"Not quite."}</b> ${esc(q.e)}</div>`;
  }else if(q.t==="tf"){
    h+='<div class="opts">'+[true,false].map(v=>{let c="opt";if(res){if(q.a===v)c+=" right";else if(res.pick===v)c+=" wrong";}return `<button class="${c}" data-act="tf" data-v="${v}"${res?" disabled":""}>${v?"True":"False"}</button>`;}).join("")+"</div>";
    if(res)h+=`<div class="fb ${res.score?"ok":"no"}"><b>${res.score?"Correct.":"Not quite."}</b> ${esc(q.e)}</div>`;
  }else if(q.t==="fill"||q.t==="vsa"||q.t==="calc"){
    h+=`<input type="text" id="ans" autocomplete="off" placeholder="Type your answer" value="${esc(r.text[r.i]||"")}"${res?" disabled":""}>`;
    if(!res)h+='<div class="row"><button class="btn primary" data-act="check">Check</button></div>';
    else{
      h+=`<div class="fb ${res.score?"ok":"no"}"><b>${res.score?"Correct.":"Model answer:"}</b> ${res.score?"":esc(q.model)} ${q.e?esc(q.e):""}</div>`;
      if(!res.score)h+='<div class="row"><button class="btn" data-act="override">I was right, count it</button></div>';
    }
  }else{
    const st=r.stage[r.i]||0;
    h+=`<textarea id="wtext" placeholder="Write your answer as you would in the exam..."${st?" disabled":""}>${esc(r.text[r.i]||"")}</textarea>`;
    if(!st)h+='<div class="row"><button class="btn primary" data-act="reveal">Show model answer</button></div>';
    else{
      const tk=r.ticks[r.i]||{};const got=q.pts.filter((_,i)=>tk[i]).length;
      h+=`<div class="lab">Model answer</div><div class="a" style="border-left:3px solid var(--accent);padding-left:14px">${esc(q.model)}</div><div class="lab">Tick every marking point your answer made</div><div class="pts">`+q.pts.map((p,i)=>`<label><input type="checkbox" data-act="wtick" data-i="${i}"${tk[i]?" checked":""}${res?" disabled":""}><span>${esc(p)}</span></label>`).join("")+"</div>";
      if(!res)h+=`<div class="row"><button class="btn primary" data-act="wsave">Save score (${fmt(got/q.pts.length*T.m)} of ${T.m})</button></div>`;
      else h+=`<div class="fb ${res.score>=T.m?"ok":"no"}">Scored ${fmt(res.score)} of ${T.m}.</div>`;
    }
  }
  if(res){h+=`<div class="row"><button class="btn primary" data-act="next">${r.i+1<r.qs.length?"Next question":"See results"}</button></div>`;}
  return h+"</div>";
}
function fmt(x){return (Math.round(x*2)/2).toString();}
function setRes(score,extra){const r=S.run,q=r.qs[r.i];r.res[r.i]=Object.assign({score:score,max:TM[q.t].m},extra||{});render();}
function evalResult(){
  const r=S.run;let sc=0,mx=0;const by={};
  r.qs.forEach((q,i)=>{const x=r.res[i]||{score:0,max:TM[q.t].m};sc+=x.score;mx+=x.max;const b=by[q.t]||(by[q.t]={s:0,m:0,n:0});b.s+=x.score;b.m+=x.max;b.n++;});
  const pct=Math.round(sc/mx*100);
  const msg=pct>=85?"Exam ready on this material.":pct>=65?"Solid. Revisit the misses below.":pct>=40?"Getting there. Use the Learn section on the weak topics.":"Go back to the recall cards, then try again.";
  let h=`<div class="panel"><div class="lab">Result</div><div class="score">${fmt(sc)} / ${mx} <span style="font-size:1.5rem;color:var(--muted)">${pct}%</span></div><p>${msg}</p><div style="display:flex;flex-direction:column;gap:10px">`;
  TYPES.forEach(t=>{const b=by[t.k];if(!b)return;const p=Math.round(b.s/b.m*100);h+=`<div><div class="row" style="justify-content:space-between"><span>${esc(t.n)} (${b.n})</span><b>${fmt(b.s)}/${b.m}</b></div><div class="bar"><i style="width:${p}%"></i></div></div>`;});
  const missed=r.qs.filter((q,i)=>(r.res[i]||{score:0}).score<TM[q.t].m).length;
  h+=`</div><div class="row">${missed?`<button class="btn primary" data-act="retry">Retry the ${missed} missed</button>`:""}<button class="btn" data-act="newtest">New test</button></div></div>`;
  h+="<h2>Review</h2>";
  r.qs.forEach((q,i)=>{const x=r.res[i]||{score:0,max:TM[q.t].m};const ok=x.score>=x.max;
    let ans=q.t==="mcq"?q.opts[q.a]:q.t==="tf"?(q.a?"True":"False"):q.model;
    h+=`<div class="rev ${ok?"ok":"bad"}"><div class="lab">${esc(TM[q.t].n)} · ${fmt(x.score)}/${x.max}</div><b>${esc(q.q)}</b>${x.resp?`<div class="r">You: ${esc(x.resp)}</div>`:""}<div class="r">${ok?"":"Answer: "}${esc(ans)}</div></div>`;});
  return '<div style="display:flex;flex-direction:column;gap:14px">'+h+"</div>";
}
function finishRun(){
  const r=S.run;let sc=0,mx=0;r.qs.forEach((q,i)=>{const x=r.res[i]||{score:0,max:TM[q.t].m};sc+=x.score;mx+=x.max;});
  if(!r.retry){store.hist.unshift({d:new Date().toLocaleDateString(undefined,{day:"numeric",month:"short"}),pct:Math.round(sc/mx*100),n:r.qs.length});store.hist=store.hist.slice(0,8);save();}
  S.ev.view="result";
}

/* ============ EVENTS ============ */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");if(!el)return;
  const a=el.dataset.act,v=el.dataset.v;
  switch(a){
    case "tab":S.tab=v;render();break;
    case "lv":S.lv=v;render();break;
    case "csec":S.cards.sec=+v;buildQueue();render();break;
    case "flip":S.cards.flip=true;render();break;
    case "cnext":buildQueue();render();break;
    case "creset":CARDS.forEach((k,i)=>{if(S.cards.sec<0||k[0]===S.cards.sec)delete store.box[i];});save();buildQueue();render();break;
    case "rate":{const q=S.cards.queue,id=q.shift();let b=store.box[id]||0;
      if(v==="miss"){b=1;q.splice(Math.min(3,q.length),0,id);}
      else if(v==="almost"){b=Math.max(b,1);q.push(id);}
      else{b=b<2?2:3;S.cards.done++;}
      store.box[id]=b;save();S.cards.flip=false;S.cards.guess="";render();break;}
    case "cord":S.cards.ordered=v==="1";buildQueue();render();break;
    case "pstep":openStep(+v);break;
    case "pback":S.path.step=null;render();window.scrollTo(0,0);break;
    case "pnotes":S.path.ph="primer";render();window.scrollTo(0,0);break;
    case "pstart":S.path.ph="learn";S.path.i=0;render();break;
    case "plback":if(S.path.i>0)S.path.i--;render();break;
    case "plnext":{const P=S.path,ids=stepChunks(STEPS[P.step])[P.ch];
      if(P.i+1<ids.length)P.i++;else{P.ph="recall";P.q=shuffle(ids.slice());P.flip=false;P.guess="";}
      render();break;}
    case "pflip":S.path.flip=true;render();break;
    case "prate":{const P=S.path;applyRate(P.q,v);P.flip=false;P.guess="";
      if(!P.q.length){store.path.ch[P.step]=P.ch+1;save();P.ph="roundend";}
      render();break;}
    case "pnext":{const P=S.path,N=stepChunks(STEPS[P.step]).length;
      if(P.ch+1<N){P.ch++;P.ph="learn";P.i=0;}else P.ph="gaps";
      render();window.scrollTo(0,0);break;}
    case "pdump":S.path.ph="dump";render();window.scrollTo(0,0);break;
    case "pcheck":{const t=$("#ptext");if(t)S.path.text=t.value;S.path.dchecked=true;render();break;}
    case "pfinish":store.path.done[S.path.step]=true;save();S.path.ph="done";render();window.scrollTo(0,0);break;
    case "pnextstep":openStep(S.path.step+1);break;
    case "blank":el.classList.toggle("on");break;
    case "revall":document.querySelectorAll(".blank").forEach(b=>b.classList.add("on"));break;
    case "hideall":document.querySelectorAll(".blank").forEach(b=>b.classList.remove("on"));break;
    case "mask":if(el.classList.contains("hid")){el.classList.remove("hid");el.removeAttribute("role");}break;
    case "tmode":S.tmode[el.dataset.t]=v;render();break;
    case "dtopic":S.dump={i:+v,text:"",checked:false,ticks:{}};render();break;
    case "dcheck":S.dump.checked=true;render();break;
    case "dreset":S.dump.checked=false;S.dump.ticks={};S.dump.text="";render();break;
    case "estart":{const pool=shuffle(BANK.filter(b=>S.ev.types[b.t]));const list=S.ev.n?pool.slice(0,S.ev.n):pool;
      list.sort((x,y)=>TYPES.findIndex(t=>t.k===x.t)-TYPES.findIndex(t=>t.k===y.t));startRun(list);break;}
    case "mcq":{const r=S.run,q=r.qs[r.i],i=+el.dataset.i;setRes(q.o[i].c?1:0,{pick:i,resp:q.o[i].t});break;}
    case "tf":{const r=S.run,q=r.qs[r.i],p=v==="true";setRes(p===q.a?1:0,{pick:p,resp:p?"True":"False"});break;}
    case "check":doCheck();break;
    case "override":{const r=S.run;r.res[r.i].score=TM[r.qs[r.i].t].m;render();break;}
    case "reveal":{const r=S.run;r.text[r.i]=$("#wtext").value;r.stage[r.i]=1;render();break;}
    case "wsave":{const r=S.run,q=r.qs[r.i],tk=r.ticks[r.i]||{};const got=q.pts.filter((_,i)=>tk[i]).length;setRes(Math.round(got/q.pts.length*TM[q.t].m*2)/2,{resp:r.text[r.i]||""});break;}
    case "next":{const r=S.run;if(r.i+1<r.qs.length){r.i++;render();window.scrollTo(0,0);}else{finishRun();render();window.scrollTo(0,0);}break;}
    case "retry":{const r=S.run;const list=r.qs.filter((q,i)=>(r.res[i]||{score:0}).score<TM[q.t].m);startRun(list);S.run.retry=true;break;}
    case "newtest":S.ev.view="setup";S.run=null;render();break;
    default:labClick(a,el,v);
  }
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.dataset.lsel){labSelect(el);return;}
  if(el.dataset.act==="etype"){S.ev.types[el.dataset.v]=el.checked?1:0;render();}
  else if(el.id==="en"){S.ev.n=+el.value;}
  else if(el.dataset.act==="ptick"){S.path.ticks[el.dataset.i]=el.checked;render();}
  else if(el.dataset.act==="dtick"){S.dump.ticks[el.dataset.i]=el.checked;render();}
  else if(el.dataset.act==="wtick"){const r=S.run;r.ticks[r.i]=r.ticks[r.i]||{};r.ticks[r.i][el.dataset.i]=el.checked;render();}
});
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.dataset&&el.dataset.cid){CS.src[el.dataset.cid]=el.value;return;}
  if(el.dataset&&el.dataset.iid){CS.inp[el.dataset.iid]=el.value;return;}
  if(el.dataset&&(el.dataset.lin||el.dataset.tcell!==undefined)){labInput(el);return;}
  if(el.id==="guess")S.cards.guess=el.value;
  else if(el.id==="pguess")S.path.guess=el.value;
  else if(el.id==="ptext")S.path.text=el.value;
  else if(el.id==="dtext")S.dump.text=el.value;
  else if(el.id==="ans"&&S.run)S.run.text[S.run.i]=el.value;
});
function doCheck(){
  const r=S.run,q=r.qs[r.i],v=($("#ans").value||"").trim();if(!v)return;
  r.text[r.i]=v;setRes((q.t==="calc"?matchCalc(v,q):matches(v,q.acc,q.all))?TM[q.t].m:0,{resp:v});
}
document.addEventListener("keydown",e=>{
  const t=e.target,tag=t.tagName;
  if(e.key==="Enter"&&t.id==="ans"){e.preventDefault();doCheck();return;}
  if(t.classList&&t.classList.contains("codearea")){
    if(e.key==="Tab"&&!e.shiftKey){e.preventDefault();const p=t.selectionStart;t.setRangeText("    ",p,t.selectionEnd,"end");CS.src[t.dataset.cid]=t.value;return;}
    if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)){e.preventDefault();const b=t.closest(".cw").parentElement.querySelector('[data-act="crun"],[data-act="fcheck"]');if(b)b.click();return;}
  }
  if(e.key==="Enter"&&t.id==="pguess2"){e.preventDefault();const b=document.querySelector('[data-act="pcheck2"]');if(b&&!b.disabled)b.click();return;}
  if((e.key==="Enter"||e.key===" ")&&t.classList&&t.classList.contains("hid")){e.preventDefault();t.click();return;}
  const inPath=S.tab==="learn"&&S.lv==="path"&&S.path.ph==="recall"&&S.path.q.length>0;
  const inCards=S.tab==="learn"&&S.lv==="cards"&&S.cards.queue.length>0;
  if(!(inPath||inCards)||tag==="INPUT"||tag==="TEXTAREA"||tag==="SELECT")return;
  const flipped=inPath?S.path.flip:S.cards.flip;
  if((e.key===" "||e.key==="Enter")&&tag!=="BUTTON"&&!flipped){e.preventDefault();if(inPath)S.path.flip=true;else S.cards.flip=true;render();}
  else if(flipped&&"123".includes(e.key)&&e.key){const m={"1":"miss","2":"almost","3":"got"};const b=document.querySelector('[data-act$="rate"][data-v="'+m[e.key]+'"]');if(b)b.click();}
});
render();
</script>

</body></html>
