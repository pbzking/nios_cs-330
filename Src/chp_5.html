const NOTES=[
["1.1 Data communication","{{Data communication}} is the transfer of data, in digital or analog form, from one device to another over a communication channel. Effective communication requires {{delivery}}, {{accuracy}}, {{timeliness}} and {{security}}. It has five components: {{sender}}, {{receiver}}, {{message}}, transmission {{medium}} and {{protocol}}. An {{analog}} signal varies continuously; a {{digital}} signal takes discrete values, almost always two, and tolerates noise better. A {{modem}} converts between them. A {{checksum}} sums the data and sends the sum; a {{CRC}} sends the remainder of a division by a generator polynomial and catches burst errors. Detection is not {{correction}}: the usual response is retransmission."],
["1.2 Communication modes","In {{simplex}} mode data flows in one fixed direction only (television broadcast). In {{half duplex}} mode data flows both ways but one direction at a time (walkie-talkie). In {{full duplex}} mode data flows both ways simultaneously (telephone). {{CSMA/CD}} detects collisions on wired shared media; {{CSMA/CA}} avoids them on wireless media, where a station cannot detect a collision while {{transmitting}}."],
["1.3 Transmission media","{{Guided}} media follow a physical conductor; {{unguided}} media use air or space. Twisted pair is twisted to cancel {{EMI}} and {{crosstalk}}; {{UTP}} is the standard for office Ethernet and {{STP}} adds a shield. {{Coaxial}} cable is used for cable television. {{Optical fibre}} carries pulses of light by {{total internal reflection}}, is immune to EMI, and is limited chiefly by cost. {{Single-mode}} fibre has a small core and carries signals for tens of kilometres; {{multimode}} fibre is limited by {{modal dispersion}}. The 2.4 GHz Wi-Fi band has better range; the {{5 GHz}} band has higher rates. Wi-Fi 4 introduced {{MIMO}}; Wi-Fi 6 uses {{OFDMA}}."],
["1.4 Network devices","A {{NIC}} connects a computer to the network and has a 48-bit {{MAC}} address. A {{hub}} floods every port and shares one collision domain. A {{switch}} learns MAC addresses into a {{MAC address table}} and forwards frames only to the right port. A {{router}} works at Layer {{3}}, uses IP addresses and a {{routing table}}, and performs {{NAT}}. A {{gateway}} translates between different protocols. A {{bridge}} filters traffic between two segments by MAC address. A {{repeater}} regenerates an attenuated signal. A {{modem}} modulates and demodulates; an {{access point}} connects Wi-Fi devices to the wired network."],
["1.5 Computer networks","A {{PAN}} covers about 10 metres (Bluetooth). A {{LAN}} covers a room to a campus, up to about 1 km, and is privately owned; {{Ethernet}} (IEEE 802.3) is its dominant wired technology. A {{MAN}} covers a city, 5 to 50 km. A {{WAN}} spans countries and continents; the {{Internet}} is the largest. A {{SAN}} connects servers to shared storage. A {{VPN}} is an encrypted tunnel across a public network; it is a security technique, not a topology."],
["1.6 Network topologies","A {{topology}} is the arrangement of nodes and links. In a {{bus}}, all devices share one backbone with a {{terminator}} at each end. In a {{star}}, every device connects to a central switch; if the centre fails the whole network fails. A {{ring}} is a closed loop using {{token passing}}. A {{mesh}} has redundant paths; a full mesh of n devices needs {{n(n-1)/2}} links. A {{tree}} joins star networks in a hierarchy. {{Physical}} topology is the real layout; {{logical}} topology is how data flows."],
["1.7 Network models","The {{OSI}} model has {{seven}} layers: Physical, Data Link, Network, Transport, Session, Presentation, Application. The {{TCP/IP}} model has {{four}} layers and is what the internet actually runs. Going down, each layer adds a header: this is {{encapsulation}}; the data units are data, {{segment}}, {{packet}}, {{frame}} and bits. A {{MAC}} address is Layer 2; an {{IP}} address is Layer 3. In the {{client-server}} model dedicated servers provide services and the server is a single point of failure; in {{peer-to-peer}} every device is both client and server."],
["1.8 Network protocols","A {{protocol}} is a formal set of rules governing communication. {{IP}} gives logical addressing and best-effort routing; {{IPv4}} uses 32-bit addresses and {{IPv6}} uses 128-bit addresses. {{TCP}} is connection-oriented with a three-way handshake of {{SYN}}, SYN-ACK and {{ACK}}; {{UDP}} is connectionless and faster. {{HTTP}} is stateless; {{HTTPS}} adds TLS. {{FTP}} uses a control and a data connection. {{SMTP}} sends mail, {{POP3}} downloads and removes it, and {{IMAP}} synchronises it. {{DNS}} translates domain names into IP addresses."],
["1.9 Network performance","{{Bandwidth}} is the theoretical maximum capacity of a channel. {{Data transfer rate}} (throughput) is the actual rate achieved and can never exceed bandwidth. {{Latency}} is the delay before data arrives, measured as round-trip time in {{milliseconds}} with ping. A video call is {{latency}}-sensitive; a large download is {{bandwidth}}-sensitive. A {{checksum}} is used in TCP/IP headers and a {{CRC}} is in the Ethernet frame trailer."]
];

const CORE=[
[0,"Define data communication.","The process of transferring data, in digital or analog form, from one device to another over a communication channel or medium; the goal is to transmit it accurately, efficiently and securely."],
[0,"What are the four criteria of effective data communication?","Delivery to the correct destination; accuracy (arrival without corruption); timeliness (arrival within an acceptable delay); security (protection from interception, unauthorised access or tampering)."],
[0,"Name the five components of data communication.","Sender, receiver, message, transmission medium and protocol."],
[0,"Why is the protocol emphasised among the five components?","Without a shared protocol two devices cannot communicate meaningfully even when physically connected. Protocols define packet format, addressing, connection set-up and termination, error detection and correction, flow control and retry procedures. It is the component students most often omit."],
[0,"Define an analog signal.","A signal that varies continuously, taking any value within a range, like a smooth wave; for example the signal from a traditional telephone handset."],
[0,"Define a digital signal.","A signal that takes only a fixed, discrete set of values, almost always two (high voltage = 1, low voltage = 0), appearing as abrupt steps."],
[0,"Why are modern networks overwhelmingly digital?","A receiver only has to decide whether a pulse is high or low, which is far more forgiving than reconstructing an exact continuous value, so digital signals tolerate noise, degradation and amplification better."],
[0,"What is the function of a parity bit?","The simplest error-detection scheme: it detects a single flipped bit in a small group but cannot locate it and fails if two bits flip together."],
[0,"Define a checksum.","A method that treats a block of data as numbers, adds them with a defined overflow rule and transmits the sum with the data; the receiver repeats the calculation and a mismatch signals an error. Simple, but can miss multiple errors that cancel out."],
[0,"Define CRC.","Cyclic Redundancy Check: the data is treated as a long binary number and divided by an agreed generator polynomial; the remainder is transmitted with the data and the receiver checks it. Far more effective than a checksum, especially for burst errors; used in Ethernet, Wi-Fi and storage."],
[0,"What is a burst error?","An error in which several consecutive bits are corrupted together, as from a brief burst of electrical interference; CRC detects most of them."],
[0,"Distinguish error detection from error correction.","Parity, checksum and CRC only detect that an error occurred; none can say which bit is wrong or repair it, so the data is usually discarded and retransmission requested (typically by TCP). Forward error correction reconstructs data without retransmission but needs much more redundancy, used for deep-space or live broadcast."],
[1,"What is a communication mode?","The direction in which data can flow between a sender and a receiver over a channel. There are three: simplex, half duplex and full duplex."],
[1,"Define simplex mode and give examples.","Data flows in one fixed direction only, from sender to receiver; the receiver cannot reply on the same channel. Examples: television broadcast, AM/FM radio, public address systems, weather sensors, keyboard to computer."],
[1,"What are the advantage and limitation of simplex?","Advantage: simplicity and efficiency, as the whole capacity serves one direction. Limitation: no feedback at all."],
[1,"Define half duplex mode and give examples.","Data flows in both directions but only one at a time; the other party must wait and listen. Examples: walkie-talkie, CB radio, early wireless LANs."],
[1,"Define full duplex mode and give examples.","Data flows in both directions simultaneously, with no turn-taking. Examples: telephone call, mobile phones, video conferencing, most modern networks."],
[1,"How is full duplex achieved?","Either with two separate physical channels, or with a single channel carrying both directions at once through frequency division (separate frequency bands) or echo cancellation."],
[1,"What is CSMA/CD?","Carrier Sense Multiple Access with Collision Detection: used on wired shared media; stations listen before sending and detect collisions while transmitting, then stop and retry after a random wait."],
[1,"What is CSMA/CA?","Carrier Sense Multiple Access with Collision Avoidance: used on wireless media; stations avoid collisions by listening first and waiting before sending, because a wireless station cannot detect a collision while transmitting."],
[1,"Why can CSMA/CD not be used on a wireless network?","A wireless station cannot detect collisions while it is transmitting, so detection is impossible; wireless networks avoid collisions with CSMA/CA instead."],
[2,"What are transmission media?","The physical pathways through which data travels between nodes. The choice sets maximum speed, distance before degradation, susceptibility to EMI, security, ease of installation and cost."],
[2,"Distinguish guided and unguided media.","Guided (wired) media: the signal follows a physical conductor (twisted pair, coaxial, optical fibre). Unguided (wireless) media: signals propagate through air or space as electromagnetic waves."],
[2,"What is twisted pair cable?","The oldest and most widely used guided medium: pairs of insulated copper wires twisted helically along the cable."],
[2,"Why are the wires of twisted pair twisted?","Parallel wires' magnetic fields cause electromagnetic interference (EMI) and crosstalk (signal leakage between pairs); twisting makes the fields cancel over each twist cycle."],
[2,"Distinguish UTP and STP.","UTP (unshielded twisted pair) has only the twisting and is standard for home and office Ethernet. STP (shielded) adds a metallic foil or braid shield for greater EMI reduction at higher cost and lower flexibility, used near industrial equipment."],
[2,"What is coaxial cable?","A cable with a central copper conductor, an insulating dielectric, a tubular metallic braid or foil shield and an outer plastic jacket, all on the same axis; excellent shielding for high-frequency signals over longer distances."],
[2,"Where is coaxial cable used?","Early Ethernet (10BASE5 Thick, 10BASE2 Thin); today mainly cable television (CATV) and broadband internet to homes."],
[2,"What is optical fibre and how does it work?","Strands of glass or plastic thinner than a hair carrying data as pulses of light by total internal reflection: light entering at a shallow enough angle is trapped, reflecting off the inner surface."],
[2,"State the advantages of optical fibre.","Essentially limitless bandwidth (terabits per second per strand); signals travel tens of kilometres without much attenuation; immune to EMI and crosstalk; more secure because it does not radiate and tapping causes detectable loss."],
[2,"State the disadvantages of optical fibre.","Higher cost and greater skill and specialised equipment for installation and splicing."],
[2,"Distinguish multimode and single-mode fibre.","Multimode: larger core, light takes many paths, LED sources, cheaper, a few kilometres, limited by modal dispersion. Single-mode: very small core, one mode, no modal dispersion, tens or hundreds of kilometres; used for long-distance, undersea and backbone links."],
[2,"What is modal dispersion?","Different modes in multimode fibre arriving at slightly different times, spreading the signal and limiting distance."],
[2,"What are wireless media?","Media carrying data as electromagnetic waves through air or space; they offer mobility but suffer interference, security exposure and generally lower data rates than fibre."],
[2,"Compare the 2.4 GHz and 5 GHz Wi-Fi bands.","2.4 GHz: good range and wall penetration, but interference from microwave ovens, Bluetooth and cordless phones. 5 GHz: higher rates and less interference at reduced range and weaker wall penetration."],
[2,"What do terrestrial microwave systems need?","Directional dish antennas on towers with an unobstructed line of sight, since microwaves cannot penetrate solid obstacles."],
[2,"Why were Wi-Fi standards given generation numbers?","To make the earlier names (802.11b/g/n/ac/ax) easier for consumers: Wi-Fi 4 (802.11n), 5 (802.11ac), 6 (802.11ax), 6E (802.11ax in 6 GHz). Rate increases come from wider channels, MIMO and smarter airtime sharing."],
[2,"How should twisted pair, coaxial and fibre be compared in an answer?","On cost, speed, distance and EMI immunity together, stating the trade-off: fibre wins on speed, distance and EMI immunity but loses on cost and installation difficulty."],
[3,"What are network devices?","Physical components connecting computers and other devices into a network, managing the flow of data."],
[3,"What is a NIC?","Network Interface Card (network adapter): hardware, built in or an expansion card or USB adapter, that physically connects a computer to a wired or wireless medium and converts between the internal bus format and the signals of the medium."],
[3,"What is a MAC address?","Media Access Control address: a globally unique 48-bit hardware identifier burned into a NIC at manufacture, written as six pairs of hexadecimal digits (00:1A:2B:3C:4D:5E); the first three pairs identify the manufacturer. A laptop with wired and wireless NICs has two."],
[3,"What is a hub and why is it obsolete?","The simplest connectivity device: it rebroadcasts any signal out of every other port, with no intelligence. Every device receives every packet, wasting bandwidth, and all share one collision domain. Switches replaced hubs."],
[3,"What is a switch and how does it forward?","The standard LAN device: it learns which device is on which port from the source MAC addresses of arriving frames (MAC or CAM table) and forwards a frame only to the port of the destination MAC address (unicast forwarding)."],
[3,"Why does a switch outperform a hub?","It cuts unnecessary traffic, gives each communicating pair effectively dedicated bandwidth, and each port is its own collision domain, eliminating collisions in full duplex."],
[3,"What is a router?","A Layer 3 device connecting two or more different networks and routing packets between them using destination IP addresses and a routing table."],
[3,"What is NAT?","Network Address Translation, performed by routers: it lets many devices on a private network share one public IP address."],
[3,"What is a wireless access point?","A device letting Wi-Fi devices connect to a wired network by transmitting data from the wired network wirelessly and forwarding wireless transmissions onto the wired network. Its radio spectrum is shared, so per-device throughput falls as devices join."],
[3,"What is roaming?","Moving between access points in a large installation without interrupting the connection."],
[3,"What is a bridge?","A Layer 2 device connecting two or more network segments and filtering traffic by MAC address: a frame for the same segment is filtered out; one for another segment is forwarded. Now built into every switch, which is a multiport bridge."],
[3,"What is a repeater?","A device that regenerates and amplifies signals weakened by attenuation, extending beyond the 100 m limit of twisted pair. It works at the physical level and amplifies noise as well."],
[3,"What is a gateway?","An entry and exit point between networks using different protocols, data formats or architectures, translating between them. Examples: email gateway, VoIP gateway converting PSTN calls to IP packets."],
[3,"Distinguish a router and a gateway.","A router connects networks sharing the same fundamental protocol (typically IP) and forwards by IP address; a gateway connects fundamentally different networks and translates between formats. The home router as default gateway is a configuration term."],
[3,"What is a modem?","Modulator-demodulator: converts digital data to a form suitable for an analog medium (modulation) and incoming analog signals back to digital (demodulation)."],
[3,"Give the modem types and speeds.","Dial-up: up to 56 Kbps and ties up the phone line. DSL: more sophisticated modulation over telephone copper, megabit speeds. Cable: over coaxial TV infrastructure, higher speeds. The ISP box on fibre is loosely called a modem."],
[3,"Which two questions about devices are reliably asked?","At which OSI layer does the device operate, and how does it decide where to forward data; both are answered by the Table 1.5 columns."],
[4,"Define a computer network.","A collection of two or more computers and other devices connected by wired or wireless links and governed by protocols, to share data, resources and services."],
[4,"Why are networks classified by geographic coverage?","Scale shapes technologies, achievable speeds, cost and administrative complexity."],
[4,"Define a PAN.","Personal Area Network: the smallest network, around an individual, within about 10 metres, almost always wireless (Bluetooth, Zigbee, infrared). Example: phone with wireless earbuds. Wired PANs exist (USB)."],
[4,"Define a LAN.","Local Area Network: a room, floor, building or campus, a few metres to about 1 km; high speed (100 Mbps to 10 Gbps), low latency, privately owned. Ethernet (IEEE 802.3) and Wi-Fi (IEEE 802.11) are its technologies."],
[4,"Define a MAN.","Metropolitan Area Network: larger than a LAN but within one city, 5 to 50 km, interconnecting LANs; often optical fibre; examples: city bank branches, cable TV broadband; WiMAX for wireless MANs."],
[4,"Define a WAN.","Wide Area Network: regions, countries, continents or the globe, using telecom leased lines, satellite, microwave and fibre; not owned by one organisation; lower speed and higher latency than a LAN, and costlier. The Internet is the largest WAN."],
[4,"What is WiMAX?","Worldwide Interoperability for Microwave Access: a wireless technology used to build wireless MANs at city scale."],
[4,"What is a SAN?","Storage Area Network: a dedicated high-speed network connecting servers to shared storage devices, keeping storage traffic apart from ordinary LAN traffic; standard in data centres."],
[4,"What is a VPN and is it a network type?","Virtual Private Network: an encrypted logical tunnel across a public network, so traffic is protected as if on a private cable. It is a security technique, not a scale category and not a topology; it lets a remote employee reach the company LAN securely."],
[4,"How is a distance classified as PAN, LAN, MAN or WAN?","PAN stops at about 10 m; anything crossing between cities or countries is a WAN; a MAN stays within one metropolitan area (a big area alone is not enough)."],
[5,"Define network topology.","The arrangement or layout describing how devices (nodes) and connections (links) are organised in a network."],
[5,"Distinguish physical and logical topology.","Physical: the actual layout of cables and devices. Logical: how data actually flows, which can differ; a physical star can behave logically like a bus."],
[5,"Describe bus topology.","All devices connect to a single backbone cable that carries all traffic; each device receives every signal but accepts only its own; terminators at both ends absorb the signal to prevent reflection."],
[5,"Give the advantages and disadvantages of bus topology.","Advantages: simple, low cost, easy to extend. Disadvantages: the whole network fails if the backbone breaks; performance falls as devices are added; faults are hard to diagnose. Largely superseded."],
[5,"Describe star topology.","Every device connects individually to a central switch or hub, which forwards data to its destination; the dominant LAN topology."],
[5,"Give the advantages and disadvantages of star topology.","Advantages: one failed cable or device affects only itself; easy to add or remove devices; easy monitoring and diagnosis. Disadvantages: if the central device fails the whole network goes down; more cabling than bus."],
[5,"Describe ring topology.","Each device connects to exactly two neighbours in a closed loop; data travels around, usually in one direction. Token passing: only the device holding the circulating token may transmit, avoiding collisions."],
[5,"Give the advantages and disadvantages of ring topology.","Advantages: no central bottleneck; no collisions; fair and efficient under heavy predictable load. Disadvantage: one broken link or failed device can disrupt the ring unless dual-ring redundancy (double cabling) is built in."],
[5,"Describe mesh topology.","Devices connect to multiple others for redundant paths. Full mesh: every device to every other. Partial mesh: some devices to several others."],
[5,"Give the advantages, disadvantages and uses of mesh.","Advantage: excellent fault tolerance, no single point of failure. Disadvantage: very high cost and complexity. Uses: core internet backbone, military and emergency networks, consumer mesh Wi-Fi (partial mesh)."],
[5,"State the formula for the links in a full mesh.","n(n-1)/2 for n devices. Example: 6 devices need 6 x 5 / 2 = 15 links, against only 6 for a star."],
[5,"Describe tree topology.","Also hierarchical topology: several star networks joined through a central backbone, like an organisation chart: a root node connects to secondary nodes which connect to further nodes."],
[5,"Give the advantages and disadvantages of tree topology.","Advantage: scalable; each branch is easy to manage and isolate. Disadvantage: failure of a node partway up disconnects everything beneath it. Used in corporate networks and cable TV distribution."],
[5,"On which three axes should topologies be compared?","Fault tolerance, cost and scalability. The star's central point of failure and the mesh's n(n-1)/2 cabling cost are tested most often."],
[6,"Why use a layered network model?","It splits an unmanageable problem into smaller independent ones, each handled by one layer with a defined interface to its neighbours; a layer need only know the layers directly above and below, so a layer can change (Ethernet for Wi-Fi, IPv4 for IPv6) without redesigning the internet."],
[6,"What is the OSI model?","Open Systems Interconnection: published by the International Organization for Standardization in 1984, dividing communication into seven layers; a vendor-neutral reference and common vocabulary rather than a directly implemented protocol suite."],
[6,"List the seven OSI layers from top to bottom.","7 Application, 6 Presentation, 5 Session, 4 Transport, 3 Network, 2 Data Link, 1 Physical."],
[6,"What are the memory aids for the OSI layers?","Layer 7 to 1: All People Seem To Need Data Processing. Layer 1 to 7: Please Do Not Throw Sausage Pizza Away."],
[6,"State the function of the Application layer.","Provides network services directly to user applications. Examples: HTTP, FTP, SMTP, DNS."],
[6,"State the function of the Presentation layer.","Translates, encrypts and compresses data between application and network formats. Examples: SSL/TLS, JPEG, ASCII/Unicode."],
[6,"State the function of the Session layer.","Establishes, manages and terminates sessions (dialogues) between applications. Examples: session tokens, login sessions."],
[6,"State the function of the Transport layer.","End-to-end delivery between hosts: segmentation, flow control, error recovery. Data unit: segment. Examples: TCP, UDP; port numbers."],
[6,"State the function of the Network layer.","Logical addressing and routing of packets across multiple networks. Data unit: packet. Examples: IP, routers."],
[6,"State the function of the Data Link layer.","Physical (MAC) addressing and reliable transfer across one direct link; organises bits into frames. Examples: Ethernet, switches, Wi-Fi MAC sublayer."],
[6,"State the function of the Physical layer.","Transmission of raw bits as electrical, optical or radio signals. Examples: cables, connectors, hubs, repeaters."],
[6,"What is the common MAC/IP layer pitfall?","Placing IP at Layer 2 and MAC at Layer 3: the reverse of the truth. MAC is physical, burned into a NIC, used for the next hop (Layer 2). IP is logical, software-assigned, used for routing to the final destination (Layer 3)."],
[6,"What happens to the IP and MAC addresses as a packet crosses the internet?","The IP address never changes; the MAC address in the frame header changes at every hop."],
[6,"What is the TCP/IP model?","The four-layer model the real internet implements, developed by the US Department of Defense's ARPANET project and predating OSI: Application, Transport, Internet and Network Access."],
[6,"How does TCP/IP map to OSI?","TCP/IP Application = OSI 5 to 7 (HTTP, HTTPS, FTP, SMTP, DNS, Telnet); Transport = 4 (TCP, UDP); Internet = 3 (IP, ICMP, ARP); Network Access = 1 and 2 (Ethernet, Wi-Fi, PPP)."],
[6,"Define encapsulation.","At each layer going down the stack, the layer adds its own header (sometimes a trailer) with the control information it needs, wrapping data in nested envelopes."],
[6,"Give the data unit name at each layer during encapsulation.","Application data; the Transport layer's TCP or UDP header (with ports) makes a segment; the Network layer's IP header makes a packet; the Data Link layer's MAC header and trailer make a frame; the Physical layer sends bits."],
[6,"What is decapsulation?","At the receiver, each header is stripped one layer at a time going up the stack until the original application data is recovered."],
[6,"Describe the client-server model.","Clients (browsers, email apps) initiate requests; dedicated servers listen and respond, running continuously and serving many clients. Used by almost all internet services."],
[6,"Give the advantages and disadvantages of client-server.","Advantages: centralised management of data, security and backups; scalable server capacity. Disadvantages: the server is a single point of failure and can become a bottleneck."],
[6,"Describe the peer-to-peer model.","No dedicated servers: every device (peer) acts as both client and server, with no central authority. Used by BitTorrent, some cryptocurrencies and messaging systems."],
[6,"Give the advantages and disadvantages of peer-to-peer.","Advantages: no single point of failure; lower cost with no dedicated server hardware. Disadvantages: weaker central security and access control; unpredictable performance depending on peers online."],
[7,"Define a protocol.","A formal set of rules governing how devices communicate; different protocols operate at different OSI layers, each solving a distinct piece of the communication problem."],
[7,"What is TCP/IP?","The foundational protocol suite of the internet, combining IP (Network layer) and TCP (Transport layer)."],
[7,"What does IP do?","Responsible for logical addressing and routing: assigns each device an IP address and determines the path of packets. Connectionless and best-effort: no guarantee packets arrive, arrive once or arrive in order."],
[7,"Compare IPv4 and IPv6.","IPv4: 32-bit addresses in four decimal octets (192.168.1.1), about 4.3 billion, exhausted. IPv6: 128-bit addresses in hexadecimal groups (2001:0db8:85a3::8a2e:0370:7334), astronomically larger, adopted progressively alongside IPv4."],
[7,"What does TCP do?","Reliable, ordered delivery on top of IP: connection-oriented with a three-way handshake; numbers every segment, acknowledges receipt, retransmits losses, reassembles out-of-order segments and applies flow control."],
[7,"State the three steps of the TCP three-way handshake.","SYN, then SYN-ACK, then ACK, establishing the session."],
[7,"What is UDP and when is it preferred?","User Datagram Protocol: connectionless, no handshake, acknowledgement, retransmission or ordering. Preferred where speed matters more than completeness: live video calls, online gaming, DNS lookups."],
[7,"When is TCP the right choice and when is UDP?","TCP wherever every byte must arrive intact (file transfer, web pages, email); UDP wherever speed matters more than completeness."],
[7,"What is HTTP?","HyperText Transfer Protocol: Application-layer protocol for web browsers and servers; defines how a browser requests a resource and how the server responds. Stateless: each request is independent unless cookies or session tokens add state."],
[7,"What is HTTPS?","HTTP layered over TLS/SSL encryption (Presentation layer), protecting confidentiality and integrity in transit; shown by the padlock icon; essential for passwords and payments."],
[7,"What is FTP and why does it use two connections?","File Transfer Protocol transfers files between client and server. A control connection carries commands (login, navigation, listing) and a separate data connection carries the file, so a long transfer does not block further commands."],
[7,"Why were SFTP and FTPS developed?","Plain FTP transmits credentials and data in the clear; SFTP (SSH File Transfer Protocol) and FTPS add encryption."],
[7,"What does SMTP do?","Simple Mail Transfer Protocol sends email: client to outgoing server and server to recipient's server. A push protocol that never retrieves."],
[7,"What does POP3 do?","Post Office Protocol version 3 retrieves email by downloading it to one device and by default removing it from the server; poorly suited to several devices."],
[7,"What does IMAP do?","Internet Message Access Protocol retrieves email by synchronising the client with the server mailbox; messages, folders and read status stay on the server and are mirrored on every device; the modern default."],
[7,"Distinguish SMTP, POP3 and IMAP in one clause each.","SMTP sends; POP3 downloads and removes from the server; IMAP synchronises across devices, leaving mail on the server."],
[7,"What is DNS and why is it needed?","Domain Name System: the internet's distributed directory, translating human-readable domain names into IP addresses. Humans remember names; routing at Layer 3 needs numeric IP addresses."],
[7,"Describe the DNS resolution process.","Browser and OS caches are checked; then a recursive resolver (often the ISP's) queries a root server (who handles .com), then the TLD server (who is authoritative for example.com), then the authoritative server for the IP address, and returns it to the browser."],
[7,"Does DNS use TCP or UDP?","UDP by preference: a lookup is small, speed matters, and a lost query is rarely costly to retry."],
[7,"What is DHCP?","Dynamic Host Configuration Protocol: automatically assigns IP addresses and related settings to devices joining a network, so no manual configuration is needed."],
[8,"Define bandwidth.","The theoretical maximum capacity of a channel to carry data, measured in bits per second (bps, Kbps, Mbps, Gbps); a property of the channel, an upper ceiling not a promise."],
[8,"Define data transfer rate.","Also throughput: the actual amount of data successfully transmitted over a connection in a given time; commonly below the bandwidth and never above it."],
[8,"List the causes of throughput below bandwidth.","Network congestion; protocol overhead (headers, acknowledgements); distance and latency; hardware limitations; signal interference and quality (especially wireless)."],
[8,"Define latency.","The delay before data begins to arrive, typically measured as round-trip time (RTT) in milliseconds; measured with the ping utility."],
[8,"Why can a high-bandwidth connection feel slow?","Because latency is independent of bandwidth: a satellite link may have generous bandwidth but several hundred milliseconds of latency, which hurts interactive uses such as calls, gaming and remote desktop."],
[8,"Which applications are bandwidth-sensitive and which latency-sensitive?","Bandwidth-sensitive: large downloads and video streaming after buffering. Latency-sensitive: video calls, competitive gaming, remote desktop control."],
[8,"What is jitter?","The variation in latency from packet to packet; inconsistent latency degrades call quality even when average throughput is good."],
[8,"Compare parity, checksum and CRC.","Parity: detects a single flipped bit. Checksum: sum of the data, cheap, used in TCP/IP headers, can miss cancelling errors. CRC: remainder of polynomial division, catches most errors including bursts, in the trailer of every Ethernet frame."],
[8,"Why is CRC preferred over a checksum for Ethernet?","It catches a substantially higher proportion of realistic error patterns, particularly burst errors from brief electrical interference."],
[8,"Interpret: 50 Mbps plan, 30 Mbps download, laggy video calls.","50 Mbps is bandwidth (the maximum); 30 Mbps is the data transfer rate, lowered by congestion, overhead or hardware; the laggy call points to latency, which is largely independent of throughput."],
[8,"How should a performance symptom be diagnosed?","Identify which of bandwidth, throughput and latency it points to: a stuttering call is latency; a slow download against the plan is the bandwidth/throughput gap; corrupted data is the job of checksums and CRC, not bandwidth or latency."]

const SHORT=[
["Distinguish between half duplex and full duplex communication with an example of each.","Half duplex: data flows in both directions but only one at a time; the parties alternate and simultaneous transmission causes interference; walkie-talkie. Full duplex: data flows in both directions simultaneously, using two channels or a split channel; telephone call. Full duplex gives higher effective throughput.",["Half duplex: both ways, one at a time","Full duplex: both ways at once","Example of half duplex (walkie-talkie)","Example of full duplex (telephone)"]],
["Why can CSMA/CD not be used on a wireless network?","CSMA/CD relies on a station detecting a collision while it is transmitting. A wireless station cannot detect collisions while transmitting, so collision detection is impossible. Wireless networks instead use CSMA/CA, which avoids collisions by listening first and waiting before sending.",["CSMA/CD needs detection during transmission","Wireless stations cannot detect collisions while transmitting","CSMA/CA is used instead to avoid collisions"]],
["Differentiate between guided and unguided transmission media.","Guided (wired) media carry the signal along a physical conductor: twisted pair, coaxial cable and optical fibre. Unguided (wireless) media propagate electromagnetic waves through air or space: radio waves, microwaves and infrared. Guided media are more reliable and secure; unguided offer mobility but suffer interference and lower rates.",["Guided: physical conductor","Unguided: air or space","Examples of each","A contrast in reliability or mobility"]],
["Distinguish between a hub and a switch.","A hub is a Layer 1 device that rebroadcasts any signal to every other port, so all devices share one collision domain and bandwidth is wasted. A switch is a Layer 2 device that learns MAC addresses into a table and forwards a frame only to the destination port; each port is its own collision domain. Hubs are obsolete; switches are standard.",["Hub floods all ports","Hub shares one collision domain","Switch uses a MAC address table","Switch forwards only to the destination port; each port its own collision domain"]],
["Differentiate between a router and a gateway.","A router connects networks that share the same fundamental protocol (usually IP) and forwards packets by IP address using a routing table, at Layer 3. A gateway connects networks that use different protocols, data formats or architectures and translates between them, for example a VoIP or email gateway. The home router as default gateway is only a configuration term.",["Router: same protocol, IP, Layer 3","Gateway: different protocols, translation","Example of a gateway"]],
["Distinguish between a LAN and a MAN with an example of each.","A LAN covers a limited area (room, building or campus, up to about 1 km), is privately owned and has high speed and low latency; example: an office network. A MAN covers a whole city (5 to 50 km), often on optical fibre, interconnecting LANs; example: a city cable broadband network or a bank's city branches.",["LAN up to about 1 km, private","MAN 5 to 50 km, one city","Example of a LAN","Example of a MAN"]],
["State two advantages and two disadvantages of star topology.","Advantages: a failed cable or device affects only its own connection, so the rest of the network continues; devices are easy to add or remove and faults easy to diagnose. Disadvantages: if the central switch or hub fails, the whole network goes down; it needs more cabling than a bus.",["Advantage: fault isolation","Advantage: easy to add or diagnose","Disadvantage: central point of failure","Disadvantage: more cabling"]],
["Distinguish between the OSI model and the TCP/IP model.","OSI has seven layers, was published by ISO in 1984 as a vendor-neutral reference and vocabulary, and is not directly implemented end to end. TCP/IP has four layers (Application, Transport, Internet, Network Access), came from the ARPANET project before OSI, and is what the real internet runs on; it merges OSI's top three layers into one and the bottom two into one.",["OSI seven layers; TCP/IP four","OSI reference model; TCP/IP implemented","Mapping or merging of layers"]],
["Explain the difference between a MAC address and an IP address.","A MAC address is a 48-bit physical address burned into a NIC, used at Layer 2 for the next hop across one link; it changes at every hop. An IP address is a logical, software-assigned address (32-bit IPv4 or 128-bit IPv6) used at Layer 3 for routing to the final destination; it never changes along the way.",["MAC physical, 48 bits, Layer 2","IP logical, Layer 3","MAC changes per hop; IP does not"]],
["Distinguish between TCP and UDP, giving one application suited to each.","TCP is connection-oriented (three-way handshake) and provides numbered, acknowledged, retransmitted, ordered delivery with flow control; suited to file transfer, web pages or email. UDP is connectionless with no handshake, acknowledgement or ordering, so it has lower overhead and latency; suited to live video calls, gaming or DNS.",["TCP connection-oriented and reliable","UDP connectionless and fast","Application for TCP","Application for UDP"]],
["Explain the difference between SMTP, POP3 and IMAP.","SMTP sends email from a client to its server and onward to the recipient's server. POP3 retrieves email by downloading it to one device and by default removing it from the server. IMAP retrieves email by synchronising with the mailbox on the server, so messages, folders and read status are consistent across devices and mail stays on the server.",["SMTP sends","POP3 downloads and removes","IMAP synchronises and leaves mail on the server"]],
["Distinguish between bandwidth and data transfer rate.","Bandwidth is the theoretical maximum capacity of a channel in bits per second, a ceiling set by the channel. Data transfer rate (throughput) is the actual rate of data successfully transmitted, usually lower because of congestion, protocol overhead, distance, hardware limits and interference; it can never exceed bandwidth.",["Bandwidth theoretical maximum","Throughput actual","Throughput never exceeds bandwidth","A cause of the gap"]],
["What is latency, and why can a high-bandwidth connection still feel slow?","Latency is the delay before data begins to arrive, measured as round-trip time in milliseconds (ping). It is independent of bandwidth. A satellite link can have high bandwidth but several hundred milliseconds of latency, so interactive uses such as calls and gaming feel sluggish while large downloads are fine.",["Definition of latency (delay, RTT)","Independent of bandwidth","Example such as satellite or video call"]],
["Distinguish between the client-server and peer-to-peer models.","In client-server, dedicated servers provide services to requesting clients, giving centralised management and security but a single point of failure and possible bottleneck. In peer-to-peer every device is both client and server with no central authority, giving no single point of failure and lower cost but weaker security and unpredictable performance.",["Client-server: dedicated servers","Peer-to-peer: every peer both","Advantage or disadvantage of each"]]
];
const LONG=[
["Explain the OSI seven-layer model, stating the function of each layer with one example protocol or device.","The OSI model, published by ISO in 1984, divides communication into seven layers, each solved independently with a stable interface to its neighbours. Layer 7 Application provides services to user applications (HTTP, FTP, SMTP, DNS). Layer 6 Presentation translates, encrypts and compresses data (SSL/TLS, JPEG, Unicode). Layer 5 Session establishes, manages and terminates dialogues (login sessions, session tokens). Layer 4 Transport gives end-to-end delivery, segmentation, flow control and error recovery (TCP, UDP, ports). Layer 3 Network does logical addressing and routing of packets (IP, routers). Layer 2 Data Link does MAC addressing and reliable transfer across one link, forming frames (Ethernet, switches). Layer 1 Physical transmits raw bits as signals (cables, hubs, repeaters).",["Layered model published by ISO, seven layers","Application and Presentation functions with examples","Session and Transport functions with examples","Network and Data Link functions with examples","Physical function with example","Correct order of layers"]],
["Describe encapsulation, explaining the name given to data at each layer as it moves from the application down to the physical medium.","Encapsulation is the process by which each layer, going down the stack, adds its own header (and sometimes a trailer) with the control information it needs, nesting the data in successive envelopes. Application data becomes a segment when the Transport layer adds a TCP or UDP header with port numbers. The segment becomes a packet when the Network layer adds an IP header with source and destination IP addresses. The packet becomes a frame when the Data Link layer adds a MAC header and a trailer (with the CRC) carrying MAC addresses. The Physical layer sends the frame as a stream of bits. At the receiver decapsulation strips each header going up until the original data is recovered.",["Definition: header added at each layer","Segment at Transport with ports","Packet at Network with IP addresses","Frame at Data Link with MAC header and trailer","Bits at Physical","Decapsulation at the receiver"]],
["Compare bus, star, ring, mesh and tree topologies on fault tolerance, cost and scalability.","Bus: all devices on one backbone; very poor fault tolerance (a backbone break fails everything), very low cost, poor scalability. Star: devices connect to a central switch; good fault isolation except for the central node, moderate cost, good scalability; dominant in modern LANs. Ring: a closed loop with token passing; poor fault tolerance unless dual-ring, moderate cost, moderate scalability. Mesh: redundant paths; excellent fault tolerance, very high cost (n(n-1)/2 links for full mesh), poor scalability for full mesh. Tree: stars joined in a hierarchy; moderate, branch-dependent fault tolerance, moderate to high cost, excellent scalability.",["Bus compared on all three","Star compared","Ring compared","Mesh with the formula","Tree compared","Uses a consistent structure or table"]],
["Explain the working of CSMA/CD and CSMA/CA, and explain why they differ.","Both are carrier-sense multiple-access methods: a station listens to the shared medium and transmits only when it is idle. CSMA/CD (collision detection) is used on wired shared media such as early Ethernet; the station keeps listening while it transmits, detects a collision, stops, and retries after a random wait. CSMA/CA (collision avoidance) is used on wireless media; a station cannot detect a collision while transmitting, so it avoids them by listening first and waiting a random time before sending. They differ because a wired station can listen while sending but a wireless station cannot.",["Carrier sense and shared medium","CSMA/CD detects collisions on wired media","Stop and retry after random wait","CSMA/CA avoids collisions on wireless media","Reason: wireless cannot detect while transmitting"]],
["Describe the guided transmission media (twisted pair, coaxial, optical fibre), comparing them on cost, speed and typical use.","Twisted pair: insulated copper pairs twisted to cancel EMI and crosstalk; UTP is standard for home and office Ethernet, STP is shielded for industrial areas; inexpensive and easy to install; Cat 5e gives 1 Gbps to 100 m, Cat 6a and 7 give 10 Gbps; indoor wiring. Coaxial: central conductor, dielectric, braided shield and jacket on one axis; excellent shielding, higher bandwidth than UTP, over longer distances; early Ethernet and today cable television and broadband. Optical fibre: pulses of light by total internal reflection; terabits per second, tens of kilometres, immune to EMI, secure; highest cost and demanding installation; multimode for short links, single-mode for backbones and undersea cables.",["Twisted pair construction, cost, use","UTP and STP, categories","Coaxial construction and use","Fibre principle (total internal reflection)","Fibre advantages and disadvantages","Explicit comparison on cost, speed and use"]],
["Explain the DNS resolution process step by step, from a browser request to receiving an IP address.","DNS translates domain names into IP addresses because routing at the Network layer needs numeric addresses. For www.example.com: (1) the browser checks its own cache and the operating system's cache. (2) If not found, it queries a recursive resolver, commonly run by the ISP. (3) The resolver queries a root server to find which server handles .com. (4) It queries that TLD server to find the authoritative server for example.com. (5) It queries the authoritative server for the IP address of www.example.com. (6) The resolver returns the answer to the browser, which opens the connection to that IP. DNS prefers UDP because a lookup is small and speed matters.",["Purpose of DNS (name to IP)","Cache check","Recursive resolver","Root server","TLD server","Authoritative server and answer returned"]],
["Compare checksum and CRC as error-detection methods, and explain why CRC is preferred for Ethernet frames.","A checksum treats the data as numbers, adds them with a rule for overflow (such as one's complement) and sends the sum; the receiver repeats the sum and a mismatch signals an error. It is simple and cheap and used in TCP/IP headers, but may miss multiple errors that cancel out. A CRC treats the data as a long binary number, divides it by an agreed generator polynomial and sends the remainder; the receiver divides and checks. CRC catches a much higher proportion of realistic error patterns, especially burst errors from brief electrical interference, so it is placed in the trailer of every Ethernet frame. Both only detect; retransmission is the usual response.",["Checksum method","Checksum limitation and use","CRC method","CRC strength, burst errors","Why CRC is used in Ethernet","Detection not correction"]],
["Explain the client-server and peer-to-peer models, with advantages and disadvantages of each.","In the client-server model clients (browsers, email apps) request services and dedicated servers, running continuously, respond. Advantages: centralised management of data, security and backups; server capacity can be upgraded independently. Disadvantages: the server is a single point of failure and can become a bottleneck; dedicated hardware is needed. In the peer-to-peer model there are no dedicated servers; every peer is both client and server and there is no central authority. Advantages: no single point of failure and lower cost. Disadvantages: weaker central security and access control and unpredictable performance. Client-server suits websites, email and banking; peer-to-peer suits BitTorrent and blockchain.",["Client-server description","Client-server advantages","Client-server disadvantages","Peer-to-peer description","Peer-to-peer advantages and disadvantages","Examples of use"]],
["Describe the network devices covered in this chapter, stating the OSI layer each operates at.","NIC (Layers 1 to 2): connects a computer to the medium and carries the MAC address. Hub (Layer 1): floods every port, one collision domain, obsolete. Repeater (Layer 1): regenerates an attenuated signal. Bridge (Layer 2): filters between two segments by MAC address. Switch (Layer 2): forwards by MAC table to the correct port. Access point (Layers 1 to 2): joins Wi-Fi devices to the wired network. Router (Layer 3): connects different networks by IP address and routing table, performs NAT. Gateway (any layer): translates between different protocols. Modem: converts between digital and analog signals.",["NIC with MAC address","Hub and repeater at Layer 1","Bridge and switch at Layer 2","Access point","Router at Layer 3 with NAT","Gateway and modem"]],
["Distinguish PAN, LAN, MAN and WAN with coverage range and one example network of each.","PAN: about 10 m around an individual, wireless via Bluetooth, Zigbee or infrared; example, a phone with wireless earbuds. LAN: a room, building or campus up to about 1 km, privately owned, high speed on Ethernet or Wi-Fi; example, an office or school network. MAN: a whole city, 5 to 50 km, often on optical fibre, interconnecting LANs; example, a city cable broadband network or bank branches. WAN: regions, countries or the globe using leased lines, satellite and undersea fibre, lower speed and higher latency; example, the Internet.",["PAN range and example","LAN range, ownership and example","MAN range and example","WAN range and example","Technology or speed differences"]]
];
const APP=[
["A small office wants a network that is cheap to install and where all computers will rarely need to be added or removed. Later they change their mind and expect frequent additions. Recommend a topology for each scenario and justify.","For the first scenario a bus topology is the cheapest, since it needs the least cabling, though its fault tolerance is poor and a star is nowadays about as easy to justify. For frequent additions a star topology is better: each device connects to a central switch, so adding or removing a device only changes one connection, faults are isolated and easy to diagnose. The trade-off is that the central switch is a single point of failure and more cabling is needed.",["Bus (or low-cost) for the first scenario with cost reason","Star for frequent additions","Easy add or remove and fault isolation","Mentions the central point of failure"]],
["A user reports that their video calls freeze constantly even though a speed test shows their advertised 100 Mbps bandwidth is being delivered in full. Diagnose the likely cause and explain why high bandwidth alone did not prevent the problem.","The likely cause is high or inconsistent latency (and jitter). Bandwidth and throughput describe how much data moves per second; latency is the delay before data arrives. Video calls are latency-sensitive: packets that arrive late are useless, so the call freezes even though the connection can sustain high throughput. Latency is largely independent of bandwidth, as with a satellite link. Check with ping, congestion on Wi-Fi or the route.",["Identifies latency (jitter)","Bandwidth and latency are independent","Video calls are latency-sensitive","Mentions ping or a possible cause"]],
["An organisation wants to let employees access the internal company network securely while working from home over the public internet. Recommend a technology and explain how it achieves this.","A VPN (Virtual Private Network). It creates an encrypted logical tunnel across the public internet between the employee's device and the company network, so traffic is protected from interception as if the two points were joined by a private cable, even though the data crosses shared public infrastructure. The employee can then reach the internal LAN securely.",["Recommends a VPN","Encrypted tunnel across a public network","Protected from interception, as if a private link","Employee reaches the internal LAN"]],
["Explain why the internet, in practice, uses the four-layer TCP/IP model rather than implementing all seven OSI layers as separate distinct protocols end to end.","TCP/IP came from the ARPANET project and predates OSI; it was designed pragmatically for a working, scalable internet. It merges OSI's Application, Presentation and Session layers into one Application layer and the Data Link and Physical layers into one Network Access layer, since functions like encryption or sessions are handled inside applications. OSI was developed as a vendor-neutral reference and vocabulary, not as a protocol suite, so it remains the teaching and description tool while TCP/IP is what is implemented.",["TCP/IP came first from ARPANET","Pragmatic design for a working internet","Layers merged (top three, bottom two)","OSI is a reference and vocabulary"]],
["A company is deciding between a client-server and a peer-to-peer architecture for a new internal file-sharing tool used by 20 employees. Recommend an architecture and justify it considering reliability, cost and central control.","Client-server is recommended. A central server gives centralised management, access control, security policy and backups, which matter for company files, and performance is predictable. Its drawbacks are the single point of failure (mitigated with backups or redundancy) and the cost of server hardware, which is modest for 20 users. Peer-to-peer would be cheaper and have no single point of failure, but it offers weak central control and security and unpredictable availability depending on which peers are online.",["Recommends client-server","Central control and security","Reliability trade-off (single point of failure, backups)","Cost trade-off","Why peer-to-peer is weaker here"]],
["A network administrator observes that a file downloaded via FTP is corrupted despite a successful transfer. Explain what error-detection mechanism should have caught this and why it might have failed.","Error detection should have been provided at several layers: the CRC in the Ethernet frame trailer at the Data Link layer, and the checksums in the IP and TCP headers, with TCP retransmitting damaged segments. These only detect that an error occurred, and a checksum can miss multiple errors that cancel out, so a corruption can slip through; the corruption may also have happened at the source or the storage device after delivery, outside the transfer. Verifying a file hash after download would confirm integrity.",["Names CRC and checksum (TCP)","Detection leads to retransmission","Checksum can miss cancelling errors","Corruption may occur outside the transfer"]]
];

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function norm(s){return " "+String(s).toLowerCase().replace(/[^a-z0-9]+/g," ").trim()+" ";}
function matches(user,acc,all){const u=norm(user);const hit=a=>u.includes(norm(a));return all?acc.every(hit):acc.some(hit);}

function buildQueue(){

function viewLearn(){

  let h='<div class="subnav" role="group" aria-label="Learning method">'+subs.map(s=>`<button class="chip" data-act="lv" data-v="${s[0]}" aria-pressed="${S.lv===s[0]}">${s[1]}</button>`).join("")+"</div>";
  if(S.lv==="path")h+=viewPath();
  else if(S.lv==="cards")h+=viewCards();
  else if(S.lv==="cloze")h+=viewCloze();
  else if(S.lv==="cover")h+=viewCover();

function secCounts(){
  const c=[0,0,0,0];
  CARDS.forEach((k,i)=>{if(S.cards.sec<0||k[0]===S.cards.sec)c[store.box[i]||0]++;});return c;
}
function viewCards(){
  const c=secCounts(),tot=c[0]+c[1]+c[2]+c[3];
  let h='<p class="hint">Read the question, answer in your head or in the box, then flip. Rate honestly. Missed cards come back within a few cards; a card is mastered after two confident passes in separate sessions.</p>';
  h+='<div class="subnav">'+['<button class="chip" data-act="csec" data-v="-1" aria-pressed="'+(S.cards.sec<0)+'">All topics</button>'].concat(SECS.map((s,i)=>`<button class="chip" data-act="csec" data-v="${i}" aria-pressed="${S.cards.sec===i}">${esc(s)}</button>`)).join("")+"</div>";
  h+=`<div class="subnav"><button class="chip" data-act="cord" data-v="0" aria-pressed="${!S.cards.ordered}">Shuffled</button><button class="chip" data-act="cord" data-v="1" aria-pressed="${S.cards.ordered}">Chapter order</button></div>`;
  h+=`<div class="stats"><div class="stat"><b>${c[0]}</b><span>New</span></div><div class="stat"><b>${c[1]}</b><span>Learning</span></div><div class="stat"><b>${c[2]}</b><span>Review</span></div><div class="stat"><b>${c[3]}</b><span>Mastered</span></div></div>`;
  h+=`<div class="bar" aria-hidden="true"><i style="width:${tot?Math.round(c[3]/tot*100):0}%"></i></div>`;
  const q=S.cards.queue;
  if(!q.length){
    h+=`<div class="panel"><h3>${c[3]===tot?"Every card in this set is mastered":"Session complete"}</h3><p class="hint">${S.cards.done} cards rated this session.</p><div class="row"><button class="btn primary" data-act="cnext">Start another round</button><button class="btn" data-act="creset">Reset progress for this set</button></div></div>`;
    return h;
  }
  const id=q[0],k=CARDS[id];
  h+=`<div class="panel fc"><div class="lab">Question · ${esc(SECS[k[0]])} · ${q.length} left</div><div class="q">${esc(k[1])}</div>`;
  h+=`<input type="text" id="guess" placeholder="Type what you remember (optional)" value="${esc(S.cards.guess)}" autocomplete="off">`;
  if(!S.cards.flip){h+='<div class="row"><button class="btn primary" data-act="flip">Show answer</button><span class="hint">or press Space</span></div>';}
  else{
    h+=`<div class="lab">Answer</div><div class="a">${esc(k[2])}</div><div class="row"><button class="btn bad" data-act="rate" data-v="miss">Missed it (1)</button><button class="btn warn" data-act="rate" data-v="almost">Almost (2)</button><button class="btn good" data-act="rate" data-v="got">Got it (3)</button></div>`;
  }
  return h+"</div>";
}
function viewCloze(){
  let h='<p class="hint">Read each passage and say the hidden term aloud before you tap it. Tap again to hide it.</p><div class="row"><button class="btn" data-act="revall">Reveal all</button><button class="btn" data-act="hideall">Hide all</button></div>';
  NOTES.forEach(n=>{
    const body=esc(n[1]).replace(/\{\{(.+?)\}\}/g,(m,a)=>`<button class="blank" data-act="blank" style="min-width:${Math.max(4,a.length)}ch" aria-label="Hidden term, press to reveal"><span class="ans">${a}</span></button>`);
    h+=`<div class="panel note"><h3>${esc(n[0])}</h3><p>${body}</p></div>`;
  });
  return h;
}
function viewCover(){
  let h='<p class="hint">Cover the answers, say what belongs in each cell, then tap it to check. Switch the mask to quiz yourself from the other direction.</p>';
  TABLES.forEach((t,ti)=>{
    const m=S.tmode[ti]||"a";
    h+=`<div class="panel"><div class="row" style="justify-content:space-between"><h3>${esc(t.t)}</h3><div class="subnav"><button class="chip" data-act="tmode" data-t="${ti}" data-v="a" aria-pressed="${m==="a"}">Hide answers</button><button class="chip" data-act="tmode" data-t="${ti}" data-v="b" aria-pressed="${m==="b"}">Hide first column</button><button class="chip" data-act="tmode" data-t="${ti}" data-v="o" aria-pressed="${m==="o"}">Show all</button></div></div><div class="tbl"><table><thead><tr>${t.c.map(c=>`<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>`;
    t.r.forEach(r=>{h+="<tr>"+r.map((c,ci)=>{const hid=(m==="a"&&ci>0)||(m==="b"&&ci===0);return `<td><span class="m${hid?" hid":""}" data-act="mask"${hid?' tabindex="0" role="button" aria-label="Hidden, press to reveal"':""}>${esc(c)}</span></td>`;}).join("")+"</tr>";});
    h+="</tbody></table></div></div>";
  });
  return h;
}
function viewDump(){
  const d=DUMPS[S.dump.i];
  let h='<p class="hint">Pick a topic and write everything you can remember with the chapter closed. Then compare against the key points and tick what you covered. The unticked points are your study list.</p>';
  h+='<div class="subnav">'+DUMPS.map((x,i)=>`<button class="chip" data-act="dtopic" data-v="${i}" aria-pressed="${S.dump.i===i}">${esc(x.t)}</button>`).join("")+"</div>";
  h+=`<div class="panel"><h3>${esc(d.t)}</h3><label class="lab" for="dtext">Your recall</label><textarea id="dtext" placeholder="Write it all out, in your own words...">${esc(S.dump.text)}</textarea>`;
  if(!S.dump.checked){h+='<div class="row"><button class="btn primary" data-act="dcheck">Compare with key points</button></div>';}
  else{
    const n=d.p.length,got=d.p.filter((_,i)=>S.dump.ticks[i]).length;

  }
  return h+"</div>";
}

/* ---------- topology links ---------- */
function topoRes(){
  const n=parseInt(L.nn,10);
  if(!(n>=2)||n>200)return {tpres:note("Enter a whole number of devices from 2 to 200.")};
  const mesh=n*(n-1)/2;
  let h=okb("Full mesh of "+n+" devices: "+n+" × "+(n-1)+" ÷ 2 = <b>"+mesh+"</b> links.");
  h+='<div class="tbl"><table style="text-align:center"><thead><tr><th>Topology</th><th>Links for '+n+' devices</th><th>Note</th></tr></thead><tbody>';
  h+="<tr><th>Star</th><td class=\"mono\">"+n+"</td><td>One link per device to the central switch</td></tr>";
  h+="<tr><th>Ring</th><td class=\"mono\">"+n+"</td><td>Each device to two neighbours in a loop</td></tr>";
  h+="<tr><th>Bus</th><td class=\"mono\">"+n+" drops + 1 backbone</td><td>All share one cable</td></tr>";

  const mb=parseFloat(L.fsz),s=parseFloat(L.fsec),bw=parseFloat(L.fbw);
  if(!(mb>0)||!(s>0)||!(bw>0))return {rtres:note("Enter positive numbers: file size in megabytes (MB), time in seconds and advertised bandwidth in Mbps.")};
  const bits=mb*8,tp=bits/s,ideal=bits/bw;
  let h=okb(mb+" MB = "+mb+" × 8 = <b>"+r2(bits)+" Mb</b>. Data transfer rate = "+r2(bits)+" ÷ "+s+" = <b>"+r2(tp)+" Mbps</b>.");
  h+=tp>bw+1e-9?badb("The rate exceeds the bandwidth of "+bw+" Mbps, which cannot happen: throughput can never exceed bandwidth. Check the figures."):note("This is "+r2(tp/bw*100)+" percent of the "+bw+" Mbps bandwidth. At full bandwidth the transfer would take "+r2(ideal)+" s.");
  h+='<p class="hint">1 byte = 8 bits, so file sizes in bytes are multiplied by 8 before dividing by seconds to give megabits per second.</p>';
  return {rtres:h};
}

function macSend(){
  const s=L.ms,d=L.md;
  if(s===d){L.mlog.push(badb("Source and destination are the same host; choose different hosts."));return;}
  const learned=!(s in L.mt);L.mt[s]=HOSTS[s];
  let m="<b>"+s+" → "+d+"</b>. "+(learned?"The switch learns that "+s+" is on port "+HOSTS[s]+". ":"Already knows "+s+". ");
  if(d in L.mt)L.mlog.push(okb(m+"Destination "+d+" is in the table, so the frame is forwarded <b>only to port "+L.mt[d]+"</b> (unicast)."));
  else L.mlog.push(note(m+"Destination "+d+" is unknown, so the frame is <b>flooded to all other ports</b> ("+Object.values(HOSTS).filter(p=>p!==HOSTS[s]).join(", ")+") until "+d+" replies and is learned."));
}

function ipRes(){
  const p=String(L.ipa).trim().split(".");
  if(p.length!==4||p.some(x=>!/^\d{1,3}$/.test(x)||+x>255))return {iprs:badb("An IPv4 address has four decimal octets, each from 0 to 255 (for example 192.168.1.1).")};
  const o=p.map(Number),bin=o.map(x=>x.toString(2).padStart(8,"0"));
  let kind="a public address";
  if(o[0]===10||(o[0]===172&&o[1]>=16&&o[1]<=31)||(o[0]===192&&o[1]===168))kind="a private address (used inside a LAN behind a router that performs NAT)";
  else if(o[0]===127)kind="a loopback address (this computer itself)";
  else if(o[0]===169&&o[1]===254)kind="a link-local address (no DHCP answer was received)";
  let h=okb("<b>"+o.join(".")+"</b> in binary: <span class=\"mono\">"+bin.join(".")+"</span>");
  h+=note("This is "+kind+".");
  h+='<p class="hint">Four octets × 8 bits = 32 bits, giving 2<sup>32</sup> = 4,294,967,296 (about 4.3 billion) addresses, which is why IPv6 uses 128 bits.</p>';

}

/* ---------- error detection ---------- */
function crcRem(bits,gen){
  const g=gen.length,a=(bits+"0".repeat(g-1)).split("").map(Number),gn=gen.split("").map(Number);
  for(let i=0;i<=a.length-g;i++)if(a[i])for(let j=0;j<g;j++)a[i+j]^=gn[j];
  return a.slice(a.length-(g-1)).join("");
}
function crcCheck(bits,gen){
  const a=bits.split("").map(Number),gn=gen.split("").map(Number),g=gn.length;
  for(let i=0;i<=a.length-g;i++)if(a[i])for(let j=0;j<g;j++)a[i+j]^=gn[j];
  return a.slice(a.length-(g-1)).join("");
}
function chk4(bits){
  const pad=bits.padStart(Math.ceil(bits.length/4)*4,"0");let s=0;
  for(let i=0;i<pad.length;i+=4)s+=parseInt(pad.slice(i,i+4),2);
  while(s>15)s=(s&15)+(s>>4);
  return (15-s).toString(2).padStart(4,"0");
}
function errRes(){
  const d=String(L.ebits).trim(),g=String(L.egen).trim();
  if(!/^[01]{4,24}$/.test(d)||!/^1[01]{1,7}$/.test(g)||g.length>=d.length)return {erres:note("Enter 4 to 24 data bits (0 and 1) and a generator of 2 to 8 bits starting with 1 (shorter than the data), such as 1011.")};
  const par=(d.split("1").length-1)%2,rem=crcRem(d,g),cw=d+rem,cs=chk4(d);
  let rx=String(L.erx).trim();if(rx==="")rx=cw;
  let h='<div class="tbl"><table><thead><tr><th>Method</th><th>Sender computes</th></tr></thead><tbody><tr><th>Even parity bit</th><td class="mono">'+par+'</td></tr><tr><th>Checksum (4-bit groups added, carry wrapped, complemented)</th><td class="mono">'+cs+'</td></tr><tr><th>CRC remainder (divide by '+g+')</th><td class="mono">'+rem+'</td></tr><tr><th>Codeword sent (data + CRC)</th><td class="mono">'+cw+"</td></tr></tbody></table></div>";
  if(!/^[01]+$/.test(rx)||rx.length!==cw.length)h+=note("Enter the received bits below with exactly "+cw.length+" bits to test detection (change one or more bits of the codeword).");
  else{
    const rd=rx.slice(0,d.length),pr=(rd.split("1").length-1)%2,cr=chk4(rd),cc=crcCheck(rx,g);
    const v=(ok,n)=>'<tr><th>'+n+'</th><td>'+(ok?"No error detected":"<b>Error detected</b>")+"</td></tr>";
    h+='<div class="tbl"><table><thead><tr><th>Receiver check</th><th>Result</th></tr></thead><tbody>'+v(pr===par,"Parity")+v(cr===cs,"Checksum")+v(/^0+$/.test(cc),"CRC (remainder "+cc+")")+"</tbody></table></div>";
    h+=rx===cw?okb("Received bits are identical to those sent."):note("The received bits differ from the sent codeword. Try changing two bits: parity often misses it, while CRC usually catches it.");
  }
  return {erres:h};
}
