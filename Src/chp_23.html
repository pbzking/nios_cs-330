const NOTES=[
["1.1 Database fundamentals","A {{database}} is an organised, structured collection of related data stored electronically so that it can be retrieved, changed and managed efficiently. It differs from a plain file in three ways: it imposes structure and relationships on the data, it lets many users work at once, and it enforces rules that keep the data correct. Before databases each application kept its own file in its own format, which caused five problems: {{redundancy}} (the same data stored in several files), {{inconsistency}} (copies that disagree), {{isolation}} (data in different formats is hard to combine), lack of {{sharing}} and poor {{security}}. A {{DBMS}} (database management system) is software that provides one central interface for creating, storing, retrieving, updating and managing databases; it sits between the users and the files on disk and takes care of storage, access, concurrency, security and recovery. Users send requests in a query language, almost always {{SQL}}. A DBMS gives less redundancy, consistency, integrity, sharing, security, backup and recovery, and {{data independence}} (storage can change without rewriting the programs). Popular products are MySQL, MariaDB, PostgreSQL, Oracle Database, Microsoft SQL Server and SQLite. {{MySQL}} is a client-server system: the mysqld server holds the databases and a client such as mysql connects and sends SQL. A spreadsheet is not a DBMS."],
["1.2 Database models","A database model defines the logical structure of a database: how data is organised and how items are related. In the {{hierarchical}} model the data forms a {{tree}}: each child has exactly {{one parent}}, so relationships are one-to-many and access follows fixed parent-child paths (IBM IMS, 1960s); a many-to-many relationship does not fit. In the {{network}} model a record may have {{several parents}}, so the data forms a general graph and many-to-many links are possible; records are joined by pointer chains and the model was standardised by CODASYL in the 1970s. The {{relational}} model, proposed by {{E. F. Codd}} of IBM in {{1970}}, puts all data in two-dimensional {{tables}} of rows and columns; relationships are shown by matching {{key values}}, not pointers, so the logical design is independent of physical storage, and users state what they want in SQL. MySQL and Oracle are relational DBMSs. To compare the models give structure, navigation and an example for each."],
["1.3 Relational database concepts","A {{table}} (formally a {{relation}}) is a two-dimensional arrangement of data in rows and columns, with a name unique in its database; each table describes one kind of real-world thing. A row is a record or {{tuple}}; a column is a field or {{attribute}}. The number of columns is the {{degree}} and the number of rows is the {{cardinality}}: a table of 500 students with 5 columns has degree 5 and cardinality 500. Each row has a value, or {{NULL}} (unknown or missing), in every column. Rows and columns have no fixed order: a relation is a set of tuples, so a query without ORDER BY guarantees no particular order. The Students table of the lesson has the columns StudentID, Name, Class, Marks and City, degree 5 and cardinality 5. To find degree and cardinality count the columns, then the rows, excluding the heading row."],
["1.4 Database keys","A {{key}} is one or more columns whose values uniquely identify rows or tie tables together. The {{primary key}} identifies each row uniquely; no two rows share a value, it can never be {{NULL}}, and a table has exactly {{one}} primary key. A {{candidate key}} is any column or combination that could be the primary key: unique for every row and never NULL; a table may have several. An {{alternate key}} is a candidate key that was not chosen as the primary key; in MySQL it is declared with {{UNIQUE}}. A {{composite key}} has two or more columns together: in Enrollment(StudentID, CourseID, Grade) neither column alone is unique but the pair is. A {{foreign key}} is a column in one table whose values must match the primary key of another (the parent) table; it links tables and prevents orphan rows. A foreign key need not be unique and may be NULL; uniqueness is demanded only of the referenced primary key. Declared with FOREIGN KEY (col) REFERENCES parent(col). MySQL refuses an order for a non-existent customer (error 1452) and the deletion of a customer who still has orders (error 1451)."],
["1.5 Data integrity and normalisation","{{Data integrity}} means that stored data is accurate, consistent and reliable; a DBMS enforces it through {{constraints}}. {{Entity}} integrity: every row is uniquely identifiable, by a PRIMARY KEY that is unique and non-NULL. {{Referential}} integrity: a foreign key matches an existing primary key or is NULL. {{Domain}} integrity: values lie in a valid domain, enforced by data types, NOT NULL and CHECK. {{User-defined}} integrity covers extra business rules. Broken constraints give MySQL errors: 1062 duplicate entry, 1048 column cannot be null, 3819 check constraint violated. {{Normalisation}} is organising a schema to reduce redundancy and improve integrity by splitting big repetitive tables into smaller ones linked by keys. {{1NF}}: every column holds an atomic value, no repeating groups, rows unique; it removes multi-valued cells. {{2NF}}: 1NF and every non-key column depends on the whole primary key; it removes {{partial}} dependencies and matters only when the key is composite. {{3NF}}: 2NF and no non-key column depends on another non-key column; it removes {{transitive}} dependencies (RollNo to PinCode to City). The mnemonic: depends on the key, the whole key and nothing but the key. Normalisation does not stop wrong values; that is integrity."],
["1.6 SQL fundamentals and statements","{{SQL}} (Structured Query Language) is the standard language for creating, querying and managing relational databases; it was developed at IBM in the early 1970s, became an ANSI/ISO standard in 1986, and is {{declarative}}: you state what data you want and the DBMS decides how. {{DDL}} (Data Definition Language) defines structure: CREATE, ALTER, DROP, TRUNCATE. {{DML}} (Data Manipulation Language) works with the data: INSERT, SELECT, UPDATE, DELETE. {{DCL}} (Data Control Language) controls permissions: GRANT, REVOKE. {{TCL}} (Transaction Control Language) groups changes: COMMIT, ROLLBACK, SAVEPOINT. In MySQL every DDL statement is {{auto-committed}}. Data types: INT, DECIMAL(p,s), FLOAT, DOUBLE, VARCHAR(n), CHAR(n), DATE ('YYYY-MM-DD'). Use {{DECIMAL}} for exact values such as marks and money: the FLOAT sum of five marks drifts to 408.8000030517578 while DECIMAL gives 408.80. CREATE TABLE defines columns, types and constraints; INSERT INTO adds a row (naming the columns is safer, and omitted columns become NULL); UPDATE changes rows; DELETE removes rows; always give UPDATE and DELETE a {{WHERE}}. DELETE removes rows (DML, conditional, can be rolled back); TRUNCATE removes all rows (DDL, keeps the structure); DROP TABLE removes the table and its data (DDL, permanent). ALTER TABLE adds, modifies or drops a column."],
["1.7 SQL clauses and functions","{{WHERE}} keeps only the rows for which a condition is true; operators are = <> < > <= >=, AND, OR, NOT, {{BETWEEN}} a AND b (both ends included), {{IN}} (list), {{LIKE}} (% any run of characters, _ exactly one) and {{IS NULL}}. {{ORDER BY}} sorts the result, ASC by default and DESC for descending, later columns breaking ties. {{GROUP BY}} gathers rows with the same value into groups so that an aggregate gives one result per group. {{HAVING}} filters groups after they are formed, using a condition on an aggregate; WHERE filters rows before grouping and cannot see an aggregate (error 1111). The clauses are written in the order SELECT, FROM, WHERE, GROUP BY, HAVING, ORDER BY, but run as FROM, WHERE, GROUP BY, HAVING, SELECT, ORDER BY. The aggregate functions are {{COUNT}} (rows; COUNT(col) counts non-NULL values), {{SUM}}, {{AVG}}, {{MIN}} and {{MAX}}; all except COUNT(*) {{ignore NULL}}. AVG of 80, 60 and NULL is 70, not 46.67, because NULL is unknown and not zero. Test for missing values with IS NULL, never = NULL. A plain column cannot be selected beside an aggregate unless it is in GROUP BY (ONLY_FULL_GROUP_BY, error 1140). ROUND(AVG(Marks), 2) gives a tidy average."],
["1.8 Security, backup and transactions","Database security ensures that only authorised people reach the data and that each can do only what they are allowed. A DBMS uses {{user accounts}} ('name'@'host') and {{privileges}} such as SELECT, INSERT, UPDATE, DELETE, CREATE and DROP, given on specific objects. {{GRANT}} gives privileges and {{REVOKE}} takes them away; in MySQL the account must exist first (CREATE USER) and the object is written database.table. USAGE means the account may log in and nothing more. A forbidden statement gives error 1142. {{Least privilege}} gives each user the minimum rights needed. A {{backup}} is a copy of the database kept in a separate safe place; recovery restores a consistent state, replaying the {{transaction log}} (the binary log in MySQL). Kinds: {{full}}, {{incremental}} (changes since the last backup of any kind) and {{differential}} (changes since the last full backup). mysqldump makes a full backup. A {{transaction}} is a logical unit of work that must all succeed or all fail (atomicity). MySQL is in autocommit mode by default; START TRANSACTION (or BEGIN) suspends it until {{COMMIT}} (make permanent) or {{ROLLBACK}} (undo). SAVEPOINT marks a point and ROLLBACK TO undoes only the later statements. DDL statements commit automatically, so a ROLLBACK after them is too late. {{ACID}}: atomic, consistent, isolated, durable."]
];

const SHORT=[
["Distinguish a file-processing system from a DBMS on redundancy, consistency and sharing.","In a file system the same data is stored in several files (redundancy), copies can disagree after an update (inconsistency) and each program owns its data, so sharing is hard. A DBMS stores each fact once in a central database, an update is seen by every user at once, and many users share the data at the same time under control.",["redundancy","consistency","sharing"]],
["State four advantages of a DBMS.","Less redundancy; consistency; integrity through constraints; data sharing; security through accounts and privileges; backup and recovery; data independence (any four).",["four advantages"]],
["Distinguish the hierarchical and network models.","In the hierarchical model the data forms a tree and each child has exactly one parent, so relationships are one-to-many. In the network model a record may have several parents, so the data forms a graph and many-to-many links are possible.",["hierarchical one parent","network many parents"]],
["Distinguish degree from cardinality.","Degree is the number of columns (attributes) of a table; cardinality is the number of rows (tuples). A table of 500 students with 5 columns has degree 5 and cardinality 500.",["degree columns","cardinality rows"]],
["Distinguish a primary key from a candidate key and an alternate key.","A candidate key is any column or combination that is unique and never NULL. The primary key is the candidate chosen to identify rows (one per table). An alternate key is a candidate that was not chosen, declared with UNIQUE.",["candidate","primary","alternate"]],
["What is a composite key? Give an example.","A key made of two or more columns together. In Enrollment(StudentID, CourseID, Grade) neither column alone is unique, but the pair (StudentID, CourseID) is, so it is the primary key.",["two or more","example"]],
["What is a foreign key, and what does it prevent?","A column in one table whose values must match the primary key of another (parent) table. It links the tables and prevents orphan rows, such as an order for a customer who does not exist.",["matches primary key","orphan"]],
["Name and explain two types of data integrity.","Entity integrity: every row is uniquely identifiable, enforced by a primary key that is unique and non-NULL. Referential integrity: a foreign key must match an existing primary key or be NULL, enforced by FOREIGN KEY. (Domain and user-defined integrity are the others.)",["type 1","type 2"]],
["What is normalisation? State the aim of 1NF.","Normalisation organises a schema to reduce redundancy and improve integrity by splitting big tables into smaller ones linked by keys. 1NF requires every column to hold an atomic value, with no repeating groups, which removes multi-valued cells.",["definition","1NF atomic"]],
["Classify CREATE, SELECT, GRANT, COMMIT and ALTER as DDL, DML, DCL or TCL.","CREATE and ALTER: DDL. SELECT: DML. GRANT: DCL. COMMIT: TCL.",["DDL","DML DCL TCL"]],
["Distinguish DELETE, TRUNCATE and DROP.","DELETE (DML) removes the rows chosen by WHERE, keeps the table and can be rolled back in a transaction. TRUNCATE (DDL) removes all rows and keeps the structure. DROP TABLE (DDL) removes the table and its data permanently. TRUNCATE and DROP cannot be rolled back.",["DELETE","TRUNCATE","DROP"]],
["Distinguish WHERE from HAVING.","WHERE filters individual rows before grouping and cannot use aggregates. HAVING filters groups after grouping, using a condition on an aggregate such as COUNT(*) > 1.",["WHERE rows","HAVING groups"]],
["Why should DECIMAL be preferred to FLOAT for marks?","FLOAT stores a binary approximation, so totals drift: the five marks sum to 408.8000030517578. DECIMAL(5,2) is exact and gives 408.80.",["float approximate","decimal exact"]],
["What is the principle of least privilege?","Each user is given only the minimum permissions needed for the job. A teacher who records marks needs SELECT and INSERT, not DROP; this limits the damage of a mistake or an intruder.",["minimum","example"]],
["Distinguish full, incremental and differential backups.","Full copies the whole database (slowest, simplest restore). Incremental copies only what changed since the last backup of any kind (small, but restore needs the whole chain). Differential copies everything changed since the last full backup (bigger, restore needs two backups).",["full","incremental","differential"]],
["What does a transaction log make possible?","Every change is recorded, so after restoring the last backup the DBMS can replay the log and bring the database up to the moment of the crash (in MySQL the binary log).",["records changes","replay"]],
["Why does WHERE City = NULL never match a row?","NULL means unknown, so a comparison with NULL is never true. The correct test is WHERE City IS NULL.",["unknown","IS NULL"]],
["Explain the difference between COUNT(*) and COUNT(column).","COUNT(*) counts rows, including those with NULL. COUNT(column) counts only the non-NULL values of that column. For marks 80, 60, NULL they return 3 and 2.",["count rows","count non-null"]],
["Explain why a ROLLBACK after CREATE TABLE cannot undo earlier changes.","Every DDL statement is auto-committed in MySQL: CREATE TABLE commits the open transaction first, so the earlier changes are permanent and ROLLBACK has nothing to undo.",["DDL commits","nothing to undo"]],
["State the meaning of ACID.","Atomic: all or nothing. Consistent: the rules still hold afterwards. Isolated: users do not trip over each other. Durable: once committed, it survives a crash.",["four properties"]]
];
const LONG=[
["Explain the advantages of a DBMS over a file-processing system, with the problem each solves.","The file-processing approach gives redundancy, inconsistency, isolation, lack of sharing and security problems. A DBMS answers each: less redundancy (each fact stored once, centrally); consistency (an update is seen by all users at once); integrity (constraints reject invalid data); data sharing (many users at once with controlled concurrency); security (accounts and privileges); backup and recovery (restore a consistent state after a crash); data independence (storage can change without rewriting programs).",["problems of files","redundancy and consistency","integrity","sharing","security","backup","independence"]],
["Compare the hierarchical, network and relational models with a diagram and an example of each.","Hierarchical: a tree, each child has one parent, parent-child navigation, IBM IMS; a Dept with Teacher and Course children. Network: a graph, a record may have several parents, pointer chains, IDMS; Class belongs to both Teacher and Course. Relational: tables of rows and columns linked by matching key values, queried with SQL, MySQL and Oracle; Students and Courses tables linked by keys. The relational model is independent of physical storage and has dominated since Codd proposed it in 1970.",["hierarchical","network","relational","diagram","examples"]],
["Explain the five kinds of key with an example table for each, and show a foreign key joining two tables.","Primary: StudentID in Students, unique and never NULL, one per table. Candidate: any column that could be primary, such as StudentID and Email. Alternate: Email, a candidate not chosen, declared UNIQUE. Composite: (StudentID, CourseID) in Enrollment. Foreign: Orders.CustomerID refers to Customers.CustomerID; a join shows each order beside the customer's name, and MySQL refuses an order for customer 7 (error 1452) and the deletion of customer 1 who has orders (error 1451).",["primary","candidate","alternate","composite","foreign with example"]],
["Explain entity, referential and domain integrity, and write a CREATE TABLE statement that enforces each.","Entity: rows uniquely identifiable by a primary key. Referential: a foreign key matches an existing primary key or is NULL. Domain: values lie in a valid domain. CREATE TABLE Marks (RollNo INT PRIMARY KEY, Name VARCHAR(30) NOT NULL, Score INT CHECK (Score BETWEEN 0 AND 100), Grade CHAR(1)); the key gives entity integrity, NOT NULL and CHECK give domain integrity; for referential integrity add FOREIGN KEY (CourseID) REFERENCES Courses(CourseID).",["entity","referential","domain","CREATE TABLE","constraints"]],
["Explain 1NF, 2NF and 3NF, normalising a table of your own choice step by step.","1NF: atomic values, no repeating groups. 2NF: 1NF and every non-key column depends on the whole key. 3NF: 2NF and no non-key column depends on another non-key column. Example: Student(RollNo, Name, Phones, PinCode, City). Phones holds several values: split to one row per phone (1NF). Key is single, so 2NF holds. City depends on PinCode, which depends on RollNo (transitive): create PinCode(PinCode, City) and keep PinCode in Student (3NF).",["1NF defined","2NF defined","3NF defined","table normalised step by step"]],
["Explain the four categories of SQL with their statements, and write a CREATE TABLE and three INSERT statements for the Students table.","DDL (CREATE, ALTER, DROP, TRUNCATE) defines structure; DML (INSERT, SELECT, UPDATE, DELETE) works with the data; DCL (GRANT, REVOKE) controls permissions; TCL (COMMIT, ROLLBACK, SAVEPOINT) groups changes. CREATE TABLE Students (StudentID INT PRIMARY KEY, Name VARCHAR(50) NOT NULL, Class INT, Marks DECIMAL(5,2), City VARCHAR(30)); INSERT INTO Students VALUES (101, 'Ramesh', 10, 85.5, 'Delhi'); INSERT INTO Students VALUES (102, 'Priya', 10, 92.0, 'Mumbai'); INSERT INTO Students VALUES (103, 'Arjun', 11, 78.3, 'Delhi');",["four categories","statements","CREATE TABLE","three INSERTs"]],
["Explain GROUP BY and HAVING with a worked example, and the written and logical order of the clauses of SELECT.","GROUP BY gathers rows with the same value into groups and an aggregate gives one result per group; HAVING filters the groups. SELECT City, COUNT(*) FROM Students GROUP BY City HAVING COUNT(*) > 1; returns Delhi 2 and Mumbai 2 (Chennai has one student). Written order: SELECT, FROM, WHERE, GROUP BY, HAVING, ORDER BY. Logical order: FROM, WHERE, GROUP BY, HAVING, SELECT, ORDER BY, which is why WHERE cannot use an aggregate and HAVING can.",["GROUP BY","HAVING","example result","written order","logical order"]],
["Explain the five aggregate functions with an example of each, and explain how NULL affects them.","COUNT(*) counts rows (5); SUM(Marks) totals (408.80); AVG(Marks) gives the mean (81.76); MIN(Marks) 65.00; MAX(Marks) 92.00. With marks 80, 60 and NULL: COUNT(*) is 3 but COUNT(mark) is 2, and AVG is 70, not 46.67, because aggregates ignore NULL (unknown is not zero). WHERE mark = NULL never matches; use IS NULL.",["five functions","examples","NULL ignored","COUNT(*) against COUNT(col)"]],
["Explain database security: users, privileges, GRANT, REVOKE and least privilege.","Security ensures that only authorised people reach the data and that each can do only what is allowed. An account 'name'@'host' is created with CREATE USER; GRANT SELECT, INSERT ON school.Students TO 'teacher1'@'localhost'; gives privileges; REVOKE INSERT ON school.Students FROM 'teacher1'@'localhost'; withdraws one. A forbidden DELETE gives error 1142. Least privilege gives each user the minimum rights needed for the job and no more, limiting the damage of a mistake or an intruder.",["accounts","privileges","GRANT","REVOKE","least privilege"]],
["Explain transactions with COMMIT, ROLLBACK and SAVEPOINT, using a bank transfer in MySQL.","A transaction is a unit of work that must all succeed or all fail (atomicity). START TRANSACTION; UPDATE Accounts SET Balance = Balance - 5000 WHERE AccID = 'A001'; UPDATE Accounts SET Balance = Balance + 5000 WHERE AccID = 'A002'; then COMMIT if both succeeded or ROLLBACK on any error. SAVEPOINT marks a point and ROLLBACK TO it undoes only later statements. MySQL is in autocommit mode by default and DDL commits automatically.",["atomicity","two updates","COMMIT","ROLLBACK","SAVEPOINT"]]
];

  h+=`<div class="stats"><div class="stat"><b>${c[0]}</b><span>New</span></div><div class="stat"><b>${c[1]}</b><span>Learning</span></div><div class="stat"><b>${c[2]}</b><span>Review</span></div><div class="stat"><b>${c[3]}</b><span>Mastered</span></div></div>`;
  h+=`<div class="bar" aria-hidden="true"><i style="width:${tot?Math.round(c[3]/tot*100):0}%"></i></div>`;
  const q=S.cards.queue;
  if(!q.length){
    h+=`<div class="panel"><h3>${c[3]===tot?"Every card in this set is mastered":"Session complete"}</h3><p class="hint">${S.cards.done} cards rated this session.</p><div class="row"><button class="btn primary" data-act="cnext">Start another round</button><button class="btn" data-act="creset">Reset progress for this set</button></div></div>`;
    return h;
  }
  const id=q[0],k=CARDS[id];
  h+=`<div class="panel fc"><div class="lab">Question · ${esc(SECS[k[0]])} · ${q.length} left</div><div class="q">${esc(k[1])}</div>`;
  h+=`<input type="text" id="guess" placeholder="Type what you remember (optional)" value="${esc(S.cards.guess)}" autocomplete="off">`;
  if(!S.cards.flip){h+='<div class="row"><button class="btn primary" data-act="flip">Show answer</button><span class="hint">or press Space</span></div>';}
  else{
    h+=`<div class="lab">Answer</div><div class="a">${esc(k[2])}</div><div class="row"><button class="btn bad" data-act="rate" data-v="miss">Missed it (1)</button><button class="btn warn" data-act="rate" data-v="almost">Almost (2)</button><button class="btn good" data-act="rate" data-v="got">Got it (3)</button></div>`;
  }
  return h+"</div>";
}
function viewCloze(){
  let h='<p class="hint">Read each passage and say the hidden term aloud before you tap it. Tap again to hide it.</p><div class="row"><button class="btn" data-act="revall">Reveal all</button><button class="btn" data-act="hideall">Hide all</button></div>';
  NOTES.forEach(n=>{
    const body=esc(n[1]).replace(/\{\{(.+?)\}\}/g,(m,a)=>`<button class="blank" data-act="blank" style="min-width:${Math.max(4,a.length)}ch" aria-label="Hidden term, press to reveal"><span class="ans">${a}</span></button>`);
    h+=`<div class="panel note"><h3>${esc(n[0])}</h3><p>${body}</p></div>`;
  });
  return h;
}
function viewCover(){
  let h='<p class="hint">Cover the answers, say what belongs in each cell, then tap it to check. Switch the mask to quiz yourself from the other direction.</p>';
  TABLES.forEach((t,ti)=>{
    const m=S.tmode[ti]||"a";
    h+=`<div class="panel"><div class="row" style="justify-content:space-between"><h3>${esc(t.t)}</h3><div class="subnav"><button class="chip" data-act="tmode" data-t="${ti}" data-v="a" aria-pressed="${m==="a"}">Hide answers</button><button class="chip" data-act="tmode" data-t="${ti}" data-v="b" aria-pressed="${m==="b"}">Hide first column</button><button class="chip" data-act="tmode" data-t="${ti}" data-v="o" aria-pressed="${m==="o"}">Show all</button></div></div><div class="tbl"><table><thead><tr>${t.c.map(c=>`<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>`;
    t.r.forEach(r=>{h+="<tr>"+r.map((c,ci)=>{const hid=(m==="a"&&ci>0)||(m==="b"&&ci===0);return `<td><span class="m${hid?" hid":""}" data-act="mask"${hid?' tabindex="0" role="button" aria-label="Hidden, press to reveal"':""}>${esc(c)}</span></td>`;}).join("")+"</tr>";});
    h+="</tbody></table></div></div>";
  });
  return h;
}
function viewDump(){
  const d=DUMPS[S.dump.i];
  let h='<p class="hint">Pick a topic and write everything you can remember with the chapter closed. Then compare against the key points and tick what you covered. The unticked points are your study list.</p>';
  h+='<div class="subnav">'+DUMPS.map((x,i)=>`<button class="chip" data-act="dtopic" data-v="${i}" aria-pressed="${S.dump.i===i}">${esc(x.t)}</button>`).join("")+"</div>";
  h+=`<div class="panel"><h3>${esc(d.t)}</h3><label class="lab" for="dtext">Your recall</label><textarea id="dtext" placeholder="Write it all out, in your own words...">${esc(S.dump.text)}</textarea>`;
  if(!S.dump.checked){h+='<div class="row"><button class="btn primary" data-act="dcheck">Compare with key points</button></div>';}
  else{
    const n=d.p.length,got=d.p.filter((_,i)=>S.dump.ticks[i]).length;
    h+=`<div class="lab">Tick what you included</div><div class="pts">`+d.p.map((p,i)=>`<label><input type="checkbox" data-act="dtick" data-i="${i}"${S.dump.ticks[i]?" checked":""}><span>${esc(p)}</span></label>`).join("")+`</div><div class="row"><b>${got} of ${n} covered</b><button class="btn" data-act="dreset">Try again</button></div>`;
  }
  return h+"</div>";
}

  toks.forEach(t=>{if(t.t==="o"&&t.v===";"){if(cur.length)stmts.push(cur);cur=[];}else cur.push(t);});
  if(cur.length)stmts.push(cur);
  let steps=0;
  for(const st of stmts){
    SQ.nstmt++;const line=st[0].line;
    if(++steps>400){sqOut("ERROR: script too long for the lab (400 statements)");break;}
    try{const p=new SqlP(st,src);const ast=p.statement();if(ast)execStmt(ast,line);}
    catch(e){
      if(e instanceof SqlErr){SQ.nerr++;SQ.brief.push("ERROR "+e.no);sqOut("ERROR "+e.no+" ("+e.st+") at line "+line+": "+e.msg);}

    }
  }
  return {ok:true,out:SQ.out.join("\n"),cls:"",title:"",detail:"",code:0,warn:[],files:[],sets:SQ.sets,brief:SQ.brief.join(" | "),errors:SQ.nerr,stmts:SQ.nstmt};
}

/* ---------- Key finder ---------- */
function csvRows(s){return String(s).split(/\n/).map(x=>x.trim()).filter(x=>x).map(l=>l.split(",").map(c=>c.trim()));}
function keysRes(){
  const rows=csvRows(L.kt);
  if(rows.length<3)return '<div class="rs bad">Type a heading line and at least two rows, with the values separated by commas.</div>';
  const head=rows[0],data=rows.slice(1);
  if(data.some(r=>r.length!==head.length))return '<div class="rs bad">Every row must have '+head.length+" values, like the heading line.</div>";
  if(head.length>8||data.length>40)return '<div class="rs bad">Use at most 8 columns and 40 rows.</div>';
  const isNull=v=>v===""||v.toUpperCase()==="NULL";
  const uniq=ix=>{const seen=new Set();for(const r of data){const k=ix.map(i=>r[i].toLowerCase()).join("\u0001");if(ix.some(i=>isNull(r[i]))||seen.has(k))return false;seen.add(k);}return true;};
  const singles=[],pairs=[];
  head.forEach((h,i)=>{if(uniq([i]))singles.push(i);});
  for(let i=0;i<head.length;i++)for(let j=i+1;j<head.length;j++){if(singles.includes(i)||singles.includes(j))continue;if(uniq([i,j]))pairs.push([i,j]);}
  const names=ix=>"("+ix.map(i=>head[i]).join(", ")+")";
  const cands=singles.map(i=>head[i]).concat(pairs.map(names));
  let h2='<div class="rs ok"><b>Degree '+head.length+", cardinality "+data.length+".</b> Degree counts the columns, cardinality the rows (the heading line is not a row).</div>";
  if(!cands.length)h2+='<div class="rs bad">No single column or pair of columns is unique and non-NULL in these rows, so no candidate key shows up.</div>';
  else h2+=tbl(["Candidate key","Kind"],singles.map(i=>[head[i],"single column"]).concat(pairs.map(p=>[names(p),"composite (two columns)"])))+'<p class="hint">Choose one as the <b>primary key</b>; every other candidate is an <b>alternate key</b> (declared UNIQUE). This is judged from the rows above only; a real key must be unique for every row that could ever be stored.</p>';
  const cols=head.map((h,i)=>[h,uniq([i])?"unique and non-NULL here":(data.some(r=>isNull(r[i]))?"has NULL":"has repeated values")]);
  return h2+tbl(["Column","Test on these rows"],cols);
}

function buildSql(){
  const t=x=>String(x).trim();
  let s="SELECT "+(t(L.qs)||"*")+"\nFROM Students";
  if(t(L.qw))s+="\nWHERE "+t(L.qw);
  if(t(L.qg))s+="\nGROUP BY "+t(L.qg);
  if(t(L.qh))s+="\nHAVING "+t(L.qh);
  if(t(L.qo))s+="\nORDER BY "+t(L.qo);
  return s+";";
}

  const sql=buildSql();const r=runCpp(STUDENTS_SETUP+"\n"+sql,"");

const SQLCLS={
 CREATE:["DDL","Data Definition Language","Defines a new table, database or user.","auto-commits: permanent at once"],
 ALTER:["DDL","Data Definition Language","Changes the structure of an existing table.","auto-commits: permanent at once"],
 DROP:["DDL","Data Definition Language","Removes a table (or database) and its data.","auto-commits: cannot be rolled back"],
 TRUNCATE:["DDL","Data Definition Language","Removes all rows and keeps the table structure.","auto-commits: cannot be rolled back"],
 INSERT:["DML","Data Manipulation Language","Adds rows to a table.","can be rolled back inside a transaction"],
 SELECT:["DML","Data Manipulation Language","Reads rows from one or more tables.","changes nothing"],
 UPDATE:["DML","Data Manipulation Language","Changes columns of existing rows.","can be rolled back inside a transaction"],
 DELETE:["DML","Data Manipulation Language","Removes rows chosen by WHERE (all rows without WHERE).","can be rolled back inside a transaction"],
 GRANT:["DCL","Data Control Language","Gives privileges to an account.","takes effect at once"],
 REVOKE:["DCL","Data Control Language","Takes privileges away from an account.","takes effect at once"],
 COMMIT:["TCL","Transaction Control Language","Makes all changes of the transaction permanent.","ends the transaction"],
 ROLLBACK:["TCL","Transaction Control Language","Undoes the changes since the transaction began (or since a savepoint).","ends the transaction (unless ROLLBACK TO)"],
 SAVEPOINT:["TCL","Transaction Control Language","Marks a point inside a transaction for a partial rollback.","transaction stays open"],
 START:["TCL","Transaction Control Language","Begins a transaction (autocommit is suspended).","opens a transaction"],
 BEGIN:["TCL","Transaction Control Language","Begins a transaction (same as START TRANSACTION).","opens a transaction"]
};
function clsRes(){
  const s=String(L.cs).trim();const w=(s.match(/^[A-Za-z]+/)||[""])[0].toUpperCase();
  if(!w)return '<p class="hint">Type a statement, for example <code>TRUNCATE TABLE Students;</code>.</p>';
  const c=SQLCLS[w];
  if(!c)return '<div class="rs bad">'+esc(w)+" is not one of the statements of this lesson (CREATE, ALTER, DROP, TRUNCATE, INSERT, SELECT, UPDATE, DELETE, GRANT, REVOKE, COMMIT, ROLLBACK, SAVEPOINT, START TRANSACTION).</div>";
  let extra="";
  if((w==="UPDATE"||w==="DELETE")&&!/\bWHERE\b/i.test(s))extra='<div class="rs bad"><b>No WHERE.</b> This statement affects every row of the table.</div>';
  if(w==="BEGIN"&&/TRANSACTION/i.test(s))extra='<div class="rs bad"><b>MySQL rejects BEGIN TRANSACTION</b> (error 1064). Write START TRANSACTION or just BEGIN.</div>';
  return '<div class="rs ok"><b>'+c[0]+"</b>: "+c[1]+".</div>"+tbl(["Property","Value"],[["Category",c[0]+" ("+c[1]+")"],["What it does",c[2]],["Transaction behaviour",c[3]]])+extra;
}

  if(q.t==="calc"&&q.src)h+='<pre class="codeview">'+esc(q.src)+'</pre>';
  if(q.t==="mcq"){
    h+='<div class="opts">'+q.o.map((o,i)=>{let c="opt";if(res){if(o.c)c+=" right";else if(res.pick===i)c+=" wrong";}return `<button class="${c}" data-act="mcq" data-i="${i}"${res?" disabled":""}>${esc(o.t)}</button>`;}).join("")+"</div>";
    if(res)h+=`<div class="fb ${res.score?"ok":"no"}"><b>${res.score?"Correct.":"Not quite."}</b> ${esc(q.e)}</div>`;
  }else if(q.t==="tf"){
    h+='<div class="opts">'+[true,false].map(v=>{let c="opt";if(res){if(q.a===v)c+=" right";else if(res.pick===v)c+=" wrong";}return `<button class="${c}" data-act="tf" data-v="${v}"${res?" disabled":""}>${v?"True":"False"}</button>`;}).join("")+"</div>";
    if(res)h+=`<div class="fb ${res.score?"ok":"no"}"><b>${res.score?"Correct.":"Not quite."}</b> ${esc(q.e)}</div>`;
  }else if(q.t==="fill"||q.t==="vsa"||q.t==="calc"){
    h+=`<input type="text" id="ans" autocomplete="off" placeholder="Type your answer" value="${esc(r.text[r.i]||"")}"${res?" disabled":""}>`;
    if(!res)h+='<div class="row"><button class="btn primary" data-act="check">Check</button></div>';
    else{
      h+=`<div class="fb ${res.score?"ok":"no"}"><b>${res.score?"Correct.":"Model answer:"}</b> ${res.score?"":esc(q.model)} ${q.e?esc(q.e):""}</div>`;
      if(!res.score)h+='<div class="row"><button class="btn" data-act="override">I was right, count it</button></div>';
    }
  }else{
    const st=r.stage[r.i]||0;
    h+=`<textarea id="wtext" placeholder="Write your answer as you would in the exam..."${st?" disabled":""}>${esc(r.text[r.i]||"")}</textarea>`;
    if(!st)h+='<div class="row"><button class="btn primary" data-act="reveal">Show model answer</button></div>';
    else{
      const tk=r.ticks[r.i]||{};const got=q.pts.filter((_,i)=>tk[i]).length;
      h+=`<div class="lab">Model answer</div><div class="a" style="border-left:3px solid var(--accent);padding-left:14px">${esc(q.model)}</div><div class="lab">Tick every marking point your answer made</div><div class="pts">`+q.pts.map((p,i)=>`<label><input type="checkbox" data-act="wtick" data-i="${i}"${tk[i]?" checked":""}${res?" disabled":""}><span>${esc(p)}</span></label>`).join("")+"</div>";
      if(!res)h+=`<div class="row"><button class="btn primary" data-act="wsave">Save score (${fmt(got/q.pts.length*T.m)} of ${T.m})</button></div>`;
      else h+=`<div class="fb ${res.score>=T.m?"ok":"no"}">Scored ${fmt(res.score)} of ${T.m}.</div>`;
    }
  }
  if(res){h+=`<div class="row"><button class="btn primary" data-act="next">${r.i+1<r.qs.length?"Next question":"See results"}</button></div>`;}
  return h+"</div>";
}
function fmt(x){return (Math.round(x*2)/2).toString();}
function setRes(score,extra){const r=S.run,q=r.qs[r.i];r.res[r.i]=Object.assign({score:score,max:TM[q.t].m},extra||{});render();}
function evalResult(){
  const r=S.run;let sc=0,mx=0;const by={};
  r.qs.forEach((q,i)=>{const x=r.res[i]||{score:0,max:TM[q.t].m};sc+=x.score;mx+=x.max;const b=by[q.t]||(by[q.t]={s:0,m:0,n:0});b.s+=x.score;b.m+=x.max;b.n++;});
  const pct=Math.round(sc/mx*100);
  const msg=pct>=85?"Exam ready on this material.":pct>=65?"Solid. Revisit the misses below.":pct>=40?"Getting there. Use the Learn section on the weak topics.":"Go back to the recall cards, then try again.";
  let h=`<div class="panel"><div class="lab">Result</div><div class="score">${fmt(sc)} / ${mx} <span style="font-size:1.5rem;color:var(--muted)">${pct}%</span></div><p>${msg}</p><div style="display:flex;flex-direction:column;gap:10px">`;
  TYPES.forEach(t=>{const b=by[t.k];if(!b)return;const p=Math.round(b.s/b.m*100);h+=`<div><div class="row" style="justify-content:space-between"><span>${esc(t.n)} (${b.n})</span><b>${fmt(b.s)}/${b.m}</b></div><div class="bar"><i style="width:${p}%"></i></div></div>`;});
  const missed=r.qs.filter((q,i)=>(r.res[i]||{score:0}).score<TM[q.t].m).length;
  h+=`</div><div class="row">${missed?`<button class="btn primary" data-act="retry">Retry the ${missed} missed</button>`:""}<button class="btn" data-act="newtest">New test</button></div></div>`;
  h+="<h2>Review</h2>";
  r.qs.forEach((q,i)=>{const x=r.res[i]||{score:0,max:TM[q.t].m};const ok=x.score>=x.max;
    let ans=q.t==="mcq"?q.opts[q.a]:q.t==="tf"?(q.a?"True":"False"):q.model;
    h+=`<div class="rev ${ok?"ok":"bad"}"><div class="lab">${esc(TM[q.t].n)} · ${fmt(x.score)}/${x.max}</div><b>${esc(q.q)}</b>${x.resp?`<div class="r">You: ${esc(x.resp)}</div>`:""}<div class="r">${ok?"":"Answer: "}${esc(ans)}</div></div>`;});
  return '<div style="display:flex;flex-direction:column;gap:14px">'+h+"</div>";
}
function finishRun(){
  const r=S.run;let sc=0,mx=0;r.qs.forEach((q,i)=>{const x=r.res[i]||{score:0,max:TM[q.t].m};sc+=x.score;mx+=x.max;});
  if(!r.retry){store.hist.unshift({d:new Date().toLocaleDateString(undefined,{day:"numeric",month:"short"}),pct:Math.round(sc/mx*100),n:r.qs.length});store.hist=store.hist.slice(0,8);save();}
  S.ev.view="result";
}

/* ============ EVENTS ============ */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");if(!el)return;
  const a=el.dataset.act,v=el.dataset.v;
  switch(a){
    case "tab":S.tab=v;render();break;
    case "lv":S.lv=v;render();break;
    case "csec":S.cards.sec=+v;buildQueue();render();break;
    case "flip":S.cards.flip=true;render();break;
    case "cnext":buildQueue();render();break;
    case "creset":CARDS.forEach((k,i)=>{if(S.cards.sec<0||k[0]===S.cards.sec)delete store.box[i];});save();buildQueue();render();break;
    case "rate":{const q=S.cards.queue,id=q.shift();let b=store.box[id]||0;
      if(v==="miss"){b=1;q.splice(Math.min(3,q.length),0,id);}
      else if(v==="almost"){b=Math.max(b,1);q.push(id);}
      else{b=b<2?2:3;S.cards.done++;}
      store.box[id]=b;save();S.cards.flip=false;S.cards.guess="";render();break;}
    case "cord":S.cards.ordered=v==="1";buildQueue();render();break;
    case "pstep":openStep(+v);break;
    case "pback":S.path.step=null;render();window.scrollTo(0,0);break;
    case "pnotes":S.path.ph="primer";render();window.scrollTo(0,0);break;
    case "pstart":S.path.ph="learn";S.path.i=0;render();break;
    case "plback":if(S.path.i>0)S.path.i--;render();break;
    case "plnext":{const P=S.path,ids=stepChunks(STEPS[P.step])[P.ch];
      if(P.i+1<ids.length)P.i++;else{P.ph="recall";P.q=shuffle(ids.slice());P.flip=false;P.guess="";}
      render();break;}
    case "pflip":S.path.flip=true;render();break;
    case "prate":{const P=S.path;applyRate(P.q,v);P.flip=false;P.guess="";
      if(!P.q.length){store.path.ch[P.step]=P.ch+1;save();P.ph="roundend";}
      render();break;}
    case "pnext":{const P=S.path,N=stepChunks(STEPS[P.step]).length;
      if(P.ch+1<N){P.ch++;P.ph="learn";P.i=0;}else P.ph="gaps";
      render();window.scrollTo(0,0);break;}
    case "pdump":S.path.ph="dump";render();window.scrollTo(0,0);break;
    case "pcheck":{const t=$("#ptext");if(t)S.path.text=t.value;S.path.dchecked=true;render();break;}
    case "pfinish":store.path.done[S.path.step]=true;save();S.path.ph="done";render();window.scrollTo(0,0);break;
    case "pnextstep":openStep(S.path.step+1);break;
    case "blank":el.classList.toggle("on");break;
    case "revall":document.querySelectorAll(".blank").forEach(b=>b.classList.add("on"));break;
    case "hideall":document.querySelectorAll(".blank").forEach(b=>b.classList.remove("on"));break;
    case "mask":if(el.classList.contains("hid")){el.classList.remove("hid");el.removeAttribute("role");}break;
    case "tmode":S.tmode[el.dataset.t]=v;render();break;
    case "dtopic":S.dump={i:+v,text:"",checked:false,ticks:{}};render();break;
    case "dcheck":S.dump.checked=true;render();break;
    case "dreset":S.dump.checked=false;S.dump.ticks={};S.dump.text="";render();break;
    case "estart":{const pool=shuffle(BANK.filter(b=>S.ev.types[b.t]));const list=S.ev.n?pool.slice(0,S.ev.n):pool;
      list.sort((x,y)=>TYPES.findIndex(t=>t.k===x.t)-TYPES.findIndex(t=>t.k===y.t));startRun(list);break;}
    case "mcq":{const r=S.run,q=r.qs[r.i],i=+el.dataset.i;setRes(q.o[i].c?1:0,{pick:i,resp:q.o[i].t});break;}
    case "tf":{const r=S.run,q=r.qs[r.i],p=v==="true";setRes(p===q.a?1:0,{pick:p,resp:p?"True":"False"});break;}
    case "check":doCheck();break;
    case "override":{const r=S.run;r.res[r.i].score=TM[r.qs[r.i].t].m;render();break;}
    case "reveal":{const r=S.run;r.text[r.i]=$("#wtext").value;r.stage[r.i]=1;render();break;}
    case "wsave":{const r=S.run,q=r.qs[r.i],tk=r.ticks[r.i]||{};const got=q.pts.filter((_,i)=>tk[i]).length;setRes(Math.round(got/q.pts.length*TM[q.t].m*2)/2,{resp:r.text[r.i]||""});break;}
    case "next":{const r=S.run;if(r.i+1<r.qs.length){r.i++;render();window.scrollTo(0,0);}else{finishRun();render();window.scrollTo(0,0);}break;}
    case "retry":{const r=S.run;const list=r.qs.filter((q,i)=>(r.res[i]||{score:0}).score<TM[q.t].m);startRun(list);S.run.retry=true;break;}
    case "newtest":S.ev.view="setup";S.run=null;render();break;
    default:labClick(a,el,v);
  }
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.dataset.lsel){labSelect(el);return;}
  if(el.dataset.act==="etype"){S.ev.types[el.dataset.v]=el.checked?1:0;render();}
  else if(el.id==="en"){S.ev.n=+el.value;}
  else if(el.dataset.act==="ptick"){S.path.ticks[el.dataset.i]=el.checked;render();}
  else if(el.dataset.act==="dtick"){S.dump.ticks[el.dataset.i]=el.checked;render();}
  else if(el.dataset.act==="wtick"){const r=S.run;r.ticks[r.i]=r.ticks[r.i]||{};r.ticks[r.i][el.dataset.i]=el.checked;render();}
});
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.dataset&&el.dataset.cid){CS.src[el.dataset.cid]=el.value;return;}
  if(el.dataset&&el.dataset.iid){CS.inp[el.dataset.iid]=el.value;return;}
  if(el.dataset&&(el.dataset.lin||el.dataset.tcell!==undefined)){labInput(el);return;}
  if(el.id==="guess")S.cards.guess=el.value;
  else if(el.id==="pguess")S.path.guess=el.value;
  else if(el.id==="ptext")S.path.text=el.value;
  else if(el.id==="dtext")S.dump.text=el.value;
  else if(el.id==="ans"&&S.run)S.run.text[S.run.i]=el.value;
});
function doCheck(){
  const r=S.run,q=r.qs[r.i],v=($("#ans").value||"").trim();if(!v)return;
  r.text[r.i]=v;setRes((q.t==="calc"?matchCalc(v,q):matches(v,q.acc,q.all))?TM[q.t].m:0,{resp:v});
}
document.addEventListener("keydown",e=>{
  const t=e.target,tag=t.tagName;
  if(e.key==="Enter"&&t.id==="ans"){e.preventDefault();doCheck();return;}
  if(t.classList&&t.classList.contains("codearea")){
    if(e.key==="Tab"&&!e.shiftKey){e.preventDefault();const p=t.selectionStart;t.setRangeText("    ",p,t.selectionEnd,"end");CS.src[t.dataset.cid]=t.value;return;}
    if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)){e.preventDefault();const b=t.closest(".cw").parentElement.querySelector('[data-act="crun"],[data-act="fcheck"]');if(b)b.click();return;}
  }
  if(e.key==="Enter"&&t.id==="pguess2"){e.preventDefault();const b=document.querySelector('[data-act="pcheck2"]');if(b&&!b.disabled)b.click();return;}
  if((e.key==="Enter"||e.key===" ")&&t.classList&&t.classList.contains("hid")){e.preventDefault();t.click();return;}
  const inPath=S.tab==="learn"&&S.lv==="path"&&S.path.ph==="recall"&&S.path.q.length>0;
  const inCards=S.tab==="learn"&&S.lv==="cards"&&S.cards.queue.length>0;
  if(!(inPath||inCards)||tag==="INPUT"||tag==="TEXTAREA"||tag==="SELECT")return;
  const flipped=inPath?S.path.flip:S.cards.flip;
  if((e.key===" "||e.key==="Enter")&&tag!=="BUTTON"&&!flipped){e.preventDefault();if(inPath)S.path.flip=true;else S.cards.flip=true;render();}
  else if(flipped&&"123".includes(e.key)&&e.key){const m={"1":"miss","2":"almost","3":"got"};const b=document.querySelector('[data-act$="rate"][data-v="'+m[e.key]+'"]');if(b)b.click();}
});
render();
</script>

</body></html>
