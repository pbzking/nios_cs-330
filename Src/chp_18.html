const NOTES=[
["1.1 Constructors","A {{constructor}} is a special member function that is called {{automatically}} when an object of its class is created, so that every object begins in a valid, well-defined state. It has the {{same name}} as the class, has {{no return type}} (not even void), and is never called by name. A {{default constructor}} takes no parameters, or has a default value for every parameter. If a class defines {{no constructor}} the compiler supplies an implicit default constructor that leaves built-in members uninitialised; as soon as the programmer writes {{any}} constructor, the implicit one is no longer generated. A {{parameterized}} constructor takes arguments: Point p1(5, 10); or Point p2{20, 30};. The declaration Point p2(); declares a {{function}}, the {{most vexing parse}}; write Point p1; instead."],
["1.2 The member initializer list","A {{member initializer list}} follows the parameter list after a {{colon}}: Point(int a, int b) : x(a), y(b) {}. It is required for {{const}} members and {{reference}} members, and preferable for members that are {{objects}}, which would otherwise be default-built and then assigned. Members are initialised in the order they are {{declared in the class}}, not the order written in the list, so one initialiser must never depend on a later member. A member may also have an {{in-class default value}}, int value = 0;, used by any constructor that does not mention it."],
["1.3 The copy constructor","A {{copy constructor}} builds a new object as a copy of an existing object of the same class. Its parameter is a {{const reference}}: Point(const Point &source). The parameter must be a reference because a by-value parameter would need a copy to be called, which would call the copy constructor again, forever. If none is written the compiler generates a {{member-wise}} copy. It runs in three situations: initialising from another object at declaration, passing by {{value}}, and returning by {{value}}, where the copy is often {{elided}} (return value optimisation). {{Copy assignment}}, e = a; on an existing object, is a different event: no constructor runs. A member-wise copy of a pointer is a {{shallow}} copy; a hand-written copy that allocates new memory is a {{deep}} copy, needed to avoid {{double deletion}}. The {{Rule of Three}}: destructor, copy constructor and copy assignment go together."],
["1.4 Overloading, converting constructors and explicit","Constructors can be {{overloaded}}: several with different parameter lists, and the compiler picks one from the arguments. Default arguments can replace several overloads, but a no-argument constructor together with an all-defaults constructor makes Rectangle r; {{ambiguous}}. A constructor callable with a single argument is a {{converting constructor}}: Rectangle r = 5.0; is legal. Marking it {{explicit}} forbids the conversion, while direct construction Rectangle ok(5.0); stays legal. C++11 adds the {{delegating}} constructor (one constructor calls another), {{= default}} for the compiler's version, and {{= delete}} to forbid a function."],
["1.5 Destructors and the life cycle","A {{destructor}} is a special member function called automatically when an object's life ends: at the closing brace of a block for locals, at {{delete}} for dynamic objects, and at program end for {{global}} objects. Its name is a {{tilde}} followed by the class name; it has {{no parameters}} and no return type, so a class has exactly {{one}} destructor. An object passes through creation, usage and destruction. Local objects are destroyed in {{reverse}} order of creation, last in first out (LIFO). Global objects are built {{before}} main and destroyed {{after}} it; array elements are built in order and destroyed {{last first}}; member objects are built before the owner's body and destroyed after it."],
["1.6 RAII","{{RAII}}, Resource Acquisition Is Initialisation, ties a resource's lifetime to an object's lifetime: {{acquire}} the resource in the constructor and {{release}} it in the destructor. The release is guaranteed on every way out of the block, including an {{early return}} and an exception, so cleanup is automatic. A destructor is written only when the class {{owns}} something (memory, a file, a lock); a class holding only ordinary values needs none."],
["1.7 Objects, arrays of objects and functions","An {{array of objects}} such as Student students[3]; runs the {{default constructor}} once per element, so it is a compile error if the class has only parameterized constructors, unless every element is listed: Student s[3] = { Student(101), Student(102), Student(103) };. Passing an object {{by value}} runs the copy constructor and later the destructor; {{by reference}} and {{by const reference}} make no copy. Objects should be passed by {{const reference}} when only read. A function may return an object by value, but must never return a {{reference}} to a local object: it {{dangles}} because the local is destroyed on return."],
["1.8 The this pointer","Every non-static member function receives a hidden pointer {{this}} to the object it was called on; its type is {{ClassName *}}, so members are reached with {{->}}, and {{*this}} is the object itself. It resolves a naming conflict between a parameter and a member (this->x = x;), and it allows {{method chaining}}: a function that ends with return *this; and has return type {{Class&}} lets calls be chained. If the return type were Class (by value) each call would return a {{copy}}, and the rest of the chain would act on throwaway copies. A {{static}} member function has no this."],
["1.9 Static members and counting objects","A {{static}} data member is shared by every object and stored {{once}}. It is declared in the class and {{defined}} once outside it: int Widget::activeCount = 0; (or inline static since C++17). A {{static member function}} is called through the class name and can use only static members. A live-object counter increments in the {{constructor}} and decrements in the {{destructor}}. The compiler-generated copy constructor does not touch the counter, so a by-value copy is destroyed but never counted: the count goes wrong. The cure is a written {{copy constructor}} that increments the counter too. A static counter can also hand out {{unique ids}}, with a const member set in the initializer list."]
];

["Distinguish a default constructor from a parameterized constructor.","A default constructor takes no parameters (or has a default for every parameter) and gives every object the same starting state; the compiler supplies one only if the class defines no constructor. A parameterized constructor takes arguments so that different objects can start with different values, for example Point p1(5, 10). Once any constructor is written, the implicit default one disappears.",["Default takes no arguments","Parameterized takes arguments","Implicit default only if none written"]],
["Why must the copy constructor's parameter be a reference?","A copy constructor taking its argument by value would need a copy to be made in order to be called, which would call the copy constructor, which would need another copy, and so on forever. The compiler rejects such a declaration; the const merely promises not to modify the original.",["By value needs a copy","Infinite recursion","Rejected by compiler"]],
["Distinguish copy construction from copy assignment, with an example of each.","Copy construction creates a new object from an existing one, so a constructor runs: P b = a; Copy assignment copies into an object that already exists, so no constructor runs and the copy assignment operator does the work: P e; e = a; The test is whether the object on the left is being created on that very line.",["Construction creates a new object","Assignment on existing object","Example of each"]],
["Distinguish a shallow copy from a deep copy.","A shallow copy duplicates the pointer, so the original and the copy point at the same data; both destructors would release it (double deletion) and a change through one shows in the other. A deep copy, made by a written copy constructor, allocates new memory and copies the actual data, so the two objects are independent.",["Shallow copies the address","Same data shared","Deep copies the data","Independent objects"]],
["Why is the member initializer list required for const members?","A const member cannot be assigned in the constructor body, only initialised, and initialisation of members happens before the body runs, in the list. Reference members need it for the same reason: a reference must be bound when it is created.",["Cannot assign const","Initialisation happens in the list","References too"]],
["Why can a class not declare an array of objects if it has only parameterized constructors?","Student s[3]; must run a constructor with no arguments for each element, but once a parameterized constructor is written the compiler no longer supplies a default one, so no constructor matches. Either write a default constructor or list every element, Student s[3] = { Student(101), Student(102), Student(103) };",["Needs a default constructor","None supplied once another exists","Two cures"]],
["Why can a class have only one destructor, but many constructors?","A destructor has no parameters, so two versions could not be told apart by the compiler: it cannot be overloaded. Constructors may differ in their parameter lists and are chosen from the arguments at the declaration.",["Destructor has no parameters","No way to tell apart","Constructors overloaded"]],
["Why should Point p(); not be used to create an object?","C++ reads Point p(); as the declaration of a function called p that returns a Point, the most vexing parse, so no object is created. Write Point p; or, in C++11, Point p{};",["Function declaration","Most vexing parse","Write Point p;"]],
["Why must chaining functions return Class& rather than Class?","With a reference the function returns the same object, so the next call in the chain acts on it. By value each call returns a copy and the following calls change throwaway copies: b.add(5).multiply(3).add(2) gives 17 with references but only 5 with copies.",["Reference returns same object","By value returns copy","Example 17 versus 5"]],

["Explain constructors: the three characteristics, and the default, parameterized and copy constructors, with a class showing all three.","A constructor is a special member function called automatically when an object is created, to give it a valid starting state. Its three characteristics: it has the same name as the class, it has no return type at all (not even void), and it is called automatically at creation, never by name. A default constructor takes no arguments; the compiler supplies one only if the class defines none. A parameterized constructor takes arguments. A copy constructor takes a const reference to another object of the same class and builds a copy. Example: class Point { public: int x, y; Point() : x(0), y(0) {} Point(int a, int b) : x(a), y(b) {} Point(const Point &s) : x(s.x), y(s.y) {} }; Point p; Point q(5, 10); Point r = q; Point p2(); would declare a function, so it is avoided.",["Definition","Three characteristics","Default","Parameterized","Copy","Class example"]],
["Explain constructor overloading with a Rectangle class having three constructors, and show which is chosen for each declaration.","Constructors may be overloaded: several with different parameter lists, the compiler choosing from the arguments. class Rectangle { public: double length, width; Rectangle() { length = 1; width = 1; } Rectangle(double side) { length = side; width = side; } Rectangle(double l, double w) { length = l; width = w; } }; Rectangle r1; uses Rectangle() giving 1 x 1; Rectangle r2(5.0); uses Rectangle(double) giving 5 x 5; Rectangle r3(4.0, 6.0); uses Rectangle(double, double) giving 4 x 6. Default arguments can replace the three, but then adding Rectangle() as well makes Rectangle r; ambiguous.",["Overloading idea","Class with three","Each declaration","Ambiguity with defaults"]],
["Explain destructors: syntax, when they run, and the order of destruction, with a program and its output.","A destructor is a special member function that runs automatically when an object's life ends. Its name is a tilde and the class name, ~ClassName(); it has no parameters and no return type, so there is exactly one. It runs at the closing brace for a local object, at delete for a dynamic object and at program end for a global one. Local objects are destroyed in reverse order of creation (LIFO). Program: class T { public: int id; T(int i) : id(i) { cout << 'C' << id; } ~T() { cout << 'D' << id; } }; main: T a(1); { T b(2); T c(3); } T d(4); prints C1 C2 C3 D3 D2 C4 D4 D1.",["Syntax","When it runs","LIFO","Program","Output"]],
["Explain the life cycle of an object, and show with an example how the order of construction and destruction is last-in, first-out.","An object passes through creation (memory allocated and the constructor runs), usage (member functions are called, it may be passed and returned) and destruction (the destructor runs while the object is still intact, then memory is reclaimed). Local objects are destroyed in reverse order: with A a; B b; in main the output is A ctor, B ctor, B dtor, A dtor. Lifetimes nest like brackets: b lives entirely inside a, so it is born later and dies earlier. A global object is constructed before main and destroyed after it; array elements are built 0, 1, 2 and destroyed 2, 1, 0.",["Three phases","Destructor before reclaim","Reverse order example","Nested lifetimes","Global and array rules"]],
["Explain shallow and deep copy, the danger of double deletion and the Rule of Three.","The compiler's copy constructor copies each member. For a class holding a pointer to memory it owns, this duplicates the address, not the memory: a shallow copy, so both objects point at the same data. Both destructors then release the same block (double deletion, which corrupts the program) and changing the data through one object changes it in the other. The cure is a deep copy: a written copy constructor allocates new memory and copies the data into it. A class that needs a destructor because it owns a resource almost always also needs a copy constructor and a copy assignment operator: the Rule of Three.",["Shallow copy","Double deletion","Deep copy","Rule of Three"]],
["Explain RAII with a scope-guard class, and say why cleanup survives an early return.","RAII (Resource Acquisition Is Initialisation) ties a resource's lifetime to an object's: acquire in the constructor, release in the destructor. class Guard { const char *name; public: Guard(const char *n) : name(n) { cout << \"enter \" << name; } ~Guard() { cout << \"leave \" << name; } }; In int test(int k) { Guard g(\"test\"); if (k < 0) return -1; cout << \"working\"; return 1; } both calls print enter then leave, even the one that returns early, because the destructor of a local object runs however the block is left. Without RAII the programmer would have to write the release before every return, and one forgotten release leaks. The guarantee also holds when an exception leaves the function.",["Definition","Guard class","Early return","Leak without RAII","Exceptions"]]
];

function fnLex(src){
  const T=[],inc=[];let i=0,line=1;const n=src.length;
  const ops=["<<=",">>=","->","::","++","--","+=","-=","*=","/=","%=","==","!=","<=",">=","&&","||","<<",">>"];
  while(i<n){
    const c=src[i];
    if(c==="\n"){line++;i++;continue;}
    if(/\s/.test(c)){i++;continue;}
    if(c==="#"){let j=i;while(j<n&&src[j]!=="\n")j++;const m=/#\s*include\s*[<"]([\w.]+)[>"]/.exec(src.slice(i,j));if(m)inc.push(m[1].replace(/\.h$/,"").replace(/^(math|ctype|string|stdlib|time)$/,x=>x==="string"?"cstring":"c"+x));i=j;continue;}
    if(c==="/"&&src[i+1]==="/"){while(i<n&&src[i]!=="\n")i++;continue;}
    if(c==="/"&&src[i+1]==="*"){i+=2;while(i<n&&!(src[i]==="*"&&src[i+1]==="/")){if(src[i]==="\n")line++;i++;}i+=2;continue;}
    let m;
    if((m=/^(\d+\.\d*|\.\d+|\d+)([eE][+-]?\d+)?[fFlLuU]*/.exec(src.slice(i,i+40)))){const txt=m[1]+(m[2]||"");T.push({t:"num",v:parseFloat(txt),f:/[.eE]/.test(txt),line});i+=m[0].length;continue;}
    if(/[A-Za-z_]/.test(c)){let j=i;while(j<n&&/\w/.test(src[j]))j++;T.push({t:"id",v:src.slice(i,j),line});i=j;continue;}
    if(c==='"'){let j=i+1,s="";while(j<n&&src[j]!=='"'){if(src[j]==="\\"){const e=src[j+1];s+=e==="n"?"\n":e==="t"?"\t":e==="0"?"\0":e;j+=2;}else{if(src[j]==="\n")throw new FnErr("compile","Compile-time error (syntax)","Missing terminating \" character.",line);s+=src[j++];}}T.push({t:"str",v:s,line});i=j+1;continue;}
    if(c==="'"){let j=i+1,s="";if(src[j]==="\\"){const e=src[j+1];s=e==="n"?"\n":e==="t"?"\t":e==="0"?"\0":e;j+=2;}else s=src[j++];T.push({t:"chr",v:s.charCodeAt(0),line});i=j+1;continue;}
    let op=null;for(const o of ops)if(src.startsWith(o,i)){op=o;break;}
    if(!op)op=c;T.push({t:"op",v:op,line});i+=op.length;
  }
  // drop std:: prefixes and mark the next token
  const R=[];for(let k=0;k<T.length;k++){if(T[k].t==="id"&&T[k].v==="std"&&T[k+1]&&T[k+1].v==="::"){T[k+2].std=true;k+=1;continue;}R.push(T[k]);}
  R.push({t:"eof",v:"<end of file>",line});R.inc=inc;return R;
}

function runCpp(src,inp){
  const r=fnRun(src,(inp||"").replace(/\\n/g,"\n"));

/* ---------- Life-cycle tracer ---------- */
function traceRes(){
  const toks=L.tr.replace(/\{/g," { ").replace(/\}/g," } ").split(/[\s,]+/).filter(Boolean);
  if(!toks.length)return '<div class="rs bad">Enter object names separated by spaces, with { and } for blocks.</div>';
  const stack=[[]],rows=[];let depth=0,n=0;
  for(const t of toks){
    if(t==="{"){stack.push([]);depth++;continue;}
    if(t==="}"){if(stack.length===1)return '<div class="rs bad">A } has no matching {.</div>';const top=stack.pop();depth--;for(let i=top.length-1;i>=0;i--)rows.push([String(++n),top[i]+" destroyed","end of its block (reverse order)"]);continue;}
    if(!/^[A-Za-z_]\w*$/.test(t))return '<div class="rs bad">"'+esc(t)+'" is not an object name.</div>';
    stack[stack.length-1].push(t);rows.push([String(++n),t+" constructed","declaration reached"]);
  }
  if(stack.length>1)return '<div class="rs bad">A { has no matching }.</div>';
  const top=stack[0];for(let i=top.length-1;i>=0;i--)rows.push([String(++n),top[i]+" destroyed","end of main (reverse order)"]);
  return '<div class="rs ok"><b>Every constructor is matched by a destructor, in last-in first-out order.</b></div>'+tbl(["Step","Event","When"],rows);
}

  }else if(P.ph==="learn"){
    const ids=chunks[P.ch],id=ids[P.i],k=CARDS[id];
    h+=`<div class="panel fc"><div class="lab">Round ${P.ch+1} of ${N} · Learn · card ${P.i+1} of ${ids.length} · ${id<ORIG?"Core":"Detail"}</div><div class="q">${esc(k[1])}</div><div class="lab">Answer</div><div class="a">${esc(k[2])}</div><p class="hint">Read it, say it back in your own words, then move on.</p><div class="row"><button class="btn" data-act="plback"${P.i?"":" disabled"}>Back</button><button class="btn primary" data-act="plnext">${P.i+1<ids.length?"Next card":"Now recall these "+ids.length}</button></div></div>`;
  }else if(P.ph==="recall"){
    const id=P.q[0],k=CARDS[id];
    h+=`<div class="panel fc"><div class="lab">Round ${P.ch+1} of ${N} · Recall · ${P.q.length} left</div><div class="q">${esc(k[1])}</div><input type="text" id="pguess" placeholder="Type what you remember (optional)" value="${esc(P.guess)}" autocomplete="off">`;
    if(!P.flip)h+='<div class="row"><button class="btn primary" data-act="pflip">Show answer</button><span class="hint">or press Space</span></div>';
    else h+=`<div class="lab">Answer</div><div class="a">${esc(k[2])}</div><div class="row"><button class="btn bad" data-act="prate" data-v="miss">Missed it (1)</button><button class="btn warn" data-act="prate" data-v="almost">Almost (2)</button><button class="btn good" data-act="prate" data-v="got">Got it (3)</button></div>`;
    h+="</div>";
  }else if(P.ph==="roundend"){
    const last=P.ch+1>=N;
    h+=`<div class="panel"><h3>Round ${P.ch+1} done</h3><p>${last?"That was the last round of cards. Two short exercises remain: fill the gaps in the summary, then a brain dump.":"Next you will see "+chunks[P.ch+1].length+" new cards."}</p><div class="row"><button class="btn primary" data-act="pnext">${last?"Fill the gaps":"Start round "+(P.ch+2)}</button></div></div>`;
  }else if(P.ph==="gaps"){
    h+='<p class="hint">Say each hidden term aloud before you tap it.</p><div class="row"><button class="btn" data-act="revall">Reveal all</button><button class="btn" data-act="hideall">Hide all</button></div>';
    st.notes.forEach(ni=>{const n=NOTES[ni];h+=`<div class="panel note"><h3>${esc(n[0])}</h3><p>${blankHtml(n[1])}</p></div>`;});
    h+='<div class="row"><button class="btn primary" data-act="pdump">Continue to brain dump</button></div>';
  }else if(P.ph==="dump"){
    const pts=[];st.dump.forEach(d=>DUMPS[d].p.forEach(p=>pts.push(p)));
    h+=`<div class="panel"><h3>Brain dump</h3><p class="hint">Close everything and write what you remember about this step. Then compare.</p><textarea id="ptext" placeholder="Write it in your own words...">${esc(P.text)}</textarea>`;
    if(!P.dchecked)h+='<div class="row"><button class="btn primary" data-act="pcheck">Compare with key points</button></div>';
    else{const got=pts.filter((_,i)=>P.ticks[i]).length;
      h+=`<div class="lab">Tick what you included</div><div class="pts">${pts.map((p,i)=>`<label><input type="checkbox" data-act="ptick" data-i="${i}"${P.ticks[i]?" checked":""}><span>${esc(p)}</span></label>`).join("")}</div><div class="row"><b>${got} of ${pts.length} covered</b><button class="btn primary" data-act="pfinish">Finish this step</button></div>`;}
    h+="</div>";
  }else{
    const ids=stepIds(st),m=ids.filter(i=>(store.box[i]||0)>=2).length;
    h+=`<div class="panel"><h3>Step ${P.step+1} complete</h3><p>${m} of ${ids.length} cards in this step are at Review or Mastered. The rest keep coming back in Recall cards.</p><div class="row">${P.step+1<STEPS.length?`<button class="btn primary" data-act="pnextstep">Next: ${esc(STEPS[P.step+1].t)}</button>`:""}<button class="btn" data-act="pback">All steps</button></div></div>`;
  }
  return '<div style="display:flex;flex-direction:column;gap:16px">'+h+"</div>";
}

/* ============ EVALUATE ============ */
function countOf(k){return BANK.filter(b=>b.t===k).length;}
function viewEval(){
  if(S.ev.view==="setup")return evalSetup();
  if(S.ev.view==="quiz")return evalQuiz();
  return evalResult();
}
function evalSetup(){
  let h='<div class="panel"><h2>Build a test</h2><p class="hint">Choose the question types. Written answers (short, long, scenario) are self-marked against the key points, like checking your own paper.</p><div style="display:flex;flex-direction:column;gap:8px">';
  TYPES.forEach(t=>{h+=`<div class="tcount"><label><input type="checkbox" data-act="etype" data-v="${t.k}"${S.ev.types[t.k]?" checked":""}><span>${esc(t.n)}</span></label><span class="n">${countOf(t.k)} Qs · ${t.m} mark${t.m>1?"s":""} each</span></div>`;});
  const pool=BANK.filter(b=>S.ev.types[b.t]).length;
  h+=`</div><div class="row"><label for="en" class="lab">Length</label><select id="en" style="width:auto"><option value="10"${S.ev.n==10?" selected":""}>10 questions</option><option value="20"${S.ev.n==20?" selected":""}>20 questions</option><option value="35"${S.ev.n==35?" selected":""}>35 questions</option><option value="0"${S.ev.n==0?" selected":""}>Everything selected (${pool})</option></select></div><div class="row"><button class="btn primary" data-act="estart"${pool?"":" disabled"}>Start test</button></div></div>`;
  if(store.hist.length){
    h+='<div class="panel"><h3>Recent tests</h3>'+store.hist.slice(0,6).map(x=>`<div class="row" style="justify-content:space-between"><span>${esc(x.d)} · ${x.n} questions</span><b>${x.pct}%</b></div>`).join("")+"</div>";
  }
  return '<div style="display:flex;flex-direction:column;gap:18px">'+h+"</div>";
}
function startRun(list){
  const qs=list.map(q=>q.t==="mcq"?Object.assign({},q,{o:shuffle(q.opts.map((t,i)=>({t:t,c:i===q.a})))}):q);
  S.run={qs:qs,i:0,res:[],stage:[],ticks:[],text:[]};S.ev.view="quiz";render();window.scrollTo(0,0);
}
function evalQuiz(){
  const r=S.run,q=r.qs[r.i],res=r.res[r.i],T=TM[q.t];
  let h=`<div class="panel"><div class="row" style="justify-content:space-between"><span class="tag">${esc(T.n)}</span><span class="lab">Question ${r.i+1} of ${r.qs.length} · ${T.m} mark${T.m>1?"s":""}</span></div><div class="bar" aria-hidden="true"><i style="width:${Math.round(r.i/r.qs.length*100)}%"></i></div>`;
  h+=`<h3 style="font-size:1.2rem;line-height:1.35">${esc(q.t==="fill"?q.q.replace("___","_______"):q.q)}</h3>`;
  if(q.t==="calc"&&q.src)h+='<pre class="codeview">'+esc(q.src)+'</pre>';
  if(q.t==="mcq"){
    h+='<div class="opts">'+q.o.map((o,i)=>{let c="opt";if(res){if(o.c)c+=" right";else if(res.pick===i)c+=" wrong";}return `<button class="${c}" data-act="mcq" data-i="${i}"${res?" disabled":""}>${esc(o.t)}</button>`;}).join("")+"</div>";
    if(res)h+=`<div class="fb ${res.score?"ok":"no"}"><b>${res.score?"Correct.":"Not quite."}</b> ${esc(q.e)}</div>`;
  }else if(q.t==="tf"){
    h+='<div class="opts">'+[true,false].map(v=>{let c="opt";if(res){if(q.a===v)c+=" right";else if(res.pick===v)c+=" wrong";}return `<button class="${c}" data-act="tf" data-v="${v}"${res?" disabled":""}>${v?"True":"False"}</button>`;}).join("")+"</div>";
    if(res)h+=`<div class="fb ${res.score?"ok":"no"}"><b>${res.score?"Correct.":"Not quite."}</b> ${esc(q.e)}</div>`;
  }else if(q.t==="fill"||q.t==="vsa"||q.t==="calc"){
    h+=`<input type="text" id="ans" autocomplete="off" placeholder="Type your answer" value="${esc(r.text[r.i]||"")}"${res?" disabled":""}>`;
    if(!res)h+='<div class="row"><button class="btn primary" data-act="check">Check</button></div>';
    else{
      h+=`<div class="fb ${res.score?"ok":"no"}"><b>${res.score?"Correct.":"Model answer:"}</b> ${res.score?"":esc(q.model)} ${q.e?esc(q.e):""}</div>`;
      if(!res.score)h+='<div class="row"><button class="btn" data-act="override">I was right, count it</button></div>';
    }
  }else{
    const st=r.stage[r.i]||0;
    h+=`<textarea id="wtext" placeholder="Write your answer as you would in the exam..."${st?" disabled":""}>${esc(r.text[r.i]||"")}</textarea>`;
    if(!st)h+='<div class="row"><button class="btn primary" data-act="reveal">Show model answer</button></div>';
    else{
      const tk=r.ticks[r.i]||{};const got=q.pts.filter((_,i)=>tk[i]).length;
      h+=`<div class="lab">Model answer</div><div class="a" style="border-left:3px solid var(--accent);padding-left:14px">${esc(q.model)}</div><div class="lab">Tick every marking point your answer made</div><div class="pts">`+q.pts.map((p,i)=>`<label><input type="checkbox" data-act="wtick" data-i="${i}"${tk[i]?" checked":""}${res?" disabled":""}><span>${esc(p)}</span></label>`).join("")+"</div>";
      if(!res)h+=`<div class="row"><button class="btn primary" data-act="wsave">Save score (${fmt(got/q.pts.length*T.m)} of ${T.m})</button></div>`;
      else h+=`<div class="fb ${res.score>=T.m?"ok":"no"}">Scored ${fmt(res.score)} of ${T.m}.</div>`;
    }
  }
  if(res){h+=`<div class="row"><button class="btn primary" data-act="next">${r.i+1<r.qs.length?"Next question":"See results"}</button></div>`;}
  return h+"</div>";
}
function fmt(x){return (Math.round(x*2)/2).toString();}
function setRes(score,extra){const r=S.run,q=r.qs[r.i];r.res[r.i]=Object.assign({score:score,max:TM[q.t].m},extra||{});render();}
function evalResult(){
  const r=S.run;let sc=0,mx=0;const by={};
  r.qs.forEach((q,i)=>{const x=r.res[i]||{score:0,max:TM[q.t].m};sc+=x.score;mx+=x.max;const b=by[q.t]||(by[q.t]={s:0,m:0,n:0});b.s+=x.score;b.m+=x.max;b.n++;});
  const pct=Math.round(sc/mx*100);
  const msg=pct>=85?"Exam ready on this material.":pct>=65?"Solid. Revisit the misses below.":pct>=40?"Getting there. Use the Learn section on the weak topics.":"Go back to the recall cards, then try again.";
  let h=`<div class="panel"><div class="lab">Result</div><div class="score">${fmt(sc)} / ${mx} <span style="font-size:1.5rem;color:var(--muted)">${pct}%</span></div><p>${msg}</p><div style="display:flex;flex-direction:column;gap:10px">`;
  TYPES.forEach(t=>{const b=by[t.k];if(!b)return;const p=Math.round(b.s/b.m*100);h+=`<div><div class="row" style="justify-content:space-between"><span>${esc(t.n)} (${b.n})</span><b>${fmt(b.s)}/${b.m}</b></div><div class="bar"><i style="width:${p}%"></i></div></div>`;});
  const missed=r.qs.filter((q,i)=>(r.res[i]||{score:0}).score<TM[q.t].m).length;
  h+=`</div><div class="row">${missed?`<button class="btn primary" data-act="retry">Retry the ${missed} missed</button>`:""}<button class="btn" data-act="newtest">New test</button></div></div>`;
  h+="<h2>Review</h2>";
  r.qs.forEach((q,i)=>{const x=r.res[i]||{score:0,max:TM[q.t].m};const ok=x.score>=x.max;
    let ans=q.t==="mcq"?q.opts[q.a]:q.t==="tf"?(q.a?"True":"False"):q.model;
    h+=`<div class="rev ${ok?"ok":"bad"}"><div class="lab">${esc(TM[q.t].n)} · ${fmt(x.score)}/${x.max}</div><b>${esc(q.q)}</b>${x.resp?`<div class="r">You: ${esc(x.resp)}</div>`:""}<div class="r">${ok?"":"Answer: "}${esc(ans)}</div></div>`;});
  return '<div style="display:flex;flex-direction:column;gap:14px">'+h+"</div>";
}
function finishRun(){
  const r=S.run;let sc=0,mx=0;r.qs.forEach((q,i)=>{const x=r.res[i]||{score:0,max:TM[q.t].m};sc+=x.score;mx+=x.max;});
  if(!r.retry){store.hist.unshift({d:new Date().toLocaleDateString(undefined,{day:"numeric",month:"short"}),pct:Math.round(sc/mx*100),n:r.qs.length});store.hist=store.hist.slice(0,8);save();}
  S.ev.view="result";
}

/* ============ EVENTS ============ */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");if(!el)return;
  const a=el.dataset.act,v=el.dataset.v;
  switch(a){
    case "tab":S.tab=v;render();break;
    case "lv":S.lv=v;render();break;
    case "csec":S.cards.sec=+v;buildQueue();render();break;
    case "flip":S.cards.flip=true;render();break;
    case "cnext":buildQueue();render();break;
    case "creset":CARDS.forEach((k,i)=>{if(S.cards.sec<0||k[0]===S.cards.sec)delete store.box[i];});save();buildQueue();render();break;
    case "rate":{const q=S.cards.queue,id=q.shift();let b=store.box[id]||0;
      if(v==="miss"){b=1;q.splice(Math.min(3,q.length),0,id);}
      else if(v==="almost"){b=Math.max(b,1);q.push(id);}
      else{b=b<2?2:3;S.cards.done++;}
      store.box[id]=b;save();S.cards.flip=false;S.cards.guess="";render();break;}
    case "cord":S.cards.ordered=v==="1";buildQueue();render();break;
    case "pstep":openStep(+v);break;
    case "pback":S.path.step=null;render();window.scrollTo(0,0);break;
    case "pnotes":S.path.ph="primer";render();window.scrollTo(0,0);break;
    case "pstart":S.path.ph="learn";S.path.i=0;render();break;
    case "plback":if(S.path.i>0)S.path.i--;render();break;
    case "plnext":{const P=S.path,ids=stepChunks(STEPS[P.step])[P.ch];
      if(P.i+1<ids.length)P.i++;else{P.ph="recall";P.q=shuffle(ids.slice());P.flip=false;P.guess="";}
      render();break;}
    case "pflip":S.path.flip=true;render();break;
    case "prate":{const P=S.path;applyRate(P.q,v);P.flip=false;P.guess="";
      if(!P.q.length){store.path.ch[P.step]=P.ch+1;save();P.ph="roundend";}
      render();break;}
    case "pnext":{const P=S.path,N=stepChunks(STEPS[P.step]).length;
      if(P.ch+1<N){P.ch++;P.ph="learn";P.i=0;}else P.ph="gaps";
      render();window.scrollTo(0,0);break;}
    case "pdump":S.path.ph="dump";render();window.scrollTo(0,0);break;
    case "pcheck":{const t=$("#ptext");if(t)S.path.text=t.value;S.path.dchecked=true;render();break;}
    case "pfinish":store.path.done[S.path.step]=true;save();S.path.ph="done";render();window.scrollTo(0,0);break;
    case "pnextstep":openStep(S.path.step+1);break;
    case "blank":el.classList.toggle("on");break;
    case "revall":document.querySelectorAll(".blank").forEach(b=>b.classList.add("on"));break;
    case "hideall":document.querySelectorAll(".blank").forEach(b=>b.classList.remove("on"));break;
    case "mask":if(el.classList.contains("hid")){el.classList.remove("hid");el.removeAttribute("role");}break;
    case "tmode":S.tmode[el.dataset.t]=v;render();break;
    case "dtopic":S.dump={i:+v,text:"",checked:false,ticks:{}};render();break;
    case "dcheck":S.dump.checked=true;render();break;
    case "dreset":S.dump.checked=false;S.dump.ticks={};S.dump.text="";render();break;
    case "estart":{const pool=shuffle(BANK.filter(b=>S.ev.types[b.t]));const list=S.ev.n?pool.slice(0,S.ev.n):pool;
      list.sort((x,y)=>TYPES.findIndex(t=>t.k===x.t)-TYPES.findIndex(t=>t.k===y.t));startRun(list);break;}
    case "mcq":{const r=S.run,q=r.qs[r.i],i=+el.dataset.i;setRes(q.o[i].c?1:0,{pick:i,resp:q.o[i].t});break;}
    case "tf":{const r=S.run,q=r.qs[r.i],p=v==="true";setRes(p===q.a?1:0,{pick:p,resp:p?"True":"False"});break;}
    case "check":doCheck();break;
    case "override":{const r=S.run;r.res[r.i].score=TM[r.qs[r.i].t].m;render();break;}
    case "reveal":{const r=S.run;r.text[r.i]=$("#wtext").value;r.stage[r.i]=1;render();break;}
    case "wsave":{const r=S.run,q=r.qs[r.i],tk=r.ticks[r.i]||{};const got=q.pts.filter((_,i)=>tk[i]).length;setRes(Math.round(got/q.pts.length*TM[q.t].m*2)/2,{resp:r.text[r.i]||""});break;}
    case "next":{const r=S.run;if(r.i+1<r.qs.length){r.i++;render();window.scrollTo(0,0);}else{finishRun();render();window.scrollTo(0,0);}break;}
    case "retry":{const r=S.run;const list=r.qs.filter((q,i)=>(r.res[i]||{score:0}).score<TM[q.t].m);startRun(list);S.run.retry=true;break;}
    case "newtest":S.ev.view="setup";S.run=null;render();break;
    default:labClick(a,el,v);
  }
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.dataset.lsel){labSelect(el);return;}
  if(el.dataset.act==="etype"){S.ev.types[el.dataset.v]=el.checked?1:0;render();}
  else if(el.id==="en"){S.ev.n=+el.value;}
  else if(el.dataset.act==="ptick"){S.path.ticks[el.dataset.i]=el.checked;render();}
  else if(el.dataset.act==="dtick"){S.dump.ticks[el.dataset.i]=el.checked;render();}
  else if(el.dataset.act==="wtick"){const r=S.run;r.ticks[r.i]=r.ticks[r.i]||{};r.ticks[r.i][el.dataset.i]=el.checked;render();}
});
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.dataset&&el.dataset.cid){CS.src[el.dataset.cid]=el.value;return;}
  if(el.dataset&&el.dataset.iid){CS.inp[el.dataset.iid]=el.value;return;}
  if(el.dataset&&(el.dataset.lin||el.dataset.tcell!==undefined)){labInput(el);return;}
  if(el.id==="guess")S.cards.guess=el.value;
  else if(el.id==="pguess")S.path.guess=el.value;
  else if(el.id==="ptext")S.path.text=el.value;
  else if(el.id==="dtext")S.dump.text=el.value;
  else if(el.id==="ans"&&S.run)S.run.text[S.run.i]=el.value;
});
function doCheck(){
  const r=S.run,q=r.qs[r.i],v=($("#ans").value||"").trim();if(!v)return;
  r.text[r.i]=v;setRes((q.t==="calc"?matchCalc(v,q):matches(v,q.acc,q.all))?TM[q.t].m:0,{resp:v});
}
document.addEventListener("keydown",e=>{
  const t=e.target,tag=t.tagName;
  if(e.key==="Enter"&&t.id==="ans"){e.preventDefault();doCheck();return;}
  if(t.classList&&t.classList.contains("codearea")){
    if(e.key==="Tab"&&!e.shiftKey){e.preventDefault();const p=t.selectionStart;t.setRangeText("    ",p,t.selectionEnd,"end");CS.src[t.dataset.cid]=t.value;return;}
    if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)){e.preventDefault();const b=t.closest(".cw").parentElement.querySelector('[data-act="crun"],[data-act="fcheck"]');if(b)b.click();return;}
  }
  if(e.key==="Enter"&&t.id==="pguess2"){e.preventDefault();const b=document.querySelector('[data-act="pcheck2"]');if(b&&!b.disabled)b.click();return;}
  if((e.key==="Enter"||e.key===" ")&&t.classList&&t.classList.contains("hid")){e.preventDefault();t.click();return;}
  const inPath=S.tab==="learn"&&S.lv==="path"&&S.path.ph==="recall"&&S.path.q.length>0;
  const inCards=S.tab==="learn"&&S.lv==="cards"&&S.cards.queue.length>0;
  if(!(inPath||inCards)||tag==="INPUT"||tag==="TEXTAREA"||tag==="SELECT")return;
  const flipped=inPath?S.path.flip:S.cards.flip;
  if((e.key===" "||e.key==="Enter")&&tag!=="BUTTON"&&!flipped){e.preventDefault();if(inPath)S.path.flip=true;else S.cards.flip=true;render();}
  else if(flipped&&"123".includes(e.key)&&e.key){const m={"1":"miss","2":"almost","3":"got"};const b=document.querySelector('[data-act$="rate"][data-v="'+m[e.key]+'"]');if(b)b.click();}
});
render();
</script>

</body></html>
