  else if(S.lv==="cards")h+=viewCards();
  else if(S.lv==="cloze")h+=viewCloze();
  else if(S.lv==="cover")h+=viewCover();
  else if(S.lv==="lab")h+=labView();
  else h+=viewDump();
  return '<div style="display:flex;flex-direction:column;gap:18px">'+h+"</div>";
}
function secCounts(){
  const c=[0,0,0,0];
  CARDS.forEach((k,i)=>{if(S.cards.sec<0||k[0]===S.cards.sec)c[store.box[i]||0]++;});return c;
}
function viewCards(){
  const c=secCounts(),tot=c[0]+c[1]+c[2]+c[3];
  let h='<p class="hint">Read the question, answer in your head or in the box, then flip. Rate honestly. Missed cards come back within a few cards; a card is mastered after two confident passes in separate sessions.</p>';
  h+='<div class="subnav">'+['<button class="chip" data-act="csec" data-v="-1" aria-pressed="'+(S.cards.sec<0)+'">All topics</button>'].concat(SECS.map((s,i)=>`<button class="chip" data-act="csec" data-v="${i}" aria-pressed="${S.cards.sec===i}">${esc(s)}</button>`)).join("")+"</div>";
  h+=`<div class="subnav"><button class="chip" data-act="cord" data-v="0" aria-pressed="${!S.cards.ordered}">Shuffled</button><button class="chip" data-act="cord" data-v="1" aria-pressed="${S.cards.ordered}">Chapter order</button></div>`;
  h+=`<div class="stats"><div class="stat"><b>${c[0]}</b><span>New</span></div><div class="stat"><b>${c[1]}</b><span>Learning</span></div><div class="stat"><b>${c[2]}</b><span>Review</span></div><div class="stat"><b>${c[3]}</b><span>Mastered</span></div></div>`;
  h+=`<div class="bar" aria-hidden="true"><i style="width:${tot?Math.round(c[3]/tot*100):0}%"></i></div>`;
  const q=S.cards.queue;
  if(!q.length){
    h+=`<div class="panel"><h3>${c[3]===tot?"Every card in this set is mastered":"Session complete"}</h3><p class="hint">${S.cards.done} cards rated this session.</p><div class="row"><button class="btn primary" data-act="cnext">Start another round</button><button class="btn" data-act="creset">Reset progress for this set</button></div></div>`;
    return h;
  }
  const id=q[0],k=CARDS[id];
  h+=`<div class="panel fc"><div class="lab">Question · ${esc(SECS[k[0]])} · ${q.length} left</div><div class="q">${esc(k[1])}</div>`;
  h+=`<input type="text" id="guess" placeholder="Type what you remember (optional)" value="${esc(S.cards.guess)}" autocomplete="off">`;
  if(!S.cards.flip){h+='<div class="row"><button class="btn primary" data-act="flip">Show answer</button><span class="hint">or press Space</span></div>';}
  else{
    h+=`<div class="lab">Answer</div><div class="a">${esc(k[2])}</div><div class="row"><button class="btn bad" data-act="rate" data-v="miss">Missed it (1)</button><button class="btn warn" data-act="rate" data-v="almost">Almost (2)</button><button class="btn good" data-act="rate" data-v="got">Got it (3)</button></div>`;
  }
  return h+"</div>";
}
function viewCloze(){
  let h='<p class="hint">Read each passage and say the hidden term aloud before you tap it. Tap again to hide it.</p><div class="row"><button class="btn" data-act="revall">Reveal all</button><button class="btn" data-act="hideall">Hide all</button></div>';
  NOTES.forEach(n=>{
    const body=esc(n[1]).replace(/\{\{(.+?)\}\}/g,(m,a)=>`<button class="blank" data-act="blank" style="min-width:${Math.max(4,a.length)}ch" aria-label="Hidden term, press to reveal"><span class="ans">${a}</span></button>`);
    h+=`<div class="panel note"><h3>${esc(n[0])}</h3><p>${body}</p></div>`;
  });
  return h;
}
function viewCover(){
  let h='<p class="hint">Cover the answers, say what belongs in each cell, then tap it to check. Switch the mask to quiz yourself from the other direction.</p>';
  TABLES.forEach((t,ti)=>{
    const m=S.tmode[ti]||"a";
    h+=`<div class="panel"><div class="row" style="justify-content:space-between"><h3>${esc(t.t)}</h3><div class="subnav"><button class="chip" data-act="tmode" data-t="${ti}" data-v="a" aria-pressed="${m==="a"}">Hide answers</button><button class="chip" data-act="tmode" data-t="${ti}" data-v="b" aria-pressed="${m==="b"}">Hide first column</button><button class="chip" data-act="tmode" data-t="${ti}" data-v="o" aria-pressed="${m==="o"}">Show all</button></div></div><div class="tbl"><table><thead><tr>${t.c.map(c=>`<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>`;
    t.r.forEach(r=>{h+="<tr>"+r.map((c,ci)=>{const hid=(m==="a"&&ci>0)||(m==="b"&&ci===0);return `<td><span class="m${hid?" hid":""}" data-act="mask"${hid?' tabindex="0" role="button" aria-label="Hidden, press to reveal"':""}>${esc(c)}</span></td>`;}).join("")+"</tr>";});
    h+="</tbody></table></div></div>";
  });
  return h;
}
function viewDump(){
  const d=DUMPS[S.dump.i];
  let h='<p class="hint">Pick a topic and write everything you can remember with the chapter closed. Then compare against the key points and tick what you covered. The unticked points are your study list.</p>';
  h+='<div class="subnav">'+DUMPS.map((x,i)=>`<button class="chip" data-act="dtopic" data-v="${i}" aria-pressed="${S.dump.i===i}">${esc(x.t)}</button>`).join("")+"</div>";
  h+=`<div class="panel"><h3>${esc(d.t)}</h3><label class="lab" for="dtext">Your recall</label><textarea id="dtext" placeholder="Write it all out, in your own words...">${esc(S.dump.text)}</textarea>`;
  if(!S.dump.checked){h+='<div class="row"><button class="btn primary" data-act="dcheck">Compare with key points</button></div>';}
  else{
    const n=d.p.length,got=d.p.filter((_,i)=>S.dump.ticks[i]).length;
    h+=`<div class="lab">Tick what you included</div><div class="pts">`+d.p.map((p,i)=>`<label><input type="checkbox" data-act="dtick" data-i="${i}"${S.dump.ticks[i]?" checked":""}><span>${esc(p)}</span></label>`).join("")+`</div><div class="row"><b>${got} of ${n} covered</b><button class="btn" data-act="dreset">Try again</button></div>`;
  }
  return h+"</div>";
}

{t:"Programming basics",sec:[0],notes:[0],dump:[0],blocks:[
 {h:"Program and software",d:"A program is a finite, ordered sequence of instructions, written in a programming language, that directs a computer to perform one specific, well-defined task.",p:["Software, as defined in Lesson 3, is the broader term: a complete, integrated collection of programs together with supporting data files, documentation and configuration that provides a full set of capabilities to a user. Software is what is installed, distributed and sold; programs are the executable components from which it is built.","Example: a calculator that adds two numbers, a function that sorts a list and a script that renames files are programs. Microsoft Word is software, built from thousands of individual programs and modules working together."]},
 {h:"Programming",d:"Programming is the mechanism by which human intent becomes computer action.",p:["The computer is entirely passive: it does exactly, and only, what it is told. Every piece of software in existence, from an operating system to a console game, was created by programming. Learning to program turns a computer from something that is consumed into something that can be directed."]},
 {h:"Languages and their generations",p:["Lesson 3 traced programming languages through five generations, each more abstract than the last."],l:["First and second generation (machine language and assembly language): work at the level of binary instructions and processor mnemonics; powerful but laborious and error-prone.","Third generation: high-level languages such as C, C++, Java and Python use human-readable syntax and hide the hardware.","Fourth generation: languages such as SQL let the programmer declare what result is wanted rather than how to compute it.","C++ is a third-generation language that unusually keeps a door open to the lower levels beneath it."]},
 {h:"Why C++",p:["C++ is high-level, supporting structured and object-oriented programming with readable syntax, yet it also provides capabilities that most high-level languages deliberately hide: direct memory manipulation, hardware access and fine control over system resources. The same language can therefore write an operating system kernel (low level) or a three-dimensional game with a rich graphical interface (high level), sometimes within a single program.","Because the programmer controls precisely how memory and the processor are used, compiled C++ executes at speeds approaching hand-written assembly language. That performance, combined with its flexibility, makes C++ the language of choice wherever raw speed matters.","Exam point: 'Why is C++ called a middle-level language?' It combines high-level features (readable syntax, classes, templates) with low-level features (pointers, direct memory and hardware access) in one language, rather than belonging wholly to either camp."]},
 {h:"Applications of C++",t:T[0]},
 {h:"Features of C++",p:["Paradigm (Lesson 3) describes how a program is structured, separately from generation. C++ is a third-generation language that supports both procedural and object-oriented paradigms at once."],t:T[1]},
 {h:"Advantages and limitations",l:["Advantage: unmatched performance among high-level languages.","Advantage: spans high-level object-oriented design down to low-level hardware work.","Advantage: portability, so one source runs on many platforms.","Advantage: an ecosystem of libraries and tools covering almost any need, and decades of industrial use that built a vast community.","Limitation: considerably harder to learn than many modern languages, and its syntax has accumulated complexity over decades.","Limitation: manual memory management with pointers and dynamic allocation introduces whole classes of bug (dangling pointers, memory leaks, buffer overflows) that languages with automatic memory management eliminate.","Limitation: more verbose than Python or Java, and the compilation step slows the edit-and-test cycle compared with interpreted languages (Lesson 3).","Consequently C++ is a poor fit for rapid prototyping, scripting and web development, where development speed matters more than execution speed."]}
]},
{t:"History of C++",sec:[1],notes:[1],dump:[1],blocks:[
 {h:"Evolution from C",l:["C was created by Dennis Ritchie at Bell Labs between 1969 and 1973, chiefly to rewrite the Unix operating system, which had been written in assembly language, in something more portable and maintainable.","It delivered the efficiency and hardware access of assembly with the structure and readability of a high-level language, and became the lingua franca of systems programming.","By the early 1980s, growing software complexity demanded better tools for organising large codebases. Object-oriented programming, which organises code around objects that combine data with the functions acting on it, showed great promise, but adopting it in C needed awkward workarounds and carried performance costs."]},
 {h:"Bjarne Stroustrup and C with Classes",l:["Bjarne Stroustrup, a Danish computer scientist at Bell Labs (the same institution where C was born), began developing C++ in 1979.","His first project, C with Classes, extended C with class definitions, basic inheritance and function inlining, borrowing ideas from Simula, a pioneering object-oriented language of the 1960s that had shaped his doctoral research.","His central insight was that the organisational power of object-oriented programming could be added to C without sacrificing the speed and low-level control that made C valuable.","The language was renamed C++ in 1983. The name is a programmer's joke: ++ is C's increment operator, so 'C++' reads as 'C, incremented', an improved C, while still marking it as a distinct language. (A pedantic point: the value of the postfix increment is the old one, so strictly 'C++' still evaluates to plain C. The postfix-versus-prefix distinction is what makes the joke slightly wrong.)","The first commercial C++ compiler appeared in 1985, the same year Stroustrup published the first edition of The C++ Programming Language, which became the definitive reference."]},
 {h:"Standardisation",p:["As C++ spread, compilers from different vendors began implementing it with subtle differences, harming portability. ANSI and ISO jointly undertook its standardisation, producing C++98 (formally ISO/IEC 14882:1998), a single authoritative definition of the syntax, semantics and standard library. This is a direct example of the open-standards process described in Lesson 11: a body (ISO) publishing a specification so that independent compiler writers produce compatible implementations.","For the NIOS Computer Science curriculum, C++98 and C++11 features are the most relevant."],t:{c:["Standard","Year","Significance"],r:T[2].r.map(r=>r)}},
 {h:"Exam point: dates and names",p:["C by Dennis Ritchie (1969-1973, Bell Labs); C++ by Bjarne Stroustrup (from 1979 as C with Classes, renamed 1983, first commercial compiler 1985); first standard C++98; landmark revision C++11. Both languages were born at the same institution, Bell Labs."]}
]},
{t:"Development environment",sec:[2],notes:[2],dump:[2],blocks:[
 {h:"Overview",d:"A development environment is the set of tools needed to write, translate and run programs.",p:["Understanding it explains the nature of errors, the role of each tool and how to organise a workflow. This section makes the compiler, linker and loader of Lesson 3 concrete for one language."]},
 {h:"Source code",p:["A C++ program begins as source code: human-readable text, written in an editor or IDE. Source files use the extension .cpp (main source files) or .h (header files). The format is plain text, so any text editor can produce it."]},
 {h:"The compiler",d:"The compiler translates source code into machine language, in two phases.",l:["Phase 1: the preprocessor handles every directive beginning with #: expanding macros, inserting header files and performing conditional compilation.","Phase 2: the preprocessed source is translated into object code, machine instructions in a relocatable, not yet linked form, stored in an object file (.obj on Windows, .o on Linux and macOS).","During compilation the compiler checks the source thoroughly. Any violation of C++'s syntax or type rules is reported as a compile-time error, and no object file is produced until the errors are fixed.","Common compilers: GCC (the g++ front end; the most widely used free compiler on Linux and macOS; part of the GNU Project from Lesson 11), Clang/LLVM (a modern alternative, the default on macOS) and MSVC (Microsoft's compiler in Visual Studio)."]},
 {h:"The linker",d:"The linker combines one or more object files with pre-compiled library code (the C++ Standard Library and any others used) into a single executable file: .exe on Windows, usually no extension on Linux and macOS.",p:["Its key job is resolving external references: when one file calls a function defined in another file or in a library, the linker finds that function's machine code and connects the call to it. If a called function's definition cannot be found anywhere, the linker reports a linker error.","Common pitfall: compiler errors and linker errors are different. A compiler error means the source breaks C++'s rules, so it cannot be translated. A linker error means every file translated fine, but a function that was called is never defined in any file or library supplied, so the pieces cannot be joined. Forgetting to write a function body is therefore reported by the linker, not the compiler."]},
 {h:"The IDE",d:"An IDE (Integrated Development Environment) combines the editor, compiler, linker and debugger in one interface, often adding a file browser, build-system and version-control integration, code completion and refactoring tools.",p:["It markedly improves productivity over using separate command-line tools."],t:T[3]},
 {h:"The complete compilation process",p:["First the preprocessor expands the # directives. Second, the compiler translates the result to assembly language and then assembles it into object code. Third, the linker joins the object files and libraries into the executable. When the executable is run, the operating system's loader, introduced in Lesson 3, copies it into memory and begins execution. Each tool has its own kind of error, so knowing which stage reported a problem tells you where to look for its cause.","Exam point: draw the pipeline with the tool and the file type at every stage. Examiners award marks for the order and for naming what each tool produces; a bare list of tool names earns less than the full chain."],t:T[4],pipe:1},
 {h:"Compile-time versus run-time errors",d:"Compile-time errors (syntax or semantic errors) are mistakes that violate C++'s rules and are detected by the compiler during translation. They stop compilation, so no executable exists until they are corrected.",p:["Examples: a missing semicolon, a misspelled keyword, mismatched braces, an undeclared variable, a function called with the wrong number or type of arguments.","Run-time errors occur while the program executes, after successful compilation and linking. The compiler cannot detect them because they depend on actual data, user input or system conditions unknown at compile time. They crash the program, make it misbehave or produce wrong results. Examples: division by zero, accessing an array beyond its bounds, dereferencing a null pointer, reading a file that does not exist, exhausting memory. They are generally harder to find, because they may appear only with particular input or in particular conditions."],t:T[5]}
]},
{t:"Program structure",sec:[3],notes:[3],dump:[3],blocks:[
 {h:"Your first program",p:["Tradition says every language is introduced with a program that prints a greeting. Type it out, compile it and run it before reading its explanation. When run, it displays Hello, World! on the screen. Six lines produce one line of output, and each of those lines teaches something."],code:{c:R`// My first C++ program

 {h:"Anatomy of the Hello World program",t:T[6]},
 {h:"Comments",d:"A comment is text meant for human readers that the compiler discards completely.",p:["It costs nothing at run time and is among the most valuable habits in programming: code is written once but read many times, often by its own author months later. There are two styles: // runs to the end of the line and may follow code on the same line; /* ... */ may span as many lines as needed.","Common pitfall: multi-line comments cannot be nested. The first */ ends the comment, however many /* came before it, so a /* ... */ comment inside another one leaves the remainder as live code. Use // on each line when temporarily disabling code that already contains comments.","Good comments explain why, not what: '// convert paise to rupees' is useful, whereas '// add one to count' beside count++ merely repeats the code."],code:{b:R`// A single-line comment: runs to the end of the line

 {h:"The preprocessor and #include",p:["Lines beginning with # are preprocessor directives, handled before compilation proper begins. The directive #include pastes the contents of another file, called a header file, into the program at that point. The header <iostream> declares the input/output facilities, including cout, cin and endl, so without it the compiler has never heard of them.","Two forms: angle brackets tell the compiler to search the standard system directories (a standard library header, as in #include <iostream>); quotation marks tell it to search the program's own folder first (your own header file, as in #include \"myfile.h\").","Other frequently used headers: <cmath> (mathematical functions), <string> (text strings), <iomanip> (output formatting) and <cstdlib> (general utilities)."],code:{c:R`// Delete the next line and run it: the compiler has never heard of cout
#include <iostream>

 {h:"Namespaces",d:"A namespace groups names under a label, so that identical names in different namespaces cannot collide.",p:["As programs grow and use libraries written by many people, two pieces of code may choose the same name for different things. Everything in the C++ Standard Library lives in the namespace std, so the fully qualified name of the output stream is std::cout, where :: is the scope resolution operator.","Style 1 qualifies each name explicitly (std::cout << \"Hello\" << std::endl;). Style 2 imports the whole namespace once with using namespace std; and then writes cout << \"Hello\" << endl;. Style 2 is shorter and is used throughout this course, but in large professional programs importing an entire namespace is discouraged, because it brings in every name from it and can reintroduce exactly the collisions namespaces exist to prevent. Writing std:: in full is the safer habit once programs grow."],code:{c:R`#include <iostream>

int main()
{
    // Style 1: qualify each name explicitly
    std::cout << "Hello" << std::endl;

 {h:"The main() function",d:"Every C++ program must contain exactly one function called main. It is the entry point: when the operating system's loader starts the program, execution begins at the first statement inside main() and ends when main() finishes.",p:["The word int before main is the function's return type: it promises to hand back an integer. By universal convention return 0; means 'everything went well', and any non-zero value signals a particular kind of failure to the operating system or to whatever program launched this one. In C++ you may omit return 0; from main() and the compiler supplies it, but writing it makes the intent explicit."],code:{c:R`#include <iostream>
using namespace std;

{
    // statements go here
    cout << "Execution begins at main()" << endl;
    return 0;
}`,tr:"Add a second cout line before return 0; and predict the output before you run it."}},
 {h:"Statements, semicolons and blocks",d:"A statement is a single complete instruction, and in C++ nearly every statement ends with a semicolon. A block is a group of statements enclosed in braces { }, treated as a single unit.",p:["The semicolon is how the compiler knows where one instruction stops and the next begins. Because the language ignores line breaks and spacing, the semicolon, not the newline, is the terminator. Layout is for humans; semicolons are for the compiler.","Common pitfall: the missing semicolon is the single most common beginner error. Because the compiler only realises a statement has not ended when it meets the next line's first token, the error message often points to the line after the real mistake. When the compiler reports an error at a line that looks perfectly fine, check the end of the line above."],code:{b:R`int a = 5; int b = 7; cout << a + b << endl;   // three statements on one line

     << a + b
     << endl;                                   // one statement over three lines`,wrap:1,tr:"Both forms are legal. Remove the semicolon at the end of the first line and read the error."}},
 {h:"Tokens, identifiers and keywords",p:["The compiler does not read a program as characters; it first breaks it into the smallest meaningful units, called tokens, a process Lesson 3 named lexical analysis. C++ has five kinds."],t:T[7]},
 {h:"Keywords",d:"Keywords are words the language has reserved for its own use, such as int, float, char, if, else, for, while, return, class, void, const and new.",p:["They are always written in lowercase and cannot be used as names for your own variables or functions."]},
 {h:"Identifiers",d:"Identifiers are the names you give to variables, functions and other entities. They must follow firm rules.",l:["Rule 1: may contain letters (A-Z, a-z), digits (0-9) and the underscore _, and nothing else: no spaces, hyphens or other symbols.","Rule 2: must begin with a letter or underscore, never with a digit.","Rule 3: are case-sensitive: Age, age and AGE are three different identifiers.","Rule 4: cannot be a keyword.","Rule 5: have no fixed length limit in practice, though very long names are unwieldy.","Valid: age, total_marks, _count, student1. Invalid: 1st_student (starts with a digit), total-marks (hyphen), my age (space), int (keyword).","Naming is also a craft: choose names that say what the value means. totalMarks is clear; tm saves keystrokes and costs the next reader a minute. Two conventions are common, camelCase (totalMarks) and snake_case (total_marks); whichever is chosen, use it consistently.","Exam point: identifier questions give a list of names and ask which are valid. Check each against the rules in order: starts with a letter or underscore? only letters, digits and underscores? not a keyword? A name such as float looks fine but fails the last test, and marks# fails the second."]}
]},
{t:"Data types",sec:[4],notes:[4],dump:[4],blocks:[
 {h:"Why types exist",d:"C++ is a statically typed language: every value has a data type, fixed and checked at compile time.",p:["A type tells the compiler three things: how much memory the value occupies, how the bits stored there are to be interpreted, and which operations are legal on it. The same eight bits mean the number 65 to an int and the letter A to a char; the type is what decides which. Recall from Lesson 2 that memory holds only binary patterns, so a pattern means nothing until a type gives it meaning."]},
 {h:"Fundamental data types",t:T[8]},
 {h:"How the types connect to Lesson 2",l:["int is the signed integer of Lesson 2. A 4-byte int has 32 bits and uses two's complement, so its range is -2^31 to 2^31 - 1, that is -2,147,483,648 to 2,147,483,647. The asymmetry Lesson 2 explained (one more negative value than positive) is visible here.","char stores a character as its ASCII code, exactly as Lesson 2 described. The literal 'A' is the number 65, 'a' is 97 and '0' is 48, so 'A' + 1 is 66, the character B when stored back into a char.","float and double are the IEEE 754 single (32-bit) and double (64-bit) formats of Lesson 2, with the sign, exponent and mantissa fields described there. Because they store a binary approximation, 0.1 + 0.2 is not exactly 0.3, the same effect Lesson 2 traced to fractions that never terminate in binary.","Overflow is the overflow of Lesson 2: add one to the largest int and the result wraps around to the most negative one."],code:{b:R`char ch = 'A';

cout << "ch + 1 is the integer " << ch + 1 << endl;
cout << "(char)(ch + 1) is the character " << (char)(ch + 1) << endl;
cout << "0.1 + 0.2 == 0.3 is " << (0.1 + 0.2 == 0.3) << endl;`,wrap:1,tr:"The chapter says 'A' + 1 is 66 'which prints as B'. Run it: the plain sum prints the number 66, and it prints B only once it is stored in a char or cast to char."}},
 {h:"Type modifiers",p:["Four modifiers, signed, unsigned, short and long, adjust the size or sign of a basic type. Sizes are typical; they vary by platform. An n-bit signed type spans -2^(n-1) to 2^(n-1) - 1, and an unsigned one 0 to 2^n - 1, the two formulas from Lesson 2. The unsigned type spends the sign bit on magnitude instead, doubling the positive range."],t:T[9]},
 {h:"The sizeof operator",p:["The C++ standard fixes only minimum sizes, so the actual size of a type depends on the platform. sizeof reports it in bytes. On a typical modern system the program below prints 4, 1, 4 and 8. sizeof(char) is always 1 by definition."],code:{c:R`#include <iostream>
using namespace std;

int main()
{
    cout << "int:    " << sizeof(int)    << " bytes" << endl;

    cout << "double: " << sizeof(double) << " bytes" << endl;
    return 0;

 {h:"Common pitfall and exam point",l:["Choose double over float for ordinary real-number work. float carries only about seven significant digits, so accumulated rounding error appears quickly. Never use a floating-point type for money: store rupees as whole paise in an integer, the practice Lesson 2 recommended.","Exam point: questions often ask for the range of an unsigned type of given size. Compute it from the bit count rather than recalling it: a 2-byte unsigned type has 16 bits, so 0 to 2^16 - 1 = 65,535; the signed version is -2^15 to 2^15 - 1."]}
]},
{t:"Variables and constants",sec:[5],notes:[5],dump:[5],blocks:[
 {h:"What is a variable?",d:"A variable is a named location in memory that holds a value which may change while the program runs.",p:["It has four properties: a name (its identifier), a type, a value and an address in memory. The name is a human-friendly label for the address, exactly the service the compiler provides in place of raw memory addresses."]},
 {h:"Declaration and initialisation",p:["A variable must be declared, stating its type and name, before it is used. It may also be initialised, given a first value, in the same statement. Assignment gives an existing variable a value."],code:{b:R`int age;                 // declaration only: value is undefined
int marks = 85;          // declaration with initialisation
double price = 99.50;
char grade = 'A';
bool passed = true;
int a = 5, b = 10, c;    // several variables of one type
age = 16;                // assignment: gives an existing variable a value
cout << age << " " << marks << " " << price << " " << grade << " " << passed << " " << a + b << endl;`,wrap:1,tr:"Change a value and predict the output first. Note that passed prints as 1."}},
 {h:"Common pitfall: uninitialised variables",p:["A local variable that is declared but not initialised holds an indeterminate value: whatever bits happened to be in that memory. Using it produces unpredictable results, a famously hard-to-find bug because the program may appear to work on some runs. Initialise every variable when you declare it."]},
 {h:"Scope and lifetime",d:"The scope of a variable is the region of the program in which its name can be used.",p:["A local variable is declared inside a function or block and is visible only from its declaration to the closing brace of that block; it is created when execution reaches it and destroyed when the block ends (its lifetime). A global variable is declared outside every function, is visible to the whole file below its declaration, and lives for the entire run of the program.","Prefer local variables. Global variables can be changed from anywhere, which makes it hard to tell which part of a large program altered a value; local variables keep each part of a program self-contained."],code:{c:R`#include <iostream>
using namespace std;

int total = 100;              // global: visible everywhere below

int main()
{
    int x = 5;                // local to main
    {
        int y = 10;           // local to this inner block
        cout << x + y << endl;    // fine: both visible here
    }
    // cout << y;             // ERROR: y no longer exists here
    cout << x + total << endl;    // fine
    return 0;
}`,tr:"Remove the // from the commented line and run it. It is a compile-time error in C++: y no longer exists."}},
 {h:"Constants",d:"A constant is a named value that cannot change after it is set. The preferred form is the const qualifier, which the compiler enforces.",p:["Constants give a number a meaning (DAYS_IN_WEEK says more than a bare 7) and let a value that appears throughout a program be changed in one place. The older style, #define MAX_MARKS 100, is textual replacement by the preprocessor. const is preferred over #define because it has a type, obeys scope rules and is checked by the compiler, whereas #define is blind text substitution done by the preprocessor of Section 1.3."],code:{c:R`#include <iostream>
using namespace std;

#define MAX_MARKS 100          // older style: textual replacement by the preprocessor

int main()
{
    const double PI = 3.14159;
    const int DAYS_IN_WEEK = 7;
    // PI = 3.14;              // ERROR: cannot modify a const
    cout << PI << " " << DAYS_IN_WEEK << " " << MAX_MARKS << endl;
    return 0;
}`,tr:"Remove the // before PI = 3.14; and run it to see the error. A const cannot be modified."}},
 {h:"Literals",d:"A literal is a fixed value written directly in the source code.",t:T[10],p:["Common pitfall: 'A' and \"A\" are different. Single quotes make one char (the number 65). Double quotes make a string, which carries a hidden terminating character after the letter. Confusing them is a very common error.","Exam point: distinguish declaration, initialisation and assignment. Declaring creates the variable (int x;); initialising gives it a value at creation (int x = 5;); assigning changes an existing variable (x = 9;). Examiners also ask why const beats #define: it is type-checked and scoped."],code:{b:R`cout << 0x2A << " " << 052 << endl;          // hex and octal
cout << 2.5e3 << endl;                        // e3 means x 10^3
cout << 'A' << " " << (int)'A' << endl;       // a char and its code`,wrap:1,tr:"0x2A and 052 are both 42, the bases of Lesson 2."}}
]},
{t:"Input and output",sec:[6],notes:[6],dump:[6],blocks:[
 {h:"Streams",d:"C++ performs input and output through streams: sequences of characters flowing between the program and a device.",p:["The header <iostream> supplies two you will use constantly: cout (console output), the stream to the screen, and cin (console input), the stream from the keyboard."]},
 {h:"Output with cout",p:["The insertion operator << sends data into the output stream; read it as an arrow pointing the way the data flows. It can be chained to print several items in one statement. endl ends the line and flushes the output buffer; '\\n' ends the line without flushing, and is slightly faster in output-heavy programs. For this course the two are interchangeable."],code:{b:R`int age = 16;
cout << "Age: " << age << endl;
cout << "Next year: " << age + 1 << endl;
cout << "A" << "B" << "C" << endl;       // prints ABC`,wrap:1,tr:"Predict the output, then check it. Chained items are joined with no spaces."}},
 {h:"Escape sequences",d:"An escape sequence starts with a backslash and stands for one special character that cannot be typed directly inside quotes, such as a new line.",t:T[11],code:{b:R`cout << "Name:\tAnita\nMarks:\t92\n";
cout << "She said \"well done\"" << endl;`,wrap:1,tr:"Add \\\\ to print a backslash and predict the result."}},
 {h:"Input with cin",p:["The extraction operator >> takes data from the input stream and stores it in a variable; the arrow points into the variable. Input is converted according to the variable's type. The user may type the two numbers separated by spaces, tabs or new lines, because cin treats any whitespace as a separator. Printing a prompt before reading tells the user what is expected."],code:{c:R`#include <iostream>

}`,inp:"12 30",tr:"Change the numbers in the input box (try putting them on separate lines) and run it again."}},
 {h:"Common pitfalls and exam point",l:["Because cin >> stops at whitespace, reading a name such as 'Anita Nair' into a single string variable captures only 'Anita'. Reading a whole line, spaces included, needs getline(cin, name) from <string>.","If the user types letters where a number is expected, cin enters a failure state and every later read silently does nothing: input should not be trusted to be well-formed.","Exam point: remember which way each arrow points. cout << value sends data out to the screen; cin >> variable brings data in to the variable. Questions asking for the output of a short program usually hinge on endl, tabs, and whether arithmetic is inside or outside the quotes: \"2+3\" prints the text, 2+3 prints 5."]}
]},
{t:"Operators",sec:[7],notes:[7],dump:[7],blocks:[
 {h:"Overview",d:"An operator is a symbol that performs an operation on one or more operands.",p:["Operators taking one operand are unary, those taking two are binary, and C++ has exactly one ternary operator, taking three. Operators and their operands combine into expressions, each of which produces a value."]},
 {h:"Arithmetic operators",p:["Common pitfall: when both operands of / are integers, the result is an integer and the fraction is discarded: 7 / 2 is 3 and 1 / 2 is 0. To get 3.5, at least one operand must be a floating-point value, as in 7.0 / 2. The modulus operator % works only on integers.","The modulus operator is surprisingly useful: n % 2 == 0 tests whether n is even; n % 10 extracts the last digit of a number; n / 10 removes it."],t:T[12],code:{b:R`cout << 7 + 2 << " " << 7 - 2 << " " << 7 * 2 << " " << 7 / 2 << " " << 7 % 2 << endl;
cout << 7.0 / 2 << endl;
int n = 1234;
cout << n % 10 << " " << n / 10 << endl;`,wrap:1,tr:"Change 7.0 / 2 to 7 / 2 and see the fraction disappear."}},
 {h:"Relational operators",p:["Relational operators compare two values and produce a bool: true or false. In C++ these print as 1 and 0.","Common pitfall: = and == are completely different. = assigns; == compares. Writing if (x = 5) instead of if (x == 5) assigns 5 to x and, since 5 is non-zero, the condition is always true. This is among the best-known bugs in the C family of languages."],code:{b:R`cout << (5 == 5) << (5 != 3) << (3 < 5) << (5 >= 5) << endl;
int x = 3;
if (x = 5)   // BUG: assigns, then tests 5
    cout << "always true, and x is now " << x << endl;`,wrap:1,tr:"Change x = 5 to x == 5. Which branch runs now?"}},
 {h:"Logical operators",p:["The logical operators are the AND, OR and NOT gates of Lesson 2 applied to conditions, and they obey the same truth tables and De Morgan's laws. && is true only if both operands are true; || is true if at least one operand is true; ! reverses true and false.","They use short-circuit evaluation: in A && B, if A is false the result must be false, so B is never evaluated; in A || B, if A is true, B is skipped. This is why (d != 0 && n / d > 2) is safe: when d is zero the division never happens."],code:{b:R`int d = 0, n = 10;
if (d != 0 && n / d > 2)
    cout << "big" << endl;
else
    cout << "safe: n / d was never evaluated" << endl;`,wrap:1,tr:"Swap the two conditions: n / d > 2 && d != 0 and run it. What happens now?"}},
 {h:"Assignment operators",p:["The assignment operator = stores the value of the right side in the variable on the left. Compound assignment operators combine an operation with assignment as a shorthand."],t:T[14],code:{b:R`int x = 10;
x += 5;  cout << x << " ";
x -= 3;  cout << x << " ";
x *= 2;  cout << x << " ";
x /= 4;  cout << x << " ";
x %= 4;  cout << x << endl;`,wrap:1,tr:"Predict each number before running it."}},
 {h:"Increment and decrement",p:["++ adds one and -- subtracts one. Each has a prefix form (before the variable) and a postfix form (after it), and the two differ in the value the expression produces.","Way to remember it: Prefix, the operator comes first, so it acts first: add one, then use the value. Postfix, the operator comes after, so it acts after: use the old value, then add one. When the expression stands alone, as in i++;, the two are identical; they differ only when the value is used within a larger statement."],code:{b:R`int a = 5;
int b = ++a;     // prefix: increment first, then use  -> a = 6, b = 6
int c = 5;
int d = c++;     // postfix: use first, then increment -> c = 6, d = 5
cout << a << " " << b << " " << c << " " << d << endl;`,wrap:1,tr:"Predict all four numbers, then run it."}},
 {h:"Bitwise operators",p:["Bitwise operators act on the individual bits of integers: the logic gates of Lesson 2, applied to every bit position at once. Write 5 = 0101 and 3 = 0011 and apply the gate to each column: AND gives 0001 = 1, OR gives 0111 = 7 and XOR gives 0110 = 6.","Shifts: 5 << 1 moves every bit one place left, giving 1010 = 10; shifting left multiplies by 2, as Lesson 2 showed. 5 >> 1 gives 0010 = 2; shifting right divides by 2, discarding the remainder. And ~5 flips every bit; in two's complement that is -5 - 1 = -6."],t:T[15],code:{b:R`cout << (5 & 3) << " " << (5 | 3) << " " << (5 ^ 3) << endl;
cout << ~5 << " " << (5 << 1) << " " << (5 >> 1) << endl;`,wrap:1,tr:"Open the Code lab's Operators tool for a bit-by-bit view of any two numbers."}},
 {h:"The conditional (ternary) operator",d:"The conditional operator ?: is a compact choice between two values: condition ? value_if_true : value_if_false.",p:["It is the C++ counterpart of the spreadsheet IF function from Lesson 9."],code:{b:R`int marks = 62;
cout << ((marks >= 35) ? "Pass" : "Fail") << endl;
int a = 3, b = 9;
int larger = (a > b) ? a : b;       // the greater of a and b
cout << larger << endl;`,wrap:1,tr:"Change marks to 30 and run it."}},
 {h:"Operator precedence and associativity",d:"When an expression has several operators, precedence decides which is applied first and associativity breaks ties between operators of equal precedence. Parentheses override both.",t:T[16],p:["Worked example: evaluate 2 + 3 * 4 > 10 && !(7 % 2 == 0). Parentheses first: 7 % 2 is 1, and 1 == 0 is false, so (...) is false. ! next: !false is true. Then *: 3 * 4 is 12. Then +: 2 + 12 is 14. Then >: 14 > 10 is true. Finally &&: true && true is true.","Exam point: never rely on memorised precedence when parentheses make intent plain: (a + b) * c is clearer than hoping, and costs nothing. But examination questions deliberately omit parentheses to test precedence, so work through the table level by level and show each step, as the worked example does."],code:{b:R`cout << (2 + 3 * 4 > 10 && !(7 % 2 == 0)) << endl;
cout << 10 + 6 / 4 * 2 << endl;`,wrap:1,tr:"The Code lab's Operators tool shows the step-by-step evaluation of any expression."}}
]},
{t:"Expressions and type conversion",sec:[8],notes:[8],dump:[8],blocks:[
 {h:"Expressions",d:"An expression is any combination of values, variables, operators and function calls that evaluates to a single value.",p:["5, x, x + 5 and (x + 5) * 2 > 30 are all expressions. A statement is a complete instruction, very often an expression followed by a semicolon: y = x + 5;. Expressions have values; statements do things."]},
 {h:"Implicit type conversion",d:"Implicit conversion (or type promotion) is the automatic conversion by the compiler of operands of different types to a common type before operating.",p:["It follows a simple principle: values move from a narrower type to a wider one so that nothing is lost: char → int → long → float → double. In a / b the int is silently promoted to double, so the division is floating-point and the result is 3.5, not 3.","Common pitfall: conversion in the other direction, from a wider type to a narrower one, can lose information. Assigning 3.99 to an int does not round; it truncates to 3. Assigning a value too large for the target type produces a wrong result without any warning from some compilers. Watch every assignment where the left side is narrower than the right."],code:{b:R`int a = 7;
double b = 2.0;
double r = a / b;        // a is promoted to 7.0, so r = 3.5
char ch = 'A';
int n = ch + 1;          // ch becomes 65, so n = 66
cout << r << " " << n << endl;`,wrap:1,tr:"Change b to the integer 2 (declare it int b = 2) and see what r becomes."}},
 {h:"Explicit type conversion (casting)",d:"A type cast forces a conversion. The modern form is static_cast<type>(expression); the older C style is (type)expression.",p:["The classic need for a cast: both total and count are integers, so total / count performs integer division and discards the fraction before the assignment ever happens, even though the destination is a double. Casting one operand makes the whole division floating-point. Note that the cast applies to the operand, not the result: static_cast<double>(total / count) would convert the already-truncated 3 and still give 3.0.","Exam point: 'What is the output?' questions on this topic almost always turn on integer division and on where the cast is placed. Always ask two questions of every division: are both operands integers? and, if a cast is present, is it applied before or after the division?"],code:{b:R`int total = 7, count = 2;
double wrong = total / count;                        // integer division first
double right = static_cast<double>(total) / count;   // cast an operand
double alt   = (double)total / count;                // C-style cast
cout << wrong << " " << right << " " << alt << endl;`,wrap:1,tr:"cout prints 3.0 as 3. Now try static_cast<double>(total / count) and predict the output."}},
 {h:"Predicting type and value",p:["Given int a = 9, b = 2; double d = 2.0; then a / b is int / int, so integer division: 4. a / d is int / double; a is promoted: 4.5. (double)a / b casts a first, then divides: 4.5. (double)(a / b) divides first, then casts the 4: 4.0. a % b is the remainder: 1."],t:T[17],code:{b:R`int a = 9, b = 2;
double d = 2.0;
cout << a / b << " " << a / d << " " << (double)a / b << " " << (double)(a / b) << " " << a % b << endl;`,wrap:1,tr:"cout prints 4.0 as 4. Predict all five values first."}}
]},
{t:"Debugging",sec:[9],notes:[9],dump:[9],blocks:[
 {h:"What is a bug?",d:"A bug is a flaw in a program that makes it behave other than intended, and debugging is the process of finding and fixing it.",p:["Every programmer, at every level, spends a large share of working life debugging; it is not a sign of failure but the normal condition of the craft.","The first 'bug': the word was already in use among engineers long before computers, but a famous entry belongs to computing. In September 1947, operators of the Harvard Mark II computer traced a malfunction to a moth trapped in a relay. They taped the insect into the logbook with the note 'First actual case of bug being found.' The team included Grace Hopper, the pioneer who also developed one of the first compilers."]},
 {h:"Three kinds of error",p:["Syntax errors are the easiest: the compiler stops and names the line. Run-time errors announce themselves by crashing. Logical errors are the most dangerous, because the program compiles, runs to the end and prints a perfectly plausible wrong answer, and nothing tells you anything is wrong. The only defence is to test with inputs whose correct answers you already know."],t:T[18],code:{b:R`// Intended: average of three marks
int m1 = 15, m2 = 20, m3 = 10;
double avg = m1 + m2 + m3 / 3;       // BUG: divides only m3 by 3
double ok  = (m1 + m2 + m3) / 3;     // correct: parentheses fix the precedence
cout << avg << " " << ok << endl;`,wrap:1,tr:"Legal code, plausible output, wrong answer: a logical error. Fix avg using the parentheses."}},
 {h:"Debugging techniques: a systematic approach",l:["Read the error message, and read it from the top. The first error is often the real one; later errors are frequently consequences of it. Note the line number, but remember that for a missing semicolon the true fault is on the previous line.","Reproduce the bug. Find the smallest input that triggers it. A bug you cannot reproduce cannot be fixed.","Trace by hand. Build a trace table, writing down each variable's value after every statement, and compare it with what you expected.","Print intermediate values. Add temporary cout statements to display variables at key points, narrowing down where the program departs from your expectation.","Use the debugger. An IDE's debugger lets you set a breakpoint, pause execution on a chosen line, step through one statement at a time and inspect every variable as you go.","Change one thing at a time, and re-test after each change. Changing several things at once leaves you unable to tell which one mattered.","Explain it aloud. Describing the code line by line to someone, or to a rubber duck on the desk, surfaces wrong assumptions remarkably often."]},
 {h:"A trace table",p:["Trace this fragment and record each variable after every statement: int x = 4; int y = x * 2; x = y - x; y += x; After int x = 4: x is 4, y is undefined. After int y = x * 2: 4 and 8. After x = y - x: we compute 8 - 4 = 4, so x stays 4. After y += x: y becomes 8 + 4 = 12. Final values: x = 4, y = 12. The Code lab's Trace tables tool lets you fill one in yourself."],code:{b:R`int x = 4;
int y = x * 2;
x = y - x;
y += x;
cout << "x = " << x << ", y = " << y << endl;`,wrap:1,tr:"Add a cout line after each statement to print x and y. That is the technique of printing intermediate values."}},
 {h:"Preventing bugs",p:["Prevention is cheaper than cure. Initialise every variable. Use meaningful names and comment the why. Write and test small pieces before combining them. Parenthesise whenever precedence is not obvious. Turn on the compiler's warnings (for GCC, the -Wall option) and treat each warning as a probable bug, since many logical errors, such as using an uninitialised variable or a stray = in a condition, are flagged this way.","Exam point: the three-way classification (syntax, run-time, logical) is a standard question: give the cause, when it is detected and an example for each, and state clearly that logical errors are the hardest because no tool announces them. A trace table, drawn neatly, is also a reliable source of marks in 'find the output' questions."]}
]}
];

/* ============ C++ RUNNER (JSCPP, bundled) ============ */
const HDR="#include <iostream>\nusing namespace std;\n\nint main()\n{\n";
const HDR_LINES=5;
function wrapBody(b){return HDR+b.replace(/\r/g,"").split("\n").map(l=>l?"    "+l:l).join("\n")+"\n    return 0;\n}\n";}
function prep(src){
  let s=src.replace(/\r/g,""),ins=-1;
  s=s.replace(/^[ \t]*#include\s*<string>.*$/gm,"// <string> is built in here");
  s=s.replace(/static_cast\s*<\s*([A-Za-z_][A-Za-z_0-9 ]*?)\s*>\s*\(/g,"($1)(");
  if(/\bstd::/.test(s)){
    s=s.replace(/\bstd::/g,"");
    if(!/using\s+namespace\s+std\s*;/.test(s)){
      const ls=s.split("\n");let last=-1;ls.forEach((l,i)=>{if(/^\s*#include/.test(l))last=i;});
      if(last>=0){ls.splice(last+1,0,"using namespace std;");ins=last+2;s=ls.join("\n");}
    }
  }
  return {src:s,ins:ins};
}
function runCpp(src,inp,off){
  const J=window.JSCPPLib;
  if(!J||typeof J.run!=="function")return {ok:false,cls:"note",title:"Runner not available",detail:"The in-browser C++ runner did not load in this view. The explanations and the other tools still work.",out:""};
  const p=prep(src);let out="";
  try{
    const code=J.run(p.src,inp||"",{stdio:{write:function(s){out+=s;}},maxTimeout:3000});
    return {ok:true,out:out,code:code};
  }catch(e){
    const m=String((e&&e.message)||e).replace(/\s+/g," ");
    let line=null,mm;
    if((mm=m.match(/line (\d+)/)))line=+mm[1];else if((mm=m.match(/^(?:ERROR: )?(\d+):\d+/)))line=+mm[1];
    if(line!==null){if(p.ins>0&&line>p.ins)line--;line-=(off||0);if(line<1)line=null;}
    const at=line?" at line "+line:"";
    let r={ok:false,out:out};
    if(/Parsing Failure/i.test(m)){r.cls="bad";r.title="Compile-time error (syntax)"+at;r.detail="The compiler stopped, so no program was produced. A missing semicolon is reported on the line after the real mistake, so check the end of the line above"+(line?" (line "+(line-1)+")":"")+" as well.";}
    else if(/does not exist|not declared|undeclared/i.test(m)){const n=(m.match(/variable (\w+) does not exist/)||[])[1];r.cls="bad";r.title="Compile-time error (undeclared name)"+at;r.detail=(n?"The name '"+n+"' has not been declared (or is outside its scope). ":"A name has not been declared. ")+"A real C++ compiler reports this before the program runs.";}
    else if(/overflow of (Infinity|NaN|-Infinity)/i.test(m)||/divi.* by zero/i.test(m)){r.cls="bad";r.title="Run-time error: division by zero"+at;r.detail="The program compiled and started, then attempted an illegal operation. The compiler cannot detect this because it depends on data at run time.";}
    else if(/overflow/i.test(m)){r.cls="note";r.title="Runner stopped: integer overflow"+at;r.detail="Real C++ wraps the value around silently (Lesson 2); this runner stops instead. Use the Types and ranges tool to see the wrapped value.";}
    else if(/Time limit/i.test(m)){r.cls="bad";r.title="Stopped after 3 seconds: probably an infinite loop";r.detail="The program did not finish. This is a run-time problem: the compiler cannot tell whether a loop ends.";}
    else if(/cannot find library/i.test(m)){r.cls="note";r.title="Header not supported here";r.detail="This in-browser runner supports iostream and a few other basic headers. "+m.slice(0,100);}
    else{r.cls="note";r.title="The runner could not run this program"+at;r.detail=m.slice(0,200);}
    return r;
  }
}
function outHtml(r){
  if(!r)return '<p class="hint">Press Run to execute the program. Output appears here.</p>';
  let h="";
  if(r.ok){h+='<pre class="outpre">'+(r.out?esc(r.out):'<span class="dim">(no output)</span>')+'</pre><div class="rs ok">Finished normally (exit code '+r.code+')</div>';}
  else{if(r.out)h+='<pre class="outpre">'+esc(r.out)+'</pre>';h+='<div class="rs '+r.cls+'"><b>'+esc(r.title)+'.</b> '+esc(r.detail)+'</div>';}
  return h;
}

const CS={src:{},inp:{},out:{},spec:{}};
function codeHtml(id,spec){
  CS.spec[id]=spec;
  const src=CS.src[id]!==undefined?CS.src[id]:(spec.c!==undefined?spec.c:spec.b);
  const needIn=spec.inp!==undefined||/\bcin\b/.test(src);
  const inp=CS.inp[id]!==undefined?CS.inp[id]:(spec.inp||"");
  const rows=Math.min(20,Math.max(3,src.split("\n").length+1));
  let h='<div class="cw"><div class="cw-bar"><span class="lab">'+(spec.wrap?"C++ snippet (runs inside main)":"C++ program")+'</span><span class="row"><button class="btn sm" data-act="crun" data-id="'+id+'">Run</button><button class="btn sm" data-act="wreset" data-id="'+id+'">Reset</button></span></div>';
  h+='<textarea class="codearea" id="code-'+id+'" data-cid="'+id+'" rows="'+rows+'" spellcheck="false" autocapitalize="off" autocomplete="off" wrap="off" aria-label="C++ code editor">'+esc(src)+'</textarea>';
  if(needIn)h+='<div class="cw-in"><label class="lab" for="in-'+id+'">Keyboard input for cin</label><input type="text" class="cin" id="in-'+id+'" data-iid="'+id+'" value="'+esc(inp)+'" autocomplete="off"></div>';
  h+='<div class="outbox" id="out-'+id+'" aria-live="polite">'+outHtml(CS.out[id])+"</div>";
  if(spec.tr)h+='<p class="try"><b>Try this.</b> '+esc(spec.tr)+"</p>";
  return h+"</div>";
}
function runWidget(id){
  const spec=CS.spec[id];if(!spec)return;
  const ta=document.getElementById("code-"+id),ii=document.getElementById("in-"+id);
  const src=ta?ta.value:(spec.c!==undefined?spec.c:spec.b);CS.src[id]=src;
  const inp=ii?ii.value:(CS.inp[id]||spec.inp||"");CS.inp[id]=inp;
  const r=spec.wrap?runCpp(wrapBody(src),inp,HDR_LINES):runCpp(src,inp,0);
  CS.out[id]=r;const o=document.getElementById("out-"+id);if(o)o.innerHTML=outHtml(r);
}
function resetWidget(id){const s=CS.spec[id];if(!s)return;delete CS.src[id];delete CS.out[id];delete CS.inp[id];render();}

function bitRes(){
  const x=Math.max(0,Math.min(255,parseInt(L.bx)||0)),y=Math.max(0,Math.min(255,parseInt(L.by)||0)),sh=Math.max(0,Math.min(7,parseInt(L.bsh)||0));
  let r,desc,rows;

  if(b.t)h+='<div class="tbl"><table><thead><tr>'+b.t.c.map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr></thead><tbody>'+b.t.r.map(r=>'<tr>'+r.map(c=>'<td>'+esc(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
  if(b.code)h+=codeHtml(b.code.id,b.code);
  if(b.pipe)h+='<ol class="pipe">'+pipeLi(PSTG,9,-1,"fail")+'</ol>';
  return h+'</section>';
}
function stepIds(st){const ids=[];CARDS.forEach((c,i)=>{if(st.sec.includes(c[0]))ids.push(i);});return ids.filter(i=>i<ORIG).concat(ids.filter(i=>i>=ORIG));}
function stepChunks(st){const ids=stepIds(st),out=[];for(let i=0;i<ids.length;i+=CH)out.push(ids.slice(i,i+CH));return out;}
function blankHtml(text){return esc(text).replace(/\{\{(.+?)\}\}/g,(m,a)=>`<button class="blank" data-act="blank" style="min-width:${Math.max(4,a.length)}ch" aria-label="Hidden term, press to reveal"><span class="ans">${a}</span></button>`);}
function applyRate(queue,v){const id=queue.shift();let b=store.box[id]||0;
  if(v==="miss"){b=1;queue.splice(Math.min(3,queue.length),0,id);}
  else if(v==="almost"){b=Math.max(b,1);queue.push(id);}
  else{b=b<2?2:3;}
  store.box[id]=b;save();}
function openStep(s){
  const P=S.path,N=stepChunks(STEPS[s]).length;
  const ch=store.path.done[s]?0:Math.min(store.path.ch[s]||0,N);
  P.step=s;P.i=0;P.flip=false;P.guess="";P.text="";P.dchecked=false;P.ticks={};P.q=[];
  if(ch>=N){P.ph="gaps";P.ch=N-1;}else{P.ch=ch;P.ph=ch>0?"learn":"primer";}
  render();window.scrollTo(0,0);
}
function pathOverview(){
  const first=STEPS.findIndex((_,s)=>!store.path.done[s]);
  let h='<div class="panel"><h2>Start here</h2><p>New to the subject? Follow the ten steps in order. Each step sets out the textbook notes (with runnable code where the chapter has a listing), then teaches its cards in small rounds of six (first you see them with answers, then you recall them), then checks you with fill-the-gaps and a brain dump. Progress is saved in this browser.</p></div><div style="display:flex;flex-direction:column;gap:10px">';
  STEPS.forEach((st,s)=>{
    const N=stepChunks(st).length,done=!!store.path.done[s],ch=Math.min(store.path.ch[s]||0,N);
    const status=done?"Done":ch>0?"Round "+ch+" of "+N+" done":"Not started";
    h+=`<button class="opt" data-act="pstep" data-v="${s}" style="display:flex;justify-content:space-between;gap:12px;align-items:center"><span><b>${s+1}. ${esc(st.t)}</b><br><span class="hint">${stepIds(st).length} cards · ${N} rounds</span></span><span class="tag">${status}</span></button>`;
  });
  h+="</div>";
  if(first>=0)h+=`<div class="row"><button class="btn primary" data-act="pstep" data-v="${first}">${(store.path.ch[first]||0)>0?"Continue":"Begin"} step ${first+1}</button></div>`;
  else h+='<p>All ten steps are done. Keep the cards fresh in Recall cards, then test yourself in Evaluate.</p>';
  return '<div style="display:flex;flex-direction:column;gap:18px">'+h+"</div>";
}
function viewPath(){
  const P=S.path;
  if(P.step===null)return pathOverview();
  const st=STEPS[P.step],chunks=stepChunks(st),N=chunks.length;
  const pos=P.ph==="primer"?0:(P.ph==="learn"||P.ph==="recall"||P.ph==="roundend")?1+P.ch:P.ph==="gaps"?N+1:P.ph==="dump"?N+2:N+3;
  let h=`<div class="row" style="justify-content:space-between"><span class="row"><button class="btn" data-act="pback">All steps</button>${P.ph==="primer"||P.ph==="done"?"":'<button class="btn" data-act="pnotes">Notes</button>'}</span><span class="lab">Step ${P.step+1} of ${STEPS.length}</span></div><div class="bar" aria-hidden="true"><i style="width:${Math.round(pos/(N+3)*100)}%"></i></div><h2>${esc(st.t)}</h2>`;
  if(P.ph==="primer"){
    h+=`<div class="panel"><div class="lab">Textbook notes</div>${st.blocks.map(noteHtml).join("")}<p class="hint">Next: ${N} short rounds. In each round you see ${CH} cards with their answers, then recall them from memory.</p><div class="row"><button class="btn primary" data-act="pstart">${P.ch>0?"Continue at round "+(P.ch+1):"Start round 1"}</button></div></div>`;
  }else if(P.ph==="learn"){
    const ids=chunks[P.ch],id=ids[P.i],k=CARDS[id];
    h+=`<div class="panel fc"><div class="lab">Round ${P.ch+1} of ${N} · Learn · card ${P.i+1} of ${ids.length} · ${id<ORIG?"Core":"Detail"}</div><div class="q">${esc(k[1])}</div><div class="lab">Answer</div><div class="a">${esc(k[2])}</div><p class="hint">Read it, say it back in your own words, then move on.</p><div class="row"><button class="btn" data-act="plback"${P.i?"":" disabled"}>Back</button><button class="btn primary" data-act="plnext">${P.i+1<ids.length?"Next card":"Now recall these "+ids.length}</button></div></div>`;
  }else if(P.ph==="recall"){
    const id=P.q[0],k=CARDS[id];
    h+=`<div class="panel fc"><div class="lab">Round ${P.ch+1} of ${N} · Recall · ${P.q.length} left</div><div class="q">${esc(k[1])}</div><input type="text" id="pguess" placeholder="Type what you remember (optional)" value="${esc(P.guess)}" autocomplete="off">`;
    if(!P.flip)h+='<div class="row"><button class="btn primary" data-act="pflip">Show answer</button><span class="hint">or press Space</span></div>';
    else h+=`<div class="lab">Answer</div><div class="a">${esc(k[2])}</div><div class="row"><button class="btn bad" data-act="prate" data-v="miss">Missed it (1)</button><button class="btn warn" data-act="prate" data-v="almost">Almost (2)</button><button class="btn good" data-act="prate" data-v="got">Got it (3)</button></div>`;
    h+="</div>";
  }else if(P.ph==="roundend"){
    const last=P.ch+1>=N;
    h+=`<div class="panel"><h3>Round ${P.ch+1} done</h3><p>${last?"That was the last round of cards. Two short exercises remain: fill the gaps in the summary, then a brain dump.":"Next you will see "+chunks[P.ch+1].length+" new cards."}</p><div class="row"><button class="btn primary" data-act="pnext">${last?"Fill the gaps":"Start round "+(P.ch+2)}</button></div></div>`;
  }else if(P.ph==="gaps"){
    h+='<p class="hint">Say each hidden term aloud before you tap it.</p><div class="row"><button class="btn" data-act="revall">Reveal all</button><button class="btn" data-act="hideall">Hide all</button></div>';
    st.notes.forEach(ni=>{const n=NOTES[ni];h+=`<div class="panel note"><h3>${esc(n[0])}</h3><p>${blankHtml(n[1])}</p></div>`;});
    h+='<div class="row"><button class="btn primary" data-act="pdump">Continue to brain dump</button></div>';
  }else if(P.ph==="dump"){
    const pts=[];st.dump.forEach(d=>DUMPS[d].p.forEach(p=>pts.push(p)));
    h+=`<div class="panel"><h3>Brain dump</h3><p class="hint">Close everything and write what you remember about this step. Then compare.</p><textarea id="ptext" placeholder="Write it in your own words...">${esc(P.text)}</textarea>`;
    if(!P.dchecked)h+='<div class="row"><button class="btn primary" data-act="pcheck">Compare with key points</button></div>';
    else{const got=pts.filter((_,i)=>P.ticks[i]).length;
      h+=`<div class="lab">Tick what you included</div><div class="pts">${pts.map((p,i)=>`<label><input type="checkbox" data-act="ptick" data-i="${i}"${P.ticks[i]?" checked":""}><span>${esc(p)}</span></label>`).join("")}</div><div class="row"><b>${got} of ${pts.length} covered</b><button class="btn primary" data-act="pfinish">Finish this step</button></div>`;}
    h+="</div>";
  }else{
    const ids=stepIds(st),m=ids.filter(i=>(store.box[i]||0)>=2).length;
    h+=`<div class="panel"><h3>Step ${P.step+1} complete</h3><p>${m} of ${ids.length} cards in this step are at Review or Mastered. The rest keep coming back in Recall cards.</p><div class="row">${P.step+1<STEPS.length?`<button class="btn primary" data-act="pnextstep">Next: ${esc(STEPS[P.step+1].t)}</button>`:""}<button class="btn" data-act="pback">All steps</button></div></div>`;
  }
  return '<div style="display:flex;flex-direction:column;gap:16px">'+h+"</div>";
}

/* ============ EVALUATE ============ */
function countOf(k){return BANK.filter(b=>b.t===k).length;}
function viewEval(){
  if(S.ev.view==="setup")return evalSetup();
  if(S.ev.view==="quiz")return evalQuiz();
  return evalResult();
}
function evalSetup(){
  let h='<div class="panel"><h2>Build a test</h2><p class="hint">Choose the question types. Written answers (short, long, scenario) are self-marked against the key points, like checking your own paper.</p><div style="display:flex;flex-direction:column;gap:8px">';
  TYPES.forEach(t=>{h+=`<div class="tcount"><label><input type="checkbox" data-act="etype" data-v="${t.k}"${S.ev.types[t.k]?" checked":""}><span>${esc(t.n)}</span></label><span class="n">${countOf(t.k)} Qs · ${t.m} mark${t.m>1?"s":""} each</span></div>`;});
  const pool=BANK.filter(b=>S.ev.types[b.t]).length;
  h+=`</div><div class="row"><label for="en" class="lab">Length</label><select id="en" style="width:auto"><option value="10"${S.ev.n==10?" selected":""}>10 questions</option><option value="20"${S.ev.n==20?" selected":""}>20 questions</option><option value="35"${S.ev.n==35?" selected":""}>35 questions</option><option value="0"${S.ev.n==0?" selected":""}>Everything selected (${pool})</option></select></div><div class="row"><button class="btn primary" data-act="estart"${pool?"":" disabled"}>Start test</button></div></div>`;
  if(store.hist.length){
    h+='<div class="panel"><h3>Recent tests</h3>'+store.hist.slice(0,6).map(x=>`<div class="row" style="justify-content:space-between"><span>${esc(x.d)} · ${x.n} questions</span><b>${x.pct}%</b></div>`).join("")+"</div>";
  }
  return '<div style="display:flex;flex-direction:column;gap:18px">'+h+"</div>";
}
function startRun(list){
  const qs=list.map(q=>q.t==="mcq"?Object.assign({},q,{o:shuffle(q.opts.map((t,i)=>({t:t,c:i===q.a})))}):q);
  S.run={qs:qs,i:0,res:[],stage:[],ticks:[],text:[]};S.ev.view="quiz";render();window.scrollTo(0,0);
}
function evalQuiz(){
  const r=S.run,q=r.qs[r.i],res=r.res[r.i],T=TM[q.t];
  let h=`<div class="panel"><div class="row" style="justify-content:space-between"><span class="tag">${esc(T.n)}</span><span class="lab">Question ${r.i+1} of ${r.qs.length} · ${T.m} mark${T.m>1?"s":""}</span></div><div class="bar" aria-hidden="true"><i style="width:${Math.round(r.i/r.qs.length*100)}%"></i></div>`;
  h+=`<h3 style="font-size:1.2rem;line-height:1.35">${esc(q.t==="fill"?q.q.replace("___","_______"):q.q)}</h3>`;
  if(q.t==="calc")h+='<pre class="codeview">'+esc(q.src)+'</pre>';
  if(q.t==="mcq"){
    h+='<div class="opts">'+q.o.map((o,i)=>{let c="opt";if(res){if(o.c)c+=" right";else if(res.pick===i)c+=" wrong";}return `<button class="${c}" data-act="mcq" data-i="${i}"${res?" disabled":""}>${esc(o.t)}</button>`;}).join("")+"</div>";
    if(res)h+=`<div class="fb ${res.score?"ok":"no"}"><b>${res.score?"Correct.":"Not quite."}</b> ${esc(q.e)}</div>`;
  }else if(q.t==="tf"){
    h+='<div class="opts">'+[true,false].map(v=>{let c="opt";if(res){if(q.a===v)c+=" right";else if(res.pick===v)c+=" wrong";}return `<button class="${c}" data-act="tf" data-v="${v}"${res?" disabled":""}>${v?"True":"False"}</button>`;}).join("")+"</div>";
    if(res)h+=`<div class="fb ${res.score?"ok":"no"}"><b>${res.score?"Correct.":"Not quite."}</b> ${esc(q.e)}</div>`;
  }else if(q.t==="fill"||q.t==="vsa"||q.t==="calc"){
    h+=`<input type="text" id="ans" autocomplete="off" placeholder="Type your answer" value="${esc(r.text[r.i]||"")}"${res?" disabled":""}>`;
    if(!res)h+='<div class="row"><button class="btn primary" data-act="check">Check</button></div>';
    else{
      h+=`<div class="fb ${res.score?"ok":"no"}"><b>${res.score?"Correct.":"Model answer:"}</b> ${res.score?"":esc(q.model)} ${q.e?esc(q.e):""}</div>`;
      if(!res.score)h+='<div class="row"><button class="btn" data-act="override">I was right, count it</button></div>';
    }
  }else{
    const st=r.stage[r.i]||0;
    h+=`<textarea id="wtext" placeholder="Write your answer as you would in the exam..."${st?" disabled":""}>${esc(r.text[r.i]||"")}</textarea>`;
    if(!st)h+='<div class="row"><button class="btn primary" data-act="reveal">Show model answer</button></div>';
    else{
      const tk=r.ticks[r.i]||{};const got=q.pts.filter((_,i)=>tk[i]).length;
      h+=`<div class="lab">Model answer</div><div class="a" style="border-left:3px solid var(--accent);padding-left:14px">${esc(q.model)}</div><div class="lab">Tick every marking point your answer made</div><div class="pts">`+q.pts.map((p,i)=>`<label><input type="checkbox" data-act="wtick" data-i="${i}"${tk[i]?" checked":""}${res?" disabled":""}><span>${esc(p)}</span></label>`).join("")+"</div>";
      if(!res)h+=`<div class="row"><button class="btn primary" data-act="wsave">Save score (${fmt(got/q.pts.length*T.m)} of ${T.m})</button></div>`;
      else h+=`<div class="fb ${res.score>=T.m?"ok":"no"}">Scored ${fmt(res.score)} of ${T.m}.</div>`;
    }
  }
  if(res){h+=`<div class="row"><button class="btn primary" data-act="next">${r.i+1<r.qs.length?"Next question":"See results"}</button></div>`;}
  return h+"</div>";
}
function fmt(x){return (Math.round(x*2)/2).toString();}
function setRes(score,extra){const r=S.run,q=r.qs[r.i];r.res[r.i]=Object.assign({score:score,max:TM[q.t].m},extra||{});render();}
function evalResult(){
  const r=S.run;let sc=0,mx=0;const by={};
  r.qs.forEach((q,i)=>{const x=r.res[i]||{score:0,max:TM[q.t].m};sc+=x.score;mx+=x.max;const b=by[q.t]||(by[q.t]={s:0,m:0,n:0});b.s+=x.score;b.m+=x.max;b.n++;});
  const pct=Math.round(sc/mx*100);
  const msg=pct>=85?"Exam ready on this material.":pct>=65?"Solid. Revisit the misses below.":pct>=40?"Getting there. Use the Learn section on the weak topics.":"Go back to the recall cards, then try again.";
  let h=`<div class="panel"><div class="lab">Result</div><div class="score">${fmt(sc)} / ${mx} <span style="font-size:1.5rem;color:var(--muted)">${pct}%</span></div><p>${msg}</p><div style="display:flex;flex-direction:column;gap:10px">`;
  TYPES.forEach(t=>{const b=by[t.k];if(!b)return;const p=Math.round(b.s/b.m*100);h+=`<div><div class="row" style="justify-content:space-between"><span>${esc(t.n)} (${b.n})</span><b>${fmt(b.s)}/${b.m}</b></div><div class="bar"><i style="width:${p}%"></i></div></div>`;});
  const missed=r.qs.filter((q,i)=>(r.res[i]||{score:0}).score<TM[q.t].m).length;
  h+=`</div><div class="row">${missed?`<button class="btn primary" data-act="retry">Retry the ${missed} missed</button>`:""}<button class="btn" data-act="newtest">New test</button></div></div>`;
  h+="<h2>Review</h2>";
  r.qs.forEach((q,i)=>{const x=r.res[i]||{score:0,max:TM[q.t].m};const ok=x.score>=x.max;
    let ans=q.t==="mcq"?q.opts[q.a]:q.t==="tf"?(q.a?"True":"False"):q.model;
    h+=`<div class="rev ${ok?"ok":"bad"}"><div class="lab">${esc(TM[q.t].n)} · ${fmt(x.score)}/${x.max}</div><b>${esc(q.q)}</b>${x.resp?`<div class="r">You: ${esc(x.resp)}</div>`:""}<div class="r">${ok?"":"Answer: "}${esc(ans)}</div></div>`;});
  return '<div style="display:flex;flex-direction:column;gap:14px">'+h+"</div>";
}
function finishRun(){
  const r=S.run;let sc=0,mx=0;r.qs.forEach((q,i)=>{const x=r.res[i]||{score:0,max:TM[q.t].m};sc+=x.score;mx+=x.max;});
  if(!r.retry){store.hist.unshift({d:new Date().toLocaleDateString(undefined,{day:"numeric",month:"short"}),pct:Math.round(sc/mx*100),n:r.qs.length});store.hist=store.hist.slice(0,8);save();}
  S.ev.view="result";
}

/* ============ EVENTS ============ */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");if(!el)return;
  const a=el.dataset.act,v=el.dataset.v;
  switch(a){
    case "tab":S.tab=v;render();break;
    case "lv":S.lv=v;render();break;
    case "csec":S.cards.sec=+v;buildQueue();render();break;
    case "flip":S.cards.flip=true;render();break;
    case "cnext":buildQueue();render();break;
    case "creset":CARDS.forEach((k,i)=>{if(S.cards.sec<0||k[0]===S.cards.sec)delete store.box[i];});save();buildQueue();render();break;
    case "rate":{const q=S.cards.queue,id=q.shift();let b=store.box[id]||0;
      if(v==="miss"){b=1;q.splice(Math.min(3,q.length),0,id);}
      else if(v==="almost"){b=Math.max(b,1);q.push(id);}
      else{b=b<2?2:3;S.cards.done++;}
      store.box[id]=b;save();S.cards.flip=false;S.cards.guess="";render();break;}
    case "cord":S.cards.ordered=v==="1";buildQueue();render();break;
    case "pstep":openStep(+v);break;
    case "pback":S.path.step=null;render();window.scrollTo(0,0);break;
    case "pnotes":S.path.ph="primer";render();window.scrollTo(0,0);break;
    case "pstart":S.path.ph="learn";S.path.i=0;render();break;
    case "plback":if(S.path.i>0)S.path.i--;render();break;
    case "plnext":{const P=S.path,ids=stepChunks(STEPS[P.step])[P.ch];
      if(P.i+1<ids.length)P.i++;else{P.ph="recall";P.q=shuffle(ids.slice());P.flip=false;P.guess="";}
      render();break;}
    case "pflip":S.path.flip=true;render();break;
    case "prate":{const P=S.path;applyRate(P.q,v);P.flip=false;P.guess="";
      if(!P.q.length){store.path.ch[P.step]=P.ch+1;save();P.ph="roundend";}
      render();break;}
    case "pnext":{const P=S.path,N=stepChunks(STEPS[P.step]).length;
      if(P.ch+1<N){P.ch++;P.ph="learn";P.i=0;}else P.ph="gaps";
      render();window.scrollTo(0,0);break;}
    case "pdump":S.path.ph="dump";render();window.scrollTo(0,0);break;
    case "pcheck":{const t=$("#ptext");if(t)S.path.text=t.value;S.path.dchecked=true;render();break;}
    case "pfinish":store.path.done[S.path.step]=true;save();S.path.ph="done";render();window.scrollTo(0,0);break;
    case "pnextstep":openStep(S.path.step+1);break;
    case "blank":el.classList.toggle("on");break;
    case "revall":document.querySelectorAll(".blank").forEach(b=>b.classList.add("on"));break;
    case "hideall":document.querySelectorAll(".blank").forEach(b=>b.classList.remove("on"));break;
    case "mask":if(el.classList.contains("hid")){el.classList.remove("hid");el.removeAttribute("role");}break;
    case "tmode":S.tmode[el.dataset.t]=v;render();break;
    case "dtopic":S.dump={i:+v,text:"",checked:false,ticks:{}};render();break;
    case "dcheck":S.dump.checked=true;render();break;
    case "dreset":S.dump.checked=false;S.dump.ticks={};S.dump.text="";render();break;
    case "estart":{const pool=shuffle(BANK.filter(b=>S.ev.types[b.t]));const list=S.ev.n?pool.slice(0,S.ev.n):pool;
      list.sort((x,y)=>TYPES.findIndex(t=>t.k===x.t)-TYPES.findIndex(t=>t.k===y.t));startRun(list);break;}
    case "mcq":{const r=S.run,q=r.qs[r.i],i=+el.dataset.i;setRes(q.o[i].c?1:0,{pick:i,resp:q.o[i].t});break;}
    case "tf":{const r=S.run,q=r.qs[r.i],p=v==="true";setRes(p===q.a?1:0,{pick:p,resp:p?"True":"False"});break;}
    case "check":doCheck();break;
    case "override":{const r=S.run;r.res[r.i].score=TM[r.qs[r.i].t].m;render();break;}
    case "reveal":{const r=S.run;r.text[r.i]=$("#wtext").value;r.stage[r.i]=1;render();break;}
    case "wsave":{const r=S.run,q=r.qs[r.i],tk=r.ticks[r.i]||{};const got=q.pts.filter((_,i)=>tk[i]).length;setRes(Math.round(got/q.pts.length*TM[q.t].m*2)/2,{resp:r.text[r.i]||""});break;}
    case "next":{const r=S.run;if(r.i+1<r.qs.length){r.i++;render();window.scrollTo(0,0);}else{finishRun();render();window.scrollTo(0,0);}break;}
    case "retry":{const r=S.run;const list=r.qs.filter((q,i)=>(r.res[i]||{score:0}).score<TM[q.t].m);startRun(list);S.run.retry=true;break;}
    case "newtest":S.ev.view="setup";S.run=null;render();break;
    default:labClick(a,el,v);
  }
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.dataset.lsel){labSelect(el);return;}
  if(el.dataset.act==="etype"){S.ev.types[el.dataset.v]=el.checked?1:0;render();}
  else if(el.id==="en"){S.ev.n=+el.value;}
  else if(el.dataset.act==="ptick"){S.path.ticks[el.dataset.i]=el.checked;render();}
  else if(el.dataset.act==="dtick"){S.dump.ticks[el.dataset.i]=el.checked;render();}
  else if(el.dataset.act==="wtick"){const r=S.run;r.ticks[r.i]=r.ticks[r.i]||{};r.ticks[r.i][el.dataset.i]=el.checked;render();}
});
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.dataset&&el.dataset.cid){CS.src[el.dataset.cid]=el.value;return;}
  if(el.dataset&&el.dataset.iid){CS.inp[el.dataset.iid]=el.value;return;}
  if(el.dataset&&(el.dataset.lin||el.dataset.tcell!==undefined)){labInput(el);return;}
  if(el.id==="guess")S.cards.guess=el.value;
  else if(el.id==="pguess")S.path.guess=el.value;
  else if(el.id==="ptext")S.path.text=el.value;
  else if(el.id==="dtext")S.dump.text=el.value;
  else if(el.id==="ans"&&S.run)S.run.text[S.run.i]=el.value;
});
function doCheck(){
  const r=S.run,q=r.qs[r.i],v=($("#ans").value||"").trim();if(!v)return;
  r.text[r.i]=v;setRes((q.t==="calc"?matchCalc(v,q):matches(v,q.acc,q.all))?TM[q.t].m:0,{resp:v});
}
document.addEventListener("keydown",e=>{
  const t=e.target,tag=t.tagName;
  if(e.key==="Enter"&&t.id==="ans"){e.preventDefault();doCheck();return;}
  if(t.classList&&t.classList.contains("codearea")){
    if(e.key==="Tab"&&!e.shiftKey){e.preventDefault();const p=t.selectionStart;t.setRangeText("    ",p,t.selectionEnd,"end");CS.src[t.dataset.cid]=t.value;return;}
    if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)){e.preventDefault();const b=t.closest(".cw").parentElement.querySelector('[data-act="crun"],[data-act="fcheck"]');if(b)b.click();return;}
  }
  if(e.key==="Enter"&&t.id==="pguess2"){e.preventDefault();const b=document.querySelector('[data-act="pcheck2"]');if(b&&!b.disabled)b.click();return;}
  if((e.key==="Enter"||e.key===" ")&&t.classList&&t.classList.contains("hid")){e.preventDefault();t.click();return;}
  const inPath=S.tab==="learn"&&S.lv==="path"&&S.path.ph==="recall"&&S.path.q.length>0;
  const inCards=S.tab==="learn"&&S.lv==="cards"&&S.cards.queue.length>0;
  if(!(inPath||inCards)||tag==="INPUT"||tag==="TEXTAREA"||tag==="SELECT")return;
  const flipped=inPath?S.path.flip:S.cards.flip;
  if((e.key===" "||e.key==="Enter")&&tag!=="BUTTON"&&!flipped){e.preventDefault();if(inPath)S.path.flip=true;else S.cards.flip=true;render();}
  else if(flipped&&"123".includes(e.key)&&e.key){const m={"1":"miss","2":"almost","3":"got"};const b=document.querySelector('[data-act$="rate"][data-v="'+m[e.key]+'"]');if(b)b.click();}
});
render();
</script>

</body></html>
