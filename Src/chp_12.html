<style>
/* Layout: one centred column. Header carries the licence-spectrum strip, two big mode tabs sit under it, content swaps below. */
:root{
  --bg:#f2f5f1; --surface:#fbfcfa; --fg:#16221c; --muted:#5a6b62; --line:#d5ddd6;
  --accent:#0a6a4d; --accent-fg:#ffffff; --accent-soft:#dcefe6;
  --warn:#9a4a08; --warn-soft:#f6e6d4; --bad:#b3261e; --bad-soft:#f8dedb;
  --mask:#c5d1c9; --s1:#cfe8dc; --s2:#8fcfb3; --s3:#3f9c78; --s4:#0a6a4d;
  --display:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1512; --surface:#151e19; --fg:#e3ece6; --muted:#92a69b; --line:#26342c;
    --accent:#5fd7a8; --accent-fg:#06241a; --accent-soft:#17382b;
    --warn:#f0a15a; --warn-soft:#3a2a17; --bad:#ff8a80; --bad-soft:#3b1b19;
    --mask:#2c3a32; --s1:#1c3a2e; --s2:#2a6a50; --s3:#43a57f; --s4:#5fd7a8; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1512; --surface:#151e19; --fg:#e3ece6; --muted:#92a69b; --line:#26342c;
  --accent:#5fd7a8; --accent-fg:#06241a; --accent-soft:#17382b;
  --warn:#f0a15a; --warn-soft:#3a2a17; --bad:#ff8a80; --bad-soft:#3b1b19;
  --mask:#2c3a32; --s1:#1c3a2e; --s2:#2a6a50; --s3:#43a57f; --s4:#5fd7a8; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.55;
  padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:54rem;margin:0 auto;display:flex;flex-direction:column;gap:20px;min-width:0}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:clamp(2rem,6vw,3.1rem);font-weight:700;letter-spacing:-.01em}
h2{font-size:1.45rem;font-weight:700}
h3{font-size:1.05rem;font-weight:700}
p{margin:0}
.kicker,.lab{font-family:var(--mono);font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.top{display:flex;flex-direction:column;gap:12px}
.spectrum{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;max-width:30rem}
.spectrum i{display:block;height:10px;border-radius:2px}
.spectrum i:nth-child(1){background:var(--s1)}.spectrum i:nth-child(2){background:var(--s2)}
.spectrum i:nth-child(3){background:var(--s3)}.spectrum i:nth-child(4){background:var(--s4)}
.spectrum-l{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;max-width:30rem;font-family:var(--mono);font-size:.68rem;color:var(--muted)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.mode{font:600 1.1rem var(--display);padding:14px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px}
.mode small{font:400 .78rem var(--body);color:var(--muted)}
.mode[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.mode[aria-selected="true"] small{color:var(--accent-fg);opacity:.85}
button{font-family:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,.m:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.subnav{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:500 .85rem var(--body);padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.chip[aria-pressed="true"],.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--fg);box-shadow:inset 0 0 0 1px var(--accent)}
.btn{font:600 .92rem var(--body);padding:10px 16px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.good{border-color:var(--accent);color:var(--accent)}
.btn.warn{border-color:var(--warn);color:var(--warn)}
.btn.bad{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.hint{color:var(--muted);font-size:.9rem}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.stat b{display:block;font:700 1.35rem var(--display);font-variant-numeric:tabular-nums}
.stat span{font:.7rem var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.fc .q{font:600 1.35rem/1.3 var(--display)}
.fc .a{border-left:3px solid var(--accent);padding:4px 0 4px 14px;font-size:1.05rem}
input[type=text],textarea,select{width:100%;font:inherit;padding:10px 12px;border-radius:8px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg)}
textarea{min-height:9rem;resize:vertical}
.blank{font:inherit;display:inline-block;vertical-align:baseline;border:0;border-bottom:2px solid var(--accent);background:var(--mask);color:var(--fg);padding:0 .3em;border-radius:3px 3px 0 0;cursor:pointer;line-height:1.35}
.blank:not(.on) .ans{visibility:hidden}
.blank.on{background:var(--accent-soft)}
.note p{font-size:1.04rem;line-height:2}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:500 .72rem var(--mono);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);background:var(--bg);white-space:nowrap}
tr:last-child td{border-bottom:0}
td{min-width:9rem}
.m.hid{background:var(--mask);color:transparent;border-radius:4px;cursor:pointer;display:inline-block;user-select:none}
.m{display:inline}
.opt{display:block;width:100%;text-align:left;font:inherit;padding:12px 14px;border-radius:8px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer}
.opt.right{border-color:var(--accent);background:var(--accent-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opts{display:flex;flex-direction:column;gap:8px}
.fb{padding:12px 14px;border-radius:8px;font-size:.95rem}
.fb.ok{background:var(--accent-soft)}.fb.no{background:var(--bad-soft)}
.tag{font:500 .7rem var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:4px;background:var(--accent-soft);color:var(--fg)}
.pts{display:flex;flex-direction:column;gap:6px}
.pts label{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.pts input{margin-top:.3rem;accent-color:var(--accent)}
.score{font:700 3rem var(--display);font-variant-numeric:tabular-nums}
.tcount{display:flex;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:8px}
.tcount label{flex:1;display:flex;gap:10px;align-items:center;cursor:pointer;min-width:0}
.tcount input{accent-color:var(--accent);width:1.1rem;height:1.1rem}
.tcount span.n{font:.78rem var(--mono);color:var(--muted);white-space:nowrap}
.rev{border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:6px}
.rev.bad{border-left:4px solid var(--bad)}.rev.ok{border-left:4px solid var(--accent)}
.rev .r{font-size:.9rem;color:var(--muted)}
.nb{display:flex;flex-direction:column;gap:8px}
.nb ul{margin:0;padding-left:1.25rem;display:flex;flex-direction:column;gap:6px}
.nb p.def{border-left:3px solid var(--accent);background:var(--accent-soft);padding:8px 12px;border-radius:0 6px 6px 0}
.nb + .nb{border-top:1px solid var(--line);padding-top:16px}
@media (max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}.panel{padding:16px}.fc .q{font-size:1.2rem}}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .3s}}
/* ---- Code lab ---- */
:root{--code-bg:#fbfaf6;--code-fg:#1b2a22;--code-line:#d5ddd6;--ok-b:#0a6a4d;--ok-s:#dcefe6;--note-b:#9a4a08;--note-s:#f6e6d4}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--code-bg:#0a100d;--code-fg:#d8efe3;--code-line:#26342c;--ok-b:#5fd7a8;--ok-s:#17382b;--note-b:#f0a15a;--note-s:#3a2a17}}
:root[data-theme="dark"]{--code-bg:#0a100d;--code-fg:#d8efe3;--code-line:#26342c;--ok-b:#5fd7a8;--ok-s:#17382b;--note-b:#f0a15a;--note-s:#3a2a17}
.labwrap{display:flex;flex-direction:column;gap:16px;min-width:0}
code,.mono{font-family:var(--mono);font-size:.9em}
code.big{font-size:1.15rem;background:var(--accent-soft);padding:2px 8px;border-radius:5px}
.cw{display:flex;flex-direction:column;gap:8px;min-width:0}
.cw-bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.btn.sm{padding:6px 12px;font-size:.85rem}
.codearea,.codeview,.outpre{font:400 .88rem/1.55 var(--mono);background:var(--code-bg);color:var(--code-fg);border:1.5px solid var(--code-line);border-radius:8px;padding:12px 14px;margin:0;white-space:pre;overflow-x:auto;tab-size:4}
.codearea{width:100%;resize:vertical;min-height:5rem}
.outpre{white-space:pre-wrap;border-left:4px solid var(--accent)}
.outbox{display:flex;flex-direction:column;gap:8px;min-width:0}
.dim{color:var(--muted)}
.cw-in{display:flex;flex-direction:column;gap:4px}
.cin,input.mono{font-family:var(--mono)}
.rs{padding:10px 14px;border-radius:8px;font-size:.93rem;border-left:4px solid var(--line);background:var(--bg)}
.rs.ok{border-color:var(--ok-b);background:var(--ok-s)}
.rs.bad{border-color:var(--bad);background:var(--bad-soft)}
.rs.note,.rs.warn{border-color:var(--note-b);background:var(--note-s)}
.try{border:1px dashed var(--accent);border-radius:8px;padding:8px 12px;font-size:.93rem}
.note-box{background:var(--accent-soft);border-radius:8px;padding:10px 14px;font-size:.93rem}
ol.pipe{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0}
ol.pipe li{position:relative;padding:8px 12px 8px 34px;border-left:2px solid var(--line);margin-left:10px;font-size:.93rem}
ol.pipe li::before{content:"";position:absolute;left:-8px;top:12px;width:14px;height:14px;border-radius:50%;background:var(--bg);border:2px solid var(--line)}
ol.pipe li.done::before{background:var(--accent);border-color:var(--accent)}
ol.pipe li.cur{background:var(--accent-soft)}ol.pipe li.cur::before{border-color:var(--accent);background:var(--surface)}
ol.pipe li.fail{background:var(--bad-soft)}ol.pipe li.fail::before{background:var(--bad);border-color:var(--bad)}
ol.pipe li.warn{background:var(--note-s)}ol.pipe li.warn::before{background:var(--note-b);border-color:var(--note-b)}
ol.pipe li.pending{color:var(--muted)}
.bits{display:flex;flex-direction:column;gap:6px}
.brow{display:grid;grid-template-columns:5.5rem 1fr auto;gap:10px;align-items:center}
.brow.res{border-top:1px solid var(--line);padding-top:6px;font-weight:600}
.bl{font:.78rem var(--mono);color:var(--muted)}
.bv{display:flex;gap:2px;flex-wrap:wrap}
.bit{width:1.55rem;height:1.7rem;display:inline-flex;align-items:center;justify-content:center;font:500 .85rem var(--mono);border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--muted)}
.bit.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.bd{font:.85rem var(--mono)}
.b-s{color:var(--bad)}.b-e{color:var(--note-b)}.b-m{color:var(--accent)}
td.mono{word-break:break-all;min-width:0}
ol.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
ol.steps li{display:flex;flex-direction:column;gap:2px;padding:8px 12px;border:1px solid var(--line);border-radius:8px}
.exp{font-family:var(--mono);font-size:.92rem}.exp.res{color:var(--accent);font-weight:600}
.exp mark{background:var(--accent-soft);color:var(--fg);border-radius:3px;padding:0 3px;outline:1.5px solid var(--accent)}
ul.rules{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
ul.rules li{padding:6px 10px;border-radius:6px;font-size:.92rem}
ul.rules li.ok{background:var(--ok-s)}ul.rules li.no{background:var(--bad-soft)}
input.tcell{width:100%;min-width:4rem;font:.9rem var(--mono);padding:6px 8px}
input.tcell.good{border-color:var(--accent);background:var(--accent-soft)}
input.tcell.miss{border-color:var(--bad);background:var(--bad-soft)}
.nb .cw{margin-top:4px}
.nb ol.pipe{margin-top:4px}
@media (max-width:520px){.brow{grid-template-columns:1fr}.bit{width:1.3rem}}

</style>

<div class="wrap">
  <header class="top">

<script>
"use strict";
/* ============ DATA ============ */
const SECS=["Programming basics","History of C++","Development environment","Program structure","Data types","Variables and constants","Input and output","Operators","Expressions and conversion","Debugging"];
const CORE=[
[0,"Define a program.","A finite, ordered sequence of instructions, written in a programming language, that directs a computer to perform one specific, well-defined task."],
[0,"Define software, and say how it differs from a program.","A complete, integrated collection of programs together with supporting data files, documentation and configuration that provides a full set of capabilities to a user. Programs are the executable components from which software is built. Example: Microsoft Word is software built from thousands of programs and modules."],
[0,"What is programming?","The mechanism by which human intent becomes computer action. A computer is entirely passive: it does exactly, and only, what it is told."],
[0,"Which generation of language is C++, and what characterises that generation?","Third generation: high-level languages (C, C++, Java, Python) with human-readable syntax that hide the hardware."],
[0,"Describe the first, second and fourth generations.","First and second (machine and assembly language): binary instructions and processor mnemonics, powerful but laborious and error-prone. Fourth (for example SQL): the programmer declares what result is wanted rather than how to compute it."],
[0,"Why is C++ called a middle-level language?","It combines high-level features (readable syntax, classes, templates) with low-level features (pointers, direct memory access, hardware access) in one language, rather than belonging wholly to either camp."],
[0,"Why does compiled C++ run so fast?","The programmer controls precisely how memory and the processor are used, so compiled C++ executes at speeds approaching hand-written assembly language."],
[0,"Which two paradigms does C++ support?","Procedural and object-oriented, at once. (Paradigm describes how a program is structured, separately from generation.)"],
[0,"List the seven defining features of C++.","Compiled; object-oriented; procedural; low-level memory access; generic (templates); rich standard library; portable."],
[0,"State the main advantages of C++.","Unmatched performance among high-level languages; spans high-level object-oriented design down to low-level hardware work; portability; a vast ecosystem of libraries and tools; a large community built over decades of industrial use."],
[0,"State the main limitations of C++.","Harder to learn than many modern languages; syntax complexity accumulated over decades; manual memory management introduces whole classes of bugs; more verbose than Python or Java; the compilation step slows the edit-and-test cycle."],

[1,"Who created C, where, and when?","Dennis Ritchie at Bell Labs, between 1969 and 1973."],
[1,"Why was C created?","Chiefly to rewrite the Unix operating system, which had been written in assembly language, in something more portable and maintainable. It became the lingua franca of systems programming."],
[1,"Who created C++ and when did he begin?","Bjarne Stroustrup, a Danish computer scientist at Bell Labs, began developing it in 1979."],
[1,"What was 'C with Classes'?","Stroustrup's first project (1979): C extended with class definitions, basic inheritance and function inlining, borrowing ideas from Simula, a pioneering 1960s object-oriented language."],
[1,"What was Stroustrup's central insight?","The organisational power of object-oriented programming could be added to C without sacrificing the speed and low-level control that made C valuable."],
[1,"When was C++ renamed, and why that name?","1983. ++ is C's increment operator, so 'C++' reads as 'C, incremented': an improved C, still marked as a distinct language."],
[1,"When did the first commercial C++ compiler and Stroustrup's book appear?","1985: the first commercial compiler, and the first edition of The C++ Programming Language, which became the definitive reference."],
[1,"Which bodies standardised C++, and what was the first standard?","ANSI and ISO jointly. The first standard was C++98, formally ISO/IEC 14882:1998."],
[1,"Why was standardisation needed?","Compilers from different vendors began implementing C++ with subtle differences, harming portability. A single authoritative definition of syntax, semantics and standard library fixed that."],
[1,"Name the ISO C++ standards in order, with years.","C++98 (1998), C++03 (2003), C++11 (2011), C++14 (2014), C++17 (2017), C++20 (2020), C++23 (2023)."],
[1,"Which standard is the landmark revision, and what did it add?","C++11: auto type deduction, range-based for, lambda expressions, smart pointers, move semantics and threading."],
[1,"Exam: dates and names in the history of C++","C: Dennis Ritchie (1969-1973, Bell Labs). C++: Bjarne Stroustrup (from 1979 as C with Classes, renamed 1983, first commercial compiler 1985). First standard C++98; landmark revision C++11. Both languages were born at Bell Labs."],

[2,"What is a development environment?","The set of tools needed to write, translate and run programs."],
[2,"What is source code, and which extensions does C++ use?","Human-readable text written in an editor or IDE. .cpp for main source files and .h for header files. It is plain text, so any text editor can produce it."],
[2,"What does the compiler do, in two phases?","Phase 1: the preprocessor handles every directive beginning with # (expanding macros, inserting header files, conditional compilation). Phase 2: the preprocessed source is translated into object code, stored in an object file."],
[2,"What is object code, and what are the object file extensions?","Machine instructions in a relocatable, not yet linked form. .obj on Windows, .o on Linux and macOS."],
[2,"What happens when the compiler finds an error?","Any violation of C++ syntax or type rules is reported as a compile-time error, and no object file is produced until the errors are fixed."],
[2,"What does the linker do?","Combines one or more object files with pre-compiled library code (such as the C++ Standard Library) into a single executable file, resolving external references between them."],
[2,"What is an external reference, and what is a linker error?","An external reference is a call from one file to a function defined in another file or in a library. If the called function's definition cannot be found anywhere, the linker reports a linker error."],
[2,"Compiler error versus linker error","Compiler error: the source breaks C++'s rules, so it cannot be translated. Linker error: every file translated fine, but a function that was called is never defined in any file or library supplied. Forgetting to write a function body is reported by the linker, not the compiler."],
[2,"What is an IDE and what does it combine?","Integrated Development Environment: editor, compiler, linker and debugger in one interface, often adding a file browser, build-system and version-control integration, code completion and refactoring tools."],
[2,"Trace the complete compilation process.","Source code (.cpp) → preprocessor → preprocessed code → compiler → object file (.obj / .o) → linker → executable (.exe) → OS loader → running program."],
[2,"What does the loader do?","The operating system's loader (Lesson 3) copies the executable into memory and begins execution at main()."],
[2,"Which kind of error arises at which stage of the pipeline?","Compile-time errors at the compiler stage; linker errors at the linker stage; run-time errors in the running program."],
[2,"Define compile-time errors.","Mistakes that violate C++'s rules and are detected by the compiler during translation. They stop compilation, so no executable exists until they are corrected."],
[2,"Define run-time errors.","Errors that occur while the program executes, after successful compilation and linking. The compiler cannot detect them because they depend on actual data, user input or system conditions. They are generally harder to find."],
[2,"Exam: how to answer a question on the compilation process","Draw the pipeline with the tool and the file type at every stage: source (.cpp) → preprocessor → compiler → object (.obj/.o) → linker → executable (.exe) → loader → running program. Marks are awarded for the order and for naming what each tool produces."],

[3,"What does #include <iostream> do?","A preprocessor directive that pastes the contents of the iostream header at that point, declaring the input/output facilities including cout, cin and endl. Without it the compiler has never heard of them."],
[3,"What is a comment, and what are the two styles?","Text for human readers that the compiler discards completely. // runs to the end of the line; /* ... */ may span many lines."],
[3,"Can multi-line comments be nested?","No. The first */ ends the comment, however many /* came before it. Use // on each line when temporarily disabling code that already contains comments."],
[3,"What makes a good comment?","It explains why, not what. '// convert paise to rupees' is useful; '// add one to count' beside count++ merely repeats the code."],
[3,"What is a preprocessor directive?","A line beginning with #, handled before compilation proper begins."],
[3,"Angle brackets versus quotation marks in #include","<iostream>: search the standard system directories (a standard library header). \"myfile.h\": search the program's own folder first (your own header file)."],
[3,"What is a namespace?","A grouping of names under a label so that identical names in different namespaces cannot collide."],
[3,"What are std and ::?","std is the namespace holding everything in the C++ Standard Library, so the fully qualified name of the output stream is std::cout. :: is the scope resolution operator."],
[3,"Two ways to reach names in std. Which is safer?","Qualify each name (std::cout) or import the whole namespace once (using namespace std;). The second is shorter and used throughout this course, but in large programs it is discouraged because it can reintroduce collisions. Writing std:: in full is the safer habit."],
[3,"What is main() and why must there be exactly one?","The entry point: when the OS loader starts the program, execution begins at the first statement inside main() and ends when main() finishes."],
[3,"What does return 0; mean in main()?","By universal convention, 'everything went well'. Any non-zero value signals a particular kind of failure to the operating system or the program that launched this one. In C++ return 0; may be omitted from main() and the compiler supplies it."],
[3,"What does the int before main mean?","It is the function's return type: it promises to hand back an integer."],
[3,"What is a statement, and what ends it?","A single complete instruction. Nearly every statement ends with a semicolon, which tells the compiler where one instruction stops and the next begins."],
[3,"What is a block?","A group of statements enclosed in braces { }, treated as a single unit."],
[3,"Does layout matter to the compiler?","No. Line breaks and spacing are ignored; the semicolon, not the newline, is the terminator. Three statements may share a line, and one statement may span three lines."],
[3,"Why does a missing-semicolon error often point to the wrong line?","The compiler only realises a statement has not ended when it meets the next line's first token, so the message often points to the line after the real mistake. Check the end of the line above."],
[3,"What is a token? Name the five kinds.","The smallest meaningful unit of source code, found by lexical analysis (Lesson 3). Keywords, identifiers, literals, operators and punctuators."],
[3,"What is a keyword?","A reserved word with fixed meaning (int, float, char, if, else, for, while, return, class, void, const, new). Always lowercase, and cannot be used as the name of a variable or function."],
[3,"What is an identifier?","A name chosen by the programmer for a variable, function or other entity, for example age, totalMarks, calculateTax."],
[3,"State the five rules for identifiers.","1. Only letters, digits and the underscore. 2. Must begin with a letter or underscore, never a digit. 3. Case-sensitive: Age, age and AGE are different. 4. Cannot be a keyword. 5. No fixed length limit in practice."],
[3,"Valid or invalid: 1st_student, total-marks, my age, int, _count, student1","Invalid: 1st_student (starts with a digit), total-marks (hyphen), my age (space), int (keyword). Valid: _count, student1."],
[3,"Name two naming conventions.","camelCase (totalMarks) and snake_case (total_marks). Whichever is chosen, use it consistently."],
[3,"Exam: how to answer 'which identifiers are valid?'","Check each name against the rules in order: starts with a letter or underscore? only letters, digits and underscores? not a keyword? float looks fine but fails the last test, and marks# fails the second."],

[4,"What does 'statically typed' mean?","Every value has a data type that is fixed and checked at compile time."],
[4,"What three things does a data type tell the compiler?","How much memory the value occupies, how the stored bits are to be interpreted, and which operations are legal on it."],
[4,"Why does the same pattern mean 65 to an int and A to a char?","Memory holds only binary patterns (Lesson 2); the type is what gives a pattern its meaning."],
[4,"Name the six fundamental data types.","int, float, double, char, bool, void."],
[4,"State what each fundamental type holds and its typical size.","int: whole numbers, 4 bytes. float: real numbers (about 7 significant digits), 4 bytes. double: real numbers (about 15 significant digits), 8 bytes. char: a single character, 1 byte. bool: true or false, 1 byte. void: no value (used for functions that return nothing)."],
[4,"What is the range of a 4-byte int?","Two's complement with 32 bits: -2^31 to 2^31 - 1, that is -2,147,483,648 to 2,147,483,647. One more negative value than positive."],
[4,"How does char connect to Lesson 2?","char stores a character as its ASCII code. 'A' is 65, 'a' is 97, '0' is 48, so 'A' + 1 is 66 (the character B when stored back into a char)."],
[4,"How do float and double connect to Lesson 2?","They are the IEEE 754 single (32-bit) and double (64-bit) formats. Because they store a binary approximation, 0.1 + 0.2 is not exactly 0.3."],
[4,"What is integer overflow?","The overflow of Lesson 2: add one to the largest int and the result wraps around to the most negative one."],
[4,"Name the four type modifiers.","signed, unsigned, short and long."],
[4,"Give the range formulas for an n-bit type.","Signed: -2^(n-1) to 2^(n-1) - 1. Unsigned: 0 to 2^n - 1. The unsigned type spends the sign bit on magnitude, doubling the positive range."],
[4,"What does sizeof do, and why is it needed?","It reports the size of a type in bytes. The standard fixes only minimum sizes, so the actual size depends on the platform. sizeof(char) is always 1 by definition."],
[4,"Why prefer double over float, and what should money use?","float carries only about seven significant digits, so accumulated rounding error appears quickly. Never use a floating-point type for money: store rupees as whole paise in an integer (Lesson 2)."],
[4,"Exam: range of an unsigned type of given size","Compute it from the bit count rather than recalling it. A 2-byte unsigned type has 16 bits, so 0 to 2^16 - 1 = 65,535; the signed version is -2^15 to 2^15 - 1."],

[5,"What is a variable? Give its four properties.","A named location in memory that holds a value which may change while the program runs. Properties: name (its identifier), type, value and address. The name is a human-friendly label for the address."],
[5,"Declaration, initialisation, assignment: distinguish them.","Declaring creates the variable (int x;). Initialising gives it a value at creation (int x = 5;). Assigning changes an existing variable (x = 9;)."],
[5,"What does an uninitialised local variable hold?","An indeterminate value: whatever bits happened to be in that memory. Using it produces unpredictable results, a famously hard-to-find bug. Initialise every variable when you declare it."],
[5,"Define scope.","The region of the program in which a name can be used."],
[5,"Local versus global variable","Local: declared inside a function or block; visible only from its declaration to the closing brace; created when execution reaches it and destroyed when the block ends (its lifetime). Global: declared outside every function; visible to the whole file below its declaration; lives for the entire run of the program."],
[5,"Why prefer local variables?","Global variables can be changed from anywhere, which makes it hard to tell which part of a large program altered a value. Local variables keep each part of a program self-contained."],
[5,"What is a constant, and how is one defined?","A named value that cannot change after it is set. The preferred form is the const qualifier (const double PI = 3.14159;), which the compiler enforces. The older style is #define MAX_MARKS 100."],
[5,"Why does const beat #define?","const has a type, obeys scope rules and is checked by the compiler. #define is blind text substitution done by the preprocessor."],
[5,"Why use named constants at all?","They give a number meaning (DAYS_IN_WEEK says more than a bare 7) and let a value used throughout a program be changed in one place."],
[5,"What is a literal? List the kinds.","A fixed value written directly in the source code. Integer (42, -7, 0x2A, 052), floating-point (3.14, 2.5e3, 1.5f), character ('A'), string (\"Hello\"), boolean (true, false)."],
[5,"Difference between 'A' and \"A\"","Single quotes make one char (the number 65). Double quotes make a string, which carries a hidden terminating character after the letter. Confusing them is a very common error."],

[6,"What is a stream?","A sequence of characters flowing between the program and a device. <iostream> supplies cout (console output, the stream to the screen) and cin (console input, the stream from the keyboard)."],
[6,"What is the insertion operator?","<<, which sends data into the output stream. Read it as an arrow pointing the way the data flows. It can be chained: cout << \"Age: \" << age << endl;"],
[6,"endl versus '\\n'","endl ends the line and flushes the output buffer. '\\n' ends the line without flushing and is slightly faster in output-heavy programs. For this course the two are interchangeable."],
[6,"What is an escape sequence?","A backslash followed by a character, standing for one special character that cannot be typed directly inside quotes, such as a new line."],
[6,"List the common escape sequences.","\\n new line; \\t horizontal tab; \\\\ a literal backslash; \\\" a literal double quote; \\' a literal single quote; \\0 the null character."],
[6,"What is the extraction operator?","The operator >>, which takes data from the input stream and stores it in a variable; the arrow points into the variable. Input is converted according to the variable's type."],
[6,"How does cin treat whitespace?","As a separator: spaces, tabs or new lines. So two numbers may be typed on one line or on separate lines."],
[6,"Why print a prompt before reading with cin?","It tells the user what is expected."],
[6,"Why does cin >> name capture only 'Anita' from 'Anita Nair'?","cin >> stops at whitespace. To read a whole line, spaces included, use getline(cin, name) from <string>."],
[6,"What happens if the user types letters where a number is expected?","cin enters a failure state and every later read silently does nothing. Input should not be trusted to be well-formed."],
[6,"Exam: direction of the arrows","cout << value sends data out to the screen; cin >> variable brings data in to the variable. \"2+3\" prints the text 2+3, while 2+3 prints 5. Output questions usually hinge on endl, tabs, and whether arithmetic is inside or outside the quotes."],

[7,"Define operator, operand, unary, binary and ternary.","An operator is a symbol that performs an operation on one or more operands. Unary: one operand. Binary: two. C++ has exactly one ternary operator, taking three. Operators and operands combine into expressions, each of which produces a value."],
[7,"List the arithmetic operators with examples.","+ addition (7 + 2 = 9); - subtraction (7 - 2 = 5); * multiplication (7 * 2 = 14); / division (7 / 2 = 3, integer division); % modulus, the remainder (7 % 2 = 1)."],
[7,"What is integer division?","When both operands of / are integers the result is an integer and the fraction is discarded: 7 / 2 is 3 and 1 / 2 is 0. For 3.5, at least one operand must be a floating-point value, as in 7.0 / 2."],
[7,"On which operands does % work, and what is it useful for?","Only integers. n % 2 == 0 tests whether n is even; n % 10 extracts the last digit; n / 10 removes it."],
[7,"What do relational operators produce?","A bool, true or false, which print as 1 and 0 in C++. The operators are ==, !=, <, >, <= and >=."],
[7,"= versus ==","= assigns; == compares. Writing if (x = 5) instead of if (x == 5) assigns 5 to x and, since 5 is non-zero, the condition is always true. Among the best-known bugs in the C family of languages."],
[7,"List the logical operators.","&& (AND: true only if both operands are true), || (OR: true if at least one operand is true), ! (NOT: reverses true and false). They are the gates of Lesson 2 and obey the same truth tables and De Morgan's laws."],
[7,"What is short-circuit evaluation?","In A && B, if A is false the result must be false, so B is never evaluated; in A || B, if A is true, B is skipped. So (d != 0 && n / d > 2) is safe: when d is zero the division never happens."],
[7,"List the compound assignment operators.","+=, -=, *=, /= and %=. x += 5 means x = x + 5; x %= 5 means x becomes the remainder of x divided by 5."],
[7,"Prefix versus postfix increment","Prefix (++a): increment first, then use the value. Postfix (c++): use the old value first, then increment. int a=5; int b=++a; gives a=6, b=6. int c=5; int d=c++; gives c=6, d=5. When the expression stands alone the two are identical."],
[7,"List the bitwise operators, with results for 5 and 3.","& AND: 5 & 3 = 1. | OR: 5 | 3 = 7. ^ XOR: 5 ^ 3 = 6. ~ NOT: ~5 = -6. << left shift: 5 << 1 = 10. >> right shift: 5 >> 1 = 2."],
[7,"What do the shift operators do arithmetically?","Shifting left by one multiplies by 2 (5 << 1 = 10, binary 1010). Shifting right by one divides by 2, discarding the remainder (5 >> 1 = 2, binary 0010)."],
[7,"Why is ~5 equal to -6?","~ flips every bit; in two's complement that is -5 - 1 = -6."],
[7,"State the form of the conditional (ternary) operator.","condition ? value_if_true : value_if_false. Example: int larger = (a > b) ? a : b; It is the C++ counterpart of the spreadsheet IF function (Lesson 9)."],
[7,"Define precedence and associativity.","Precedence decides which operator is applied first; associativity breaks ties between operators of equal precedence. Parentheses override both."],
[7,"Give the precedence order, highest first.","1 parentheses; 2 postfix ++ --; 3 ! ~ unary + - and prefix ++ --; 4 * / %; 5 + -; 6 << >>; 7 < <= > >=; 8 == !=; 9 &, then ^, then |; 10 &&, then ||; 11 ?: = += and so on."],
[7,"Which levels associate right to left?","Level 3 (unary operators and prefix ++ --) and level 11 (?: and the assignments). The rest are left to right; parentheses work inside out."],
[7,"Exam: how to answer a precedence question","Never rely on memorised precedence when parentheses make intent plain. But examination questions deliberately omit parentheses, so work through the table level by level and show each step."],

[8,"What is an expression, and how does it differ from a statement?","An expression is any combination of values, variables, operators and function calls that evaluates to a single value: 5, x, x + 5, (x + 5) * 2 > 30. A statement is a complete instruction, very often an expression followed by a semicolon: y = x + 5; Expressions have values; statements do things."],
[8,"What is implicit type conversion?","When an expression mixes operand types, the compiler automatically converts them to a common type before operating (also called type promotion). Values move from a narrower type to a wider one so that nothing is lost: char → int → long → float → double."],
[8,"Give an example of implicit conversion.","int a = 7; double b = 2.0; double r = a / b; promotes a to 7.0, so r = 3.5. char ch = 'A'; int n = ch + 1; makes ch become 65, so n = 66."],
[8,"Why is conversion from a wider type to a narrower one dangerous?","It can lose information. Assigning 3.99 to an int truncates to 3; it does not round. Assigning a value too large for the target type produces a wrong result, without any warning from some compilers."],
[8,"What is explicit type conversion (casting)?","Forcing a conversion deliberately. The modern form is static_cast<type>(expression); the older C style is (type)expression."],
[8,"Why does double wrong = total / count give 3.0 for 7 and 2?","Both operands are integers, so integer division discards the fraction before the assignment ever happens, even though the destination is a double."],
[8,"How do you get 3.5 from total and count?","Cast one operand: static_cast<double>(total) / count, or (double)total / count. The cast applies to the operand, not the result, so static_cast<double>(total / count) would convert the already-truncated 3 and still give 3.0."],
[8,"Predict: int a = 9, b = 2; double d = 2.0;","a / b = 4 (integer division). a / d = 4.5 (a promoted). (double)a / b = 4.5 (cast first, then divide). (double)(a / b) = 4.0 (divide first, then cast). a % b = 1."],
[8,"Implicit versus explicit conversion","Implicit: done by the compiler automatically; normally narrow to wide (safe); no syntax; double d = 5;. Explicit: done by the programmer deliberately; any direction, including lossy; static_cast<T>(x) or (T)x; (int)3.99 gives 3."],
[8,"Exam: two questions for every division","Are both operands integers? And if a cast is present, is it applied before or after the division?"],

[9,"What is a bug, and what is debugging?","A bug is a flaw in a program that makes it behave other than intended; debugging is the process of finding and fixing it. It is not a sign of failure but the normal condition of the craft."],
[9,"Tell the story of the first 'bug'.","September 1947: operators of the Harvard Mark II computer traced a malfunction to a moth trapped in a relay and taped the insect into the logbook with the note 'First actual case of bug being found.' The team included Grace Hopper, the pioneer who also developed one of the first compilers."],
[9,"Name the three kinds of error.","Syntax, run-time and logical."],
[9,"Syntax error: cause, detection, example","Cause: the code breaks the language's grammar. Detected by the compiler, before running. Example: a missing semicolon."],
[9,"Run-time error: cause, detection, example","Cause: an illegal operation during execution. Detected when the program runs. Example: division by zero."],
[9,"Logical error: cause, detection, example","Cause: the code is legal but the algorithm is wrong. Detected only by checking the output. Example: using + instead of *. The most dangerous kind, because the program compiles, runs to the end and prints a plausible wrong answer, and nothing tells you anything is wrong."],
[9,"What is the only defence against logical errors?","Testing with inputs whose correct answers you already know."],
[9,"Show a logical error with the average of three marks.","double avg = m1 + m2 + m3 / 3; divides only m3 by 3, because of precedence. The fix is double ok = (m1 + m2 + m3) / 3; where the parentheses fix the precedence."],
[9,"List the seven systematic debugging techniques.","1 Read the error message, from the top. 2 Reproduce the bug with the smallest input. 3 Trace by hand with a trace table. 4 Print intermediate values. 5 Use the debugger (breakpoint, step). 6 Change one thing at a time. 7 Explain it aloud (rubber duck)."],
[9,"Why read the error message from the top?","The first error is often the real one; later errors are frequently consequences of it. Note the line number, but remember that for a missing semicolon the true fault is on the previous line."],
[9,"What are a breakpoint and stepping?","An IDE's debugger lets you set a breakpoint (a marked line where execution pauses), then step through one statement at a time and inspect every variable as you go."],
[9,"What is a trace table?","A table recording each variable's value after every statement, which you compare with what you expected."],
[9,"Trace: int x = 4; int y = x * 2; x = y - x; y += x;","After each statement, (x, y): (4, undefined), (4, 8), (4, 8), (4, 12). x = y - x gives 8 - 4 = 4, so x stays 4; then y += x gives 8 + 4 = 12. Final values: x = 4, y = 12."],
[9,"How can bugs be prevented?","Initialise every variable. Use meaningful names and comment the why. Write and test small pieces before combining them. Parenthesise whenever precedence is not obvious. Turn on the compiler's warnings (for GCC, the -Wall option) and treat each warning as a probable bug."],
[9,"Exam: three-way classification of errors","Give the cause, when it is detected and an example for each of syntax, run-time and logical errors, and state clearly that logical errors are the hardest because no tool announces them. A trace table, drawn neatly, is also a reliable source of marks in 'find the output' questions."]
];

[0,"Why does programming matter?","Every piece of software in existence, from the operating system managing a phone's hardware to the recommendation algorithm choosing the next video, from a climate simulation to a console game, was created by programming. Learning to program turns a computer from something you consume into something you can direct."],
[0,"Why is C++ described as 'a high-level language with a low-level door'?","It is high-level (structured and object-oriented programming with readable syntax) yet provides capabilities most high-level languages hide: direct memory manipulation, hardware access and fine control over system resources. The same language can write an operating system kernel (low level) or a 3D game (high level), sometimes within one program."],
[0,"C++ application: operating systems","Windows and macOS components, and parts of Linux drivers and system utilities."],
[0,"C++ application: games and engines","Unreal Engine and countless commercial games."],
[0,"C++ application: databases","MySQL and MongoDB."],
[0,"C++ application: web browsers","Chrome, Firefox and Safari are written substantially in C++ (the Firefox met in Lesson 11 is one of them)."],
[0,"C++ application: compilers and runtimes","Many compilers, including parts of GCC."],
[0,"C++ application: finance","Trading systems, where microseconds carry monetary consequences."],
[0,"C++ application: embedded systems","Cars, medical devices, industrial control and consumer electronics."],
[0,"C++ application: graphics software","Adobe Photoshop, Illustrator and Premiere Pro."],
[0,"C++ application: scientific computing","Physics simulation, fluid dynamics and numerical analysis."],
[0,"Feature: compiled","Translated entirely to machine code before execution, giving fast runtime performance (Lesson 3's compiler)."],
[0,"Feature: object-oriented","Classes and objects bundle data and behaviour, enabling modular, reusable, maintainable code."],
[0,"Feature: procedural","Functions and control structures can be used without objects at all, in the traditional structured style."],
[0,"Feature: low-level memory access","Pointers, which are variables that store memory addresses, give direct control over how data is stored."],
[0,"Feature: generic","Templates let code work with any data type without losing type safety or speed."],
[0,"Feature: rich standard library","Ready-made vectors, lists, maps, sorting, searching and I/O."],
[0,"Feature: portable","The same source compiles on any platform for which a C++ compiler exists."],
[0,"Which bugs come from manual memory management?","Dangling pointers, memory leaks and buffer overflows, which languages with automatic memory management eliminate."],
[0,"For which tasks is C++ a poor fit?","Rapid prototyping, scripting and web development, where development speed matters more than execution speed."],
[0,"Why is the same language described as middle-level in the exam?","Exam insight: 'Why is C++ called a middle-level language?' The accurate answer is that it combines high-level features (readable syntax, classes, templates) with low-level features (pointers, direct memory and hardware access) in one language."],

[1,"Why did the early 1980s need object-oriented programming?","Growing software complexity demanded better tools for organising large codebases. Object-oriented programming organises code around objects that combine data with the functions acting on it, but adopting it in C needed awkward workarounds and carried performance costs."],
[1,"What was Simula?","A pioneering object-oriented language of the 1960s that had shaped Stroustrup's doctoral research; ideas from it were borrowed into C with Classes."],
[1,"What is the pedantic point about the name C++?","++ is the increment operator, but strictly the postfix value is the old one, so 'C++' still evaluates to plain C. The postfix-versus-prefix distinction is what makes the joke slightly wrong."],
[1,"Which curriculum standards matter most for NIOS?","C++98 and C++11 features."],
[1,"How is C++'s standardisation an example of Lesson 11?","It is the open-standards process: a body (ISO) publishing a specification so that independent compiler writers produce compatible implementations."],
[1,"C++98","1998: the first ISO standard."],
[1,"C++03","2003: a minor bug-fix revision of C++98."],
[1,"C++11","2011: a landmark revision with auto type deduction, range-based for, lambda expressions, smart pointers, move semantics and threading."],
[1,"C++14","2014: refinements and additions."],
[1,"C++17","2017: further refinements."],
[1,"C++20","2020: modules, concepts, coroutines and ranges."],
[1,"C++23","2023: the most recent standard."],

[2,"GCC","The most widely used free compiler on Linux and macOS (its C++ front end is g++). GCC is part of the GNU Project from Lesson 11."],
[2,"Clang/LLVM","A modern compiler alternative, the default on macOS."],
[2,"MSVC","Microsoft's compiler in Visual Studio."],
[2,"What is an executable file and what are its extensions?","The final runnable file produced by the linker: .exe on Windows, usually no extension on Linux and macOS."],
[2,"IDE: Code::Blocks","Free, open source, cross-platform; commonly used for learning C++ (the usual choice for the NIOS course)."],
[2,"IDE: Dev-C++","Simple, lightweight, free; popular with beginners on Windows (the usual choice for the NIOS course)."],
[2,"IDE: Visual Studio","Microsoft's comprehensive IDE for Windows, with a free Community edition."],
[2,"IDE: CLion","JetBrains' professional cross-platform C++ IDE."],
[2,"IDE: Eclipse CDT","The C/C++ tools plugin for the Eclipse IDE."],
[2,"Compile-time errors: give examples.","A missing semicolon, a misspelled keyword, mismatched braces, an undeclared variable, a function called with the wrong number or type of arguments."],
[2,"Run-time errors: give examples.","Division by zero, accessing an array beyond its bounds, dereferencing a null pointer, reading a file that does not exist, exhausting memory."],
[2,"Compile-time versus run-time: who detects them, and when?","Compile-time: detected by the compiler during translation. Run-time: detected by nobody until the program runs, during execution."],
[2,"Compile-time versus run-time: is an executable produced? Ease of fixing?","Compile-time: no executable; generally easy to fix because the compiler names the line. Run-time: executable exists; often hard to fix and may depend on input."],

const NOTES=[
["1.1 Programming basics","A {{program}} is a finite, ordered sequence of instructions that directs a computer to perform one specific task, whereas {{software}} is the broader collection of programs, data files and documentation. C++ is a {{third}}-generation language that supports both {{procedural}} and {{object-oriented}} paradigms. It is called a {{middle-level}} language because it combines high-level features with low-level features such as {{pointers}}. Compiled C++ runs at speeds approaching {{assembly}} language. The limitations include harder learning, manual {{memory}} management and a slower edit-and-test cycle."],
["1.2 History of C++","{{C}} was created by {{Dennis Ritchie}} at {{Bell Labs}} between 1969 and 1973 to rewrite {{Unix}}. {{Bjarne Stroustrup}}, a Danish scientist, began C++ in {{1979}} as {{C with Classes}}, borrowing ideas from {{Simula}}. It was renamed C++ in {{1983}}, since ++ is C's {{increment}} operator. The first commercial compiler appeared in {{1985}}. {{ANSI}} and {{ISO}} produced the first standard, {{C++98}}. The landmark revision is {{C++11}}, which added auto, lambda expressions and smart pointers."],
["1.3 Development environment","Source files use the extension {{.cpp}} and header files use {{.h}}. The compiler works in two phases: the {{preprocessor}} handles # directives, then the source is translated into {{object code}} stored in a {{.obj}} or .o file. The {{linker}} combines object files with library code into an {{executable}} and resolves {{external references}}. A missing function definition gives a {{linker error}}. An {{IDE}} combines editor, compiler, linker and debugger. The OS {{loader}} copies the executable into memory. {{Compile-time}} errors stop compilation; {{run-time}} errors occur while the program executes."],
["1.4 Program structure","Comments are written with {{//}} or {{/* */}}, and multi-line comments cannot be {{nested}}. The directive {{#include}} pastes a {{header file}} into the program. The header {{<iostream>}} declares cout and cin. A {{namespace}} prevents name collisions, and the Standard Library lives in {{std}}, reached with the {{scope resolution}} operator ::. Execution begins at {{main()}}, and {{return 0;}} signals success. Every statement ends with a {{semicolon}}, and a {{block}} is a group of statements in braces. The five token types are keywords, identifiers, literals, operators and {{punctuators}}. Identifiers are {{case-sensitive}} and cannot begin with a {{digit}}."],
["1.5 Data types","C++ is {{statically typed}}: every value has a type fixed at compile time. A 4-byte {{int}} uses {{two's complement}} and spans -2^31 to {{2^31 - 1}}. {{char}} stores an {{ASCII}} code ('A' is {{65}}). {{float}} and {{double}} follow {{IEEE 754}}. The four modifiers are signed, {{unsigned}}, {{short}} and {{long}}. An unsigned n-bit type spans 0 to {{2^n - 1}}. The {{sizeof}} operator gives a size in {{bytes}}, and sizeof(char) is always {{1}}. Money should be stored as whole {{paise}} in an integer."],
["1.6 Variables and constants","A variable has a {{name}}, a {{type}}, a {{value}} and an {{address}}. {{Declaring}} creates it, {{initialising}} gives it a first value, and {{assigning}} changes it. An uninitialised local variable holds an {{indeterminate}} value. A {{local}} variable exists only inside its block; a {{global}} variable lives for the whole run. A constant is made with the {{const}} qualifier, which is preferred over {{#define}} because it is type-checked and scoped. {{'A'}} is a char whereas {{\"A\"}} is a string. Hexadecimal literals start with {{0x}} and octal literals with {{0}}."],
["1.7 Input and output","A {{stream}} is a sequence of characters flowing between a program and a device. {{cout}} writes to the screen using the {{insertion}} operator <<; {{cin}} reads from the keyboard using the {{extraction}} operator >>. {{endl}} ends the line and {{flushes}} the buffer. An escape sequence starts with a {{backslash}}: {{\\n}} is a new line, {{\\t}} a tab and {{\\0}} the null character. Because cin stops at {{whitespace}}, a whole line is read with {{getline}}."],
["1.8 Operators","An operator with one operand is {{unary}}, with two {{binary}}, and C++ has one {{ternary}} operator, written {{?:}}. In integer division 7 / 2 is {{3}}, and {{%}} gives the remainder and works only on integers. {{=}} assigns whereas {{==}} compares. In A && B, if A is false then B is skipped: {{short-circuit}} evaluation. With prefix ++a the value is used after {{incrementing}}; with postfix a++ the {{old}} value is used. 5 & 3 is {{1}}, 5 | 3 is {{7}}, 5 ^ 3 is {{6}}, ~5 is {{-6}}, 5 << 1 is {{10}} and 5 >> 1 is {{2}}. {{Precedence}} decides which operator is applied first, and {{associativity}} breaks ties."],
["1.9 Expressions and conversion","An {{expression}} evaluates to a single value, while a {{statement}} is a complete instruction. {{Implicit}} conversion promotes values from narrower to wider types: char → int → long → float → {{double}}. Converting from wider to narrower can {{truncate}}: 3.99 becomes {{3}}. An explicit conversion is a {{cast}}, written {{static_cast}}<type>(x) or (type)x. In double r = total / count with two ints the division is an {{integer}} division, so the cast must be placed {{before}} the division."],
["1.10 Debugging","A {{bug}} is a flaw that makes a program behave other than intended, and {{debugging}} is finding and fixing it. The first computer bug was a {{moth}} found in the {{Harvard Mark II}} in {{1947}}, an episode involving {{Grace Hopper}}. The three kinds of error are {{syntax}}, {{run-time}} and {{logical}}; the last is the hardest because the program runs and prints a plausible wrong answer. A {{trace table}} records each variable after every statement. A debugger lets you set a {{breakpoint}} and {{step}} through code. GCC's {{-Wall}} option enables warnings."]
];

/* short: [question, model, marking points] */
const SHORT=[
["Distinguish a program from software.","A program is a finite, ordered sequence of instructions in a programming language that directs a computer to perform one specific, well-defined task. Software is the broader term: a complete, integrated collection of programs together with supporting data files, documentation and configuration that provides a full set of capabilities to a user. Programs are the executable components of software. Example: Microsoft Word is software built from thousands of programs and modules.",["A program is a finite, ordered sequence of instructions for one specific task","Software is a complete collection of programs with data files, documentation and configuration","Programs are the components from which software is built","An example (such as Microsoft Word)"]],
["Distinguish a compiler error from a linker error.","A compiler error means the source code breaks C++'s syntax or type rules, so it cannot be translated and no object file is produced. A linker error means every file translated correctly, but a function that was called is never defined in any file or library supplied, so the pieces cannot be joined. For example, forgetting to write a function body is reported by the linker, not the compiler.",["Compiler error: source breaks C++ rules so it cannot be translated","Linker error: translation succeeded but a called function is never defined","The pieces cannot be joined into an executable","Example: a missing function body gives a linker error"]],
["Why is C++ called a middle-level language?","Because it combines high-level features (readable syntax, classes, templates) with low-level features (pointers, direct memory access and hardware access) in one language, rather than belonging wholly to either camp. The same language can write an operating system kernel or a 3D game.",["High-level features named (readable syntax, classes, templates)","Low-level features named (pointers, direct memory or hardware access)","Combined in one language rather than wholly one camp"]],
["Distinguish = from ==.","= is the assignment operator: it stores the value on the right in the variable on the left. == is the relational equality operator: it compares two values and produces true or false. Writing if (x = 5) instead of if (x == 5) assigns 5 to x and, since 5 is non-zero, the condition is always true, a well-known bug.",["= assigns a value to a variable","== compares and produces a bool","Example or consequence of confusing them such as if (x = 5)"]],
["Distinguish prefix from postfix increment, with an example.","Prefix (++a) increments first and then uses the value; postfix (a++) uses the old value first and then increments. With int a = 5; int b = ++a; both a and b become 6. With int c = 5; int d = c++; c becomes 6 but d is 5. When the expression stands alone the two are identical.",["Prefix increments first, then uses the value","Postfix uses the old value, then increments","A worked example with resulting values"]],
["Why does const deserve preference over #define?","const creates a named value that has a type, obeys scope rules and is checked by the compiler. #define is blind text substitution done by the preprocessor, with no type and no scope. Both let a value used throughout a program be changed in one place and give a number meaning.",["const has a type and is checked by the compiler","const obeys scope rules","#define is blind text substitution by the preprocessor"]],
["Distinguish 'A' from \"A\".","Single quotes make one char, here the number 65. Double quotes make a string, which carries a hidden terminating null character after the letter. Confusing them is a very common error.",["'A' is a single char (65)","\"A\" is a string","The string has a hidden terminating character"]],
["Explain implicit and explicit type conversion with one example of each.","Implicit conversion is done automatically by the compiler when an expression mixes types, normally from narrower to wider (char → int → long → float → double), for example double d = 5; or a / b with a promoted to double. Explicit conversion (a cast) is done deliberately by the programmer in any direction, including lossy, using static_cast<T>(x) or (T)x, for example (int)3.99 gives 3.",["Implicit: automatic, by the compiler, narrow to wide","Example of implicit conversion","Explicit: deliberate, by the programmer, static_cast<T>(x) or (T)x","Example of explicit conversion"]],
["Distinguish a syntax error from a logical error.","A syntax error breaks the language's grammar (for example a missing semicolon) and is detected by the compiler before the program runs. A logical error is legal code whose algorithm is wrong (for example using + instead of *); the program compiles and runs to the end and prints a plausible wrong answer, and only checking the output reveals it, so it is the hardest to find.",["Syntax error breaks the grammar and is detected by the compiler","Logical error is legal code with a wrong algorithm","Logical error is found only by checking the output","An example of each"]],
["Why must a variable be initialised before use?","A local variable that is declared but not initialised holds an indeterminate value: whatever bits happened to be in that memory. Using it produces unpredictable results, a famously hard-to-find bug because the program may appear to work on some runs. Initialise every variable when you declare it.",["An uninitialised local variable holds an indeterminate value","Using it gives unpredictable results","The bug is hard to find because it may appear to work","Initialise at declaration"]],
["Distinguish compile-time errors from run-time errors.","Compile-time errors violate C++'s rules and are detected by the compiler during translation; they stop compilation, so no executable is produced (for example a missing semicolon). Run-time errors occur while the program executes, after successful compilation and linking; the compiler cannot detect them because they depend on actual data or conditions (for example division by zero), and they are often harder to find.",["Compile-time: detected by the compiler during translation, no executable","Run-time: occur during execution after successful compile and link","Example of each (missing semicolon, division by zero)"]],
["Distinguish a local variable from a global variable.","A local variable is declared inside a function or block and is visible only from its declaration to the closing brace; it is created when execution reaches it and destroyed when the block ends. A global variable is declared outside every function, is visible to the whole file below its declaration and lives for the entire run. Local variables are preferred because global ones can be changed from anywhere.",["Local: declared inside a block, visible only within it","Local is destroyed when the block ends","Global: declared outside every function, lives for the whole run","Why local variables are preferred"]],
["Distinguish the insertion operator from the extraction operator.","The insertion operator << sends data into the output stream (cout << value), with the arrow pointing the way the data flows out to the screen. The extraction operator >> takes data from the input stream and stores it in a variable (cin >> variable), converting it according to the variable's type.",["<< sends data out to the output stream (cout)",">> takes data in from the input stream (cin) into a variable","An example of each"]],
["State the roles of the preprocessor, compiler and linker.","The preprocessor handles every # directive: expanding macros, inserting header files and conditional compilation. The compiler translates the preprocessed source into object code, checking syntax and type rules. The linker combines object files with library code into an executable and resolves external references.",["Preprocessor: handles # directives","Compiler: translates to object code and checks syntax","Linker: joins object files and libraries into an executable"]]
];
/* long: [question, model, marking points] */
const LONG=[
["Draw and explain the complete compilation process, naming each tool and the file it produces.","Source code (.cpp) is written in an editor or IDE. First the preprocessor expands the # directives (inserting headers, expanding macros), giving preprocessed code. Second, the compiler checks syntax and type rules and translates the result into machine code in an object file (.obj on Windows, .o on Linux and macOS); here compile-time errors are reported and, until they are fixed, no object file is produced. Third, the linker combines the object files with pre-compiled library code, such as the C++ Standard Library, into an executable file (.exe on Windows) and resolves external references; if a called function is never defined, a linker error is reported. When the executable is run, the operating system's loader copies it into memory and begins execution at main(); run-time errors occur at this stage.",["Source code (.cpp) to preprocessor","Preprocessor expands # directives","Compiler translates to object file (.obj / .o) and reports compile-time errors","Linker combines object files and libraries into the executable (.exe) and reports linker errors","OS loader loads into memory and starts main()","Run-time errors occur while running; correct order shown"]],
["Explain the structure of a C++ program, using the Hello World program to illustrate each part.","A program starts with a comment (// My first C++ program), which the compiler ignores. The directive #include <iostream> is handled by the preprocessor and pulls in the input/output library that declares cout, cin and endl. using namespace std; lets cout be written without the std:: prefix. int main() is the main function, the entry point where execution begins. The braces { } enclose the function's body, a block. cout << \"Hello, World!\" << endl; is a statement that sends text to the screen, and every statement ends with a semicolon. return 0; reports to the operating system that the program succeeded.",["Comment ignored by the compiler","#include <iostream> as a preprocessor directive","using namespace std;","int main() as the entry point","Braces enclosing the body (a block)","A statement ending in a semicolon, such as cout << ...;","return 0; signals success"]],
["Describe the fundamental data types and the four type modifiers, giving the range of each integer type and linking them to the binary representations of Lesson 2.","The fundamental types are int (whole numbers, 4 bytes), float (about 7 significant digits, 4 bytes), double (about 15 significant digits, 8 bytes), char (a single character, 1 byte), bool (true or false, 1 byte) and void (no value). The modifiers are signed, unsigned, short and long. Ranges: char -128 to 127; unsigned char 0 to 255; short -32,768 to 32,767; unsigned short 0 to 65,535; int -2,147,483,648 to 2,147,483,647; unsigned int 0 to 4,294,967,295; long long about ±9.2 × 10^18; unsigned long long 0 to about 1.8 × 10^19. An n-bit signed type spans -2^(n-1) to 2^(n-1) - 1 and an unsigned one 0 to 2^n - 1. int is two's complement, char is an ASCII code, and float and double are the IEEE 754 formats; overflow wraps around.",["Six fundamental types with holds and sizes","Four modifiers named","Ranges of the integer types","Formulas for n-bit signed and unsigned ranges","Link: two's complement, ASCII, IEEE 754 and overflow from Lesson 2","sizeof gives the size in bytes"]],
["Explain all the categories of operator, with an example of each, including bitwise and conditional operators.","Arithmetic: + - * / % (7 / 2 is 3, integer division; % gives the remainder). Relational: == != < > <= >= produce a bool (5 == 5 is true). Logical: && || ! with short-circuit evaluation (d != 0 && n / d > 2 is safe). Assignment: = and the compound forms += -= *= /= %= (x += 5 means x = x + 5). Increment and decrement: ++ and -- in prefix and postfix forms (b = ++a gives the new value; d = c++ gives the old). Bitwise: & | ^ ~ << >> act on individual bits (5 & 3 = 1, 5 | 3 = 7, 5 ^ 3 = 6, ~5 = -6, 5 << 1 = 10, 5 >> 1 = 2). Conditional (ternary): condition ? a : b, for example int larger = (a > b) ? a : b;",["Arithmetic with integer division and %","Relational operators produce bool","Logical operators with short-circuit","Assignment and compound assignment","Increment and decrement, prefix versus postfix","Bitwise operators with a worked example","Conditional operator with an example"]],
["Explain operator precedence and associativity, and evaluate the expression 2 + 3 * 4 > 10 && !(7 % 2 == 0) step by step.","Precedence decides which operator is applied first; associativity breaks ties between operators of equal precedence (most are left to right; unary operators and assignments are right to left); parentheses override both. From highest to lowest: parentheses; postfix ++ --; ! ~ unary and prefix ++ --; * / %; + -; << >>; relational; == !=; &, ^, |; &&, ||; ?: and assignment. Evaluation: parentheses first: 7 % 2 is 1, and 1 == 0 is false, so (...) is false. Then !: !false is true. Then *: 3 * 4 is 12. Then +: 2 + 12 is 14. Then >: 14 > 10 is true. Finally &&: true && true is true.",["Definition of precedence","Definition of associativity","Parentheses override both","Order of the levels (at least four in the right order)","Parentheses step: 7 % 2 == 0 is false","Then !, *, +, > in order","Final result true"]],
["Describe systematic debugging techniques, including the use of a trace table.","A bug is a flaw that makes a program behave other than intended; debugging is finding and fixing it. Techniques: (1) read the error message from the top, because the first error is often the real one, noting that for a missing semicolon the fault is on the previous line; (2) reproduce the bug with the smallest input; (3) trace by hand, building a trace table that records each variable's value after every statement and comparing it with what was expected; (4) print intermediate values with temporary cout statements; (5) use the IDE's debugger, setting a breakpoint, stepping one statement at a time and inspecting variables; (6) change one thing at a time and re-test; (7) explain the code aloud (rubber duck). Example trace: int x = 4; int y = x * 2; x = y - x; y += x; gives x = 4, y = 12. Prevention: initialise variables, name well, test small pieces, parenthesise, and enable warnings (-Wall).",["Defines bug and debugging","Read the error message from the top","Reproduce the bug","Trace table with an explanation of how it is built","Print values and use the debugger (breakpoint, step)","Change one thing at a time; explain aloud","Prevention or a worked trace example"]],
["Trace the history of C++ from C to the modern standards.","C was created by Dennis Ritchie at Bell Labs between 1969 and 1973, chiefly to rewrite Unix, which had been written in assembly language, in something more portable and maintainable. By the early 1980s, growing software complexity demanded better tools, and object-oriented programming showed promise but was awkward in C. Bjarne Stroustrup, a Danish computer scientist at Bell Labs, began developing C++ in 1979 as C with Classes, adding classes, basic inheritance and inlining and borrowing from Simula, without sacrificing C's speed and low-level control. It was renamed C++ in 1983 (the increment operator joke), the first commercial compiler appeared in 1985 with the first edition of The C++ Programming Language. Compilers began to differ, so ANSI and ISO standardised it as C++98 (ISO/IEC 14882:1998), followed by C++03, the landmark C++11 (auto, range-based for, lambdas, smart pointers, move semantics, threading), C++14, C++17, C++20 (modules, concepts, coroutines, ranges) and C++23.",["Ritchie, Bell Labs, 1969-1973, to rewrite Unix","Why OOP was wanted in C in the early 1980s","Stroustrup, 1979, C with Classes, Simula","Renamed C++ in 1983 and the reason","First commercial compiler and book in 1985","ANSI and ISO standardised: C++98","Later standards including C++11 as the landmark"]]
];

["A program prints an average of 14 where 17.5 was expected for marks 15 and 20 with the intended total divided by 2. Suggest two likely causes.","Two likely causes: (1) integer division, when the total and the divisor are both ints, the fraction is discarded before any assignment to a double; (2) operator precedence, writing m1 + m2 / 2 divides only m2 by 2, so parentheses are needed: (m1 + m2) / 2.0. (The printed 14 does not follow exactly from either cause with these numbers, so a further slip such as a wrong variable may also be involved; examiners look for the two causes above.)",["Integer division discarding the fraction","Operator precedence (division binds before addition)","Remedy such as a cast, a double operand or parentheses"]],
["A program compiles but crashes on certain inputs only. Classify the error and say why the compiler missed it.","It is a run-time error. The compiler checks only syntax and type rules at translation time, while this error depends on actual data, user input or system conditions that are unknown until the program runs (for example division by zero or an array index out of bounds).",["Classified as a run-time error","Compiler checks syntax and types only","Depends on actual data or conditions unknown at compile time"]],
["Explain why storing a price as a double is risky, and propose an alternative, referring to Lesson 2.","A double stores a binary approximation (IEEE 754), so fractions such as 0.1 cannot be represented exactly and 0.1 + 0.2 is not exactly 0.3; rounding errors accumulate in money calculations. The alternative recommended in Lesson 2 is to store the amount as whole paise in an integer and convert to rupees only for display.",["Floating-point stores binary approximations","Rounding error accumulates (0.1 + 0.2 is not exactly 0.3)","Store whole paise in an integer"]],

["Write the statement that stores the larger of a and b in m using the conditional operator.","int m = (a > b) ? a : b; (or m = (a > b) ? a : b; if m is already declared). If a is greater than b the value of a is stored, otherwise the value of b.",["Correct form condition ? value_if_true : value_if_false","Condition a > b","Result assigned to m","Terminated by a semicolon"]],
["Explain with an example why if (x = 5) is a bug.","= assigns while == compares. if (x = 5) stores 5 in x and the value of the whole expression is 5, which is non-zero and therefore true, so the condition is always true whatever x held before, and x has been changed. The intended test is if (x == 5). Compiler warnings (-Wall) flag this.",["= assigns, == compares","The condition is always true because 5 is non-zero","x is overwritten","Correct form if (x == 5)"]],
["A program must read the name 'Anita Nair' into one string. Explain what goes wrong with cin >> name and give the fix.","cin >> stops at whitespace, so only 'Anita' is stored in the variable and 'Nair' stays in the input stream. To read a whole line, spaces included, use getline(cin, name), which needs <string>.",["cin >> stops at whitespace","Only the first word is stored","Fix: getline(cin, name) from <string>"]],
["Explain why 'A' + 1 prints 66 but (char)('A' + 1) prints B.","'A' is stored as its ASCII code 65, and in an arithmetic expression it is promoted to int, so 'A' + 1 is the integer 66, which cout prints as a number. Casting the result to char makes cout interpret the value 66 as a character, so it prints B.",["'A' is ASCII 65","Arithmetic promotes the char to int, giving 66","A cast to char makes cout print the character B"]]

function matches(user,acc,all){const u=norm(user);const hit=a=>u.includes(norm(a));return all?acc.every(hit):acc.some(hit);}
