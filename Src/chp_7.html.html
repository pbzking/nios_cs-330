const NOTES=[
["1.1 Email basics","{{Email}} is the exchange of digital messages over a network. It is {{asynchronous}}: sender and receiver need not be online together. {{Ray Tomlinson}} sent the first network email in {{1971}} over ARPANET and chose the {{@}} symbol. Advantages: speed, versatility, a persistent searchable {{archive}} and wide accessibility. Limitations: unsuited to urgent matters, information overload, a vector for {{phishing}} and malware, and tone is hard to convey in text."],
["1.1 Address and interface","An email address has a {{local part}} and a {{domain part}} separated by {{@}}, for example ramesh.kumar@gmail.com. The local part cannot begin or end with a {{period}} or contain two consecutive periods. The full address is globally {{unique}}. The interface has a {{navigation pane}}, a {{message list}}, a {{reading pane}}, a compose button and a search bar."],
["1.2 How email works","{{SMTP}} is a {{push}} protocol that sends a message server to server. The sender's server finds the recipient's mail server through a DNS {{MX}} record (lower priority numbers are preferred), then relays by SMTP. {{POP3}} downloads mail to one device and by default removes it from the server; {{IMAP}} {{synchronises}} the mailbox across devices. Headers record the journey: each server adds a {{Received}} header and the {{Message-ID}} identifies the message. The displayed From name can be {{forged}}."],
["1.3 Service providers","{{Gmail}} (2004, 15 GB, label-based), {{Outlook}} (enterprise, Exchange, 15 GB), {{Yahoo Mail}} (1997, 1 TB), {{iCloud Mail}} (Apple, 5 GB), {{Proton Mail}} (Swiss, 2013, {{end-to-end encryption}}) and {{Zoho Mail}} (Indian, ad-free, custom domains). Proton Mail's encryption means even its own servers cannot read messages, unlike standard encryption, which protects only {{in transit}}."],
["1.4 Account management","Creating an account needs a unique {{username}}, a password, name, date of birth and a phone or alternate email for {{verification}}. {{Sign out}} on shared devices; 'sign out of all devices' ends every session. Recovery usually sends a reset code to the recovery {{phone}} or {{email}}; security questions are {{weaker}}. Keep recovery details {{current}}, use a password manager and enable {{2FA}}."],
["1.5 Email folders","{{Inbox}} receives mail; {{Sent}} keeps copies of sent mail; {{Drafts}} holds unsent messages; the {{Outbox}} queues messages offline in a client; {{Spam}} holds filtered mail; {{Trash}} holds deleted mail, emptied after about {{30}} days; {{Archive}} keeps mail out of the Inbox without deleting it. Test: will it be needed again? If yes, {{archive}}; if no, delete."],
["1.6 Composing emails","{{To}} holds primary recipients; {{CC}} sends a visible copy for information; {{BCC}} sends a hidden copy, invisible to every other recipient. A good subject line is {{specific}}, {{concise}} (6 to 10 words) and {{accurate}}. Attachments are capped at about {{20 to 25 MB}}; {{PDF}} is the safest format; larger files go by a cloud link. {{Undo Send}} gives up to about {{30 seconds}} in Gmail."],
["1.7 to 1.9 Managing, searching and contacts","{{Reply}} answers the sender only (prefix {{Re:}}); {{Reply All}} answers everyone; {{Forward}} (prefix {{Fwd:}}) sends to a new recipient. Gmail operators: {{from:}}, {{to:}}, {{subject:}}, {{has:attachment}}, {{after:}} and {{before:}}. A {{filter}} automates sorting. A {{folder}} is exclusive; a {{label}} is non-exclusive. A {{contact group}} addresses many people by one name, saving time and avoiding omissions."],
["1.10 Email security","A strong password is at least {{12}} characters, complex and {{unique}}. {{2FA}} adds a second factor: {{SMS}} (least secure), an {{authenticator app}} (TOTP, about every 30 seconds) and a {{hardware key}} (most secure). {{SPF}} lists authorised servers, {{DKIM}} signs messages, {{DMARC}} states what to do on failure. {{Spam}} is over {{45}} percent of email traffic. Phishing: check the real address, hover over links, never give a password by email. Executable attachments (.exe, .bat, .vbs, .js) are dangerous. Memory aid: {{2-P-S-H-A-U}}."],
["1.11 Email etiquette","Use a clear, concise, formal style and {{proofread}}. Greet by name: {{Dear Mr./Ms./Dr.}} for very formal contexts, {{Hi}} for informal ones. Keep a courteous tone and never send a {{flame email}}. Close with {{Yours sincerely}} (formal), {{Best regards}} (standard) or {{Best}} (informal), then a signature. Reply within {{one to two}} business days."]
];

const CORE=[
[0,"Define email.","Electronic Mail: a method of exchanging digital messages between people over the internet or any computer network; messages can include formatted text, embedded images and attachments of virtually any type."],
[0,"What does 'asynchronous' mean for email?","Sender and receiver need not be online simultaneously: the sender sends at any time and the receiver reads at their own convenience."],
[0,"What follows from email being asynchronous?","Its suitability for formal record-keeping, its poor fit for urgent matters and its difference from real-time tools (phone calls, instant messaging, VoIP)."],
[0,"Who sent the first network email, and when?","Ray Tomlinson, an engineer on ARPANET, in 1971, between two computers in the same room connected via ARPANET."],
[0,"What was Tomlinson's most consequential decision?","Choosing the @ symbol to separate a user's name from the name of their host machine; it persists in every email address."],
[0,"State the advantages of email.","Speed (seconds, almost zero cost, written record); versatility (formatting, attachments, links, one to thousands); a persistent searchable archive; accessibility from any connected device."],
[0,"State the limitations of email.","Poor for urgent matters; information overload and spam; a vector for phishing and malicious attachments, and unencrypted mail can be intercepted; tone and intent are hard to convey."],
[1,"Define an email address.","The unique identifier designating a specific mailbox and routing messages to the right recipient."],
[1,"Name the two parts of an email address and the separator.","The local part (left) and the domain part (right), separated by the @ symbol."],
[1,"What does the local part identify?","The specific mailbox within the provider, usually the account holder's chosen username."],
[1,"State the rules for the local part.","May contain letters, digits, periods, underscores, hyphens and plus signs; cannot begin or end with a period or contain two consecutive periods; treated case-insensitively in practice."],
[1,"What does the domain part identify?","The hosting service or organisation, following the standard domain structure; for an organisation it typically matches its website domain (priya.sharma@infosys.com)."],
[1,"Identify the parts of ramesh.kumar@gmail.com.","Local part: ramesh.kumar; separator: @; domain part: gmail.com."],
[1,"Is an email address unique?","Yes: the full combination is globally unique; no two active mailboxes share it."],
[1,"Name the parts of an email interface.","Navigation pane (folders), message list, reading pane, compose button and search bar."],
[1,"What does the message list show?","The messages in the selected folder: sender, subject, body preview, timestamp, and attachment and read/unread indicators."],
[2,"Define SMTP and its role.","Simple Mail Transfer Protocol: a push protocol that delivers a message outward, server to server, until it reaches the recipient's mail server."],
[2,"Describe the three steps of sending by SMTP.","1. The client hands the message to the sender's outgoing mail server. 2. That server finds the recipient domain's mail server by MX record and relays it by SMTP, often through intermediate relays. 3. The recipient's server places it in the mailbox."],
[2,"When does SMTP's job end?","The moment the message is safely deposited in the recipient's mailbox; it plays no part in how the recipient reads it."],
[2,"Define POP3.","Post Office Protocol version 3: downloads messages from the server to one device and by default removes them from the server."],
[2,"Why is POP3 a poor fit for several devices?","A message downloaded on one device vanishes from the others."],
[2,"Define IMAP.","Internet Message Access Protocol: synchronises the client with the mailbox on the server; messages, folders and read/unread status are mirrored across every device."],
[2,"Why do modern webmail and mobile apps default to IMAP?","Reading mail on a phone and finding it already marked read on a laptop is IMAP's synchronisation at work."],
[2,"How do you distinguish SMTP from POP3 and IMAP?","By direction and purpose: SMTP pushes a message forward, server to server, toward the recipient's mailbox; POP3 and IMAP pull it back from a mailbox to a viewing client."],
[2,"Trace an email's journey in full.","Sender's client, SMTP, sender's mail server, DNS MX lookup, SMTP, recipient's mail server, IMAP or POP3, recipient's client."],
[2,"Name the two commonest errors in tracing an email.","Omitting the DNS/MX step, and using POP3 or IMAP for the outgoing leg."],
[2,"Define an MX record.","Mail Exchange record: a DNS record stating which mail server(s) are responsible for receiving email for a domain, with a priority value (lower numbers preferred)."],
[2,"Why must a sending server query an MX record?","To discover which server handles mail for the recipient's domain before any of the message is transmitted."],
[2,"How does an MX lookup differ from an ordinary DNS (A) lookup?","An A record gives the IP address of the web server; an MX lookup gives the mail server; the two are very often different machines."],
[2,"What are email headers?","Metadata recording the message's technical journey, normally hidden but shown by 'Show Original' or 'View Source'."],
[2,"What is the Received header?","A line added by each mail server the message passes through; read bottom to top it is a timestamped log of every hop."],
[2,"What is the Message-ID header?","A header that uniquely identifies the message across the internet and lets a reply be threaded to its original."],
[2,"Why is the displayed From name untrustworthy?","The sender can set it to anything. The Received chain and Return-Path reveal the actual sending server, to compare with the claimed domain."],
[3,"Define an email service provider.","A company operating the servers, infrastructure and software to host email accounts: running SMTP and IMAP/POP3 servers, filtering spam and providing the interface (browser or client such as Outlook or Thunderbird)."],
[3,"Describe Gmail.","Google's service, the most widely used (over 1.8 billion users); launched 2004 with 1 GB, now 15 GB shared with Drive and Photos; label-based; Smart Compose, Smart Reply, Priority Inbox, snooze, Confidential Mode."],
[3,"Describe Microsoft Outlook.","A standalone client (Microsoft 365) and web service (Outlook.com, formerly Hotmail); 15 GB free; integrates OneDrive, Office Online, Teams; dominates corporate use with calendar, Exchange integration, rules and Focused Inbox."],
[3,"Describe Yahoo Mail.","One of the oldest webmail services (1997); 1 TB free storage; disposable addresses; filtering; popular in the United States."],
[3,"Describe iCloud Mail.","Apple's service for Apple ID holders (@icloud.com, @me.com, @mac.com); 5 GB free shared across iCloud; used through Apple's Mail app; valued for simplicity and privacy approach."],
[3,"Describe Proton Mail.","A Swiss service founded in 2013 by scientists who met at CERN; end-to-end encryption, so not even its servers can read messages; valued by journalists and lawyers."],
[3,"Explain end-to-end encryption against standard email encryption.","End-to-end: encrypted on the sender's device and decryptable only by the recipient. Standard encryption protects only in transit between servers, leaving messages readable by the server operators."],
[3,"Describe Zoho Mail.","From Zoho Corporation, an Indian company in Chennai; ad-free, content not used for advertising, generous free tier, affordable business plans with custom-domain addresses."],
[3,"Which provider suits: maximum free storage; enterprise calendar; privacy even from the provider; Indian business custom domain?","Yahoo Mail; Outlook; Proton Mail; Zoho Mail."],
[4,"What is needed to create an email account?","A username (the local part), a password meeting requirements, first and last name, date of birth and a phone number or alternate email for verification and recovery."],
[4,"Why are common usernames usually unavailable?","Addresses must be globally unique within a provider's domain; the service checks availability and suggests alternatives."],
[4,"How is account creation confirmed?","A verification code is sent to the supplied phone or alternate address and entered to confirm ownership."],
[4,"When should 'stay signed in' be avoided?","On shared, public or workplace computers; use it only on personal, physically secured devices."],
[4,"What does signing out do, and why does it matter?","It ends the authenticated session and removes stored credentials, preventing later users of the device from accessing the account; essential on shared devices."],
[4,"What is 'sign out of all devices'?","A remote feature ending every active session at once; valuable if a device is lost, stolen or suspected compromised."],
[4,"Describe password recovery.","Initiated by 'Forgot password?'; the commonest method sends a reset link or code by SMS to the recovery phone or to the recovery email; some services use security questions, personal details or manual review."],
[4,"Why are security questions weaker?","Their answers can often be guessed or found on social media."],
[4,"How can permanent account lockout be prevented?","Keep recovery phone and email current and accessible, use a password manager and enable two-factor authentication."],
[5,"Define the Inbox.","The primary folder and default destination for incoming mail not filtered elsewhere; unread messages are typically bold."],
[5,"Define the Sent folder.","Stores a copy of every successfully sent message: a permanent record of outgoing mail."],
[5,"Define the Drafts folder.","Stores composed but unsent messages, saved deliberately or auto-saved (about every minute); useful for later completion, review or templates."],
[5,"Define the Outbox.","A temporary holding folder in client applications for messages not yet delivered to the outgoing server (for example offline); they send when connectivity returns and move to Sent. Webmail generally has none."],
[5,"Define the Spam folder.","Holds mail the filter identified as unsolicited bulk or malicious; review it periodically for misclassified mail; 'Not Spam' moves it to the Inbox and trains the filter; auto-cleared after about 30 days."],
[5,"Define the Trash folder.","Holds deleted messages as a safety net, auto-emptied after about 30 days; Shift+Delete or 'Delete forever' deletes permanently at once."],
[5,"Define Archive.","Moves a message out of the Inbox to a designated location without deleting it; it stays searchable. It underpins Gmail's 'Inbox Zero'."],
[5,"Distinguish Archive from Trash.","Trash holds messages to be discarded, removed automatically after about 30 days. Archive keeps messages indefinitely but out of the Inbox. Test: will it ever be needed again? Yes: archive; no: delete."],
[6,"Describe the To field.","Specifies the primary recipient(s); each address must be exact; multiple recipients are separated by commas or semicolons."],
[6,"Define CC.","Carbon Copy (from carbon paper): sends a copy to secondary recipients who should be kept informed; all recipients can see everyone in To and CC; no action or reply is expected."],
[6,"Define BCC.","Blind Carbon Copy: BCC recipients are invisible to everyone else, including each other; each gets an individually addressed copy."],
[6,"State the rule that distinguishes CC from BCC.","Visibility: CC recipients are visible to everyone; BCC recipients are invisible to everyone else, including other BCC recipients."],
[6,"When is BCC used?","To protect privacy when messaging a large group who do not know each other (newsletter); to discreetly keep a third party informed."],
[6,"What makes a good subject line?","Specific ('Meeting rescheduled to Thursday 3pm'), concise (6 to 10 words) and accurate."],
[6,"Name common subject prefixes.","ACTION REQUIRED:, FYI: and [EXTERNAL]."],
[6,"What is the attachment size limit and the best alternative?","About 20 to 25 MB per message; larger files are better shared by a cloud storage link."],

[6,"What is Undo Send?","A brief window (up to about 30 seconds in Gmail) in which sending can be cancelled, useful for catching an error right after clicking Send."],
[6,"How does a draft get saved?","By the Save button, or automatically when the composition window is closed; reopen it from Drafts."],
[7,"Distinguish Reply from Reply All.","Reply goes to the original sender only, with a quoted copy and the subject prefixed Re:. Reply All goes to the sender and everyone in To and CC."],
[7,"When is Reply All appropriate?","Only when the response is genuinely relevant to every recipient. Replying 'Thanks!' to an all-company announcement wastes many people's time."],
[7,"What does 'Re:' mean?","From the Latin 'regarding': it groups related messages in a conversation thread."],
[7,"Define forwarding.","Sends a copy of a message, with its content and attachments, to a new recipient not in the original thread; the subject is prefixed Fwd:."],
[7,"What should be considered before forwarding?","Whether the original sender would consent; forwarding confidential content without permission can breach trust."],
[7,"What happens when a message is deleted?","It moves to Trash, from which it can be restored within the retention period; permanent deletion is irrecoverable."],
[7,"Why mark a message as unread?","It restores the bold indicator as a reminder to return to it."],
[7,"What is flagging or starring?","A distinct visual marker for importance or action (star in Gmail, flag in Outlook), with a view showing all flagged messages."],
[7,"Distinguish basic from advanced search.","Basic search takes keywords anywhere in the message. Advanced search narrows by sender, recipient, subject, keyword, date or range, and attachments."],
[7,"Name the Gmail search operators.","from:, to:, subject:, has:attachment, and after: / before:."],
[7,"Interpret: from:priya@example.com has:attachment after:2024/01/01.","Every message from Priya received after 1 January 2024 that carries an attachment."],
[7,"List the ways the message list can be sorted.","By date (default, newest first), sender, subject, size (finds storage hogs) and read/unread status."],
[7,"Define a filter.","An automated rule (called a rule in Outlook) applied to incoming mail by criteria, with no manual action: it can move, label, mark as read, star, forward or delete."],
[7,"Distinguish a folder from a label.","A folder is exclusive: a message sits in only one. A label (Gmail) is non-exclusive: a message can carry several and appears in every corresponding view without duplication."],
[7,"What does a contact record hold?","Full name, email addresses, phone numbers, postal address, job title and organisation, and notes; it powers autocomplete."],
[7,"Define a contact group.","A named collection of contacts (a distribution list in Outlook) addressable as a single unit in To, CC or BCC."],
[7,"Why are contact groups better than typing addresses?","They save time on repeated entry and reduce the risk of accidentally omitting a member."],
[8,"Why is the email password so important?","Websites' 'Forgot Password' sends reset links to the email, so access to it can give control of many other accounts."],
[8,"State the properties of a strong password.","At least 12 characters (ideally 16+), complex (upper, lower, digits, symbols), unique to the account, and free of personal information and predictable substitutions."],
[8,"What is a password manager?","A tool that generates and securely stores strong, unique passwords for every account."],
[8,"Define two-factor authentication.","Also two-step verification: requiring two separate forms of verification, typically something the user knows (password) and something the user has (a device or app)."],
[8,"Name the three 2FA methods in increasing security.","SMS code, authenticator app (TOTP) and hardware security key."],
[8,"Why is SMS 2FA the weakest?","It is vulnerable to SIM-swap attacks and cellular network weaknesses."],
[8,"What is TOTP?","Time-based One-Time Password: a code generated by an authenticator app that changes about every 30 seconds, independent of the cellular network."],
[8,"Why is a hardware security key the most secure?","It must be physically present and activated, so it cannot be phished or intercepted remotely (for example a YubiKey)."],
[8,"Define spam.","Unsolicited bulk email sent in very large volumes without consent, for advertising, fraud or malware; over 45 percent of global email traffic."],
[8,"How do spam filters work?","Machine learning models examine sender reputation, content, image-to-text ratio, authentication records (SPF, DKIM, DMARC) and patterns of mail others marked as spam."],
[8,"How can users reduce spam?","Report spam, mark legitimate mail 'Not spam', avoid sharing a primary address publicly and use a secondary or disposable address for registrations."],
[8,"Define SPF.","Sender Policy Framework: the domain publishes in DNS the servers authorised to send on its behalf; receivers check whether the message came from one; failure suggests spoofing."],
[8,"Define DKIM.","DomainKeys Identified Mail: the sending server signs each message with a private key; the receiver verifies it with the public key in DNS, proving the content was signed and unaltered."],
[8,"Define DMARC.","Domain-based Message Authentication, Reporting and Conformance: a published policy saying what to do with mail that fails SPF or DKIM (quarantine, reject or monitor), with reporting of spoofing."],
[8,"Give one sentence for each of SPF, DKIM and DMARC.","SPF: did it come from an authorised server? DKIM: was it signed and unaltered? DMARC: what to do when either check fails."],
[8,"Define spoofing.","Forging a message's sender address to appear as someone else."],
[8,"Define phishing in email.","A fraudulent message impersonating a trusted entity (bank, government agency, delivery service, colleague) to deceive the recipient into clicking a malicious link or giving sensitive information; it manufactures urgency or fear."],
[8,"List the warning signs of phishing.","A sender address that does not match the claimed organisation (support@gooogle-security.com); requests for passwords, PINs or financial details; link destinations that do not match; urgency or fear; spelling and grammar errors."],
[8,"What is the safest response to a suspicious account-action email?","Navigate to the organisation's website by typing the URL yourself, rather than clicking any link in the message."],
[8,"Why are executable attachments dangerous?","(.exe, .bat, .vbs, .js) no legitimate organisation sends them as ordinary attachments; treat as malicious and delete."],
[8,"How can malware hide in ordinary files?","Office documents can carry malicious macros that run when macros are enabled; PDFs can contain embedded JavaScript or exploit reader vulnerabilities."],
[8,"How should an unexpected attachment from a known sender be handled?","Verify by contacting the sender through a separate channel (phone or in person), never by reply email, since their account may be compromised."],
[8,"Explain the memory aid 2-P-S-H-A-U.","2FA enabled; strong unique Password in a manager; Skeptical of urgency and sensitive requests; Hover over links; Avoid unexpected attachments; keep software Updated and report spam."],
[9,"Define email etiquette.","Standards of professional, respectful and effective behaviour specific to email in formal contexts; communicating clearly in a way that respects the recipient's time."],
[9,"What defines a professional writing style?","Clear, concise, formal in proportion: complete grammatical sentences, proper capitalisation, standard punctuation, no slang; short paragraphs, bullets or numbered lists for complex matters."],
[9,"Why proofread, and what does spell-check miss?","Errors reflect poorly on the sender; spell-check catches misspellings but not wrong word choice or grammatical errors."],
[9,"What makes a bad subject line?","Vague ('Question', 'Hi', 'Important'), misleading or empty; empty subjects may be flagged by spam filters and fail to reach the Inbox."],
[9,"Give greetings for different contexts.","Dear Mr./Ms./Dr. [Last Name] for first contact or very formal; Dear or Hello [First Name] for colleagues; Hi [First Name] for informal professional. 'Hey!' or no greeting is inappropriate in formal contexts."],
[9,"What is a flame email, and what should be done?","An email written in anger or frustration; never send it. Draft it, wait several hours, then decide to send, revise or discard; urgent sensitive matters are better handled by phone or in person."],
[9,"What content rules apply?","Stay on topic (separate emails for unrelated matters), use BCC transparently and never send confidential information on an insecure channel."],
[9,"Give closings by formality.","Yours sincerely or Yours faithfully (highly formal); Best regards or Kind regards (standard); Best wishes (warmer); Best or Thanks (informal); then a signature."],
[9,"What does a signature contain?","Full name, job title, organisation and contact details."],
[9,"State the response-time standard.","Within one to two business days; if a full reply is not yet possible, send a prompt brief acknowledgement."],
[9,"How should a poorly written sample email be corrected?","Work through the checklist in order: subject line, greeting, tone and structure, closing and signature, naming each specific fault."]

["Why should an executable file attachment always be treated with suspicion?","No legitimate organisation sends executables (.exe, .bat, .vbs, .js) as ordinary business attachments; they run code directly and are a main malware delivery mechanism, so they should be treated as malicious and deleted.",["Not sent legitimately","Run code","Treat as malicious"]],
["Explain why contact groups are preferable to typing each address separately.","A group is addressed by one name, saving time on repeated entry, and it ensures no member is accidentally omitted. Membership can be edited as the group changes.",["Time saved","Avoids omissions","Editable"]],
["Explain why an empty subject line can prevent a message from reaching the Inbox.","Many spam filters flag subject-less messages as suspicious, so the message may be sent to Spam or blocked. A specific subject line also helps the recipient decide to open it.",["Filters flag empty subjects","Goes to Spam","Subject helps the reader"]],
["Distinguish between POP3 and IMAP.","POP3 downloads messages to one device and by default removes them from the server, so they vanish from other devices. IMAP synchronises the mailbox, folders and read status across all devices, which is why webmail and mobile apps use it.",["POP3 downloads and removes","IMAP synchronises","Multi-device implication"]],
["State the attachment guidelines for email.","Attachments are capped at about 20 to 25 MB, so larger files should be shared by a cloud storage link. PDF is the safest format for documents to be read. Unexpected attachments should not be opened without verification.",["Size cap","Cloud link","PDF","Caution"]]

const LONG=[
["Explain, step by step, how an email travels from the moment it is sent to the moment it is read, naming SMTP, MX records and IMAP/POP3 at the correct points.","The sender composes and clicks Send; the client or webmail hands the message to the sender's outgoing mail server by SMTP. That server queries DNS for the MX record of the recipient's domain, which names the responsible mail server and its priority. It relays the message to that server by SMTP, often through intermediate relays, each adding a Received header. The recipient's server accepts the message and places it in the mailbox, where SMTP's job ends. Later the recipient's client retrieves it by IMAP (synchronised across devices) or POP3 (downloaded, usually removed from the server). Then the message is read.",["Client to sender's server by SMTP","MX lookup via DNS","SMTP relay and Received headers","Delivery to the recipient's mailbox","Retrieval by IMAP or POP3","Distinction of push and pull"]],
["Compare any three major email service providers on storage, distinguishing features and typical user base.","Gmail: 15 GB shared with Drive and Photos; label-based organisation, Smart Compose, Confidential Mode; the largest user base, tied to the Google ecosystem. Outlook: 15 GB; calendar, Exchange integration, rules and Focused Inbox; dominates corporate environments. Yahoo Mail: 1 TB free, disposable addresses; popular in the United States. Proton Mail: end-to-end encryption, Swiss privacy law; journalists, lawyers and privacy-conscious users. Zoho Mail: ad-free, custom domains; Indian businesses.",["Provider 1 storage and feature","Provider 2 storage and feature","Provider 3 storage and feature","User base for each"]],
["Explain the purpose of each standard email folder (Inbox, Sent, Drafts, Outbox, Spam, Trash, Archive).","Inbox receives incoming mail not filtered elsewhere. Sent keeps copies of sent messages as a record. Drafts holds unsent messages, saved or auto-saved. Outbox queues messages not yet delivered to the outgoing server, for example offline, in client applications. Spam holds filtered unsolicited or malicious mail, to be reviewed for false positives. Trash holds deleted messages for recovery for about 30 days. Archive stores messages out of the Inbox without deleting them.",["Inbox","Sent and Drafts","Outbox","Spam","Trash","Archive"]],
["Explain SPF, DKIM and DMARC together, describing how they combine to let a receiving server assess whether a message is genuine.","The From address can be forged because SMTP does not prevent it. SPF: the domain publishes in DNS the servers authorised to send its mail, and the receiver checks the message came from one; failure suggests spoofing. DKIM: the sending server signs each message with a private key; the receiver checks it with the public key in DNS, proving the message came through a legitimate server and was not altered. DMARC builds on both: the domain publishes a policy (quarantine, reject or monitor) for failures and receives reports of spoofing. Together they let a filter detect forgery at protocol level before a human reads the message.",["Why needed (From forged)","SPF","DKIM","DMARC","How they combine"]],
["Describe the warning signs of a phishing email and the recommended response when one is suspected.","Phishing impersonates a trusted entity and manufactures urgency or fear. Signs: a sender address that does not match the claimed organisation (support@gooogle-security.com); requests for passwords, PINs or financial details, which legitimate organisations never make by email; link destinations (seen by hovering) that do not match the claimed domain; urgency or fear; spelling and grammar errors. The safe response: do not click; navigate to the organisation's website by typing the URL; report the message.",["Real sender address","Requests for secrets","Hover over links","Urgency or fear","Spelling errors","Type the URL yourself"]],
["Explain the components of a professional email (greeting, tone, structure, closing, signature) with the reasoning behind each convention.","A greeting by name, matched to formality (Dear Dr. Rao; Hi Asha), shows respect. Tone stays courteous even for bad news; flame emails damage relationships, so draft and wait. Structure: clear, concise, grammatical, with short paragraphs and lists, one topic per email, proofread, specific subject line, so the reader's time is respected. The closing (Yours sincerely, Best regards, Best) matches formality. The signature (name, title, organisation, contact details) identifies the sender and gives other ways to reach them.",["Subject and greeting","Tone","Structure and proofreading","Closing","Signature"]],
["Explain two-factor authentication, describing the three common methods and ranking them by security.","2FA requires two forms of verification, typically something known (password) and something owned (device), so a stolen password alone is useless. Methods: SMS code, a one-time code by text, convenient but vulnerable to SIM-swap attacks and network weaknesses (least secure); authenticator app, generating a TOTP about every 30 seconds independent of the cellular network (more secure); hardware security key, a USB or NFC device that must be present and cannot be phished remotely (most secure).",["Definition and reason","SMS","Authenticator app","Hardware key","Ranking"]],
["Describe the To, CC and BCC fields, explaining the visibility rules and an appropriate use case for each.","To holds the primary recipients, visible to all, expected to act or reply. CC sends a visible copy to people who should be informed; everyone sees To and CC; no action expected (copying a supervisor on a report). BCC sends a hidden copy: invisible to all other recipients and to other BCC recipients; used for newsletters to protect privacy or to discreetly inform a third party.",["To","CC and visibility","BCC and visibility","Use case for each"]]
];

function searchRes(){
  const q=String(L.sq||"").trim(),toks=q.match(/"[^"]*"|\S+/g)||[];
  const crit=[],kw=[];
  toks.forEach(t=>{let m;
    if((m=t.match(/^from:(.+)$/i)))crit.push(["from",m[1].toLowerCase()]);
    else if((m=t.match(/^to:(.+)$/i)))crit.push(["to",m[1].toLowerCase()]);
    else if((m=t.match(/^subject:(.+)$/i)))crit.push(["subject",m[1].replace(/"/g,"").toLowerCase()]);
    else if(/^has:attachment$/i.test(t))crit.push(["att",""]);
    else if((m=t.match(/^after:(\d{4}\/\d{2}\/\d{2})$/i)))crit.push(["after",m[1]]);
    else if((m=t.match(/^before:(\d{4}\/\d{2}\/\d{2})$/i)))crit.push(["before",m[1]]);
    else kw.push(t.replace(/"/g,"").toLowerCase());});
  const hit=INBOX.filter(x=>crit.every(c=>c[0]==="from"?x.f.includes(c[1]):c[0]==="to"?x.to.includes(c[1]):c[0]==="subject"?x.s.toLowerCase().includes(c[1]):c[0]==="att"?x.a:c[0]==="after"?x.d>c[1]:x.d<c[1])&&kw.every(k=>(x.f+" "+x.to+" "+x.s+" "+x.b).toLowerCase().includes(k)));
  let h='<div class="tbl"><table><thead><tr><th>From</th><th>Subject</th><th>Attachment</th><th>Date</th></tr></thead><tbody>'+(hit.length?hit.map(x=>"<tr><td>"+esc(x.f)+"</td><td>"+esc(x.s)+"</td><td>"+(x.a?"yes":"")+"</td><td>"+x.d+"</td></tr>").join(""):'<tr><td colspan="4">No messages match.</td></tr>')+"</tbody></table></div>";
  h+=note("<b>"+hit.length+" of "+INBOX.length+" messages match.</b> Criteria read: "+(crit.concat(kw.map(k=>["keyword",k])).map(c=>c[0]+(c[1]?" = "+esc(c[1]):"")).join("; ")||"none (all messages)")+". Operators combine: every one must be true.");
  return {sres:h};
}

function authRes(){
  const spf=L.au1==="pass",dkim=L.au2==="pass",pol=L.au3,fail=!spf||!dkim;
  let h='<div class="tbl"><table><thead><tr><th>Check</th><th>Question</th><th>Result</th></tr></thead><tbody><tr><th>SPF</th><td>Did it come from a server the domain authorised?</td><td><b>'+(spf?"Pass":"Fail")+'</b></td></tr><tr><th>DKIM</th><td>Is the signature valid, so the content was signed and unaltered?</td><td><b>'+(dkim?"Pass":"Fail")+'</b></td></tr><tr><th>DMARC policy</th><td>What does the domain say to do on failure?</td><td><b>'+esc(pol)+"</b></td></tr></tbody></table></div>";
  if(!fail)h+=okb("<b>Delivered normally.</b> Both checks pass, so the message is treated as authentic (other spam checks still apply).");
  else if(pol==="reject")h+=badb("<b>Rejected.</b> A check failed and the domain's DMARC policy is reject, so the message never reaches the mailbox. The domain owner receives a report.");
  else if(pol==="quarantine")h+=badb("<b>Quarantined.</b> A check failed and the DMARC policy is quarantine, so the message goes to Spam or quarantine.");
  else h+=note("<b>Delivered, failure reported.</b> A check failed but the policy is only to monitor, so the message is delivered while the failure is reported to the domain owner.");
  h+='<p class="hint">The textbook model: DMARC acts when SPF or DKIM fails. SPF checks the server; DKIM checks the signature and integrity.</p>';
  return {aures:h};
}

const ETX="Subject: Question\n\nhey, i need the report NOW!!! why is it not ready??? you people never do anything on time. send it today\n\nCC all staff, BCC the manager";
const FAULTS=[["subj","The subject line is vague ('Question')"],["greet","No greeting and an overly casual opener"],["caps","Capital letters and repeated punctuation read as shouting"],["tone","An angry, accusatory tone (a flame email)"],["struct","Poor grammar, capitalisation and structure; no proofreading"],["bcc","BCC used deceptively; copying all staff is unnecessary"],["close","No sign-off or signature"],["ok","The subject line is specific and the greeting is formal"]];
function viewEtiq(){
  const t=L.et;
  let h='<div class="panel"><h3>Fix the email</h3><p class="hint">Select every genuine fault, then press Check. Work through the checklist: subject line, greeting, tone and structure, closing and signature.</p><pre class="codeview" style="white-space:pre-wrap">'+esc(ETX)+'</pre><div class="subnav">'+FAULTS.map(f=>'<button class="chip" data-act="etog" data-v="'+f[0]+'" aria-pressed="'+!!t[f[0]]+'">'+esc(f[1])+"</button>").join("")+'</div><div class="row"><button class="btn primary" data-act="echk">Check</button></div>';
  if(t.done){const bad=FAULTS.filter(f=>f[0]!=="ok"&&!t[f[0]]).map(f=>f[1]),wrong=t.ok;h+=(bad.length||wrong?badb("<b>Not complete.</b> "+(bad.length?"Missed: "+bad.map(esc).join("; ")+". ":"")+(wrong?"The last option is not a fault of this email.":"")):okb("<b>All faults found.</b> A model rewrite: Subject: Request for the quarterly report by Friday. Dear Mr. Rao, I would be grateful if you could send the quarterly report by Friday. Kind regards, Asha Mehta, Accounts Officer."));}
  return h+"</div>";
}
/* ---------- sorting drill ---------- */
const DIMS=[
{n:"SMTP, POP3 or IMAP",o:["SMTP","POP3","IMAP"],it:[["Push protocol that sends mail server to server",0],["Downloads mail and by default removes it from the server",1],["Synchronises the mailbox across devices",2],["Default for webmail and phone apps",2],["Used for every hop until the mailbox",0],["Suited to single-device access",1]]},
{n:"To, CC or BCC",o:["To","CC","BCC"],it:[["Primary recipient who is expected to act",0],["Visible copy for information only",1],["Hidden from everyone else, including other BCC recipients",2],["Best for a newsletter to strangers",2],["Borrowed from the era of carbon paper",1],["Would reveal a manager's inclusion to the client",1]]},
{n:"Folder",o:["Inbox","Sent","Drafts","Outbox","Spam","Trash","Archive"],it:[["Stores copies of messages successfully sent",1],["Holds unsent messages",2],["Queues messages while a client is offline",3],["Holds filtered unsolicited mail",4],["Emptied automatically after about 30 days",5],["Keeps mail without clutter and without deleting",6],["Default destination for incoming mail",0]]},
{n:"2FA method",o:["SMS code","Authenticator app","Hardware key"],it:[["Vulnerable to SIM-swap attacks",0],["Generates a TOTP about every 30 seconds",1],["Cannot be phished remotely",2],["Convenient but least secure",0],["Independent of the cellular network, but a code is typed",1],["A YubiKey",2]]},
{n:"SPF, DKIM or DMARC",o:["SPF","DKIM","DMARC"],it:[["Lists authorised sending servers",0],["Cryptographic signature on each message",1],["Policy for failures: quarantine, reject or monitor",2],["Proves content was not altered in transit",1],["Includes reporting of spoofing",2],["Checks the message came from an authorised server",0]]},
{n:"Provider",o:["Gmail","Outlook","Yahoo Mail","iCloud Mail","Proton Mail","Zoho Mail"],it:[["1 TB free storage",2],["End-to-end encryption",4],["Indian company, ad-free",5],["Labels and Smart Compose",0],["Enterprise dominance, Exchange",1],["Apple ecosystem",3]]},
{n:"Folder or label",o:["Folder (exclusive)","Label (non-exclusive)"],it:[["A message sits in only one place",0],["One message can appear under Work and Finance",1],["Used by Gmail",1],["Used by Outlook and Yahoo",0]]}
];
function sdNew(){const d=DIMS[L.sd.dim];let i;do{i=Math.floor(Math.random()*d.it.length);}while(d.it.length>1&&i===L.sd.item);L.sd.item=i;L.sd.fb="";L.sd.right=null;}
sdNew();
function viewSort(){
  const s=L.sd,d=DIMS[s.dim],it=d.it[s.item];
  let h='<div class="panel"><h3>Sorting drill</h3><div class="subnav">'+DIMS.map((x,i)=>'<button class="chip" data-act="sdim" data-v="'+i+'" aria-pressed="'+(s.dim===i)+'">'+x.n+"</button>").join("")+"</div>";
  h+='<p class="hint">Score: '+s.s+" / "+s.t+'.</p><p><b>Classify: '+esc(it[0])+'</b></p><div class="row">'+d.o.map((o,i)=>'<button class="btn" data-act="sdans" data-v="'+i+'"'+(s.right!==null?" disabled":"")+">"+esc(o)+"</button>").join("")+"</div>";
  if(s.fb)h+='<div class="rs '+(s.right?"ok":"bad")+'">'+esc(s.fb)+'</div><div class="row"><button class="btn primary" data-act="sdnext">Next item</button></div>';
  return h+"</div>";
}
/* ---------- registry and events ---------- */
const TOOLS={addr:{v:viewAddr,r:addrRes},jour:{v:viewJour,r:jourRes},vis:{v:viewVis,r:visRes},search:{v:viewSearch,r:searchRes},filter:{v:viewFilter,r:filterRes},auth:{v:viewAuth,r:authRes},pwd:{v:viewPwd,r:pwdRes},phish:{v:viewPhish,r:()=>({})},etiq:{v:viewEtiq,r:()=>({})},sort:{v:viewSort,r:()=>({})}};
function labClick(a,el,v){
  switch(a){
    case "ltool":L.tool=v;render();return true;
    case "jnext":if(L.js<5)L.js++;render();return true;
    case "jback":if(L.js>0)L.js--;render();return true;
    case "jreset":L.js=0;render();return true;
    case "pans":{const ok=(+v===1)===MSGS[L.ph].p;L.pa[L.ph]=(+v===1);if(ok)L.ps++;render();return true;}
    case "pnext":if(L.ph+1<MSGS.length)L.ph++;render();return true;
    case "pprev":if(L.ph>0)L.ph--;render();return true;
    case "etog":L.et[v]=!L.et[v];L.et.done=false;render();return true;
    case "echk":L.et.done=true;render();return true;
    case "sdim":L.sd.dim=+v;L.sd.s=0;L.sd.t=0;sdNew();render();return true;
    case "sdnext":sdNew();render();return true;
    case "sdans":{const s=L.sd,d=DIMS[s.dim],it=d.it[s.item],ok=(+v===it[1]);s.t++;if(ok)s.s++;s.right=ok;s.fb=(ok?"Correct. ":"Not quite. ")+"“"+it[0]+"” is "+d.o[it[1]]+".";render();return true;}
  }
  return false;
}
function labInput(el){
  if(el.id in L&&typeof L[el.id]==="string")L[el.id]=el.value;
  const R=TOOLS[L.tool].r();

function labSelect(el){return false;}
CALC.forEach(q=>{if(!matchCalc(q.model,q))q.alts.push([q.model]);});

function noteHtml(b){
  let h='<section class="nb"><h3>'+esc(b.h)+'</h3>';
  if(b.d)h+='<p class="def"><b>Definition.</b> '+esc(b.d)+'</p>';
  (b.p||[]).forEach(p=>{h+='<p>'+esc(p)+'</p>';});
  if(b.l)h+='<ul>'+b.l.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>';
  if(b.t)h+='<div class="tbl"><table><thead><tr>'+b.t.c.map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr></thead><tbody>'+b.t.r.map(r=>'<tr>'+r.map(c=>'<td>'+esc(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
  return h+'</section>';
}
function stepIds(st){const ids=[];CARDS.forEach((c,i)=>{if(st.sec.includes(c[0]))ids.push(i);});return ids.filter(i=>i<ORIG).concat(ids.filter(i=>i>=ORIG));}
function stepChunks(st){const ids=stepIds(st),out=[];for(let i=0;i<ids.length;i+=CH)out.push(ids.slice(i,i+CH));return out;}
function blankHtml(text){return esc(text).replace(/\{\{(.+?)\}\}/g,(m,a)=>`<button class="blank" data-act="blank" style="min-width:${Math.max(4,a.length)}ch" aria-label="Hidden term, press to reveal"><span class="ans">${a}</span></button>`);}
function applyRate(queue,v){const id=queue.shift();let b=store.box[id]||0;
  if(v==="miss"){b=1;queue.splice(Math.min(3,queue.length),0,id);}
  else if(v==="almost"){b=Math.max(b,1);queue.push(id);}
  else{b=b<2?2:3;}
  store.box[id]=b;save();}
function openStep(s){
  const P=S.path,N=stepChunks(STEPS[s]).length;
  const ch=store.path.done[s]?0:Math.min(store.path.ch[s]||0,N);
  P.step=s;P.i=0;P.flip=false;P.guess="";P.text="";P.dchecked=false;P.ticks={};P.q=[];
  if(ch>=N){P.ph="gaps";P.ch=N-1;}else{P.ch=ch;P.ph=ch>0?"learn":"primer";}
  render();window.scrollTo(0,0);
}
function pathOverview(){
  const first=STEPS.findIndex((_,s)=>!store.path.done[s]);
  let h='<div class="panel"><h2>Start here</h2><p>New to the subject? Follow the steps in order. Each step sets out the textbook notes, then teaches its cards in small rounds of six (first you see them with answers, then you recall them), then checks you with fill-the-gaps and a brain dump. Progress is saved in this browser.</p></div><div style="display:flex;flex-direction:column;gap:10px">';
  STEPS.forEach((st,s)=>{
    const N=stepChunks(st).length,done=!!store.path.done[s],ch=Math.min(store.path.ch[s]||0,N);
    const status=done?"Done":ch>0?"Round "+ch+" of "+N+" done":"Not started";
    h+=`<button class="opt" data-act="pstep" data-v="${s}" style="display:flex;justify-content:space-between;gap:12px;align-items:center"><span><b>${s+1}. ${esc(st.t)}</b><br><span class="hint">${stepIds(st).length} cards · ${N} rounds</span></span><span class="tag">${status}</span></button>`;
  });
  h+="</div>";
  if(first>=0)h+=`<div class="row"><button class="btn primary" data-act="pstep" data-v="${first}">${(store.path.ch[first]||0)>0?"Continue":"Begin"} step ${first+1}</button></div>`;
  else h+='<p>All steps are done. Keep the cards fresh in Recall cards, then test yourself in Evaluate.</p>';
  return '<div style="display:flex;flex-direction:column;gap:18px">'+h+"</div>";
}
function viewPath(){
  const P=S.path;
  if(P.step===null)return pathOverview();
  const st=STEPS[P.step],chunks=stepChunks(st),N=chunks.length;
  const pos=P.ph==="primer"?0:(P.ph==="learn"||P.ph==="recall"||P.ph==="roundend")?1+P.ch:P.ph==="gaps"?N+1:P.ph==="dump"?N+2:N+3;
  let h=`<div class="row" style="justify-content:space-between"><span class="row"><button class="btn" data-act="pback">All steps</button>${P.ph==="primer"||P.ph==="done"?"":'<button class="btn" data-act="pnotes">Notes</button>'}</span><span class="lab">Step ${P.step+1} of ${STEPS.length}</span></div><div class="bar" aria-hidden="true"><i style="width:${Math.round(pos/(N+3)*100)}%"></i></div><h2>${esc(st.t)}</h2>`;
  if(P.ph==="primer"){
    h+=`<div class="panel"><div class="lab">Textbook notes</div>${st.blocks.map(noteHtml).join("")}<p class="hint">Next: ${N} short rounds. In each round you see ${CH} cards with their answers, then recall them from memory.</p><div class="row"><button class="btn primary" data-act="pstart">${P.ch>0?"Continue at round "+(P.ch+1):"Start round 1"}</button></div></div>`;
  }else if(P.ph==="learn"){
    const ids=chunks[P.ch],id=ids[P.i],k=CARDS[id];
    h+=`<div class="panel fc"><div class="lab">Round ${P.ch+1} of ${N} · Learn · card ${P.i+1} of ${ids.length} · ${id<ORIG?"Core":"Detail"}</div><div class="q">${esc(k[1])}</div><div class="lab">Answer</div><div class="a">${esc(k[2])}</div><p class="hint">Read it, say it back in your own words, then move on.</p><div class="row"><button class="btn" data-act="plback"${P.i?"":" disabled"}>Back</button><button class="btn primary" data-act="plnext">${P.i+1<ids.length?"Next card":"Now recall these "+ids.length}</button></div></div>`;
  }else if(P.ph==="recall"){
    const id=P.q[0],k=CARDS[id];
    h+=`<div class="panel fc"><div class="lab">Round ${P.ch+1} of ${N} · Recall · ${P.q.length} left</div><div class="q">${esc(k[1])}</div><input type="text" id="pguess" placeholder="Type what you remember (optional)" value="${esc(P.guess)}" autocomplete="off">`;
    if(!P.flip)h+='<div class="row"><button class="btn primary" data-act="pflip">Show answer</button><span class="hint">or press Space</span></div>';
    else h+=`<div class="lab">Answer</div><div class="a">${esc(k[2])}</div><div class="row"><button class="btn bad" data-act="prate" data-v="miss">Missed it (1)</button><button class="btn warn" data-act="prate" data-v="almost">Almost (2)</button><button class="btn good" data-act="prate" data-v="got">Got it (3)</button></div>`;
    h+="</div>";
  }else if(P.ph==="roundend"){
    const last=P.ch+1>=N;
    h+=`<div class="panel"><h3>Round ${P.ch+1} done</h3><p>${last?"That was the last round of cards. Two short exercises remain: fill the gaps in the summary, then a brain dump.":"Next you will see "+chunks[P.ch+1].length+" new cards."}</p><div class="row"><button class="btn primary" data-act="pnext">${last?"Fill the gaps":"Start round "+(P.ch+2)}</button></div></div>`;
  }else if(P.ph==="gaps"){
    h+='<p class="hint">Say each hidden term aloud before you tap it.</p><div class="row"><button class="btn" data-act="revall">Reveal all</button><button class="btn" data-act="hideall">Hide all</button></div>';
    st.notes.forEach(ni=>{const n=NOTES[ni];h+=`<div class="panel note"><h3>${esc(n[0])}</h3><p>${blankHtml(n[1])}</p></div>`;});
    h+='<div class="row"><button class="btn primary" data-act="pdump">Continue to brain dump</button></div>';
  }else if(P.ph==="dump"){
    const pts=[];st.dump.forEach(d=>DUMPS[d].p.forEach(p=>pts.push(p)));
    h+=`<div class="panel"><h3>Brain dump</h3><p class="hint">Close everything and write what you remember about this step. Then compare.</p><textarea id="ptext" placeholder="Write it in your own words...">${esc(P.text)}</textarea>`;
    if(!P.dchecked)h+='<div class="row"><button class="btn primary" data-act="pcheck">Compare with key points</button></div>';
    else{const got=pts.filter((_,i)=>P.ticks[i]).length;
      h+=`<div class="lab">Tick what you included</div><div class="pts">${pts.map((p,i)=>`<label><input type="checkbox" data-act="ptick" data-i="${i}"${P.ticks[i]?" checked":""}><span>${esc(p)}</span></label>`).join("")}</div><div class="row"><b>${got} of ${pts.length} covered</b><button class="btn primary" data-act="pfinish">Finish this step</button></div>`;}
    h+="</div>";
  }else{
    const ids=stepIds(st),m=ids.filter(i=>(store.box[i]||0)>=2).length;
    h+=`<div class="panel"><h3>Step ${P.step+1} complete</h3><p>${m} of ${ids.length} cards in this step are at Review or Mastered. The rest keep coming back in Recall cards.</p><div class="row">${P.step+1<STEPS.length?`<button class="btn primary" data-act="pnextstep">Next: ${esc(STEPS[P.step+1].t)}</button>`:""}<button class="btn" data-act="pback">All steps</button></div></div>`;
  }
  return '<div style="display:flex;flex-direction:column;gap:16px">'+h+"</div>";
}

/* ============ EVALUATE ============ */
function countOf(k){return BANK.filter(b=>b.t===k).length;}
function viewEval(){
  if(S.ev.view==="setup")return evalSetup();
  if(S.ev.view==="quiz")return evalQuiz();
  return evalResult();
}
function evalSetup(){
  let h='<div class="panel"><h2>Build a test</h2><p class="hint">Choose the question types. Written answers (short, long, scenario) are self-marked against the key points, like checking your own paper.</p><div style="display:flex;flex-direction:column;gap:8px">';
  TYPES.forEach(t=>{h+=`<div class="tcount"><label><input type="checkbox" data-act="etype" data-v="${t.k}"${S.ev.types[t.k]?" checked":""}><span>${esc(t.n)}</span></label><span class="n">${countOf(t.k)} Qs · ${t.m} mark${t.m>1?"s":""} each</span></div>`;});
  const pool=BANK.filter(b=>S.ev.types[b.t]).length;
  h+=`</div><div class="row"><label for="en" class="lab">Length</label><select id="en" style="width:auto"><option value="10"${S.ev.n==10?" selected":""}>10 questions</option><option value="20"${S.ev.n==20?" selected":""}>20 questions</option><option value="35"${S.ev.n==35?" selected":""}>35 questions</option><option value="0"${S.ev.n==0?" selected":""}>Everything selected (${pool})</option></select></div><div class="row"><button class="btn primary" data-act="estart"${pool?"":" disabled"}>Start test</button></div></div>`;
  if(store.hist.length){
    h+='<div class="panel"><h3>Recent tests</h3>'+store.hist.slice(0,6).map(x=>`<div class="row" style="justify-content:space-between"><span>${esc(x.d)} · ${x.n} questions</span><b>${x.pct}%</b></div>`).join("")+"</div>";
  }
  return '<div style="display:flex;flex-direction:column;gap:18px">'+h+"</div>";
}
function startRun(list){
  const qs=list.map(q=>q.t==="mcq"?Object.assign({},q,{o:shuffle(q.opts.map((t,i)=>({t:t,c:i===q.a})))}):q);
  S.run={qs:qs,i:0,res:[],stage:[],ticks:[],text:[]};S.ev.view="quiz";render();window.scrollTo(0,0);
}
function evalQuiz(){
  const r=S.run,q=r.qs[r.i],res=r.res[r.i],T=TM[q.t];
  let h=`<div class="panel"><div class="row" style="justify-content:space-between"><span class="tag">${esc(T.n)}</span><span class="lab">Question ${r.i+1} of ${r.qs.length} · ${T.m} mark${T.m>1?"s":""}</span></div><div class="bar" aria-hidden="true"><i style="width:${Math.round(r.i/r.qs.length*100)}%"></i></div>`;
  h+=`<h3 style="font-size:1.2rem;line-height:1.35">${esc(q.t==="fill"?q.q.replace("___","_______"):q.q)}</h3>`;
  if(q.t==="calc"&&q.src)h+='<pre class="codeview">'+esc(q.src)+'</pre>';
  if(q.t==="mcq"){
    h+='<div class="opts">'+q.o.map((o,i)=>{let c="opt";if(res){if(o.c)c+=" right";else if(res.pick===i)c+=" wrong";}return `<button class="${c}" data-act="mcq" data-i="${i}"${res?" disabled":""}>${esc(o.t)}</button>`;}).join("")+"</div>";
    if(res)h+=`<div class="fb ${res.score?"ok":"no"}"><b>${res.score?"Correct.":"Not quite."}</b> ${esc(q.e)}</div>`;
  }else if(q.t==="tf"){
    h+='<div class="opts">'+[true,false].map(v=>{let c="opt";if(res){if(q.a===v)c+=" right";else if(res.pick===v)c+=" wrong";}return `<button class="${c}" data-act="tf" data-v="${v}"${res?" disabled":""}>${v?"True":"False"}</button>`;}).join("")+"</div>";
    if(res)h+=`<div class="fb ${res.score?"ok":"no"}"><b>${res.score?"Correct.":"Not quite."}</b> ${esc(q.e)}</div>`;
  }else if(q.t==="fill"||q.t==="vsa"||q.t==="calc"){
    h+=`<input type="text" id="ans" autocomplete="off" placeholder="Type your answer" value="${esc(r.text[r.i]||"")}"${res?" disabled":""}>`;
    if(!res)h+='<div class="row"><button class="btn primary" data-act="check">Check</button></div>';
    else{
      h+=`<div class="fb ${res.score?"ok":"no"}"><b>${res.score?"Correct.":"Model answer:"}</b> ${res.score?"":esc(q.model)} ${q.e?esc(q.e):""}</div>`;
      if(!res.score)h+='<div class="row"><button class="btn" data-act="override">I was right, count it</button></div>';
    }
  }else{
    const st=r.stage[r.i]||0;
    h+=`<textarea id="wtext" placeholder="Write your answer as you would in the exam..."${st?" disabled":""}>${esc(r.text[r.i]||"")}</textarea>`;
    if(!st)h+='<div class="row"><button class="btn primary" data-act="reveal">Show model answer</button></div>';
    else{
      const tk=r.ticks[r.i]||{};const got=q.pts.filter((_,i)=>tk[i]).length;
      h+=`<div class="lab">Model answer</div><div class="a" style="border-left:3px solid var(--accent);padding-left:14px">${esc(q.model)}</div><div class="lab">Tick every marking point your answer made</div><div class="pts">`+q.pts.map((p,i)=>`<label><input type="checkbox" data-act="wtick" data-i="${i}"${tk[i]?" checked":""}${res?" disabled":""}><span>${esc(p)}</span></label>`).join("")+"</div>";
      if(!res)h+=`<div class="row"><button class="btn primary" data-act="wsave">Save score (${fmt(got/q.pts.length*T.m)} of ${T.m})</button></div>`;
      else h+=`<div class="fb ${res.score>=T.m?"ok":"no"}">Scored ${fmt(res.score)} of ${T.m}.</div>`;
    }
  }
  if(res){h+=`<div class="row"><button class="btn primary" data-act="next">${r.i+1<r.qs.length?"Next question":"See results"}</button></div>`;}
  return h+"</div>";
}
function fmt(x){return (Math.round(x*2)/2).toString();}
function setRes(score,extra){const r=S.run,q=r.qs[r.i];r.res[r.i]=Object.assign({score:score,max:TM[q.t].m},extra||{});render();}
function evalResult(){
  const r=S.run;let sc=0,mx=0;const by={};
  r.qs.forEach((q,i)=>{const x=r.res[i]||{score:0,max:TM[q.t].m};sc+=x.score;mx+=x.max;const b=by[q.t]||(by[q.t]={s:0,m:0,n:0});b.s+=x.score;b.m+=x.max;b.n++;});
  const pct=Math.round(sc/mx*100);
  const msg=pct>=85?"Exam ready on this material.":pct>=65?"Solid. Revisit the misses below.":pct>=40?"Getting there. Use the Learn section on the weak topics.":"Go back to the recall cards, then try again.";
  let h=`<div class="panel"><div class="lab">Result</div><div class="score">${fmt(sc)} / ${mx} <span style="font-size:1.5rem;color:var(--muted)">${pct}%</span></div><p>${msg}</p><div style="display:flex;flex-direction:column;gap:10px">`;
  TYPES.forEach(t=>{const b=by[t.k];if(!b)return;const p=Math.round(b.s/b.m*100);h+=`<div><div class="row" style="justify-content:space-between"><span>${esc(t.n)} (${b.n})</span><b>${fmt(b.s)}/${b.m}</b></div><div class="bar"><i style="width:${p}%"></i></div></div>`;});
  const missed=r.qs.filter((q,i)=>(r.res[i]||{score:0}).score<TM[q.t].m).length;
  h+=`</div><div class="row">${missed?`<button class="btn primary" data-act="retry">Retry the ${missed} missed</button>`:""}<button class="btn" data-act="newtest">New test</button></div></div>`;
  h+="<h2>Review</h2>";
  r.qs.forEach((q,i)=>{const x=r.res[i]||{score:0,max:TM[q.t].m};const ok=x.score>=x.max;
    let ans=q.t==="mcq"?q.opts[q.a]:q.t==="tf"?(q.a?"True":"False"):q.model;
    h+=`<div class="rev ${ok?"ok":"bad"}"><div class="lab">${esc(TM[q.t].n)} · ${fmt(x.score)}/${x.max}</div><b>${esc(q.q)}</b>${x.resp?`<div class="r">You: ${esc(x.resp)}</div>`:""}<div class="r">${ok?"":"Answer: "}${esc(ans)}</div></div>`;});
  return '<div style="display:flex;flex-direction:column;gap:14px">'+h+"</div>";
}
function finishRun(){
  const r=S.run;let sc=0,mx=0;r.qs.forEach((q,i)=>{const x=r.res[i]||{score:0,max:TM[q.t].m};sc+=x.score;mx+=x.max;});
  if(!r.retry){store.hist.unshift({d:new Date().toLocaleDateString(undefined,{day:"numeric",month:"short"}),pct:Math.round(sc/mx*100),n:r.qs.length});store.hist=store.hist.slice(0,8);save();}
  S.ev.view="result";
}

/* ============ EVENTS ============ */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");if(!el)return;
  const a=el.dataset.act,v=el.dataset.v;
  switch(a){
    case "tab":S.tab=v;render();break;
    case "lv":S.lv=v;render();break;
    case "csec":S.cards.sec=+v;buildQueue();render();break;
    case "flip":S.cards.flip=true;render();break;
    case "cnext":buildQueue();render();break;
    case "creset":CARDS.forEach((k,i)=>{if(S.cards.sec<0||k[0]===S.cards.sec)delete store.box[i];});save();buildQueue();render();break;
    case "rate":{const q=S.cards.queue,id=q.shift();let b=store.box[id]||0;
      if(v==="miss"){b=1;q.splice(Math.min(3,q.length),0,id);}
      else if(v==="almost"){b=Math.max(b,1);q.push(id);}
      else{b=b<2?2:3;S.cards.done++;}
      store.box[id]=b;save();S.cards.flip=false;S.cards.guess="";render();break;}
    case "cord":S.cards.ordered=v==="1";buildQueue();render();break;
    case "pstep":openStep(+v);break;
    case "pback":S.path.step=null;render();window.scrollTo(0,0);break;
    case "pnotes":S.path.ph="primer";render();window.scrollTo(0,0);break;
    case "pstart":S.path.ph="learn";S.path.i=0;render();break;
    case "plback":if(S.path.i>0)S.path.i--;render();break;
    case "plnext":{const P=S.path,ids=stepChunks(STEPS[P.step])[P.ch];
      if(P.i+1<ids.length)P.i++;else{P.ph="recall";P.q=shuffle(ids.slice());P.flip=false;P.guess="";}
      render();break;}
    case "pflip":S.path.flip=true;render();break;
    case "prate":{const P=S.path;applyRate(P.q,v);P.flip=false;P.guess="";
      if(!P.q.length){store.path.ch[P.step]=P.ch+1;save();P.ph="roundend";}
      render();break;}
    case "pnext":{const P=S.path,N=stepChunks(STEPS[P.step]).length;
      if(P.ch+1<N){P.ch++;P.ph="learn";P.i=0;}else P.ph="gaps";
      render();window.scrollTo(0,0);break;}
    case "pdump":S.path.ph="dump";render();window.scrollTo(0,0);break;
    case "pcheck":{const t=$("#ptext");if(t)S.path.text=t.value;S.path.dchecked=true;render();break;}
    case "pfinish":store.path.done[S.path.step]=true;save();S.path.ph="done";render();window.scrollTo(0,0);break;
    case "pnextstep":openStep(S.path.step+1);break;
    case "blank":el.classList.toggle("on");break;
    case "revall":document.querySelectorAll(".blank").forEach(b=>b.classList.add("on"));break;
    case "hideall":document.querySelectorAll(".blank").forEach(b=>b.classList.remove("on"));break;
    case "mask":if(el.classList.contains("hid")){el.classList.remove("hid");el.removeAttribute("role");}break;
    case "tmode":S.tmode[el.dataset.t]=v;render();break;
    case "dtopic":S.dump={i:+v,text:"",checked:false,ticks:{}};render();break;
    case "dcheck":S.dump.checked=true;render();break;
    case "dreset":S.dump.checked=false;S.dump.ticks={};S.dump.text="";render();break;
    case "estart":{const pool=shuffle(BANK.filter(b=>S.ev.types[b.t]));const list=S.ev.n?pool.slice(0,S.ev.n):pool;
      list.sort((x,y)=>TYPES.findIndex(t=>t.k===x.t)-TYPES.findIndex(t=>t.k===y.t));startRun(list);break;}
    case "mcq":{const r=S.run,q=r.qs[r.i],i=+el.dataset.i;setRes(q.o[i].c?1:0,{pick:i,resp:q.o[i].t});break;}
    case "tf":{const r=S.run,q=r.qs[r.i],p=v==="true";setRes(p===q.a?1:0,{pick:p,resp:p?"True":"False"});break;}
    case "check":doCheck();break;
    case "override":{const r=S.run;r.res[r.i].score=TM[r.qs[r.i].t].m;render();break;}
    case "reveal":{const r=S.run;r.text[r.i]=$("#wtext").value;r.stage[r.i]=1;render();break;}
    case "wsave":{const r=S.run,q=r.qs[r.i],tk=r.ticks[r.i]||{};const got=q.pts.filter((_,i)=>tk[i]).length;setRes(Math.round(got/q.pts.length*TM[q.t].m*2)/2,{resp:r.text[r.i]||""});break;}
    case "next":{const r=S.run;if(r.i+1<r.qs.length){r.i++;render();window.scrollTo(0,0);}else{finishRun();render();window.scrollTo(0,0);}break;}
    case "retry":{const r=S.run;const list=r.qs.filter((q,i)=>(r.res[i]||{score:0}).score<TM[q.t].m);startRun(list);S.run.retry=true;break;}
    case "newtest":S.ev.view="setup";S.run=null;render();break;
    default:labClick(a,el,v);
  }
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.dataset.lsel){labSelect(el);return;}
  if(el.dataset.act==="etype"){S.ev.types[el.dataset.v]=el.checked?1:0;render();}
  else if(el.id==="en"){S.ev.n=+el.value;}
  else if(el.dataset.act==="ptick"){S.path.ticks[el.dataset.i]=el.checked;render();}
  else if(el.dataset.act==="dtick"){S.dump.ticks[el.dataset.i]=el.checked;render();}
  else if(el.dataset.act==="wtick"){const r=S.run;r.ticks[r.i]=r.ticks[r.i]||{};r.ticks[r.i][el.dataset.i]=el.checked;render();}
});
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.dataset&&(el.dataset.lin||el.dataset.tcell!==undefined)){labInput(el);return;}
  if(el.id==="guess")S.cards.guess=el.value;
  else if(el.id==="pguess")S.path.guess=el.value;
  else if(el.id==="ptext")S.path.text=el.value;
  else if(el.id==="dtext")S.dump.text=el.value;
  else if(el.id==="ans"&&S.run)S.run.text[S.run.i]=el.value;
});
function doCheck(){
  const r=S.run,q=r.qs[r.i],v=($("#ans").value||"").trim();if(!v)return;
  r.text[r.i]=v;setRes((q.t==="calc"?matchCalc(v,q):matches(v,q.acc,q.all))?TM[q.t].m:0,{resp:v});
}
document.addEventListener("keydown",e=>{
  const t=e.target,tag=t.tagName;
  if(e.key==="Enter"&&t.id==="ans"){e.preventDefault();doCheck();return;}
  if(e.key==="Enter"&&t.id==="pguess2"){e.preventDefault();const b=document.querySelector('[data-act="pcheck2"]');if(b&&!b.disabled)b.click();return;}
  if((e.key==="Enter"||e.key===" ")&&t.classList&&t.classList.contains("hid")){e.preventDefault();t.click();return;}
  const inPath=S.tab==="learn"&&S.lv==="path"&&S.path.ph==="recall"&&S.path.q.length>0;
  const inCards=S.tab==="learn"&&S.lv==="cards"&&S.cards.queue.length>0;
  if(!(inPath||inCards)||tag==="INPUT"||tag==="TEXTAREA"||tag==="SELECT")return;
  const flipped=inPath?S.path.flip:S.cards.flip;
  if((e.key===" "||e.key==="Enter")&&tag!=="BUTTON"&&!flipped){e.preventDefault();if(inPath)S.path.flip=true;else S.cards.flip=true;render();}
  else if(flipped&&"123".includes(e.key)&&e.key){const m={"1":"miss","2":"almost","3":"got"};const b=document.querySelector('[data-act$="rate"][data-v="'+m[e.key]+'"]');if(b)b.click();}
});
render();
</script>

</body></html>
