  }
}
:root[data-theme="dark"]{

  padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.blank{font:inherit;display:inline-block;vertical-align:baseline;border:0;border-bottom:2px solid var(--accent);background:var(--mask);color:var(--fg);padding:0 .3em;border-radius:3px 3px 0 0;cursor:pointer;line-height:1.35}

.note p{font-size:1.04rem;line-height:2}

tr:last-child td{border-bottom:0}
td{min-width:9rem}
.m.hid{background:var(--mask);color:transparent;border-radius:4px;cursor:pointer;display:inline-block;user-select:none}
.m{display:inline}
.opt{display:block;width:100%;text-align:left;font:inherit;padding:12px 14px;border-radius:8px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer}
.opt.right{border-color:var(--accent);background:var(--accent-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opts{display:flex;flex-direction:column;gap:8px}
.fb{padding:12px 14px;border-radius:8px;font-size:.95rem}
.fb.ok{background:var(--accent-soft)}.fb.no{background:var(--bad-soft)}
.tag{font:500 .7rem var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:4px;background:var(--accent-soft);color:var(--fg)}
.pts{display:flex;flex-direction:column;gap:6px}
.pts label{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.pts input{margin-top:.3rem;accent-color:var(--accent)}
.score{font:700 3rem var(--display);font-variant-numeric:tabular-nums}
.tcount{display:flex;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:8px}
.tcount label{flex:1;display:flex;gap:10px;align-items:center;cursor:pointer;min-width:0}
.tcount input{accent-color:var(--accent);width:1.1rem;height:1.1rem}
.tcount span.n{font:.78rem var(--mono);color:var(--muted);white-space:nowrap}
.rev{border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:6px}
.rev.bad{border-left:4px solid var(--bad)}.rev.ok{border-left:4px solid var(--accent)}
.rev .r{font-size:.9rem;color:var(--muted)}

@media (prefers-reduced-motion:no-preference){.bar i{transition:width .3s}}
/* ---- Code lab ---- */
:root{--code-bg:#fbfaf6;--code-fg:#1b2a22;--code-line:#d5ddd6;--ok-b:#0a6a4d;--ok-s:#dcefe6;--note-b:#9a4a08;--note-s:#f6e6d4}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--code-bg:#0a100d;--code-fg:#d8efe3;--code-line:#26342c;--ok-b:#5fd7a8;--ok-s:#17382b;--note-b:#f0a15a;--note-s:#3a2a17}}
:root[data-theme="dark"]{--code-bg:#0a100d;--code-fg:#d8efe3;--code-line:#26342c;--ok-b:#5fd7a8;--ok-s:#17382b;--note-b:#f0a15a;--note-s:#3a2a17}
.labwrap{display:flex;flex-direction:column;gap:16px;min-width:0}

.cw{display:flex;flex-direction:column;gap:8px;min-width:0}

.btn.sm{padding:6px 12px;font-size:.85rem}
.codearea,.codeview,.outpre{font:400 .88rem/1.55 var(--mono);background:var(--code-bg);color:var(--code-fg);border:1.5px solid var(--code-line);border-radius:8px;padding:12px 14px;margin:0;white-space:pre;overflow-x:auto;tab-size:4}
.codearea{width:100%;resize:vertical;min-height:5rem}
.outpre{white-space:pre-wrap;border-left:4px solid var(--accent)}
.outbox{display:flex;flex-direction:column;gap:8px;min-width:0}
.dim{color:var(--muted)}
.cw-in{display:flex;flex-direction:column;gap:4px}
.cin,input.mono{font-family:var(--mono)}
.rs{padding:10px 14px;border-radius:8px;font-size:.93rem;border-left:4px solid var(--line);background:var(--bg)}
.rs.ok{border-color:var(--ok-b);background:var(--ok-s)}
.rs.bad{border-color:var(--bad);background:var(--bad-soft)}
.rs.note,.rs.warn{border-color:var(--note-b);background:var(--note-s)}
.try{border:1px dashed var(--accent);border-radius:8px;padding:8px 12px;font-size:.93rem}
.note-box{background:var(--accent-soft);border-radius:8px;padding:10px 14px;font-size:.93rem}
ol.pipe{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0}
ol.pipe li{position:relative;padding:8px 12px 8px 34px;border-left:2px solid var(--line);margin-left:10px;font-size:.93rem}
ol.pipe li::before{content:"";position:absolute;left:-8px;top:12px;width:14px;height:14px;border-radius:50%;background:var(--bg);border:2px solid var(--line)}
ol.pipe li.done::before{background:var(--accent);border-color:var(--accent)}
ol.pipe li.cur{background:var(--accent-soft)}ol.pipe li.cur::before{border-color:var(--accent);background:var(--surface)}
ol.pipe li.fail{background:var(--bad-soft)}ol.pipe li.fail::before{background:var(--bad);border-color:var(--bad)}
ol.pipe li.warn{background:var(--note-s)}ol.pipe li.warn::before{background:var(--note-b);border-color:var(--note-b)}
ol.pipe li.pending{color:var(--muted)}
.bits{display:flex;flex-direction:column;gap:6px}
.brow{display:grid;grid-template-columns:5.5rem 1fr auto;gap:10px;align-items:center}
.brow.res{border-top:1px solid var(--line);padding-top:6px;font-weight:600}
.bl{font:.78rem var(--mono);color:var(--muted)}
.bv{display:flex;gap:2px;flex-wrap:wrap}
.bit{width:1.55rem;height:1.7rem;display:inline-flex;align-items:center;justify-content:center;font:500 .85rem var(--mono);border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--muted)}
.bit.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.bd{font:.85rem var(--mono)}
.b-s{color:var(--bad)}.b-e{color:var(--note-b)}.b-m{color:var(--accent)}
td.mono{word-break:break-all;min-width:0}
ol.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
ol.steps li{display:flex;flex-direction:column;gap:2px;padding:8px 12px;border:1px solid var(--line);border-radius:8px}
.exp{font-family:var(--mono);font-size:.92rem}.exp.res{color:var(--accent);font-weight:600}
.exp mark{background:var(--accent-soft);color:var(--fg);border-radius:3px;padding:0 3px;outline:1.5px solid var(--accent)}
ul.rules{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
ul.rules li{padding:6px 10px;border-radius:6px;font-size:.92rem}
ul.rules li.ok{background:var(--ok-s)}ul.rules li.no{background:var(--bad-soft)}
input.tcell{width:100%;min-width:4rem;font:.9rem var(--mono);padding:6px 8px}
input.tcell.good{border-color:var(--accent);background:var(--accent-soft)}
input.tcell.miss{border-color:var(--bad);background:var(--bad-soft)}
.nb .cw{margin-top:4px}
.nb ol.pipe{margin-top:4px}
@media (max-width:520px){.brow{grid-template-columns:1fr}.bit{width:1.3rem}}

const NOTES=[
["1.1 Project fundamentals","A {{project}} is a temporary, unique endeavour undertaken to create a specific product, service or result within the constraints of time, budget, scope and quality. {{Temporary}} means it has a definite beginning and end; {{unique}} means it produces something new or is done in a new context. It differs from an {{operation}}, the routine, repeating work that has no end date (marking attendance every morning). The {{triple constraint}} is scope, time and cost, with quality in the middle because it suffers when any side is squeezed. Objectives are {{SMART}}: Specific, Measurable, Achievable, Relevant and Time-bound. 'Develop a software application' is poor; a SMART version names the system, the 200 students per class, the monthly reports and the 8 weeks. The {{scope}} says what is included and what is excluded; uncontrolled growth of work with no matching growth in time, people or budget is {{scope creep}}. {{Deliverables}} are the specific, tangible outputs handed over: the requirements specification, design document, working application with source code, test report, user manual and final presentation. A request outside the scope is a {{change request}}, weighed against time and effort. A programme is a group of related projects managed together."],
["1.2 The project life cycle","The project life cycle has five phases. In {{Initiation}} the project is recognised and authorised: stakeholders are identified, the overall objective and major deliverables are set, and the {{Project Charter}} formally authorises the project and gives the manager authority. In {{Planning}} the idea becomes a detailed roadmap: the work breakdown structure, schedule, resource and budget plans, risk planning and a communication plan. In {{Execution}} the plans are put into action and the deliverables are produced. {{Monitoring and Controlling}} runs alongside planning and execution: it tracks progress against the plan, finds {{variances}} and takes corrective action, including {{change control}}, the formal approval or rejection of changes to scope, schedule or budget. In {{Closing}} deliverables are reviewed, accepted and handed over, {{lessons learned}} are recorded, team members are released and documents are archived. The Project Charter belongs to initiation, not planning, and skipping closing means the same mistakes are repeated."],
["1.3 Project planning and scheduling","A {{Work Breakdown Structure}} (WBS) is a hierarchical decomposition of all the work into {{work packages}}: assignable, estimable units. It is not a task list or a schedule, and the 100% rule says the lower levels add up to exactly the level above. The library WBS has four level-1 boxes and thirteen work packages. A {{Gantt chart}} is a horizontal bar chart with tasks down the side and dates across the top. In a {{finish-to-start}} dependency B cannot start until A finishes; in a {{start-to-start}} dependency B cannot start until A has started; parallel tasks can be done at once. The {{critical path}} is the longest chain of dependent tasks; its length is the shortest possible project duration. For tasks A 3, B 4, C 3, D 5, E 6, F 4, G 3, H 1 the paths are A–B–C–E–F–H = {{21}} days, A–B–D–F–H = 17 and A–B–D–G–H = 16. {{Float}} (slack) is the time a task can slip without delaying the end: D has {{4}} days and G has {{5}} days. {{Crashing}} adds people to a critical task at extra cost; {{fast tracking}} runs tasks in parallel at extra risk; the critical path must then be recalculated (cutting E to 3 days gives 18 days, not 15). A {{milestone}} is a zero-duration checkpoint, drawn as a diamond. CPM and PERT date from the late 1950s."],
["1.4 Time management","The {{urgent–important matrix}} (Eisenhower matrix) has four boxes: urgent and important (do first), important but not urgent (schedule), urgent but not important (delegate or minimise) and neither (eliminate). Good workers spend most time in the important, not urgent box. The {{Pomodoro Technique}} is 25 minutes of focused work, a 5-minute break, repeated; after {{four}} cycles comes a long break of 15 to 30 minutes. {{Procrastination}} is delaying difficult tasks; remedies are small specific steps, committing to just 5 minutes, removing distractions and using shared deadlines. Estimation methods are expert judgement, analogous estimation and three-point estimation with Optimistic, Most likely and Pessimistic values: the simple average is (O + M + P) ÷ 3 and the {{PERT}} estimate is (O + 4M + P) ÷ 6. For O = 4, M = 6, P = 14 the average is 8 days, the PERT estimate is {{7}} days and the uncertainty (P − O) ÷ 6 is about 1.7 days. The planning fallacy is the habit of under-estimating one's own tasks, so add a buffer on the critical path."],
["1.5 and 1.6 Teamwork and leadership","Tuckman's stages of team development are {{forming}}, {{storming}}, {{norming}}, {{performing}} and {{adjourning}}; storming is normal. The {{RACI matrix}} gives each task a letter for each person: {{Responsible}} (does the work, possibly several), {{Accountable}} (owns the result; exactly one per task), {{Consulted}} (two-way, before) and {{Informed}} (one-way, after). A stand-up meeting is short (10 to 15 minutes) and each member answers: what did I complete, what will I complete by the next meeting, is anything blocking me. In conflict resolution listen first, separate {{positions}} (what someone wants) from {{interests}} (why), look for solutions serving several interests and escalate only when needed. A leader's five responsibilities are direction, decision-making, motivation, removing obstacles and representing the team; the qualities are integrity, reliability and respect. The {{directive}} style (the leader decides) suits urgent decisions, crises and inexperienced teams; the {{collaborative}} style (the team decides, the leader facilitates) suits capable teams, buy-in and complex problems. Neither style is better in itself."],
["1.7 Documentation and reporting","{{Documentation}} is the systematic upkeep of written records. The {{SRS}} (Software Requirements Specification) records {{functional}} requirements (what the system does: the librarian can issue a book) and {{non-functional}} requirements (how well: a search returns in under 2 seconds; only the librarian can delete records). {{Design documentation}} describes the architecture, database schema, screen layouts, algorithms and interfaces. {{Code documentation}} is comments that explain why, not just what. {{Progress reports}} use a fixed format: done this week, in progress, planned next week, risks and issues, and status (such as amber). The {{final report}} has ten parts: abstract, introduction, literature review or background, system requirements, design, implementation, testing and results, conclusion, references and appendices. Out-of-date documentation is worse than none; copying without a reference is plagiarism."],
["1.8 Risk management","A {{risk}} is an uncertain future event that, if it happens, affects the project's objectives; an {{issue}} is a problem that has already happened. Risk management has four steps: identify, analyse, respond and monitor. Risk categories are technical, schedule, resource, requirements and external. {{Risk exposure}} = probability × impact, each scored Low 1, Medium 2, High 3; scores 6 and 9 are red, 3 and 4 amber, 1 and 2 green. A {{risk register}} records each risk with its probability, impact, score, response and owner: late requirement changes (3 × 3 = {{9}}) are the highest in the library project. The four responses to a threat are {{avoidance}} (change the plan so it cannot happen), {{mitigation}} (lower the probability or impact), {{transfer}} (shift the impact to a third party, as insurance does) and {{acceptance}} (keep a contingency plan). Mitigation cut the laptop-failure risk from 1 × 3 = 3 to 1 × 1 = 1. Positive risks are opportunities (exploit, enhance, share, accept)."],
["1.9 Quality assurance","{{Quality Assurance}} (QA) is the set of activities throughout the project that build quality in; it focuses on the process and aims to prevent defects (coding standards, reviews, audits). {{Quality Control}} (QC) checks the product and aims to find defects (testing, inspection). The four levels of testing are {{unit}} testing (each component in isolation), {{integration}} testing (components combined), {{system}} testing (the whole system against all requirements) and {{user acceptance testing}} (UAT, by real users). Bugs found early are cheaper to fix. A good {{test case}} gives the input, the expected result and the actual result, and covers normal, {{boundary}} and invalid values: a member holding 3 books is the boundary of the limit. A {{code review}} is reading by a person other than the author; coding standards make code consistent. Testing shows bugs, never their absence; regression testing re-runs tests after every change; the V-model pairs each development stage with a test level."],
["1.10 and 1.11 Presentation, demonstration and viva","Plan a presentation from the {{audience}}. Use a three-part structure: introduction (about 10%), body (about 80%) and conclusion (about 10%). The {{6×6 rule}} allows at most 6 bullets per slide and 6 words per bullet; slides support the speaker and are not read aloud. Good delivery covers voice, pace, eye contact, posture and gesture, and handling questions honestly; rehearse alone and then before friends, without memorising. A {{demonstration}} tells a story: the problem, the main features in a real scenario, interesting technical parts, and current abilities and future work. Prepare by testing every feature, using realistic data, having a backup plan (screenshots, a recorded video, an offline copy) and practising and timing the demo. A {{viva}} (viva voce, 'by live voice') is an oral examination of understanding. Know why you chose the design, the alternatives, the difficulties, the limitations and what you would improve; answer honestly, in your own words, and say what you have not tested and how you would find out."],
["1.12 Waterfall and agile","In the {{waterfall}} approach the phases (requirements, design, development, testing, deployment) are done once, in order. It suits stable requirements; its weakness is that the customer sees the product only at the end. In the {{agile}} approach the project is divided into short cycles called {{sprints}} (often 1 to 4 weeks): plan, build, test, show the customer, review. It suits uncertain or changing requirements, but agile does not mean 'no planning'. In {{Scrum}} the product backlog is everything wanted in priority order, the sprint backlog is the part chosen for the sprint, the daily stand-up has the three questions, the sprint review shows the working result and the {{retrospective}} asks what went well and what to improve. The Agile Manifesto was written in 2001. Many organisations use a hybrid: a waterfall-style overall plan with agile working inside each stage."]
];

[2,"What happens if E slips by 2 days and if D slips by 2 days?","E: the project ends on day 23; D: nothing changes."],
[2,"What is crashing?","Adding people or overtime to a critical task, at extra cost."],
[2,"What is fast tracking?","Doing in parallel tasks that were planned one after another, at extra risk."],
[2,"What happens if E is cut from 6 to 3 days?","The top path becomes 18 days, A–B–D–F–H is 17, so the project is 18 days, not 15."],
[2,"What is a milestone?","A zero-duration checkpoint marking the completion of a major phase, deliverable or decision; drawn as a diamond."],
[2,"Find the critical path: P 2, Q 5 after P, R 3 after P, S 2 after Q and R.","P–Q–S = 9 days; float of R = 9 − 7 = 2 days."],
[2,"What are CPM and PERT?","Critical path method (late 1950s, plant maintenance) and the Program Evaluation and Review Technique (US Navy Polaris)."],
[2,"Mnemonic for the planning terms?","WBS: What work; Gantt: Gets the dates; Critical path: Counts the longest chain; Float: Free time; Milestone: Moment."],
[3,"What is the urgent–important matrix?","The Eisenhower matrix: four boxes made from urgent and important."],
[3,"What do you do with each of the four boxes?","Urgent and important: do first; important not urgent: schedule; urgent not important: delegate or minimise; neither: eliminate."],
[3,"Where should good project workers spend most time?","In the important but not urgent box, where planning and prevention happen."],
[3,"State the Pomodoro Technique.","25 minutes of focused work, a 5-minute break, repeat; after four cycles a long break of 15 to 30 minutes."],
[3,"What is procrastination?","Delaying important but difficult tasks in favour of easier or more pleasant ones."],
[3,"Give strategies against procrastination.","Small specific steps, commit to just 5 minutes, remove distractions, use and share deadlines."],
[3,"Name three methods of estimating effort.","Expert judgement, analogous estimation and three-point estimation."],
[3,"State the three-point average and the PERT formula.","(O + M + P) ÷ 3 and (O + 4M + P) ÷ 6."],
[3,"What do O, M and P stand for?","Optimistic, Most likely, Pessimistic."],
[3,"Estimate for O = 4, M = 6, P = 14?","Average 8 days; PERT (4 + 24 + 14) ÷ 6 = 7 days."],
[3,"How is uncertainty measured and what is it here?","(P − O) ÷ 6 = (14 − 4) ÷ 6 ≈ 1.7 days."],
[3,"What is the planning fallacy?","People systematically under-estimate how long their own tasks take; compare with similar tasks and add a buffer."],
[4,"Name Tuckman's five stages.","Forming, storming, norming, performing, adjourning."],
[4,"What happens in storming?","Opinions clash over approach and roles; it is a normal stage."],
[4,"Expand RACI.","Responsible, Accountable, Consulted, Informed."],
[4,"What does Responsible mean?","Does the work; there may be several."],
[4,"What does Accountable mean?","Owns the result and signs it off; exactly one person per task."],
[4,"Distinguish Consulted from Informed.","Consulted: two-way, before the work; Informed: one-way, told of progress or completion."],
[4,"What makes a well-made RACI?","Exactly one A per row, at least one R, and every person has some R."],
[4,"What are the three stand-up questions?","What did I complete? What will I complete by the next meeting? Is anything blocking me?"],
[4,"Why is a stand-up short?","10 to 15 minutes; blockers are solved afterwards by the people concerned."],
[4,"Give approaches to conflict.","Listen first, separate positions from interests, look for solutions that serve several interests, escalate only when needed."],
[4,"Distinguish a position from an interest.","A position is what someone wants; the interest is why they want it."],
[4,"Give the MySQL against SQLite solution.","Run on SQLite for the demo and show that MySQL needs only a changed connection string: it serves both interests."],
[4,"Distinguish a manager from a leader.","A manager plans, organises and controls the work; a leader sets direction and inspires people."],
[4,"List the five responsibilities of a leader.","Direction, decision-making, motivation, removing obstacles, representing the team."],
[4,"What is the directive style and when does it suit?","The leader decides; suits urgent decisions, crises and inexperienced teams."],
[4,"What is the collaborative style and when does it suit?","The team decides with the leader facilitating; suits capable teams, buy-in and complex problems."],
[4,"Which qualities earn a leader credibility?","Integrity, reliability and respect."],
[4,"What is servant leadership?","The leader serves the team by removing obstacles and protecting its time."],
[5,"Define documentation.","The systematic creation and upkeep of written records of requirements, design, code, tests and progress."],
[5,"What is the SRS?","The Software Requirements Specification: functional and non-functional requirements."],
[5,"Distinguish functional from non-functional requirements.","Functional: what the system does (issue a book); non-functional: how well (search under 2 seconds; security)."],
[5,"What does design documentation describe?","Architecture, database schema, screen layouts, algorithms and interfaces."],
[5,"What should code comments explain?","Why, not just what."],
[5,"What does a progress report contain?","Done, in progress, planned next, risks and issues, and status (such as amber)."],
[5,"What is the final report?","The document of the whole project: objectives, method, implementation, results, testing and conclusions."],
[5,"List the ten parts of the final report.","Abstract, introduction, literature review/background, system requirements, design, implementation, testing and results, conclusion, references, appendices."],
[5,"Is 'reset a password by e-mail' functional or not?","Functional; 'pages load in under 3 seconds' and 'passwords are stored encrypted' are non-functional."],
[5,"Why is out-of-date documentation a problem?","It misleads, so it is worse than none; keep it with the code (README, Git)."],
[6,"Define a risk.","An uncertain future event that, if it happens, affects the project's objectives."],
[6,"Distinguish a risk from an issue.","A risk is a possibility; an issue is a problem that has already happened."],
[6,"What are the four steps of risk management?","Identify, analyse, respond, monitor."],
[6,"Name the five categories of risk.","Technical, schedule, resource, requirements, external."],
[6,"State the risk exposure formula and the scale.","Exposure = probability × impact, with Low 1, Medium 2, High 3."],
[6,"What do the colours of the grid mean?","6 and 9 red (most attention), 3 and 4 amber (need a plan), 1 and 2 green (accept and watch)."],
[6,"What is a risk register?","A table of risks with description, probability, impact, score, planned response and an owner."],
[6,"Which risk scored highest in the library register?","Requirements change late: 3 × 3 = 9."],
[6,"Name the four responses to a threat.","Avoidance, mitigation, transfer, acceptance."],
[6,"Distinguish avoidance from mitigation.","Avoidance removes the risk by changing the plan; mitigation only reduces its probability or impact."],
[6,"What is risk transfer? Example.","Shifting the impact to a third party, such as insurance or a managed cloud service."],
[6,"What is risk acceptance?","A deliberate choice with a contingency plan, not ignoring the risk."],
[6,"How did mitigation change the laptop-failure score?","From 1 × 3 = 3 to 1 × 1 = 1, using an online repository and a copy to a second member."],
[6,"What are positive risks and their responses?","Opportunities: exploit, enhance, share, accept."],
[7,"Distinguish QA from QC.","QA: the process, prevents defects throughout the project; QC: the product, finds defects in finished deliverables."],
[7,"Give examples of QA and QC.","QA: coding standards, reviews, audits; QC: testing and inspection."],
[7,"Name the four levels of testing.","Unit, integration, system and user acceptance testing."],
[7,"What does unit testing verify?","That each component works correctly in isolation."],
[7,"What does integration testing verify?","That components work correctly when combined."],
[7,"What does system testing verify?","That the complete system meets all functional requirements."],
[7,"What is UAT and who does it?","User Acceptance Testing by real users, to confirm the system meets their needs."],
[7,"Why are bugs found early cheaper?","Less work has been built on top of them and fewer people are affected."],
[7,"What does a good test case state?","The input, the expected result and the actual result."],
[7,"What kinds of values should test cases include?","Normal, boundary (the edge of the allowed range) and invalid values."],
[7,"Which test case is the boundary for a limit of 3 books?","A member holding 2 books (just below) and one holding 3 books (at the limit: refused)."],
[7,"What is a code review?","A team member other than the author reads the code to find bugs, security problems and weaknesses."],
[7,"What do coding standards give?","Consistent names, indentation, comments and structure: readable, maintainable code."],
[7,"What is regression testing and what is the V-model?","Re-running tests after every change; a model pairing each development stage with a test level."],
[7,"What can testing never prove?","That there are no bugs."],
[8,"What is the first step in planning a presentation?","Start from the audience: their level, interests and what they want to learn."],
[8,"State the three-part structure and proportions.","Introduction about 10%, body about 80%, conclusion about 10%."],
[8,"State the 6×6 rule.","At most 6 bullet points per slide and 6 words per bullet."],
[8,"What should slides do?","Support what you say, not copy it as paragraphs read from the screen."],
[8,"List the elements of good delivery.","Voice, pace, eye contact, posture and gesture, and handling questions."],
[8,"How should you answer a question you cannot answer?","Listen, ask for clarification, answer briefly and honestly, admit what you do not know and say how you would find out."],
[8,"Why practise, and how?","It builds confidence, shows timing problems; rehearse alone and then before friends, without memorising a script."],
[8,"What is the story of a demonstration?","The problem, the main features in a real scenario, interesting technical parts, current abilities and future work."],
[8,"Give the preparation checklist for a demo.","Test every feature, realistic data, backup plan, practise and time it, check the room."],
[8,"What is a backup plan for a demo?","Screenshots or a recorded video, a copy on a pen drive, an offline version."],
[8,"What is a viva?","Viva voce, 'by live voice': an oral examination of your understanding of the project."],
[8,"How do you prepare for a viva?","Understand why as well as what: design choices, alternatives, difficulties, limitations and improvements."],
[8,"What impresses examiners about limitations?","Honesty about limitations, framed as what you learned and would do differently."],
[8,"What is a mock viva?","A friend or teacher asks unseen questions and you answer aloud."],
[8,"Mnemonics for demo, preparation and viva?","Problem, Features, Technical, Future; T-D-B-P: Test, Data, Backup, Practise; Viva: Why, How, Limits, Learned."],
[9,"Describe the waterfall approach.","The phases are done once, in order, each finishing before the next begins."],
[9,"When does waterfall suit and what is its weakness?","Stable, well-known requirements (a bridge, fixed-rule payroll); the customer sees the product only at the end and errors are found late."],
[9,"Describe the agile approach.","Short cycles (sprints, often 1 to 4 weeks) of plan, build, test, show the customer and review."],
[9,"When does agile suit?","Uncertain or changing requirements."],
[9,"Does agile mean no planning or no documents?","No: it prefers working software, collaboration and response to change over rigid plans and heavy documents."],
[9,"Define the product backlog and the sprint backlog.","Product backlog: everything wanted in priority order; sprint backlog: the part chosen for the current sprint."],
[9,"What are the Scrum meetings?","Planning, daily stand-up, sprint review and retrospective."],
[9,"What is a retrospective?","A review of what went well and what to improve, like lessons learned applied after every sprint."],
[9,"When did the Agile Manifesto appear?","2001, written by seventeen software practitioners."],
[9,"Which approach for a client who changes requirements every week?","Agile, because it expects change and shows working results after every sprint."],
[9,"What is the main risk of each approach?","Waterfall: discovering errors late; agile: drifting scope without discipline."]

["Distinguish a project from an operation, with an example of each.","A project is temporary and unique, with a beginning and an end (building an attendance app). An operation is routine and repeating with no end date (marking attendance every morning).",["temporary","unique","operation repeats"]],
["State the triple constraint and why quality is in the middle.","Scope, time and cost. Quality is affected when any side is squeezed: more features without more time or people cut quality or break the deadline.",["scope","time","cost","quality"]],
["Rewrite 'make a good website' as a SMART objective.","Build a school website of 10 pages with a student notice board and a contact form, tested on phone and desktop, and publish it within 6 weeks. It is specific, measurable, achievable, relevant and time-bound.",["specific","measurable","weeks"]],
["Distinguish scope from deliverables.","Scope is the boundary: what is included and excluded. Deliverables are the tangible outputs handed over (the application, test report, manual).",["boundary","outputs"]],
["Why does monitoring and controlling run alongside execution?","Progress must be tracked and corrected while the work is done, so variances are found early and corrective action or change control happens before delays spread.",["tracked","corrective"]],
["What is the difference between a stakeholder and a team member?","A stakeholder is anyone affected by or interested in the project (librarian, students, teacher); a team member is one of the people who do the work.",["affected","do the work"]],
["What is the purpose of lessons learned?","They record what went well and what to improve at closing, turning experience into knowledge for future teams.",["went well","future"]],
["Why is a WBS not a task list?","It is a hierarchy of deliverables and the work to make them, with no dates; it ensures nothing needed is forgotten and nothing outside the scope is included.",["hierarchy","no dates"]],
["Distinguish finish-to-start from start-to-start dependencies.","Finish-to-start: B cannot start until A finishes (code after design). Start-to-start: B cannot start until A has started.",["finish","start"]],
["Define float and say why critical tasks have none.","Float is the time a task can slip without delaying the project. Critical tasks lie on the longest path, so any delay moves the end date: their float is zero.",["slip","longest path"]],
["Distinguish a milestone from a task.","A milestone is a zero-duration checkpoint marking a major completion or decision (a diamond); a task has a duration and work.",["zero duration","checkpoint"]],
["Describe the urgent–important matrix.","Four boxes: urgent and important (do first), important not urgent (schedule), urgent not important (delegate or minimise), neither (eliminate).",["do first","schedule","delegate","eliminate"]],
["Give three methods to avoid procrastination.","Break big tasks into small steps, commit to just 5 minutes, remove distractions and use shared deadlines.",["small steps","5 minutes","distractions"]],
["Distinguish Responsible from Accountable in RACI.","Responsible people do the work (there may be several); exactly one person is Accountable: owns the result and signs it off.",["does the work","one accountable"]],
["Why are stand-up meetings short?","They only need done, next and blocked from each person; blockers are solved afterwards by the people concerned, so the meeting stays 10 to 15 minutes.",["blockers","short"]],
["Distinguish position from interest in conflict resolution.","A position is what someone wants (use Python); the interest is why (they know it and time is short). Different positions often have compatible interests.",["position what","interest why"]],
["State two situations where a directive style is better.","A crisis or urgent decision, and an inexperienced team that needs clear, quick direction.",["urgent","inexperienced"]],
["Distinguish functional from non-functional requirements with examples.","Functional: what the system does (the librarian can issue a book). Non-functional: how well (search in under 2 seconds; only the librarian can delete).",["what","how well"]],
["Distinguish a risk from an issue.","A risk is an uncertain event that may happen; an issue is a problem that has already happened.",["may happen","already happened"]],
["Distinguish risk avoidance from risk mitigation.","Avoidance changes the plan so the risk cannot happen; mitigation acts to lower the probability or the impact.",["cannot happen","lower"]],
["Distinguish QA from QC.","QA is process-focused and prevents defects throughout the project; QC is product-focused and finds defects in finished deliverables.",["process prevent","product detect"]],
["Why are bugs found early cheaper to fix?","Less work has been built on top of them and fewer people are affected.",["less work","fewer"]],
["Why should a demo use realistic data?","Real-looking names, classes and marks are far more convincing than aaa, bbb, ccc and show that the system works on real cases.",["convincing"]],
["What is the purpose of a backup plan for a demonstration?","If the live system fails, screenshots, a recorded video, a pen drive or an offline copy still let you show the work.",["fails","video"]],
["Distinguish waterfall from agile in two points.","Waterfall does the phases once in order with fixed requirements and shows the product at the end; agile repeats short sprints, expects changing requirements and shows working software after every sprint.",["once","sprints","requirements"]]

function norm(s){return " "+String(s).toLowerCase().replace(/[^a-z0-9]+/g," ").trim()+" ";}
function matches(user,acc,all){const u=norm(user);const hit=a=>u.includes(norm(a));return all?acc.every(hit):acc.some(hit);}

function parseKV(s){const kv={};const re=/(\w+)=(\S+)/g;let m;while((m=re.exec(s)))kv[m[1]]=m[2];return kv;}
function cpm(tasks){
  const byId={};tasks.forEach(t=>byId[t.id]=t);
  tasks.forEach(t=>t.pre.forEach(p=>{if(!byId[p])throw new Error("task "+t.id+" depends on "+p+", which is not defined.");}));
  const es={},ef={};let guard=0;
  const done=()=>tasks.every(t=>ef[t.id]!==undefined);
  while(!done()){
    if(guard++>100)throw new Error("The dependencies form a loop.");
    tasks.forEach(t=>{if(ef[t.id]===undefined&&t.pre.every(p=>ef[p]!==undefined)){es[t.id]=t.pre.length?Math.max.apply(null,t.pre.map(p=>ef[p])):0;ef[t.id]=es[t.id]+t.d;}});
  }
  const end=Math.max.apply(null,tasks.map(t=>ef[t.id]));
  const lf={},ls={};
  tasks.slice().sort((a,b)=>ef[b.id]-ef[a.id]).forEach(()=>{});
  const succ={};tasks.forEach(t=>succ[t.id]=[]);tasks.forEach(t=>t.pre.forEach(p=>succ[p].push(t.id)));
  let changed=true;tasks.forEach(t=>{lf[t.id]=end;ls[t.id]=end-t.d;});
  for(let k=0;k<tasks.length+2;k++){tasks.forEach(t=>{const lfv=succ[t.id].length?Math.min.apply(null,succ[t.id].map(s=>ls[s])):end;lf[t.id]=lfv;ls[t.id]=lfv-t.d;});}
  const fl={};tasks.forEach(t=>fl[t.id]=ls[t.id]-es[t.id]);
  // critical path: follow zero-float tasks in order of start
  const crit=tasks.filter(t=>fl[t.id]===0).sort((a,b)=>es[a.id]-es[b.id]);
  return {end,es,ef,fl,crit};
}
const SIMS={
tasks(a,o){
  const toks=a.raw.trim().split(/\s+/).filter(x=>x);
  if(!toks.length)throw new Error("tasks needs entries like A=3 or D=3:B,C (id=days:predecessors).");
  const ts=[];
  toks.forEach(x=>{const m=/^([A-Za-z]\w*)=(\d+)(?::([A-Za-z][\w,]*))?$/.exec(x);if(!m)throw new Error("'"+x+"' is not a task. Write id=days or id=days:predecessor,predecessor.");if(ts.some(t=>t.id===m[1]))throw new Error("task "+m[1]+" is defined twice.");ts.push({id:m[1],d:+m[2],pre:m[3]?m[3].split(","):[]});});
  const r=cpm(ts);
  o.push("critical path: "+r.crit.map(t=>t.id).join("-")+" = "+r.end+" days");
  const fl=ts.filter(t=>r.fl[t.id]>0).map(t=>t.id+" "+r.fl[t.id]);
  o.push("float: "+(fl.length?fl.join(", "):"none"));
},
delay(a,o){
  const kv=parseKV(a.raw);const ids=a.raw.split(/\s+/).filter(x=>x);
  throw new Error("delay is not a command; change a duration in the tasks line.");
},
pert(a,o){
  const O=+a.kv.o,M=+a.kv.m,P=+a.kv.p;
  if([O,M,P].some(x=>isNaN(x)||x<0)||!(O<=M&&M<=P))throw new Error("pert needs o=, m= and p= with o <= m <= p.");
  const t=x=>String(Math.round(x*100)/100);
  o.push("average: "+t((O+M+P)/3)+" days");
  o.push("PERT: "+t((O+4*M+P)/6)+" days");
  o.push("spread: "+t((P-O)/6)+" days");
},
risk(a,o){
  const p=+a.kv.p,i=+a.kv.i;
  if(![1,2,3].includes(p)||![1,2,3].includes(i))throw new Error("risk needs p= and i= each 1, 2 or 3 (low, medium, high).");
  const e=p*i;o.push("exposure: "+e+" ("+(e>=6?"red":e>=3?"amber":"green")+")");
},
pomodoro(a,o){
  const n=+a.kv.n;if(!(n>=1&&n<=12))throw new Error("pomodoro needs n=1 to 12 cycles.");
  const longs=Math.floor(n/4),shorts=n-longs;
  o.push("focused work: "+n*25+" minutes");
  o.push("short breaks: "+shorts+" x 5 = "+shorts*5+" minutes");
  o.push("long breaks: "+longs+" (15 to 30 minutes each)");
},
slides(a,o){
  const b=+a.kv.bullets,w=+a.kv.words;
  if(!(b>=1)||!(w>=1))throw new Error("slides needs bullets= and words= (words in each bullet).");
  const ok=b<=6&&w<=6;o.push(ok?"6x6 rule: met":"6x6 rule: not met");
  if(!ok)o.push("split into "+Math.ceil(b/6)+" slides and shorten each bullet to 6 words");
},
parallel(a,o){
  const pk=+a.kv.packages,d=+a.kv.days,pp=+a.kv.people;
  if(!(pk>=1)||!(d>=1)||!(pp>=1))throw new Error("parallel needs packages=, days= (each) and people=.");
  o.push("total effort: "+pk*d+" person-days");
  o.push("elapsed time: "+Math.ceil(pk/pp)*d+" days");
}
};
function fnRun(src){
  const out=[];let errors=0,title="",detail="";
  const lines=String(src).replace(/\r/g,"").split("\n");let cmds=0;
  for(let i=0;i<lines.length;i++){
    const ln=lines[i].trim();if(!ln||ln[0]==="#")continue;
    const sp=ln.search(/\s/),c=sp<0?ln:ln.slice(0,sp),rest=sp<0?"":ln.slice(sp+1);cmds++;
    if(!SIMS[c]||c==="delay"){errors++;title="Unknown command";detail="Line "+(i+1)+": '"+c+"' is not a command of this lab. Commands: tasks, pert, risk, pomodoro, slides, parallel.";out.push("error: "+detail);continue;}
    try{SIMS[c]({kv:parseKV(rest),raw:rest},out);}catch(e){errors++;title="Cannot run";detail="Line "+(i+1)+": "+e.message;out.push("error: "+detail);}
  }
  if(!cmds)return {ok:false,title:"Nothing to run",detail:"Type at least one command.",out:"",brief:"",errors:1,warns:0};
  return {ok:errors===0,title,detail,out:out.join("\n"),brief:out.join(" / "),errors,warns:0,cmds};
}

function labClick(a,el,v){
  switch(a){
    case "ltool":L.tool=v;render();return true;
    case "crun":runWidget(el.dataset.id);return true;
    case "wreset":resetWidget(el.dataset.id);return true;
    case "ltog":L[el.dataset.key]=!L[el.dataset.key];render();return true;
    case "lset":L[el.dataset.key]=v;render();return true;
    case "pcheck2":{const q=CALC[L.pi];const g=document.getElementById("pguess2").value;L.pres[L.pi]=Object.assign(L.pres[L.pi]||{},{guess:g,checked:true,ok:matchCalc(g,q)});render();return true;}
    case "prun2":{const q=CALC[L.pi];const r=runCpp(q.src,"");L.pres[L.pi]=Object.assign(L.pres[L.pi]||{},{run:r});const g=document.getElementById("pguess2");if(g&&!(L.pres[L.pi].checked))L.pres[L.pi].guess=g.value;render();return true;}
    case "pprev2":if(L.pi>0)L.pi--;render();return true;
    case "pnext2":if(L.pi+1<CALC.length)L.pi++;render();return true;
    case "fcheck":{const f=FIX[L.fi];const id="fix"+L.fi;const ta=document.getElementById("code-"+id);const ii=document.getElementById("in-"+id);const src=ta?ta.value:f.src;CS.src[id]=src;const inp=ii?ii.value:(f.inp||"");CS.inp[id]=inp;const r=runCpp(src,inp);CS.out[id]=r;
      const got=(r.brief!==undefined?r.brief:(r.out||"")).replace(/\r/g,"").replace(/\s+$/,"");
      let msg,ok=false;
      if(!r.ok){msg=r.title+". "+r.detail;}
      else if(got===f.exp){ok=true;msg="The output matches the goal.";}
      else msg="It runs, but the output is different from the goal. Expected \""+f.exp.replace(/\n/g," / ")+"\" and got \""+got.replace(/\n/g," / ")+"\".";
      L.fres[L.fi]={ok:ok,msg:msg};render();return true;}
    case "fhint":L.fshow[L.fi]=Math.max(L.fshow[L.fi]||0,1);render();return true;
    case "fsol":L.fshow[L.fi]=2;render();return true;
    case "fprev":if(L.fi>0)L.fi--;render();return true;
    case "fnext":if(L.fi+1<FIX.length)L.fi++;render();return true;
    case "lsdim":L.sd.dim=+v;L.sd.s=0;L.sd.t=0;sdNew();render();return true;
    case "lsda":{const d=DIMS[L.sd.dim],it=d.it[L.sd.item];L.sd.t++;const ok=+v===it[1];if(ok)L.sd.s++;L.sd.right=ok;L.sd.fb=(ok?"Correct. ":"Not quite. ")+"\u201c"+it[0]+"\u201d: "+d.o[it[1]]+".";render();return true;}
    case "lsdn":sdNew();render();return true;
  }
  return false;
}

function stepIds(st){const ids=[];CARDS.forEach((c,i)=>{if(st.sec.includes(c[0]))ids.push(i);});return ids.filter(i=>i<ORIG).concat(ids.filter(i=>i>=ORIG));}
function stepChunks(st){const ids=stepIds(st),out=[];for(let i=0;i<ids.length;i+=CH)out.push(ids.slice(i,i+CH));return out;}
function blankHtml(text){return esc(text).replace(/\{\{(.+?)\}\}/g,(m,a)=>`<button class="blank" data-act="blank" style="min-width:${Math.max(4,a.length)}ch" aria-label="Hidden term, press to reveal"><span class="ans">${a}</span></button>`);}
function applyRate(queue,v){const id=queue.shift();let b=store.box[id]||0;
  if(v==="miss"){b=1;queue.splice(Math.min(3,queue.length),0,id);}
  else if(v==="almost"){b=Math.max(b,1);queue.push(id);}
  else{b=b<2?2:3;}
  store.box[id]=b;save();}
function openStep(s){
  const P=S.path,N=stepChunks(STEPS[s]).length;
  const ch=store.path.done[s]?0:Math.min(store.path.ch[s]||0,N);
  P.step=s;P.i=0;P.flip=false;P.guess="";P.text="";P.dchecked=false;P.ticks={};P.q=[];
  if(ch>=N){P.ph="gaps";P.ch=N-1;}else{P.ch=ch;P.ph=ch>0?"learn":"primer";}

}
function pathOverview(){
  const first=STEPS.findIndex((_,s)=>!store.path.done[s]);
  let h='<div class="panel"><h2>Start here</h2><p>New to the subject? Follow the steps in order. Each step sets out the textbook notes (with runnable code where the chapter has a listing), then teaches its cards in small rounds of six (first you see them with answers, then you recall them), then checks you with fill-the-gaps and a brain dump. Progress is saved in this browser.</p></div><div style="display:flex;flex-direction:column;gap:10px">';
  STEPS.forEach((st,s)=>{
    const N=stepChunks(st).length,done=!!store.path.done[s],ch=Math.min(store.path.ch[s]||0,N);
    const status=done?"Done":ch>0?"Round "+ch+" of "+N+" done":"Not started";
    h+=`<button class="opt" data-act="pstep" data-v="${s}" style="display:flex;justify-content:space-between;gap:12px;align-items:center"><span><b>${s+1}. ${esc(st.t)}</b><br><span class="hint">${stepIds(st).length} cards · ${N} rounds</span></span><span class="tag">${status}</span></button>`;
  });

  if(first>=0)h+=`<div class="row"><button class="btn primary" data-act="pstep" data-v="${first}">${(store.path.ch[first]||0)>0?"Continue":"Begin"} step ${first+1}</button></div>`;

function viewPath(){
  const P=S.path;

  const st=STEPS[P.step],chunks=stepChunks(st),N=chunks.length;
  const pos=P.ph==="primer"?0:(P.ph==="learn"||P.ph==="recall"||P.ph==="roundend")?1+P.ch:P.ph==="gaps"?N+1:P.ph==="dump"?N+2:N+3;
  let h=`<div class="row" style="justify-content:space-between"><span class="row"><button class="btn" data-act="pback">All steps</button>${P.ph==="primer"||P.ph==="done"?"":'<button class="btn" data-act="pnotes">Notes</button>'}</span><span class="lab">Step ${P.step+1} of ${STEPS.length}</span></div><div class="bar" aria-hidden="true"><i style="width:${Math.round(pos/(N+3)*100)}%"></i></div><h2>${esc(st.t)}</h2>`;

    h+=`<div class="panel"><div class="lab">Textbook notes</div>${st.blocks.map(noteHtml).join("")}<p class="hint">Next: ${N} short rounds. In each round you see ${CH} cards with their answers, then recall them from memory.</p><div class="row"><button class="btn primary" data-act="pstart">${P.ch>0?"Continue at round "+(P.ch+1):"Start round 1"}</button></div></div>`;

  }else if(P.ph==="recall"){

    if(!P.flip)h+='<div class="row"><button class="btn primary" data-act="pflip">Show answer</button><span class="hint">or press Space</span></div>';
    else h+=`<div class="lab">Answer</div><div class="a">${esc(k[2])}</div><div class="row"><button class="btn bad" data-act="prate" data-v="miss">Missed it (1)</button><button class="btn warn" data-act="prate" data-v="almost">Almost (2)</button><button class="btn good" data-act="prate" data-v="got">Got it (3)</button></div>`;
    h+="</div>";
  }else if(P.ph==="roundend"){
    const last=P.ch+1>=N;
    h+=`<div class="panel"><h3>Round ${P.ch+1} done</h3><p>${last?"That was the last round of cards. Two short exercises remain: fill the gaps in the summary, then a brain dump.":"Next you will see "+chunks[P.ch+1].length+" new cards."}</p><div class="row"><button class="btn primary" data-act="pnext">${last?"Fill the gaps":"Start round "+(P.ch+2)}</button></div></div>`;
  }else if(P.ph==="gaps"){

    if(!P.dchecked)h+='<div class="row"><button class="btn primary" data-act="pcheck">Compare with key points</button></div>';
    else{const got=pts.filter((_,i)=>P.ticks[i]).length;

}
function startRun(list){
  const qs=list.map(q=>q.t==="mcq"?Object.assign({},q,{o:shuffle(q.opts.map((t,i)=>({t:t,c:i===q.a})))}):q);
  S.run={qs:qs,i:0,res:[],stage:[],ticks:[],text:[]};S.ev.view="quiz";render();window.scrollTo(0,0);
}
function evalQuiz(){
  const r=S.run,q=r.qs[r.i],res=r.res[r.i],T=TM[q.t];
  let h=`<div class="panel"><div class="row" style="justify-content:space-between"><span class="tag">${esc(T.n)}</span><span class="lab">Question ${r.i+1} of ${r.qs.length} · ${T.m} mark${T.m>1?"s":""}</span></div><div class="bar" aria-hidden="true"><i style="width:${Math.round(r.i/r.qs.length*100)}%"></i></div>`;
  h+=`<h3 style="font-size:1.2rem;line-height:1.35">${esc(q.t==="fill"?q.q.replace("___","_______"):q.q)}</h3>`;
  if(q.t==="calc"&&q.src)h+='<pre class="codeview">'+esc(q.src)+'</pre>';
  if(q.t==="mcq"){
    h+='<div class="opts">'+q.o.map((o,i)=>{let c="opt";if(res){if(o.c)c+=" right";else if(res.pick===i)c+=" wrong";}return `<button class="${c}" data-act="mcq" data-i="${i}"${res?" disabled":""}>${esc(o.t)}</button>`;}).join("")+"</div>";
    if(res)h+=`<div class="fb ${res.score?"ok":"no"}"><b>${res.score?"Correct.":"Not quite."}</b> ${esc(q.e)}</div>`;
  }else if(q.t==="tf"){
    h+='<div class="opts">'+[true,false].map(v=>{let c="opt";if(res){if(q.a===v)c+=" right";else if(res.pick===v)c+=" wrong";}return `<button class="${c}" data-act="tf" data-v="${v}"${res?" disabled":""}>${v?"True":"False"}</button>`;}).join("")+"</div>";
    if(res)h+=`<div class="fb ${res.score?"ok":"no"}"><b>${res.score?"Correct.":"Not quite."}</b> ${esc(q.e)}</div>`;
  }else if(q.t==="fill"||q.t==="vsa"||q.t==="calc"){
    h+=`<input type="text" id="ans" autocomplete="off" placeholder="Type your answer" value="${esc(r.text[r.i]||"")}"${res?" disabled":""}>`;
    if(!res)h+='<div class="row"><button class="btn primary" data-act="check">Check</button></div>';
    else{
      h+=`<div class="fb ${res.score?"ok":"no"}"><b>${res.score?"Correct.":"Model answer:"}</b> ${res.score?"":esc(q.model)} ${q.e?esc(q.e):""}</div>`;
      if(!res.score)h+='<div class="row"><button class="btn" data-act="override">I was right, count it</button></div>';
    }
  }else{
    const st=r.stage[r.i]||0;
    h+=`<textarea id="wtext" placeholder="Write your answer as you would in the exam..."${st?" disabled":""}>${esc(r.text[r.i]||"")}</textarea>`;
    if(!st)h+='<div class="row"><button class="btn primary" data-act="reveal">Show model answer</button></div>';
    else{
      const tk=r.ticks[r.i]||{};const got=q.pts.filter((_,i)=>tk[i]).length;
      h+=`<div class="lab">Model answer</div><div class="a" style="border-left:3px solid var(--accent);padding-left:14px">${esc(q.model)}</div><div class="lab">Tick every marking point your answer made</div><div class="pts">`+q.pts.map((p,i)=>`<label><input type="checkbox" data-act="wtick" data-i="${i}"${tk[i]?" checked":""}${res?" disabled":""}><span>${esc(p)}</span></label>`).join("")+"</div>";
      if(!res)h+=`<div class="row"><button class="btn primary" data-act="wsave">Save score (${fmt(got/q.pts.length*T.m)} of ${T.m})</button></div>`;
      else h+=`<div class="fb ${res.score>=T.m?"ok":"no"}">Scored ${fmt(res.score)} of ${T.m}.</div>`;
    }
  }
  if(res){h+=`<div class="row"><button class="btn primary" data-act="next">${r.i+1<r.qs.length?"Next question":"See results"}</button></div>`;}
  return h+"</div>";
}
function fmt(x){return (Math.round(x*2)/2).toString();}
function setRes(score,extra){const r=S.run,q=r.qs[r.i];r.res[r.i]=Object.assign({score:score,max:TM[q.t].m},extra||{});render();}
function evalResult(){
  const r=S.run;let sc=0,mx=0;const by={};
  r.qs.forEach((q,i)=>{const x=r.res[i]||{score:0,max:TM[q.t].m};sc+=x.score;mx+=x.max;const b=by[q.t]||(by[q.t]={s:0,m:0,n:0});b.s+=x.score;b.m+=x.max;b.n++;});
  const pct=Math.round(sc/mx*100);
  const msg=pct>=85?"Exam ready on this material.":pct>=65?"Solid. Revisit the misses below.":pct>=40?"Getting there. Use the Learn section on the weak topics.":"Go back to the recall cards, then try again.";
  let h=`<div class="panel"><div class="lab">Result</div><div class="score">${fmt(sc)} / ${mx} <span style="font-size:1.5rem;color:var(--muted)">${pct}%</span></div><p>${msg}</p><div style="display:flex;flex-direction:column;gap:10px">`;
  TYPES.forEach(t=>{const b=by[t.k];if(!b)return;const p=Math.round(b.s/b.m*100);h+=`<div><div class="row" style="justify-content:space-between"><span>${esc(t.n)} (${b.n})</span><b>${fmt(b.s)}/${b.m}</b></div><div class="bar"><i style="width:${p}%"></i></div></div>`;});
  const missed=r.qs.filter((q,i)=>(r.res[i]||{score:0}).score<TM[q.t].m).length;
  h+=`</div><div class="row">${missed?`<button class="btn primary" data-act="retry">Retry the ${missed} missed</button>`:""}<button class="btn" data-act="newtest">New test</button></div></div>`;
  h+="<h2>Review</h2>";
  r.qs.forEach((q,i)=>{const x=r.res[i]||{score:0,max:TM[q.t].m};const ok=x.score>=x.max;
    let ans=q.t==="mcq"?q.opts[q.a]:q.t==="tf"?(q.a?"True":"False"):q.model;
    h+=`<div class="rev ${ok?"ok":"bad"}"><div class="lab">${esc(TM[q.t].n)} · ${fmt(x.score)}/${x.max}</div><b>${esc(q.q)}</b>${x.resp?`<div class="r">You: ${esc(x.resp)}</div>`:""}<div class="r">${ok?"":"Answer: "}${esc(ans)}</div></div>`;});
  return '<div style="display:flex;flex-direction:column;gap:14px">'+h+"</div>";
}
function finishRun(){
  const r=S.run;let sc=0,mx=0;r.qs.forEach((q,i)=>{const x=r.res[i]||{score:0,max:TM[q.t].m};sc+=x.score;mx+=x.max;});
  if(!r.retry){store.hist.unshift({d:new Date().toLocaleDateString(undefined,{day:"numeric",month:"short"}),pct:Math.round(sc/mx*100),n:r.qs.length});store.hist=store.hist.slice(0,8);save();}
  S.ev.view="result";
}

/* ============ EVENTS ============ */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");if(!el)return;
  const a=el.dataset.act,v=el.dataset.v;
  switch(a){
    case "tab":S.tab=v;render();break;
    case "lv":S.lv=v;render();break;
    case "csec":S.cards.sec=+v;buildQueue();render();break;
    case "flip":S.cards.flip=true;render();break;
    case "cnext":buildQueue();render();break;
    case "creset":CARDS.forEach((k,i)=>{if(S.cards.sec<0||k[0]===S.cards.sec)delete store.box[i];});save();buildQueue();render();break;
    case "rate":{const q=S.cards.queue,id=q.shift();let b=store.box[id]||0;
      if(v==="miss"){b=1;q.splice(Math.min(3,q.length),0,id);}
      else if(v==="almost"){b=Math.max(b,1);q.push(id);}
      else{b=b<2?2:3;S.cards.done++;}
      store.box[id]=b;save();S.cards.flip=false;S.cards.guess="";render();break;}
    case "cord":S.cards.ordered=v==="1";buildQueue();render();break;
    case "pstep":openStep(+v);break;
    case "pback":S.path.step=null;render();window.scrollTo(0,0);break;
    case "pnotes":S.path.ph="primer";render();window.scrollTo(0,0);break;
    case "pstart":S.path.ph="learn";S.path.i=0;render();break;
    case "plback":if(S.path.i>0)S.path.i--;render();break;
    case "plnext":{const P=S.path,ids=stepChunks(STEPS[P.step])[P.ch];
      if(P.i+1<ids.length)P.i++;else{P.ph="recall";P.q=shuffle(ids.slice());P.flip=false;P.guess="";}
      render();break;}
    case "pflip":S.path.flip=true;render();break;
    case "prate":{const P=S.path;applyRate(P.q,v);P.flip=false;P.guess="";
      if(!P.q.length){store.path.ch[P.step]=P.ch+1;save();P.ph="roundend";}
      render();break;}
    case "pnext":{const P=S.path,N=stepChunks(STEPS[P.step]).length;
      if(P.ch+1<N){P.ch++;P.ph="learn";P.i=0;}else P.ph="gaps";
      render();window.scrollTo(0,0);break;}
    case "pdump":S.path.ph="dump";render();window.scrollTo(0,0);break;
    case "pcheck":{const t=$("#ptext");if(t)S.path.text=t.value;S.path.dchecked=true;render();break;}
    case "pfinish":store.path.done[S.path.step]=true;save();S.path.ph="done";render();window.scrollTo(0,0);break;
    case "pnextstep":openStep(S.path.step+1);break;
    case "blank":el.classList.toggle("on");break;
    case "revall":document.querySelectorAll(".blank").forEach(b=>b.classList.add("on"));break;
    case "hideall":document.querySelectorAll(".blank").forEach(b=>b.classList.remove("on"));break;
    case "mask":if(el.classList.contains("hid")){el.classList.remove("hid");el.removeAttribute("role");}break;
    case "tmode":S.tmode[el.dataset.t]=v;render();break;
    case "dtopic":S.dump={i:+v,text:"",checked:false,ticks:{}};render();break;
    case "dcheck":S.dump.checked=true;render();break;
    case "dreset":S.dump.checked=false;S.dump.ticks={};S.dump.text="";render();break;
    case "estart":{const pool=shuffle(BANK.filter(b=>S.ev.types[b.t]));const list=S.ev.n?pool.slice(0,S.ev.n):pool;
      list.sort((x,y)=>TYPES.findIndex(t=>t.k===x.t)-TYPES.findIndex(t=>t.k===y.t));startRun(list);break;}
    case "mcq":{const r=S.run,q=r.qs[r.i],i=+el.dataset.i;setRes(q.o[i].c?1:0,{pick:i,resp:q.o[i].t});break;}
    case "tf":{const r=S.run,q=r.qs[r.i],p=v==="true";setRes(p===q.a?1:0,{pick:p,resp:p?"True":"False"});break;}
    case "check":doCheck();break;
    case "override":{const r=S.run;r.res[r.i].score=TM[r.qs[r.i].t].m;render();break;}
    case "reveal":{const r=S.run;r.text[r.i]=$("#wtext").value;r.stage[r.i]=1;render();break;}
    case "wsave":{const r=S.run,q=r.qs[r.i],tk=r.ticks[r.i]||{};const got=q.pts.filter((_,i)=>tk[i]).length;setRes(Math.round(got/q.pts.length*TM[q.t].m*2)/2,{resp:r.text[r.i]||""});break;}
    case "next":{const r=S.run;if(r.i+1<r.qs.length){r.i++;render();window.scrollTo(0,0);}else{finishRun();render();window.scrollTo(0,0);}break;}
    case "retry":{const r=S.run;const list=r.qs.filter((q,i)=>(r.res[i]||{score:0}).score<TM[q.t].m);startRun(list);S.run.retry=true;break;}
    case "newtest":S.ev.view="setup";S.run=null;render();break;
    default:labClick(a,el,v);
  }
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.dataset.lsel){labSelect(el);return;}
  if(el.dataset.act==="etype"){S.ev.types[el.dataset.v]=el.checked?1:0;render();}
  else if(el.id==="en"){S.ev.n=+el.value;}
  else if(el.dataset.act==="ptick"){S.path.ticks[el.dataset.i]=el.checked;render();}
  else if(el.dataset.act==="dtick"){S.dump.ticks[el.dataset.i]=el.checked;render();}
  else if(el.dataset.act==="wtick"){const r=S.run;r.ticks[r.i]=r.ticks[r.i]||{};r.ticks[r.i][el.dataset.i]=el.checked;render();}
});
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.dataset&&el.dataset.cid){CS.src[el.dataset.cid]=el.value;return;}
  if(el.dataset&&el.dataset.iid){CS.inp[el.dataset.iid]=el.value;return;}
  if(el.dataset&&(el.dataset.lin||el.dataset.tcell!==undefined)){labInput(el);return;}
  if(el.id==="guess")S.cards.guess=el.value;
  else if(el.id==="pguess")S.path.guess=el.value;
  else if(el.id==="ptext")S.path.text=el.value;
  else if(el.id==="dtext")S.dump.text=el.value;
  else if(el.id==="ans"&&S.run)S.run.text[S.run.i]=el.value;
});
function doCheck(){
  const r=S.run,q=r.qs[r.i],v=($("#ans").value||"").trim();if(!v)return;
  r.text[r.i]=v;setRes((q.t==="calc"?matchCalc(v,q):matches(v,q.acc,q.all))?TM[q.t].m:0,{resp:v});
}
document.addEventListener("keydown",e=>{
  const t=e.target,tag=t.tagName;
  if(e.key==="Enter"&&t.id==="ans"){e.preventDefault();doCheck();return;}
  if(t.classList&&t.classList.contains("codearea")){
    if(e.key==="Tab"&&!e.shiftKey){e.preventDefault();const p=t.selectionStart;t.setRangeText("    ",p,t.selectionEnd,"end");CS.src[t.dataset.cid]=t.value;return;}
    if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)){e.preventDefault();const b=t.closest(".cw").parentElement.querySelector('[data-act="crun"],[data-act="fcheck"]');if(b)b.click();return;}
  }
  if(e.key==="Enter"&&t.id==="pguess2"){e.preventDefault();const b=document.querySelector('[data-act="pcheck2"]');if(b&&!b.disabled)b.click();return;}
  if((e.key==="Enter"||e.key===" ")&&t.classList&&t.classList.contains("hid")){e.preventDefault();t.click();return;}
  const inPath=S.tab==="learn"&&S.lv==="path"&&S.path.ph==="recall"&&S.path.q.length>0;
  const inCards=S.tab==="learn"&&S.lv==="cards"&&S.cards.queue.length>0;
  if(!(inPath||inCards)||tag==="INPUT"||tag==="TEXTAREA"||tag==="SELECT")return;
  const flipped=inPath?S.path.flip:S.cards.flip;
  if((e.key===" "||e.key==="Enter")&&tag!=="BUTTON"&&!flipped){e.preventDefault();if(inPath)S.path.flip=true;else S.cards.flip=true;render();}
  else if(flipped&&"123".includes(e.key)&&e.key){const m={"1":"miss","2":"almost","3":"got"};const b=document.querySelector('[data-act$="rate"][data-v="'+m[e.key]+'"]');if(b)b.click();}
});
render();
</script>

</body></html>
