textarea{min-height:9rem;resize:vertical}
.blank{font:inherit;display:inline-block;vertical-align:baseline;border:0;border-bottom:2px solid var(--accent);background:var(--mask);color:var(--fg);padding:0 .3em;border-radius:3px 3px 0 0;cursor:pointer;line-height:1.35}

.note p{font-size:1.04rem;line-height:2}

tr:last-child td{border-bottom:0}
td{min-width:9rem}
.m.hid{background:var(--mask);color:transparent;border-radius:4px;cursor:pointer;display:inline-block;user-select:none}
.m{display:inline}
.opt{display:block;width:100%;text-align:left;font:inherit;padding:12px 14px;border-radius:8px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer}
.opt.right{border-color:var(--accent);background:var(--accent-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opts{display:flex;flex-direction:column;gap:8px}
.fb{padding:12px 14px;border-radius:8px;font-size:.95rem}
.fb.ok{background:var(--accent-soft)}.fb.no{background:var(--bad-soft)}
.tag{font:500 .7rem var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:4px;background:var(--accent-soft);color:var(--fg)}
.pts{display:flex;flex-direction:column;gap:6px}
.pts label{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.pts input{margin-top:.3rem;accent-color:var(--accent)}
.score{font:700 3rem var(--display);font-variant-numeric:tabular-nums}
.tcount{display:flex;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:8px}
.tcount label{flex:1;display:flex;gap:10px;align-items:center;cursor:pointer;min-width:0}
.tcount input{accent-color:var(--accent);width:1.1rem;height:1.1rem}
.tcount span.n{font:.78rem var(--mono);color:var(--muted);white-space:nowrap}
.rev{border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:6px}
.rev.bad{border-left:4px solid var(--bad)}.rev.ok{border-left:4px solid var(--accent)}

/* ---- Code lab ---- */
:root{--code-bg:#fbfaf6;--code-fg:#1b2a22;--code-line:#d5ddd6;--ok-b:#0a6a4d;--ok-s:#dcefe6;--note-b:#9a4a08;--note-s:#f6e6d4}

:root[data-theme="dark"]{--code-bg:#0a100d;--code-fg:#d8efe3;--code-line:#26342c;--ok-b:#5fd7a8;--ok-s:#17382b;--note-b:#f0a15a;--note-s:#3a2a17}

.codearea{width:100%;resize:vertical;min-height:5rem}
.outpre{white-space:pre-wrap;border-left:4px solid var(--accent)}
.outbox{display:flex;flex-direction:column;gap:8px;min-width:0}
.dim{color:var(--muted)}
.cw-in{display:flex;flex-direction:column;gap:4px}
.cin,input.mono{font-family:var(--mono)}
.rs{padding:10px 14px;border-radius:8px;font-size:.93rem;border-left:4px solid var(--line);background:var(--bg)}
.rs.ok{border-color:var(--ok-b);background:var(--ok-s)}
.rs.bad{border-color:var(--bad);background:var(--bad-soft)}
.rs.note,.rs.warn{border-color:var(--note-b);background:var(--note-s)}
.try{border:1px dashed var(--accent);border-radius:8px;padding:8px 12px;font-size:.93rem}
.note-box{background:var(--accent-soft);border-radius:8px;padding:10px 14px;font-size:.93rem}
ol.pipe{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0}
ol.pipe li{position:relative;padding:8px 12px 8px 34px;border-left:2px solid var(--line);margin-left:10px;font-size:.93rem}
ol.pipe li::before{content:"";position:absolute;left:-8px;top:12px;width:14px;height:14px;border-radius:50%;background:var(--bg);border:2px solid var(--line)}
ol.pipe li.done::before{background:var(--accent);border-color:var(--accent)}
ol.pipe li.cur{background:var(--accent-soft)}ol.pipe li.cur::before{border-color:var(--accent);background:var(--surface)}
ol.pipe li.fail{background:var(--bad-soft)}ol.pipe li.fail::before{background:var(--bad);border-color:var(--bad)}
ol.pipe li.warn{background:var(--note-s)}ol.pipe li.warn::before{background:var(--note-b);border-color:var(--note-b)}

.bits{display:flex;flex-direction:column;gap:6px}
.brow{display:grid;grid-template-columns:5.5rem 1fr auto;gap:10px;align-items:center}
.brow.res{border-top:1px solid var(--line);padding-top:6px;font-weight:600}
.bl{font:.78rem var(--mono);color:var(--muted)}
.bv{display:flex;gap:2px;flex-wrap:wrap}
.bit{width:1.55rem;height:1.7rem;display:inline-flex;align-items:center;justify-content:center;font:500 .85rem var(--mono);border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--muted)}

.bd{font:.85rem var(--mono)}
.b-s{color:var(--bad)}.b-e{color:var(--note-b)}.b-m{color:var(--accent)}
td.mono{word-break:break-all;min-width:0}
ol.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
ol.steps li{display:flex;flex-direction:column;gap:2px;padding:8px 12px;border:1px solid var(--line);border-radius:8px}
.exp{font-family:var(--mono);font-size:.92rem}.exp.res{color:var(--accent);font-weight:600}
.exp mark{background:var(--accent-soft);color:var(--fg);border-radius:3px;padding:0 3px;outline:1.5px solid var(--accent)}
ul.rules{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
ul.rules li{padding:6px 10px;border-radius:6px;font-size:.92rem}
ul.rules li.ok{background:var(--ok-s)}ul.rules li.no{background:var(--bad-soft)}
input.tcell{width:100%;min-width:4rem;font:.9rem var(--mono);padding:6px 8px}

input.tcell.miss{border-color:var(--bad);background:var(--bad-soft)}
.nb .cw{margin-top:4px}
.nb ol.pipe{margin-top:4px}
@media (max-width:520px){.brow{grid-template-columns:1fr}.bit{width:1.3rem}}

const NOTES=[
["1.1 and 1.2 Entrepreneurship fundamentals and qualities","An {{entrepreneur}} spots an opportunity, takes calculated risks, organises resources and creates a venture that delivers value. An {{enterprise}} is the organised entity created to pursue the opportunity. A {{startup}} is a newly formed enterprise designed to grow fast with a {{scalable}} business model: it can serve many more customers without costs rising in proportion. A {{unicorn}} is a startup valued at over one billion US dollars; a valuation is not the same as a successful business. A tutor with 20 students is a small business; an app that serves any number of students for a fee is startup-style. The qualities are passion and motivation, risk tolerance, resilience and persistence, problem-solving orientation, self-discipline and initiative, and adaptability; all can be developed. Risk is calculated, not reckless: the {{expected value}} is the sum of each result multiplied by its probability. 30% of Rs 10 lakh and 70% of −Rs 1 lakh give {{Rs 2.3 lakh}}; 1% of Rs 10 lakh and 99% of −Rs 5 lakh give −Rs 4.85 lakh, a gamble. Fail small and early."],
["1.3 and 1.4 Innovation and design thinking","{{Creativity}} is producing new, original ideas; {{innovation}} is the practical use of creative ideas to create value. {{Incremental}} innovation improves an existing product (a faster phone); {{disruptive}} innovation (Clayton Christensen) introduces a simpler, cheaper product that starts with overlooked customers and later displaces leaders (mobile banking, streaming, UPI). Creativity techniques are {{brainstorming}} (defer judgement, aim for quantity), {{SCAMPER}} (Substitute, Combine, Adapt, Modify, Put to other uses, Eliminate, Rearrange), mind mapping and cross-domain thinking. {{Design thinking}} is human-centred and iterative (IDEO and the Stanford d.school): {{Empathize}}, {{Define}}, {{Ideate}}, {{Prototype}}, {{Test}}. A good 'How Might We' question names who, what they need and why, and is neither too broad nor a solution in disguise. Prototypes may be low fidelity (paper), medium (clickable wireframe) or high (working demo). Test with real users: ask them to show how they would do it."],
["1.5 and 1.6 Business ideas and business models","Ideas come from four approaches: {{problem-first}} thinking, {{trend}} analysis, {{gap}} analysis and {{skill and passion}} mapping. Evaluate with five criteria: significance of the problem, market size, differentiation, feasibility and profitability. A {{weighted scoring table}} multiplies each score (1 to 5) by its weight (the weights add up to 1): ideas A, B and C score {{3.8}}, 3.5 and 3.7; a score is a guide to discussion. A painkiller beats a vitamin. A {{business model}} describes how an organisation creates, delivers and captures value; the {{Business Model Canvas}} (Alexander Osterwalder) has nine blocks: Value Proposition, Customer Segments, Channels, Customer Relationships, Revenue Streams, Key Resources, Key Activities, Key Partnerships and Cost Structure. The value proposition is the central block. Digital revenue models are SaaS subscription, freemium, marketplace commission, advertising and licensing. At Rs 300 a month, 1000 subscribers give Rs 3 00 000; 8% of 10 000 free users give 800 payers and {{Rs 2 40 000}}."],
["1.7 and 1.8 Market research and customers","{{Market research}} gathers information about the market, customers, competitors, trends and regulation before launch. {{Primary}} research is new data collected directly (surveys, interviews, focus groups, observation); {{secondary}} research analyses existing data (reports, Census, studies); start with secondary. A leading question biases a survey. {{TAM}} is the total revenue if 100% of the market were captured, {{SAM}} the part you can reach and {{SOM}} the share you can realistically win: 2 00 000 students × Rs 6 000 = Rs 120 crore; 40% reachable = Rs 48 crore; 5% of that = {{Rs 2.4 crore}}. Plan with the SOM. Segments are demographic, psychographic, behavioural or needs-based; start with a narrow beachhead. A {{customer persona}} is a semi-fictional description built from research with four parts: demographic, psychographic, behavioural and pain points. {{Early adopters}} tolerate imperfection and give honest feedback; in Rogers' diffusion of innovations the groups are innovators 2.5%, early adopters 13.5%, early majority 34%, late majority 34% and laggards 16%. Moore's chasm lies between early adopters and the early majority. The person who pays may not be the user."],
["1.9 and 1.10 Branding and digital marketing","A {{brand}} is the perception stakeholders hold of an organisation; its benefits are differentiation, loyalty and trust; a logo is only a small part. {{Marketing}} communicates the value of products to attract, win and keep customers; the marketing mix is the {{4Ps}}: Product, Price, Place and Promotion (services add people, process and physical evidence for the 7Ps). Digital marketing offers targeting precision, measurability, interactivity and cost efficiency. The channels are {{SEO}} (organic, free), {{SEM/PPC}} (paid, per click), social media, content, e-mail and influencer marketing. Metrics: CTR = clicks ÷ impressions; conversion rate = sign-ups ÷ clicks; CAC = spend ÷ new customers; ROI = (revenue − spend) ÷ spend. In the campaign 200 000 impressions gave 4 000 clicks ({{2%}}), 200 sign-ups (5%) and 40 customers; Rs 10 000 spent gives CAC {{Rs 250}} and, at Rs 600 each, ROI {{140%}}. Never buy fake followers or write fake reviews."],
["1.11 Cost, profit, break-even and cash flow","{{Fixed costs}} stay constant whatever the sales (rent, salaries); {{variable costs}} change with volume (materials, shipping). Profit = revenue − total costs. {{Gross profit}} = revenue − cost of goods sold; {{net profit}} subtracts all expenses, interest and tax. The shop's gross profit is Rs 2 00 000 and net profit {{Rs 55 000}} (margin 11%). The {{break-even}} point is where revenue equals total cost: break-even units = fixed costs ÷ (price − variable cost per unit). With fixed Rs 20 000, price Rs 200 and variable Rs 120 the contribution is Rs 80 and break-even is {{250}} participants; at 400 the profit is Rs 12 000 and at 150 the loss is Rs 8 000. A {{budget}} is a forecast plan; a {{cash flow}} statement tracks actual cash. Profit is not cash: sales of Rs 1 00 000 paid in 60 days with Rs 90 000 of costs paid at once give a profit of Rs 10 000 but closing cash of −Rs 40 000."],
["Funding and investment","{{Investment}} is money put in for future returns. {{Equity}} funding gives investors a share of ownership and dilutes founders; {{debt}} is a loan repaid with interest. The sources are {{bootstrapping}}, friends and family, {{angel investors}}, {{venture capital}} (seed, Series A, B), bank loans and government schemes (Startup India, MUDRA, state schemes). If a startup valued at Rs 4 crore before investment receives Rs 1 crore from an angel, the post-money value is Rs 5 crore and the investor owns {{20%}}, the founders 80%. MUDRA loans are collateral-free in four bands: Shishu up to Rs 50 000, Kishor up to Rs 5 lakh, Tarun up to Rs 10 lakh and, since 2024, Tarun Plus up to Rs 20 lakh; lenders still check repayment capacity. DPIIT recognition under Startup India gives benefits under conditions. Debt must be repaid whether or not the business succeeds."],
["1.12 Intellectual property","{{Intellectual property}} is creations of the mind. {{Copyright}} protects the expression of an original work automatically from creation (software is a literary work under the Copyright Act, 1957) for the author's life plus {{60}} years; it does not protect ideas. A {{trademark}} identifies goods or services, is registered with the Controller General of Patents, Designs and Trade Marks and lasts {{10}} years, renewable. A {{patent}} gives an exclusive right to a novel, non-obvious, industrially applicable invention for {{20}} years from filing, in return for public disclosure; an algorithm as such is not patentable in India and a patent is territorial. A {{trade secret}} is confidential information protected by secrecy and NDAs, with no registration and no time limit while kept; it is lost if discovered independently or reverse-engineered. Source code is copyright, a name and logo are trademark, a novel technical process may be patented and a ranking method may be a trade secret. Open-source licences are permissions given by the copyright owner."],
["1.13 Ethics in business","{{Business ethics}} applies honesty, fairness, integrity, respect, responsibility and accountability to business decisions; it is also a strategic necessity (legal liability, reputation, trust). The four areas are honesty and transparency, {{customer protection}} (the Consumer Protection Act, 2019, which also covers e-commerce), {{corporate social responsibility}} and {{data ethics}} (informed consent, use only for the stated purpose, protection against breaches; the Digital Personal Data Protection Act, 2023). Under the Companies Act, 2013 a company must spend at least {{2%}} of the average net profit of the previous three years on CSR if it has net worth of Rs 500 crore or more, or turnover of Rs 1 000 crore or more, or net profit of Rs 5 crore or more: profits of 8, 10 and 12 crore give an average of 10 crore and {{Rs 20 lakh}}. The DPDP Rules, 2025 were notified on 13 November 2025; most business duties apply from 12 May 2027. False urgency such as 'Only 2 left!' on every product is dishonest and may be an unfair trade practice."],
["1.14 Careers and self-employment","{{Career planning}} sets goals that fit your interests, values and abilities: self-assessment, goal setting, skills development, portfolio building, networking and experience, reviewed every year. Paths for a computer science student include software development, data science and AI, cyber security, cloud and DevOps, databases and networks, management and design, business roles and entrepreneurship. Certifications include AWS, Google Cloud, CCNA, CompTIA Security+ and PMP. {{Freelancing}} gives control of time and varied clients but brings irregular income and no employer benefits; the gig economy uses platforms such as Upwork, Freelancer, Toptal, Fiverr, Truelancer and WorknHire. Price by value and billable hours: income Rs 60 000 plus costs Rs 10 000 over 100 billable hours is {{Rs 700}} an hour, not Rs 437. Keep records, pay income tax (advance tax if large) and register for {{GST}} above Rs 20 lakh turnover for services (Rs 10 lakh in special-category states; Rs 40 lakh for goods in most states). The Income-tax Act, 2025 applies from 1 April 2026."]
];

[2,"List the five criteria for evaluating an idea.","Significance of the problem, market size, competitive differentiation, feasibility, profitability potential."],

[2,"What scores did ideas A, B and C get?","3.8, 3.5 and 3.7."],
[2,"What is a painkiller against a vitamin?","A painkiller solves a real, urgent pain; a vitamin is nice to have and sells less easily."],

[2,"Name the nine blocks of the canvas.","Value Proposition, Customer Segments, Channels, Customer Relationships, Revenue Streams, Key Resources, Key Activities, Key Partnerships, Cost Structure."],
[2,"Which block is central and what is the layout?","The value proposition; right side: the customer; left side: what you must have and do; bottom: costs against revenue."],
[2,"Distinguish channels from customer relationships.","Channels: how you reach and deliver; relationships: the type of bond (self-service, personal, community)."],

[3,"Define market research.","Systematic gathering and analysis of information about a target market, customers, competitors, trends and regulation."],
[3,"Distinguish primary from secondary research.","Primary: new data collected directly (surveys, interviews, focus groups, observation); secondary: analysis of existing published data."],
[3,"Strengths and weaknesses of primary and secondary research?","Primary: specific but costs time and money; secondary: fast and cheap but may not answer your question or be out of date."],
[3,"Which research should come first?","Secondary, then primary to fill the gaps."],
[3,"What questions must market research answer?","Market size and growth, competitors, pain points, price customers will pay, channels customers use."],
[3,"What is a leading question?","One that pushes the answer, such as 'Wouldn't you love a fun, cheap app?'"],
[3,"Define TAM.","Total addressable market: the total revenue opportunity if the product captured 100% of the market."],
[3,"Define SAM and SOM.","SAM: the part of the TAM your product, price and channels can reach; SOM: the share of the SAM you can realistically win."],

[3,"Which figure should be used for planning?","The SOM, not the TAM."],

[3,"Name the bases of segmentation.","Demographic, psychographic, behavioural, needs-based."],
[3,"What is a beachhead segment?","The narrow first segment a venture starts with."],

function parseKV(s){const kv={};const re=/(\w+)=(\S+)/g;let m;while((m=re.exec(s)))kv[m[1]]=m[2];return kv;}
const num=(a,k,min)=>{const v=a[k];if(v===undefined||v===""||isNaN(+v))throw new Error("needs "+k+"= (a number).");return +v;};
const opt=(a,k)=>a[k]===undefined?null:(isNaN(+a[k])?(()=>{throw new Error(k+"= must be a number.");})():+a[k]);
const tr=x=>String(Math.round(x*100)/100);
function rs(v){const s=v<0?"-":"";v=Math.abs(v);if(v>=1e7)return s+"Rs "+tr(v/1e7)+" crore";if(v>=1e5)return s+"Rs "+tr(v/1e5)+" lakh";return s+"Rs "+tr(v);}
const SIMS={
ev(a,o){
  const p1=num(a,"p1"),v1=num(a,"v1"),p2=num(a,"p2"),v2=num(a,"v2");
  if(p1<0||p2<0||Math.abs(p1+p2-1)>1e-9)throw new Error("p1 and p2 are probabilities and must add up to 1.");
  const e=p1*v1+p2*v2;o.push("expected value: "+rs(e));o.push(e>0?"positive: a calculated risk":"not positive: a gamble");
},
score(a,o){
  const w=(a.w||"").split(",").map(Number),s=(a.a||"").split(",").map(Number);
  if(!w.length||w.length!==s.length||w.concat(s).some(isNaN))throw new Error("score needs w= and a= lists of equal length, for example w=0.5,0.3,0.2 a=4,3,5.");
  if(Math.abs(w.reduce((x,y)=>x+y,0)-1)>1e-9)throw new Error("the weights must add up to 1.");
  if(s.some(x=>x<1||x>5))throw new Error("each score must be from 1 to 5.");
  o.push("weighted score: "+tr(w.reduce((t,x,i)=>t+x*s[i],0)));
},
market(a,o){
  const n=num(a,"students"),p=num(a,"price"),r=num(a,"reach"),s=num(a,"share");
  if(r<0||r>100||s<0||s>100)throw new Error("reach and share are per cent from 0 to 100.");
  const tam=n*p,sam=tam*r/100,som=sam*s/100;
  o.push("TAM: "+rs(tam));o.push("SAM: "+rs(sam));o.push("SOM: "+rs(som)+" ("+Math.round(n*r/100*s/100)+" customers)");
},
funnel(a,o){
  const im=num(a,"impressions"),cl=num(a,"clicks");
  if(cl>im)throw new Error("clicks cannot exceed impressions.");
  o.push("CTR: "+tr(cl/im*100)+"%");
  const su=opt(a,"signups"),cu=opt(a,"customers"),sp=opt(a,"spend"),pay=opt(a,"pay");
  const top=su!==null?su:cu;
  if(top!==null){if(top>cl)throw new Error("sign-ups or customers cannot exceed clicks.");o.push("conversion: "+tr(top/cl*100)+"%");}
  if(cu!==null&&sp!==null){if(cu<=0)throw new Error("customers must be above 0 to find CAC.");o.push("CAC: Rs "+tr(sp/cu));
    if(pay!==null){o.push("ROI: "+tr((cu*pay-sp)/sp*100)+"%");}}
},
profit(a,o){
  const s=num(a,"sales"),c=num(a,"cogs"),e=num(a,"expenses"),i=opt(a,"interest")||0,t=opt(a,"tax")||0;
  if(s<=0)throw new Error("sales must be above 0.");
  const g=s-c,n=g-e-i-t;
  o.push("gross profit: "+rs(g));o.push("net profit: "+rs(n));o.push("net margin: "+tr(n/s*100)+"%");
},
breakeven(a,o){
  const f=num(a,"fixed"),p=num(a,"price"),v=num(a,"var"),u=opt(a,"units");
  if(p<=v)throw new Error("the price must be above the variable cost, or there is no contribution.");
  o.push("contribution per unit: Rs "+tr(p-v));o.push("break-even: "+tr(f/(p-v))+" units");
  if(u!==null){const pr=u*(p-v)-f;o.push(pr>=0?"profit at "+u+" units: Rs "+tr(pr):"loss at "+u+" units: Rs "+tr(-pr));}
},
cash(a,o){
  const op=num(a,"open"),s=num(a,"sales"),pd=num(a,"paid"),rc=opt(a,"received")||0;
  o.push("profit: Rs "+tr(s-pd));const c=op+rc-pd;o.push("closing cash: Rs "+tr(c));
  if(c<0)o.push("shortfall: the business is profitable only on paper");
},
equity(a,o){
  const pre=num(a,"pre"),inv=num(a,"invest");
  if(pre<=0||inv<=0)throw new Error("pre and invest must be above 0.");
  const post=pre+inv;o.push("post-money value: "+rs(post));o.push("investor owns: "+tr(inv/post*100)+"%");o.push("founders own: "+tr(pre/post*100)+"%");
},
csr(a,o){
  const p=(a.profits||"").split(",").map(Number);
  if(!p.length||p.some(isNaN))throw new Error("csr needs profits= with the net profits in crore, for example profits=8,10,12.");
  const nw=opt(a,"networth")||0,to=opt(a,"turnover")||0,last=p[p.length-1];
  const q=nw>=500||to>=1000||last>=5;
  o.push("legal CSR duty: "+(q?"yes":"no"));
  if(q){const avg=p.reduce((x,y)=>x+y,0)/p.length;o.push("average net profit: Rs "+tr(avg)+" crore");o.push("CSR amount: "+rs(avg*0.02*1e7));}
},
rate(a,o){
  const inc=num(a,"income"),co=num(a,"costs"),h=num(a,"hours");
  if(h<=0)throw new Error("hours must be above 0.");
  o.push("minimum rate: Rs "+Math.round((inc+co)/h)+" per hour");
}
};
function fnRun(src){
  const out=[];let errors=0,title="",detail="";
  const lines=String(src).replace(/\r/g,"").split("\n");let cmds=0;
  for(let i=0;i<lines.length;i++){
    const ln=lines[i].trim();if(!ln||ln[0]==="#")continue;
    const sp=ln.search(/\s/),c=sp<0?ln:ln.slice(0,sp),rest=sp<0?"":ln.slice(sp+1);cmds++;
    if(!SIMS[c]){errors++;title="Unknown command";detail="Line "+(i+1)+": '"+c+"' is not a command of this lab. Commands: "+Object.keys(SIMS).join(", ")+".";out.push("error: "+detail);continue;}
    try{SIMS[c](parseKV(rest),out);}catch(e){errors++;title="Cannot run";detail="Line "+(i+1)+": "+c+" "+e.message;out.push("error: "+detail);}
  }
  if(!cmds)return {ok:false,title:"Nothing to run",detail:"Type at least one command.",out:"",brief:"",errors:1,warns:0};
  return {ok:errors===0,title,detail,out:out.join("\n"),brief:out.join(" / "),errors,warns:0,cmds};
}

function labClick(a,el,v){
  switch(a){
    case "ltool":L.tool=v;render();return true;

    case "wreset":resetWidget(el.dataset.id);return true;
    case "ltog":L[el.dataset.key]=!L[el.dataset.key];render();return true;
    case "lset":L[el.dataset.key]=v;render();return true;
    case "pcheck2":{const q=CALC[L.pi];const g=document.getElementById("pguess2").value;L.pres[L.pi]=Object.assign(L.pres[L.pi]||{},{guess:g,checked:true,ok:matchCalc(g,q)});render();return true;}
    case "prun2":{const q=CALC[L.pi];const r=runCpp(q.src,"");L.pres[L.pi]=Object.assign(L.pres[L.pi]||{},{run:r});const g=document.getElementById("pguess2");if(g&&!(L.pres[L.pi].checked))L.pres[L.pi].guess=g.value;render();return true;}
    case "pprev2":if(L.pi>0)L.pi--;render();return true;
    case "pnext2":if(L.pi+1<CALC.length)L.pi++;render();return true;
    case "fcheck":{const f=FIX[L.fi];const id="fix"+L.fi;const ta=document.getElementById("code-"+id);const ii=document.getElementById("in-"+id);const src=ta?ta.value:f.src;CS.src[id]=src;const inp=ii?ii.value:(f.inp||"");CS.inp[id]=inp;const r=runCpp(src,inp);CS.out[id]=r;
      const got=(r.brief!==undefined?r.brief:(r.out||"")).replace(/\r/g,"").replace(/\s+$/,"");
      let msg,ok=false;
      if(!r.ok){msg=r.title+". "+r.detail;}
      else if(got===f.exp){ok=true;msg="The output matches the goal.";}
      else msg="It runs, but the output is different from the goal. Expected \""+f.exp.replace(/\n/g," / ")+"\" and got \""+got.replace(/\n/g," / ")+"\".";
      L.fres[L.fi]={ok:ok,msg:msg};render();return true;}
    case "fhint":L.fshow[L.fi]=Math.max(L.fshow[L.fi]||0,1);render();return true;
    case "fsol":L.fshow[L.fi]=2;render();return true;
    case "fprev":if(L.fi>0)L.fi--;render();return true;
    case "fnext":if(L.fi+1<FIX.length)L.fi++;render();return true;
    case "lsdim":L.sd.dim=+v;L.sd.s=0;L.sd.t=0;sdNew();render();return true;
    case "lsda":{const d=DIMS[L.sd.dim],it=d.it[L.sd.item];L.sd.t++;const ok=+v===it[1];if(ok)L.sd.s++;L.sd.right=ok;L.sd.fb=(ok?"Correct. ":"Not quite. ")+"\u201c"+it[0]+"\u201d: "+d.o[it[1]]+".";render();return true;}
    case "lsdn":sdNew();render();return true;
  }
  return false;
}

  }else if(q.t==="tf"){

    if(res)h+=`<div class="fb ${res.score?"ok":"no"}"><b>${res.score?"Correct.":"Not quite."}</b> ${esc(q.e)}</div>`;
  }else if(q.t==="fill"||q.t==="vsa"||q.t==="calc"){
    h+=`<input type="text" id="ans" autocomplete="off" placeholder="Type your answer" value="${esc(r.text[r.i]||"")}"${res?" disabled":""}>`;
    if(!res)h+='<div class="row"><button class="btn primary" data-act="check">Check</button></div>';
    else{
      h+=`<div class="fb ${res.score?"ok":"no"}"><b>${res.score?"Correct.":"Model answer:"}</b> ${res.score?"":esc(q.model)} ${q.e?esc(q.e):""}</div>`;
      if(!res.score)h+='<div class="row"><button class="btn" data-act="override">I was right, count it</button></div>';
    }
  }else{
    const st=r.stage[r.i]||0;
    h+=`<textarea id="wtext" placeholder="Write your answer as you would in the exam..."${st?" disabled":""}>${esc(r.text[r.i]||"")}</textarea>`;
    if(!st)h+='<div class="row"><button class="btn primary" data-act="reveal">Show model answer</button></div>';
    else{
      const tk=r.ticks[r.i]||{};const got=q.pts.filter((_,i)=>tk[i]).length;
      h+=`<div class="lab">Model answer</div><div class="a" style="border-left:3px solid var(--accent);padding-left:14px">${esc(q.model)}</div><div class="lab">Tick every marking point your answer made</div><div class="pts">`+q.pts.map((p,i)=>`<label><input type="checkbox" data-act="wtick" data-i="${i}"${tk[i]?" checked":""}${res?" disabled":""}><span>${esc(p)}</span></label>`).join("")+"</div>";
      if(!res)h+=`<div class="row"><button class="btn primary" data-act="wsave">Save score (${fmt(got/q.pts.length*T.m)} of ${T.m})</button></div>`;
      else h+=`<div class="fb ${res.score>=T.m?"ok":"no"}">Scored ${fmt(res.score)} of ${T.m}.</div>`;
    }
  }
  if(res){h+=`<div class="row"><button class="btn primary" data-act="next">${r.i+1<r.qs.length?"Next question":"See results"}</button></div>`;}
  return h+"</div>";
}
function fmt(x){return (Math.round(x*2)/2).toString();}
function setRes(score,extra){const r=S.run,q=r.qs[r.i];r.res[r.i]=Object.assign({score:score,max:TM[q.t].m},extra||{});render();}
function evalResult(){
  const r=S.run;let sc=0,mx=0;const by={};
  r.qs.forEach((q,i)=>{const x=r.res[i]||{score:0,max:TM[q.t].m};sc+=x.score;mx+=x.max;const b=by[q.t]||(by[q.t]={s:0,m:0,n:0});b.s+=x.score;b.m+=x.max;b.n++;});
  const pct=Math.round(sc/mx*100);
  const msg=pct>=85?"Exam ready on this material.":pct>=65?"Solid. Revisit the misses below.":pct>=40?"Getting there. Use the Learn section on the weak topics.":"Go back to the recall cards, then try again.";
  let h=`<div class="panel"><div class="lab">Result</div><div class="score">${fmt(sc)} / ${mx} <span style="font-size:1.5rem;color:var(--muted)">${pct}%</span></div><p>${msg}</p><div style="display:flex;flex-direction:column;gap:10px">`;
  TYPES.forEach(t=>{const b=by[t.k];if(!b)return;const p=Math.round(b.s/b.m*100);h+=`<div><div class="row" style="justify-content:space-between"><span>${esc(t.n)} (${b.n})</span><b>${fmt(b.s)}/${b.m}</b></div><div class="bar"><i style="width:${p}%"></i></div></div>`;});
  const missed=r.qs.filter((q,i)=>(r.res[i]||{score:0}).score<TM[q.t].m).length;
  h+=`</div><div class="row">${missed?`<button class="btn primary" data-act="retry">Retry the ${missed} missed</button>`:""}<button class="btn" data-act="newtest">New test</button></div></div>`;
  h+="<h2>Review</h2>";
  r.qs.forEach((q,i)=>{const x=r.res[i]||{score:0,max:TM[q.t].m};const ok=x.score>=x.max;
    let ans=q.t==="mcq"?q.opts[q.a]:q.t==="tf"?(q.a?"True":"False"):q.model;
    h+=`<div class="rev ${ok?"ok":"bad"}"><div class="lab">${esc(TM[q.t].n)} · ${fmt(x.score)}/${x.max}</div><b>${esc(q.q)}</b>${x.resp?`<div class="r">You: ${esc(x.resp)}</div>`:""}<div class="r">${ok?"":"Answer: "}${esc(ans)}</div></div>`;});
  return '<div style="display:flex;flex-direction:column;gap:14px">'+h+"</div>";
}
function finishRun(){
  const r=S.run;let sc=0,mx=0;r.qs.forEach((q,i)=>{const x=r.res[i]||{score:0,max:TM[q.t].m};sc+=x.score;mx+=x.max;});
  if(!r.retry){store.hist.unshift({d:new Date().toLocaleDateString(undefined,{day:"numeric",month:"short"}),pct:Math.round(sc/mx*100),n:r.qs.length});store.hist=store.hist.slice(0,8);save();}
  S.ev.view="result";
}

/* ============ EVENTS ============ */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");if(!el)return;
  const a=el.dataset.act,v=el.dataset.v;
  switch(a){
    case "tab":S.tab=v;render();break;
    case "lv":S.lv=v;render();break;
    case "csec":S.cards.sec=+v;buildQueue();render();break;
    case "flip":S.cards.flip=true;render();break;
    case "cnext":buildQueue();render();break;
    case "creset":CARDS.forEach((k,i)=>{if(S.cards.sec<0||k[0]===S.cards.sec)delete store.box[i];});save();buildQueue();render();break;
    case "rate":{const q=S.cards.queue,id=q.shift();let b=store.box[id]||0;
      if(v==="miss"){b=1;q.splice(Math.min(3,q.length),0,id);}
      else if(v==="almost"){b=Math.max(b,1);q.push(id);}
      else{b=b<2?2:3;S.cards.done++;}
      store.box[id]=b;save();S.cards.flip=false;S.cards.guess="";render();break;}
    case "cord":S.cards.ordered=v==="1";buildQueue();render();break;
    case "pstep":openStep(+v);break;
    case "pback":S.path.step=null;render();window.scrollTo(0,0);break;
    case "pnotes":S.path.ph="primer";render();window.scrollTo(0,0);break;
    case "pstart":S.path.ph="learn";S.path.i=0;render();break;
    case "plback":if(S.path.i>0)S.path.i--;render();break;
    case "plnext":{const P=S.path,ids=stepChunks(STEPS[P.step])[P.ch];
      if(P.i+1<ids.length)P.i++;else{P.ph="recall";P.q=shuffle(ids.slice());P.flip=false;P.guess="";}
      render();break;}
    case "pflip":S.path.flip=true;render();break;
    case "prate":{const P=S.path;applyRate(P.q,v);P.flip=false;P.guess="";
      if(!P.q.length){store.path.ch[P.step]=P.ch+1;save();P.ph="roundend";}
      render();break;}
    case "pnext":{const P=S.path,N=stepChunks(STEPS[P.step]).length;
      if(P.ch+1<N){P.ch++;P.ph="learn";P.i=0;}else P.ph="gaps";
      render();window.scrollTo(0,0);break;}
    case "pdump":S.path.ph="dump";render();window.scrollTo(0,0);break;
    case "pcheck":{const t=$("#ptext");if(t)S.path.text=t.value;S.path.dchecked=true;render();break;}
    case "pfinish":store.path.done[S.path.step]=true;save();S.path.ph="done";render();window.scrollTo(0,0);break;
    case "pnextstep":openStep(S.path.step+1);break;
    case "blank":el.classList.toggle("on");break;
    case "revall":document.querySelectorAll(".blank").forEach(b=>b.classList.add("on"));break;
    case "hideall":document.querySelectorAll(".blank").forEach(b=>b.classList.remove("on"));break;
    case "mask":if(el.classList.contains("hid")){el.classList.remove("hid");el.removeAttribute("role");}break;
    case "tmode":S.tmode[el.dataset.t]=v;render();break;
    case "dtopic":S.dump={i:+v,text:"",checked:false,ticks:{}};render();break;
    case "dcheck":S.dump.checked=true;render();break;
    case "dreset":S.dump.checked=false;S.dump.ticks={};S.dump.text="";render();break;
    case "estart":{const pool=shuffle(BANK.filter(b=>S.ev.types[b.t]));const list=S.ev.n?pool.slice(0,S.ev.n):pool;
      list.sort((x,y)=>TYPES.findIndex(t=>t.k===x.t)-TYPES.findIndex(t=>t.k===y.t));startRun(list);break;}
    case "mcq":{const r=S.run,q=r.qs[r.i],i=+el.dataset.i;setRes(q.o[i].c?1:0,{pick:i,resp:q.o[i].t});break;}
    case "tf":{const r=S.run,q=r.qs[r.i],p=v==="true";setRes(p===q.a?1:0,{pick:p,resp:p?"True":"False"});break;}
    case "check":doCheck();break;
    case "override":{const r=S.run;r.res[r.i].score=TM[r.qs[r.i].t].m;render();break;}
    case "reveal":{const r=S.run;r.text[r.i]=$("#wtext").value;r.stage[r.i]=1;render();break;}
    case "wsave":{const r=S.run,q=r.qs[r.i],tk=r.ticks[r.i]||{};const got=q.pts.filter((_,i)=>tk[i]).length;setRes(Math.round(got/q.pts.length*TM[q.t].m*2)/2,{resp:r.text[r.i]||""});break;}
    case "next":{const r=S.run;if(r.i+1<r.qs.length){r.i++;render();window.scrollTo(0,0);}else{finishRun();render();window.scrollTo(0,0);}break;}
    case "retry":{const r=S.run;const list=r.qs.filter((q,i)=>(r.res[i]||{score:0}).score<TM[q.t].m);startRun(list);S.run.retry=true;break;}
    case "newtest":S.ev.view="setup";S.run=null;render();break;
    default:labClick(a,el,v);
  }
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.dataset.lsel){labSelect(el);return;}
  if(el.dataset.act==="etype"){S.ev.types[el.dataset.v]=el.checked?1:0;render();}
  else if(el.id==="en"){S.ev.n=+el.value;}
  else if(el.dataset.act==="ptick"){S.path.ticks[el.dataset.i]=el.checked;render();}
  else if(el.dataset.act==="dtick"){S.dump.ticks[el.dataset.i]=el.checked;render();}
  else if(el.dataset.act==="wtick"){const r=S.run;r.ticks[r.i]=r.ticks[r.i]||{};r.ticks[r.i][el.dataset.i]=el.checked;render();}
});
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.dataset&&el.dataset.cid){CS.src[el.dataset.cid]=el.value;return;}
  if(el.dataset&&el.dataset.iid){CS.inp[el.dataset.iid]=el.value;return;}
  if(el.dataset&&(el.dataset.lin||el.dataset.tcell!==undefined)){labInput(el);return;}
  if(el.id==="guess")S.cards.guess=el.value;
  else if(el.id==="pguess")S.path.guess=el.value;
  else if(el.id==="ptext")S.path.text=el.value;
  else if(el.id==="dtext")S.dump.text=el.value;
  else if(el.id==="ans"&&S.run)S.run.text[S.run.i]=el.value;
});
function doCheck(){
  const r=S.run,q=r.qs[r.i],v=($("#ans").value||"").trim();if(!v)return;
  r.text[r.i]=v;setRes((q.t==="calc"?matchCalc(v,q):matches(v,q.acc,q.all))?TM[q.t].m:0,{resp:v});
}
document.addEventListener("keydown",e=>{
  const t=e.target,tag=t.tagName;
  if(e.key==="Enter"&&t.id==="ans"){e.preventDefault();doCheck();return;}
  if(t.classList&&t.classList.contains("codearea")){
    if(e.key==="Tab"&&!e.shiftKey){e.preventDefault();const p=t.selectionStart;t.setRangeText("    ",p,t.selectionEnd,"end");CS.src[t.dataset.cid]=t.value;return;}
    if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)){e.preventDefault();const b=t.closest(".cw").parentElement.querySelector('[data-act="crun"],[data-act="fcheck"]');if(b)b.click();return;}
  }
  if(e.key==="Enter"&&t.id==="pguess2"){e.preventDefault();const b=document.querySelector('[data-act="pcheck2"]');if(b&&!b.disabled)b.click();return;}
  if((e.key==="Enter"||e.key===" ")&&t.classList&&t.classList.contains("hid")){e.preventDefault();t.click();return;}
  const inPath=S.tab==="learn"&&S.lv==="path"&&S.path.ph==="recall"&&S.path.q.length>0;
  const inCards=S.tab==="learn"&&S.lv==="cards"&&S.cards.queue.length>0;
  if(!(inPath||inCards)||tag==="INPUT"||tag==="TEXTAREA"||tag==="SELECT")return;
  const flipped=inPath?S.path.flip:S.cards.flip;
  if((e.key===" "||e.key==="Enter")&&tag!=="BUTTON"&&!flipped){e.preventDefault();if(inPath)S.path.flip=true;else S.cards.flip=true;render();}
  else if(flipped&&"123".includes(e.key)&&e.key){const m={"1":"miss","2":"almost","3":"got"};const b=document.querySelector('[data-act$="rate"][data-v="'+m[e.key]+'"]');if(b)b.click();}
});
render();
</script>

</body></html>
