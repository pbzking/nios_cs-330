const NOTES=[
["1.1 Function basics","A {{function}} is a named, self-contained block of statements that performs one task. Its benefits are {{decomposition}}, {{reusability}}, {{readability}}, easier {{testing}} and {{collaboration}}. A function behaves as a {{black box}}: the caller needs to know what it does, not how. A definition has a {{return type}}, a {{name}}, a {{parameter list}} and a {{body}}. A {{declaration}} (prototype) gives the compiler the signature and ends with a {{semicolon}}; a {{definition}} supplies the body and is written {{once}}. A function must be declared or defined {{before}} it is called. A {{parameter}} is in the function header; an {{argument}} is the value in the call. A non-void function that reaches its end without {{return}} gives {{undefined}} behaviour."],
["1.2 Parameter passing","In call by {{value}} the function receives a {{copy}}, so changes do not affect the caller. In call by {{reference}}, written with {{&}} in the parameter, the parameter is an {{alias}} of the caller's variable, so changes {{do}} affect it. The argument for a reference parameter must be a {{variable}}. References let a function {{swap}} two values and return {{more than one}} value, for example divide(17, 5, q, r) giving quotient {{3}} and remainder {{2}}. A {{const}} reference such as const string& avoids {{copying}} and prevents modification. Avoid naming a function swap, max, min or abs, which clash with {{library}} names."],
["1.3 Types of functions","{{Built-in}} (library) functions come from standard headers such as <cmath>; {{user-defined}} functions are written by the programmer. A {{void}} function performs an action and returns {{nothing}}; a {{value-returning}} function sends one value back with {{return}}, and its call can be used inside an {{expression}}."],
["1.4 Default arguments, overloading and inline","A {{default argument}} is used when the caller omits that argument. Defaults are given from {{right to left}}, and are specified {{once}}, in the prototype or the definition. For calculateInterest(10000, 8.0, 3) the result is {{2400}}. {{Overloading}} means several functions with the same name but different {{parameter lists}}; a difference in {{return type}} alone is not enough. A call that fits two overloads equally well is {{ambiguous}}, as add(5, 3.5). The compiler gives each overload a unique internal name, called name {{mangling}}. An {{inline}} function is a request that the compiler replace the call by the function's {{body}}, avoiding call overhead; it suits {{small}} functions."],
["1.5 Recursion","{{Recursion}} is a function calling {{itself}}. Every recursive function needs a {{base case}}, which stops the calls, and a {{recursive case}}, which moves toward it. factorial(5) is {{120}}. Each call has its own {{stack frame}} on the call {{stack}}; a recursion without a reachable base case ends in a {{stack overflow}}. Naive fibonacci(4) makes {{9}} calls and the count grows {{exponentially}}. Recursion is {{slower}} and uses more {{memory}} than iteration, but is natural for self-similar problems. gcdOf(48, 18) is {{6}}."],
["1.6 Scope and storage classes","{{Scope}} is the region where a name is visible. A {{local}} variable exists only inside its function or block; a {{global}} variable is declared outside every function and is {{zero}}-initialised. A local that has the same name as a global {{shadows}} it; the global is reached with the {{scope resolution}} operator {{::}}. {{auto}} deduces the type in C++11; {{register}} is deprecated in C++11 and removed in C++17. A {{static}} local keeps its value between calls and is initialised {{once}}. A static global is visible only in its own {{file}}. {{extern}} declares a variable defined in another file and allocates no {{memory}}."],
["1.7 Library functions: cmath and cctype","<{{cmath}}> provides sqrt, pow, fabs, floor, ceil, round and the trigonometric and logarithmic functions. sqrt(144) is {{12}}, pow(2, 3) is {{8}}, floor(3.7) is {{3}}, ceil(3.2) is {{4}}. <{{cctype}}> provides isalpha, isdigit, isalnum, isspace, isupper, islower, toupper and tolower. toupper returns an {{int}}, so it is cast with (char) before printing as a character."],
["1.8 Library functions: cstring and cstdlib","<{{cstring}}> provides strlen, strcpy, strcat and strcmp for character arrays. strlen excludes the {{null}} terminator. Copying or joining into a destination that is too small causes a {{buffer overflow}}. strcmp returns {{0}} when the strings are equal; never compare C strings with {{==}}. <{{cstdlib}}> provides rand, srand, atoi, atof and exit. rand() is {{pseudo-random}}: it repeats the same sequence unless seeded with {{srand(time(0))}}. A dice roll is rand() % 6 + {{1}}."]
];

["Distinguish call by value from call by reference.","In call by value the function receives a copy of the argument, so changes to the parameter do not affect the caller's variable. In call by reference the parameter is declared with & and is an alias of the caller's variable, so changes do affect it; the argument must be a variable. For void f(int a, int &b) called as f(x, y), only y can be changed.",["Value: a copy, caller unchanged","Reference: an alias, caller changed","Argument must be a variable for a reference"]],
["Distinguish a function declaration from a function definition.","A declaration (prototype) states the name, return type and parameter types, has no body and ends with a semicolon; it may appear many times. A definition supplies the body in braces and appears once. A function must be declared or defined before it is called.",["Declaration: no body, semicolon","Definition: has the body, once","Declare before use"]],
["State the rules for default arguments.","Defaults are given from right to left, so every parameter after one with a default must also have a default. A default is specified once, in the prototype or in the definition, not both. Omitted arguments are always the rightmost ones. int area(int l, int b = 5, int h) is therefore an error.",["Right to left","Specified once","Omit rightmost arguments only"]],
["What is function overloading? Why is the return type not enough?","Overloading defines several functions with the same name but different parameter lists (number or types). The compiler chooses by matching the arguments in the call. The return type is not part of the choice because a call does not show what type of result is wanted, so overloads differing only in return type are a compile-time error.",["Same name, different parameters","Chosen by the arguments","Return type alone is an error"]],
["What are the base case and the recursive case? Illustrate with factorial.","The base case is the simplest input, answered directly without a further call; it stops the recursion. The recursive case reduces the problem and calls the function again. For factorial, factorial(0) = 1 is the base case and factorial(n) = n x factorial(n - 1) is the recursive case.",["Base case stops recursion","Recursive case moves toward it","factorial example"]],
["Compare recursion with iteration.","Recursion repeats by a function calling itself and ends at a base case; iteration repeats with a loop that ends when its condition is false. Recursion uses a stack frame for each call, so it needs more memory and is slower, and can overflow the stack; iteration uses constant memory. Recursion is clearer for self-similar problems.",["Self-call versus loop","Recursion: more memory, slower","Recursion clearer for self-similar problems"]],
["Distinguish local and global variables.","A local variable is declared inside a function or block, exists only while that block runs and is uninitialised unless set. A global variable is declared outside every function, lives for the whole program and is initialised to zero. A local with the same name shadows the global; ::name reaches the global.",["Local: block scope","Global: whole file, zero","Shadowing and ::"]],
["Explain the static storage class for local and global variables.","A static local variable is created once, initialised once and keeps its value between calls, though it is visible only inside its function. A static global variable is visible only within its own file (internal linkage), which prevents name clashes between files.",["Static local keeps value","Initialised once","Static global: file only"]]

["Explain the structure of a function in C++: declaration, definition and call. Use a suitable program.","A function definition has a return type, a name, a parameter list and a body. For example int add(int a, int b) { return a + b; }. A declaration (prototype), int add(int, int);, tells the compiler the name, return type and parameter types, has no body and ends with a semicolon; it lets main() appear before the definition. A call such as int s = add(5, 3); supplies arguments, which are copied into the parameters a and b; the function runs and return sends 8 back to the caller. A function must be declared or defined before it is called; a prototype without a definition is a linker error. The parameters are in the header and the arguments are in the call.",["Definition parts","Prototype with semicolon","Call, arguments and return","Declare before use","Parameter versus argument"]],
["Explain parameter passing in C++ with call by value and call by reference. Write a swap function.","In call by value the parameter is a copy, so the caller's variable cannot change. In call by reference the parameter is declared with & and is an alias of the caller's variable. A swap needs references: void swapValues(int &a, int &b) { int t = a; a = b; b = t; }. Called as swapValues(x, y) with x = 10 and y = 20 it leaves x = 20 and y = 10. With by-value parameters the swap would change only the copies. References also let a function return several results, for example divide(17, 5, q, r) giving q = 3 and r = 2, and const string& avoids copying a large argument. The argument for a reference parameter must be a variable.",["Value: copy","Reference: alias with &","swapValues code","Several results via references","const reference"]],
["Explain default arguments and function overloading with examples. Mention ambiguity.","A default argument is used when the call omits it: double calculateInterest(double p, double r, int t = 1). The call calculateInterest(10000, 8.0, 3) gives 2400, while calculateInterest(10000, 8.0) gives 800. Defaults go from right to left and are specified once. Overloading gives several functions the same name with different parameter lists: int add(int, int), double add(double, double) and int add(int, int, int). The compiler selects by the arguments, so add(2.5, 1.5) calls the double version. The return type alone cannot distinguish overloads. A call such as add(5, 3.5) is ambiguous because both two-argument versions need a conversion, so it is a compile-time error. Each overload gets a unique internal name (name mangling, _Z3addii).",["Default example and rules","Overloading example","Return type not enough","Ambiguous call","Name mangling"]],
["Explain recursion. Write recursive functions for factorial and gcd, and trace factorial(3).","Recursion is a function calling itself. It needs a base case and a recursive case. int factorial(int n) { if (n == 0) return 1; return n * factorial(n - 1); } and int gcdOf(int a, int b) { if (b == 0) return a; return gcdOf(b, a % b); }. Tracing factorial(3): factorial(3) calls factorial(2), which calls factorial(1), which calls factorial(0); this returns 1, then factorial(1) returns 1, factorial(2) returns 2 and factorial(3) returns 6. Each call has its own stack frame; without a reachable base case the stack overflows. gcdOf(48, 18) gives 6. Recursion is slower and uses more memory than iteration, and the naive fibonacci(4) makes 9 calls, growing exponentially.",["Base and recursive case","Factorial code","gcd code","Trace down and back","Stack frames and overflow"]],
["Explain scope and the storage classes auto, register, static and extern with examples.","Scope is the region where a name is visible. A local variable lives inside its block; a global is declared outside all functions and is zero-initialised. A local may shadow a global; ::count reaches the global. auto deduces the type from the initialiser in C++11. register asked for a CPU register and was deprecated in C++11 and removed in C++17. A static local, as in static int calls = 0; calls++;, keeps its value between calls and is initialised once, so three calls print 1, 2 and 3. A static global is visible only in its own file. extern declares a variable defined in another file and allocates no memory; the definition must appear exactly once.",["Local and global scope","Shadowing and ::","auto and register","Static local with example","Static global and extern"]]

const RECS={fact:{n:"factorial(n)",max:10,code:"int factorial(int n)\n{\n    if (n == 0)\n        return 1;\n    return n * factorial(n - 1);\n}"},
 fib:{n:"fibonacci(n)",max:7,code:"int fibonacci(int n)\n{\n    if (n <= 1)\n        return n;\n    return fibonacci(n - 1) + fibonacci(n - 2);\n}"},
 sum:{n:"sum(n)",max:12,code:"int sum(int n)\n{\n    if (n == 0)\n        return 0;\n    return n + sum(n - 1);\n}"},
 gcd:{n:"gcdOf(a, b)",max:0,code:"int gcdOf(int a, int b)\n{\n    if (b == 0)\n        return a;\n    return gcdOf(b, a % b);\n}"}};
function recSim(){
  const k=L.cf,ev=[];let calls=0,maxd=0;
  let args=L.cn.split(/[ ,]+/).filter(Boolean).map(Number);
  if(args.some(x=>!Number.isInteger(x)||x<0))return {err:"Enter whole numbers that are not negative."};
  const lim=RECS[k].max;
  if(k==="gcd"){if(args.length!==2)return {err:"Enter two numbers, such as 48, 18."};if(args.some(x=>x>10000))return {err:"Use numbers up to 10000."};}
  else{if(args.length!==1)return {err:"Enter one number."};if(args[0]>lim)return {err:"Use n up to "+lim+" so the trace stays readable."};}
  function go(a,d){
    calls++;maxd=Math.max(maxd,d);
    const nm=k==="fact"?"factorial":k==="fib"?"fibonacci":k==="sum"?"sum":"gcdOf";
    const label=nm+"("+a.join(", ")+")";
    ev.push([d,"call",label,""]);
    let v;
    if(k==="fact")v=a[0]===0?1:a[0]*go([a[0]-1],d+1);
    else if(k==="fib")v=a[0]<=1?a[0]:go([a[0]-1],d+1)+go([a[0]-2],d+1);
    else if(k==="sum")v=a[0]===0?0:a[0]+go([a[0]-1],d+1);
    else v=a[1]===0?a[0]:go([a[1],a[0]%a[1]],d+1);
    ev.push([d,"return",label,v]);return v;
  }
  const res=go(args,0);return {ev:ev,calls:calls,maxd:maxd+1,res:res};
}

const OVLS=[["int",["int"]],["double",["double"]],["int",["int","int"]],["double",["double","double"]],["int",["int","int","int"]]];
const OVT=["none","int","double","char","long long","bool"];
function ovCost(p,a){if(p===a)return 0;if((a==="char"||a==="bool")&&p==="int")return 0.5;if(a==="int"&&p==="long long")return 0.5;return 1;}
function ovSim(){
  const args=L.ov.filter(x=>x!=="none");
  const rows=[];let best=[],bc=Infinity;
  OVLS.forEach(o=>{
    const sig=o[1];
    if(sig.length!==args.length){rows.push([o[0]+" f("+sig.join(", ")+")","-","Not viable: needs "+sig.length+" argument"+(sig.length===1?"":"s")]);return;}
    let tot=0;args.forEach((a,i)=>tot+=ovCost(sig[i],a));
    rows.push([o[0]+" f("+sig.join(", ")+")",String(tot),tot===0?"Exact match":args.some((a,i)=>ovCost(sig[i],a)===0.5)&&tot<1?"Promotion":"Conversion needed"]);
    if(tot<bc){bc=tot;best=[o];}else if(tot===bc)best.push(o);
  });
  return {rows:rows,best:best,args:args};
}

}

function scCode(){
  const k=L.sk;
  if(k==="local")return "void count()\n{\n    int c = 0;\n    c++;\n    cout << c << \" \";\n}";
  if(k==="static")return "void count()\n{\n    static int c = 0;\n    c++;\n    cout << c << \" \";\n}";
  return "int c = 0;          // global\nvoid count()\n{\n    c++;\n    cout << c << \" \";\n}";
}
function scRes(){
  const rows=scRows();
  const note=L.sk==="local"?"A local variable is created on each call and destroyed on return, so every call prints 1.":L.sk==="static"?"A static local is initialised once and persists, but only the function can use it.":"A global persists as well, but every function can change it, which makes bugs harder to find.";
  return '<pre class="codeview">'+esc(scCode())+"</pre>"+tbl(["Call","c at the start","Printed","Lifetime of c"],rows)+'<div class="rs ok"><b>Output: '+esc(rows.map(r=>r[2]).join(" "))+".</b> "+esc(note)+"</div>";
}
function labSc(){
  return '<div class="panel"><h3>Storage tracer</h3><p class="hint">Choose how the counter c is declared and the number of calls.</p>'+chips("sk",[["local","Ordinary local"],["static","Static local"],["global","Global"]])+'<div class="row"><div><label class="lab" for="sn">Number of calls</label><input type="text" id="sn" data-lin="sc" class="mono" value="'+esc(L.sn)+'" style="max-width:5rem"></div></div><div id="sres">'+scRes()+"</div></div>";
}

function libRun(){
  const e=L.lib.trim();
  if(!e)return {ok:false,cls:"note",title:"Type an expression",detail:"For example sqrt(144) or (char)toupper('a')."};
  const src="#include <iostream>\n#include <cmath>\n#include <cctype>\n#include <cstring>\n#include <cstdlib>\nusing namespace std;\nint main()\n{\n    cout << ("+e+");\n    return 0;\n}";
  return runCpp(src,"");
}
function libRes(){
  const r=libRun();
  if(!r.ok)return '<div class="rs '+(r.cls||"bad")+'"><b>'+esc(r.title)+".</b> "+esc(r.detail||"")+"</div>";
  return '<div class="rs ok"><b>cout << ('+esc(L.lib.trim())+") prints:</b> <code>"+esc(r.out)+"</code></div>";
}

/* ---------- Sorting drill ---------- */
const DIMS=[
{n:"Value or reference?",o:["Call by value","Call by reference"],it:[["void f(int x)",0],["void f(int &x)",1],["The function can change the caller's variable",1],["The function works on a copy",0],["The argument must be a variable",1],["Used to swap two numbers",1],["Constants can be passed",0]]},
{n:"Parameter or argument?",o:["Parameter","Argument"],it:[["The variable a in int add(int a, int b)",0],["The value 5 in add(5, 3)",1],["Appears in the function header",0],["Appears in the function call",1],["Receives a value",0],["Supplies a value",1]]},
{n:"Which header?",o:["cmath","cctype","cstring","cstdlib"],it:[["sqrt",0],["toupper",1],["strlen",2],["rand",3],["isdigit",1],["strcmp",2],["pow",0],["srand",3],["floor",0],["atoi",3],["strcat",2],["isalpha",1]]},
{n:"Which storage class?",o:["auto","register","static","extern"],it:[["Keeps its value between calls",2],["Type is deduced from the initialiser",0],["Deprecated in C++11 and removed in C++17",1],["Declares a variable defined in another file",3],["Initialised only once",2],["Allocates no memory",3],["Request to use a CPU register",1]]},
{n:"Recursion: which part?",o:["Base case","Recursive case"],it:[["if (n == 0) return 1;",0],["return n * factorial(n - 1);",1],["Stops the calls",0],["Moves toward the base case",1],["Missing in a stack overflow",0],["return gcdOf(b, a % b);",1]]},
{n:"Local or global?",o:["Local","Global"],it:[["Declared outside every function",1],["Destroyed when the function returns",0],["Initialised to zero by default",1],["Contains garbage if uninitialised",0],["Can be shadowed",1],["Reached with ::",1]]}
];
function sdNew(){const d=DIMS[L.sd.dim];let i;do{i=Math.floor(Math.random()*d.it.length);}while(d.it.length>1&&i===L.sd.item);L.sd.item=i;L.sd.fb="";L.sd.right=null;}
sdNew();
function labSort(){
  const s=L.sd,d=DIMS[s.dim],it=d.it[s.item];
  let h='<div class="panel"><h3>Sorting drill</h3><div class="subnav">'+DIMS.map((x,i)=>'<button class="chip" data-act="lsdim" data-v="'+i+'" aria-pressed="'+(s.dim===i)+'">'+x.n+"</button>").join("")+"</div>";
  h+='<p class="hint">Score: '+s.s+" / "+s.t+'.</p><p><b>Classify: '+esc(it[0])+'</b></p><div class="row">'+d.o.map((o,i)=>'<button class="btn" data-act="lsda" data-v="'+i+'"'+(s.right!==null?" disabled":"")+">"+esc(o)+"</button>").join("")+"</div>";
  if(s.fb)h+='<div class="rs '+(s.right?"ok":"bad")+'">'+esc(s.fb)+'</div><div class="row"><button class="btn primary" data-act="lsdn">Next item</button></div>';
  return h+"</div>";
}
function labClick(a,el,v){
  switch(a){
    case "ltool":L.tool=v;render();return true;
    case "crun":runWidget(el.dataset.id);return true;
    case "wreset":resetWidget(el.dataset.id);return true;
    case "lset":L[el.dataset.key]=v;render();return true;
    case "lset2":L.lib=v;render();return true;
    case "pcheck2":{const q=CALC[L.pi];const g=document.getElementById("pguess2").value;L.pres[L.pi]=Object.assign(L.pres[L.pi]||{},{guess:g,checked:true,ok:matchCalc(g,q)});render();return true;}
    case "prun2":{const q=CALC[L.pi];const r=runCpp(q.src,"");L.pres[L.pi]=Object.assign(L.pres[L.pi]||{},{run:r});const g=document.getElementById("pguess2");if(g&&!(L.pres[L.pi].checked))L.pres[L.pi].guess=g.value;render();return true;}
    case "pprev2":if(L.pi>0)L.pi--;render();return true;
    case "pnext2":if(L.pi+1<CALC.length)L.pi++;render();return true;
    case "fcheck":{const f=FIX[L.fi];const id="fix"+L.fi;const ta=document.getElementById("code-"+id);const src=ta?ta.value:f.src;CS.src[id]=src;const r=runCpp(src,"");CS.out[id]=r;
      const got=(r.out||"").replace(/\r/g,"").replace(/\s+$/,"");
      let msg,ok=false;
      if(!r.ok){msg=r.title+". "+r.detail;}
      else if(got===f.exp){ok=true;msg="The output matches the goal.";}
      else msg="It runs, but the output is different from the goal. Expected \""+f.exp.replace(/\n/g," / ")+"\" and got \""+got.replace(/\n/g," / ")+"\".";
      L.fres[L.fi]={ok:ok,msg:msg};render();return true;}
    case "fhint":L.fshow[L.fi]=Math.max(L.fshow[L.fi]||0,1);render();return true;
    case "fsol":L.fshow[L.fi]=2;render();return true;
    case "fprev":if(L.fi>0)L.fi--;render();return true;
    case "fnext":if(L.fi+1<FIX.length)L.fi++;render();return true;
    case "lsdim":L.sd.dim=+v;L.sd.s=0;L.sd.t=0;sdNew();render();return true;
    case "lsda":{const d=DIMS[L.sd.dim],it=d.it[L.sd.item];L.sd.t++;const ok=+v===it[1];if(ok)L.sd.s++;L.sd.right=ok;L.sd.fb=(ok?"Correct. ":"Not quite. ")+"“"+it[0]+"”: "+d.o[it[1]]+".";render();return true;}
    case "lsdn":sdNew();render();return true;
  }
  return false;
}
function labInput(el){
  const k=el.dataset.lin;if(!k)return false;
  const set=(id,html)=>{const e=document.getElementById(id);if(e)e.innerHTML=html;};
  if(k==="ref"){if(el.id==="rx")L.rx=el.value;else L.ry=el.value;set("rres",refRes());}
  else if(k==="rec"){L.cn=el.value;set("cres",recRes());}
  else if(k==="sc"){L.sn=el.value;set("sres",scRes());}
  else if(k==="lib"){L.lib=el.value;set("lres",libRes());}
  else if(k==="pred"){L.pres[L.pi]=Object.assign(L.pres[L.pi]||{},{guess:el.value});}
  return true;
}

function noteHtml(b){
  let h='<section class="nb"><h3>'+esc(b.h)+'</h3>';
  if(b.d)h+='<p class="def"><b>Definition.</b> '+esc(b.d)+'</p>';
  (b.p||[]).forEach(p=>{h+='<p>'+esc(p)+'</p>';});
  if(b.l)h+='<ul>'+b.l.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>';
  if(b.t)h+='<div class="tbl"><table><thead><tr>'+b.t.c.map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr></thead><tbody>'+b.t.r.map(r=>'<tr>'+r.map(c=>'<td>'+esc(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
  if(b.code)h+=codeHtml(b.code.id,b.code);
  return h+'</section>';
}
function stepIds(st){const ids=[];CARDS.forEach((c,i)=>{if(st.sec.includes(c[0]))ids.push(i);});return ids.filter(i=>i<ORIG).concat(ids.filter(i=>i>=ORIG));}
function stepChunks(st){const ids=stepIds(st),out=[];for(let i=0;i<ids.length;i+=CH)out.push(ids.slice(i,i+CH));return out;}
function blankHtml(text){return esc(text).replace(/\{\{(.+?)\}\}/g,(m,a)=>`<button class="blank" data-act="blank" style="min-width:${Math.max(4,a.length)}ch" aria-label="Hidden term, press to reveal"><span class="ans">${a}</span></button>`);}
function applyRate(queue,v){const id=queue.shift();let b=store.box[id]||0;
  if(v==="miss"){b=1;queue.splice(Math.min(3,queue.length),0,id);}
  else if(v==="almost"){b=Math.max(b,1);queue.push(id);}
  else{b=b<2?2:3;}
  store.box[id]=b;save();}
function openStep(s){
  const P=S.path,N=stepChunks(STEPS[s]).length;
  const ch=store.path.done[s]?0:Math.min(store.path.ch[s]||0,N);
  P.step=s;P.i=0;P.flip=false;P.guess="";P.text="";P.dchecked=false;P.ticks={};P.q=[];
  if(ch>=N){P.ph="gaps";P.ch=N-1;}else{P.ch=ch;P.ph=ch>0?"learn":"primer";}
  render();window.scrollTo(0,0);
}
function pathOverview(){
  const first=STEPS.findIndex((_,s)=>!store.path.done[s]);
  let h='<div class="panel"><h2>Start here</h2><p>New to the subject? Follow the steps in order. Each step sets out the textbook notes (with runnable code where the chapter has a listing), then teaches its cards in small rounds of six (first you see them with answers, then you recall them), then checks you with fill-the-gaps and a brain dump. Progress is saved in this browser.</p></div><div style="display:flex;flex-direction:column;gap:10px">';
  STEPS.forEach((st,s)=>{
    const N=stepChunks(st).length,done=!!store.path.done[s],ch=Math.min(store.path.ch[s]||0,N);
    const status=done?"Done":ch>0?"Round "+ch+" of "+N+" done":"Not started";
    h+=`<button class="opt" data-act="pstep" data-v="${s}" style="display:flex;justify-content:space-between;gap:12px;align-items:center"><span><b>${s+1}. ${esc(st.t)}</b><br><span class="hint">${stepIds(st).length} cards · ${N} rounds</span></span><span class="tag">${status}</span></button>`;
  });
  h+="</div>";
  if(first>=0)h+=`<div class="row"><button class="btn primary" data-act="pstep" data-v="${first}">${(store.path.ch[first]||0)>0?"Continue":"Begin"} step ${first+1}</button></div>`;
  else h+='<p>All steps are done. Keep the cards fresh in Recall cards, then test yourself in Evaluate.</p>';
  return '<div style="display:flex;flex-direction:column;gap:18px">'+h+"</div>";
}
function viewPath(){
  const P=S.path;
  if(P.step===null)return pathOverview();
  const st=STEPS[P.step],chunks=stepChunks(st),N=chunks.length;
  const pos=P.ph==="primer"?0:(P.ph==="learn"||P.ph==="recall"||P.ph==="roundend")?1+P.ch:P.ph==="gaps"?N+1:P.ph==="dump"?N+2:N+3;
  let h=`<div class="row" style="justify-content:space-between"><span class="row"><button class="btn" data-act="pback">All steps</button>${P.ph==="primer"||P.ph==="done"?"":'<button class="btn" data-act="pnotes">Notes</button>'}</span><span class="lab">Step ${P.step+1} of ${STEPS.length}</span></div><div class="bar" aria-hidden="true"><i style="width:${Math.round(pos/(N+3)*100)}%"></i></div><h2>${esc(st.t)}</h2>`;
  if(P.ph==="primer"){
    h+=`<div class="panel"><div class="lab">Textbook notes</div>${st.blocks.map(noteHtml).join("")}<p class="hint">Next: ${N} short rounds. In each round you see ${CH} cards with their answers, then recall them from memory.</p><div class="row"><button class="btn primary" data-act="pstart">${P.ch>0?"Continue at round "+(P.ch+1):"Start round 1"}</button></div></div>`;
  }else if(P.ph==="learn"){
    const ids=chunks[P.ch],id=ids[P.i],k=CARDS[id];
    h+=`<div class="panel fc"><div class="lab">Round ${P.ch+1} of ${N} · Learn · card ${P.i+1} of ${ids.length} · ${id<ORIG?"Core":"Detail"}</div><div class="q">${esc(k[1])}</div><div class="lab">Answer</div><div class="a">${esc(k[2])}</div><p class="hint">Read it, say it back in your own words, then move on.</p><div class="row"><button class="btn" data-act="plback"${P.i?"":" disabled"}>Back</button><button class="btn primary" data-act="plnext">${P.i+1<ids.length?"Next card":"Now recall these "+ids.length}</button></div></div>`;
  }else if(P.ph==="recall"){
    const id=P.q[0],k=CARDS[id];
    h+=`<div class="panel fc"><div class="lab">Round ${P.ch+1} of ${N} · Recall · ${P.q.length} left</div><div class="q">${esc(k[1])}</div><input type="text" id="pguess" placeholder="Type what you remember (optional)" value="${esc(P.guess)}" autocomplete="off">`;
    if(!P.flip)h+='<div class="row"><button class="btn primary" data-act="pflip">Show answer</button><span class="hint">or press Space</span></div>';
    else h+=`<div class="lab">Answer</div><div class="a">${esc(k[2])}</div><div class="row"><button class="btn bad" data-act="prate" data-v="miss">Missed it (1)</button><button class="btn warn" data-act="prate" data-v="almost">Almost (2)</button><button class="btn good" data-act="prate" data-v="got">Got it (3)</button></div>`;
    h+="</div>";
  }else if(P.ph==="roundend"){
    const last=P.ch+1>=N;
    h+=`<div class="panel"><h3>Round ${P.ch+1} done</h3><p>${last?"That was the last round of cards. Two short exercises remain: fill the gaps in the summary, then a brain dump.":"Next you will see "+chunks[P.ch+1].length+" new cards."}</p><div class="row"><button class="btn primary" data-act="pnext">${last?"Fill the gaps":"Start round "+(P.ch+2)}</button></div></div>`;
  }else if(P.ph==="gaps"){
    h+='<p class="hint">Say each hidden term aloud before you tap it.</p><div class="row"><button class="btn" data-act="revall">Reveal all</button><button class="btn" data-act="hideall">Hide all</button></div>';
    st.notes.forEach(ni=>{const n=NOTES[ni];h+=`<div class="panel note"><h3>${esc(n[0])}</h3><p>${blankHtml(n[1])}</p></div>`;});
    h+='<div class="row"><button class="btn primary" data-act="pdump">Continue to brain dump</button></div>';
  }else if(P.ph==="dump"){
    const pts=[];st.dump.forEach(d=>DUMPS[d].p.forEach(p=>pts.push(p)));
    h+=`<div class="panel"><h3>Brain dump</h3><p class="hint">Close everything and write what you remember about this step. Then compare.</p><textarea id="ptext" placeholder="Write it in your own words...">${esc(P.text)}</textarea>`;
    if(!P.dchecked)h+='<div class="row"><button class="btn primary" data-act="pcheck">Compare with key points</button></div>';
    else{const got=pts.filter((_,i)=>P.ticks[i]).length;
      h+=`<div class="lab">Tick what you included</div><div class="pts">${pts.map((p,i)=>`<label><input type="checkbox" data-act="ptick" data-i="${i}"${P.ticks[i]?" checked":""}><span>${esc(p)}</span></label>`).join("")}</div><div class="row"><b>${got} of ${pts.length} covered</b><button class="btn primary" data-act="pfinish">Finish this step</button></div>`;}
    h+="</div>";
  }else{
    const ids=stepIds(st),m=ids.filter(i=>(store.box[i]||0)>=2).length;
    h+=`<div class="panel"><h3>Step ${P.step+1} complete</h3><p>${m} of ${ids.length} cards in this step are at Review or Mastered. The rest keep coming back in Recall cards.</p><div class="row">${P.step+1<STEPS.length?`<button class="btn primary" data-act="pnextstep">Next: ${esc(STEPS[P.step+1].t)}</button>`:""}<button class="btn" data-act="pback">All steps</button></div></div>`;
  }
  return '<div style="display:flex;flex-direction:column;gap:16px">'+h+"</div>";
}

function startRun(list){
  const qs=list.map(q=>q.t==="mcq"?Object.assign({},q,{o:shuffle(q.opts.map((t,i)=>({t:t,c:i===q.a})))}):q);
  S.run={qs:qs,i:0,res:[],stage:[],ticks:[],text:[]};S.ev.view="quiz";render();window.scrollTo(0,0);
}
function evalQuiz(){
  const r=S.run,q=r.qs[r.i],res=r.res[r.i],T=TM[q.t];
  let h=`<div class="panel"><div class="row" style="justify-content:space-between"><span class="tag">${esc(T.n)}</span><span class="lab">Question ${r.i+1} of ${r.qs.length} · ${T.m} mark${T.m>1?"s":""}</span></div><div class="bar" aria-hidden="true"><i style="width:${Math.round(r.i/r.qs.length*100)}%"></i></div>`;
  h+=`<h3 style="font-size:1.2rem;line-height:1.35">${esc(q.t==="fill"?q.q.replace("___","_______"):q.q)}</h3>`;
  if(q.t==="calc"&&q.src)h+='<pre class="codeview">'+esc(q.src)+'</pre>';
  if(q.t==="mcq"){
    h+='<div class="opts">'+q.o.map((o,i)=>{let c="opt";if(res){if(o.c)c+=" right";else if(res.pick===i)c+=" wrong";}return `<button class="${c}" data-act="mcq" data-i="${i}"${res?" disabled":""}>${esc(o.t)}</button>`;}).join("")+"</div>";
    if(res)h+=`<div class="fb ${res.score?"ok":"no"}"><b>${res.score?"Correct.":"Not quite."}</b> ${esc(q.e)}</div>`;
  }else if(q.t==="tf"){
    h+='<div class="opts">'+[true,false].map(v=>{let c="opt";if(res){if(q.a===v)c+=" right";else if(res.pick===v)c+=" wrong";}return `<button class="${c}" data-act="tf" data-v="${v}"${res?" disabled":""}>${v?"True":"False"}</button>`;}).join("")+"</div>";
    if(res)h+=`<div class="fb ${res.score?"ok":"no"}"><b>${res.score?"Correct.":"Not quite."}</b> ${esc(q.e)}</div>`;
  }else if(q.t==="fill"||q.t==="vsa"||q.t==="calc"){
    h+=`<input type="text" id="ans" autocomplete="off" placeholder="Type your answer" value="${esc(r.text[r.i]||"")}"${res?" disabled":""}>`;
    if(!res)h+='<div class="row"><button class="btn primary" data-act="check">Check</button></div>';
    else{
      h+=`<div class="fb ${res.score?"ok":"no"}"><b>${res.score?"Correct.":"Model answer:"}</b> ${res.score?"":esc(q.model)} ${q.e?esc(q.e):""}</div>`;
      if(!res.score)h+='<div class="row"><button class="btn" data-act="override">I was right, count it</button></div>';
    }
  }else{
    const st=r.stage[r.i]||0;
    h+=`<textarea id="wtext" placeholder="Write your answer as you would in the exam..."${st?" disabled":""}>${esc(r.text[r.i]||"")}</textarea>`;
    if(!st)h+='<div class="row"><button class="btn primary" data-act="reveal">Show model answer</button></div>';
    else{
      const tk=r.ticks[r.i]||{};const got=q.pts.filter((_,i)=>tk[i]).length;
      h+=`<div class="lab">Model answer</div><div class="a" style="border-left:3px solid var(--accent);padding-left:14px">${esc(q.model)}</div><div class="lab">Tick every marking point your answer made</div><div class="pts">`+q.pts.map((p,i)=>`<label><input type="checkbox" data-act="wtick" data-i="${i}"${tk[i]?" checked":""}${res?" disabled":""}><span>${esc(p)}</span></label>`).join("")+"</div>";
      if(!res)h+=`<div class="row"><button class="btn primary" data-act="wsave">Save score (${fmt(got/q.pts.length*T.m)} of ${T.m})</button></div>`;
      else h+=`<div class="fb ${res.score>=T.m?"ok":"no"}">Scored ${fmt(res.score)} of ${T.m}.</div>`;
    }
  }
  if(res){h+=`<div class="row"><button class="btn primary" data-act="next">${r.i+1<r.qs.length?"Next question":"See results"}</button></div>`;}
  return h+"</div>";
}
function fmt(x){return (Math.round(x*2)/2).toString();}
function setRes(score,extra){const r=S.run,q=r.qs[r.i];r.res[r.i]=Object.assign({score:score,max:TM[q.t].m},extra||{});render();}
function evalResult(){
  const r=S.run;let sc=0,mx=0;const by={};
  r.qs.forEach((q,i)=>{const x=r.res[i]||{score:0,max:TM[q.t].m};sc+=x.score;mx+=x.max;const b=by[q.t]||(by[q.t]={s:0,m:0,n:0});b.s+=x.score;b.m+=x.max;b.n++;});
  const pct=Math.round(sc/mx*100);
  const msg=pct>=85?"Exam ready on this material.":pct>=65?"Solid. Revisit the misses below.":pct>=40?"Getting there. Use the Learn section on the weak topics.":"Go back to the recall cards, then try again.";
  let h=`<div class="panel"><div class="lab">Result</div><div class="score">${fmt(sc)} / ${mx} <span style="font-size:1.5rem;color:var(--muted)">${pct}%</span></div><p>${msg}</p><div style="display:flex;flex-direction:column;gap:10px">`;
  TYPES.forEach(t=>{const b=by[t.k];if(!b)return;const p=Math.round(b.s/b.m*100);h+=`<div><div class="row" style="justify-content:space-between"><span>${esc(t.n)} (${b.n})</span><b>${fmt(b.s)}/${b.m}</b></div><div class="bar"><i style="width:${p}%"></i></div></div>`;});
  const missed=r.qs.filter((q,i)=>(r.res[i]||{score:0}).score<TM[q.t].m).length;
  h+=`</div><div class="row">${missed?`<button class="btn primary" data-act="retry">Retry the ${missed} missed</button>`:""}<button class="btn" data-act="newtest">New test</button></div></div>`;
  h+="<h2>Review</h2>";
  r.qs.forEach((q,i)=>{const x=r.res[i]||{score:0,max:TM[q.t].m};const ok=x.score>=x.max;
    let ans=q.t==="mcq"?q.opts[q.a]:q.t==="tf"?(q.a?"True":"False"):q.model;
    h+=`<div class="rev ${ok?"ok":"bad"}"><div class="lab">${esc(TM[q.t].n)} · ${fmt(x.score)}/${x.max}</div><b>${esc(q.q)}</b>${x.resp?`<div class="r">You: ${esc(x.resp)}</div>`:""}<div class="r">${ok?"":"Answer: "}${esc(ans)}</div></div>`;});
  return '<div style="display:flex;flex-direction:column;gap:14px">'+h+"</div>";
}
function finishRun(){
  const r=S.run;let sc=0,mx=0;r.qs.forEach((q,i)=>{const x=r.res[i]||{score:0,max:TM[q.t].m};sc+=x.score;mx+=x.max;});
  if(!r.retry){store.hist.unshift({d:new Date().toLocaleDateString(undefined,{day:"numeric",month:"short"}),pct:Math.round(sc/mx*100),n:r.qs.length});store.hist=store.hist.slice(0,8);save();}
  S.ev.view="result";
}

/* ============ EVENTS ============ */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");if(!el)return;
  const a=el.dataset.act,v=el.dataset.v;
  switch(a){
    case "tab":S.tab=v;render();break;
    case "lv":S.lv=v;render();break;
    case "csec":S.cards.sec=+v;buildQueue();render();break;
    case "flip":S.cards.flip=true;render();break;
    case "cnext":buildQueue();render();break;
    case "creset":CARDS.forEach((k,i)=>{if(S.cards.sec<0||k[0]===S.cards.sec)delete store.box[i];});save();buildQueue();render();break;
    case "rate":{const q=S.cards.queue,id=q.shift();let b=store.box[id]||0;
      if(v==="miss"){b=1;q.splice(Math.min(3,q.length),0,id);}
      else if(v==="almost"){b=Math.max(b,1);q.push(id);}
      else{b=b<2?2:3;S.cards.done++;}
      store.box[id]=b;save();S.cards.flip=false;S.cards.guess="";render();break;}
    case "cord":S.cards.ordered=v==="1";buildQueue();render();break;
    case "pstep":openStep(+v);break;
    case "pback":S.path.step=null;render();window.scrollTo(0,0);break;
    case "pnotes":S.path.ph="primer";render();window.scrollTo(0,0);break;
    case "pstart":S.path.ph="learn";S.path.i=0;render();break;
    case "plback":if(S.path.i>0)S.path.i--;render();break;
    case "plnext":{const P=S.path,ids=stepChunks(STEPS[P.step])[P.ch];
      if(P.i+1<ids.length)P.i++;else{P.ph="recall";P.q=shuffle(ids.slice());P.flip=false;P.guess="";}
      render();break;}
    case "pflip":S.path.flip=true;render();break;
    case "prate":{const P=S.path;applyRate(P.q,v);P.flip=false;P.guess="";
      if(!P.q.length){store.path.ch[P.step]=P.ch+1;save();P.ph="roundend";}
      render();break;}
    case "pnext":{const P=S.path,N=stepChunks(STEPS[P.step]).length;
      if(P.ch+1<N){P.ch++;P.ph="learn";P.i=0;}else P.ph="gaps";
      render();window.scrollTo(0,0);break;}
    case "pdump":S.path.ph="dump";render();window.scrollTo(0,0);break;
    case "pcheck":{const t=$("#ptext");if(t)S.path.text=t.value;S.path.dchecked=true;render();break;}
    case "pfinish":store.path.done[S.path.step]=true;save();S.path.ph="done";render();window.scrollTo(0,0);break;
    case "pnextstep":openStep(S.path.step+1);break;
    case "blank":el.classList.toggle("on");break;
    case "revall":document.querySelectorAll(".blank").forEach(b=>b.classList.add("on"));break;
    case "hideall":document.querySelectorAll(".blank").forEach(b=>b.classList.remove("on"));break;
    case "mask":if(el.classList.contains("hid")){el.classList.remove("hid");el.removeAttribute("role");}break;
    case "tmode":S.tmode[el.dataset.t]=v;render();break;
    case "dtopic":S.dump={i:+v,text:"",checked:false,ticks:{}};render();break;
    case "dcheck":S.dump.checked=true;render();break;
    case "dreset":S.dump.checked=false;S.dump.ticks={};S.dump.text="";render();break;
    case "estart":{const pool=shuffle(BANK.filter(b=>S.ev.types[b.t]));const list=S.ev.n?pool.slice(0,S.ev.n):pool;
      list.sort((x,y)=>TYPES.findIndex(t=>t.k===x.t)-TYPES.findIndex(t=>t.k===y.t));startRun(list);break;}
    case "mcq":{const r=S.run,q=r.qs[r.i],i=+el.dataset.i;setRes(q.o[i].c?1:0,{pick:i,resp:q.o[i].t});break;}
    case "tf":{const r=S.run,q=r.qs[r.i],p=v==="true";setRes(p===q.a?1:0,{pick:p,resp:p?"True":"False"});break;}
    case "check":doCheck();break;
    case "override":{const r=S.run;r.res[r.i].score=TM[r.qs[r.i].t].m;render();break;}
    case "reveal":{const r=S.run;r.text[r.i]=$("#wtext").value;r.stage[r.i]=1;render();break;}
    case "wsave":{const r=S.run,q=r.qs[r.i],tk=r.ticks[r.i]||{};const got=q.pts.filter((_,i)=>tk[i]).length;setRes(Math.round(got/q.pts.length*TM[q.t].m*2)/2,{resp:r.text[r.i]||""});break;}
    case "next":{const r=S.run;if(r.i+1<r.qs.length){r.i++;render();window.scrollTo(0,0);}else{finishRun();render();window.scrollTo(0,0);}break;}
    case "retry":{const r=S.run;const list=r.qs.filter((q,i)=>(r.res[i]||{score:0}).score<TM[q.t].m);startRun(list);S.run.retry=true;break;}
    case "newtest":S.ev.view="setup";S.run=null;render();break;
    default:labClick(a,el,v);
  }
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.dataset.lsel){labSelect(el);return;}
  if(el.dataset.act==="etype"){S.ev.types[el.dataset.v]=el.checked?1:0;render();}
  else if(el.id==="en"){S.ev.n=+el.value;}
  else if(el.dataset.act==="ptick"){S.path.ticks[el.dataset.i]=el.checked;render();}
  else if(el.dataset.act==="dtick"){S.dump.ticks[el.dataset.i]=el.checked;render();}
  else if(el.dataset.act==="wtick"){const r=S.run;r.ticks[r.i]=r.ticks[r.i]||{};r.ticks[r.i][el.dataset.i]=el.checked;render();}
});
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.dataset&&el.dataset.cid){CS.src[el.dataset.cid]=el.value;return;}
  if(el.dataset&&el.dataset.iid){CS.inp[el.dataset.iid]=el.value;return;}
  if(el.dataset&&(el.dataset.lin||el.dataset.tcell!==undefined)){labInput(el);return;}
  if(el.id==="guess")S.cards.guess=el.value;
  else if(el.id==="pguess")S.path.guess=el.value;
  else if(el.id==="ptext")S.path.text=el.value;
  else if(el.id==="dtext")S.dump.text=el.value;
  else if(el.id==="ans"&&S.run)S.run.text[S.run.i]=el.value;
});
function doCheck(){
  const r=S.run,q=r.qs[r.i],v=($("#ans").value||"").trim();if(!v)return;
  r.text[r.i]=v;setRes((q.t==="calc"?matchCalc(v,q):matches(v,q.acc,q.all))?TM[q.t].m:0,{resp:v});
}
document.addEventListener("keydown",e=>{
  const t=e.target,tag=t.tagName;
  if(e.key==="Enter"&&t.id==="ans"){e.preventDefault();doCheck();return;}
  if(t.classList&&t.classList.contains("codearea")){
    if(e.key==="Tab"&&!e.shiftKey){e.preventDefault();const p=t.selectionStart;t.setRangeText("    ",p,t.selectionEnd,"end");CS.src[t.dataset.cid]=t.value;return;}
    if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)){e.preventDefault();const b=t.closest(".cw").parentElement.querySelector('[data-act="crun"],[data-act="fcheck"]');if(b)b.click();return;}
  }
  if(e.key==="Enter"&&t.id==="pguess2"){e.preventDefault();const b=document.querySelector('[data-act="pcheck2"]');if(b&&!b.disabled)b.click();return;}
  if((e.key==="Enter"||e.key===" ")&&t.classList&&t.classList.contains("hid")){e.preventDefault();t.click();return;}
  const inPath=S.tab==="learn"&&S.lv==="path"&&S.path.ph==="recall"&&S.path.q.length>0;
  const inCards=S.tab==="learn"&&S.lv==="cards"&&S.cards.queue.length>0;
  if(!(inPath||inCards)||tag==="INPUT"||tag==="TEXTAREA"||tag==="SELECT")return;
  const flipped=inPath?S.path.flip:S.cards.flip;
  if((e.key===" "||e.key==="Enter")&&tag!=="BUTTON"&&!flipped){e.preventDefault();if(inPath)S.path.flip=true;else S.cards.flip=true;render();}
  else if(flipped&&"123".includes(e.key)&&e.key){const m={"1":"miss","2":"almost","3":"got"};const b=document.querySelector('[data-act$="rate"][data-v="'+m[e.key]+'"]');if(b)b.click();}
});
render();
</script>

</body></html>
