.score{font:700 3rem var(--display);font-variant-numeric:tabular-nums}

/* ---- Code lab ---- */
:root{--code-bg:#fbfaf6;--code-fg:#1b2a22;--code-line:#d5ddd6;--ok-b:#0a6a4d;--ok-s:#dcefe6;--note-b:#9a4a08;--note-s:#f6e6d4}

:root[data-theme="dark"]{--code-bg:#0a100d;--code-fg:#d8efe3;--code-line:#26342c;--ok-b:#5fd7a8;--ok-s:#17382b;--note-b:#f0a15a;--note-s:#3a2a17}

.btn.sm{padding:6px 12px;font-size:.85rem}
.codearea,.codeview,.outpre{font:400 .88rem/1.55 var(--mono);background:var(--code-bg);color:var(--code-fg);border:1.5px solid var(--code-line);border-radius:8px;padding:12px 14px;margin:0;white-space:pre;overflow-x:auto;tab-size:4}
.codearea{width:100%;resize:vertical;min-height:5rem}
.outpre{white-space:pre-wrap;border-left:4px solid var(--accent)}
.outbox{display:flex;flex-direction:column;gap:8px;min-width:0}

.cw-in{display:flex;flex-direction:column;gap:4px}

.rs{padding:10px 14px;border-radius:8px;font-size:.93rem;border-left:4px solid var(--line);background:var(--bg)}
.rs.ok{border-color:var(--ok-b);background:var(--ok-s)}
.rs.bad{border-color:var(--bad);background:var(--bad-soft)}

.try{border:1px dashed var(--accent);border-radius:8px;padding:8px 12px;font-size:.93rem}
.note-box{background:var(--accent-soft);border-radius:8px;padding:10px 14px;font-size:.93rem}
ol.pipe{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0}
ol.pipe li{position:relative;padding:8px 12px 8px 34px;border-left:2px solid var(--line);margin-left:10px;font-size:.93rem}
ol.pipe li::before{content:"";position:absolute;left:-8px;top:12px;width:14px;height:14px;border-radius:50%;background:var(--bg);border:2px solid var(--line)}

ol.pipe li.cur{background:var(--accent-soft)}ol.pipe li.cur::before{border-color:var(--accent);background:var(--surface)}
ol.pipe li.fail{background:var(--bad-soft)}ol.pipe li.fail::before{background:var(--bad);border-color:var(--bad)}
ol.pipe li.warn{background:var(--note-s)}ol.pipe li.warn::before{background:var(--note-b);border-color:var(--note-b)}

.brow.res{border-top:1px solid var(--line);padding-top:6px;font-weight:600}
.bl{font:.78rem var(--mono);color:var(--muted)}
.bv{display:flex;gap:2px;flex-wrap:wrap}
.bit{width:1.55rem;height:1.7rem;display:inline-flex;align-items:center;justify-content:center;font:500 .85rem var(--mono);border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--muted)}
.bit.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.bd{font:.85rem var(--mono)}
.b-s{color:var(--bad)}.b-e{color:var(--note-b)}.b-m{color:var(--accent)}

ol.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
ol.steps li{display:flex;flex-direction:column;gap:2px;padding:8px 12px;border:1px solid var(--line);border-radius:8px}
.exp{font-family:var(--mono);font-size:.92rem}.exp.res{color:var(--accent);font-weight:600}
.exp mark{background:var(--accent-soft);color:var(--fg);border-radius:3px;padding:0 3px;outline:1.5px solid var(--accent)}
ul.rules{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
ul.rules li{padding:6px 10px;border-radius:6px;font-size:.92rem}
ul.rules li.ok{background:var(--ok-s)}ul.rules li.no{background:var(--bad-soft)}
input.tcell{width:100%;min-width:4rem;font:.9rem var(--mono);padding:6px 8px}
input.tcell.good{border-color:var(--accent);background:var(--accent-soft)}
input.tcell.miss{border-color:var(--bad);background:var(--bad-soft)}
.nb .cw{margin-top:4px}
.nb ol.pipe{margin-top:4px}
@media (max-width:520px){.brow{grid-template-columns:1fr}.bit{width:1.3rem}}

<script>
"use strict";
/* ============ DATA ============ */
const TABLES=[
/*0*/{s:0,t:"The core functions of an operating system (Table 1.1)",c:["Function","What it involves"],r:[
["Process management","Creating processes, scheduling them for CPU time, tracking their state, terminating them on completion"],
["Memory management","Tracking every byte of RAM, deciding which process gets how much, preventing one process from corrupting another's memory"],
["File system management","Organising storage into a hierarchy of files and directories, managing read/write access, maintaining attributes and permissions"],
["Device management","Controlling peripherals through device drivers, abstracting hardware diversity into a uniform interface"],
["Security and protection","Enforcing access control, user authentication and resource permissions"],
["User interface","Providing the means (CLI or GUI) through which humans issue commands"]]},
/*1*/{s:0,t:"Kernel mode and user mode compared",c:["Basis","Kernel mode (supervisor mode)","User mode"],r:[
["Access","Unrestricted access to all hardware and memory; can execute any instruction","Restricted: cannot access hardware directly, cannot execute sensitive instructions, touches only memory allocated to it"],
["Who runs here","The kernel and trusted low-level components","Every ordinary application: word processor, browser, game"],
["On a violation","Not applicable","The processor detects it and traps into the kernel, which can terminate the offending process without disturbing others"],
["Purpose","Runs privileged operations","Acts as a safety boundary protecting the OS and other processes"]]},
/*2*/{s:0,t:"System call categories",c:["Category","Examples"],r:[
["Process control","Create, terminate (for example fork())"],
["File management","Open, read, write, close (for example read())"],
["Device management","Request, release (for example request_device())"],
["Communication","Send, receive (for example send())"]]},
/*3*/{s:1,t:"The evolution of operating systems",c:["Period","Development"],r:[
["1940s","No operating system: programmers loaded machine code by hand for every run"],
["1950s","Batch systems automated the tedious manual setup between jobs"],
["Early 1960s","Multiprogramming addressed the idle CPU time batch systems still wasted while waiting on I/O"],
["Mid-1960s onward","Time-sharing and multitasking made the machine feel interactive, giving each user or task the illusion of continuous attention"],
["1970s onward","Multiuser and multiprocessing systems scaled this across people and across physical processors"],
["Later","Real-time, distributed, network and mobile operating systems emerged as computing spread to safety-critical control, clusters, local networks and pocket-sized devices"]]},
/*4*/{s:1,t:"The nine types of operating system",c:["Type","Defining feature","Examples"],r:[
["Batch","Similar jobs collected into a batch and run one after another with no interaction during execution","Payroll, bank statement generation, billing runs"],
["Multiprogramming","Several programs kept in memory; the CPU switches to another when one waits, maximising CPU utilisation","Batch-oriented mainframe settings"],
["Multitasking","Several tasks active at once, switched rapidly (time slices) so the user sees a responsive, interactive system","Windows, macOS, Linux"],
["Multiuser","Several users access the same system simultaneously, each independent and protected from the others","Linux and Unix servers, university labs, cloud platforms"],
["Multiprocessing","Two or more physical CPUs run tasks at the same instant (true parallelism); SMP treats all processors as equal","Modern desktops and servers with multi-core processors"],
["Real-time","Guarantees a response within strictly defined deadlines","Flight control, ABS brakes, pacemakers, streaming"],
["Distributed","Independent networked computers presented as one unified system","Large cloud platforms"],
["Network (NOS)","Software foundation for a LAN; computers share files and printers but keep independent identities","Windows Server, Novell NetWare, Linux with Samba"],
["Mobile","Designed for smartphones and tablets: battery, touch, sensors, constant connectivity","Android, iOS"]]},
/*5*/{s:1,t:"Hard versus soft real-time systems (Table 1.2)",c:["Type","Consequence of a missed deadline","Examples"],r:[
["Hard real-time","Total system failure; the deadline is absolutely inviolable","Flight control, ABS brakes, pacemakers, missile guidance"],
["Soft real-time","Degraded quality, tolerable occasionally","Video streaming, online gaming, telecommunications"]]},
/*6*/{s:1,t:"Distributed and network operating systems compared",c:["Basis","Distributed OS","Network OS"],r:[
["Presentation","The network appears as one unified system","Each computer keeps its own OS and identity"],
["User awareness","Transparent: users need not know which machine does the work","Users log on explicitly and know they are reaching a separate machine"],
["Structure","Each node has its own processor and memory; the OS coordinates tasks and data","Servers run the NOS and manage shared resources; clients access them"],
["Purpose","Pooled power, fault tolerance, easy scaling","Resource sharing (files, printers, internet access) on a LAN"]]},
/*7*/{s:1,t:"Multiprogramming and multitasking compared",c:["Basis","Multiprogramming","Multitasking"],r:[
["Main aim","Maximise CPU utilisation","Provide a responsive, interactive experience"],
["Setting","Primarily batch-oriented","Interactive: the user switches freely among applications"],
["Switching trigger","When a program waits for I/O","Time slices (quanta) in round-robin rotation, even if the task has not finished"],
["Example","Early mainframes","Windows, macOS, Linux"]]},
/*8*/{s:1,t:"Classifying a scenario: the questions to ask in order",c:["Question","Operating system type"],r:[
["Does it process without interaction?","Batch"],
["Does it switch programs to avoid CPU idling?","Multiprogramming"],
["Does it switch programs to feel interactive?","Multitasking"],
["Does it serve several people at once?","Multiuser"],
["Does it use several physical CPUs?","Multiprocessing"],
["Does it guarantee timing (hard or soft)?","Real-time"],
["Does it unify several networked machines?","Distributed"],
["Does it let networked machines share resources while staying independent?","Network"],
["Is it built for a phone?","Mobile"]]},
/*9*/{s:2,t:"Process management responsibilities (Table 1.3)",c:["Responsibility","Detail"],r:[
["Creation","Allocating memory and initialising the execution environment for a new process"],
["Scheduling","Deciding, via a scheduling algorithm, which ready process gets CPU time next and for how long"],
["State tracking","Maintaining each process as running, ready or waiting, and switching correctly between these"],
["Synchronisation","Handling communication and coordination between cooperating processes"],
["Termination","Ending processes and reclaiming their resources on completion"]]},
/*10*/{s:2,t:"Process state transitions",c:["Transition","Cause"],r:[
["New to Ready","Admitted: the process is created and awaits the CPU"],
["Ready to Running","Dispatched: the scheduler selects it for the processor"],
["Running to Ready","The time slice expires and the process returns to the ready queue"],
["Running to Waiting","The process needs an I/O operation or event to complete"],
["Waiting to Ready","The I/O or event completes; the process must wait to be dispatched again (never straight to Running)"],
["Running to Terminated","The process exits"]]},
/*11*/{s:2,t:"CPU scheduling algorithms compared",c:["Algorithm","Rule","Strength","Weakness"],r:[
["First-Come, First-Served (FCFS)","Run processes strictly in arrival order","Simple and fair in a narrow sense","Convoy effect: one long process at the front makes all others wait"],
["Shortest Job First (SJF)","Run the process with the smallest estimated execution time next","Provably minimises average waiting time","Needs execution times in advance; long processes may starve"],
["Priority scheduling","Always run the highest-priority ready process","Important work runs first","Low-priority processes may starve (mitigated by aging, raising priority with waiting time)"],
["Round-robin","Give each process a fixed time quantum in rotation","Fair and responsive for interactive use","Quantum too large degrades to FCFS; too small and context-switch overhead dominates"]]},
/*12*/{s:2,t:"The four necessary conditions for deadlock",c:["Condition","Meaning"],r:[
["Mutual exclusion","At least one resource is held in a non-shareable way"],
["Hold and wait","A process holding one resource is waiting to acquire another"],
["No preemption","A resource cannot be forcibly taken from its holder; it must be released voluntarily"],
["Circular wait","A closed chain of processes exists, each waiting for a resource held by the next"]]},

const NOTES=[
["1.1 Operating system basics","The {{operating system}} is system software that manages hardware resources and provides an environment in which applications run; it acts as an {{intermediary}} between user and hardware. It presents an {{abstract}} view of the hardware, so open(\"notes.txt\") works the same on an SSD or a USB drive. The {{kernel}} is the permanently resident core; the {{shell}} is the user interface layer. Code in {{kernel mode}} has unrestricted hardware access; applications run in {{user mode}}. A program reaches the kernel only through a {{system call}}, a controlled gateway. System call categories are process control, {{file}} management, device management and {{communication}}."],
["1.2 Types of operating system","A {{batch}} system runs jobs one after another with no interaction. {{Multiprogramming}} keeps several programs in memory to avoid an idle CPU. {{Multitasking}} switches by time slices (quanta) for an interactive feel, in {{round-robin}} fashion. A {{multiuser}} system serves several people at once; every multiuser OS is multitasking but not the reverse. {{Multiprocessing}} uses two or more physical CPUs; {{SMP}} treats them as equal. A {{hard}} real-time system treats a missed deadline as failure; a {{soft}} one tolerates it. A {{distributed}} OS presents networked machines as one system, whereas a {{network}} OS lets each computer keep its own identity. A {{mobile}} OS is optimised for battery, touch and sensors."],
["1.3 Process management","A {{process}} is a program in execution. The OS keeps a {{PCB}} (Process Control Block) for each. The states are new, {{ready}}, {{running}}, {{waiting}} and terminated; a waiting process returns to {{ready}}, never directly to running. {{FCFS}} runs in arrival order and suffers the {{convoy}} effect; {{SJF}} minimises average waiting time but can {{starve}} long jobs; priority scheduling is mitigated by {{aging}}; {{round-robin}} gives each process a fixed {{quantum}}. A {{deadlock}} needs all four conditions: mutual exclusion, hold and wait, {{no preemption}} and {{circular wait}}. The {{Banker's}} Algorithm is a method of deadlock avoidance."],
["1.4 Memory management","{{Memory protection}} stops one process reading another's memory. {{Paging}} divides physical memory into {{frames}} and a process into {{pages}} of the same size; a {{page table}} maps pages to frames. Paging eliminates {{external}} fragmentation but leaves some {{internal}} fragmentation. {{Segmentation}} divides a process into variable-sized logical units such as code, data and stack. Most systems use {{paged segmentation}}. {{Virtual memory}} extends RAM using a page file or {{swap space}} on disk; excessive swapping is called {{thrashing}}."],
["1.5 File and device management","File management provides a {{hierarchy}} of files and directories and enforces {{permissions}}. Device management gives a {{uniform}} interface through drivers. The {{SCAN}} (elevator) algorithm moves the disk head in one direction servicing requests until the end, then {{reverses}}. {{C-SCAN}} jumps back to the start instead. An {{SSD}} needs no disk scheduling because it has no moving head."],
["1.6 User interface","A {{CLI}} accepts typed commands; it is fast, {{scriptable}} and light on resources, but needs memorised commands. A {{GUI}} uses windows, icons, menus and pointers (the {{WIMP}} paradigm); it was pioneered at {{Xerox PARC}} and popularised by Apple's {{Macintosh}} in 1984. A {{TUI}} draws text-based boxes and menus; a {{VUI}} accepts spoken commands (Siri, Alexa). CLI wins for servers and automation; GUI wins for general users."],
["1.7 Booting","{{Booting}} loads the operating system into memory. A {{cold}} boot starts from a powered-off state with a full {{POST}}; a {{warm}} boot restarts a running system and skips POST. {{BIOS}} uses the {{MBR}}, is 16-bit and limited to about 2 TB; {{UEFI}} uses {{GPT}}, is graphical and supports {{Secure Boot}}. The order is firmware, POST, boot sector, {{bootloader}}, {{kernel}}, shell. GRUB is the bootloader on Linux; the Windows Boot Manager is its Windows counterpart."],
["1.8 File systems","A {{file system}} organises raw storage into files and directories using {{metadata}}. A {{sector}} is the smallest physical unit; a {{cluster}} is the smallest logical allocation unit. FAT32 and NTFS use an {{allocation table}}; ext4 uses an {{inode}} per file. {{Journaling}} logs changes before applying them. {{FAT32}} is limited to 4 GB files; {{NTFS}} is the Windows default; {{ext4}} is the Linux default; {{APFS}} serves Apple SSDs; {{exFAT}} suits large cross-platform removable media."],
["1.9 Popular operating systems","Windows (Microsoft, 1985, proprietary) dominates desktops. {{Linux}}, created by Linus {{Torvalds}} in 1991 under the {{GPL}}, dominates servers and underlies {{Android}}. A Linux {{distribution}} such as Ubuntu or Fedora packages the kernel with tools. {{macOS}} is built on {{Darwin}} (BSD Unix and the Mach microkernel); iOS shares the {{XNU}} kernel. A {{hypervisor}} creates virtual machines: a {{Type 1}} runs on bare metal (ESXi, Hyper-V) and a {{Type 2}} runs on a host OS (VirtualBox)."]
];

const CORE=[
[0,"Define an operating system.","The most fundamental piece of system software: a program or collection of programs that acts as an intermediary between the user and the computer's hardware, managing the processor, memory, storage and input/output devices and providing a consistent, organised environment for application programs and users."],
[0,"When does the OS load and how long does it stay active?","It is the first software loaded at power-on and remains active and in control for the entire session until shutdown."],
[0,"Why is an operating system necessary?","Before operating systems every program controlled the hardware by hand (memory, I/O, processor), which was slow, error-prone and specialist work. The OS provides a reusable layer that handles hardware management, lets many programs share resources without interfering, and provides security and access control."],
[0,"What does the OS abstract view of hardware mean?","It presents applications with a clean, simplified model of resources such as memory and files, hiding messy hardware details: open(\"notes.txt\") works identically whether the file is on an SSD, HDD or USB drive."],
[0,"Name the four components of an operating system.","Kernel, shell, file system and device drivers."],
[0,"Define the kernel.","The core of the OS, loaded at startup and kept resident permanently; it directly manages hardware and provides the most fundamental services (process scheduling, memory management, device control, system call handling), running in a privileged mode."],
[0,"Define the shell.","The component providing the user interface: a text-based command interpreter on command-line systems, or the desktop environment on graphical systems."],
[0,"What is kernel mode?","Also called supervisor mode: code has unrestricted access to all hardware and memory and can execute any instruction; only the kernel and trusted low-level components run here."],
[0,"What is user mode?","A restricted mode in which code cannot access hardware directly, cannot execute certain sensitive instructions and can touch only the memory the OS allocated to it; every ordinary application runs here."],
[0,"Why separate kernel mode and user mode?","As a safety boundary: if a user-mode program reads another process's memory or issues a kernel-only instruction, the processor traps into the kernel, which can terminate that process without disturbing others; otherwise any crash could bring down the system."],
[0,"What is a system call?","A controlled gateway through which a user-mode program requests a service only the kernel can provide (open a file, allocate memory, send data, create a process); it switches deliberately into kernel mode, the kernel validates and performs the operation, then returns to user mode with the result."],
[0,"Name the system call categories with examples.","Process control (create, terminate: fork()); file management (open, read, write, close); device management (request, release); communication (send, receive)."],
[0,"How should the role of the kernel be answered for full marks?","Name the privilege boundary: the kernel runs in a privileged mode inaccessible to ordinary applications, and user programs reach hardware only through system calls, which lets the OS protect itself and other processes from a misbehaving program."],
[1,"Why did successive types of OS appear?","Each responded to a limitation of the previous: no OS (1940s), batch to automate manual setup (1950s), multiprogramming to avoid idle CPU during I/O (early 1960s), time-sharing and multitasking for interactivity (mid-1960s), multiuser and multiprocessing to scale (1970s), then real-time, distributed, network and mobile."],
[1,"Can one OS belong to several types?","Yes: the categories describe capabilities; Windows and Linux are simultaneously multitasking, multiuser and multiprocessing."],
[1,"Define a batch operating system.","One in which similar jobs are collected into a batch and processed automatically one after another with no interactive input during execution; used for payroll, bank statements and billing runs."],
[1,"State the advantage and disadvantage of batch systems.","Advantage: efficient CPU use, as jobs run continuously with no manual setup delay. Disadvantage: no interactivity; an error is discovered only after the whole run, wasting time."],
[1,"Define a multiprogramming operating system.","One that keeps several programs in memory and switches the CPU to another ready program when the current one waits for I/O, keeping the CPU busy and maximising utilisation."],
[1,"Does multiprogramming mean simultaneous execution?","No: a single processor executes one instruction at a time; the illusion of simultaneity comes from rapid switching."],
[1,"Define a multitasking operating system.","One that allows several tasks to be active at once, switching rapidly enough to appear simultaneous, designed for a responsive, interactive experience; time slices (quanta) of a few milliseconds are allocated in round-robin rotation."],
[1,"Distinguish multiprogramming and multitasking.","Multiprogramming maximises CPU utilisation, primarily in batch-oriented settings, switching when a program waits for I/O. Multitasking provides a responsive interactive experience, switching by time slices whether or not a task has finished."],
[1,"Define a multiuser operating system.","One that lets several users access the same system simultaneously, each working independently, with fair resource shares and protection of one user's data from another (authentication and permissions); Linux and Unix."],
[1,"Why is multiuser not the same as multitasking?","A multiuser OS must also be multitasking, but a single-user multitasking OS (early Windows) is not multiuser; one implication does not run the other way."],
[1,"Define a multiprocessing operating system.","One designed for computers with two or more physical CPUs, distributing processes or parts of a process across them for genuine simultaneous execution, unlike multitasking where one processor switches rapidly."],
[1,"What is symmetric multiprocessing (SMP)?","The most common form: all processors are treated as equal and the OS can schedule any process on any available one; it must handle cache coherency and inter-processor communication."],
[1,"Define a real-time operating system.","One that guarantees responses to events within strictly defined deadlines; missing a deadline can be a system failure."],
[1,"Distinguish hard and soft real-time with examples.","Hard: a missed deadline is total system failure and is inviolable (flight control, ABS brakes, pacemakers, missile guidance). Soft: a miss causes degraded quality, tolerable occasionally (video streaming, online gaming, telecommunications)."],
[1,"Define a distributed operating system.","One that manages a collection of independent networked computers and presents them as a single unified system; each node has its own processor and memory, and users need not know which machine does the work."],
[1,"State the advantages and difficulty of distributed systems.","Advantages: pooled computing power, fault tolerance, easy scaling by adding nodes, resources closer to users. Difficulty: much more complex design (network communication, data consistency, distributed scheduling, failure recovery)."],
[1,"Define a network operating system (NOS).","The software foundation for a local area network, letting connected computers share files, printers and internet access while each keeps its own independent OS and identity; servers run the NOS, clients access resources (Windows Server, Novell NetWare, Linux with Samba)."],
[1,"Distinguish distributed OS and network OS.","A distributed OS presents the network as one unified system with transparency; a network OS lets machines stay independent, users log on explicitly and know they reach a separate machine."],
[1,"What are the special features of a mobile OS?","Aggressive power management, touch and gesture interfaces, tight control of background activity, constant cellular and Wi-Fi connectivity, and frameworks for sensors (GPS, accelerometer, camera, fingerprint), push notifications and secure payment; Android and iOS."],
[2,"Define a process.","An instance of a program in execution: the code loaded in memory, the current register values and program counter, the allocated memory space and associated resources; double-clicking an icon creates one."],
[2,"What is a Process Control Block (PCB)?","A data structure kept by the OS for each process storing what it needs to manage and resume it: process ID, state, saved CPU registers, memory allocation details and scheduling information."],
[2,"Name the five responsibilities of process management.","Creation, scheduling, state tracking, synchronisation and termination."],
[2,"Name the five process states.","New, ready, running, waiting and terminated."],
[2,"Describe each process state transition.","New to ready: admitted. Ready to running: dispatched by the scheduler. Running to ready: time slice expires. Running to waiting: I/O or event wait. Waiting to ready: I/O complete. Running to terminated: exits."],
[2,"Why can a waiting process not move directly to running?","It must return to the ready queue and be dispatched again, because several processes may be ready and the scheduler, not the completion of I/O, decides who runs next."],
[2,"What does the CPU scheduler do?","Decides which ready process runs next, using an algorithm that trades off simplicity, fairness and responsiveness; interactive applications get prompt attention while background work does not starve them."],
[2,"Explain FCFS scheduling.","First-Come, First-Served runs processes strictly in arrival order; simple, but one long process at the front makes all others wait (the convoy effect)."],
[2,"Explain SJF scheduling.","Shortest Job First runs the process with the smallest estimated execution time next, provably minimising average waiting time; but it needs the times in advance and long processes can starve."],
[2,"Explain priority scheduling.","Always runs the highest-priority ready process; low-priority processes may starve, usually mitigated by aging, gradually raising the priority of a process the longer it waits."],
[2,"Explain round-robin scheduling.","Gives each process a fixed time quantum in rotation; fair and responsive for interactive use; a quantum too large degrades toward FCFS, too small makes context-switch overhead dominate."],
[2,"What is a context switch?","Saving one process's state and loading another's so that the CPU can switch between them."],
[2,"Which scheduling algorithms must be named in the exam, with what detail?","FCFS, SJF, priority and round-robin, each with one strength and one weakness."],
[2,"Define deadlock.","A situation in which two or more processes are each waiting for a resource held by another process in the same group, so none can ever proceed; without intervention it persists indefinitely."],
[2,"State the four necessary conditions for deadlock.","Mutual exclusion, hold and wait, no preemption, circular wait; all four must hold simultaneously, and preventing any one prevents deadlock."],
[2,"Give the classic deadlock illustration.","Process A holds a printer and waits for a scanner; process B holds the scanner and waits for the printer; neither can proceed and neither releases what it holds."],
[2,"How do operating systems deal with deadlock?","Prevention (rule out one condition, for example request all resources at once); avoidance (grant a request only if safe, the Banker's Algorithm); detection and recovery (find circular waits, terminate or roll back a process); or ignore it when rare, as most desktop systems do."],
[3,"What is memory management?","Controlling and coordinating RAM: allocating portions to processes as needed and reclaiming them when processes finish, using a map of which memory is in use and by whom."],
[3,"What is memory protection?","The mechanism ensuring one process cannot access another's memory, so a buggy or malicious program cannot corrupt other programs or the OS; enforced in hardware by the kernel and user mode boundary."],
[3,"Explain paging.","Both physical memory and a process's logical address space are divided into fixed-size blocks: frames and pages. Pages need not be contiguous; a page table maps each page to the frame holding it and hardware translates addresses on the fly."],
[3,"What fragmentation does paging eliminate and what remains?","It eliminates external fragmentation (unusable gaps between blocks); internal fragmentation remains when a process's last page is only partly used."],
[3,"Explain segmentation.","Dividing a process into logical, variable-sized units (code, data, stack segments), matching how the programmer thinks; it reintroduces external fragmentation because variable-sized segments pack poorly."],
[3,"What is paged segmentation?","The combination used by most modern systems: a process is divided into logical segments and each segment is divided into fixed-size pages, giving the clarity of segmentation and the allocation efficiency of paging."],
[3,"What is virtual memory?","The illusion that each process has more memory than physical RAM, created by using part of the disk (page file or swap space) to extend RAM."],
[3,"How does virtual memory operate?","When RAM fills, the OS moves the least recently used pages to disk; when needed again they are loaded back, displacing others; the swapping is transparent to processes."],
[3,"What is thrashing?","Excessive swapping, in which the system spends more time moving pages in and out than doing useful work; reading a page from disk is thousands of times slower than from RAM; adding RAM is usually the correct remedy."],
[4,"What does file management do?","Organises, stores, retrieves and manages data through a hierarchical file system: creating, naming, copying, moving and deleting files, reading and writing, attributes, access control, space allocation, directory structure and concurrent access."],
[4,"What does device management do?","Controls peripherals through device drivers, giving applications a uniform interface (every storage device looks like a file) and queueing and ordering I/O requests when several processes want the same device."],
[4,"Explain the SCAN (elevator) algorithm.","The disk head moves steadily in one direction servicing every pending request on the way to the end of the disk, then reverses and does the same; it bounds the worst-case wait and greatly reduces head movement compared with serving requests in arrival order."],
[4,"What is C-SCAN?","A variant of SCAN in which the head jumps back to the start instead of reversing and services requests in one direction only, trading a little efficiency for more uniform waiting."],
[4,"Why does an SSD need no disk scheduling?","It has no moving head."],
[5,"Define the user interface.","The means through which a human interacts with the OS: the layer that receives commands and presents results; the two fundamental types are the CLI and the GUI."],
[5,"What is a CLI?","A text-based interface in which the user types commands at a prompt in a terminal and the OS prints results as text; examples Bash, Windows Command Prompt, PowerShell."],
[5,"Give examples of equivalent CLI commands.","Linux: ls -la /home/user/documents lists all files, including hidden, in detail; Windows: dir /a C:\\Users\\User\\Documents."],
[5,"What are the strengths of a CLI?","Scripting and automation (chaining commands in shell scripts), very fast for experts, and very low resource use, ideal for servers; weaknesses: memorising commands and typos."],
[5,"What is a GUI?","A visual interface of windows, icons, menus and buttons operated with a pointing device or touch; strength: intuitive discoverability; weakness: heavier and slower for repetitive tasks."],
[5,"Who pioneered the GUI?","Xerox PARC in the 1970s; popularised by Apple's Macintosh in 1984; then adopted by Microsoft Windows."],
[5,"What is the WIMP paradigm?","Windows, Icons, Menus and Pointers: the characteristics of most desktop GUIs."],
[5,"What is a desktop environment?","The graphical workspace after login: wallpaper, icons, a taskbar showing running applications and system status, and a start menu or launcher."],
[5,"What are a TUI and a VUI?","TUI: text-based user interface, in a terminal with text-drawn boxes and menus navigated by arrow keys (installers). VUI: voice user interface accepting spoken commands (Siri, Google Assistant, Alexa); hands-free and supplementary."],
[5,"How should CLI versus GUI be compared?","Without calling one better: a CLI wins for automation, expert speed and minimal resources (servers, scripting, embedded); a GUI wins for accessibility to non-experts, visual work and discoverability."],
[6,"What is booting?","Starting a computer from a powered-off or non-operational state and loading the operating system into memory; from bootstrapping, the paradox of needing a program to load the program that controls everything."],
[6,"What is a cold boot?","Starting from a completely powered-off state with RAM empty; the processor starts at a hardwired address in ROM, the firmware runs POST, finds the bootable device, loads the bootloader, which loads the kernel."],
[6,"What is a warm boot?","Restarting an already-running computer without removing power; the OS reloads but the full POST is skipped since the hardware was verified in the preceding cold boot, so it is faster."],
[6,"What triggers a warm boot?","The OS restart function, Ctrl+Alt+Delete, or a reset button; used to apply updates and recover from instability."],
[6,"Describe the BIOS.","The older firmware standard: 16-bit mode, reads the Master Boot Record (limited to four primary partitions and about 2 TB), keyboard-driven text setup screen."],
[6,"Describe UEFI.","The modern successor: 32 or 64-bit, boots from a GPT disk (many more partitions, beyond 2 TB), graphical mouse-navigable setup, faster, and Secure Boot, which verifies the bootloader and kernel have not been tampered with."],
[6,"Give the boot process step by step.","Power to motherboard; processor runs BIOS/UEFI ROM; firmware initialises hardware and runs POST; reads the boot sector (MBR or EFI System Partition) containing the bootloader; bootloader (GRUB, Windows Boot Manager) loads the kernel into RAM; kernel initialises drivers, mounts the file system, starts essential processes and presents the interface."],
[6,"What must a boot process answer state explicitly?","The bootloader and kernel are distinct steps, and POST runs only on a cold boot."],
[7,"Define a file system.","The method and data structure an OS uses to organise, store, manage and retrieve data on a storage device, imposing named files and a hierarchy of directories on raw storage."],
[7,"What is file metadata?","Each file's name, size, location (sectors occupied), type, creation and modification timestamps and access permissions; the file system also tracks free areas with allocation tables or bitmaps."],
[7,"Distinguish sector and cluster.","A sector is the smallest physical storage unit (512 or 4,096 bytes); a cluster or block is the smallest logical allocation unit chosen by the file system (4 KB to 64 KB)."],
[7,"Distinguish allocation table and inode.","Windows-lineage systems (FAT32, NTFS) use a central allocation table, a big linked list of clusters; Unix-lineage systems (ext4) use an inode per file with attributes and pointers to data blocks. Damage to a central table endangers the whole volume; inode damage is more contained."],
[7,"Describe FAT32.","File Allocation Table, 32-bit: old, simple, from Microsoft for DOS; universally compatible (USB drives, SD cards); files limited to 4 GB, volumes to 2 TB, no security or journaling."],
[7,"Describe NTFS.","New Technology File System: Windows default; practically unlimited size (up to 16 exabytes), access control, file encryption and compression, journaling, hard and symbolic links, alternate data streams."],
[7,"What is journaling?","Writing planned changes to a log before applying them, so after a crash mid-operation the file system can be recovered from the journal rather than left inconsistent."],
[7,"Describe ext4.","Fourth Extended File System: the default for most Linux distributions; mature, high-performance, journaling, large files and volumes, delayed allocation and extents for less fragmentation."],
[7,"Describe APFS.","Apple File System, introduced in 2017 to replace HFS+, designed for SSDs and flash: strong encryption, space sharing between volumes, instant snapshots, fast directory sizing, crash protection; used across macOS, iOS, iPadOS, watchOS, tvOS."],
[7,"Describe exFAT.","Extended FAT: Microsoft's successor to FAT32 for flash storage, supporting files over 4 GB and very large volumes with broad cross-platform support; standard for large SD cards and USB drives."],
[7,"Which file system suits a USB drive shared between Windows and macOS with files over 4 GB?","exFAT: FAT32 is ruled out by its 4 GB file limit and NTFS by poor native macOS write support; naming why alternatives fail earns credit."],
[7,"Which file system for a Windows system drive and for a Linux system drive?","NTFS for Windows; ext4 for Linux."],
[8,"Describe Microsoft Windows.","The most widely used desktop OS (over 70 percent of PCs); introduced in 1985 as a graphical shell on MS-DOS; Start Menu, Taskbar, File Explorer, Settings; proprietary; current versions Windows 10 and 11."],
[8,"Describe Linux.","A free, open-source kernel created by Linus Torvalds in 1991 under the GPL; with the GNU tools it forms GNU/Linux; dominates servers, cloud and supercomputers and underpins Android; comes as distributions."],
[8,"Name Linux distributions and desktop environments.","Ubuntu (beginner-friendly), Fedora (cutting-edge, Red Hat), Debian (stability), Kali (security testing), Red Hat Enterprise Linux (commercial); desktop environments GNOME, KDE Plasma, XFCE."],
[8,"Describe macOS.","Apple's proprietary Unix-based OS built on Darwin (BSD Unix and the Mach microkernel); Finder, Dock and Menu Bar; Apple Silicon (M1 to M4) since 2020; tight integration with Apple products; favoured by creative professionals."],
[8,"Describe Android.","Google's mobile OS, based on the Linux kernel; first released in 2008; the most widely used mobile OS; open source (AOSP) and customised by manufacturers; Google Play Store."],
[8,"Describe iOS.","Apple's proprietary mobile OS for the iPhone, based on Darwin and the XNU kernel; curated App Store with review of every app; Face ID, default encryption, App Tracking Transparency; long update support."],
[8,"What is a hypervisor?","Software (virtual machine monitor) that creates and manages virtual machines: software emulations of whole computers with their own virtual CPU, memory and storage, running their own OS in isolation."],
[8,"Distinguish Type 1 and Type 2 hypervisors.","Type 1 (bare-metal) runs directly on hardware with no host OS (VMware ESXi, Hyper-V; data centres and cloud). Type 2 (hosted) runs as an application on a host OS (VirtualBox, VMware Workstation)."],
[8,"What is the best way to compare two operating systems?","Along the same four axes for both: developer and licensing model, target hardware or domain, user interface philosophy, and one or two distinguishing features."]

const SHORT=[
["Distinguish between the kernel and the shell.","The kernel is the core of the OS: loaded at startup and permanently resident, it runs in a privileged mode and directly manages the processor, memory and devices, handling process scheduling and system calls. The shell is the component providing the user interface, a text command interpreter on command-line systems or the desktop environment on graphical ones, through which the user issues commands to the kernel. The same kernel can have different shells.",["Kernel is the privileged resident core","Kernel manages hardware and system calls","Shell is the user interface layer","Command-line or graphical shell"]],
["Explain the difference between kernel mode and user mode.","In kernel mode (supervisor mode) code has unrestricted access to all hardware and memory and can execute any instruction; only the kernel and trusted components run here. In user mode code has restricted privileges: it cannot access hardware directly or execute sensitive instructions and can touch only the memory allocated to it; ordinary applications run here. The separation is a safety boundary: a violation traps into the kernel, which can terminate the offending process, and user programs reach hardware only through system calls.",["Kernel mode: unrestricted","User mode: restricted","Applications in user mode","Violations trap to the kernel","System calls as the gateway"]],
["Distinguish between multiprogramming and multitasking.","Multiprogramming keeps several programs in memory and switches the CPU when the current one waits for I/O, so as to maximise CPU utilisation, mainly in batch-oriented settings. Multitasking extends this by switching among tasks in time slices (quanta) in round-robin fashion, whether or not a task has finished, to give a responsive, interactive experience in which the user works with several applications. Neither is truly simultaneous on a single processor.",["Multiprogramming maximises CPU utilisation","Switches on I/O wait","Multitasking is interactive","Time slices in round-robin"]],
["Why is a multiuser OS not necessarily the same as a multitasking OS?","Multiuser means that several people use the system at once, each with protected data. It requires multitasking, because the OS must run many users' processes concurrently, so every multiuser OS is multitasking. The reverse does not hold: a single-user multitasking OS, such as early versions of Windows, runs several programs for one user and is not multiuser. The implication runs in one direction only.",["Multiuser serves several users","Multiuser requires multitasking","Single-user multitasking exists (early Windows)","One-way implication"]],
["Distinguish between a distributed operating system and a network operating system.","A distributed OS manages independent networked computers and presents them as a single unified system with transparency, so that users do not know which machine does the work; it offers pooled power, fault tolerance and scaling. A network OS provides a layer of services on a LAN for sharing files, printers and internet access while each computer keeps its own OS and identity; users log on explicitly and know they are reaching a separate machine; there are servers and clients (Windows Server, Novell NetWare).",["Distributed: one unified system","Transparent to users","Network OS: independent identities","Resource sharing with servers and clients","Examples"]],
["Explain the difference between hard and soft real-time systems with one example each.","A hard real-time system treats a missed deadline as total system failure, so the deadline is absolutely inviolable (flight control, ABS brakes, pacemakers, missile guidance). A soft real-time system tolerates an occasional missed deadline, which only degrades quality (video streaming, online gaming, telecommunications). The discriminator is the consequence of a miss, not just speed.",["Hard: miss means failure","Example of hard","Soft: degraded quality, tolerable","Example of soft"]],
["Why can a process not move directly from the waiting state to the running state?","When its I/O or event completes, a waiting process becomes eligible to run but must first return to the ready queue. Several processes may be ready at the same time, and the scheduler, not the completion of the I/O, decides which is dispatched to the CPU. Hence the only route from waiting is to ready, then ready to running by dispatch.",["Waiting returns to ready first","Several processes may be ready","Scheduler decides who runs","Dispatch moves ready to running"]],
["Distinguish between paging and segmentation.","Paging divides physical memory into fixed-size frames and the process into pages of the same size; a page table maps pages to frames, pages need not be contiguous, external fragmentation is eliminated but some internal fragmentation remains in the last page. Segmentation divides a process into logical, variable-sized units (code, data, stack), matching the programmer's view, but variable sizes reintroduce external fragmentation. Most systems use paged segmentation.",["Paging: fixed-size pages and frames","Page table mapping","Fragmentation in paging","Segmentation: variable logical units","External fragmentation returns"]],
["What is virtual memory, and why is it needed?","Virtual memory creates the illusion that each process has more memory than the physical RAM, by using part of the disk (page file or swap space) as an extension of RAM. When RAM fills, least recently used pages are moved to disk and loaded back when needed, transparently to processes. It is needed because RAM is finite and many programs run at once; its cost is speed, since disk is thousands of times slower, and excessive swapping causes thrashing.",["Illusion of more memory","Page file or swap space on disk","LRU pages swapped","Needed as RAM is finite","Slower; thrashing"]],
["Distinguish between a cold boot and a warm boot.","A cold boot starts the computer from a fully powered-off state with RAM empty and runs the full POST hardware check; it is slower and is triggered by the power button. A warm boot restarts an already-running computer without removing power: the processor resets and the OS reloads, but POST is skipped because the hardware was already verified, so it is faster; it is triggered by the restart command, Ctrl+Alt+Delete or the reset button and used to apply updates.",["Cold: powered off, full POST","Warm: running, POST skipped","Speed difference","Triggers or uses"]],
["Why should the CLI be preferred over the GUI on a server with limited resources?","A CLI needs almost no graphics processing and very little memory, so all RAM and CPU go to the actual workload rather than drawing a desktop. It is also scriptable, so repetitive administration can be automated, and it is very fast for skilled administrators, who can work remotely over a text connection. A GUI would consume resources for no benefit on a server.",["Very low resource use","RAM and CPU for the workload","Scripting and automation","Fast for administrators"]],
["Distinguish between BIOS and UEFI on any three points.","BIOS is the older standard running in 16-bit mode, reading the Master Boot Record (four primary partitions, about 2 TB) with a keyboard-driven text setup screen. UEFI is the modern successor running in 32 or 64-bit mode, booting from a GPT disk (many more partitions, well beyond 2 TB), with a graphical mouse-navigable setup, faster boot and Secure Boot, which verifies the bootloader and kernel are untampered.",["Processor mode 16-bit versus 32/64-bit","MBR versus GPT and disk limits","Setup screen","Secure Boot","Speed"]],
["What is journaling in a file system, and why does it matter?","Journaling means that the file system writes planned changes to a log (the journal) before applying them. If a crash or power failure occurs mid-operation, the system can recover by consulting the journal instead of being left in an inconsistent state, such as half-written metadata. NTFS and ext4 are journaling file systems; FAT32 and exFAT are not.",["Changes logged before applying","Crash recovery from the journal","Avoids inconsistent state","NTFS and ext4"]],
["Distinguish between a Type 1 and a Type 2 hypervisor.","A Type 1 (bare-metal) hypervisor runs directly on the hardware with no host operating system beneath it (VMware ESXi, Microsoft Hyper-V); it is standard in data centres and cloud platforms, where one server hosts dozens of VMs. A Type 2 (hosted) hypervisor runs as an application on an existing host OS (VirtualBox, VMware Workstation), letting a developer run, for instance, a Linux VM inside Windows.",["Type 1 on bare hardware","Type 1 examples and use","Type 2 on a host OS","Type 2 examples and use"]]
];
const LONG=[
["Explain the functions of an operating system, describing each with an example.","The OS performs six core functions. Process management: creating processes, scheduling them for CPU time, tracking state and terminating them (switching between a browser and a music player). Memory management: tracking RAM, deciding how much each process gets and protecting one process's memory from another (virtual memory). File system management: organising storage into files and directories, with access and permissions (saving a document in a folder). Device management: controlling peripherals through drivers and giving a uniform interface (a print job passed to the printer driver). Security and protection: access control, authentication and permissions (user passwords). User interface: the CLI or GUI through which commands are issued. The OS also provides an abstract view of the hardware.",["Process management with example","Memory management","File system management","Device management","Security and protection","User interface"]],
["Draw and explain the process state diagram, describing the transition that causes each change of state.","A process has five states: new, ready, running, waiting and terminated. New to ready: the process is admitted and awaits the CPU. Ready to running: the scheduler dispatches it to the processor. Running to ready: its time slice expires and it returns to the ready queue. Running to waiting: it needs an I/O operation or event and waits. Waiting to ready: the I/O or event completes; the process returns to the ready queue, never straight to running, because the scheduler decides who runs among the ready processes. Running to terminated: the process exits and its resources are reclaimed. The diagram has arrows new, ready, running, terminated in a line, with running back to ready, running to waiting and waiting to ready.",["All five states named","New to ready: admitted","Ready to running: dispatched","Running to ready: time slice expires","Running to waiting: I/O wait","Waiting to ready (not running): I/O complete","Running to terminated"]],
["Explain any four CPU scheduling algorithms, stating one advantage and one disadvantage of each.","FCFS runs processes in arrival order; advantage: simple; disadvantage: the convoy effect, as a long process at the front delays all others. SJF runs the process with the smallest estimated execution time next; advantage: it provably minimises average waiting time; disadvantage: it needs times in advance and can starve long processes. Priority scheduling always runs the highest-priority ready process; advantage: important work first; disadvantage: low-priority processes may starve, mitigated by aging. Round-robin gives each process a fixed time quantum in rotation; advantage: fair and responsive for interactive use; disadvantage: a quantum too large degrades toward FCFS, too small causes context-switch overhead.",["FCFS with advantage and disadvantage","SJF with advantage and disadvantage","Priority with advantage and disadvantage","Round-robin with advantage and disadvantage","Terms convoy effect, starvation, aging, quantum"]],
["Explain the four necessary conditions for deadlock and describe two strategies an OS can use to deal with it.","A deadlock is a situation in which processes each wait for a resource held by another in the group, so none can proceed. It requires all four conditions at once: mutual exclusion (a resource is non-shareable), hold and wait (a process holding one resource waits for another), no preemption (a resource cannot be forcibly taken) and circular wait (a closed chain of processes each waiting for the next's resource). Strategies: prevention rules out one condition structurally, for example by requiring all resources to be requested at once (removing hold and wait); avoidance grants a request only if it cannot lead to deadlock (the Banker's Algorithm). Others: detection and recovery (find circular waits and terminate or roll back a process) or ignoring rare deadlocks, as most desktop systems do.",["Deadlock defined","Mutual exclusion","Hold and wait","No preemption","Circular wait","Two strategies explained"]],
["Explain paging and segmentation, and describe how modern operating systems combine them.","Paging divides physical memory into fixed-size frames and a process's logical address space into pages of the same size. A page table maps each page to the frame holding it, so pages need not be contiguous; allocation is simple and external fragmentation is eliminated, though internal fragmentation remains in the last page. Segmentation divides a process into logically meaningful, variable-sized segments (code, data, stack), matching the programmer's view, but it reintroduces external fragmentation. Most modern operating systems use paged segmentation: a process is divided into logical segments and each segment into fixed-size pages, giving the logical clarity of segmentation and the allocation efficiency of paging.",["Paging with frames, pages and page table","Fragmentation in paging","Segmentation with variable units","External fragmentation in segmentation","Paged segmentation combination"]],
["Trace the complete boot process of a computer from power-on to a usable desktop.","Pressing the power button sends power to the motherboard and components. The processor, by hardwired design, executes instructions from the BIOS or UEFI firmware ROM chip. The firmware initialises core hardware and runs POST, checking the processor, RAM, keyboard and storage; a fault is shown by beep codes or an error and halts the boot. On success it reads the first sector of the boot device (the MBR on older systems or the EFI System Partition on UEFI systems), which contains the bootloader. The bootloader (GRUB on Linux, Windows Boot Manager on Windows) loads the OS kernel into RAM. The kernel initialises device drivers, mounts the file system, starts essential processes (login manager, network services, daemons) and presents the interface. POST runs only on a cold boot.",["Power and firmware executes","POST","Boot sector read","Bootloader loads kernel","Kernel initialises drivers, file system, processes","Interface presented"]],
["Compare the CLI and the GUI across at least five dimensions, and state one scenario where each is clearly preferable.","Interaction: the CLI uses typed text commands, the GUI clicks or touches visual elements. Ease of use: the CLI needs memorised commands; the GUI is intuitive and discoverable. Speed for experts: the CLI is very fast; the GUI is slower for repetitive complex tasks. Automation: the CLI excels through scripting; the GUI is limited. Resource usage: the CLI is very low; the GUI is higher because of graphics. Error proneness: the CLI is higher (typos); the GUI is lower (menus). A CLI is clearly preferable for administering a remote server or automating nightly tasks; a GUI for general users doing everyday work or visual design.",["Five dimensions compared","CLI strengths","GUI strengths","Scenario for CLI","Scenario for GUI"]],
["Compare FAT32, NTFS, ext4, APFS, and exFAT on compatibility, maximum file size, and key features.","FAT32: universally compatible; files limited to 4 GB, volumes 2 TB; no journaling or security; for cross-platform removable media. NTFS: native to Windows; about 16 EB files; permissions, encryption, compression, journaling, links; Windows internal drives. ext4: native to Linux; files up to 16 TB; journaling, extents and delayed allocation; Linux internal drives. APFS: macOS, iOS and other Apple systems; about 8 EB; encryption, snapshots, space sharing, crash protection; Apple SSD storage. exFAT: modern cross-platform; about 16 EB; no journaling; removes the 4 GB limit; large SD cards and USB drives.",["FAT32 details","NTFS details","ext4 details","APFS details","exFAT details","Compatibility and size compared"]],
["Classify operating systems by type, giving one real-world example of each of the nine types described in this chapter.","Batch: payroll or bank statement generation. Multiprogramming: a mainframe keeping several jobs in memory to avoid idle CPU. Multitasking: Windows, macOS or Linux running several applications with time slices. Multiuser: a Linux or Unix server used by many people. Multiprocessing: a multi-core server using SMP. Real-time: flight control or a pacemaker (hard), video streaming (soft). Distributed: a large cloud platform presented as one system. Network OS: Windows Server or Novell NetWare on a LAN. Mobile: Android or iOS. One OS may hold several types at once.",["Batch example","Multiprogramming and multitasking examples","Multiuser and multiprocessing examples","Real-time with hard and soft","Distributed and network examples","Mobile example"]],
["Compare any three of the five major operating systems (Windows, Linux, macOS, Android, iOS) on developer, licensing, target domain, and one distinguishing feature.","Windows: developed by Microsoft; proprietary; desktops and laptops (over 70 percent share); distinguished by its vast hardware and software ecosystem and the Start Menu and Taskbar interface. Linux: developed by the community (kernel by Linus Torvalds, 1991); open source under the GPL; servers, cloud and supercomputers; distinguished by free source code and many distributions (Ubuntu, Fedora, Debian). macOS: developed by Apple; proprietary; Apple desktops and laptops, creative work; distinguished by Darwin-based Unix power, polished design and integration with Apple devices. Android: Google; open source (AOSP core); smartphones and tablets worldwide; Linux kernel and manufacturer customisation. iOS: Apple; proprietary; iPhone; curated App Store, strong privacy and long update support.",["Three systems chosen","Developer for each","Licence for each","Target domain for each","One distinguishing feature for each","Same axes used side by side"]]
];

["A hospital's patient monitoring system must alert staff within a guaranteed 500 milliseconds of a critical reading. Explain what class of operating system this requires and why an ordinary desktop OS would be unsuitable.","It requires a real-time operating system, specifically hard real-time, since a late alert could harm a patient and the deadline is inviolable. A real-time OS guarantees responses within strictly defined deadlines. An ordinary desktop OS is built for throughput and fairness: its scheduler, swapping, background tasks and updates can delay a response unpredictably, so it cannot guarantee the 500 ms limit.",["Real-time OS","Hard real-time as deadline is inviolable","Guaranteed response within deadline","Desktop OS has unpredictable delays"]],
["A new system administrator wants to automate a task that runs every night: back up a folder, compress it, and email a report. Recommend CLI or GUI, and justify the choice.","The CLI is the better choice. Commands can be chained into a shell script that performs the backup, compression and email without manual intervention, and the script can be scheduled to run every night. The CLI is scriptable, reliable and uses very few resources. A GUI relies on clicking and would need extra tools to automate, and is slower for repetitive tasks.",["Recommends CLI","Scripting and automation","Can be scheduled to run unattended","GUI limited for automation"]],
["Explain why an operating system enforces the kernel mode/user mode boundary even though it makes every system call slightly slower than letting applications access hardware directly.","The boundary is a safety mechanism. If applications could touch hardware and memory directly, one buggy or malicious program could corrupt other programs' memory, crash the whole machine or bypass security. With the boundary, a violation is detected by the processor and trapped into the kernel, which terminates only the offending process. System calls give the kernel a point at which to validate every request. The small cost in speed is worth the stability, protection and security of the whole system.",["Without it one program can corrupt others or crash the system","Violations trapped by the processor","Kernel validates requests","Stability and security outweigh small cost"]],
["A company wants to run both a Windows-only accounting package and a Linux-only development toolchain on the same physical server. Recommend an approach and justify it.","Use virtualisation. A hypervisor creates virtual machines, each with its own virtual CPU, memory and storage and running its own OS in isolation, so one VM can run Windows for the accounting package and another Linux for the toolchain on shared hardware. A Type 1 (bare-metal) hypervisor such as ESXi or Hyper-V is suited to a server; a Type 2 such as VirtualBox is easier for testing. It avoids buying separate machines and keeps the two environments isolated.",["Virtualisation with a hypervisor","Separate VMs run separate OS","Isolation","Type 1 for a server"]],
["A user complains their computer takes much longer to shut down and restart than it used to, though it starts fine from fully powered off. Suggest what might be happening and how to investigate it.","The cold boot is fine, so the hardware passes POST and the firmware and bootloader work. The slowness is during shutdown and warm restart, so the cause is probably in the operating system: services, drivers or applications that are slow to close, a pending update, or a failing driver. Investigate with the system monitor (Task Manager) to see which processes use CPU, memory and disk, check the event logs for shutdown errors, review start-up programs and recent updates or driver changes, and use system restore if a recent change caused it.",["Cold boot works so hardware and firmware fine","Problem in OS, services, drivers or applications","Check the system monitor and logs","Remedy such as updates, drivers or restore"]],
["Two processes each hold one resource the other needs, and neither will release what it holds. Identify which of the four deadlock conditions are illustrated, and propose one practical way the system could have prevented this situation.","All four conditions are illustrated: mutual exclusion (the resources cannot be shared), hold and wait (each holds one while waiting for the other), no preemption (neither can be forced to release) and circular wait (each waits for a resource held by the other). One prevention strategy is to require each process to request all the resources it needs at once, which removes hold and wait; alternatively impose a fixed order in which resources must be requested, which removes circular wait.",["Mutual exclusion","Hold and wait","No preemption","Circular wait","A valid prevention method"]]

/* ---------- scheduling ---------- */
function simulate(alg,A,B,P,q){
  const n=B.length,rem=B.slice(),done=Array(n).fill(false),ct=Array(n).fill(0),g=[];let t=0,fin=0;
  const push=(i,s,e)=>{if(g.length&&g[g.length-1].i===i&&g[g.length-1].e===s)g[g.length-1].e=e;else g.push({i,s,e});};
  if(alg==="rr"){
    const queue=[],seen=Array(n).fill(false);
    const adm=()=>{for(let i=0;i<n;i++)if(!seen[i]&&A[i]<=t){seen[i]=true;queue.push(i);}};
    adm();
    while(fin<n){
      if(!queue.length){t=Math.min(...A.filter((a,i)=>!seen[i]));adm();continue;}
      const i=queue.shift(),run=Math.min(q,rem[i]);push(i,t,t+run);t+=run;rem[i]-=run;adm();
      if(rem[i]>0)queue.push(i);else{done[i]=true;ct[i]=t;fin++;}
    }
  }else{
    while(fin<n){
      let c=[];for(let i=0;i<n;i++)if(!done[i]&&A[i]<=t)c.push(i);
      if(!c.length){t=Math.min(...A.filter((a,i)=>!done[i]));continue;}
      let i;
      if(alg==="fcfs")i=c.reduce((a,b)=>A[b]<A[a]?b:a);
      else if(alg==="sjf")i=c.reduce((a,b)=>B[b]<B[a]?b:a);
      else i=c.reduce((a,b)=>P[b]<P[a]?b:a);
      push(i,t,t+B[i]);t+=B[i];done[i]=true;ct[i]=t;fin++;
    }
  }
  return {g,ct,wt:ct.map((c,i)=>c-A[i]-B[i]),tt:ct.map((c,i)=>c-A[i])};
}

const STATES=["new","ready","running","waiting","terminated"];
const TRANS={"new>ready":"admitted","ready>running":"dispatched by the scheduler","running>ready":"time slice expires (pre-emption)","running>waiting":"waits for I/O or an event","waiting>ready":"I/O or event completes","running>terminated":"exit"};

/* ---------- deadlock ---------- */
function deadRes(){
  const c=[L.c1,L.c2,L.c3,L.c4],n=c.filter(x=>x==="y").length;
  let h=n===4?badb("All four conditions hold: deadlock is <b>possible</b> (and with single-instance resources a circular wait is a deadlock)."):okb("Only "+n+" of 4 conditions hold: deadlock <b>cannot</b> occur. Removing any one condition is a method of prevention.");
  const edges=String(L.wf).split(",").map(x=>x.trim()).filter(Boolean).map(x=>x.split(">").map(y=>y.trim()));
  let w="";
  if(!edges.length||edges.some(e=>e.length!==2||!e[0]||!e[1]))w=note("Enter edges as A>B separated by commas. P1>R1 means process P1 requests R1; R1>P2 means R1 is held by P2.");
  else{
    const adj={};edges.forEach(e=>{(adj[e[0]]=adj[e[0]]||[]).push(e[1]);adj[e[1]]=adj[e[1]]||[];});
    const col={};let cyc=null;
    const dfs=(u,path)=>{col[u]=1;path.push(u);for(const v of adj[u]){if(col[v]===1){cyc=path.slice(path.indexOf(v)).concat(v);return true;}if(!col[v]&&dfs(v,path))return true;}path.pop();col[u]=2;return false;};
    for(const u of Object.keys(adj)){if(!col[u]&&dfs(u,[]))break;}
    w=cyc?badb("Cycle found: <b>"+cyc.join(" → ")+"</b>. With one instance of each resource this is a deadlock (circular wait).")  :okb("No cycle: no circular wait, so no deadlock.");
  }
  return {dlres:h,wfres:w};
}

function pageRes(){

  if(!(ps>0)||!(la>=0)||!(pf>=0)||!(sz>0))return {pgres:note("Enter positive whole numbers: page size, logical address, frame number and process size (bytes).")};
  const pn=Math.floor(la/ps),off=la%ps,ph=pf*ps+off,pages=Math.ceil(sz/ps),frag=pages*ps-sz;
  let h=okb("Logical address "+la+" = page <b>"+pn+"</b>, offset <b>"+off+"</b> ("+la+" ÷ "+ps+").");
  h+=okb("If page "+pn+" is in frame "+pf+": physical address = "+pf+" × "+ps+" + "+off+" = <b>"+ph+"</b>.");
  h+=okb("A process of "+sz+" bytes needs <b>"+pages+"</b> pages and has <b>"+frag+"</b> bytes of internal fragmentation in its last page.");

/* ---------- disk scheduling ---------- */
function diskRes(){
  const h0=parseInt(L.dh,10),q=nums(L.dq),mx=parseInt(L.dm,10);
  if(!(h0>=0)||!q.length||q.length>20||q.some(x=>!(x>=0)||x>mx)||!(mx>0)||h0>mx)return {dkres:note("Enter a head position, up to 20 request cylinders and the highest cylinder; all values must be between 0 and the highest cylinder.")};
  const up=q.filter(x=>x>=h0).sort((a,b)=>a-b),dn=q.filter(x=>x<h0).sort((a,b)=>b-a);
  let order,total,tip="";
  if(L.dalg==="fcfs"){order=q.slice();let p=h0;total=0;order.forEach(x=>{total+=Math.abs(x-p);p=x;});}
  else if(L.dalg==="scan"){order=up.concat(dn);total=(mx-h0)+(dn.length?mx-dn[dn.length-1]:0);tip="The head runs to cylinder "+mx+" before reversing.";}
  else{const lo=dn.slice().reverse();order=up.concat(lo);total=(mx-h0)+(lo.length?mx+lo[lo.length-1]:0);tip="The head runs to "+mx+", jumps back to 0 (counted as "+mx+") and continues upward.";}
  let h=okb("Service order: <b>"+order.join(", ")+"</b>");
  h+=okb("Total head movement = <b>"+total+"</b> cylinders.");
  if(tip)h+='<p class="hint">'+tip+'</p>';
  h+='<p class="hint">SCAN (elevator) serves one direction then reverses; C-SCAN always serves in one direction only, giving more uniform waiting. This tool starts SCAN and C-SCAN moving upward.</p>';
  return {dkres:h};
}
