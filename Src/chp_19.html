const NOTES=[
["1.1 Inheritance basics","{{Inheritance}} is the mechanism by which one class acquires the members (data and functions) of another. The class whose members are inherited is the {{base class}} (parent, superclass); the class that inherits is the {{derived class}} (child, subclass). Shared members are written {{once}} in the base, so a bug is fixed in one place and the hierarchy mirrors natural classification. Inheritance models an {{is-a}} relationship (a Car is a Vehicle); a {{has-a}} relationship is implemented with {{composition}}, a member object. Syntax: class Derived : visibilityMode Base { };. A derived object is built in two layers: a complete {{base part}} (including private members) followed by the {{derived part}}. {{Constructors}}, the destructor and friend declarations are {{not inherited}}; private base members are present in the object but {{never directly accessible}}. A {{protected}} member is closed to outside code but open to derived classes."],
["1.2 Types of inheritance","{{Single}} inheritance has one base. {{Multiple}} inheritance has two or more bases listed after the colon, separated by commas (Duck : public Flyable, public Swimmable); if two bases declare the same name the call is {{ambiguous}} and must be qualified, d.Flyable::move();. {{Multilevel}} inheritance is a chain (Animal, Mammal, Dog). {{Hierarchical}} inheritance has one base and several derived classes. {{Hybrid}} inheritance is a combination. In the {{diamond problem}} a TeachAsst inherits from Student and Employee, each of which inherits from Person, so it holds {{two}} Person sub-objects and t.id is ambiguous. The cure is {{virtual inheritance}} (virtual public Person): one shared Person, built {{once}} and {{first}}."],
["1.3 Visibility modes","The {{visibility mode}} (public, protected or private) is written between the colon and the base name and acts as a {{ceiling}} on access. In {{public}} inheritance access levels are preserved; it is the only mode that models {{is-a}} (the Liskov Substitution Principle). In {{protected}} inheritance public members become protected. In {{private}} inheritance public and protected members become private. The default is {{private}} for a class and {{public}} for a struct. A base class's {{private}} members are not accessible in any mode. The mode changes what {{outside code}} and {{further-derived}} classes see, not what the derived class itself may use. Conversion from a derived pointer to a base pointer is allowed only for {{public}} inheritance."],
["1.4 Constructors and destructors in inheritance","Construction runs the {{base}} constructor first, then {{member objects}} in declaration order, then the {{derived body}}. Destruction is the exact {{reverse}}: derived body, members, base. If the base has only a parameterized constructor, the derived constructor must call it in the {{member initializer list}}: Car(string b, int d) : Vehicle(b), doors(d). If it names none, the compiler calls the base {{default}} constructor; if there is none, that is a {{compile error}}. The list order does not change the real order: the base is always built first, then members in {{declaration}} order. A hand-written {{copy constructor}} in a derived class must pass the object to the base copy constructor, Good(const Good &o) : Acc(o); if it does not, the base part is built with the {{default}} constructor."],
["1.5 Function overriding and hiding","A derived class {{overrides}} a base function when it defines a function with exactly the same {{name}}, {{parameter list}} and return type. {{Overloading}} is in the same class with different parameters and is resolved at compile time; overriding needs inheritance and identical signatures. The base version is reached with the scope resolution operator, Animal::makeSound(); inside the derived class, or d.Animal::makeSound(); from outside. {{Name hiding}}: a derived function named show hides {{every}} base function called show, whatever its parameters. The cures are {{using Base::show;}} in the derived class or an explicit d.Base::show(5);."],
["1.6 Virtual functions and polymorphism","Without {{virtual}}, a call through a base pointer is chosen from the {{static type}} of the pointer at compile time ({{static binding}}), so an Animal * calls Animal's function even for a Dog. Declaring the base function {{virtual}} switches on {{dynamic binding}}: the version is chosen at run time from the {{actual type}} of the object ({{run-time polymorphism}}). It works only through a {{pointer}} or {{reference}}; copying a derived object into a base variable causes {{object slicing}}. The compiler adds a hidden {{vptr}} to each object, pointing to a per-class {{vtable}}. {{override}} (C++11) makes a mismatch a compile error; {{final}} forbids further overriding. A polymorphic base needs a {{virtual destructor}}, otherwise delete through a base pointer skips the derived destructor. A {{constructor}} can never be virtual, and virtual calls inside a constructor or destructor run the {{current}} class's version."],
["1.7 Abstract classes","A {{pure virtual function}} is a virtual function with no body, declared with {{= 0}}: virtual double calculateArea() = 0;. A class with at least one is an {{abstract class}}: it {{cannot be instantiated}}, but pointers and references to it are legal. A derived class that overrides {{every}} inherited pure virtual function is a {{concrete class}}; one that leaves even one unimplemented is itself abstract. Abstract classes enforce a consistent {{interface}} and enable generic code: an array of Shape * handled by one loop. A pure virtual function may still have a {{body}} defined outside the class, and a pure virtual destructor must have one."]
];

["State two advantages of inheritance.","Shared members are written once in the base class, so code is reused and a bug is fixed in one place. The hierarchy mirrors the natural classification of objects, and code written for a base class also works for every derived class, including ones added later, which makes the program easy to extend.",["Code reuse","One place to fix","Natural hierarchy or extensibility"]],
["Distinguish multiple inheritance from multilevel inheritance.","In multiple inheritance a derived class has two or more base classes listed after the colon, for example Duck : public Flyable, public Swimmable. In multilevel inheritance the classes form a chain: Animal, then Mammal derived from Animal, then Dog derived from Mammal, so Dog inherits transitively from every class above it.",["Multiple: several bases","Multilevel: a chain","Example of each"]],
["Distinguish multiple inheritance from hierarchical inheritance.","Multiple inheritance has many base classes feeding into one derived class (the fan in). Hierarchical inheritance has one base class from which many derived classes inherit (the fan out), for example Shape with Circle, Square and Triangle.",["Multiple: many bases, one derived","Hierarchical: one base, many derived","Example"]],
["What is the diamond problem, and how is it solved?","When Student and Employee both inherit from Person and TeachAsst inherits from both, each path carries its own copy of Person, so a TeachAsst holds two Person sub-objects and a reference to id is ambiguous. It is solved by virtual inheritance: class Student : virtual public Person and class Employee : virtual public Person, so the most-derived class holds a single shared Person.",["Two copies, ambiguity","virtual inheritance","Single shared base"]],
["Why is a protected member more useful to a derived class than a private one?","A private member is invisible even to derived classes, so they cannot use it. A protected member is closed to outside code but accessible in derived classes, so data that subclasses legitimately need can be shared with them without being exposed to everyone.",["Private invisible to derived","Protected open to derived","Closed to outsiders"]],
["Distinguish function overloading from function overriding.","Overloading is several functions with the same name and different parameter lists in the same class, resolved at compile time, and needs no inheritance. Overriding is a derived class redefining a base function with an identical signature, needs inheritance, and is resolved at compile time or at run time if the function is virtual.",["Same class vs base and derived","Different vs identical signature","Compile time vs run time if virtual"]],
["How can the base-class version of an overridden function still be called?","With the scope resolution operator: inside the derived function write Animal::makeSound(); to run the base version first and then add the derived behaviour; from outside write d.Animal::makeSound(); on a Dog object.",["Base::function()","Inside the derived class","From outside with the object"]],
["Distinguish static binding from dynamic binding.","Static binding is decided at compile time from the declared type of the pointer or reference and is the default. Dynamic binding is decided at run time from the actual type of the object; it needs a virtual function called through a base pointer or reference, and costs one extra pointer per object and a table lookup per call.",["Compile time vs run time","Declared type vs actual type","Needs virtual"]],
["What is object slicing? Give a one-line example.","Copying a derived object into a base variable cuts off the derived part, so the variable is really a base object and even a virtual call runs the base version. Example: Dog d; Animal a = d; a.speak(); runs Animal::speak.",["Derived part cut off","Base variable by value","Example"]],
["Why must the destructor of a polymorphic base class be virtual?","If a derived object is deleted through a base pointer and the destructor is not virtual, the call is bound statically to the base destructor, so the derived destructor never runs, resources the derived class acquired leak, and the behaviour is undefined. A virtual destructor runs the derived destructor first and then the base one.",["Static binding to base destructor","Derived destructor skipped, leak","Virtual runs derived then base"]],
["Why can an abstract class not be instantiated, yet pointers to it are allowed?","It has a pure virtual function with no implementation, so an object of it would have a function it cannot run. A pointer or reference holds only the address of an object of some concrete derived class, so it is legal, and it allows generic code such as an array of Shape pointers.",["Pure virtual has no body","Pointer needs no object of that class","Enables polymorphic code"]],
["What does the override keyword do, and why is it useful?","override is written after the parameter list of a derived function to state that it is meant to override a virtual function. If nothing in the base matches, because of a typo or a missing const, the compiler reports an error instead of silently creating an unrelated new function while the base version keeps running.",["States the intent","Compile error on mismatch","Prevents silent bug"]],
["State the order in which the constructors and destructors run for class SportsCar : public Car, where Car : public Vehicle and Car has an Engine member.","Construction: Vehicle, Engine (Car's member), Car, SportsCar. Destruction is the exact reverse: SportsCar, Car, Engine, Vehicle. Base first, then members, then the derived body; destruction body, members, base.",["Vehicle, Engine, Car, SportsCar","Reverse for destruction","Base, members, body"]],
["Why does a derived copy constructor have to call the base copy constructor?","If it does not, the base part is built with the base default constructor and the copied data is lost. Writing Good(const Good &o) : Acc(o) passes the object on, so the base part is copied too: output Acc copy Good copy.",["Base built with default otherwise","Acc(o) in initializer list","Data lost"]],
["What is the cascade rule for pure virtual functions?","A derived class must override every inherited pure virtual function to become concrete. If it leaves even one unimplemented it is itself abstract and cannot be instantiated, so the requirement passes down the hierarchy until all are implemented.",["Override all","Else still abstract","Passes down the hierarchy"]]

["Explain the need for inheritance with a Vehicle, Car, Truck hierarchy, and describe the is-a test.","Cars, trucks and motorcycles all have a brand, a speed and a fuel capacity and can start, stop and accelerate. Without inheritance each class repeats those members and a bug in start() must be fixed in three places. With inheritance the shared members are written once in a Vehicle base class; Car adds numberOfDoors, Truck adds cargoCapacity. class Car : public Vehicle { public: int numberOfDoors; }; The advantages are code reuse, one place to fix, a natural hierarchy and the fact that code written for a Vehicle works for a Car. The design test is the is-a relationship: if X is a Y is true and sensible, X may inherit from Y (a Car is a Vehicle). If the honest sentence is X has a Y (a Car has an Engine) the tool is composition: an Engine member inside Car. Inheritance is not a way to borrow code: a Stack inheriting from Array would make every array operation legal on a stack.",["Repeated members without inheritance","Vehicle base with Car and Truck","Syntax class Car : public Vehicle","Is-a versus has-a (composition)"]],
["Explain the five types of inheritance with a class diagram and code skeleton for each.","Single: one base, class Dog : public Animal { }. Multiple: two or more bases, class Duck : public Flyable, public Swimmable { }; same-named members in two bases are ambiguous and must be qualified. Multilevel: a chain, class Mammal : public Animal { }; class Dog : public Mammal { }; Dog inherits transitively. Hierarchical: one base, many derived, class Circle : public Shape { }; class Square : public Shape { }; Hybrid: a combination, for example Student and Employee derived from Person and TeachAsst derived from both. Diagrams: arrows point from derived to base. Memory aid: count the bases, then look at the shape; multiple has the fan in, hierarchical the fan out. Hybrid hierarchies create the diamond problem, where TeachAsst has two Person sub-objects; virtual inheritance (virtual public Person) gives one shared copy.",["Single, multiple, multilevel, hierarchical, hybrid defined","Code skeleton for each","Diagram direction","Diamond and virtual inheritance"]],
["Explain the three visibility modes, and draw the table showing how each base member's access changes.","The visibility mode is written between the colon and the base name and acts as a ceiling on access: it can only tighten, never loosen. Public inheritance preserves access levels; it models is-a and is the commonest. Protected inheritance makes public members protected. Private inheritance makes public and protected members private; it is the default for a class (a struct defaults to public). Table: base public becomes public, protected, private in public, protected, private inheritance respectively; base protected becomes protected, protected, private; base private is not accessible in any mode. The mode changes what outside code and further derived classes see, not what the derived class itself may use: inside D2 : private Base, b and c are still usable but y.c = 5 from main is an error. Conversion from a derived pointer to a base pointer is allowed only for public inheritance.",["Mode is a ceiling","Description of each mode","Nine-cell table","Base private never accessible; defaults"]],
["Explain the order of constructor and destructor calls in inheritance, and how arguments are passed to a base constructor, with a program and its output.","Construction runs the base constructor first, then member objects in declaration order, then the derived body, because the base part must exist before the derived part. Destruction is the exact reverse. class Vehicle { public: string brand; Vehicle(string b) : brand(b) { cout << \"Vehicle constructor: brand = \" << brand << endl; } }; class Car : public Vehicle { public: int doors; Car(string b, int d) : Vehicle(b), doors(d) { cout << \"Car constructor: doors = \" << doors << endl; } }; Car myCar(\"Honda\", 4); prints Vehicle constructor: brand = Honda, then Car constructor: doors = 4. The base call must be in the member initializer list. If the derived constructor names none, the base default constructor is called; if there is none, it is a compile error (fix Bike() : Vehicle(\"Unknown\") {}). The initializer list order does not change the real order.",["Base, members, body; destruction reversed","Initializer list passes arguments","Program with output","Missing default constructor error"]],
["Explain function overriding, the difference from overloading, and name hiding.","A derived class overrides a base function by defining one with exactly the same name, parameter list and return type; for objects of the derived type the derived version replaces the inherited one (Dog::makeSound versus Animal::makeSound). The base version is still reachable with Animal::makeSound(); Overloading is the same name with different parameters in one class, resolved at compile time, needing no inheritance; overriding needs inheritance and identical signatures and is resolved at run time if virtual. Name hiding: a derived function named show hides every base function named show, so d.show(5) fails when Derived defines only show(). Cures: using Base::show; in the derived class, or d.Base::show(5);. Overriding by accident (a changed parameter or const) silently creates a new function; override turns it into a compile error.",["Definition of overriding","Overloading versus overriding","Base:: to call the base version","Name hiding and using"]],
["Explain virtual functions: the problem with non-virtual calls through a base pointer, the solution, and a program with Animal, Dog and Cat.","A base pointer may hold a derived object, which is how generic code is written. Without virtual the function is chosen from the static type of the pointer at compile time (static binding), so Animal *ptr = new Dog(); ptr->makeSound(); prints Generic animal sound. Declaring the base function virtual switches on dynamic binding: the version is chosen at run time from the actual object. class Animal { public: virtual void makeSound() { cout << \"Generic animal sound.\" << endl; } }; class Dog : public Animal { public: void makeSound() override { cout << \"Woof!\" << endl; } }; class Cat likewise prints Meow!. Animal *animals[3] = { new Animal, new Dog, new Cat }; a loop calling animals[i]->makeSound(); prints Generic animal sound., Woof!, Meow!. Adding a Cow class leaves the loop unchanged: run-time polymorphism. It works only through a pointer or reference; Animal a = d slices. Behind the scenes each object has a vptr to its class's vtable.",["Static binding problem","virtual and dynamic binding","Animal, Dog, Cat program with output","Pointer or reference only; vptr and vtable"]],
["Explain virtual destructors and why they are needed, with an example.","When a class is used polymorphically, derived objects are deleted through a base pointer: Animal *p = new Dog; delete p;. If the destructor is not virtual, the call binds statically to the base destructor, so the derived destructor never runs, anything the derived class acquired leaks, and the behaviour is undefined. class B2 { public: virtual ~B2() { cout << \"B2 dtor\\n\"; } }; class D2 : public B2 { public: ~D2() { cout << \"D2 dtor\\n\"; } }; B2 *q = new D2; delete q; prints D2 dtor then B2 dtor: correct cleanup. Rule of thumb: if a class has any virtual function, give it a virtual destructor. Constructors can never be virtual, and virtual calls inside a constructor or destructor do not reach the derived class.",["Delete through base pointer","Non-virtual consequence","Example with output","Rule of thumb; constructors never virtual"]],
["Explain abstract classes and pure virtual functions with a Shape program that computes areas polymorphically.","A pure virtual function has no body and is declared with = 0: virtual double calculateArea() = 0;. A class with at least one is abstract: it cannot be instantiated (Shape s; is an error) but pointers and references to it are legal. A derived class overriding every pure virtual function is concrete; leaving one unimplemented keeps it abstract. class Shape { public: virtual double calculateArea() = 0; virtual void display() { cout << \"Area: \" << calculateArea() << endl; } virtual ~Shape() {} }; class Circle : public Shape { double radius; ... calculateArea() override { return 3.14159 * radius * radius; } }; class Rectangle likewise. Shape *shapes[2] = { new Circle(5.0), new Rectangle(4.0, 6.0) }; a loop calling display() prints Area: 78.5397 and Area: 24. The abstract class enforces a consistent interface and enables generic code.",["Pure virtual and abstract defined","Cannot instantiate; pointers allowed","Shape, Circle, Rectangle program","Output and purpose"]]
];

["A school system has Person, Student and Teacher. Which class should be the base? Which members belong in it, and which in the derived classes?","Person should be the base: a Student is a Person and a Teacher is a Person. Members shared by both, such as name, age and the display of them, belong in Person. Student adds its own members such as roll number and marks; Teacher adds subject and salary or employee number. class Student : public Person { ... }; class Teacher : public Person { ... }; This is hierarchical inheritance.",["Person is the base","Shared members in Person","Own members in derived","Is-a test passes"]],
["A Car has an Engine. A student proposes class Car : public Engine. Explain why this is a poor design, and what to use instead.","A Car is not an Engine: the honest sentence is a Car has an Engine, which is has-a, not is-a. Public inheritance would claim a Car can be used anywhere an Engine is expected and expose every Engine operation on a Car. The right tool is composition: class Car { Engine e; };. Then the Engine is built before the Car body and destroyed after it.",["Fails the is-a test","Has-a means composition","Engine member inside Car"]],
["A base-class pointer holds a Dog, but the call p->speak() prints the Animal sound. Give two possible causes, and the fix for each.","Cause one: speak is not virtual in the base, so static binding uses the pointer's type; fix: declare it virtual in Animal. Cause two: the derived function does not really override (a different parameter or a missing const), so it is a new function; fix: make the signatures identical and write override so the compiler catches it. A third cause is object slicing if the object was copied into an Animal variable instead of a pointer or reference.",["Missing virtual","Signature mismatch","Fix with virtual and override"]],
["A program deletes a Derived object through a Base *, and the derived class's memory is never freed. Explain why, and the one-word cure.","The base destructor is not virtual, so delete through the base pointer is bound statically to the base destructor. The derived destructor never runs, so anything the derived class acquired leaks, and the behaviour is undefined. The cure is virtual: declare the base destructor virtual, virtual ~Base() {}.",["Non-virtual destructor","Static binding to base","virtual"]],
["A graphics program must draw Circle, Square and Triangle objects stored in one array. Design the base class so that a single loop can draw all of them, and so that nobody can create a plain shape.","Make Shape an abstract class with a pure virtual function: class Shape { public: virtual void draw() = 0; virtual ~Shape() {} }; Each of Circle, Square and Triangle overrides draw(). Store them in an array of Shape pointers, Shape *shapes[3], and loop calling shapes[i]->draw(), which runs the right version at run time. Because Shape has a pure virtual function, Shape s; does not compile, so a plain shape cannot be created. The virtual destructor makes delete correct.",["Pure virtual draw()","Array of Shape pointers and one loop","Cannot instantiate Shape","Virtual destructor"]],
["Class W : public V has constructor W() {} and V has only V(int x). The program fails to compile. Explain and fix it.","W() does not name a base constructor, so the compiler calls the base default constructor V(), but V has none because writing V(int) removed the implicit one. The fix is to call the base constructor in the member initializer list: W() : V(0) {}. The call cannot be placed in the body because the base part is built before the body runs.",["Implicit V() missing","Fix in initializer list","Not in the body"]],
["In class B { private: int a; protected: int b; public: int c; }; and class D : private B { };, which of a, b, c can a member function of D use, and which can main use through a D object? Explain.","A member function of D can use b and c, but not a, which is private in B and never accessible in a derived class. Private inheritance makes b and c private in D, so they remain usable inside D. main can use none of them through a D object, because b and c are private in D and a is not accessible at all.",["a never accessible","b and c usable inside D","none from main","Private mode makes them private"]],
["A derived-class copy constructor Bad(const Bad &o) { } is written for class Bad : public Acc, and copies lose the base data. Explain the cause and the fix.","The constructor does not name the base copy constructor, so the base part is built with the base default constructor and the copied data is lost; only Bad copy prints. The fix is to pass the object to the base copy constructor in the initializer list: Bad(const Bad &o) : Acc(o) { }, which prints Acc copy Bad copy.",["Base built with default","Data lost","Acc(o) in the initializer list"]]
];

function secCounts(){

  CARDS.forEach((k,i)=>{if(S.cards.sec<0||k[0]===S.cards.sec)c[store.box[i]||0]++;});return c;

function viewCards(){
  const c=secCounts(),tot=c[0]+c[1]+c[2]+c[3];
  let h='<p class="hint">Read the question, answer in your head or in the box, then flip. Rate honestly. Missed cards come back within a few cards; a card is mastered after two confident passes in separate sessions.</p>';
  h+='<div class="subnav">'+['<button class="chip" data-act="csec" data-v="-1" aria-pressed="'+(S.cards.sec<0)+'">All topics</button>'].concat(SECS.map((s,i)=>`<button class="chip" data-act="csec" data-v="${i}" aria-pressed="${S.cards.sec===i}">${esc(s)}</button>`)).join("")+"</div>";
  h+=`<div class="subnav"><button class="chip" data-act="cord" data-v="0" aria-pressed="${!S.cards.ordered}">Shuffled</button><button class="chip" data-act="cord" data-v="1" aria-pressed="${S.cards.ordered}">Chapter order</button></div>`;
  h+=`<div class="stats"><div class="stat"><b>${c[0]}</b><span>New</span></div><div class="stat"><b>${c[1]}</b><span>Learning</span></div><div class="stat"><b>${c[2]}</b><span>Review</span></div><div class="stat"><b>${c[3]}</b><span>Mastered</span></div></div>`;
  h+=`<div class="bar" aria-hidden="true"><i style="width:${tot?Math.round(c[3]/tot*100):0}%"></i></div>`;
  const q=S.cards.queue;
  if(!q.length){
    h+=`<div class="panel"><h3>${c[3]===tot?"Every card in this set is mastered":"Session complete"}</h3><p class="hint">${S.cards.done} cards rated this session.</p><div class="row"><button class="btn primary" data-act="cnext">Start another round</button><button class="btn" data-act="creset">Reset progress for this set</button></div></div>`;
    return h;
  }
  const id=q[0],k=CARDS[id];
  h+=`<div class="panel fc"><div class="lab">Question · ${esc(SECS[k[0]])} · ${q.length} left</div><div class="q">${esc(k[1])}</div>`;
  h+=`<input type="text" id="guess" placeholder="Type what you remember (optional)" value="${esc(S.cards.guess)}" autocomplete="off">`;
  if(!S.cards.flip){h+='<div class="row"><button class="btn primary" data-act="flip">Show answer</button><span class="hint">or press Space</span></div>';}
  else{
    h+=`<div class="lab">Answer</div><div class="a">${esc(k[2])}</div><div class="row"><button class="btn bad" data-act="rate" data-v="miss">Missed it (1)</button><button class="btn warn" data-act="rate" data-v="almost">Almost (2)</button><button class="btn good" data-act="rate" data-v="got">Got it (3)</button></div>`;
  }
  return h+"</div>";
}
function viewCloze(){
  let h='<p class="hint">Read each passage and say the hidden term aloud before you tap it. Tap again to hide it.</p><div class="row"><button class="btn" data-act="revall">Reveal all</button><button class="btn" data-act="hideall">Hide all</button></div>';
  NOTES.forEach(n=>{
    const body=esc(n[1]).replace(/\{\{(.+?)\}\}/g,(m,a)=>`<button class="blank" data-act="blank" style="min-width:${Math.max(4,a.length)}ch" aria-label="Hidden term, press to reveal"><span class="ans">${a}</span></button>`);
    h+=`<div class="panel note"><h3>${esc(n[0])}</h3><p>${body}</p></div>`;
  });
  return h;
}
function viewCover(){
  let h='<p class="hint">Cover the answers, say what belongs in each cell, then tap it to check. Switch the mask to quiz yourself from the other direction.</p>';
  TABLES.forEach((t,ti)=>{
    const m=S.tmode[ti]||"a";
    h+=`<div class="panel"><div class="row" style="justify-content:space-between"><h3>${esc(t.t)}</h3><div class="subnav"><button class="chip" data-act="tmode" data-t="${ti}" data-v="a" aria-pressed="${m==="a"}">Hide answers</button><button class="chip" data-act="tmode" data-t="${ti}" data-v="b" aria-pressed="${m==="b"}">Hide first column</button><button class="chip" data-act="tmode" data-t="${ti}" data-v="o" aria-pressed="${m==="o"}">Show all</button></div></div><div class="tbl"><table><thead><tr>${t.c.map(c=>`<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>`;
    t.r.forEach(r=>{h+="<tr>"+r.map((c,ci)=>{const hid=(m==="a"&&ci>0)||(m==="b"&&ci===0);return `<td><span class="m${hid?" hid":""}" data-act="mask"${hid?' tabindex="0" role="button" aria-label="Hidden, press to reveal"':""}>${esc(c)}</span></td>`;}).join("")+"</tr>";});
    h+="</tbody></table></div></div>";
  });
  return h;
}
function viewDump(){
  const d=DUMPS[S.dump.i];

  if(!S.dump.checked){h+='<div class="row"><button class="btn primary" data-act="dcheck">Compare with key points</button></div>';}

  }
  return h+"</div>";
}

function traceRes(){
  const parts=L.tr.split(",").map(s=>s.trim()).filter(Boolean);
  if(!parts.length||parts.length>6)return '<div class="rs bad">List one to six classes, base first, separated by commas. A member object goes in brackets: Car(Engine).</div>';
  const cls=[];
  for(const p of parts){const m=p.match(/^([A-Za-z_]\w*)\s*(?:\(\s*([A-Za-z_]\w*(?:\s*\+\s*[A-Za-z_]\w*)*)\s*\))?$/);if(!m)return '<div class="rs bad">"'+esc(p)+'" is not valid. Write Name or Name(Member) or Name(M1 + M2).</div>';cls.push({n:m[1],m:m[2]?m[2].split("+").map(x=>x.trim()):[]});}
  const rows=[];let n=0;
  cls.forEach((c,i)=>{
    c.m.forEach(x=>rows.push([String(++n),x+" constructed","member object of "+c.n+" (built before its body)"]));
    rows.push([String(++n),c.n+" constructor body",i===0?"the base of the chain: runs first":"after "+cls[i-1].n+" and after its own members"]);
  });
  for(let i=cls.length-1;i>=0;i--){
    const c=cls[i];
    rows.push([String(++n),c.n+" destructor body","destruction mirrors construction"]);
    for(let j=c.m.length-1;j>=0;j--)rows.push([String(++n),c.m[j]+" destroyed","member object of "+c.n]);
  }
  return '<div class="rs ok"><b>Build from the foundation up; demolish from the roof down.</b> Construction: base, members, body. Destruction: body, members, base.</div>'+tbl(["Step","Event","Why"],rows);
}

function absRes(){
  const parts=L.ac.split("|").map(s=>s.trim()).filter(Boolean);
  if(!parts.length||parts.length>6)return '<div class="rs bad">Write one to six classes separated by |, base first, for example A: f g | B: f | C: g.</div>';
  const rows=[];let pending=null,seen=null;
  for(let i=0;i<parts.length;i++){
    const m=parts[i].match(/^([A-Za-z_]\w*)\s*:\s*([A-Za-z_\w\s]*)$/);
    if(!m)return '<div class="rs bad">"'+esc(parts[i])+'" is not valid. Write Name: f g (the first class lists the pure virtual functions, each later class lists the functions it overrides).</div>';
    const fn=m[2].split(/\s+/).filter(Boolean);
    if(i===0){pending=new Set(fn);seen=new Set(fn);rows.push([m[1],"declares "+(fn.join(", ")||"nothing")+" as pure virtual",fn.join(", ")||"none",fn.length?"Abstract":"Concrete"]);}

  }
  const last=rows[rows.length-1];
  return '<div class="rs ok"><b>'+esc(last[0])+" is "+last[3].toLowerCase()+".</b> "+(last[3]==="Abstract"?"A pure virtual function is still unimplemented, so "+esc(last[0])+" "+"cannot be instantiated.":"Every pure virtual function has an override, so objects of "+esc(last[0])+" may be created.")+"</div>"+tbl(["Class","What it does","Pure virtual functions still left","Status"],rows);

function labClick(a,el,v){
  switch(a){

    case "wreset":resetWidget(el.dataset.id);return true;

    case "prun2":{const q=CALC[L.pi];const r=runCpp(q.src,"");L.pres[L.pi]=Object.assign(L.pres[L.pi]||{},{run:r});const g=document.getElementById("pguess2");if(g&&!(L.pres[L.pi].checked))L.pres[L.pi].guess=g.value;render();return true;}
    case "pprev2":if(L.pi>0)L.pi--;render();return true;

      const got=(r.out||"").replace(/\r/g,"").replace(/\s+$/,"");
      let msg,ok=false;
      if(!r.ok){msg=r.title+". "+r.detail;}
      else if(got===f.exp){ok=true;msg="The output matches the goal.";}
      else msg="It runs, but the output is different from the goal. Expected \""+f.exp.replace(/\n/g," / ")+"\" and got \""+got.replace(/\n/g," / ")+"\".";
      L.fres[L.fi]={ok:ok,msg:msg};render();return true;}
    case "fhint":L.fshow[L.fi]=Math.max(L.fshow[L.fi]||0,1);render();return true;
    case "fsol":L.fshow[L.fi]=2;render();return true;
    case "fprev":if(L.fi>0)L.fi--;render();return true;
    case "fnext":if(L.fi+1<FIX.length)L.fi++;render();return true;
    case "lsdim":L.sd.dim=+v;L.sd.s=0;L.sd.t=0;sdNew();render();return true;
    case "lsda":{const d=DIMS[L.sd.dim],it=d.it[L.sd.item];L.sd.t++;const ok=+v===it[1];if(ok)L.sd.s++;L.sd.right=ok;L.sd.fb=(ok?"Correct. ":"Not quite. ")+"\u201c"+it[0]+"\u201d: "+d.o[it[1]]+".";render();return true;}
    case "lsdn":sdNew();render();return true;
  }

}

function noteHtml(b){

function stepIds(st){const ids=[];CARDS.forEach((c,i)=>{if(st.sec.includes(c[0]))ids.push(i);});return ids.filter(i=>i<ORIG).concat(ids.filter(i=>i>=ORIG));}
function stepChunks(st){const ids=stepIds(st),out=[];for(let i=0;i<ids.length;i+=CH)out.push(ids.slice(i,i+CH));return out;}
function blankHtml(text){return esc(text).replace(/\{\{(.+?)\}\}/g,(m,a)=>`<button class="blank" data-act="blank" style="min-width:${Math.max(4,a.length)}ch" aria-label="Hidden term, press to reveal"><span class="ans">${a}</span></button>`);}
function applyRate(queue,v){const id=queue.shift();let b=store.box[id]||0;
  if(v==="miss"){b=1;queue.splice(Math.min(3,queue.length),0,id);}
  else if(v==="almost"){b=Math.max(b,1);queue.push(id);}
  else{b=b<2?2:3;}
  store.box[id]=b;save();}
function openStep(s){
  const P=S.path,N=stepChunks(STEPS[s]).length;

  P.step=s;P.i=0;P.flip=false;P.guess="";P.text="";P.dchecked=false;P.ticks={};P.q=[];
  if(ch>=N){P.ph="gaps";P.ch=N-1;}else{P.ch=ch;P.ph=ch>0?"learn":"primer";}

}
function pathOverview(){

  STEPS.forEach((st,s)=>{

function startRun(list){

function evalQuiz(){
  const r=S.run,q=r.qs[r.i],res=r.res[r.i],T=TM[q.t];
  let h=`<div class="panel"><div class="row" style="justify-content:space-between"><span class="tag">${esc(T.n)}</span><span class="lab">Question ${r.i+1} of ${r.qs.length} · ${T.m} mark${T.m>1?"s":""}</span></div><div class="bar" aria-hidden="true"><i style="width:${Math.round(r.i/r.qs.length*100)}%"></i></div>`;

    if(res)h+=`<div class="fb ${res.score?"ok":"no"}"><b>${res.score?"Correct.":"Not quite."}</b> ${esc(q.e)}</div>`;

    if(res)h+=`<div class="fb ${res.score?"ok":"no"}"><b>${res.score?"Correct.":"Not quite."}</b> ${esc(q.e)}</div>`;
  }else if(q.t==="fill"||q.t==="vsa"||q.t==="calc"){
    h+=`<input type="text" id="ans" autocomplete="off" placeholder="Type your answer" value="${esc(r.text[r.i]||"")}"${res?" disabled":""}>`;

    else{
      h+=`<div class="fb ${res.score?"ok":"no"}"><b>${res.score?"Correct.":"Model answer:"}</b> ${res.score?"":esc(q.model)} ${q.e?esc(q.e):""}</div>`;
      if(!res.score)h+='<div class="row"><button class="btn" data-act="override">I was right, count it</button></div>';
    }
  }else{
    const st=r.stage[r.i]||0;
    h+=`<textarea id="wtext" placeholder="Write your answer as you would in the exam..."${st?" disabled":""}>${esc(r.text[r.i]||"")}</textarea>`;
    if(!st)h+='<div class="row"><button class="btn primary" data-act="reveal">Show model answer</button></div>';
    else{
      const tk=r.ticks[r.i]||{};const got=q.pts.filter((_,i)=>tk[i]).length;

      if(!res)h+=`<div class="row"><button class="btn primary" data-act="wsave">Save score (${fmt(got/q.pts.length*T.m)} of ${T.m})</button></div>`;

    }
  }
  if(res){h+=`<div class="row"><button class="btn primary" data-act="next">${r.i+1<r.qs.length?"Next question":"See results"}</button></div>`;}

function fmt(x){return (Math.round(x*2)/2).toString();}
function setRes(score,extra){const r=S.run,q=r.qs[r.i];r.res[r.i]=Object.assign({score:score,max:TM[q.t].m},extra||{});render();}
function evalResult(){
  const r=S.run;let sc=0,mx=0;const by={};
  r.qs.forEach((q,i)=>{const x=r.res[i]||{score:0,max:TM[q.t].m};sc+=x.score;mx+=x.max;const b=by[q.t]||(by[q.t]={s:0,m:0,n:0});b.s+=x.score;b.m+=x.max;b.n++;});
  const pct=Math.round(sc/mx*100);
  const msg=pct>=85?"Exam ready on this material.":pct>=65?"Solid. Revisit the misses below.":pct>=40?"Getting there. Use the Learn section on the weak topics.":"Go back to the recall cards, then try again.";
  let h=`<div class="panel"><div class="lab">Result</div><div class="score">${fmt(sc)} / ${mx} <span style="font-size:1.5rem;color:var(--muted)">${pct}%</span></div><p>${msg}</p><div style="display:flex;flex-direction:column;gap:10px">`;
  TYPES.forEach(t=>{const b=by[t.k];if(!b)return;const p=Math.round(b.s/b.m*100);h+=`<div><div class="row" style="justify-content:space-between"><span>${esc(t.n)} (${b.n})</span><b>${fmt(b.s)}/${b.m}</b></div><div class="bar"><i style="width:${p}%"></i></div></div>`;});
  const missed=r.qs.filter((q,i)=>(r.res[i]||{score:0}).score<TM[q.t].m).length;
  h+=`</div><div class="row">${missed?`<button class="btn primary" data-act="retry">Retry the ${missed} missed</button>`:""}<button class="btn" data-act="newtest">New test</button></div></div>`;
  h+="<h2>Review</h2>";
  r.qs.forEach((q,i)=>{const x=r.res[i]||{score:0,max:TM[q.t].m};const ok=x.score>=x.max;
    let ans=q.t==="mcq"?q.opts[q.a]:q.t==="tf"?(q.a?"True":"False"):q.model;
    h+=`<div class="rev ${ok?"ok":"bad"}"><div class="lab">${esc(TM[q.t].n)} · ${fmt(x.score)}/${x.max}</div><b>${esc(q.q)}</b>${x.resp?`<div class="r">You: ${esc(x.resp)}</div>`:""}<div class="r">${ok?"":"Answer: "}${esc(ans)}</div></div>`;});
  return '<div style="display:flex;flex-direction:column;gap:14px">'+h+"</div>";
}
function finishRun(){
  const r=S.run;let sc=0,mx=0;r.qs.forEach((q,i)=>{const x=r.res[i]||{score:0,max:TM[q.t].m};sc+=x.score;mx+=x.max;});
  if(!r.retry){store.hist.unshift({d:new Date().toLocaleDateString(undefined,{day:"numeric",month:"short"}),pct:Math.round(sc/mx*100),n:r.qs.length});store.hist=store.hist.slice(0,8);save();}
  S.ev.view="result";
}

/* ============ EVENTS ============ */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");if(!el)return;
  const a=el.dataset.act,v=el.dataset.v;
  switch(a){
    case "tab":S.tab=v;render();break;
    case "lv":S.lv=v;render();break;
    case "csec":S.cards.sec=+v;buildQueue();render();break;
    case "flip":S.cards.flip=true;render();break;
    case "cnext":buildQueue();render();break;
    case "creset":CARDS.forEach((k,i)=>{if(S.cards.sec<0||k[0]===S.cards.sec)delete store.box[i];});save();buildQueue();render();break;
    case "rate":{const q=S.cards.queue,id=q.shift();let b=store.box[id]||0;
      if(v==="miss"){b=1;q.splice(Math.min(3,q.length),0,id);}
      else if(v==="almost"){b=Math.max(b,1);q.push(id);}
      else{b=b<2?2:3;S.cards.done++;}
      store.box[id]=b;save();S.cards.flip=false;S.cards.guess="";render();break;}
    case "cord":S.cards.ordered=v==="1";buildQueue();render();break;
    case "pstep":openStep(+v);break;
    case "pback":S.path.step=null;render();window.scrollTo(0,0);break;
    case "pnotes":S.path.ph="primer";render();window.scrollTo(0,0);break;
    case "pstart":S.path.ph="learn";S.path.i=0;render();break;
    case "plback":if(S.path.i>0)S.path.i--;render();break;
    case "plnext":{const P=S.path,ids=stepChunks(STEPS[P.step])[P.ch];
      if(P.i+1<ids.length)P.i++;else{P.ph="recall";P.q=shuffle(ids.slice());P.flip=false;P.guess="";}
      render();break;}
    case "pflip":S.path.flip=true;render();break;
    case "prate":{const P=S.path;applyRate(P.q,v);P.flip=false;P.guess="";
      if(!P.q.length){store.path.ch[P.step]=P.ch+1;save();P.ph="roundend";}
      render();break;}
    case "pnext":{const P=S.path,N=stepChunks(STEPS[P.step]).length;
      if(P.ch+1<N){P.ch++;P.ph="learn";P.i=0;}else P.ph="gaps";
      render();window.scrollTo(0,0);break;}
    case "pdump":S.path.ph="dump";render();window.scrollTo(0,0);break;
    case "pcheck":{const t=$("#ptext");if(t)S.path.text=t.value;S.path.dchecked=true;render();break;}
    case "pfinish":store.path.done[S.path.step]=true;save();S.path.ph="done";render();window.scrollTo(0,0);break;
    case "pnextstep":openStep(S.path.step+1);break;
    case "blank":el.classList.toggle("on");break;
    case "revall":document.querySelectorAll(".blank").forEach(b=>b.classList.add("on"));break;
    case "hideall":document.querySelectorAll(".blank").forEach(b=>b.classList.remove("on"));break;
    case "mask":if(el.classList.contains("hid")){el.classList.remove("hid");el.removeAttribute("role");}break;
    case "tmode":S.tmode[el.dataset.t]=v;render();break;
    case "dtopic":S.dump={i:+v,text:"",checked:false,ticks:{}};render();break;
    case "dcheck":S.dump.checked=true;render();break;
    case "dreset":S.dump.checked=false;S.dump.ticks={};S.dump.text="";render();break;
    case "estart":{const pool=shuffle(BANK.filter(b=>S.ev.types[b.t]));const list=S.ev.n?pool.slice(0,S.ev.n):pool;
      list.sort((x,y)=>TYPES.findIndex(t=>t.k===x.t)-TYPES.findIndex(t=>t.k===y.t));startRun(list);break;}
    case "mcq":{const r=S.run,q=r.qs[r.i],i=+el.dataset.i;setRes(q.o[i].c?1:0,{pick:i,resp:q.o[i].t});break;}
    case "tf":{const r=S.run,q=r.qs[r.i],p=v==="true";setRes(p===q.a?1:0,{pick:p,resp:p?"True":"False"});break;}
    case "check":doCheck();break;
    case "override":{const r=S.run;r.res[r.i].score=TM[r.qs[r.i].t].m;render();break;}
    case "reveal":{const r=S.run;r.text[r.i]=$("#wtext").value;r.stage[r.i]=1;render();break;}
    case "wsave":{const r=S.run,q=r.qs[r.i],tk=r.ticks[r.i]||{};const got=q.pts.filter((_,i)=>tk[i]).length;setRes(Math.round(got/q.pts.length*TM[q.t].m*2)/2,{resp:r.text[r.i]||""});break;}
    case "next":{const r=S.run;if(r.i+1<r.qs.length){r.i++;render();window.scrollTo(0,0);}else{finishRun();render();window.scrollTo(0,0);}break;}
    case "retry":{const r=S.run;const list=r.qs.filter((q,i)=>(r.res[i]||{score:0}).score<TM[q.t].m);startRun(list);S.run.retry=true;break;}
    case "newtest":S.ev.view="setup";S.run=null;render();break;
    default:labClick(a,el,v);
  }
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.dataset.lsel){labSelect(el);return;}
  if(el.dataset.act==="etype"){S.ev.types[el.dataset.v]=el.checked?1:0;render();}
  else if(el.id==="en"){S.ev.n=+el.value;}
  else if(el.dataset.act==="ptick"){S.path.ticks[el.dataset.i]=el.checked;render();}
  else if(el.dataset.act==="dtick"){S.dump.ticks[el.dataset.i]=el.checked;render();}
  else if(el.dataset.act==="wtick"){const r=S.run;r.ticks[r.i]=r.ticks[r.i]||{};r.ticks[r.i][el.dataset.i]=el.checked;render();}
});
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.dataset&&el.dataset.cid){CS.src[el.dataset.cid]=el.value;return;}
  if(el.dataset&&el.dataset.iid){CS.inp[el.dataset.iid]=el.value;return;}
  if(el.dataset&&(el.dataset.lin||el.dataset.tcell!==undefined)){labInput(el);return;}
  if(el.id==="guess")S.cards.guess=el.value;
  else if(el.id==="pguess")S.path.guess=el.value;
  else if(el.id==="ptext")S.path.text=el.value;
  else if(el.id==="dtext")S.dump.text=el.value;
  else if(el.id==="ans"&&S.run)S.run.text[S.run.i]=el.value;
});
function doCheck(){
  const r=S.run,q=r.qs[r.i],v=($("#ans").value||"").trim();if(!v)return;
  r.text[r.i]=v;setRes((q.t==="calc"?matchCalc(v,q):matches(v,q.acc,q.all))?TM[q.t].m:0,{resp:v});
}
document.addEventListener("keydown",e=>{
  const t=e.target,tag=t.tagName;
  if(e.key==="Enter"&&t.id==="ans"){e.preventDefault();doCheck();return;}
  if(t.classList&&t.classList.contains("codearea")){
    if(e.key==="Tab"&&!e.shiftKey){e.preventDefault();const p=t.selectionStart;t.setRangeText("    ",p,t.selectionEnd,"end");CS.src[t.dataset.cid]=t.value;return;}
    if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)){e.preventDefault();const b=t.closest(".cw").parentElement.querySelector('[data-act="crun"],[data-act="fcheck"]');if(b)b.click();return;}
  }
  if(e.key==="Enter"&&t.id==="pguess2"){e.preventDefault();const b=document.querySelector('[data-act="pcheck2"]');if(b&&!b.disabled)b.click();return;}
  if((e.key==="Enter"||e.key===" ")&&t.classList&&t.classList.contains("hid")){e.preventDefault();t.click();return;}
  const inPath=S.tab==="learn"&&S.lv==="path"&&S.path.ph==="recall"&&S.path.q.length>0;
  const inCards=S.tab==="learn"&&S.lv==="cards"&&S.cards.queue.length>0;
  if(!(inPath||inCards)||tag==="INPUT"||tag==="TEXTAREA"||tag==="SELECT")return;
  const flipped=inPath?S.path.flip:S.cards.flip;
  if((e.key===" "||e.key==="Enter")&&tag!=="BUTTON"&&!flipped){e.preventDefault();if(inPath)S.path.flip=true;else S.cards.flip=true;render();}
  else if(flipped&&"123".includes(e.key)&&e.key){const m={"1":"miss","2":"almost","3":"got"};const b=document.querySelector('[data-act$="rate"][data-v="'+m[e.key]+'"]');if(b)b.click();}
});
render();
</script>

</body></html>
