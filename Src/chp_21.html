const NOTES=[
["1.1 File basics","Variables live in {{RAM}}, which is volatile, so a program forgets everything when it ends. A {{file}} is a named collection of related data stored permanently on secondary storage. Files give {{permanence}} (data survives the program), {{sharing}} between programs, and {{capacity}} beyond what RAM holds. A {{text file}} stores characters, so the integer 1234 occupies four bytes (the digits); it is readable in any editor, needs conversion between numbers and text, and is portable. A {{binary file}} stores raw bytes as in memory, so an int always takes {{4 bytes}}; it is faster and compact, but not readable and not always portable. Text is written with <<, >> and getline(); binary with {{write()}} and {{read()}}. Binary files must be opened with {{ios::binary}}, because on Windows text mode turns '\\n' into \\r\\n and would corrupt a byte equal to 10."],
["1.2 File streams","Input and output use {{streams}}: sequences of bytes flowing into or out of the program. The classes are in the header {{<fstream>}} (include <iostream> as well for cout and cin). {{ifstream}} is for reading only (default mode ios::in), {{ofstream}} for writing only (default ios::out), and {{fstream}} for both (default ios::in | ios::out). ifstream derives from {{istream}} (the class of cin), ofstream from {{ostream}} (the class of cout), and fstream from {{iostream}}, so the same <<, >> and getline() work on files, and a function taking istream & works for the keyboard and for a file. Choose the {{narrowest}} class that does the job: writing to an ifstream is a compile-time error."],
["1.3 Opening, writing and reading text files","Every file job is open, check, use, close. A file is opened by the {{constructor}} (ofstream out(\"data.txt\");) or by {{open()}}. Opening can fail, so test it: if (!inFile) {...}, equivalent to fail() being true or is_open() being false. An ofstream is written with {{<<}}. A plain ofstream {{erases}} the file when it opens; use ios::app to keep the data. Reading uses {{>>}} (one value, stops at white space), {{getline()}} (a whole line, spaces kept) or {{get()}} (one character). close() {{flushes}} the buffer, releases the file handle and allows reuse; the {{destructor}} also closes the stream (RAII), but output still in the buffer is not on disk, so a reader opened before close() or flush() may see nothing. endl flushes; '\\n' does not."],
["1.4 Stream states and the eof() trap","A stream remembers whether its last operation worked: {{good()}}, {{eof()}}, {{fail()}}, {{bad()}}, and {{clear()}} resets them. eof() becomes true only when a read tries to go {{past}} the end, not when the last item has been read. That is why while(!eof()) is a bug: it runs one {{extra}} time, printing an empty line, or repeating the {{stale}} last number (10 20 30 30). Make the {{read itself}} the loop condition: while (in >> x), while (getline(in, s)), while (in.read(...)). After a loop has read to the end, call {{clear()}} before seeking back, or every later read fails."],
["1.5 File modes","A mode is a flag, given when the file is opened, and modes combine with the bitwise {{|}}. {{ios::in}} reads and needs the file to exist. {{ios::out}} writes, creates and {{truncates}}. {{ios::app}} adds at the {{end}}, keeps old data, and ignores seekp(). {{ios::ate}} starts at the end, but out | ate still truncates. {{ios::trunc}} discards old content. {{ios::binary}} switches off text translation. On a file holding AAAA, writing B gives: out → {{B}}; app → {{AAAAB}}; in | out → {{BAAA}}. in | out does {{not create}} a missing file. Three words: out wipes, app adds, in | out overwrites in place."],
["1.6 Random file access","Sequential access goes from the first byte to the last; random access jumps to any position. Each stream keeps a file pointer, a byte offset counted from {{0}}. {{seekg()}} moves the read (get) pointer and {{seekp()}} the write (put) pointer, with an offset and a reference: {{ios::beg}}, {{ios::cur}} or {{ios::end}}. {{tellg()}} and {{tellp()}} report the position. The size of a file is found with seekg(0, ios::end); then {{tellg()}}. On ABCDEFGH, seekg(-3, ios::end) then get(c) reads {{F}}. With fixed-size records the nth record starts at offset {{(n - 1) x sizeof(record)}} and the number of records is {{file size / sizeof(record)}}. When one fstream switches between reading and writing, a {{seek}} (or flush) is required in between."],
["1.7 Binary records","A record is a struct whose bytes are stored exactly as in memory, so every record has the same size. Write with {{out.write((char*)&s, sizeof(Student))}} and read with {{while (in.read((char*)&s, sizeof(Student)))}}: the cast treats the structure as raw bytes. The fields rollNo (4), name[30] and marks (4) add to 38 but sizeof(Student) is {{40}}, because the compiler inserts {{padding}} so that the float is aligned; so always use {{sizeof}}. A record must hold a {{char array}}, never a std::string or a pointer, whose bytes mean nothing in the next run. Binary files are not {{portable}} between systems."],
["1.8 The record system","One pattern serves every record file. {{Write}}: ofstream with ios::binary and write() in a loop. {{Display}}: ifstream and while (read(...)). {{Add}}: open with ios::app | ios::binary. {{Search}}: read until a field matches, with a flag and break. {{Update}}: an {{fstream}} with in | out | binary, find the record by reading, then seekp(-(int)sizeof(Student), ios::cur) and write() over it; app would ignore the seek. {{Delete}}: bytes cannot be removed from the middle, so copy every other record to a {{temporary}} file, close both, remove() the original and rename() the temporary file. remove() and rename() are in <cstdio> and return {{0}} on success. Only the struct changes for employee or inventory records."]
];

{q:"What is printed? (Write each line in order.)",src:R`#include <iostream>
#include <fstream>
#include <cstdio>
#include <cstring>
using namespace std;

struct Student {
    int   rollNo;
    char  name[30];
    float marks;
};

void writeRecords() {
    ofstream outFile("students.dat", ios::binary);
    if (!outFile) { cout << "Cannot open file.\n"; return; }

    Student s[] = {
        {101, "Ramesh", 85.5},
        {102, "Priya", 92.0},
        {103, "Arjun", 78.3}
    };
    for (int i = 0; i < 3; i++)
        outFile.write((char*)&s[i], sizeof(Student));
    outFile.close();
    cout << "Records written.\n";
}

void readRecords() {
    ifstream inFile("students.dat", ios::binary);
    if (!inFile) { cout << "Cannot open file.\n"; return; }

    Student s;
    cout << "--- Student Records ---\n";
    while (inFile.read((char*)&s, sizeof(Student))) {
        cout << "Roll: " << s.rollNo
             << " | Name: " << s.name
             << " | Marks: " << s.marks << endl;
    }
    inFile.close();
}

void appendRecord(int roll, const char *name, float marks) {
    Student s = {};
    s.rollNo = roll;
    strncpy(s.name, name, sizeof(s.name) - 1);
    s.name[sizeof(s.name) - 1] = '\0';
    s.marks = marks;

    ofstream outFile("students.dat", ios::app | ios::binary);
    outFile.write((char*)&s, sizeof(Student));
}

int countRecords() {
    ifstream inFile("students.dat", ios::binary);
    inFile.seekg(0, ios::end);
    return inFile.tellg() / sizeof(Student);
}

void showRecordNumber(int n) {
    ifstream inFile("students.dat", ios::binary);
    inFile.seekg((n - 1) * sizeof(Student), ios::beg);
    Student s;
    if (inFile.read((char*)&s, sizeof(Student)))
        cout << "Record " << n << ": " << s.name << " (" << s.marks << ")\n";
    else
        cout << "No record number " << n << ".\n";
}

void searchRecord(int targetRoll) {
    ifstream inFile("students.dat", ios::binary);
    if (!inFile) { cout << "Cannot open file.\n"; return; }

    Student s;
    bool found = false;
    while (inFile.read((char*)&s, sizeof(Student))) {
        if (s.rollNo == targetRoll) {
            cout << "Found: " << s.name << " | Marks: " << s.marks << endl;
            found = true;
            break;
        }
    }
    if (!found) cout << "Record not found.\n";
}

void updateRecord(int targetRoll, float newMarks) {
    fstream file("students.dat", ios::in | ios::out | ios::binary);
    if (!file) { cout << "Cannot open file.\n"; return; }

    Student s;
    while (file.read((char*)&s, sizeof(Student))) {
        if (s.rollNo == targetRoll) {
            s.marks = newMarks;
            file.seekp(-(int)sizeof(Student), ios::cur);
            file.write((char*)&s, sizeof(Student));
            cout << "Record updated successfully.\n";
            return;
        }
    }
    cout << "Record not found.\n";
}

void deleteRecord(int targetRoll) {
    ifstream inFile("students.dat", ios::binary);
    ofstream tempFile("temp.dat", ios::binary);
    if (!inFile || !tempFile) { cout << "File error.\n"; return; }

    Student s;
    bool deleted = false;
    while (inFile.read((char*)&s, sizeof(Student))) {
        if (s.rollNo == targetRoll)
            deleted = true;
        else
            tempFile.write((char*)&s, sizeof(Student));
    }
    inFile.close();
    tempFile.close();

    remove("students.dat");
    rename("temp.dat", "students.dat");
    cout << (deleted ? "Record deleted." : "Record not found.") << endl;
}

int main()
{
    cout << "sizeof(Student) = " << sizeof(Student) << endl;
    writeRecords();
    readRecords();
    cout << "Records in file: " << countRecords() << endl;

    appendRecord(104, "Neha", 88.0f);
    cout << "Records in file: " << countRecords() << endl;
    showRecordNumber(4);
    showRecordNumber(9);

    searchRecord(102);
    searchRecord(999);

    updateRecord(102, 95.5f);
    searchRecord(102);

    deleteRecord(101);
    readRecords();

 {h:"The complete program",d:"Write, read, count, add, jump, search, update and delete. Follow the file: 120 bytes, 160, same size after the update, 120 again after the delete.",code:{c:R`#include <iostream>
#include <fstream>
#include <cstdio>
#include <cstring>
using namespace std;

struct Student {
    int   rollNo;
    char  name[30];
    float marks;
};

void writeRecords() {
    ofstream outFile("students.dat", ios::binary);
    if (!outFile) { cout << "Cannot open file.\n"; return; }

    Student s[] = {
        {101, "Ramesh", 85.5},
        {102, "Priya", 92.0},
        {103, "Arjun", 78.3}
    };
    for (int i = 0; i < 3; i++)
        outFile.write((char*)&s[i], sizeof(Student));
    outFile.close();
    cout << "Records written.\n";
}

void readRecords() {
    ifstream inFile("students.dat", ios::binary);
    if (!inFile) { cout << "Cannot open file.\n"; return; }

    Student s;
    cout << "--- Student Records ---\n";
    while (inFile.read((char*)&s, sizeof(Student))) {
        cout << "Roll: " << s.rollNo
             << " | Name: " << s.name
             << " | Marks: " << s.marks << endl;
    }
    inFile.close();
}

void appendRecord(int roll, const char *name, float marks) {
    Student s = {};
    s.rollNo = roll;
    strncpy(s.name, name, sizeof(s.name) - 1);
    s.name[sizeof(s.name) - 1] = '\0';
    s.marks = marks;

    ofstream outFile("students.dat", ios::app | ios::binary);
    outFile.write((char*)&s, sizeof(Student));
}

int countRecords() {
    ifstream inFile("students.dat", ios::binary);
    inFile.seekg(0, ios::end);
    return inFile.tellg() / sizeof(Student);
}

void showRecordNumber(int n) {
    ifstream inFile("students.dat", ios::binary);
    inFile.seekg((n - 1) * sizeof(Student), ios::beg);
    Student s;
    if (inFile.read((char*)&s, sizeof(Student)))
        cout << "Record " << n << ": " << s.name << " (" << s.marks << ")\n";
    else
        cout << "No record number " << n << ".\n";
}

void searchRecord(int targetRoll) {
    ifstream inFile("students.dat", ios::binary);
    if (!inFile) { cout << "Cannot open file.\n"; return; }

    Student s;
    bool found = false;
    while (inFile.read((char*)&s, sizeof(Student))) {
        if (s.rollNo == targetRoll) {
            cout << "Found: " << s.name << " | Marks: " << s.marks << endl;
            found = true;
            break;
        }
    }
    if (!found) cout << "Record not found.\n";
}

void updateRecord(int targetRoll, float newMarks) {
    fstream file("students.dat", ios::in | ios::out | ios::binary);
    if (!file) { cout << "Cannot open file.\n"; return; }

    Student s;
    while (file.read((char*)&s, sizeof(Student))) {
        if (s.rollNo == targetRoll) {
            s.marks = newMarks;
            file.seekp(-(int)sizeof(Student), ios::cur);
            file.write((char*)&s, sizeof(Student));
            cout << "Record updated successfully.\n";
            return;
        }
    }
    cout << "Record not found.\n";
}

void deleteRecord(int targetRoll) {
    ifstream inFile("students.dat", ios::binary);
    ofstream tempFile("temp.dat", ios::binary);
    if (!inFile || !tempFile) { cout << "File error.\n"; return; }

    Student s;
    bool deleted = false;
    while (inFile.read((char*)&s, sizeof(Student))) {
        if (s.rollNo == targetRoll)
            deleted = true;
        else
            tempFile.write((char*)&s, sizeof(Student));
    }
    inFile.close();
    tempFile.close();

    remove("students.dat");
    rename("temp.dat", "students.dat");
    cout << (deleted ? "Record deleted." : "Record not found.") << endl;
}

int main()
{
    cout << "sizeof(Student) = " << sizeof(Student) << endl;
    writeRecords();
    readRecords();
    cout << "Records in file: " << countRecords() << endl;

    appendRecord(104, "Neha", 88.0f);
    cout << "Records in file: " << countRecords() << endl;
    showRecordNumber(4);
    showRecordNumber(9);

    searchRecord(102);
    searchRecord(999);

    updateRecord(102, 95.5f);
    searchRecord(102);

    deleteRecord(101);
    readRecords();
    cout << "Records in file: " << countRecords() << endl;
    return 0;
}`,tr:"Change updateRecord to use ios::app and see the old record stay."}},

          else if(s.e.n==="id"&&v.loc){v.temp=true;curTemps.push(v);}
          else{v=construct(rn,[{k:"struct",sn:rn,cell:v,obj:v}],s.line,true);v.temp=true;curTemps.push(v);}
        }
        return {t:"ret",v:v};}
      case "delete":{const v=evalE(s.e,env);doDelete(v,s.arr,s.line);return null;}
      case "brk":return {t:"brk"};case "cnt":return {t:"cnt"};
    }
    rt("unsupported","statement",s.line);
  }
  let code=0;
  try{
    P=fnParse(fnLex(src.replace(/\r/g,"")));
    for(const nm in P.structs){const sd=P.structs[nm];sd.senv={vars:new Map(),parent:G};sd.statics.forEach(st=>sd.senv.vars.set(st.name,{k:"undefstatic",cls:nm,name:st.name}));}
    for(const nm in P.structs){const sd=P.structs[nm];if(sd.bases.length)sd.senv.parent=P.structs[sd.bases[0].name].senv;}
    finalize();
    for(const g of P.globals){
      if(g.n==="sdef"){const sd=P.structs[g.cls];const st=sd.statics.find(x=>x.name===g.name);sd.senv.vars.set(g.name,mkCell(st.ty,g.line,{name:g.name,dims:st.dims,init:g.init},sd.senv,false));}
      else declare(g,G,true);
    }
    for(const nm in P.externs)if(!G.vars.has(nm))throw new FnErr("link","Linker error: undefined reference to '"+nm+"'","'"+nm+"' is declared extern here but no file defines it. An extern declaration allocates no memory; the linker must find exactly one definition (Lesson 12).",P.externs[nm].line);
    const mains=P.funcs.main;if(!mains||!mains[0].body)throw new FnErr("link","Linker error: undefined reference to 'main'","Every program needs a main() function.",0);
    const r=callFn({name:"main",args:[],line:0},G);code=r&&r.k!=="void"?r.v:0;destroyScope(G);leakReport();
  }catch(e){
    if(e instanceof ExitSig){try{destroyScope(G);}catch(_){}}
    if(e instanceof ExitSig)return {ok:true,out:out.join(""),code:e.c,warn:warn};
    if(e instanceof FnErr)return {ok:false,out:e.kind==="run"?out.join(""):"",cls:e.kind==="link"?"note":"bad",title:e.title,detail:e.detail,line:e.line,warn:warn};
    if(e instanceof RangeError)return {ok:false,out:out.join(""),cls:"bad",title:"Run-time error: stack overflow",detail:"The call stack ran out of memory: usually a recursion with no reachable base case.",warn:warn};
    return {ok:false,out:out.join(""),cls:"note",title:"The runner could not run this program",detail:String(e&&e.message||e).slice(0,200),warn:warn};
  }
  return {ok:true,out:out.join(""),code:code,warn:warn};
}

function runCpp(src,inp){
  const r=fnRun(src,(inp||"").replace(/\\n/g,"\n"));
  if(r.ok&&r.warn&&r.warn.length)r.note=r.warn.join("; ");
  return r;
}
function outHtml(r){

function diskHtml(r){
  if(!r||!r.files||!r.files.length)return "";
  const rows=r.files.map(f=>{const b=f.bytes;const pr=b.every(c=>c===10||c===13||c===9||(c>=32&&c<127));let pv;
    if(pr)pv=esc(String.fromCharCode.apply(null,b.slice(0,160))).replace(/\n/g,"&crarr;<br>")+(b.length>160?" ...":"");
    else pv=b.slice(0,48).map(c=>c.toString(16).padStart(2,"0")).join(" ")+(b.length>48?" ...":"");
    return '<tr><td class="mono">'+esc(f.name)+'</td><td>'+b.length+' bytes</td><td class="mono">'+pv+'</td></tr>';}).join("");

/* ---------- Mode simulator ---------- */
const MODES=[["out","out"],["out|trunc","out | trunc"],["out|app","out | app"],["out|ate","out | ate"],["in","in"],["in|out","in | out"],["in|out|ate","in | out | ate"],["in|out|trunc","in | out | trunc"],["in|out|app","in | out | app"]];
function modeSim(mode,exists,content,wr,seek0){
  const m=new Set(mode.split("|"));const IN=m.has("in"),APP=m.has("app"),OUT=m.has("out")||APP,ATE=m.has("ate"),TR=m.has("trunc");
  let create=false,trunc=false,fail=false,why="";
  if(APP){create=true;why="app creates the file if it is missing and keeps what is there";}
  else if(OUT){if(IN){if(TR){create=true;trunc=true;why="trunc creates the file and empties it";}else if(!exists){fail=true;why="in | out without trunc or app needs the file to exist: it is not created";}else why="in | out keeps the old content";}else{create=true;trunc=true;why="out alone creates the file and erases the old content";}}
  else if(IN){if(!exists){fail=true;why="in needs the file to exist";}else why="in only reads";}
  if(fail)return {opened:false,why:why};
  let data=exists&&!trunc?content:"";
  const created=!exists;
  let pos=(ATE||APP)?data.length:0;
  const startPos=pos;
  let wrote=true;
  if(!OUT){return {opened:true,created:false,data:data,pos:startPos,wrote:false,why:why,trunc:trunc};}
  let at=APP?data.length:(seek0==="yes"?0:pos);
  while(data.length<at)data+="\0";
  data=data.slice(0,at)+wr+data.slice(at+wr.length);
  return {opened:true,created:created&&create,data:data,pos:startPos,wrote:true,at:at,why:why,seek:seek0==="yes",app:APP,trunc:trunc};
}
function mdRes(){
  const exists=L.me==="yes";const r=modeSim(L.mm,exists,L.mc,L.mw,L.ms);
  if(!r.opened)return '<div class="rs bad"><b>The open fails.</b> '+esc(r.why)+". is_open() is 0 and every later operation fails.</div>";
  const rows=[["Opened?","yes"],["File created?",r.created?"yes (it did not exist)":"no"],["Old content",exists?(r.trunc?"erased":"kept"):"none (the file did not exist)"],["Pointer after opening",String(r.pos)+(r.pos?" (the end)":" (the start)")]];
  if(r.wrote){rows.push(["Writing "+JSON.stringify(L.mw),r.app?"goes to the end whatever the seek (append mode)":"written at position "+r.at]);}
  else rows.push(["Writing","not allowed: the stream was not opened for output"]);
  rows.push(["File afterwards",JSON.stringify(r.data.replace(/\0/g,"\\0"))]);
  return '<div class="rs ok"><b>'+esc(L.mm.replace(/\|/g," | "))+":</b> "+esc(r.why)+".</div>"+tbl(["Question","Answer"],rows);
}

/* ---------- Offsets and seeks ---------- */
function ofRes(){
  const rs=parseInt(L.rs),n=parseInt(L.rn),fsz=parseInt(L.rf),off=parseInt(L.ro),cp=parseInt(L.rp);
  if([rs,n,fsz,off,cp].some(isNaN)||rs<1||n<1||fsz<0||cp<0)return '<div class="rs bad">Enter whole numbers: record size at least 1, record number at least 1, no negative sizes or positions.</div>';
  const base=L.rr==="beg"?0:L.rr==="cur"?cp:fsz;const np=base+off;
  const rows=[["Offset of record "+n,"("+n+" - 1) x "+rs+" = "+(n-1)*rs],["Number of records in "+fsz+" bytes",fsz+" / "+rs+" = "+Math.floor(fsz/rs)+(fsz%rs?" (remainder "+fsz%rs+": the file is not a whole number of records)":"")],["File size of "+n+" records",n+" x "+rs+" = "+n*rs],["seekg("+off+", ios::"+L.rr+") from position "+cp,(L.rr==="beg"?"0":L.rr==="cur"?"current "+cp:"end "+fsz)+" + "+off+" = "+np+(np<0?" (before the start: the seek fails)":np>fsz?" (beyond the end: a read there fails)":"")],["Record at that position",np>=0&&np<fsz?"record "+(Math.floor(np/rs)+1)+(np%rs?", "+np%rs+" bytes into it":", at its first byte"):"none"]];
  return '<div class="rs ok"><b>Record n starts at (n - 1) x sizeof(record).</b> The number of records is the file size divided by the record size.</div>'+tbl(["Question","Answer"],rows);
}

/* ---------- Record size (padding) ---------- */
const PDT={char:[1,1],bool:[1,1],short:[2,2],int:[4,4],float:[4,4],long:[8,8],double:[8,8],"char*":[8,8],"int*":[8,8]};
function pdRes(){
  const parts=L.pf.split(",").map(s=>s.trim()).filter(Boolean);
  if(!parts.length||parts.length>10)return '<div class="rs bad">List one to ten fields separated by commas, for example int, char[30], float.</div>';
  let off=0,al=1,sum=0;const rows=[];
  for(const p of parts){
    const m=p.match(/^([a-z_*]+)\s*(?:\[(\d+)\])?$/);if(!m||!PDT[m[1]])return '<div class="rs bad">"'+esc(p)+'" is not valid. Use char, bool, short, int, float, long, double, char* or int*, optionally with [n].</div>';
    const [sz,a]=PDT[m[1]];const n=m[2]?parseInt(m[2]):1;const start=Math.ceil(off/a)*a;
    rows.push([p,String(n*sz),String(a),String(start),start>off?(start-off)+" byte(s) of padding before it":"none"]);
    off=start+n*sz;al=Math.max(al,a);sum+=n*sz;
  }
  const total=Math.ceil(off/al)*al;
  rows.push(["(end of structure)","","",String(off),total>off?(total-off)+" byte(s) of padding at the end":"none"]);
  return '<div class="rs ok"><b>sizeof = '+total+" bytes, not "+sum+".</b> Each field starts at a multiple of its own alignment, and the total is a multiple of the largest alignment ("+al+"). Always use sizeof.</div>"+tbl(["Field","Bytes","Alignment","Offset","Padding"],rows);
}

  return '<div class="panel"><h3>Record size and padding</h3><p class="hint">List the fields of a structure in order. The default is the chapter\'s Student: sizeof is 40, not 38. A pointer or std::string in a record is not allowed in a file.</p><div><label class="lab" for="pdin">Fields</label><input type="text" id="pdin" data-lin="pad" data-key="pf" class="mono" value="'+esc(L.pf)+'" style="max-width:30rem"></div><div id="padres">'+pdRes()+"</div></div>";
}
/* ---------- Stream states ---------- */
function stRes(){
  const ops=L.so.split(/[ ,;]+/).map(s=>s.trim().toLowerCase()).filter(Boolean);
  if(!ops.length||ops.length>10)return '<div class="rs bad">Write one to ten operations separated by commas: int, line, ch, clear, seek0.</div>';
  const F=L.sc.replace(/\\n/g,"\n");let pos=0,eof=false,fail=false;const rows=[["opened","","1",0,0,String(pos)]];
  rows[0]=["just opened","","1","0","0"];
  for(const o of ops){
    let res="";
    if(o==="clear"){eof=false;fail=false;res="state reset";}
    else if(o==="seek0"){eof=false;if(!fail)pos=0;res=fail?"ignored: the stream was in a fail state":"position 0";}
    else if(fail){res="nothing happens: the stream is in a fail state";}
    else if(o==="int"){let p=pos;while(p<F.length&&/\s/.test(F[p]))p++;if(p>=F.length){pos=F.length;eof=true;fail=true;res="no data: eof and fail";}else{const m=/^[+-]?\d+/.exec(F.slice(p));if(!m){fail=true;res="not a number: fail";pos=p;}else{pos=p+m[0].length;res="read "+m[0];if(pos>=F.length)eof=true;}}}
    else if(o==="line"){if(pos>=F.length){eof=true;fail=true;res="no data: eof and fail";}else{let j=F.indexOf("\n",pos);if(j<0){res="read "+JSON.stringify(F.slice(pos))+" (no newline: eof)";pos=F.length;eof=true;}else{res="read "+JSON.stringify(F.slice(pos,j));pos=j+1;}}}
    else if(o==="ch"){if(pos>=F.length){eof=true;fail=true;res="no data: eof and fail";}else{res="read "+JSON.stringify(F[pos]);pos++;}}
    else return '<div class="rs bad">Unknown operation "'+esc(o)+'". Use int, line, ch, clear or seek0.</div>';
    rows.push([o,res,(!fail&&!eof)?"1":"0",eof?"1":"0",fail?"1":"0"]);
  }
  return '<div class="rs ok"><b>eof() is true only after a read tries to go past the end.</b> The file holds '+esc(JSON.stringify(F))+".</div>"+tbl(["Operation","Result","good()","eof()","fail()"],rows);
}

  return '<div class="panel"><h3>Stream state tracer</h3><p class="hint">Type the contents of a text file (write \\n for a newline) and a list of reads: <code>int</code> (in &gt;&gt; x), <code>line</code> (getline), <code>ch</code> (get), <code>clear</code>, <code>seek0</code>. The default is the chapter\'s table for a file holding just 7.</p><div class="row">'+numIn("stc","File contents","sc",16,"state")+numIn("sto","Operations","so",24,"state")+'</div><div id="stateres">'+stRes()+"</div></div>";

const DIMS=[
{n:"Which mode?",o:["out","app","in | out"],it:[["Old content is erased",0],["Every write goes to the end, even after seekp(0)",1],["Old content kept; new data overwrites from the start",2],["Creates a missing file and truncates",0],["Does not create a missing file",2],["Used to add a binary record",1],["Used to update a record in place",2],["A plain ofstream uses it",0]]},
{n:"Which stream class?",o:["ifstream","ofstream","fstream"],it:[["Reading only",0],["Writing only; erases the file by default",1],["Reading and writing the same file",2],["The file version of cin",0],["The file version of cout",1],["Derives from iostream",2],["Needed to update a record in place",2],["Has no operator <<",0]]},
{n:"Text or binary?",o:["Text file","Binary file"],it:[["Written with <<",0],["Written with write()",1],["int always takes 4 bytes",1],["123456789 takes 9 bytes",0],["Needs ios::binary",1],["Readable in any editor",0],["Best for records and structures",1],["Very portable",0]]},
{n:"Which side?",o:["Read side (g)","Write side (p)"],it:[["seekg()",0],["tellp()",1],["tellg()",0],["seekp()",1],["Used with an ifstream",0],["Used with an ofstream",1]]},
{n:"Correct loop or trap?",o:["Correct","The eof trap"],it:[["while (in >> x)",0],["while (!in.eof()) { in >> x; ... }",1],["while (getline(in, s))",0],["while (!in.eof()) { getline(in, s); ... }",1],["while (in.read((char*)&s, sizeof(s)))",0],["Prints the last number twice",1]]},
{n:"Which record operation?",o:["Add","Search","Update","Delete"],it:[["ios::app | ios::binary",0],["Read until a field matches, then break",1],["seekp(-(int)sizeof(Student), ios::cur)",2],["Copy the others to a temporary file",3],["rename(\"temp.dat\", ...)",3],["write() at the end of the file",0],["fstream with in | out | binary",2],["A found flag",1]]}
];

    case "pcheck2":{const q=CALC[L.pi];const g=document.getElementById("pguess2").value;L.pres[L.pi]=Object.assign(L.pres[L.pi]||{},{guess:g,checked:true,ok:matchCalc(g,q)});render();return true;}
    case "prun2":{const q=CALC[L.pi];const r=runCpp(q.src,"");L.pres[L.pi]=Object.assign(L.pres[L.pi]||{},{run:r});const g=document.getElementById("pguess2");if(g&&!(L.pres[L.pi].checked))L.pres[L.pi].guess=g.value;render();return true;}
    case "pprev2":if(L.pi>0)L.pi--;render();return true;

    case "fcheck":{const f=FIX[L.fi];const id="fix"+L.fi;const ta=document.getElementById("code-"+id);const ii=document.getElementById("in-"+id);const src=ta?ta.value:f.src;CS.src[id]=src;const inp=ii?ii.value:(f.inp||"");CS.inp[id]=inp;const r=runCpp(src,inp);CS.out[id]=r;
      const got=(r.out||"").replace(/\r/g,"").replace(/\s+$/,"");
      let msg,ok=false;
      if(!r.ok){msg=r.title+". "+r.detail;}
      else if(got===f.exp){ok=true;msg="The output matches the goal.";}
      else msg="It runs, but the output is different from the goal. Expected \""+f.exp.replace(/\n/g," / ")+"\" and got \""+got.replace(/\n/g," / ")+"\".";
      L.fres[L.fi]={ok:ok,msg:msg};render();return true;}
    case "fhint":L.fshow[L.fi]=Math.max(L.fshow[L.fi]||0,1);render();return true;
    case "fsol":L.fshow[L.fi]=2;render();return true;
    case "fprev":if(L.fi>0)L.fi--;render();return true;
    case "fnext":if(L.fi+1<FIX.length)L.fi++;render();return true;
    case "lsdim":L.sd.dim=+v;L.sd.s=0;L.sd.t=0;sdNew();render();return true;

function stepIds(st){const ids=[];CARDS.forEach((c,i)=>{if(st.sec.includes(c[0]))ids.push(i);});return ids.filter(i=>i<ORIG).concat(ids.filter(i=>i>=ORIG));}

function applyRate(queue,v){const id=queue.shift();let b=store.box[id]||0;
  if(v==="miss"){b=1;queue.splice(Math.min(3,queue.length),0,id);}
  else if(v==="almost"){b=Math.max(b,1);queue.push(id);}
  else{b=b<2?2:3;}
  store.box[id]=b;save();}
function openStep(s){

  }else if(P.ph==="roundend"){
    const last=P.ch+1>=N;
    h+=`<div class="panel"><h3>Round ${P.ch+1} done</h3><p>${last?"That was the last round of cards. Two short exercises remain: fill the gaps in the summary, then a brain dump.":"Next you will see "+chunks[P.ch+1].length+" new cards."}</p><div class="row"><button class="btn primary" data-act="pnext">${last?"Fill the gaps":"Start round "+(P.ch+2)}</button></div></div>`;
  }else if(P.ph==="gaps"){
    h+='<p class="hint">Say each hidden term aloud before you tap it.</p><div class="row"><button class="btn" data-act="revall">Reveal all</button><button class="btn" data-act="hideall">Hide all</button></div>';
    st.notes.forEach(ni=>{const n=NOTES[ni];h+=`<div class="panel note"><h3>${esc(n[0])}</h3><p>${blankHtml(n[1])}</p></div>`;});
    h+='<div class="row"><button class="btn primary" data-act="pdump">Continue to brain dump</button></div>';
  }else if(P.ph==="dump"){
    const pts=[];st.dump.forEach(d=>DUMPS[d].p.forEach(p=>pts.push(p)));
    h+=`<div class="panel"><h3>Brain dump</h3><p class="hint">Close everything and write what you remember about this step. Then compare.</p><textarea id="ptext" placeholder="Write it in your own words...">${esc(P.text)}</textarea>`;
    if(!P.dchecked)h+='<div class="row"><button class="btn primary" data-act="pcheck">Compare with key points</button></div>';
    else{const got=pts.filter((_,i)=>P.ticks[i]).length;
      h+=`<div class="lab">Tick what you included</div><div class="pts">${pts.map((p,i)=>`<label><input type="checkbox" data-act="ptick" data-i="${i}"${P.ticks[i]?" checked":""}><span>${esc(p)}</span></label>`).join("")}</div><div class="row"><b>${got} of ${pts.length} covered</b><button class="btn primary" data-act="pfinish">Finish this step</button></div>`;}
    h+="</div>";
  }else{
    const ids=stepIds(st),m=ids.filter(i=>(store.box[i]||0)>=2).length;
    h+=`<div class="panel"><h3>Step ${P.step+1} complete</h3><p>${m} of ${ids.length} cards in this step are at Review or Mastered. The rest keep coming back in Recall cards.</p><div class="row">${P.step+1<STEPS.length?`<button class="btn primary" data-act="pnextstep">Next: ${esc(STEPS[P.step+1].t)}</button>`:""}<button class="btn" data-act="pback">All steps</button></div></div>`;
  }
  return '<div style="display:flex;flex-direction:column;gap:16px">'+h+"</div>";
}

/* ============ EVALUATE ============ */
function countOf(k){return BANK.filter(b=>b.t===k).length;}
function viewEval(){
  if(S.ev.view==="setup")return evalSetup();
  if(S.ev.view==="quiz")return evalQuiz();
  return evalResult();
}
function evalSetup(){
  let h='<div class="panel"><h2>Build a test</h2><p class="hint">Choose the question types. Written answers (short, long, scenario) are self-marked against the key points, like checking your own paper.</p><div style="display:flex;flex-direction:column;gap:8px">';
  TYPES.forEach(t=>{h+=`<div class="tcount"><label><input type="checkbox" data-act="etype" data-v="${t.k}"${S.ev.types[t.k]?" checked":""}><span>${esc(t.n)}</span></label><span class="n">${countOf(t.k)} Qs · ${t.m} mark${t.m>1?"s":""} each</span></div>`;});
  const pool=BANK.filter(b=>S.ev.types[b.t]).length;
  h+=`</div><div class="row"><label for="en" class="lab">Length</label><select id="en" style="width:auto"><option value="10"${S.ev.n==10?" selected":""}>10 questions</option><option value="20"${S.ev.n==20?" selected":""}>20 questions</option><option value="35"${S.ev.n==35?" selected":""}>35 questions</option><option value="0"${S.ev.n==0?" selected":""}>Everything selected (${pool})</option></select></div><div class="row"><button class="btn primary" data-act="estart"${pool?"":" disabled"}>Start test</button></div></div>`;
  if(store.hist.length){
    h+='<div class="panel"><h3>Recent tests</h3>'+store.hist.slice(0,6).map(x=>`<div class="row" style="justify-content:space-between"><span>${esc(x.d)} · ${x.n} questions</span><b>${x.pct}%</b></div>`).join("")+"</div>";
  }
  return '<div style="display:flex;flex-direction:column;gap:18px">'+h+"</div>";
}
function startRun(list){
  const qs=list.map(q=>q.t==="mcq"?Object.assign({},q,{o:shuffle(q.opts.map((t,i)=>({t:t,c:i===q.a})))}):q);
  S.run={qs:qs,i:0,res:[],stage:[],ticks:[],text:[]};S.ev.view="quiz";render();window.scrollTo(0,0);
}
function evalQuiz(){
  const r=S.run,q=r.qs[r.i],res=r.res[r.i],T=TM[q.t];
  let h=`<div class="panel"><div class="row" style="justify-content:space-between"><span class="tag">${esc(T.n)}</span><span class="lab">Question ${r.i+1} of ${r.qs.length} · ${T.m} mark${T.m>1?"s":""}</span></div><div class="bar" aria-hidden="true"><i style="width:${Math.round(r.i/r.qs.length*100)}%"></i></div>`;
  h+=`<h3 style="font-size:1.2rem;line-height:1.35">${esc(q.t==="fill"?q.q.replace("___","_______"):q.q)}</h3>`;
  if(q.t==="calc"&&q.src)h+='<pre class="codeview">'+esc(q.src)+'</pre>';
  if(q.t==="mcq"){
    h+='<div class="opts">'+q.o.map((o,i)=>{let c="opt";if(res){if(o.c)c+=" right";else if(res.pick===i)c+=" wrong";}return `<button class="${c}" data-act="mcq" data-i="${i}"${res?" disabled":""}>${esc(o.t)}</button>`;}).join("")+"</div>";
    if(res)h+=`<div class="fb ${res.score?"ok":"no"}"><b>${res.score?"Correct.":"Not quite."}</b> ${esc(q.e)}</div>`;
  }else if(q.t==="tf"){
    h+='<div class="opts">'+[true,false].map(v=>{let c="opt";if(res){if(q.a===v)c+=" right";else if(res.pick===v)c+=" wrong";}return `<button class="${c}" data-act="tf" data-v="${v}"${res?" disabled":""}>${v?"True":"False"}</button>`;}).join("")+"</div>";
    if(res)h+=`<div class="fb ${res.score?"ok":"no"}"><b>${res.score?"Correct.":"Not quite."}</b> ${esc(q.e)}</div>`;
  }else if(q.t==="fill"||q.t==="vsa"||q.t==="calc"){
    h+=`<input type="text" id="ans" autocomplete="off" placeholder="Type your answer" value="${esc(r.text[r.i]||"")}"${res?" disabled":""}>`;
    if(!res)h+='<div class="row"><button class="btn primary" data-act="check">Check</button></div>';
    else{
      h+=`<div class="fb ${res.score?"ok":"no"}"><b>${res.score?"Correct.":"Model answer:"}</b> ${res.score?"":esc(q.model)} ${q.e?esc(q.e):""}</div>`;
      if(!res.score)h+='<div class="row"><button class="btn" data-act="override">I was right, count it</button></div>';
    }
  }else{
    const st=r.stage[r.i]||0;
    h+=`<textarea id="wtext" placeholder="Write your answer as you would in the exam..."${st?" disabled":""}>${esc(r.text[r.i]||"")}</textarea>`;
    if(!st)h+='<div class="row"><button class="btn primary" data-act="reveal">Show model answer</button></div>';
    else{
      const tk=r.ticks[r.i]||{};const got=q.pts.filter((_,i)=>tk[i]).length;
      h+=`<div class="lab">Model answer</div><div class="a" style="border-left:3px solid var(--accent);padding-left:14px">${esc(q.model)}</div><div class="lab">Tick every marking point your answer made</div><div class="pts">`+q.pts.map((p,i)=>`<label><input type="checkbox" data-act="wtick" data-i="${i}"${tk[i]?" checked":""}${res?" disabled":""}><span>${esc(p)}</span></label>`).join("")+"</div>";
      if(!res)h+=`<div class="row"><button class="btn primary" data-act="wsave">Save score (${fmt(got/q.pts.length*T.m)} of ${T.m})</button></div>`;
      else h+=`<div class="fb ${res.score>=T.m?"ok":"no"}">Scored ${fmt(res.score)} of ${T.m}.</div>`;
    }
  }
  if(res){h+=`<div class="row"><button class="btn primary" data-act="next">${r.i+1<r.qs.length?"Next question":"See results"}</button></div>`;}
  return h+"</div>";
}
function fmt(x){return (Math.round(x*2)/2).toString();}
function setRes(score,extra){const r=S.run,q=r.qs[r.i];r.res[r.i]=Object.assign({score:score,max:TM[q.t].m},extra||{});render();}
function evalResult(){
  const r=S.run;let sc=0,mx=0;const by={};
  r.qs.forEach((q,i)=>{const x=r.res[i]||{score:0,max:TM[q.t].m};sc+=x.score;mx+=x.max;const b=by[q.t]||(by[q.t]={s:0,m:0,n:0});b.s+=x.score;b.m+=x.max;b.n++;});
  const pct=Math.round(sc/mx*100);
  const msg=pct>=85?"Exam ready on this material.":pct>=65?"Solid. Revisit the misses below.":pct>=40?"Getting there. Use the Learn section on the weak topics.":"Go back to the recall cards, then try again.";
  let h=`<div class="panel"><div class="lab">Result</div><div class="score">${fmt(sc)} / ${mx} <span style="font-size:1.5rem;color:var(--muted)">${pct}%</span></div><p>${msg}</p><div style="display:flex;flex-direction:column;gap:10px">`;
  TYPES.forEach(t=>{const b=by[t.k];if(!b)return;const p=Math.round(b.s/b.m*100);h+=`<div><div class="row" style="justify-content:space-between"><span>${esc(t.n)} (${b.n})</span><b>${fmt(b.s)}/${b.m}</b></div><div class="bar"><i style="width:${p}%"></i></div></div>`;});
  const missed=r.qs.filter((q,i)=>(r.res[i]||{score:0}).score<TM[q.t].m).length;
  h+=`</div><div class="row">${missed?`<button class="btn primary" data-act="retry">Retry the ${missed} missed</button>`:""}<button class="btn" data-act="newtest">New test</button></div></div>`;
  h+="<h2>Review</h2>";
  r.qs.forEach((q,i)=>{const x=r.res[i]||{score:0,max:TM[q.t].m};const ok=x.score>=x.max;
    let ans=q.t==="mcq"?q.opts[q.a]:q.t==="tf"?(q.a?"True":"False"):q.model;
    h+=`<div class="rev ${ok?"ok":"bad"}"><div class="lab">${esc(TM[q.t].n)} · ${fmt(x.score)}/${x.max}</div><b>${esc(q.q)}</b>${x.resp?`<div class="r">You: ${esc(x.resp)}</div>`:""}<div class="r">${ok?"":"Answer: "}${esc(ans)}</div></div>`;});
  return '<div style="display:flex;flex-direction:column;gap:14px">'+h+"</div>";
}
function finishRun(){
  const r=S.run;let sc=0,mx=0;r.qs.forEach((q,i)=>{const x=r.res[i]||{score:0,max:TM[q.t].m};sc+=x.score;mx+=x.max;});
  if(!r.retry){store.hist.unshift({d:new Date().toLocaleDateString(undefined,{day:"numeric",month:"short"}),pct:Math.round(sc/mx*100),n:r.qs.length});store.hist=store.hist.slice(0,8);save();}
  S.ev.view="result";
}

/* ============ EVENTS ============ */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");if(!el)return;
  const a=el.dataset.act,v=el.dataset.v;
  switch(a){
    case "tab":S.tab=v;render();break;
    case "lv":S.lv=v;render();break;
    case "csec":S.cards.sec=+v;buildQueue();render();break;
    case "flip":S.cards.flip=true;render();break;
    case "cnext":buildQueue();render();break;
    case "creset":CARDS.forEach((k,i)=>{if(S.cards.sec<0||k[0]===S.cards.sec)delete store.box[i];});save();buildQueue();render();break;
    case "rate":{const q=S.cards.queue,id=q.shift();let b=store.box[id]||0;
      if(v==="miss"){b=1;q.splice(Math.min(3,q.length),0,id);}
      else if(v==="almost"){b=Math.max(b,1);q.push(id);}
      else{b=b<2?2:3;S.cards.done++;}
      store.box[id]=b;save();S.cards.flip=false;S.cards.guess="";render();break;}
    case "cord":S.cards.ordered=v==="1";buildQueue();render();break;
    case "pstep":openStep(+v);break;
    case "pback":S.path.step=null;render();window.scrollTo(0,0);break;
    case "pnotes":S.path.ph="primer";render();window.scrollTo(0,0);break;
    case "pstart":S.path.ph="learn";S.path.i=0;render();break;
    case "plback":if(S.path.i>0)S.path.i--;render();break;
    case "plnext":{const P=S.path,ids=stepChunks(STEPS[P.step])[P.ch];
      if(P.i+1<ids.length)P.i++;else{P.ph="recall";P.q=shuffle(ids.slice());P.flip=false;P.guess="";}
      render();break;}
    case "pflip":S.path.flip=true;render();break;
    case "prate":{const P=S.path;applyRate(P.q,v);P.flip=false;P.guess="";
      if(!P.q.length){store.path.ch[P.step]=P.ch+1;save();P.ph="roundend";}
      render();break;}
    case "pnext":{const P=S.path,N=stepChunks(STEPS[P.step]).length;
      if(P.ch+1<N){P.ch++;P.ph="learn";P.i=0;}else P.ph="gaps";
      render();window.scrollTo(0,0);break;}
    case "pdump":S.path.ph="dump";render();window.scrollTo(0,0);break;
    case "pcheck":{const t=$("#ptext");if(t)S.path.text=t.value;S.path.dchecked=true;render();break;}
    case "pfinish":store.path.done[S.path.step]=true;save();S.path.ph="done";render();window.scrollTo(0,0);break;
    case "pnextstep":openStep(S.path.step+1);break;
    case "blank":el.classList.toggle("on");break;
    case "revall":document.querySelectorAll(".blank").forEach(b=>b.classList.add("on"));break;
    case "hideall":document.querySelectorAll(".blank").forEach(b=>b.classList.remove("on"));break;
    case "mask":if(el.classList.contains("hid")){el.classList.remove("hid");el.removeAttribute("role");}break;
    case "tmode":S.tmode[el.dataset.t]=v;render();break;
    case "dtopic":S.dump={i:+v,text:"",checked:false,ticks:{}};render();break;
    case "dcheck":S.dump.checked=true;render();break;
    case "dreset":S.dump.checked=false;S.dump.ticks={};S.dump.text="";render();break;
    case "estart":{const pool=shuffle(BANK.filter(b=>S.ev.types[b.t]));const list=S.ev.n?pool.slice(0,S.ev.n):pool;
      list.sort((x,y)=>TYPES.findIndex(t=>t.k===x.t)-TYPES.findIndex(t=>t.k===y.t));startRun(list);break;}
    case "mcq":{const r=S.run,q=r.qs[r.i],i=+el.dataset.i;setRes(q.o[i].c?1:0,{pick:i,resp:q.o[i].t});break;}
    case "tf":{const r=S.run,q=r.qs[r.i],p=v==="true";setRes(p===q.a?1:0,{pick:p,resp:p?"True":"False"});break;}
    case "check":doCheck();break;
    case "override":{const r=S.run;r.res[r.i].score=TM[r.qs[r.i].t].m;render();break;}
    case "reveal":{const r=S.run;r.text[r.i]=$("#wtext").value;r.stage[r.i]=1;render();break;}
    case "wsave":{const r=S.run,q=r.qs[r.i],tk=r.ticks[r.i]||{};const got=q.pts.filter((_,i)=>tk[i]).length;setRes(Math.round(got/q.pts.length*TM[q.t].m*2)/2,{resp:r.text[r.i]||""});break;}
    case "next":{const r=S.run;if(r.i+1<r.qs.length){r.i++;render();window.scrollTo(0,0);}else{finishRun();render();window.scrollTo(0,0);}break;}
    case "retry":{const r=S.run;const list=r.qs.filter((q,i)=>(r.res[i]||{score:0}).score<TM[q.t].m);startRun(list);S.run.retry=true;break;}
    case "newtest":S.ev.view="setup";S.run=null;render();break;
    default:labClick(a,el,v);
  }
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.dataset.lsel){labSelect(el);return;}
  if(el.dataset.act==="etype"){S.ev.types[el.dataset.v]=el.checked?1:0;render();}
  else if(el.id==="en"){S.ev.n=+el.value;}
  else if(el.dataset.act==="ptick"){S.path.ticks[el.dataset.i]=el.checked;render();}
  else if(el.dataset.act==="dtick"){S.dump.ticks[el.dataset.i]=el.checked;render();}
  else if(el.dataset.act==="wtick"){const r=S.run;r.ticks[r.i]=r.ticks[r.i]||{};r.ticks[r.i][el.dataset.i]=el.checked;render();}
});
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.dataset&&el.dataset.cid){CS.src[el.dataset.cid]=el.value;return;}
  if(el.dataset&&el.dataset.iid){CS.inp[el.dataset.iid]=el.value;return;}
  if(el.dataset&&(el.dataset.lin||el.dataset.tcell!==undefined)){labInput(el);return;}
  if(el.id==="guess")S.cards.guess=el.value;
  else if(el.id==="pguess")S.path.guess=el.value;
  else if(el.id==="ptext")S.path.text=el.value;
  else if(el.id==="dtext")S.dump.text=el.value;
  else if(el.id==="ans"&&S.run)S.run.text[S.run.i]=el.value;
});
function doCheck(){
  const r=S.run,q=r.qs[r.i],v=($("#ans").value||"").trim();if(!v)return;
  r.text[r.i]=v;setRes((q.t==="calc"?matchCalc(v,q):matches(v,q.acc,q.all))?TM[q.t].m:0,{resp:v});
}
document.addEventListener("keydown",e=>{
  const t=e.target,tag=t.tagName;
  if(e.key==="Enter"&&t.id==="ans"){e.preventDefault();doCheck();return;}
  if(t.classList&&t.classList.contains("codearea")){
    if(e.key==="Tab"&&!e.shiftKey){e.preventDefault();const p=t.selectionStart;t.setRangeText("    ",p,t.selectionEnd,"end");CS.src[t.dataset.cid]=t.value;return;}
    if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)){e.preventDefault();const b=t.closest(".cw").parentElement.querySelector('[data-act="crun"],[data-act="fcheck"]');if(b)b.click();return;}
  }
  if(e.key==="Enter"&&t.id==="pguess2"){e.preventDefault();const b=document.querySelector('[data-act="pcheck2"]');if(b&&!b.disabled)b.click();return;}
  if((e.key==="Enter"||e.key===" ")&&t.classList&&t.classList.contains("hid")){e.preventDefault();t.click();return;}
  const inPath=S.tab==="learn"&&S.lv==="path"&&S.path.ph==="recall"&&S.path.q.length>0;
  const inCards=S.tab==="learn"&&S.lv==="cards"&&S.cards.queue.length>0;
  if(!(inPath||inCards)||tag==="INPUT"||tag==="TEXTAREA"||tag==="SELECT")return;
  const flipped=inPath?S.path.flip:S.cards.flip;
  if((e.key===" "||e.key==="Enter")&&tag!=="BUTTON"&&!flipped){e.preventDefault();if(inPath)S.path.flip=true;else S.cards.flip=true;render();}
  else if(flipped&&"123".includes(e.key)&&e.key){const m={"1":"miss","2":"almost","3":"got"};const b=document.querySelector('[data-act$="rate"][data-v="'+m[e.key]+'"]');if(b)b.click();}
});
render();
</script>

</body></html>
