:root{--code-bg:#fbfaf6;--code-fg:#1b2a22;--code-line:#d5ddd6;--ok-b:#0a6a4d;--ok-s:#dcefe6;--note-b:#9a4a08;--note-s:#f6e6d4}

.codearea{width:100%;resize:vertical;min-height:5rem}

ol.pipe{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0}

.exp{font-family:var(--mono);font-size:.92rem}.exp.res{color:var(--accent);font-weight:600}

.nb ol.pipe{margin-top:4px}

const NOTES=[
["1.1 The internet and its history","The internet is the world's largest {{Wide Area Network}}, a decentralised network of networks built on the {{TCP/IP}} suite and owned by no single body. Its origin is {{ARPANET}}, a US Department of Defense project of {{1969}}, which first connected {{four}} universities. {{Vint Cerf}} and {{Bob Kahn}} developed TCP/IP; ARPANET adopted it in {{1983}}; ARPANET was decommissioned in {{1991}}. The defining innovation was {{packet switching}}: data is broken into independently addressed {{packets}} that may take different routes and are {{reassembled}} at the destination. {{Circuit switching}}, used by the telephone network (PSTN), reserves one dedicated path for the whole session even when idle. Packet switching shares links efficiently and {{reroutes}} around failures, but packets may arrive out of {{order}}."],
["1.1 The Web, the internet and ISPs","The {{World Wide Web}} was invented by {{Tim Berners-Lee}} in {{1989}} at {{CERN}}, using three technologies: {{HTML}}, {{HTTP}} and {{URLs}}. The Web is only one {{service}} running on the internet, which is the {{infrastructure}}; email, FTP and VoIP use the internet without being part of the Web. An {{ISP}} provides access to the internet {{backbone}}, reached through {{Internet Exchange Points}}, using DSL, cable, fibre, satellite or mobile broadband. {{Net neutrality}} is the principle that an ISP must treat all data {{equally}}; in India {{TRAI}} has issued rules broadly supporting it."],
["1.2 Browsers, cookies and search engines","A {{web browser}} sends HTTP or HTTPS requests and {{renders}} the HTML, CSS and JavaScript it receives; it contains a rendering engine, a {{JavaScript engine}}, a networking stack and a security layer. HTTP is {{stateless}}; a {{cookie}} (usually a random {{session ID}}) lets the server look up stored state on every request. A {{search engine}} searches a pre-built {{index}}, not the live web. A {{crawler}} downloads pages, the {{indexer}} builds an {{inverted index}}, and the ranking algorithm (Google's {{PageRank}} counts incoming links) orders the results."],
["1.2 URLs and domain names","A {{URL}} has a {{scheme}}, a {{host}}, an optional {{port}} (HTTPS defaults to {{443}}), a {{path}}, a {{query}} after {{?}} and a {{fragment}} after {{#}}. A domain name is read from {{right to left}}: the {{TLD}} (.com, .org, .net, .edu, .gov), the second-level domain, then subdomains such as www. A {{ccTLD}} is a two-letter country code, such as {{.in}} for India. Domain names are registered through accredited registrars and governed globally by {{ICANN}}."],
["1.2 DNS, web pages and hyperlinks","{{DNS}} translates domain names into IP addresses. The browser checks its {{cache}}, then asks the {{resolver}}; the resolver contacts a {{root}} server, then the {{TLD}} nameserver, then the {{authoritative}} nameserver, which supplies the IP address; the resolver caches and returns it. A {{web page}} is one HTML document; a {{website}} is a collection of related pages sharing a domain, whose default page is the {{home page}}. A {{hyperlink}} is created with the {{anchor}} tag and its {{href}} attribute; the visible clickable text is the {{anchor text}}."],
["1.3 Internet addressing","An {{IP address}} uniquely identifies a device. {{IPv4}} uses {{32}} bits in {{dotted decimal}} notation: four {{octets}} of 8 bits, each 0 to {{255}}; it gives 2^32, about {{4.3 billion}} addresses, exhausted around {{2011}}. {{NAT}} lets many devices on a private network (192.168.x.x or 10.x.x.x) share one {{public}} address. {{IPv6}} uses {{128}} bits in {{hexadecimal}}, eight groups of four digits separated by colons, giving about {{340 undecillion}} addresses, needs no NAT and has built-in {{IPsec}}. Leading zeros may be omitted and one run of zero groups replaced by {{::}}. IPv4 and IPv6 run in parallel by {{dual-stack}}."],
["1.4 Internet services","{{Downloading}} moves data from a server to the device; {{uploading}} is the reverse. Home connections are {{asymmetric}}; business and fibre connections are {{symmetric}}. A {{CDN}} keeps copies on {{edge servers}} near users, reducing {{latency}} and origin-server load. {{FTP}} transfers files; public servers use the username {{anonymous}}. {{VoIP}} digitises and compresses voice, packetises it and sends it over {{UDP}} for low latency; its challenges are {{latency}}, {{jitter}} and {{packet loss}}, managed by {{QoS}} and a {{jitter buffer}}. {{Video conferencing}} is VoIP plus synchronised video. Online collaboration includes shared document editing, project management and team messaging."],
["1.5 Cloud computing","{{Cloud computing}} is the on-demand, {{pay-as-you-go}} delivery of computing services over the internet. {{Cloud storage}} keeps files on remote servers, synchronised across devices and acting as an off-site {{backup}}. In {{IaaS}} the customer manages the operating system, runtime and application (AWS EC2). In {{PaaS}} the customer manages only the {{application}} (Heroku, Google App Engine). In {{SaaS}} the provider manages everything (Gmail, Zoom). Advantages: capital expenditure becomes {{operational}} expenditure, rapid {{scalability}}, high availability. Challenges: internet dependency, data privacy and security, {{vendor lock-in}} and accumulating subscription costs."],
["1.6 Digital citizenship","{{Digital citizenship}} is the responsible, ethical and thoughtful use of technology and the internet. {{Netiquette}} means polite online behaviour: no {{ALL CAPITAL LETTERS}}, care with {{sarcasm}}, verify before forwarding, assume {{good faith}}. {{Phishing}} impersonates a legitimate organisation and creates urgency or fear. Evaluate information by {{source}}, corroboration, date and bias. Digital content is {{copyrighted}}; {{Creative Commons}} licences state the terms of free use. {{Cyberbullying}} is harassment through digital tools. A {{digital footprint}} is the permanent trail of online data. Excess screen time harms sleep, activity and focus."]
];

const CORE=[
[0,"Define the internet.","The world's largest Wide Area Network: a massive, global, decentralised system of interconnected computer networks, owned by no single government, organisation or company, built on shared open standards, most fundamentally the TCP/IP protocol suite."],
[0,"What does 'internet' mean as a word?","It comes from 'internetwork': a network of networks, formed by the voluntary interconnection of hundreds of thousands of corporate, university, government and ISP networks that exchange traffic using TCP/IP."],
[0,"What is ARPANET?","The Advanced Research Projects Agency Network: a US Department of Defense research project established in 1969, from which the internet originated."],
[0,"What was ARPANET designed to achieve?","A communication network able to survive a nuclear attack by routing around damaged nodes, in contrast with centralised switching systems that were single points of failure."],
[0,"Which four universities did ARPANET first connect?","UCLA, Stanford Research Institute, UC Santa Barbara and the University of Utah."],
[0,"Who are called the 'fathers of the internet', and why?","Vint Cerf and Bob Kahn, who developed the TCP/IP protocol suite in the 1970s, giving different networks a common language."],
[0,"Why is 1983 significant in internet history?","ARPANET formally adopted TCP/IP in 1983, a date often considered the formal birth of the modern internet."],
[0,"When was ARPANET decommissioned?","In 1991, having been superseded by the modern internet infrastructure it had made possible."],
[0,"Define packet switching.","Data is broken into small, independently addressed packets, each of which may travel by a different route and which are reassembled into the original message only on arrival at the destination."],
[0,"Define circuit switching.","A single dedicated physical path is established and reserved for the entire duration of a call before any data flows, and held exclusively for that conversation even during silence (the traditional telephone network, PSTN)."],
[0,"State two advantages of packet switching over circuit switching.","Efficiency: many communications share the same links at once, so capacity is not wasted on idle circuits. Resilience: each packet finds its own route, so packets reroute around failed links or routers."],
[0,"What is the cost of packet switching?","Packets can arrive out of order or be delayed unpredictably; TCP sequencing and reassembly, and VoIP jitter handling, exist to manage this."],
[1,"Define the World Wide Web.","A vast system of interlinked documents and resources (web pages, images, videos, files) accessible over the internet."],
[1,"Who invented the Web, where and when?","Sir Tim Berners-Lee, in 1989, while working at CERN, the physics research laboratory in Switzerland."],
[1,"Name the three technologies Berners-Lee developed for the Web.","HTML (HyperText Markup Language) for creating and formatting pages; HTTP (HyperText Transfer Protocol) for requesting and transmitting pages; URLs (Uniform Resource Locators) for identifying and locating resources."],
[1,"When did the Web become publicly available?","August 1991."],
[1,"Distinguish the internet from the World Wide Web.","The internet is the underlying global infrastructure: the cables, routers, servers and protocols. The Web is one service running on top of it: the system of interlinked pages accessed through browsers using HTTP/HTTPS and URLs. Email, FTP, VoIP and video streaming use the internet without being part of the Web."],
[1,"Give three internet services that are not part of the Web.","Email, FTP, VoIP (and video streaming)."],
[1,"What is the commonest misconception in this chapter?","Treating the internet and the Web as synonyms. The strongest answer states the relationship (infrastructure versus one service running on it) and names another service such as email, FTP or VoIP."],
[1,"Define an ISP.","An Internet Service Provider: a company providing individuals, businesses and organisations with access to the internet."],
[1,"What does an ISP own and operate?","The infrastructure that physically connects customers to the internet backbone, the high-capacity core network carrying most global traffic."],
[1,"What is an Internet Exchange Point (IXP)?","A large interconnection point where multiple ISPs and network operators physically exchange traffic with one another."],
[1,"List the ways an ISP can provide connectivity.","DSL (copper telephone lines), cable internet (coaxial TV infrastructure), fibre optic, satellite and mobile broadband (3G, 4G, 5G)."],
[1,"What services do ISPs commonly provide besides connectivity?","They assign IP addresses, provide DNS resolution and often bundle email and web hosting."],
[1,"Name some major ISPs in India.","Jio, Airtel, BSNL, Vodafone Idea and ACT Fibernet."],
[1,"Define net neutrality.","The principle that an ISP should treat all data on its network equally, not blocking, slowing or charging differently for particular websites, applications or types of content."],
[1,"Give one argument for and one against net neutrality.","For: it keeps a level playing field, so a start-up's site loads as fast as a corporation's, protecting innovation. Against: ISPs should be free to manage capacity and offer differentiated pricing tiers, as other utilities do."],
[1,"Which Indian authority issued rules broadly supporting net neutrality?","The Telecom Regulatory Authority of India (TRAI)."],
[2,"Define a web browser.","A software application that enables users to access, retrieve and display content from the World Wide Web: it sends HTTP or HTTPS requests, receives HTML, CSS, JavaScript and media, and renders the page."],
[2,"What does 'render' mean?","To interpret and visually display content as the page the user sees."],
[2,"Name the internal components of a modern browser.","A rendering engine (HTML and CSS layout), a JavaScript engine, a networking stack (HTTP/HTTPS) and a security layer (same-origin policy, blocking malicious content)."],
[2,"Name five widely used browsers.","Google Chrome (market leader), Mozilla Firefox, Microsoft Edge (Chromium engine), Apple Safari and Opera."],
[2,"What does it mean that HTTP is stateless?","Each request is treated independently, with no built-in memory of previous requests."],
[2,"Define a cookie.","A small piece of data the server asks the browser to store and to send back automatically with every subsequent request to the same site."],
[2,"How does a cookie let a website remember that you are logged in?","A session cookie holds only a random session ID. The server keeps the meaningful state (who you are, your cart) on its side, indexed by that ID, and looks it up on every request the cookie accompanies."],
[2,"Why do browsers offer controls over third-party cookies?","Cookies underlie much web advertising tracking, so browsers let users block or limit them."],
[2,"Define a search engine.","A web-based service that finds pages relevant to a query by maintaining a massive, continuously updated index of billions of pages and a fast, relevance-ranked interface to it."],
[2,"Does a search query search the live web?","No. It searches a pre-built index, not the live web in real time."],
[2,"What is a web crawler?","Also called a spider: an automated program that continuously browses the web, following hyperlinks and downloading page content for analysis."],
[2,"What does the indexer do?","Processes crawled content, extracting words and building an inverted index."],
[2,"What is PageRank?","Google's foundational ranking algorithm, which considers the quality and quantity of incoming links to a page."],
[2,"Name the main search engines.","Google (dominant globally), Microsoft Bing, Yahoo, Baidu (dominant in China) and DuckDuckGo (emphasises privacy)."],
[3,"Define a URL.","Uniform Resource Locator: the complete, standardised address identifying and locating a specific resource on the internet."],
[3,"Name the components of a URL.","Scheme, host, port, path, query and fragment."],
[3,"Identify the components of https://www.example.com:443/path/to/page.html?query=value#section","Scheme https; host www.example.com; port 443; path /path/to/page.html; query query=value; fragment section."],
[3,"What is the default port for HTTPS?","443 (usually omitted from the URL)."],
[3,"What does the fragment of a URL do?","Written after #, it jumps the browser to a specific section within the page."],
[3,"What does the query of a URL do?","Written after ?, it provides additional parameters (data) to the server."],
[3,"Define a domain name.","The human-readable name identifying a website, such as google.com or mygov.in; computers use numerical IP addresses, so domain names supply a usability layer with automatic translation underneath."],
[3,"In which direction is a domain name read?","From right to left: the top level domain, then the second-level domain, then any subdomains."],
[3,"What is a TLD? Give examples.","Top Level Domain, the rightmost part. Generic TLDs: .com (commercial), .org (non-profit), .net, .edu, .gov."],
[3,"What is a ccTLD?","Country Code Top Level Domain: a two-letter country code such as .in (India), .uk and .jp."],
[3,"Identify the parts of mail.google.com.","TLD: com; second-level domain: google; subdomain: mail."],
[3,"Who governs domain names globally?","ICANN (Internet Corporation for Assigned Names and Numbers); names are registered through accredited registrars."],
[4,"Define DNS.","The Domain Name System: the internet's 'phone book' that translates human-readable domain names into numerical IP addresses; a massive, globally distributed, hierarchical database across thousands of servers."],
[4,"State the DNS resolution sequence in order.","Local cache; configured DNS resolver; root DNS server; TLD nameserver; authoritative nameserver (supplies the IP address); the resolver caches the result and returns it to the browser."],
[4,"What is a DNS resolver, and who provides it?","The server the browser queries when the answer is not cached; typically provided by the ISP or a public service such as Google 8.8.8.8 or Cloudflare 1.1.1.1."],
[4,"What does a root DNS server do?","It is the top of the DNS hierarchy; it directs the resolver to the appropriate TLD nameserver."],
[4,"What does a TLD nameserver do?","It directs the resolver to the authoritative nameserver for the specific domain."],
[4,"What does the authoritative nameserver do?","It finally supplies the IP address of the domain."],
[4,"Define a web page.","A single document accessible on the Web, written in HTML, typically using CSS for styling and JavaScript for interactive behaviour."],
[4,"Define a website.","A collection of related pages and associated content hosted on the same server, sharing a common domain name and navigational structure."],
[4,"What is a home page?","The default (index) page served when a user navigates to a site's root URL without specifying a path."],
[4,"Define a hyperlink.","A clickable reference embedded in a page that, when clicked, navigates the browser to another resource; it creates the connections that make the Web a 'web'."],
[4,"How is a hyperlink created in HTML?","With the anchor tag, using its href attribute to give the URL of the target; the visible clickable text is the anchor text."],
[5,"What is an IP address?","A unique numerical address identifying a device communicating on the internet so data can be routed from source to destination."],
[5,"Describe the IPv4 address format.","A 32-bit binary number written in dotted decimal notation: four 8-bit groups (octets), each converted to decimal (0 to 255) and separated by dots."],
[5,"Convert 192.168.1.1 to binary.","11000000.10101000.00000001.00000001."],
[5,"How many addresses does IPv4 provide?","2^32, about 4.3 billion."],
[5,"Why was IPv4 exhausted?","Billions of people each own multiple devices, besides billions of servers, routers and IoT devices; IANA allocated its last address blocks to regional registries around 2011."],
[5,"Define NAT.","Network Address Translation: a technique letting multiple devices on a private network share a single public IPv4 address."],
[5,"Explain how NAT works in a home router.","Devices receive private addresses (192.168.x.x or 10.x.x.x) not routable on the public internet; the router presents all of them with its single public address and tracks internally which device each connection belongs to."],
[5,"What are the drawbacks of NAT?","It is a workaround, not a permanent solution; a device behind NAT is not directly reachable from outside, so VoIP and peer-to-peer applications may need extra configuration."],
[5,"Describe the IPv6 address format.","128 bits in hexadecimal: eight groups of four hex digits separated by colons, for example 2001:0db8:85a3:0000:0000:8a2e:0370:7334."],
[5,"How many addresses does IPv6 provide?","2^128, about 340 undecillion (340 followed by 36 zeros)."],
[5,"State the two rules for shortening an IPv6 address.","Leading zeros within a group may be omitted; one contiguous run of all-zero groups may be replaced with a double colon (::)."],
[5,"Shorten 2001:0db8:85a3:0000:0000:8a2e:0370:7334.","2001:db8:85a3::8a2e:370:7334."],
[5,"List the improvements IPv6 brings besides a larger address space.","Built-in IPsec encryption and authentication, a more efficient packet header, better multicast support, and no need for NAT."],
[5,"Why has IPv6 adoption been gradual?","Standardised in 1998, it requires a large-scale infrastructure upgrade; IPv4 and IPv6 therefore run in parallel by dual-stack."],
[5,"Why does NAT exist for IPv4 but not for IPv6?","IPv4 ran short of unique addresses and NAT lets many devices share one; IPv6 has so many addresses that every device can have its own, making NAT unnecessary."],
[5,"How many times larger is the IPv6 address space than IPv4?","2^128 / 2^32 = 2^96, about 8 x 10^28."],
[6,"Define downloading and uploading.","Downloading: transferring data from a remote server to the local device. Uploading: the reverse."],
[6,"Distinguish asymmetric from symmetric connections.","Asymmetric: download speed markedly faster than upload (typical of home broadband). Symmetric: equal speeds both ways (business and fibre-to-the-home)."],
[6,"Why are home connections asymmetric?","Residential usage involves far more downloading (streaming, browsing) than uploading."],
[6,"Why are business connections often symmetric?","Businesses frequently upload large files, run servers or hold video conferences needing substantial upstream bandwidth."],
[6,"Define a CDN.","Content Delivery Network: servers distributed across many geographic locations holding copies of frequently requested content, so requests are served from a nearby edge server rather than a distant origin server."],
[6,"What are the benefits of a CDN?","It reduces latency (the distance data must travel) and the load on the origin server, so streaming and calls perform similarly well in different places."],
[6,"Name major CDN providers.","Cloudflare, Akamai and Amazon CloudFront."],
[6,"Define FTP and say what it does.","File Transfer Protocol: a dedicated protocol for transferring files between computers; users connect to remote servers to download or upload files."],
[6,"Distinguish public (anonymous) from private FTP servers.","Public servers let anyone access public files without authentication, conventionally with the username 'anonymous'. Private servers require valid credentials and are used for secure file sharing and for uploading website files."],
[6,"Name an FTP client.","FileZilla, giving a graphical interface for browsing a server's directories and transferring files."],
[6,"Define VoIP.","Voice over Internet Protocol: voice calls carried over the internet or any IP network instead of the PSTN."],
[6,"Describe how VoIP carries a call.","The microphone captures the voice, which is digitised, compressed by a codec, broken into packets and sent over UDP; at the receiver the packets are reassembled, decompressed and converted back to analog audio."],
[6,"Why does VoIP use UDP rather than TCP?","UDP has lower latency, which is critical for real-time voice (the reliability-versus-speed trade-off of Lesson 5)."],
[6,"Why is VoIP cheap for long-distance calls?","Voice travels over the same infrastructure as other traffic, which removes distance-dependent charges."],
[6,"Name popular VoIP applications.","WhatsApp calls, Google Voice, Facebook Messenger calls, Discord and Skype."],
[6,"Define latency, jitter and packet loss in VoIP.","Latency: delays causing unnatural conversation. Jitter: variation in packet arrival times causing choppy audio. Packet loss: causes gaps in the audio."],
[6,"How are VoIP problems managed?","QoS (Quality of Service) configuration prioritises time-sensitive voice traffic; jitter buffer algorithms briefly hold and smoothly reorder arriving packets before playback."],
[6,"Define video conferencing.","Real-time, interactive audio and video communication between participants in different locations; it is VoIP plus synchronised video."],
[6,"Name the technologies combined in video conferencing.","HD cameras and microphones, video codecs (H.264, H.265/HEVC), internet infrastructure and client software."],
[6,"Name video conferencing platforms.","Zoom, Microsoft Teams, Google Meet and Cisco Webex."],
[6,"Define online collaboration tools.","Tools letting people in different locations work together on shared documents, projects and tasks in real time or asynchronously."],
[6,"Give the three categories of collaboration tools with examples.","Collaborative document editing (Google Docs, Microsoft 365); project management (Trello, Asana, Jira, Notion); team messaging (Slack, Microsoft Teams)."],
[7,"Define cloud computing.","The delivery of computing services (servers, storage, databases, networking, software, analytics) over the internet on an on-demand, pay-as-you-go basis from data centres operated by cloud providers."],
[7,"Why is it called the 'cloud'?","A metaphor from network diagrams that depicted the internet as a cloud-shaped symbol representing complex infrastructure."],
[7,"Define cloud storage and name its benefits.","Storing files on remote servers, accessible from any connected device. It synchronises files across devices and gives off-site backup."],
[7,"Name cloud storage services.","Google Drive, Dropbox, Microsoft OneDrive, Apple iCloud and Amazon Drive."],
[7,"Define IaaS.","Infrastructure as a Service: the provider offers virtualised servers, storage and networking; the customer controls the operating system and applications. Maximum flexibility; AWS EC2, Azure Virtual Machines, Google Compute Engine."],
[7,"Define PaaS.","Platform as a Service: a managed environment for building, deploying and running applications; the provider handles servers, storage, OS, runtimes and middleware. Google App Engine, Azure App Service, Heroku."],
[7,"Define SaaS.","Software as a Service: a fully functional application delivered over the internet through a browser, with nothing to install; the provider hosts, maintains, updates and secures it. Gmail, Microsoft 365, Salesforce, Zoom, Dropbox, Netflix."],
[7,"State who manages what in IaaS, PaaS and SaaS.","IaaS: the customer manages the OS, runtime and application. PaaS: the customer manages only the application. SaaS: the customer manages nothing beyond their own data and configuration."],
[7,"State the advantages of cloud computing.","Operational instead of capital expenditure; provisioning in minutes; almost instant scaling; security and reliability beyond most organisations; high availability and disaster recovery through geographically distributed data centres."],
[7,"State the challenges of cloud computing.","Internet dependency; privacy and security of data on third-party servers (DPDP Act, GDPR); vendor lock-in; accumulating subscription costs over years."],
[7,"Define vendor lock-in.","Dependency on one cloud provider's proprietary services, making migration difficult and expensive."],
[8,"Define digital citizenship.","The responsible, ethical and thoughtful use of technology and the internet, covering netiquette, responsible usage, privacy awareness, critical evaluation of information and the legal and ethical dimensions of online activity."],
[8,"Define netiquette.","Internet etiquette: the informal but widely recognised standards of polite, respectful and constructive behaviour in online communication."],
[8,"Why did netiquette norms develop?","Online, non-verbal cues (expression, body language, tone) are absent, and written messages are permanent and widely shared."],
[8,"State the principles of netiquette.","Respect others as in person; avoid ALL CAPITALS (shouting); understand a forum's context before posting; use sarcasm carefully; verify before forwarding; assume good faith and argue with reason, not personal attacks."],
[8,"Define phishing.","Fraudulent emails, messages or websites impersonating legitimate organisations to trick users into revealing credentials or personal data, typically creating urgency or fear."],
[8,"How can a user recognise and respond to phishing?","Look for impersonation, urgency or fear, short deadlines and requests for credentials; do not act hastily; check the message carefully first."],
[8,"What personal information should be shared online only where necessary?","Full name, home address, phone number, date of birth, financial information and location data."],
[8,"How should information online be evaluated critically?","Check the source, look for independent corroboration, check the publication date, consider bias or motivation, and use fact-checking resources, particularly for health, science and political claims."],
[8,"What is misinformation, and what is the responsible response?","False or inaccurate content that spreads rapidly; verify accuracy before forwarding it."],
[8,"What is the position on copyright for digital content?","Digital content is copyrighted like physical books and films; copying or distributing it without permission is illegal however easy it is technically."],
[8,"What are Creative Commons licences?","Licences letting creators specify the terms under which their work may be freely used: a middle ground."],
[8,"Define cyberbullying and the responsible response.","Using digital communication tools to harass, threaten, humiliate or bully. Unlike traditional bullying it can follow victims anywhere at any hour and spread to thousands instantly. Refrain, do not amplify, and report to moderators or authorities."],
[8,"Define digital footprint.","The permanent trail of data a person leaves through online activities (sites visited, searches, posts, comments, photos, purchases), often impossible to erase fully."],
[8,"Why must a user be thoughtful about their digital footprint?","Posted information can be copied, shared and archived indefinitely, with long-lasting implications for reputation, relationships, education and employment."],
[8,"What are the effects of excessive screen time?","Reduced sleep quality, reduced physical activity, social isolation, anxiety and diminished ability to focus."],
[8,"How should a digital citizenship answer be structured?","Name the specific risk (phishing, cyberbullying, misinformation, unmanaged digital footprint) and pair it with a specific responsible behaviour, rather than answering in generalities."]
];

["Distinguish between symmetric and asymmetric internet connections.","Asymmetric connections have download speeds markedly faster than upload, typical of home broadband because residential use is mostly downloading. Symmetric connections give equal speeds both ways and suit businesses and fibre-to-the-home that upload large files, run servers or hold video conferences.",["Asymmetric defined","Symmetric defined","Why home is asymmetric","Why business is symmetric"]],

const LONG=[
["Trace the history of the internet from ARPANET to the modern internet, naming the key milestones and people involved.","ARPANET was established in 1969 by the US Department of Defense to create a network that could survive attack by routing around damaged nodes, an advance on centralised switching. It first linked four universities: UCLA, Stanford Research Institute, UC Santa Barbara and the University of Utah. In the 1970s Vint Cerf and Bob Kahn developed TCP/IP, giving different networks a common language. In 1983 ARPANET adopted TCP/IP, regarded as the birth of the modern internet. In 1989 Tim Berners-Lee developed the World Wide Web at CERN, with HTML, HTTP and URLs; it became public in August 1991, and the same year ARPANET was decommissioned. The internet has grown to over five billion users.",["1969 ARPANET and its purpose","Four universities","Cerf and Kahn, TCP/IP","1983 adoption of TCP/IP","1989 Web by Berners-Lee","1991 Web public and ARPANET decommissioned"]],
["Explain the structure of a URL, labelling and describing each component.","A URL identifies and locates a resource, e.g. https://www.example.com:443/path/to/page.html?query=value#section. The scheme (https) identifies the protocol: http, https, ftp, mailto. The host (www.example.com) is the domain name or IP address of the server. The port (443) is optional; HTTPS defaults to 443. The path (/path/to/page.html) locates the resource in the server's file hierarchy. The query (query=value), after ?, passes parameters to the server. The fragment (section), after #, jumps to a section within the page.",["Scheme","Host","Port","Path","Query","Fragment"]],
["Explain packet switching and circuit switching, comparing them on path, resource use and fault tolerance.","In circuit switching a single dedicated path is established before data flows and reserved for the whole call, as on the PSTN. Resources are held exclusively even in silence, and a break in the path ends the call; order is guaranteed. In packet switching data is broken into independently addressed packets that may travel different routes and are reassembled at the destination. Links are shared by many users, so capacity is used efficiently, and packets reroute around failed links, which was the resilience ARPANET sought. The cost is that packets may arrive out of order or delayed, which TCP sequencing and VoIP jitter handling manage.",["Circuit path dedicated","Packet routes independent","Resource use compared","Fault tolerance compared","Order and reassembly","Examples"]],
["Describe the DNS resolution process in full, from a browser's cache check to receiving the final IP address.","DNS translates domain names into IP addresses using a distributed hierarchical database. The browser first checks its local DNS cache. If the answer is not cached it queries the configured resolver, typically from the ISP or a public service such as 8.8.8.8 or 1.1.1.1. The resolver contacts a root DNS server, which directs it to the appropriate TLD nameserver. The TLD nameserver directs it to the authoritative nameserver for the domain, which supplies the IP address. The resolver caches the result and returns it to the browser, which connects to the web server. The whole process takes a few milliseconds.",["Local cache","Resolver","Root server","TLD nameserver","Authoritative nameserver","Caching and return"]],
["Compare IPv4 and IPv6 comprehensively, explaining why the transition has been necessary and gradual.","IPv4 uses 32-bit dotted-decimal addresses giving about 4.3 billion, IPv6 uses 128-bit hexadecimal addresses giving about 340 undecillion. IPv4 was exhausted around 2011 and relies on NAT; IPv6 needs no NAT because every device can have a unique address. IPv6 adds built-in IPsec, an efficient header and better multicast. The transition is necessary because growth in devices exhausted IPv4. It has been gradual because it requires a large infrastructure upgrade; IPv6 was standardised in 1998, and the internet runs both in parallel by dual-stack.",["Size and number of addresses","Notation","Exhaustion and NAT","IPv6 improvements","Why necessary","Why gradual and dual-stack"]],
["Explain VoIP's working process from a spoken word to the listener hearing it, and describe its main technical challenges.","The microphone captures the voice, which is digitised and compressed by an audio codec, then broken into small packets and sent over the internet using UDP for low latency. At the receiver the packets are reassembled, decompressed and converted back to analog audio. Challenges: latency, which causes unnatural conversation; jitter, variation in arrival time causing choppy audio; and packet loss, causing gaps. They are managed by QoS, which prioritises voice traffic, and by jitter buffers, which hold and reorder packets before playback.",["Capture and digitise","Compress and packetise","UDP and why","Reassemble and convert","Latency, jitter, packet loss","QoS and jitter buffer"]],
["Describe the three cloud service models with one example provider for each, and explain the trade-off in management responsibility between them.","IaaS offers virtualised servers, storage and networking; the customer installs the OS and applications; example AWS EC2. It gives maximum control but most responsibility. PaaS offers a platform where the provider manages servers, OS, runtimes and middleware and the developer manages only the application code; example Heroku. SaaS delivers a complete application through a browser, with the provider managing everything; example Gmail. Moving from IaaS to SaaS, responsibility shifts progressively to the provider, trading control and flexibility for convenience.",["IaaS defined with example","PaaS defined with example","SaaS defined with example","Responsibility spectrum","Control against convenience"]],
["Explain digital citizenship, covering netiquette, privacy, intellectual property and cyberbullying.","Digital citizenship is the responsible, ethical and thoughtful use of the internet. Netiquette: respect others, avoid ALL CAPS, use sarcasm carefully, verify before forwarding and assume good faith. Privacy: share personal information only when necessary, with a stated privacy policy, set social media privacy and beware of phishing. Intellectual property: digital content is copyrighted and unauthorised copying is illegal; Creative Commons licences state terms of free use. Cyberbullying: harassment through digital tools that follows victims anywhere and spreads instantly; citizens should refrain, not amplify and report it.",["Definition","Netiquette","Privacy and phishing","Intellectual property","Cyberbullying"]],
["Explain the advantages and challenges of cloud computing for a growing business.","Advantages: capital expenditure becomes operational expenditure; resources are provisioned in minutes and released when finished; scaling is almost instant; providers offer security and reliability beyond most firms; distributed data centres give availability and disaster recovery. Challenges: internet dependency; privacy and security of data on third-party servers and compliance with the DPDP Act or GDPR; vendor lock-in; and subscription costs that can exceed owned hardware over years. A growing business benefits from flexibility early and must plan for lock-in and cost.",["Capex to opex","Rapid provisioning and scaling","Availability and disaster recovery","Internet dependency","Privacy and compliance","Vendor lock-in and cost"]],
["Distinguish the internet from the World Wide Web using the roads-and-services analogy, and name three other internet services that are not part of the Web.","The internet is the infrastructure, like the road system of cables, routers, servers and protocols. The Web is one service using it, like the postal service delivering one type of content, web pages, accessed through browsers using HTTP/HTTPS and URLs. The same roads carry other services: email, FTP and VoIP (also video streaming) run on the internet without being part of the Web.",["Internet is infrastructure","Web is one service","Browsers, HTTP, URLs","Email","FTP","VoIP"]]

["Explain why a video call can suffer from choppy audio even on a connection with generously high bandwidth, using latency and jitter.","Bandwidth is only how much data can move per second. Choppy audio is caused by timing problems: high latency delays packets, and jitter, variation in arrival time, means packets arrive unevenly. Real-time audio cannot wait, so late packets are lost or the sound breaks up, whatever the bandwidth. QoS and a jitter buffer help.",["Bandwidth is not timing","Latency","Jitter","QoS or jitter buffer"]],

 {h:"Meaning of the word",d:"The word 'internet' comes from 'internetwork': a network of networks.",p:["It is formed by the voluntary interconnection of hundreds of thousands of individual corporate, university, government and ISP networks that agree to exchange traffic using TCP/IP. No single network spans the globe; data hops through a chain of routers, each forwarding it closer to its destination."]},
 {h:"A brief history",p:["The internet originated in ARPANET (Advanced Research Projects Agency Network), a US Department of Defense research project established in 1969. It was designed to create a network able to survive a nuclear attack by routing around damaged nodes, at a time when networks used centralised switching systems that were single points of failure.","In the 1970s Vint Cerf and Bob Kahn developed the TCP/IP protocol suite. ARPANET adopted TCP/IP in 1983. Tim Berners-Lee's World Wide Web (1989) turned the internet from an academic tool into a mass medium. ARPANET was decommissioned in 1991. The internet has grown from a few thousand computers in 1990 to over five billion users."],t:T[1]},
 {h:"Packet switching",d:"Packet switching is a method in which data is broken into small, independently addressed packets, each of which may travel by a different route and which are reassembled into the original message only on arrival at the destination.",p:["It was ARPANET's defining technical innovation. Because no path is reserved for one conversation, many communications share the same links simultaneously, using capacity far more efficiently. Because each packet finds its own route, the network tolerates the failure of links or routers: packets are rerouted around the damage.","The cost is that packets can arrive out of order or be delayed unpredictably. TCP (sequencing and reassembly) and VoIP jitter handling exist to manage this."]},
 {h:"Circuit switching",d:"Circuit switching establishes a single dedicated physical path for the entire duration of a call before any data flows, and holds it exclusively for that conversation even during silence.",p:["It is used by the traditional telephone network, the Public Switched Telephone Network (PSTN)."],t:T[0]},
 {h:"Examination notes",l:["Compare switching techniques on path, resource use and fault tolerance, and name an example of each (PSTN and the internet).","Remember the dates: ARPANET 1969, TCP/IP adopted 1983, Web 1989, ARPANET decommissioned 1991."]}
]},
{t:"The Web, the internet and ISPs",sec:[1],notes:[1],dump:[1],blocks:[
 {h:"The World Wide Web",d:"The World Wide Web (the Web, WWW) is a vast system of interlinked documents and resources (web pages, images, videos, files) accessible over the internet.",p:["It was invented by Sir Tim Berners-Lee in 1989 while working at CERN, the physics laboratory in Switzerland, so that scientists anywhere could share information by linking documents through clickable hyperlinks. He also built the first web server and the first web browser. The Web became publicly available in August 1991."],t:T[3]},
 {h:"Internet versus World Wide Web",p:["Treating the two as synonyms is the single most common misconception in this chapter. The internet is the underlying global infrastructure: the physical cables, routers, servers and protocols. The World Wide Web is only one of many services running on that infrastructure: the system of interlinked pages accessed through browsers using HTTP/HTTPS and URLs.","Email, FTP, VoIP and video streaming run on the internet without being part of the Web."],t:T[2]},
 {h:"ISP: Internet Service Provider",d:"An Internet Service Provider (ISP) is a company providing individuals, businesses and organisations with access to the internet.",p:["Without an ISP a computer can reach only devices on its own local network. The ISP owns and operates the infrastructure that connects customers to the internet backbone, the high-capacity core network carrying the bulk of global traffic, typically reached through Internet Exchange Points (IXPs), where several ISPs and network operators physically exchange traffic.","ISPs assign IP addresses, provide DNS resolution and often bundle email and web hosting. India's major ISPs include Jio, Airtel, BSNL, Vodafone Idea and ACT Fibernet."],t:T[4]},
 {h:"Net neutrality",d:"Net neutrality is the principle that an ISP should treat all data on its network equally, not blocking, slowing or charging differently for particular websites, applications or types of content.",p:["It has been a contested regulatory question in many countries, including India, where TRAI has issued rules broadly supporting the principle."],t:T[5]},
 {h:"Examination notes",l:["'Distinguish between the internet and the World Wide Web' is close to guaranteed. State the relationship (infrastructure versus one service running on it) and then give an example of another service (email, FTP, VoIP).","Name the three technologies of the Web: HTML, HTTP and URLs."]}
]},
{t:"Browsers, cookies and search engines",sec:[2],notes:[2],dump:[2],blocks:[
 {h:"Web browser",d:"A web browser is a software application that enables users to access, retrieve and display content from the World Wide Web.",p:["When a user enters a URL or clicks a hyperlink, the browser sends an HTTP or HTTPS request to the web server, receives HTML, CSS, JavaScript and embedded media, and renders (interprets and visually displays) it as the page the user sees.","Widely used browsers: Google Chrome (market leader), Mozilla Firefox, Microsoft Edge (built on the Chromium engine used by Chrome), Apple Safari and Opera."],t:T[6]},
 {h:"Cookies and sessions",p:["HTTP is stateless: each request is treated independently with no built-in memory of earlier ones, yet a website remembers that a user is logged in. The mechanism is the cookie, a small piece of data the server asks the browser to store and to send back automatically with every subsequent request to that site.","A session cookie typically holds only a random session ID; the server keeps the meaningful state on its own side, indexed by that ID, and looks it up on every request. This is the OSI Session layer concept of Lesson 5, implemented at the Application layer. Cookies also underlie web advertising tracking, so browsers offer controls to block or limit third-party cookies."],t:T[8]},
 {h:"Search engine",d:"A search engine is a web-based service enabling users to find pages relevant to their queries, by maintaining a massive, continuously updated index of billions of pages and providing a fast, relevance-ranked interface to that index.",p:["A search query searches this pre-built index, not the live web in real time. Google dominates globally, followed by Microsoft Bing, Yahoo, Baidu (dominant in China) and DuckDuckGo (which emphasises user privacy)."],t:T[7]},
 {h:"Examination notes",l:["A search engine searches an index built beforehand by a crawler; it does not search the web live.","Explain cookies by contrast with statelessness: the cookie holds only an ID; the state is on the server."]}
]},
{t:"URLs and domain names",sec:[3],notes:[3],dump:[3],blocks:[
 {h:"URL: Uniform Resource Locator",d:"A URL is the complete, standardised address identifying and locating a specific resource on the internet.",p:["Example: https://www.example.com:443/path/to/page.html?query=value#section"],t:T[9]},
 {h:"Domain name",d:"A domain name is the human-readable name identifying a website, such as google.com or mygov.in.",p:["Computers communicate using numerical IP addresses, so domain names supply a usability layer: memorable names for people, with translation to IP addresses handled automatically underneath.","Domain names are hierarchical and read from right to left. The rightmost part is the Top Level Domain (TLD). Generic TLDs include .com, .org, .net, .edu and .gov; country code TLDs (ccTLDs) are two-letter codes such as .in, .uk and .jp. To the left is the second-level domain (google in google.com), and further left may be subdomains such as www or mail."],t:T[10]},
 {h:"Examination notes",l:["Be able to draw a URL and label all components (scheme, host, port, path, query, fragment) from memory.","Do not confuse the query (after ?) with the fragment (after #)."]}
]},
{t:"DNS, web pages and hyperlinks",sec:[4],notes:[4],dump:[4],blocks:[
 {h:"DNS: Domain Name System",d:"The Domain Name System (DNS), the internet's 'phone book', translates human-readable domain names into the numerical IP addresses computers use to communicate.",p:["It is implemented as a massive, globally distributed, hierarchical database across thousands of servers worldwide."]},
 {h:"The resolution sequence",p:["The browser first checks its local DNS cache. If the answer is not cached it queries the configured resolver (provided by the ISP or a public service such as Google's 8.8.8.8 or Cloudflare's 1.1.1.1). The resolver contacts the root DNS servers, which direct it to the TLD nameserver, which directs it to the authoritative nameserver for the domain, which supplies the IP address. The resolver caches and returns the result to the browser, which connects to the web server."],t:T[11]},
 {h:"Web page and website",d:"A web page is a single document accessible on the Web, written in HTML and typically using CSS for visual styling and JavaScript for interactive behaviour.",p:["A website is a collection of related pages and associated content hosted on the same server, sharing a common domain name and navigational structure. Every website has a home page (index page): the default page served when the site's root URL is requested without a path."],t:T[12]},
 {h:"Hyperlinks",d:"A hyperlink is a clickable reference embedded within a page that, when clicked, navigates the browser to another resource.",p:["Hyperlinks are the mechanism that makes the Web a 'web': they create the dense, interconnected network of connections between pages."],t:T[13]},
 {h:"Examination notes",l:["State the DNS order without omitting a step: cache, resolver, root, TLD, authoritative.","DNS is a direct application of the client-server model."]}
]},
{t:"Internet addressing",sec:[5],notes:[5],dump:[5],blocks:[
 {h:"IP address",d:"An IP (Internet Protocol) address is a unique numerical address identifying a device communicating on the internet so that data can be routed from source to destination.",p:["Two versions are in use today: the original IPv4 and the newer IPv6."]},
 {h:"IPv4",d:"IPv4 is the fourth version of the Internet Protocol, in use since the early 1980s. An IPv4 address is a 32-bit binary number expressed in dotted decimal notation.",p:["The 32 bits divide into four groups of 8 bits (octets); each is converted to decimal (0 to 255) and separated by dots. Each octet is converted by the binary-to-decimal method of Lesson 2.","The total number of addresses is 2^32, about 4.3 billion. Growth in devices exhausted the pool around 2011, when IANA allocated its last address blocks to regional registries."],t:T[15]},
 {h:"NAT: Network Address Translation",d:"NAT is a technique letting multiple devices on a private local network share a single public IPv4 address.",p:["It significantly extended IPv4's useful life. It is a workaround, not a permanent solution."],t:T[16]},
 {h:"IPv6",d:"IPv6 is the long-term successor to IPv4, designed to solve address exhaustion permanently. It uses 128-bit addresses.",p:["That gives 2^128, about 340 undecillion addresses. IPv6 addresses are written in hexadecimal as eight groups of four hex digits separated by colons. Leading zeros within a group may be omitted, and one contiguous run of all-zero groups may be replaced by a double colon.","Further improvements: built-in IPsec encryption and authentication, a more efficient packet header, better multicast support, and no need for NAT. Standardised in 1998, adoption has been gradual because of the scale of upgrade; most of the internet runs IPv4 and IPv6 in parallel by the dual-stack approach."],t:T[18]},
 {h:"IPv4 compared with IPv6",t:T[14]},
 {h:"Calculating address space",p:["Problem: confirm IPv6's address space is about 2^128 and say roughly how many times larger it is than IPv4's. Solution: IPv4 gives 2^32, about 4.3 x 10^9; IPv6 gives 2^128 = (2^32)^4, about 3.4 x 10^38. The ratio is 2^96, about 8 x 10^28."],t:T[17]},
 {h:"Examination notes",l:["The IPv4/IPv6 table is frequently reproduced as an answer. Be certain of 2^32 and 2^128.","Explain NAT in one sentence: IPv4 ran short of unique addresses and NAT lets many devices share one; IPv6 has so many that each device can have its own.","In practice the private IPv4 ranges also include 172.16.x.x to 172.31.x.x."]}
]},
{t:"Internet services",sec:[6],notes:[6],dump:[6],blocks:[
 {h:"Downloading and uploading",d:"Downloading is transferring data from a remote server to the user's local device; uploading is the reverse.",p:["Watching a video, reading a page or installing software involve downloading; posting a photo, sending an attachment or backing up to the cloud involve uploading."],t:T[19]},
 {h:"Worked example: download rate",p:["Rate in Mbps = size in megabytes x 8 divided by time in seconds."],t:T[26]},
 {h:"Content Delivery Network",d:"A Content Delivery Network (CDN) maintains copies of frequently requested content on servers distributed across many geographic locations (edge servers), so a request is served from a nearby copy.",p:["Streaming to millions of simultaneous viewers from one origin server would be impossibly slow. A CDN reduces latency and the load on the origin server. Most large websites and streaming services use one."],t:T[20]},
 {h:"FTP: File Transfer Protocol",d:"FTP is a dedicated protocol for transferring files between computers (Lesson 5).",p:["It uses separate control and data connections."],t:T[21]},
 {h:"VoIP: Voice over Internet Protocol",d:"VoIP enables voice calls over the internet or any IP network rather than through the PSTN.",p:["A traditional call sends voice as a continuous analog signal over a dedicated circuit-switched line. VoIP uses UDP, chosen for lower latency than TCP. It dramatically reduces the cost of long-distance calls because voice travels with other traffic and distance-dependent charges disappear. Popular applications: WhatsApp calls, Google Voice, Facebook Messenger calls, Discord and Skype."],t:T[22]},
 {h:"Challenges of VoIP",t:T[23]},
 {h:"Video conferencing",d:"Video conferencing enables real-time, interactive audio and video communication between participants in different locations. It extends VoIP by adding synchronised video.",p:["It combines HD cameras and microphones, video codecs (H.264, H.265/HEVC), internet infrastructure and client software. The COVID-19 pandemic of 2020-2021 accelerated adoption; hybrid work is now a lasting feature."],t:T[24]},
 {h:"Online collaboration",d:"Online collaboration tools let people in different locations work together on shared documents, projects and tasks in real time or asynchronously.",p:["They remove the geographic constraints that once made distributed teamwork difficult."],t:T[25]},
 {h:"Examination notes",l:["Video conferencing is VoIP plus synchronised video, not a separate technology: state the relationship.","VoIP uses UDP for the same reason as in Lesson 5: speed matters more than perfect delivery for real-time voice."]}
]},
{t:"Cloud computing",sec:[7],notes:[7],dump:[7],blocks:[
 {h:"Cloud computing",d:"Cloud computing is the delivery of computing services (servers, storage, databases, networking, software, analytics) over the internet on an on-demand, pay-as-you-go basis.",p:["Instead of owning hardware, users access resources hosted in data centres operated by cloud providers and pay only for what they use. 'Cloud' is a metaphor from network diagrams that depicted the internet as a cloud-shaped symbol."]},
 {h:"Cloud storage",d:"Cloud storage lets users store files on remote servers rather than solely on local storage, accessible from any internet-connected device.",p:[],t:T[27]},
 {h:"Cloud service models",p:["Cloud computing is offered in three models, each with a different level of abstraction and division of responsibility between provider and customer.","IaaS gives virtualised servers, storage and networking; the customer controls the virtual servers and installs their own OS and applications, without capital expense. PaaS lets developers build, deploy and run applications without managing infrastructure; the provider handles servers, storage, OS, runtimes and middleware. SaaS delivers a fully functional application through a browser with nothing to install; the provider hosts, maintains, updates and secures everything.","The three form a spectrum of decreasing customer responsibility: IaaS (customer manages OS, runtime and application), PaaS (only the application), SaaS (nothing beyond own data and configuration)."],t:T[28]},
 {h:"Advantages and challenges",p:["Cloud computing is a shift from capital expenditure to operational expenditure. Resources can be provisioned in minutes and released when finished; they scale almost instantly; providers operate at a scale giving security, reliability and investment beyond most organisations; geographically distributed data centres give high availability and disaster recovery.","Challenges: dependence on an internet connection; data privacy and security on third-party servers, including regulatory compliance (India's Digital Personal Data Protection Act, Europe's GDPR); vendor lock-in; and subscription costs that can, over years of heavy use, exceed owned hardware."],t:T[29]},
 {h:"Examination notes",l:["'Distinguish IaaS, PaaS and SaaS': state who manages what at each level, in order, and give one example each (AWS EC2, Heroku, Gmail).","Name the risk precisely: vendor lock-in, not simply 'cost'."]}
]},
{t:"Digital citizenship",sec:[8],notes:[8],dump:[8],blocks:[
 {h:"Digital citizenship",d:"Digital citizenship refers to the responsible, ethical and thoughtful use of technology and the internet.",p:["It encompasses netiquette, responsible internet usage, privacy awareness, critical evaluation of information and an understanding of the legal and ethical dimensions of online activity."]},
 {h:"Netiquette",d:"Netiquette (internet etiquette) refers to the informal but widely recognised standards of polite, respectful and constructive behaviour in online communication.",p:["The norms address the absence of non-verbal cues (facial expression, body language, tone of voice) and the permanence and reach of written messages."],t:T[30]},
 {h:"Responsible internet usage",p:["It encompasses behaviours protecting the user, protecting others and contributing to a healthy digital environment. Strong answers name the specific risk and pair it with a specific behaviour."],t:T[31]},
 {h:"Evaluating information",t:T[32]},
 {h:"Recognising phishing",p:["Phishing typically creates urgency or fear to pressure hasty action without careful checking."],t:T[33]},
 {h:"Examination notes",l:["Scenario questions: identify the concept by name (misinformation, phishing) before describing the response; naming it correctly is part of what is assessed.","Do not answer in generalities such as 'be safe online'."]}
]}

/* ============ LAB (Lesson 6): URL, DNS, IPv4/IPv6, transfer rate, address space, packet switching, cloud, phishing, sorting ============ */
function numFix(s){return norm(s);}
function matchCalc(user,q){const u=norm(user);return q.alts.some(set=>set.every(a=>q.ex?u===norm(a):u.includes(norm(a))));}
const L={tool:"url",sd:{dim:0,item:null,fb:"",right:null,s:0,t:0},
  ur:"https://www.example.com:443/products/item.html?id=42#reviews",
  dn:"www.example.com",dsx:0,
  ipa:"192.168.1.1",i6:"2001:0db8:85a3:0000:0000:8a2e:0370:7334",
  fsz:"200",fsec:"40",
  sb:"32",
  pm:"HELLO WORLD",pz:"3",px:0,
  cm:"iaas",
  ph:0,pa:{},ps:0};
const LABTOOLS=[["url","URL dissector"],["dns","DNS lookup"],["ip","IPv4 address"],["ip6","IPv6 shortener"],["rate","Download rate"],["space","Address space"],["pkt","Packet switching"],["cloud","Cloud models"],["phish","Spot the phishing"],["sort","Sorting drill"]];
const note=t=>'<div class="rs note">'+t+"</div>";
const okb=t=>'<div class="rs ok">'+t+"</div>";
const badb=t=>'<div class="rs bad">'+t+"</div>";
const inp=(id,lab,w,t)=>'<div><label class="lab" for="'+id+'">'+lab+'</label><input type="text" id="'+id+'" data-lin="'+t+'" class="mono" value="'+esc(L[id])+'" autocomplete="off" spellcheck="false" style="max-width:'+(w||10)+'rem"></div>';
const r2=x=>Math.round(x*100)/100;
function labView(){
  let h='<p class="hint">Work with the numerical and procedural parts of the chapter: take a URL apart, step through DNS resolution, convert IPv4 and shorten IPv6 addresses, compute download rates and address spaces, watch packets travel and reassemble, compare cloud models and practise spotting phishing.</p>';
  h+='<div class="subnav" role="group" aria-label="Lab tool">'+LABTOOLS.map(t=>'<button class="chip" data-act="ltool" data-v="'+t[0]+'" aria-pressed="'+(L.tool===t[0])+'">'+t[1]+"</button>").join("")+"</div>";
  return '<div class="labwrap">'+h+TOOLS[L.tool].v()+"</div>";
}
/* ---------- URL ---------- */
function urlRes(){
  const s=String(L.ur||"").trim();
  const m=s.match(/^([a-zA-Z][a-zA-Z0-9+.-]*):(\/\/)?([^\/?#:]*)?(?::(\d+))?([^?#]*)?(?:\?([^#]*))?(?:#(.*))?$/);
  if(!m||!m[1])return {urs:badb("Enter a URL beginning with a scheme such as https://")};
  const sch=m[1],host=m[3]||"",port=m[4]||"",path=m[5]||"",q=m[6],f=m[7];
  const def={https:"443",http:"80",ftp:"21"}[sch.toLowerCase()];
  const rows=[["Scheme",sch,"The protocol identifier"],["Host",host||"(none)","The domain name or IP address of the server"],["Port",port||"(omitted"+(def?"; default "+def:"")+")","Optional network port"],["Path",path||"(none: the home page)","Location of the resource on the server"],["Query",q===undefined?"(none)":q,"Parameters after ?"],["Fragment",f===undefined?"(none)":f,"Section of the page, after #"]];
  let h='<div class="tbl"><table><thead><tr><th>Component</th><th>Value</th><th>Meaning</th></tr></thead><tbody>'+rows.map(r=>"<tr><th>"+r[0]+'</th><td class="mono">'+esc(r[1])+"</td><td>"+esc(r[2])+"</td></tr>").join("")+"</tbody></table></div>";
  const parts=host.split(".").filter(Boolean);
  if(parts.length>1){const tld=parts[parts.length-1];h+=note("<b>Domain name</b>, read right to left: TLD <b>."+esc(tld)+"</b>"+(tld.length===2?" (a country code TLD)":"")+"; second-level domain <b>"+esc(parts[parts.length-2])+"</b>"+(parts.length>2?"; subdomain <b>"+esc(parts.slice(0,-2).join("."))+"</b>":"")+".");}
  return {urs:h};
}
function viewUrl(){return '<div class="panel"><h3>URL dissector</h3><div class="row">'+inp("ur","URL",30,"url")+'</div><div id="urs">'+urlRes().urs+"</div></div>";}
/* ---------- DNS ---------- */
function dnsSteps(){
  const d=String(L.dn||"").trim().toLowerCase().replace(/^https?:\/\//,"").replace(/[\/:?#].*$/,"")||"www.example.com",p=d.split("."),tld="."+p[p.length-1],zone=p.length>1?p.slice(-2).join("."):d;
  return [["Local DNS cache","The browser checks its local cache for a stored answer for "+d+". Not found."],["DNS resolver","The browser queries the configured resolver (from the ISP, or public such as 8.8.8.8 or 1.1.1.1)."],["Root DNS server","The resolver contacts a root server, which directs it to the "+tld+" TLD nameserver."],["TLD nameserver","The resolver asks the "+tld+" nameserver, which directs it to the authoritative nameserver for "+zone+"."],["Authoritative nameserver","The authoritative nameserver for "+zone+" supplies the IP address of "+d+" (for example 93.184.216.34)."],["Resolver caches and returns","The resolver caches the result and returns it to the browser, which connects to the web server. The whole process takes a few milliseconds."]];
}
function dnsRes(){const S=dnsSteps(),i=Math.min(L.dsx,S.length-1);return {dnres:note("<b>Step "+(i+1)+" of "+S.length+": "+esc(S[i][0])+".</b> "+esc(S[i][1]))};}
function viewDns(){
  const S=dnsSteps(),i=Math.min(L.dsx,S.length-1);
  let h='<div class="panel"><h3>DNS lookup</h3><div class="row">'+inp("dn","Domain name",20,"dns")+"</div><ol>"+S.map((s,j)=>"<li"+(j===i?' style="font-weight:600"':"")+">"+esc(s[0])+"</li>").join("")+"</ol>";
  h+='<div id="dnres">'+dnsRes().dnres+'</div><div class="row"><button class="btn" data-act="dback">Back</button><button class="btn primary" data-act="dnext">Next</button><button class="btn" data-act="dnsreset">Restart</button></div></div>';
  return h;
}
/* ---------- IPv4 ---------- */
function ipRes(){
  const p=String(L.ipa).trim().split(".");
  if(p.length!==4||p.some(x=>!/^\d{1,3}$/.test(x)||+x>255))return {iprs:badb("An IPv4 address has four decimal octets, each from 0 to 255 (for example 192.168.1.1).")};
  const o=p.map(Number),bin=o.map(x=>x.toString(2).padStart(8,"0"));
  let kind="a public address";
  if(o[0]===10||(o[0]===172&&o[1]>=16&&o[1]<=31)||(o[0]===192&&o[1]===168))kind="a private address (inside a LAN behind a router that performs NAT; not routable on the public internet)";
  else if(o[0]===127)kind="a loopback address (this computer itself)";
  let h=okb("<b>"+o.join(".")+"</b> in binary: <span class=\"mono\">"+bin.join(".")+"</span>");
  h+='<div class="tbl"><table><thead><tr><th>Octet</th><th>Decimal</th><th>Binary</th></tr></thead><tbody>'+o.map((x,i)=>"<tr><th>"+(i+1)+'</th><td class="mono">'+x+'</td><td class="mono">'+bin[i]+"</td></tr>").join("")+"</tbody></table></div>";
  h+=note("This is "+kind+".");
  h+='<p class="hint">Four octets x 8 bits = 32 bits, giving 2<sup>32</sup> = 4,294,967,296 (about 4.3 billion) addresses.</p>';
  return {iprs:h};
}
function viewIp(){return '<div class="panel"><h3>IPv4 address inspector</h3><div class="row">'+inp("ipa","IPv4 address",16,"ip")+'</div><div id="iprs">'+ipRes().iprs+"</div></div>";}
/* ---------- IPv6 ---------- */
function v6expand(s){
  s=String(s).trim().toLowerCase();
  if(!/^[0-9a-f:]+$/.test(s)||(s.match(/::/g)||[]).length>1||/:::/.test(s))return null;
  let g;
  if(s.includes("::")){const [a,b]=s.split("::");const A=a?a.split(":"):[],B=b?b.split(":"):[];const miss=8-A.length-B.length;if(miss<1)return null;g=A.concat(Array(miss).fill("0"),B);}
  else g=s.split(":");
  if(g.length!==8||g.some(x=>x.length<1||x.length>4))return null;
  return g.map(x=>x.padStart(4,"0"));
}
function v6short(g){
  const t=g.map(x=>x.replace(/^0+(?=.)/,""));
  let best=-1,bl=0,i=0;
  while(i<8){if(t[i]==="0"){let j=i;while(j<8&&t[j]==="0")j++;if(j-i>bl){bl=j-i;best=i;}i=j;}else i++;}
  if(bl<2)return t.join(":");
  return (t.slice(0,best).join(":")+"::"+t.slice(best+bl).join(":"));
}
function ip6Res(){
  const g=v6expand(L.i6);
  if(!g)return {i6rs:badb("An IPv6 address has eight groups of up to four hexadecimal digits separated by colons; one run of zero groups may be written ::.")};
  const full=g.join(":"),step1=g.map(x=>x.replace(/^0+(?=.)/,"")).join(":"),sh=v6short(g);
  let h='<div class="tbl"><table><thead><tr><th>Form</th><th>Address</th></tr></thead><tbody><tr><th>Full, eight groups</th><td class="mono">'+full+'</td></tr><tr><th>Leading zeros omitted</th><td class="mono">'+step1+'</td></tr><tr><th>Zero run replaced by ::</th><td class="mono">'+sh+"</td></tr></tbody></table></div>";
  h+='<p class="hint">128 bits = 8 groups x 16 bits (4 hex digits). :: may be used only once, otherwise the number of omitted groups would be ambiguous.</p>';
  return {i6rs:h};
}
function viewIp6(){return '<div class="panel"><h3>IPv6 shortener and expander</h3><div class="row">'+inp("i6","IPv6 address",30,"ip6")+'</div><div id="i6rs">'+ip6Res().i6rs+"</div></div>";}
/* ---------- download rate ---------- */
function rateRes(){
  const mb=parseFloat(L.fsz),s=parseFloat(L.fsec);
  if(!(mb>0)||!(s>0))return {rtres:note("Enter positive numbers: file size in megabytes (MB) and time in seconds.")};
  const bits=mb*8,rate=bits/s;
  let h=okb(mb+" MB x 8 = <b>"+r2(bits)+" Mb</b>. Rate = "+r2(bits)+" / "+s+" = <b>"+r2(rate)+" Mbps</b>.");
  h+=note("At this rate a 1 GB (1000 MB) file would take about "+r2(8000/rate)+" seconds.");

function pktSplit(){
  const m=String(L.pm||"").slice(0,60),z=Math.max(1,Math.min(10,parseInt(L.pz,10)||0));
  if(!m||!(parseInt(L.pz,10)>=1))return null;
  const ps=[];for(let i=0;i<m.length;i+=z)ps.push({n:ps.length+1,d:m.slice(i,i+z)});
  const arr=ps.filter(p=>p.n%2===0).concat(ps.filter(p=>p.n%2===1).reverse());
  const routes=["Route A (via router 1)","Route B (via router 2)","Route C (via router 3)"];
  return {m:m,z:z,ps:ps,arr:arr,routes:routes};
}
function pktRes(){
  const r=pktSplit();
  if(!r)return {pkres:note("Enter a message (up to 60 characters) and a packet size from 1 to 10 characters.")};
  let h='<div class="tbl"><table><thead><tr><th>Seq</th><th>Data</th><th>Route taken</th></tr></thead><tbody>'+r.ps.map(p=>"<tr><th>"+p.n+'</th><td class="mono">'+esc(p.d.replace(/ /g,"·"))+"</td><td>"+r.routes[(p.n-1)%3]+"</td></tr>").join("")+"</tbody></table></div>";
  h+=note("<b>Arrival order (packets may arrive out of order):</b> "+r.arr.map(p=>p.n).join(", ")+".");
  h+=okb("<b>Reassembled by sequence number:</b> <span class=\"mono\">"+esc(r.ps.map(p=>p.d).join(""))+"</span> ("+r.ps.length+" packets).");
  h+='<p class="hint">Each packet is independently addressed and may take a different route; sequence numbers let the destination restore the order. Circuit switching would reserve one single path for the whole message instead.</p>';
  return {pkres:h};
}
