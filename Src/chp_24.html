.stat span{font:.7rem var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}

.fc .a{border-left:3px solid var(--accent);padding:4px 0 4px 14px;font-size:1.05rem}

textarea{min-height:9rem;resize:vertical}
.blank{font:inherit;display:inline-block;vertical-align:baseline;border:0;border-bottom:2px solid var(--accent);background:var(--mask);color:var(--fg);padding:0 .3em;border-radius:3px 3px 0 0;cursor:pointer;line-height:1.35}
.blank:not(.on) .ans{visibility:hidden}
.blank.on{background:var(--accent-soft)}
.note p{font-size:1.04rem;line-height:2}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px}

th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:500 .72rem var(--mono);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);background:var(--bg);white-space:nowrap}
tr:last-child td{border-bottom:0}
td{min-width:9rem}
.m.hid{background:var(--mask);color:transparent;border-radius:4px;cursor:pointer;display:inline-block;user-select:none}
.m{display:inline}
.opt{display:block;width:100%;text-align:left;font:inherit;padding:12px 14px;border-radius:8px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer}
.opt.right{border-color:var(--accent);background:var(--accent-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opts{display:flex;flex-direction:column;gap:8px}
.fb{padding:12px 14px;border-radius:8px;font-size:.95rem}
.fb.ok{background:var(--accent-soft)}.fb.no{background:var(--bad-soft)}
.tag{font:500 .7rem var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:4px;background:var(--accent-soft);color:var(--fg)}
.pts{display:flex;flex-direction:column;gap:6px}
.pts label{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.pts input{margin-top:.3rem;accent-color:var(--accent)}
.score{font:700 3rem var(--display);font-variant-numeric:tabular-nums}
.tcount{display:flex;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:8px}
.tcount label{flex:1;display:flex;gap:10px;align-items:center;cursor:pointer;min-width:0}
.tcount input{accent-color:var(--accent);width:1.1rem;height:1.1rem}
.tcount span.n{font:.78rem var(--mono);color:var(--muted);white-space:nowrap}
.rev{border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:6px}
.rev.bad{border-left:4px solid var(--bad)}.rev.ok{border-left:4px solid var(--accent)}
.rev .r{font-size:.9rem;color:var(--muted)}

.nb ul{margin:0;padding-left:1.25rem;display:flex;flex-direction:column;gap:6px}
.nb p.def{border-left:3px solid var(--accent);background:var(--accent-soft);padding:8px 12px;border-radius:0 6px 6px 0}

@media (prefers-reduced-motion:no-preference){.bar i{transition:width .3s}}
/* ---- Code lab ---- */
:root{--code-bg:#fbfaf6;--code-fg:#1b2a22;--code-line:#d5ddd6;--ok-b:#0a6a4d;--ok-s:#dcefe6;--note-b:#9a4a08;--note-s:#f6e6d4}

:root[data-theme="dark"]{--code-bg:#0a100d;--code-fg:#d8efe3;--code-line:#26342c;--ok-b:#5fd7a8;--ok-s:#17382b;--note-b:#f0a15a;--note-s:#3a2a17}
.labwrap{display:flex;flex-direction:column;gap:16px;min-width:0}

.cw{display:flex;flex-direction:column;gap:8px;min-width:0}

.btn.sm{padding:6px 12px;font-size:.85rem}
.codearea,.codeview,.outpre{font:400 .88rem/1.55 var(--mono);background:var(--code-bg);color:var(--code-fg);border:1.5px solid var(--code-line);border-radius:8px;padding:12px 14px;margin:0;white-space:pre;overflow-x:auto;tab-size:4}
.codearea{width:100%;resize:vertical;min-height:5rem}
.outpre{white-space:pre-wrap;border-left:4px solid var(--accent)}
.outbox{display:flex;flex-direction:column;gap:8px;min-width:0}
.dim{color:var(--muted)}
.cw-in{display:flex;flex-direction:column;gap:4px}
.cin,input.mono{font-family:var(--mono)}
.rs{padding:10px 14px;border-radius:8px;font-size:.93rem;border-left:4px solid var(--line);background:var(--bg)}
.rs.ok{border-color:var(--ok-b);background:var(--ok-s)}
.rs.bad{border-color:var(--bad);background:var(--bad-soft)}
.rs.note,.rs.warn{border-color:var(--note-b);background:var(--note-s)}
.try{border:1px dashed var(--accent);border-radius:8px;padding:8px 12px;font-size:.93rem}
.note-box{background:var(--accent-soft);border-radius:8px;padding:10px 14px;font-size:.93rem}
ol.pipe{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0}
ol.pipe li{position:relative;padding:8px 12px 8px 34px;border-left:2px solid var(--line);margin-left:10px;font-size:.93rem}
ol.pipe li::before{content:"";position:absolute;left:-8px;top:12px;width:14px;height:14px;border-radius:50%;background:var(--bg);border:2px solid var(--line)}
ol.pipe li.done::before{background:var(--accent);border-color:var(--accent)}
ol.pipe li.cur{background:var(--accent-soft)}ol.pipe li.cur::before{border-color:var(--accent);background:var(--surface)}
ol.pipe li.fail{background:var(--bad-soft)}ol.pipe li.fail::before{background:var(--bad);border-color:var(--bad)}
ol.pipe li.warn{background:var(--note-s)}ol.pipe li.warn::before{background:var(--note-b);border-color:var(--note-b)}
ol.pipe li.pending{color:var(--muted)}
.bits{display:flex;flex-direction:column;gap:6px}
.brow{display:grid;grid-template-columns:5.5rem 1fr auto;gap:10px;align-items:center}
.brow.res{border-top:1px solid var(--line);padding-top:6px;font-weight:600}
.bl{font:.78rem var(--mono);color:var(--muted)}
.bv{display:flex;gap:2px;flex-wrap:wrap}
.bit{width:1.55rem;height:1.7rem;display:inline-flex;align-items:center;justify-content:center;font:500 .85rem var(--mono);border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--muted)}
.bit.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.bd{font:.85rem var(--mono)}
.b-s{color:var(--bad)}.b-e{color:var(--note-b)}.b-m{color:var(--accent)}
td.mono{word-break:break-all;min-width:0}
ol.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
ol.steps li{display:flex;flex-direction:column;gap:2px;padding:8px 12px;border:1px solid var(--line);border-radius:8px}
.exp{font-family:var(--mono);font-size:.92rem}.exp.res{color:var(--accent);font-weight:600}
.exp mark{background:var(--accent-soft);color:var(--fg);border-radius:3px;padding:0 3px;outline:1.5px solid var(--accent)}
ul.rules{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
ul.rules li{padding:6px 10px;border-radius:6px;font-size:.92rem}
ul.rules li.ok{background:var(--ok-s)}ul.rules li.no{background:var(--bad-soft)}
input.tcell{width:100%;min-width:4rem;font:.9rem var(--mono);padding:6px 8px}
input.tcell.good{border-color:var(--accent);background:var(--accent-soft)}
input.tcell.miss{border-color:var(--bad);background:var(--bad-soft)}
.nb .cw{margin-top:4px}
.nb ol.pipe{margin-top:4px}
@media (max-width:520px){.brow{grid-template-columns:1fr}.bit{width:1.3rem}}

const NOTES=[
["1.1 Web fundamentals","A {{web page}} is a single document, written in HTML, that a browser can fetch from the World Wide Web by its address, the {{URL}}. A {{website}} is a collection of related pages kept under one domain name and linked together by navigation. The page served when only the domain is typed is the {{home page}}, often index.html. A web {{browser}} (Chrome, Firefox, Safari, Edge) is the program that fetches, interprets and displays pages. A web {{server}} is a computer, running server software, that stores a site's files and answers browsers' requests. The two talk using {{HTTP}} (HyperText Transfer Protocol), or {{HTTPS}}, its encrypted form. Web communication follows the {{client-server}} model: the browser (the client) sends an HTTP {{request}}; the server finds the file and returns an HTTP {{response}} holding the HTML and its status; the browser then {{renders}} the HTML. Pictures, style sheets and scripts named in the HTML are fetched by further requests. The first line of a request is the {{request line}}: the method (GET), the path of the file and the protocol version; the following lines are {{headers}} such as Host. The first line of a response is the {{status line}}; 200 means {{OK}}, 301 {{Moved Permanently}}, 403 {{Forbidden}}, 404 {{Not Found}} and 500 {{Internal Server Error}}. After the headers comes a blank line and then the {{body}}: the HTML itself. A URL such as https://www.example.com:443/products/laptop.html?id=5#specs has a {{scheme}} (https), a {{host}} (www.example.com), a {{port}} (443, usually left out), a {{path}} (/products/laptop.html), a {{query}} of name=value pairs after ? (id=5) and a {{fragment}} after # (specs) which the browser uses and does not send to the server. The web (the linked pages) is not the same as the {{Internet}} (the network of networks that carries them)."],
["1.2 HTML basics and document structure","{{HTML}} (HyperText Markup Language) is the standard language for creating web pages. It uses {{tags}}, keywords in angle brackets < >, to mark up plain text and describe its structure and meaning. {{Hypertext}} is text that contains links to other text; {{markup}} means labelling the parts of a document. HTML is not a {{programming}} language: it has no variables, loops or decisions; it only describes a document, and the browser decides how to draw it. HTML was invented by {{Tim Berners-Lee}} at {{CERN}}, first described in {{1991}}. The versions were HTML 2.0 (1995), 3.2 (1997), 4.01 (1999), {{XHTML}} 1.0 (2000, stricter and XML-based) and {{HTML5}} (a W3C recommendation in 2014, now a living standard kept up to date by the {{WHATWG}}). HTML5 added semantic elements, built-in audio and video, drawing with canvas and better form controls. Every HTML5 document starts with <!DOCTYPE html>, which is {{not a tag}} but an instruction that the document is HTML5; without it browsers switch to {{quirks mode}}. The {{html}} element is the root and its lang attribute names the language. The {{head}} holds metadata that is not shown; the {{body}} holds everything the user sees. Inside the head, <meta charset=\"UTF-8\"> sets the {{character encoding}}, the viewport meta makes the page fit a phone screen, and the {{title}} appears on the browser tab, in bookmarks and in search results. Content other than the title placed in the head never appears."],
["1.3 HTML elements","An {{element}} usually has three parts: an {{opening tag}} <p>, the content and a {{closing tag}} </p>. Elements can be {{nested}} inside one another, like boxes within boxes. A {{void}} element (also called empty or self-closing) has no content and no closing tag: {{br}}, {{hr}}, {{img}}, {{input}}, {{meta}} and {{link}}. {{Attributes}} give extra information and are written name=\"value\" inside the opening tag. The {{id}} attribute is a unique name for one element; {{class}} is a group name many elements can share; {{src}} is the address of the file to load; {{href}} is the destination of a link; {{alt}} describes an image for screen readers; {{style}} holds inline CSS; {{lang}} gives the language. In the head, <link rel=\"stylesheet\" href=\"style.css\"> attaches a CSS file and <\u0073cript src=\"app.js\"> attaches a JavaScript file; <meta name=\"description\"> gives a summary for search engines. HTML has six levels of {{headings}}, h1 (most important) to h6 (least); a page should have {{one}} h1 and headings are chosen by importance, never by size. The {{p}} element makes a paragraph, {{br}} breaks a line and {{hr}} draws a horizontal rule. A {{comment}} is written <!-- text --> and is ignored by the browser. The browser treats any run of spaces, tabs and new lines as a {{single space}}, except inside <pre>. Elements must be properly nested: the element opened {{last}} must be closed {{first}}. Obsolete elements are replaced: <center> and <font> by {{CSS}}, <strike> by {{<s> or <del>}}. An <img> always needs an {{alt}}."],
["1.4 Text formatting","Inline elements format a stretch of text inside a paragraph, whereas {{block}} elements such as <p> and <h1> start on a new line. {{<b>}} and {{<strong>}} both display bold but <strong> means {{strong importance}}; <i> and {{<em>}} both display italic but <em> means {{stress emphasis}}. Screen readers and search engines notice strong and em, so prefer the meaningful pair and use CSS for pure decoration. <u> underlines (an unarticulated annotation) and <s> draws a {{strikethrough}} (content no longer accurate). {{<sub>}} lowers text below the baseline (H<sub>2</sub>O) and {{<sup>}} raises it (x<sup>2</sup>). <blockquote> is a {{long}} quotation set as an indented block (its cite attribute holds the source); <q> is a {{short}} inline quotation to which the browser adds quotation marks; <cite> is the title of a {{work}}; <code> shows computer code in a {{monospace}} font; <pre> keeps spaces and line breaks {{exactly}} as typed. Because < and > start and end tags, special characters are written as {{entities}}: an ampersand, a name and a semicolon. &lt; shows <, &gt; shows >, {{&amp;}} shows &, {{&copy;}} shows the copyright sign, &pi; shows the letter pi and {{&nbsp;}} is a space that is not collapsed and never wraps."],
["1.5 Hyperlinks","A hyperlink is made with the {{<a>}} (anchor) element; its {{href}} attribute gives the destination and the text between the tags is what the user clicks. An {{external}} link points to another website and uses the full, {{absolute}} URL including https://. An {{internal}} link points to another page of the same site and uses a {{relative}} path. With the current page /site/index.html, about.html is in the {{same folder}}, products/laptop.html is in a {{sub-folder}}, ../index.html means one level {{up}} and /contact.html starts from the {{root}} of the site. The {{target}} attribute says where the destination opens: _self (the default) replaces the page and {{_blank}} opens a new tab; for an external site also write {{rel=\"noopener\"}} as a security precaution. An e-mail link uses the {{mailto:}} scheme, as in href=\"mailto:info@example.com\", and the subject can be preset with ?subject=. A {{bookmark}} jumps to a place on the same page and takes two steps: give the target element an {{id}} and link to it with href=\"{{#id}}\". Ids are {{case-sensitive}}, so #Contact will not find id=\"contact\". The same mechanism links to a bookmark on another page: guide.html#chapter3. Link text should be {{descriptive}}; never write http:// for an internal page."],
["1.6 Tables","A table arranges data in rows and columns. {{<table>}} is the container, {{<tr>}} is a row, {{<th>}} is a header cell (bold and centred by default), {{<td>}} is a data cell, {{<caption>}} is a title and {{<thead>}}, {{<tbody>}} and {{<tfoot>}} group the header, body and footer rows. The HTML 4 attributes {{border}}, {{cellpadding}} and {{cellspacing}} still work but are {{obsolete}}; in HTML5 presentation belongs to CSS: border: 1px solid black; replaces border, {{padding}}: 5px; replaces cellpadding and {{border-collapse}}: collapse; replaces cellspacing=\"0\". {{colspan}} makes a cell stretch across several {{columns}}; {{rowspan}} makes it stretch down several {{rows}}. In a table of 3 columns whose first row is one <th colspan=\"3\"> and whose second row has a cell with rowspan=\"2\", the third row has {{2}} cells (3 - 1), because one column is already covered. Every row must account for the {{same}} number of columns, counting merged cells. Tables are for {{data}}, not for page layout; layout is done with CSS. Header cells should be <th>, not bold <td>."],
["1.7 Forms","A form collects input from the user and sends it to a server. The {{<form>}} element is the container; its {{action}} attribute is the address that receives the data and {{method}} is the HTTP method, get or post. <input> is a {{void}} element whose look depends on its {{type}}: text, {{password}} (characters hidden as dots), {{email}} (checks the format), {{number}} (min and max set the limits), {{checkbox}} (any number can be ticked), {{radio}} (only one of a group), submit and reset. The {{name}} attribute identifies the data when the form is submitted and a control with no name sends {{nothing}}; {{value}} is the starting or sent value; {{placeholder}} is grey hint text. <label for=\"x\"> attaches a caption to the control whose {{id}} is x, and clicking the caption focuses the control. Radio buttons form a group by sharing the {{same name}}; checkboxes are independent. <select> makes a drop-down list of <option>s: the {{value}} of the option is sent and the text is shown. <textarea> is a multi-line box sized by {{rows}} and {{cols}}; <button> is a clickable button that can contain other HTML. With method=\"get\" the data travels in the {{URL}} after ?, as name=value pairs joined by {{&}}; a space becomes {{+}}, @ becomes {{%40}} and & becomes {{%26}}. With method=\"post\" the pairs travel in the request {{body}} and the address stays clean. GET is visible, bookmarkable and limited by URL length, so it suits {{searches}}; POST suits {{logins}} and registrations. Never send a {{password}} with GET. Unticked checkboxes and unchosen radio groups are {{not sent}}; empty text boxes are sent with {{empty}} values; the first option of a select is sent by default. HTML5 controls check their own input, but the {{server}} must still check the data."],
["1.8 Semantic HTML","{{Semantic}} HTML uses elements whose names say what the content is, instead of anonymous {{<div>}} and <span> containers. Its benefits are {{accessibility}} (screen readers announce regions), {{SEO}} (search engines understand the structure) and {{readability}}. {{<header>}} holds introductory content such as the site name and menu, and a page may have several. {{<nav>}} holds a block of navigation links. {{<main>}} holds the primary content unique to the page and only {{one}} is allowed. {{<section>}} is a thematic group of content, normally with its own heading. {{<article>}} is self-contained content that makes sense on its own, such as a blog post. {{<aside>}} holds related but separable content such as a sidebar. {{<footer>}} holds closing content such as copyright and policy links. Old layouts used <div id=\"header\">, <div id=\"nav\"> and <div id=\"footer\">, which become <header>, <nav> and <footer>. A page reads top to bottom: header and nav, main (with sections and articles), aside, footer. Choose an element for what the content {{is}}, not for how it looks; use <div> only as a last resort."]
];

["What is a status code? What do 200 and 404 mean?","A status code is a number in the status line of an HTTP response that tells the browser what happened. 200 OK means the page was found and sent; 404 Not Found means a wrong address or a deleted file.",["status code number","200 ok","404 not found"]],

["Distinguish an absolute from a relative URL with an example of each.","An absolute URL is complete, with the scheme: https://www.wikipedia.org, used for external links. A relative URL is a path from the current page, such as about.html or ../index.html, used for internal links; it keeps working if the site moves.",["absolute complete","relative path","example"]],

["Explain how a web page is delivered, from typing a URL to seeing the page, naming the parts of the URL.","The URL, e.g. https://www.example.com:443/products/laptop.html?id=5#specs, has a scheme (https), host (www.example.com), port (443, usually omitted), path (/products/laptop.html), query (id=5) and fragment (specs). The browser (client) sends an HTTP request: a request line such as GET /products/laptop.html HTTP/1.1 and headers such as Host. The web server finds the file and returns an HTTP response: a status line (200 OK), headers (Content-type: text/html), a blank line and the HTML body. The browser renders the HTML as a page, and fetches pictures, style sheets and scripts by further requests. A missing page gives 404 Not Found. The fragment is used by the browser and not sent. Three labelled steps: request, response, render.",["url parts","request","response","render","status code"]],
["Explain the structure of an HTML5 document, with an annotated example and the role of each part.","<!DOCTYPE html> declares an HTML5 document (not a tag; without it browsers use quirks mode). <html lang=\"en\"> is the root, lang names the language. <head> holds metadata not shown: <meta charset=\"UTF-8\"> sets the encoding, the viewport meta makes the page fit a phone, <title> is the text on the tab, in bookmarks and in search results. <body> holds everything the user sees, such as <h1> and <p>. Example: <!DOCTYPE html><html lang=\"en\"><head><meta charset=\"UTF-8\"><title>My Page</title></head><body><h1>Welcome</h1><p>Text</p></body></html>. Head = information about the page; body = displayed content.",["doctype","html lang","head","body","title"]],
["Explain elements, attributes and void elements with five examples of each kind of tag.","An element is an opening tag, content and a closing tag, e.g. <p>text</p>, and elements nest properly (last opened, first closed). Container elements with closing tags: p, h1, a, table, form. Void elements have no content or closing tag: br, hr, img, input, meta. Attributes are name=\"value\" pairs in the opening tag: id (unique name), class (shared group name), src (file address), href (link destination), alt (image text), style (inline CSS), lang (language). Example: <a href=\"about.html\" target=\"_blank\">About Us</a>.",["element opening closing","void","attribute name value","examples"]],

["Explain how to build a table with merged cells, and why layout tables are discouraged.","Use <table> with a <tr> for each row, <th> for header cells and <td> for data cells, optionally <caption>, <thead>, <tbody>. colspan=\"3\" stretches a cell across three columns, so the row needs only one cell; rowspan=\"2\" stretches a cell down two rows, so the next row omits the covered cell. First count the columns, mark the spans, then write row by row. Every row must account for the same number of columns. Style with CSS (border, padding, border-collapse), not the obsolete attributes. Layout tables are discouraged because tables are for data; they break on phones and confuse screen readers; CSS does layout.",["tr th td","colspan","rowspan","same number of columns","layout css"]],
["Explain the form controls with an example, and describe exactly what data is sent for each.","<form action=\"/submit\" method=\"get\"> contains controls. Text (name fullname) sends fullname=Asha+Rao; password hides characters but is sent as typed; email checks the format; number has min and max; checkboxes (same name subject) send one pair per ticked box, subject=math&subject=eng; radio buttons with the same name send only the chosen value; <select> sends the value of the chosen option (mum), and the first option by default; <textarea> sends its text; submit sends and reset clears. A control with no name, an unticked checkbox or an unchosen radio group sends nothing; empty text boxes send name= with an empty value. <label for> must equal the id.",["text password","checkbox","radio same name","select value","name"]],

  else if(S.lv==="cover")h+=viewCover();
  else if(S.lv==="lab")h+=labView();
  else h+=viewDump();
  return '<div style="display:flex;flex-direction:column;gap:18px">'+h+"</div>";
}
function secCounts(){
  const c=[0,0,0,0];
  CARDS.forEach((k,i)=>{if(S.cards.sec<0||k[0]===S.cards.sec)c[store.box[i]||0]++;});return c;
}
function viewCards(){
  const c=secCounts(),tot=c[0]+c[1]+c[2]+c[3];
  let h='<p class="hint">Read the question, answer in your head or in the box, then flip. Rate honestly. Missed cards come back within a few cards; a card is mastered after two confident passes in separate sessions.</p>';
  h+='<div class="subnav">'+['<button class="chip" data-act="csec" data-v="-1" aria-pressed="'+(S.cards.sec<0)+'">All topics</button>'].concat(SECS.map((s,i)=>`<button class="chip" data-act="csec" data-v="${i}" aria-pressed="${S.cards.sec===i}">${esc(s)}</button>`)).join("")+"</div>";
  h+=`<div class="subnav"><button class="chip" data-act="cord" data-v="0" aria-pressed="${!S.cards.ordered}">Shuffled</button><button class="chip" data-act="cord" data-v="1" aria-pressed="${S.cards.ordered}">Chapter order</button></div>`;
  h+=`<div class="stats"><div class="stat"><b>${c[0]}</b><span>New</span></div><div class="stat"><b>${c[1]}</b><span>Learning</span></div><div class="stat"><b>${c[2]}</b><span>Review</span></div><div class="stat"><b>${c[3]}</b><span>Mastered</span></div></div>`;
  h+=`<div class="bar" aria-hidden="true"><i style="width:${tot?Math.round(c[3]/tot*100):0}%"></i></div>`;
  const q=S.cards.queue;
  if(!q.length){
    h+=`<div class="panel"><h3>${c[3]===tot?"Every card in this set is mastered":"Session complete"}</h3><p class="hint">${S.cards.done} cards rated this session.</p><div class="row"><button class="btn primary" data-act="cnext">Start another round</button><button class="btn" data-act="creset">Reset progress for this set</button></div></div>`;
    return h;
  }
  const id=q[0],k=CARDS[id];
  h+=`<div class="panel fc"><div class="lab">Question · ${esc(SECS[k[0]])} · ${q.length} left</div><div class="q">${esc(k[1])}</div>`;
  h+=`<input type="text" id="guess" placeholder="Type what you remember (optional)" value="${esc(S.cards.guess)}" autocomplete="off">`;
  if(!S.cards.flip){h+='<div class="row"><button class="btn primary" data-act="flip">Show answer</button><span class="hint">or press Space</span></div>';}
  else{
    h+=`<div class="lab">Answer</div><div class="a">${esc(k[2])}</div><div class="row"><button class="btn bad" data-act="rate" data-v="miss">Missed it (1)</button><button class="btn warn" data-act="rate" data-v="almost">Almost (2)</button><button class="btn good" data-act="rate" data-v="got">Got it (3)</button></div>`;
  }
  return h+"</div>";
}
function viewCloze(){
  let h='<p class="hint">Read each passage and say the hidden term aloud before you tap it. Tap again to hide it.</p><div class="row"><button class="btn" data-act="revall">Reveal all</button><button class="btn" data-act="hideall">Hide all</button></div>';
  NOTES.forEach(n=>{
    const body=esc(n[1]).replace(/\{\{(.+?)\}\}/g,(m,a)=>`<button class="blank" data-act="blank" style="min-width:${Math.max(4,a.length)}ch" aria-label="Hidden term, press to reveal"><span class="ans">${a}</span></button>`);
    h+=`<div class="panel note"><h3>${esc(n[0])}</h3><p>${body}</p></div>`;
  });
  return h;
}
function viewCover(){
  let h='<p class="hint">Cover the answers, say what belongs in each cell, then tap it to check. Switch the mask to quiz yourself from the other direction.</p>';
  TABLES.forEach((t,ti)=>{
    const m=S.tmode[ti]||"a";
    h+=`<div class="panel"><div class="row" style="justify-content:space-between"><h3>${esc(t.t)}</h3><div class="subnav"><button class="chip" data-act="tmode" data-t="${ti}" data-v="a" aria-pressed="${m==="a"}">Hide answers</button><button class="chip" data-act="tmode" data-t="${ti}" data-v="b" aria-pressed="${m==="b"}">Hide first column</button><button class="chip" data-act="tmode" data-t="${ti}" data-v="o" aria-pressed="${m==="o"}">Show all</button></div></div><div class="tbl"><table><thead><tr>${t.c.map(c=>`<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>`;
    t.r.forEach(r=>{h+="<tr>"+r.map((c,ci)=>{const hid=(m==="a"&&ci>0)||(m==="b"&&ci===0);return `<td><span class="m${hid?" hid":""}" data-act="mask"${hid?' tabindex="0" role="button" aria-label="Hidden, press to reveal"':""}>${esc(c)}</span></td>`;}).join("")+"</tr>";});
    h+="</tbody></table></div></div>";
  });
  return h;
}
function viewDump(){
  const d=DUMPS[S.dump.i];
  let h='<p class="hint">Pick a topic and write everything you can remember with the chapter closed. Then compare against the key points and tick what you covered. The unticked points are your study list.</p>';
  h+='<div class="subnav">'+DUMPS.map((x,i)=>`<button class="chip" data-act="dtopic" data-v="${i}" aria-pressed="${S.dump.i===i}">${esc(x.t)}</button>`).join("")+"</div>";
  h+=`<div class="panel"><h3>${esc(d.t)}</h3><label class="lab" for="dtext">Your recall</label><textarea id="dtext" placeholder="Write it all out, in your own words...">${esc(S.dump.text)}</textarea>`;
  if(!S.dump.checked){h+='<div class="row"><button class="btn primary" data-act="dcheck">Compare with key points</button></div>';}
  else{
    const n=d.p.length,got=d.p.filter((_,i)=>S.dump.ticks[i]).length;
    h+=`<div class="lab">Tick what you included</div><div class="pts">`+d.p.map((p,i)=>`<label><input type="checkbox" data-act="dtick" data-i="${i}"${S.dump.ticks[i]?" checked":""}><span>${esc(p)}</span></label>`).join("")+`</div><div class="row"><b>${got} of ${n} covered</b><button class="btn" data-act="dreset">Try again</button></div>`;
  }
  return h+"</div>";
}

function hParse(src){

    if(!t)return;
    if(t.indexOf("<")>=0)msgs.push(["E",lineOf(pos+t.indexOf("<")),"Bad character < in text. Write &lt; for a less-than sign."]);
    stack[stack.length-1].kids.push({text:t});
  };
  const top=()=>stack[stack.length-1];
  while((m=re.exec(src))){
    text(src.slice(last,m.index),last);last=m.index+m[0].length;
    const tok=m[0],ln=lineOf(m.index);
    if(tok.startsWith("<!--")){top().kids.push({comment:tok});continue;}
    if(/^<!doctype/i.test(tok)){doctype=true;continue;}
    const cm=/^<(\/?)([a-zA-Z][a-zA-Z0-9]*)([\s\S]*?)\/?>$/.exec(tok);
    const closing=!!cm[1],name=cm[2].toLowerCase();
    if(closing){
      if(H_VOID.has(name)){msgs.push(["E",ln,"Stray end tag "+name+"."]);continue;}
      let ix=-1;for(let i=stack.length-1;i>0;i--)if(stack[i].tag===name){ix=i;break;}
      if(ix<0){msgs.push(["E",ln,"Stray end tag "+name+"."]);continue;}
      const open=stack.slice(ix+1).filter(n=>!H_OPT.has(n.tag)||(n.tag==="p"&&H_INLINE.has(name)));
      if(open.length)msgs.push(["E",ln,"End tag "+name+" violates nesting rules: "+open.map(n=>n.tag).join(", ")+" is still open."]);
      stack=stack.slice(0,ix);
      continue;
    }
    const attrs={};const ar=/([a-zA-Z_:][-a-zA-Z0-9_:.]*)(?:\s*=\s*(?:"([^"]*)"|'([^']*)'|([^\s"'>]+)))?/g;let am;

    if(H_CLOSEP.has(name)&&top().tag==="p")stack.pop();
    if(name==="li"&&top().tag==="li")stack.pop();
    if((name==="td"||name==="th")&&(top().tag==="td"||top().tag==="th"))stack.pop();
    if(name==="tr"&&(top().tag==="td"||top().tag==="th")){stack.pop();}
    if(name==="tr"&&top().tag==="tr")stack.pop();

function hWalk(n,f){if(n.tag)f(n);(n.kids||[]).forEach(k=>hWalk(k,f));}
function hText(n){return (n.kids||[]).map(k=>k.text!==undefined?k.text:k.tag?hText(k):"").join("");}
function hCheck(src){
  const P=hParse(src),msgs=P.msgs.slice();
  const all=[];hWalk(P.root,n=>all.push(n));
  if(!P.doctype)msgs.push(["E",1,"Start tag seen without seeing a doctype first. Expected <!DOCTYPE html>."]);
  const htmlN=all.find(n=>n.tag==="html");
  if(htmlN&&!htmlN.attrs.lang)msgs.push(["W",htmlN.line,"Consider adding a lang attribute to the html start tag."]);
  if(!all.some(n=>n.tag==="title"))msgs.push(["E",1,"Element head is missing a required instance of child element title."]);
  const ids={};const idList=[];
  all.forEach(n=>{
    if(H_OBS[n.tag])msgs.push(["E",n.line,"The "+n.tag+" element is obsolete. "+H_OBS[n.tag]]);
    for(const a in n.attrs){const w=H_OBSATTR[a];if(w&&(w[0]==="*"||w.indexOf(n.tag)>=0))msgs.push(["W",n.line,"The "+a+" attribute on the "+n.tag+" element is obsolete. Use CSS instead."]);}
    if(n.tag==="img"&&n.attrs.alt===undefined)msgs.push(["E",n.line,"An img element must have an alt attribute, except under certain conditions."]);
    if(n.attrs.id!==undefined){if(ids[n.attrs.id])msgs.push(["E",n.line,"Duplicate ID "+n.attrs.id+"."]);ids[n.attrs.id]=n;}
    const p=n.parent;
    if(p&&H_INLINE.has(p.tag)&&H_BLOCK.has(n.tag)&&n.tag!=="li")msgs.push(["E",n.line,"Element "+n.tag+" not allowed as child of element "+p.tag+" in this context."]);
    if(p&&p.tag==="head"&&!H_HEADOK.has(n.tag))msgs.push(["E",n.line,"Element "+n.tag+" not allowed as child of element head in this context."]);
    if((n.tag==="td"||n.tag==="th")&&p&&p.tag!=="tr")msgs.push(["E",n.line,"Element "+n.tag+" not allowed as child of element "+p.tag+" in this context."]);
    if(n.tag==="tr"&&p&&["table","thead","tbody","tfoot"].indexOf(p.tag)<0)msgs.push(["E",n.line,"Element tr not allowed as child of element "+p.tag+" in this context."]);
    if(n.tag==="li"&&p&&p.tag!=="ul"&&p.tag!=="ol")msgs.push(["E",n.line,"Element li not allowed as child of element "+p.tag+" in this context."]);
    if(n.tag==="option"&&p&&p.tag!=="select")msgs.push(["E",n.line,"Element option not allowed as child of element "+p.tag+" in this context."]);
    if(n.tag==="a"&&n.attrs.target==="_blank"&&!/noopener/.test(n.attrs.rel||""))msgs.push(["W",n.line,"Advice: add rel=\"noopener\" to a link with target=\"_blank\"."]);
    if(n.tag==="a"&&/^\s*(click here|here)\s*$/i.test(hText(n)))msgs.push(["W",n.line,"Advice: link text should describe the destination, not say \"click here\"."]);
  });
  all.forEach(n=>{
    if(n.tag==="a"&&n.attrs.href&&n.attrs.href[0]==="#"&&n.attrs.href.length>1){const id=n.attrs.href.slice(1);if(!ids[id])msgs.push(["E",n.line,"Same-document reference to "+id+" was not found. (Ids are case-sensitive.)"]);}
    if(n.tag==="label"&&n.attrs["for"]!==undefined){const t=ids[n.attrs["for"]];if(!t||["input","select","textarea","button"].indexOf(t.tag)<0)msgs.push(["E",n.line,"The for attribute of the label element must refer to a form control (no element has the id "+n.attrs["for"]+")."]);}
    if(n.tag==="input"){const ty=(n.attrs.type||"text").toLowerCase();if(["submit","reset","button"].indexOf(ty)<0&&!n.attrs.name)msgs.push(["W",n.line,"Advice: this "+ty+" input has no name attribute, so nothing from it is sent."]);}
    if(n.tag==="select"&&!n.attrs.name)msgs.push(["W",n.line,"Advice: the select has no name attribute, so nothing from it is sent."]);
    if(n.tag==="textarea"&&!n.attrs.name)msgs.push(["W",n.line,"Advice: the textarea has no name attribute, so nothing from it is sent."]);
    if(n.tag==="form"){
      const rs=[];hWalk(n,x=>{if(x.tag==="input"&&(x.attrs.type||"").toLowerCase()==="radio")rs.push(x);});
      const nm=new Set(rs.map(x=>x.attrs.name||""));
      if(rs.length>1&&nm.size===rs.length)msgs.push(["W",n.line,"Advice: these radio buttons have different names, so they do not form a group."]);
    }
    if(n.tag==="table"){
      const rows=[];hWalk(n,x=>{if(x.tag==="tr"&&(x.parent===n||["thead","tbody","tfoot"].indexOf(x.parent.tag)>=0)&&(x.parent===n||x.parent.parent===n))rows.push(x);});
      const occ=[];let wid=0;const w=[];
      rows.forEach((r,ri)=>{let col=0,used=0;occ[ri]=occ[ri]||[];
        r.kids.filter(c=>c.tag==="td"||c.tag==="th").forEach(c=>{while(occ[ri][col])col++;const cs=Math.max(1,parseInt(c.attrs.colspan||"1",10)||1),rsn=Math.max(1,parseInt(c.attrs.rowspan||"1",10)||1);
          for(let dr=0;dr<rsn;dr++){occ[ri+dr]=occ[ri+dr]||[];for(let dc=0;dc<cs;dc++)occ[ri+dr][col+dc]=1;}col+=cs;});
        w[ri]=occ[ri].length;wid=Math.max(wid,w[ri]);});
      rows.forEach((r,ri)=>{if(w[ri]!==wid)msgs.push(["E",r.line,"Table row "+(ri+1)+" covers "+w[ri]+" column"+(w[ri]===1?"":"s")+" but the table is "+wid+" columns wide."]);});

function hRender(P){
  const L=[];let cur="";
  const flush=()=>{const t=cur.replace(/[ \t\n\r]+/g," ").trim();if(t)L.push(t);cur="";};
  const inline=n=>{let s="";(n.kids||[]).forEach(k=>{s+=k.text!==undefined?hDecode(k.text):k.tag?node(k,true):"";});return s;};
  const node=(n,asStr)=>{
    const t=n.tag;let s="";
    if(["head","script","style","title"].indexOf(t)>=0)return "";
    if(t==="br"){if(asStr)return " ";flush();return "";}
    if(t==="hr"){if(asStr)return " ------ ";flush();L.push("------");return "";}
    if(t==="img")return "[image: "+(n.attrs.alt||"")+"]";
    if(t==="input"){const ty=(n.attrs.type||"text").toLowerCase();
      if(ty==="checkbox")return n.attrs.checked!==undefined?"[x]":"[ ]";
      if(ty==="radio")return n.attrs.checked!==undefined?"(o)":"( )";
      if(ty==="submit")return "["+(n.attrs.value||"Submit")+"]";
      if(ty==="reset")return "["+(n.attrs.value||"Reset")+"]";
      if(ty==="button")return "["+(n.attrs.value||"")+"]";
      if(ty==="password")return "[******]";
      if(ty==="hidden")return "";
      return "["+(n.attrs.value||"______")+"]";}
    if(t==="button")return "["+hDecode(hText(n)).replace(/\s+/g," ").trim()+"]";
    if(t==="select"){const o=n.kids.filter(k=>k.tag==="option");const sel=o.find(x=>x.attrs.selected!==undefined)||o[0];return "["+(sel?hDecode(hText(sel)).trim():"")+" v]";}
    if(t==="textarea")return "["+(hText(n).trim()||"......")+"]";
    if(t==="q")return "“"+inline(n)+"”";
    if(t==="table"){
      const rows=[];hWalk(n,x=>{if(x.tag==="tr")rows.push(x);});
      const out=[];
      const cap=n.kids.find(k=>k.tag==="caption");if(cap)out.push(hDecode(hText(cap)).replace(/\s+/g," ").trim());
      rows.forEach(r=>out.push(r.kids.filter(c=>c.tag==="td"||c.tag==="th").map(c=>inline(c).replace(/\s+/g," ").trim()).join(" | ")));
      if(asStr)return " "+out.join(" / ")+" ";
      flush();out.forEach(x=>{if(x)L.push(x);});return "";
    }
    if(t==="pre"){
      let raw=hDecode(hText(n));raw=raw.replace(/^\n/,"");
      if(asStr)return raw;
      flush();raw.split("\n").forEach(x=>{if(x.trim())L.push(x.replace(/\s+$/,""));});return "";
    }
    const blk=H_BLOCK.has(t)||["header","footer","nav","main","section","article","aside","body","html","form","caption","ul","ol","blockquote","tr"].indexOf(t)>=0;
    if(asStr||!blk){s=inline(n);return s;}
    flush();
    if(t==="li")cur="• ";
    (n.kids||[]).forEach(k=>{
      if(k.text!==undefined)cur+=hDecode(k.text);
      else if(k.tag){const r=node(k);if(r)cur+=r;}
    });
    flush();
    return "";
  };
  const html=P.root.kids.find(k=>k.tag==="html")||P.root;
  const body=html.kids&&html.kids.find&&html.kids.find(k=>k.tag==="body");
  const target=body||P.root;
  const hasHtml=html!==P.root;
  (target.kids||[]).forEach(k=>{
    if(k.text!==undefined)cur+=hDecode(k.text);
    else if(k.tag){const r=node(k);if(r)cur+=r;}
  });
  if(!body&&hasHtml)(html.kids||[]).forEach(k=>{if(k.tag&&k.tag!=="head"){const r=node(k);if(r)cur+=r;}});
  flush();

}
function fnRun(src){
  const C=hCheck(src);
  const E=C.msgs.filter(m=>m[0]==="E"),W=C.msgs.filter(m=>m[0]==="W");
  const lines=hRender(C.P);
  let n=0;C.P.root.kids.forEach(function w(k){if(k.tag){n++;(k.kids||[]).forEach(w);}});
  let out="Checker: "+E.length+" error"+(E.length===1?"":"s")+", "+W.length+" warning"+(W.length===1?"":"s")+(C.msgs.length?"":" (no errors or warnings to show)")+"\n";
  C.msgs.forEach(m=>{out+=(m[0]==="E"?"Error":"Warning")+" (line "+m[1]+"): "+m[2]+"\n";});
  out+="\nThe page displays:\n"+(lines.length?lines.join("\n"):"(nothing visible)");
  return {ok:true,out:out,errors:E.length,warns:W.length,stmts:n,html:src,lines:lines,msgs:C.msgs,brief:"problems "+C.msgs.length+" | "+lines.join(" / ")};
}

function runCpp(src,inp){return fnRun(src);}

function resetWidget(id){const s=CS.spec[id];if(!s)return;delete CS.src[id];delete CS.out[id];delete CS.inp[id];render();}

/* ---------- URL splitter ---------- */
function labUrl(){
  return '<div class="panel"><h3>URL splitter</h3><p class="hint">Type any web address. The tool splits it into scheme, host, port, path, query and fragment, as in Table 1.2.</p><div class="row">'+numIn("urlin","Address","ut",34,"url")+'</div><div id="urlres">'+urlRes()+"</div></div>";

function urlRes(){
  const u=String(L.ut).trim();
  const m=/^([a-zA-Z][a-zA-Z0-9+.-]*):\/\/([^\/:?#]+)(?::(\d+))?([^?#]*)(?:\?([^#]*))?(?:#(.*))?$/.exec(u);
  if(!m)return '<div class="rs bad">This is not a full web address. Write it like https://www.example.com/page.html?id=5#top</div>';
  const sch=m[1].toLowerCase(),def=sch==="https"?"443":sch==="http"?"80":"";
  const rows=[["Scheme",sch+(sch==="https"?" (encrypted HTTP)":sch==="http"?" (plain HTTP)":"")],["Host",m[2]],["Port",m[3]?m[3]:(def?"(not written; the default for "+sch+" is "+def+")":"(not written)")],["Path",m[4]||"/ (the home page)"],["Query",m[5]!==undefined?m[5]:"(none)"],["Fragment",m[6]!==undefined?m[6]+" (used by the browser, never sent to the server)":"(none)"]];
  let h=tbl(["Part","Value"],rows);
  if(m[5]){const pairs=m[5].split("&").map(p=>{const i=p.indexOf("=");return i<0?[p,""]:[p.slice(0,i),p.slice(i+1)];});h+='<p class="hint">The query holds '+pairs.length+" name=value pair"+(pairs.length===1?"":"s")+": "+pairs.map(p=>esc(p[0]+" = "+p[1])).join("; ")+".</p>";}
  return h;
}
/* ---------- Path resolver ---------- */
function resolvePath(base,href){
  href=String(href).trim();base=String(base).trim()||"/";
  if(!href)return {kind:"empty",to:"",why:"Type an href value."};
  if(/^mailto:/i.test(href))return {kind:"E-mail link",to:"",why:"Opens the visitor's e-mail program with the address in the To box."};
  if(/^[a-zA-Z][a-zA-Z0-9+.-]*:\/\//.test(href))return {kind:"External link (absolute URL)",to:href,why:"A complete address with the scheme: another website altogether."};
  if(href[0]==="#")return {kind:"Bookmark",to:base+href,why:"Stays on the same page and scrolls to the element whose id is "+href.slice(1)+" (ids are case-sensitive)."};
  let frag="";const hi=href.indexOf("#");if(hi>=0){frag=href.slice(hi);href=href.slice(0,hi);}
  let parts;let kind;
  if(href[0]==="/"){parts=href.split("/").filter(x=>x);kind="Internal link, from the root of the site";}
  else{parts=base.split("/").filter(x=>x);parts.pop();parts=parts.concat(href.split("/").filter(x=>x));kind="Internal link, relative path";}
  const out=[];let above=false;
  parts.forEach(p=>{if(p===".")return;if(p===".."){if(out.length)out.pop();else above=true;}else out.push(p);});
  return {kind:kind,to:"/"+out.join("/")+frag,why:above?"The path tries to climb above the root of the site.":"Relative paths are measured from the folder of the current page; .. means one level up."};
}

  const r=resolvePath(L.pb,L.ph);

}

function formEnc(s){return encodeURIComponent(String(s)).replace(/[!'()~]/g,c=>"%"+c.charCodeAt(0).toString(16).toUpperCase()).replace(/%20/g,"+");}
function sendPairs(){
  const p=[["fullname",L.fn],["password",L.fp]];
  if(L.fnm==="yes")p.push(["email",L.fe]);
  p.push(["age",L.fa]);
  if(L.fmath)p.push(["subject","math"]);if(L.fsci)p.push(["subject","sci"]);if(L.feng)p.push(["subject","eng"]);
  if(L.fg==="male"||L.fg==="female")p.push(["gender",L.fg]);
  p.push(["city",L.fc]);p.push(["message",L.fmsg]);
  return p;
}
function sendRes(){
  const q=sendPairs().map(x=>x[0]+"="+formEnc(x[1])).join("&");

  const notes=[];

  return h;
}

    case "prun2":{const q=CALC[L.pi];const r=runCpp(q.src,"");L.pres[L.pi]=Object.assign(L.pres[L.pi]||{},{run:r});const g=document.getElementById("pguess2");if(g&&!(L.pres[L.pi].checked))L.pres[L.pi].guess=g.value;render();return true;}
    case "pprev2":if(L.pi>0)L.pi--;render();return true;
    case "pnext2":if(L.pi+1<CALC.length)L.pi++;render();return true;
    case "fcheck":{const f=FIX[L.fi];const id="fix"+L.fi;const ta=document.getElementById("code-"+id);const ii=document.getElementById("in-"+id);const src=ta?ta.value:f.src;CS.src[id]=src;const inp=ii?ii.value:(f.inp||"");CS.inp[id]=inp;const r=runCpp(src,inp);CS.out[id]=r;
      const got=(r.brief!==undefined?r.brief:(r.out||"")).replace(/\r/g,"").replace(/\s+$/,"");
      let msg,ok=false;
      if(!r.ok){msg=r.title+". "+r.detail;}
      else if(got===f.exp){ok=true;msg="The output matches the goal.";}
      else msg="It runs, but the output is different from the goal. Expected \""+f.exp.replace(/\n/g," / ")+"\" and got \""+got.replace(/\n/g," / ")+"\".";
      L.fres[L.fi]={ok:ok,msg:msg};render();return true;}
    case "fhint":L.fshow[L.fi]=Math.max(L.fshow[L.fi]||0,1);render();return true;
    case "fsol":L.fshow[L.fi]=2;render();return true;
    case "fprev":if(L.fi>0)L.fi--;render();return true;
    case "fnext":if(L.fi+1<FIX.length)L.fi++;render();return true;
    case "lsdim":L.sd.dim=+v;L.sd.s=0;L.sd.t=0;sdNew();render();return true;
    case "lsda":{const d=DIMS[L.sd.dim],it=d.it[L.sd.item];L.sd.t++;const ok=+v===it[1];if(ok)L.sd.s++;L.sd.right=ok;L.sd.fb=(ok?"Correct. ":"Not quite. ")+"\u201c"+it[0]+"\u201d: "+d.o[it[1]]+".";render();return true;}
    case "lsdn":sdNew();render();return true;
  }
  return false;
}

  return h+'</section>';
}
function stepIds(st){const ids=[];CARDS.forEach((c,i)=>{if(st.sec.includes(c[0]))ids.push(i);});return ids.filter(i=>i<ORIG).concat(ids.filter(i=>i>=ORIG));}
function stepChunks(st){const ids=stepIds(st),out=[];for(let i=0;i<ids.length;i+=CH)out.push(ids.slice(i,i+CH));return out;}
function blankHtml(text){return esc(text).replace(/\{\{(.+?)\}\}/g,(m,a)=>`<button class="blank" data-act="blank" style="min-width:${Math.max(4,a.length)}ch" aria-label="Hidden term, press to reveal"><span class="ans">${a}</span></button>`);}
function applyRate(queue,v){const id=queue.shift();let b=store.box[id]||0;
  if(v==="miss"){b=1;queue.splice(Math.min(3,queue.length),0,id);}
  else if(v==="almost"){b=Math.max(b,1);queue.push(id);}
  else{b=b<2?2:3;}
  store.box[id]=b;save();}
function openStep(s){
  const P=S.path,N=stepChunks(STEPS[s]).length;
  const ch=store.path.done[s]?0:Math.min(store.path.ch[s]||0,N);
  P.step=s;P.i=0;P.flip=false;P.guess="";P.text="";P.dchecked=false;P.ticks={};P.q=[];
  if(ch>=N){P.ph="gaps";P.ch=N-1;}else{P.ch=ch;P.ph=ch>0?"learn":"primer";}
  render();window.scrollTo(0,0);
}
function pathOverview(){
  const first=STEPS.findIndex((_,s)=>!store.path.done[s]);
  let h='<div class="panel"><h2>Start here</h2><p>New to the subject? Follow the steps in order. Each step sets out the textbook notes (with runnable code where the chapter has a listing), then teaches its cards in small rounds of six (first you see them with answers, then you recall them), then checks you with fill-the-gaps and a brain dump. Progress is saved in this browser.</p></div><div style="display:flex;flex-direction:column;gap:10px">';
  STEPS.forEach((st,s)=>{
    const N=stepChunks(st).length,done=!!store.path.done[s],ch=Math.min(store.path.ch[s]||0,N);
    const status=done?"Done":ch>0?"Round "+ch+" of "+N+" done":"Not started";
    h+=`<button class="opt" data-act="pstep" data-v="${s}" style="display:flex;justify-content:space-between;gap:12px;align-items:center"><span><b>${s+1}. ${esc(st.t)}</b><br><span class="hint">${stepIds(st).length} cards · ${N} rounds</span></span><span class="tag">${status}</span></button>`;
  });
  h+="</div>";
  if(first>=0)h+=`<div class="row"><button class="btn primary" data-act="pstep" data-v="${first}">${(store.path.ch[first]||0)>0?"Continue":"Begin"} step ${first+1}</button></div>`;
  else h+='<p>All steps are done. Keep the cards fresh in Recall cards, then test yourself in Evaluate.</p>';
  return '<div style="display:flex;flex-direction:column;gap:18px">'+h+"</div>";
}
function viewPath(){
  const P=S.path;
  if(P.step===null)return pathOverview();
  const st=STEPS[P.step],chunks=stepChunks(st),N=chunks.length;
  const pos=P.ph==="primer"?0:(P.ph==="learn"||P.ph==="recall"||P.ph==="roundend")?1+P.ch:P.ph==="gaps"?N+1:P.ph==="dump"?N+2:N+3;
  let h=`<div class="row" style="justify-content:space-between"><span class="row"><button class="btn" data-act="pback">All steps</button>${P.ph==="primer"||P.ph==="done"?"":'<button class="btn" data-act="pnotes">Notes</button>'}</span><span class="lab">Step ${P.step+1} of ${STEPS.length}</span></div><div class="bar" aria-hidden="true"><i style="width:${Math.round(pos/(N+3)*100)}%"></i></div><h2>${esc(st.t)}</h2>`;
  if(P.ph==="primer"){
    h+=`<div class="panel"><div class="lab">Textbook notes</div>${st.blocks.map(noteHtml).join("")}<p class="hint">Next: ${N} short rounds. In each round you see ${CH} cards with their answers, then recall them from memory.</p><div class="row"><button class="btn primary" data-act="pstart">${P.ch>0?"Continue at round "+(P.ch+1):"Start round 1"}</button></div></div>`;
  }else if(P.ph==="learn"){
    const ids=chunks[P.ch],id=ids[P.i],k=CARDS[id];
    h+=`<div class="panel fc"><div class="lab">Round ${P.ch+1} of ${N} · Learn · card ${P.i+1} of ${ids.length} · ${id<ORIG?"Core":"Detail"}</div><div class="q">${esc(k[1])}</div><div class="lab">Answer</div><div class="a">${esc(k[2])}</div><p class="hint">Read it, say it back in your own words, then move on.</p><div class="row"><button class="btn" data-act="plback"${P.i?"":" disabled"}>Back</button><button class="btn primary" data-act="plnext">${P.i+1<ids.length?"Next card":"Now recall these "+ids.length}</button></div></div>`;
  }else if(P.ph==="recall"){
    const id=P.q[0],k=CARDS[id];
    h+=`<div class="panel fc"><div class="lab">Round ${P.ch+1} of ${N} · Recall · ${P.q.length} left</div><div class="q">${esc(k[1])}</div><input type="text" id="pguess" placeholder="Type what you remember (optional)" value="${esc(P.guess)}" autocomplete="off">`;
    if(!P.flip)h+='<div class="row"><button class="btn primary" data-act="pflip">Show answer</button><span class="hint">or press Space</span></div>';
    else h+=`<div class="lab">Answer</div><div class="a">${esc(k[2])}</div><div class="row"><button class="btn bad" data-act="prate" data-v="miss">Missed it (1)</button><button class="btn warn" data-act="prate" data-v="almost">Almost (2)</button><button class="btn good" data-act="prate" data-v="got">Got it (3)</button></div>`;
    h+="</div>";
  }else if(P.ph==="roundend"){
    const last=P.ch+1>=N;
    h+=`<div class="panel"><h3>Round ${P.ch+1} done</h3><p>${last?"That was the last round of cards. Two short exercises remain: fill the gaps in the summary, then a brain dump.":"Next you will see "+chunks[P.ch+1].length+" new cards."}</p><div class="row"><button class="btn primary" data-act="pnext">${last?"Fill the gaps":"Start round "+(P.ch+2)}</button></div></div>`;
  }else if(P.ph==="gaps"){
    h+='<p class="hint">Say each hidden term aloud before you tap it.</p><div class="row"><button class="btn" data-act="revall">Reveal all</button><button class="btn" data-act="hideall">Hide all</button></div>';
    st.notes.forEach(ni=>{const n=NOTES[ni];h+=`<div class="panel note"><h3>${esc(n[0])}</h3><p>${blankHtml(n[1])}</p></div>`;});
    h+='<div class="row"><button class="btn primary" data-act="pdump">Continue to brain dump</button></div>';
  }else if(P.ph==="dump"){
    const pts=[];st.dump.forEach(d=>DUMPS[d].p.forEach(p=>pts.push(p)));
    h+=`<div class="panel"><h3>Brain dump</h3><p class="hint">Close everything and write what you remember about this step. Then compare.</p><textarea id="ptext" placeholder="Write it in your own words...">${esc(P.text)}</textarea>`;
    if(!P.dchecked)h+='<div class="row"><button class="btn primary" data-act="pcheck">Compare with key points</button></div>';
    else{const got=pts.filter((_,i)=>P.ticks[i]).length;
      h+=`<div class="lab">Tick what you included</div><div class="pts">${pts.map((p,i)=>`<label><input type="checkbox" data-act="ptick" data-i="${i}"${P.ticks[i]?" checked":""}><span>${esc(p)}</span></label>`).join("")}</div><div class="row"><b>${got} of ${pts.length} covered</b><button class="btn primary" data-act="pfinish">Finish this step</button></div>`;}
    h+="</div>";
  }else{
    const ids=stepIds(st),m=ids.filter(i=>(store.box[i]||0)>=2).length;
    h+=`<div class="panel"><h3>Step ${P.step+1} complete</h3><p>${m} of ${ids.length} cards in this step are at Review or Mastered. The rest keep coming back in Recall cards.</p><div class="row">${P.step+1<STEPS.length?`<button class="btn primary" data-act="pnextstep">Next: ${esc(STEPS[P.step+1].t)}</button>`:""}<button class="btn" data-act="pback">All steps</button></div></div>`;
  }
  return '<div style="display:flex;flex-direction:column;gap:16px">'+h+"</div>";
}

/* ============ EVALUATE ============ */
function countOf(k){return BANK.filter(b=>b.t===k).length;}
function viewEval(){
  if(S.ev.view==="setup")return evalSetup();
  if(S.ev.view==="quiz")return evalQuiz();
  return evalResult();
}
function evalSetup(){
  let h='<div class="panel"><h2>Build a test</h2><p class="hint">Choose the question types. Written answers (short, long, scenario) are self-marked against the key points, like checking your own paper.</p><div style="display:flex;flex-direction:column;gap:8px">';
  TYPES.forEach(t=>{h+=`<div class="tcount"><label><input type="checkbox" data-act="etype" data-v="${t.k}"${S.ev.types[t.k]?" checked":""}><span>${esc(t.n)}</span></label><span class="n">${countOf(t.k)} Qs · ${t.m} mark${t.m>1?"s":""} each</span></div>`;});
  const pool=BANK.filter(b=>S.ev.types[b.t]).length;
  h+=`</div><div class="row"><label for="en" class="lab">Length</label><select id="en" style="width:auto"><option value="10"${S.ev.n==10?" selected":""}>10 questions</option><option value="20"${S.ev.n==20?" selected":""}>20 questions</option><option value="35"${S.ev.n==35?" selected":""}>35 questions</option><option value="0"${S.ev.n==0?" selected":""}>Everything selected (${pool})</option></select></div><div class="row"><button class="btn primary" data-act="estart"${pool?"":" disabled"}>Start test</button></div></div>`;
  if(store.hist.length){
    h+='<div class="panel"><h3>Recent tests</h3>'+store.hist.slice(0,6).map(x=>`<div class="row" style="justify-content:space-between"><span>${esc(x.d)} · ${x.n} questions</span><b>${x.pct}%</b></div>`).join("")+"</div>";
  }
  return '<div style="display:flex;flex-direction:column;gap:18px">'+h+"</div>";
}
function startRun(list){
  const qs=list.map(q=>q.t==="mcq"?Object.assign({},q,{o:shuffle(q.opts.map((t,i)=>({t:t,c:i===q.a})))}):q);
  S.run={qs:qs,i:0,res:[],stage:[],ticks:[],text:[]};S.ev.view="quiz";render();window.scrollTo(0,0);
}
function evalQuiz(){
  const r=S.run,q=r.qs[r.i],res=r.res[r.i],T=TM[q.t];
  let h=`<div class="panel"><div class="row" style="justify-content:space-between"><span class="tag">${esc(T.n)}</span><span class="lab">Question ${r.i+1} of ${r.qs.length} · ${T.m} mark${T.m>1?"s":""}</span></div><div class="bar" aria-hidden="true"><i style="width:${Math.round(r.i/r.qs.length*100)}%"></i></div>`;
  h+=`<h3 style="font-size:1.2rem;line-height:1.35">${esc(q.t==="fill"?q.q.replace("___","_______"):q.q)}</h3>`;
  if(q.t==="calc"&&q.src)h+='<pre class="codeview">'+esc(q.src)+'</pre>';
  if(q.t==="mcq"){
    h+='<div class="opts">'+q.o.map((o,i)=>{let c="opt";if(res){if(o.c)c+=" right";else if(res.pick===i)c+=" wrong";}return `<button class="${c}" data-act="mcq" data-i="${i}"${res?" disabled":""}>${esc(o.t)}</button>`;}).join("")+"</div>";
    if(res)h+=`<div class="fb ${res.score?"ok":"no"}"><b>${res.score?"Correct.":"Not quite."}</b> ${esc(q.e)}</div>`;
  }else if(q.t==="tf"){
    h+='<div class="opts">'+[true,false].map(v=>{let c="opt";if(res){if(q.a===v)c+=" right";else if(res.pick===v)c+=" wrong";}return `<button class="${c}" data-act="tf" data-v="${v}"${res?" disabled":""}>${v?"True":"False"}</button>`;}).join("")+"</div>";
    if(res)h+=`<div class="fb ${res.score?"ok":"no"}"><b>${res.score?"Correct.":"Not quite."}</b> ${esc(q.e)}</div>`;
  }else if(q.t==="fill"||q.t==="vsa"||q.t==="calc"){
    h+=`<input type="text" id="ans" autocomplete="off" placeholder="Type your answer" value="${esc(r.text[r.i]||"")}"${res?" disabled":""}>`;
    if(!res)h+='<div class="row"><button class="btn primary" data-act="check">Check</button></div>';
    else{
      h+=`<div class="fb ${res.score?"ok":"no"}"><b>${res.score?"Correct.":"Model answer:"}</b> ${res.score?"":esc(q.model)} ${q.e?esc(q.e):""}</div>`;
      if(!res.score)h+='<div class="row"><button class="btn" data-act="override">I was right, count it</button></div>';
    }
  }else{
    const st=r.stage[r.i]||0;
    h+=`<textarea id="wtext" placeholder="Write your answer as you would in the exam..."${st?" disabled":""}>${esc(r.text[r.i]||"")}</textarea>`;
    if(!st)h+='<div class="row"><button class="btn primary" data-act="reveal">Show model answer</button></div>';
    else{
      const tk=r.ticks[r.i]||{};const got=q.pts.filter((_,i)=>tk[i]).length;
      h+=`<div class="lab">Model answer</div><div class="a" style="border-left:3px solid var(--accent);padding-left:14px">${esc(q.model)}</div><div class="lab">Tick every marking point your answer made</div><div class="pts">`+q.pts.map((p,i)=>`<label><input type="checkbox" data-act="wtick" data-i="${i}"${tk[i]?" checked":""}${res?" disabled":""}><span>${esc(p)}</span></label>`).join("")+"</div>";
      if(!res)h+=`<div class="row"><button class="btn primary" data-act="wsave">Save score (${fmt(got/q.pts.length*T.m)} of ${T.m})</button></div>`;
      else h+=`<div class="fb ${res.score>=T.m?"ok":"no"}">Scored ${fmt(res.score)} of ${T.m}.</div>`;
    }
  }
  if(res){h+=`<div class="row"><button class="btn primary" data-act="next">${r.i+1<r.qs.length?"Next question":"See results"}</button></div>`;}
  return h+"</div>";
}
function fmt(x){return (Math.round(x*2)/2).toString();}
function setRes(score,extra){const r=S.run,q=r.qs[r.i];r.res[r.i]=Object.assign({score:score,max:TM[q.t].m},extra||{});render();}
function evalResult(){
  const r=S.run;let sc=0,mx=0;const by={};
  r.qs.forEach((q,i)=>{const x=r.res[i]||{score:0,max:TM[q.t].m};sc+=x.score;mx+=x.max;const b=by[q.t]||(by[q.t]={s:0,m:0,n:0});b.s+=x.score;b.m+=x.max;b.n++;});
  const pct=Math.round(sc/mx*100);
  const msg=pct>=85?"Exam ready on this material.":pct>=65?"Solid. Revisit the misses below.":pct>=40?"Getting there. Use the Learn section on the weak topics.":"Go back to the recall cards, then try again.";
  let h=`<div class="panel"><div class="lab">Result</div><div class="score">${fmt(sc)} / ${mx} <span style="font-size:1.5rem;color:var(--muted)">${pct}%</span></div><p>${msg}</p><div style="display:flex;flex-direction:column;gap:10px">`;
  TYPES.forEach(t=>{const b=by[t.k];if(!b)return;const p=Math.round(b.s/b.m*100);h+=`<div><div class="row" style="justify-content:space-between"><span>${esc(t.n)} (${b.n})</span><b>${fmt(b.s)}/${b.m}</b></div><div class="bar"><i style="width:${p}%"></i></div></div>`;});
  const missed=r.qs.filter((q,i)=>(r.res[i]||{score:0}).score<TM[q.t].m).length;
  h+=`</div><div class="row">${missed?`<button class="btn primary" data-act="retry">Retry the ${missed} missed</button>`:""}<button class="btn" data-act="newtest">New test</button></div></div>`;
  h+="<h2>Review</h2>";
  r.qs.forEach((q,i)=>{const x=r.res[i]||{score:0,max:TM[q.t].m};const ok=x.score>=x.max;
    let ans=q.t==="mcq"?q.opts[q.a]:q.t==="tf"?(q.a?"True":"False"):q.model;
    h+=`<div class="rev ${ok?"ok":"bad"}"><div class="lab">${esc(TM[q.t].n)} · ${fmt(x.score)}/${x.max}</div><b>${esc(q.q)}</b>${x.resp?`<div class="r">You: ${esc(x.resp)}</div>`:""}<div class="r">${ok?"":"Answer: "}${esc(ans)}</div></div>`;});
  return '<div style="display:flex;flex-direction:column;gap:14px">'+h+"</div>";
}
function finishRun(){
  const r=S.run;let sc=0,mx=0;r.qs.forEach((q,i)=>{const x=r.res[i]||{score:0,max:TM[q.t].m};sc+=x.score;mx+=x.max;});
  if(!r.retry){store.hist.unshift({d:new Date().toLocaleDateString(undefined,{day:"numeric",month:"short"}),pct:Math.round(sc/mx*100),n:r.qs.length});store.hist=store.hist.slice(0,8);save();}
  S.ev.view="result";
}

/* ============ EVENTS ============ */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");if(!el)return;
  const a=el.dataset.act,v=el.dataset.v;
  switch(a){
    case "tab":S.tab=v;render();break;
    case "lv":S.lv=v;render();break;
    case "csec":S.cards.sec=+v;buildQueue();render();break;
    case "flip":S.cards.flip=true;render();break;
    case "cnext":buildQueue();render();break;
    case "creset":CARDS.forEach((k,i)=>{if(S.cards.sec<0||k[0]===S.cards.sec)delete store.box[i];});save();buildQueue();render();break;
    case "rate":{const q=S.cards.queue,id=q.shift();let b=store.box[id]||0;
      if(v==="miss"){b=1;q.splice(Math.min(3,q.length),0,id);}
      else if(v==="almost"){b=Math.max(b,1);q.push(id);}
      else{b=b<2?2:3;S.cards.done++;}
      store.box[id]=b;save();S.cards.flip=false;S.cards.guess="";render();break;}
    case "cord":S.cards.ordered=v==="1";buildQueue();render();break;
    case "pstep":openStep(+v);break;
    case "pback":S.path.step=null;render();window.scrollTo(0,0);break;
    case "pnotes":S.path.ph="primer";render();window.scrollTo(0,0);break;
    case "pstart":S.path.ph="learn";S.path.i=0;render();break;
    case "plback":if(S.path.i>0)S.path.i--;render();break;
    case "plnext":{const P=S.path,ids=stepChunks(STEPS[P.step])[P.ch];
      if(P.i+1<ids.length)P.i++;else{P.ph="recall";P.q=shuffle(ids.slice());P.flip=false;P.guess="";}
      render();break;}
    case "pflip":S.path.flip=true;render();break;
    case "prate":{const P=S.path;applyRate(P.q,v);P.flip=false;P.guess="";
      if(!P.q.length){store.path.ch[P.step]=P.ch+1;save();P.ph="roundend";}
      render();break;}
    case "pnext":{const P=S.path,N=stepChunks(STEPS[P.step]).length;
      if(P.ch+1<N){P.ch++;P.ph="learn";P.i=0;}else P.ph="gaps";
      render();window.scrollTo(0,0);break;}
    case "pdump":S.path.ph="dump";render();window.scrollTo(0,0);break;
    case "pcheck":{const t=$("#ptext");if(t)S.path.text=t.value;S.path.dchecked=true;render();break;}
    case "pfinish":store.path.done[S.path.step]=true;save();S.path.ph="done";render();window.scrollTo(0,0);break;
    case "pnextstep":openStep(S.path.step+1);break;
    case "blank":el.classList.toggle("on");break;
    case "revall":document.querySelectorAll(".blank").forEach(b=>b.classList.add("on"));break;
    case "hideall":document.querySelectorAll(".blank").forEach(b=>b.classList.remove("on"));break;
    case "mask":if(el.classList.contains("hid")){el.classList.remove("hid");el.removeAttribute("role");}break;
    case "tmode":S.tmode[el.dataset.t]=v;render();break;
    case "dtopic":S.dump={i:+v,text:"",checked:false,ticks:{}};render();break;
    case "dcheck":S.dump.checked=true;render();break;
    case "dreset":S.dump.checked=false;S.dump.ticks={};S.dump.text="";render();break;
    case "estart":{const pool=shuffle(BANK.filter(b=>S.ev.types[b.t]));const list=S.ev.n?pool.slice(0,S.ev.n):pool;
      list.sort((x,y)=>TYPES.findIndex(t=>t.k===x.t)-TYPES.findIndex(t=>t.k===y.t));startRun(list);break;}
    case "mcq":{const r=S.run,q=r.qs[r.i],i=+el.dataset.i;setRes(q.o[i].c?1:0,{pick:i,resp:q.o[i].t});break;}
    case "tf":{const r=S.run,q=r.qs[r.i],p=v==="true";setRes(p===q.a?1:0,{pick:p,resp:p?"True":"False"});break;}
    case "check":doCheck();break;
    case "override":{const r=S.run;r.res[r.i].score=TM[r.qs[r.i].t].m;render();break;}
    case "reveal":{const r=S.run;r.text[r.i]=$("#wtext").value;r.stage[r.i]=1;render();break;}
    case "wsave":{const r=S.run,q=r.qs[r.i],tk=r.ticks[r.i]||{};const got=q.pts.filter((_,i)=>tk[i]).length;setRes(Math.round(got/q.pts.length*TM[q.t].m*2)/2,{resp:r.text[r.i]||""});break;}
    case "next":{const r=S.run;if(r.i+1<r.qs.length){r.i++;render();window.scrollTo(0,0);}else{finishRun();render();window.scrollTo(0,0);}break;}
    case "retry":{const r=S.run;const list=r.qs.filter((q,i)=>(r.res[i]||{score:0}).score<TM[q.t].m);startRun(list);S.run.retry=true;break;}
    case "newtest":S.ev.view="setup";S.run=null;render();break;
    default:labClick(a,el,v);
  }
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.dataset.lsel){labSelect(el);return;}
  if(el.dataset.act==="etype"){S.ev.types[el.dataset.v]=el.checked?1:0;render();}
  else if(el.id==="en"){S.ev.n=+el.value;}
  else if(el.dataset.act==="ptick"){S.path.ticks[el.dataset.i]=el.checked;render();}
  else if(el.dataset.act==="dtick"){S.dump.ticks[el.dataset.i]=el.checked;render();}
  else if(el.dataset.act==="wtick"){const r=S.run;r.ticks[r.i]=r.ticks[r.i]||{};r.ticks[r.i][el.dataset.i]=el.checked;render();}
});
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.dataset&&el.dataset.cid){CS.src[el.dataset.cid]=el.value;return;}
  if(el.dataset&&el.dataset.iid){CS.inp[el.dataset.iid]=el.value;return;}
  if(el.dataset&&(el.dataset.lin||el.dataset.tcell!==undefined)){labInput(el);return;}
  if(el.id==="guess")S.cards.guess=el.value;
  else if(el.id==="pguess")S.path.guess=el.value;
  else if(el.id==="ptext")S.path.text=el.value;
  else if(el.id==="dtext")S.dump.text=el.value;
  else if(el.id==="ans"&&S.run)S.run.text[S.run.i]=el.value;
});
function doCheck(){
  const r=S.run,q=r.qs[r.i],v=($("#ans").value||"").trim();if(!v)return;
  r.text[r.i]=v;setRes((q.t==="calc"?matchCalc(v,q):matches(v,q.acc,q.all))?TM[q.t].m:0,{resp:v});
}
document.addEventListener("keydown",e=>{
  const t=e.target,tag=t.tagName;
  if(e.key==="Enter"&&t.id==="ans"){e.preventDefault();doCheck();return;}
  if(t.classList&&t.classList.contains("codearea")){
    if(e.key==="Tab"&&!e.shiftKey){e.preventDefault();const p=t.selectionStart;t.setRangeText("    ",p,t.selectionEnd,"end");CS.src[t.dataset.cid]=t.value;return;}
    if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)){e.preventDefault();const b=t.closest(".cw").parentElement.querySelector('[data-act="crun"],[data-act="fcheck"]');if(b)b.click();return;}
  }
  if(e.key==="Enter"&&t.id==="pguess2"){e.preventDefault();const b=document.querySelector('[data-act="pcheck2"]');if(b&&!b.disabled)b.click();return;}
  if((e.key==="Enter"||e.key===" ")&&t.classList&&t.classList.contains("hid")){e.preventDefault();t.click();return;}
  const inPath=S.tab==="learn"&&S.lv==="path"&&S.path.ph==="recall"&&S.path.q.length>0;
  const inCards=S.tab==="learn"&&S.lv==="cards"&&S.cards.queue.length>0;
  if(!(inPath||inCards)||tag==="INPUT"||tag==="TEXTAREA"||tag==="SELECT")return;
  const flipped=inPath?S.path.flip:S.cards.flip;
  if((e.key===" "||e.key==="Enter")&&tag!=="BUTTON"&&!flipped){e.preventDefault();if(inPath)S.path.flip=true;else S.cards.flip=true;render();}
  else if(flipped&&"123".includes(e.key)&&e.key){const m={"1":"miss","2":"almost","3":"got"};const b=document.querySelector('[data-act$="rate"][data-v="'+m[e.key]+'"]');if(b)b.click();}
});
render();
</script>

</body></html>
